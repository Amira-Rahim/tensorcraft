<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Tensorcraft</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ===== PAGE-LEVEL COLOR OVERRIDES ===== */
    :root {
      --page-bg: #080B16;
      --page-surface: #0F1320;
      --page-border: rgba(255,255,255,0.06);
      --page-text: #FFFFFF;
      --page-muted: #8B92A5;
      --page-glow: #00D4FF;
    }

    body {
      background: var(--page-bg);
      color: var(--page-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== AUTH LAYOUT ===== */
    .auth {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 80px;
      position: relative;
      background:
        radial-gradient(ellipse 60% 45% at 50% 45%, rgba(0,212,255,0.07), transparent 60%),
        radial-gradient(ellipse 35% 25% at 50% 40%, rgba(0,212,255,0.05), transparent 50%),
        radial-gradient(ellipse 80% 50% at 50% 60%, rgba(123,104,238,0.03), transparent 60%),
        var(--page-bg);
    }

    /* ===== AUTH CARD ===== */
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--page-surface);
      border: 1px solid var(--page-border);
      border-radius: 16px;
      padding: 48px 40px 40px;
      position: relative;
      z-index: 1;
    }

    /* ===== LOGO + HEADING ===== */
    .auth-card__logo {
      font-size: 18px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.02em;
      text-align: center;
      margin-bottom: 8px;
    }

    .auth-card__heading {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      margin-bottom: 36px;
      line-height: 1.3;
    }

    /* ===== OAUTH BUTTONS ===== */
    .auth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 52px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: #FFFFFF;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      font-family: 'Inter', system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .auth-btn:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.2);
    }

    .auth-btn + .auth-btn {
      margin-top: 12px;
    }

    .auth-btn svg {
      flex-shrink: 0;
    }

    /* ===== OR DIVIDER ===== */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
    }

    .auth-divider__line {
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }

    .auth-divider__text {
      font-size: 13px;
      color: var(--page-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    /* ===== EMAIL FORM ===== */
    .auth-email {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-email__input {
      width: 100%;
      height: 52px;
      padding: 0 20px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
      color: #FFFFFF;
      font-size: 15px;
      font-family: 'Inter', system-ui, sans-serif;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .auth-email__input::placeholder {
      color: rgba(139,146,165,0.6);
    }

    .auth-email__input:focus {
      border-color: rgba(0,212,255,0.3);
      background: rgba(0,212,255,0.03);
    }

    .auth-email__submit {
      width: 100%;
      height: 52px;
      border: 1px solid rgba(0,212,255,0.3);
      background: rgba(0,212,255,0.08);
      color: #FFFFFF;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      font-family: 'Inter', system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .auth-email__submit:hover {
      background: rgba(0,212,255,0.15);
      border-color: rgba(0,212,255,0.5);
    }

    /* ===== FOOTER TEXT ===== */
    .auth-card__guest {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
      color: var(--page-muted);
      line-height: 1.6;
    }

    .auth-card__guest a {
      color: #FFFFFF;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(255,255,255,0.25);
      transition: text-decoration-color 0.2s ease;
    }

    .auth-card__guest a:hover {
      text-decoration-color: rgba(255,255,255,0.6);
    }

    .auth-card__terms {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: rgba(139,146,165,0.6);
      line-height: 1.6;
    }

    .auth-card__terms a {
      color: var(--page-muted);
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-color: rgba(139,146,165,0.3);
      transition: color 0.2s ease;
    }

    .auth-card__terms a:hover {
      color: #FFFFFF;
    }

    /* ===== SITE FOOTER ===== */
    .site-footer {
      border-top: 1px solid var(--page-border);
      padding: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: var(--page-muted);
    }

    .site-footer__logo {
      font-size: 16px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.02em;
    }

    .site-footer__links {
      display: flex;
      gap: 24px;
    }

    .site-footer__links a {
      color: var(--page-muted);
      transition: color 0.2s ease;
    }

    .site-footer__links a:hover {
      color: #FFFFFF;
    }

    @media (max-width: 640px) {
      .site-footer {
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .auth {
        padding: 40px 16px 60px;
      }

      .auth-card {
        padding: 36px 24px 32px;
        border-radius: 14px;
      }

      .auth-card__heading {
        font-size: 20px;
        margin-bottom: 28px;
      }
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-card {
      animation: fade-up 0.5s ease both;
    }
  </style>
</head>
<body>

  <!-- Auth -->
  <main class="auth">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-card__logo">&#9671; tensorcraft</div>

      <!-- Heading -->
      <h1 class="auth-card__heading">Sign in to Tensorcraft</h1>

      <!-- GitHub OAuth -->
      <button class="auth-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        Continue with GitHub
      </button>

      <!-- Google OAuth -->
      <button class="auth-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11.96 11.96 0 001 12c0 1.94.46 3.77 1.18 5.07l3.66-2.98z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Divider -->
      <div class="auth-divider">
        <div class="auth-divider__line"></div>
        <span class="auth-divider__text">or</span>
        <div class="auth-divider__line"></div>
      </div>

      <!-- Email Magic Link -->
      <form class="auth-email" onsubmit="return false;">
        <input
          type="email"
          class="auth-email__input"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
        <button type="submit" class="auth-email__submit">Send magic link</button>
      </form>

      <!-- Guest Link -->
      <div class="auth-card__guest">
        New to Tensorcraft? <a href="module-overview.html">Start with Module 1</a> — no account needed.
      </div>

      <!-- Terms -->
      <div class="auth-card__terms">
        By signing in, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="site-footer__logo">&#9671; tensorcraft</div>
    <div class="site-footer__links">
      <a href="landing.html">Home</a>
      <a href="#">Docs</a>
      <a href="#">Community</a>
      <a href="#">Twitter</a>
    </div>
    <div>&copy; 2024 Tensorcraft. All rights reserved.</div>
  </footer>

</body>
</html>
