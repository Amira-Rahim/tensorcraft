# Local review only. scripts/review.mjs copies this into .review/supabase.
# Generated against Supabase CLI 2.117.0. No hosted project credentials.
project_id = "tensorcraft-local-review"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.pooler]
enabled = false
port = 56329

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 56324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/**"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
