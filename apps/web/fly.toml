app = "tensorcraft-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 2

[[statics]]
  guest_path = "/app/apps/web/.next/static"
  url_prefix = "/_next/static"
