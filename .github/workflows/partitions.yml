# Scheduled partition maintenance (fresh-eyes rerun T2-27).
#
# skill_events is month-partitioned and migration 013 pre-created partitions only
# through 2027-04-01. `ensure_skill_events_partitions()` exists precisely to
# extend them - and had ZERO callers, so inserts would start failing at the
# partition cliff with nobody watching. Monthly is plenty: each run keeps a
# rolling window of future partitions.
#
# The RPC is service-role-only (migration 039), so this calls PostgREST with
# the service key. Requires the same two repo secrets as the migrations job.
name: DB partition maintenance

on:
  schedule:
    # 03:17 UTC on the 1st of every month (odd minute to avoid the top-of-
    # hour scheduler crunch).
    - cron: "17 3 1 * *"
  workflow_dispatch:

jobs:
  extend-partitions:
    name: ensure_skill_events_partitions()
    runs-on: ubuntu-latest
    steps:
      - name: Call the partition RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing Supabase secrets - failing loud (never a silent green)."
            exit 2
          fi
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ensure_skill_events_partitions" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          cat /tmp/resp.txt
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Partition RPC failed with HTTP $code"
            exit 1
          fi

      # Dead-man's-switch. Everything above fails LOUDLY, but a job that never
      # STARTS says nothing at all, and that is the failure mode with a date
      # attached: partitions exist only to 2027-04-01.
      #
      # Two ways this job silently stops. GitHub disables scheduled workflows
      # after 60 days of repository inactivity, which is entirely plausible for
      # a solo project between pushes. And on 2026-08-24 a run was refused
      # outright with "the job was not started because recent account payments
      # have failed or your spending limit needs to be increased" - a billing
      # condition, nothing to do with the code, and nobody noticed.
      #
      # Pinging only on success is the point: no ping means the external
      # monitor alerts, whether the job failed, was disabled, or was never
      # allowed to start. Provider-agnostic on purpose (BetterStack Heartbeats,
      # Sentry Crons and healthchecks.io all accept a plain GET).
      - name: Heartbeat (only reached when everything above succeeded)
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL_PARTITIONS }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "::notice::HEARTBEAT_URL_PARTITIONS not set, skipping heartbeat. See docs/observability.md."
            exit 0
          fi
          curl -fsS --max-time 15 --retry 3 "$HEARTBEAT_URL" > /dev/null \
            && echo "heartbeat sent" \
            || echo "::warning::heartbeat ping failed; the job itself succeeded"
