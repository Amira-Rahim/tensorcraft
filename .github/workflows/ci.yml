name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Surfaces the NEXT CVE instead of relying on someone remembering to
      # run it (full-audit §4: "pnpm audit is not a CI step"). Prod deps
      # only; moderate floor keeps dev-chain noise out of the signal.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build content
        run: pnpm turbo build:content

      - name: Build all
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Validate exercises (starter compiles + solution passes + starter must NOT pass)
        run: node scripts/validate-exercises.mjs --starters

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/test-results/
            **/coverage/
          retention-days: 7

      - name: Test summary
        if: always()
        run: echo "## Test Results" >> $GITHUB_STEP_SUMMARY && echo "Tests completed. Check artifacts for details on any failures." >> $GITHUB_STEP_SUMMARY

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # webkit is REQUIRED, not optional: the mobile-iphone-se and
      # tablet-ipad Playwright projects are WebKit-engined. Installing only
      # chromium meant the mobile e2e gate failed with "Executable doesn't
      # exist" on every browser-cache miss and otherwise rode a stale
      # restore-key cache (R3-9).
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      # Placeholder Supabase values, e2e only: the playwright webServer is
      # `next dev`, whose boot assertion (apps/web/lib/env.ts) requires the
      # two NEXT_PUBLIC_SUPABASE vars in every environment. Every spec runs
      # as a guest, so an unreachable Supabase host degrades to signed-out
      # and the suite passes without secrets (verified 2026-08-14; keeps
      # fork PRs runnable). Deliberately NOT job-level: the build step runs
      # env-less on purpose, as a regression test for building without
      # runtime secrets.
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_placeholder_anon_key

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  exercise-runtime:
    name: Exercise corpus through the shipped runtime
    runs-on: ubuntu-latest
    # The corpus gate was written but never wired: `describe.runIf(
    # process.env.EXERCISE_CORPUS === "1")` had ZERO hits in .github/, so
    # the runtime that grades every paid exercise had no CI coverage at all
    # (fresh-eyes rerun §6, T1-18).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build content
        run: pnpm turbo build:content

      - name: Run corpus through the shipped runtime
        env:
          EXERCISE_CORPUS: "1"
        run: pnpm vitest run packages/ui/src/mdx/exercise-corpus.test.ts

  migrations:
    name: Migration ledger drift check
    runs-on: ubuntu-latest
    # ALWAYS runs, and HARD-FAILS until SUPABASE_URL +
    # SUPABASE_SERVICE_ROLE_KEY exist as repo secrets (the script exits 2
    # under CI when they are missing — fail-closed by design, never a
    # silent green; R3-9). Fork PRs have no secrets and will always fail
    # this job. Pending migrations exit 1 and fail the job, surfacing
    # "code assumes a schema production doesn't have yet" before deploy —
    # exactly the 047 class of failure (R3-2).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration ledger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm migrate:status

  links:
    name: Broken-link check (docs + markdown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lychee scans every .md file in the repo. Internal dead links fail the
      # job; external 4xx/5xx responses are reported as warnings only via the
      # accept + skip config in .lychee.toml. Runs as a GitHub Action so we do
      # not add a devDependency for it.
      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            --verbose
            './**/*.md'
          fail: true
          jobSummary: true
