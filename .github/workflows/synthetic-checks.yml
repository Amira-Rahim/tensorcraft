# Synthetic checks against PRODUCTION.
#
# Deliberately NOT an uptime monitor. This repo is private, so Actions minutes
# are capped at 2000/month and CI already spends ~20 per push; a 15-minute
# uptime cron would cost 2880/month by itself, because every run bills at a
# one-minute minimum. Uptime belongs on a free external monitor that polls from
# outside our infrastructure anyway (see docs/observability.md).
#
# What this covers instead: BEHAVIOURAL invariants that only change when we
# deploy, checked a few times a day. These are the things a pure ping cannot
# see, such as the EU/UK geo-gate quietly ceasing to gate.
#
# A failure fails the job, and GitHub emails the person who last touched this
# file. That is the notification channel.
name: Synthetic checks

on:
  schedule:
    # Every 6 hours: ~120 runs/month, a rounding error against the quota.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  probe:
    name: Production invariants
    runs-on: ubuntu-latest
    steps:
      # Only the "main has been deployed" step needs the repo, but a checkout
      # is cheap and keeps that step honest: without it `git rev-parse` has
      # nothing to read and the check silently compares against an empty
      # string. fetch-depth 0 so `git rev-list` can count the gap.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: API readiness (includes a real database check)
        run: |
          body=$(curl -sS --max-time 20 -w "\n%{http_code}" https://api.tensorcraft.app/api/health/ready)
          code=$(echo "$body" | tail -n1)
          json=$(echo "$body" | sed '$d')
          echo "$json"
          test "$code" = "200" || { echo "::error::readiness returned $code"; exit 1; }
          echo "$json" | grep -q '"db":"ok"' || { echo "::error::readiness reachable but the database check is not ok"; exit 1; }

      - name: Web is serving
        run: |
          for path in "/" "/pricing" "/terms"; do
            code=$(curl -sS -o /dev/null --max-time 25 -w "%{http_code}" "https://tensorcraft.app$path")
            echo "$path -> $code"
            test "$code" = "200" || { echo "::error::$path returned $code"; exit 1; }
          done

      # The check a ping cannot make. Selling into the EU or UK before the
      # entity exists creates VAT liability from the first sale that cannot be
      # unwound, so a silently-broken gate is expensive and invisible.
      #
      # Probed at the Fly ORIGIN, not through the edge: Cloudflare overwrites
      # CF-IPCountry, so a spoofed header never reaches the app through
      # api.tensorcraft.app. A 403 here means the gate logic is live.
      # No Stripe session is created when it blocks.
      - name: EU/UK checkout gate still refuses
        run: |
          for country in DE GB FR; do
            code=$(curl -sS -o /dev/null --max-time 25 -w "%{http_code}" \
              -X POST https://tensorcraft-api.fly.dev/api/payments/guest-checkout \
              -H 'Content-Type: application/json' \
              -H "CF-IPCountry: $country" \
              -d '{"planId":"single","worldIds":["deep-orbit"]}')
            echo "$country -> $code"
            test "$code" = "403" || { echo "::error::geo-gate did not block $country (got $code). EU/UK buyers may be able to purchase."; exit 1; }
          done

      # Does anon actually get nothing? RLS is declared in migrations and
      # verified by unit tests against mocks, neither of which proves the LIVE
      # policy holds. A regression here is a data breach that no error rate or
      # uptime check would ever show, because every request succeeds.
      #
      # The anon key is public by design (it ships in the browser bundle), so
      # holding it as a repo secret adds no exposure. Warns rather than fails
      # when unset: unlike the digest this is a supplementary check, and a red
      # run for a missing optional secret trains you to ignore red.
      - name: RLS still denies anonymous reads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::NEXT_PUBLIC_SUPABASE_ANON_KEY not set, skipping the RLS probe. See docs/observability.md."
            exit 0
          fi
          fail=0
          for table in profiles purchases world_progress skill_events waitlist; do
            body=$(curl -sS --max-time 20 \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=5" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY")
            # A correct policy returns an empty array to an anonymous caller.
            # Anything with an id in it means anon can read other people's rows.
            if echo "$body" | grep -q '"id"'; then
              echo "::error::RLS REGRESSION: anon read rows from $table"
              fail=1
            else
              echo "$table -> denied"
            fi
          done
          test "$fail" = "0" || exit 1

      # Has main actually shipped? On 2026-08-22/23 a misconfigured Vercel
      # ignoreCommand cancelled every deploy for two days and the dashboard
      # filtered the cancelled rows out of view, so main drifted ahead of
      # production silently. Nothing in the stack notices that: the site is up,
      # healthy and serving old code.
      - name: main has been deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(git rev-parse HEAD 2>/dev/null || echo "")
          deployed=$(gh run list --workflow=deploy-api.yml --branch=main \
            --status=success --limit=1 --json headSha -q '.[0].headSha' 2>/dev/null || echo "")
          echo "main:     ${head_sha:0:8}"
          echo "deployed: ${deployed:0:8}"
          if [ -z "$deployed" ]; then
            echo "::warning::no successful API deploy found to compare against."
            exit 0
          fi
          if [ "$head_sha" != "$deployed" ]; then
            behind=$(git rev-list --count "$deployed".."$head_sha" 2>/dev/null || echo "?")
            echo "::warning::production API is $behind commit(s) behind main. Expected right after a merge; investigate if it persists."
          else
            echo "API is running current main."
          fi
