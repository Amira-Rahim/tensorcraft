solutionCode: |
  interface IncidentResponse {
    action: 'monitor' | 'rollback' | 'retrain';
    details: string;
  }

  function handleDriftIncident(
    currentAccuracy: number,
    baselineAccuracy: number,
    availableRollbackVersion: string | null,
  ): IncidentResponse {
    const drop = baselineAccuracy - currentAccuracy;
    if (drop <= 0.03) {
      return { action: 'monitor', details: 'Within tolerance' };
    }
    if (availableRollbackVersion) {
      return { action: 'rollback', details: `Rolling back to ${availableRollbackVersion}` };
    }
    return { action: 'retrain', details: 'No rollback available, triggering retrain' };
  }
testCode: |
  describe('handleDriftIncident', () => {
    it('monitors when drop is small', () => {
      const result = handleDriftIncident(0.94, 0.96, 'v1.0');
      expect(result.action).toBe('monitor');
    });
    it('rolls back when drop is large and rollback available', () => {
      const result = handleDriftIncident(0.89, 0.96, 'v1.0');
      expect(result.action).toBe('rollback');
      expect(result.details).toContain('v1.0');
    });
    it('retrains when no rollback available', () => {
      const result = handleDriftIncident(0.89, 0.96, null);
      expect(result.action).toBe('retrain');
    });
  });
estimatedMinutes: 10
difficulty: intermediate
