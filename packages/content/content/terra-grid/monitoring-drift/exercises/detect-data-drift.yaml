title: "Detect Data Drift"
instructions: "Write a function detectDrift that takes baselineMean (number), baselineStd (number), and currentValues (number[]). Compute the current mean, then calculate the z-score of the shift: abs(currentMean - baselineMean) / baselineStd. Return { drifting: true, shiftScore } if shiftScore > 2.0, otherwise { drifting: false, shiftScore }."
