solutionCode: |
  interface ModelDriftResult {
    drifting: boolean;
    currentAccuracy: number;
    drop: number;
  }

  function detectModelDrift(
    baselineAccuracy: number,
    predictions: { predicted: number; actual: number }[],
  ): ModelDriftResult {
    if (predictions.length === 0) {
      return { drifting: false, currentAccuracy: baselineAccuracy, drop: 0 };
    }
    const correct = predictions.filter(p => p.predicted === p.actual).length;
    const currentAccuracy = correct / predictions.length;
    const drop = baselineAccuracy - currentAccuracy;
    return {
      drifting: drop > 0.03,
      currentAccuracy,
      drop,
    };
  }
testCode: |
  describe('detectModelDrift', () => {
    it('detects drift when accuracy drops', () => {
      const preds = [
        { predicted: 1, actual: 1 },
        { predicted: 0, actual: 1 },
        { predicted: 1, actual: 1 },
        { predicted: 0, actual: 1 },
        { predicted: 1, actual: 0 },
      ];
      const result = detectModelDrift(0.96, preds);
      expect(result.drifting).toBe(true);
      expect(result.currentAccuracy).toBeCloseTo(0.4, 1);
    });
    it('no drift when accuracy is stable', () => {
      const preds = [
        { predicted: 1, actual: 1 },
        { predicted: 0, actual: 0 },
        { predicted: 1, actual: 1 },
      ];
      const result = detectModelDrift(0.96, preds);
      expect(result.drifting).toBe(false);
    });
    it('handles empty predictions', () => {
      const result = detectModelDrift(0.96, []);
      expect(result.drifting).toBe(false);
    });
  });
estimatedMinutes: 10
difficulty: intermediate
