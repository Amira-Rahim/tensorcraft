title: "Detect Model Drift"
instructions: "Write a function detectModelDrift that takes baselineAccuracy (number) and predictions (array of { predicted: number; actual: number }). Compute current accuracy as the fraction of predictions where predicted === actual. Return { drifting: true, currentAccuracy, drop } if the accuracy drop exceeds 0.03 (3%), otherwise { drifting: false, currentAccuracy, drop }."
