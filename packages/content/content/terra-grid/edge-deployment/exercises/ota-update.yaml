  ): Promise<UpdateResult> {
    // Your code here
    return { success: false };
  }
solutionCode: |
  interface UpdateResult {
    success: boolean;
    version?: string;
    reason?: string;
  }

  async function performUpdate(
    currentVersion: string,
    newVersion: string,
    newChecksum: string,
  ): Promise<UpdateResult> {
    if (currentVersion === newVersion) {
      return { success: false, reason: 'same version' };
    }
    if (!newChecksum.startsWith('v')) {
      return { success: false, reason: 'checksum mismatch' };
    }
    return { success: true, version: newVersion };
  }
testCode: |
  describe('performUpdate', () => {
    it('rejects same version', async () => {
      const result = await performUpdate('1.0.0', '1.0.0', 'valid');
      expect(result.success).toBe(false);
      expect(result.reason).toBe('same version');
    });
    it('rejects invalid checksum', async () => {
      const result = await performUpdate('1.0.0', '2.0.0', 'invalid');
      expect(result.success).toBe(false);
      expect(result.reason).toBe('checksum mismatch');
    });
    it('accepts valid update', async () => {
      const result = await performUpdate('1.0.0', '2.0.0', 'v2hash');
      expect(result.success).toBe(true);
      expect(result.version).toBe('2.0.0');
    });
  });
estimatedMinutes: 10
difficulty: intermediate
