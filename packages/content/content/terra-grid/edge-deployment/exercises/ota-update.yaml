title: "OTA Model Update"
instructions: "Write an async function performUpdate that takes currentVersion (string), newVersion (string), and newChecksum (string). It should: 1) return { success: false, reason: 'same version' } if versions match, 2) return { success: false, reason: 'checksum mismatch' } if newChecksum does not start with 'v', 3) return { success: true, version: newVersion } otherwise."
starterCode: |
