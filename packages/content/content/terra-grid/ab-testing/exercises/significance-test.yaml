title: "Statistical Significance Test"
instructions: "Implement a twoProportionZTest function that compares accuracy rates between a control and treatment group. Calculate the pooled proportion, standard error, z-score, and determine if the result is statistically significant at the given alpha level."
starterCode: |
  interface ABResult {
    total: number;
    successes: number;
  }

  interface SignificanceResult {
    zScore: number;
    isSignificant: boolean;
    controlRate: number;
    treatmentRate: number;
  }

  function twoProportionZTest(
    control: ABResult,
    treatment: ABResult,
    alpha: number = 0.05
  ): SignificanceResult {
    // 1. Calculate rates: successes / total
    // 2. Pooled proportion: (controlSuccesses + treatmentSuccesses) / (controlTotal + treatmentTotal)
    // 3. Standard error: sqrt(pooled * (1-pooled) * (1/controlTotal + 1/treatmentTotal))
    // 4. Z-score: (treatmentRate - controlRate) / standardError
    // 5. Significant if |zScore| > 1.96 (for alpha = 0.05)
    return { zScore: 0, isSignificant: false, controlRate: 0, treatmentRate: 0 }; // your code here
  }
solutionCode: |
  interface ABResult {
    total: number;
    successes: number;
  }

  interface SignificanceResult {
    zScore: number;
    isSignificant: boolean;
    controlRate: number;
    treatmentRate: number;
  }

  function twoProportionZTest(
    control: ABResult,
    treatment: ABResult,
    alpha: number = 0.05
  ): SignificanceResult {
    const controlRate = control.successes / control.total;
    const treatmentRate = treatment.successes / treatment.total;

    const pooled = (control.successes + treatment.successes)
      / (control.total + treatment.total);

    const se = Math.sqrt(
      pooled * (1 - pooled) * (1 / control.total + 1 / treatment.total)
    );

    const zScore = (treatmentRate - controlRate) / se;

    // z-critical for common alpha values
    const zCritical = alpha <= 0.01 ? 2.576 : alpha <= 0.05 ? 1.96 : 1.645;
    const isSignificant = Math.abs(zScore) > zCritical;

    return { zScore, isSignificant, controlRate, treatmentRate };
  }
testCode: |
  describe('twoProportionZTest', () => {
    it('detects significant difference with large samples', () => {
      const result = twoProportionZTest(
        { total: 5000, successes: 4500 },  // 90%
        { total: 5000, successes: 4750 },  // 95%
        0.05
      );
      expect(result.isSignificant).toBe(true);
      expect(result.zScore).toBeGreaterThan(1.96);
    });

    it('detects non-significant difference with small samples', () => {
      const result = twoProportionZTest(
        { total: 20, successes: 18 },  // 90%
        { total: 20, successes: 19 },  // 95%
        0.05
      );
      expect(result.isSignificant).toBe(false);
    });

    it('calculates rates correctly', () => {
      const result = twoProportionZTest(
        { total: 100, successes: 80 },
        { total: 100, successes: 90 },
      );
      expect(result.controlRate).toBeCloseTo(0.8);
      expect(result.treatmentRate).toBeCloseTo(0.9);
    });

    it('returns negative z-score when treatment is worse', () => {
      const result = twoProportionZTest(
        { total: 5000, successes: 4750 },  // 95%
        { total: 5000, successes: 4500 },  // 90%
      );
      expect(result.zScore).toBeLessThan(0);
    });
  });
