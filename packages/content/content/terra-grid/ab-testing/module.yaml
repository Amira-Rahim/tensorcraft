slug: ab-testing
title: "A/B Testing Models"
worldId: terra-grid
order: 9
description: |
  Hassan's rule: no model goes to 100% of devices without proof it's better.
  After a 2024 drift incident cost $4.2 million, Terra Grid put every model
  update through an A/B test. You start where you already live, routing a
  slice of traffic behind a flag, then add what comparing two models needs on
  top: significance tests, canary health gates, and bandits that reallocate
  traffic on their own.
lessonCount: 5
prerequisites:
  - federated-learning
track: specialization
