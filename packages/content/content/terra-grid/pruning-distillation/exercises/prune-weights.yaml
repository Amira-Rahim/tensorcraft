title: "Prune Weights by Magnitude"
instructions: "Write a function pruneByMagnitude(weights, threshold) that returns a new array where any weight with Math.abs(weight) < threshold is set to 0. Also write sparsity(weights) that returns the fraction of zero values."
starterCode: "function pruneByMagnitude(weights, threshold) {\n  // Set weights below threshold to 0\n  return null; // your code here\n}\n\nfunction sparsity(weights) {\n  // Return fraction of zero values\n  return null; // your code here\n}"
solutionCode: "function pruneByMagnitude(weights, threshold) {\n  return weights.map(w => Math.abs(w) < threshold ? 0 : w);\n}\n\nfunction sparsity(weights) {\n  return weights.filter(w => w === 0).length / weights.length;\n}"
testCode: "describe('Pruning', () => { const w = [0.9, -0.01, 0.003, -0.8, 0.05]; const pruned = pruneByMagnitude(w, 0.1); it('keeps large weights', () => { expect(pruned[0]).toBe(0.9); expect(pruned[3]).toBe(-0.8); }); it('zeros small weights', () => { expect(pruned[1]).toBe(0); expect(pruned[2]).toBe(0); expect(pruned[4]).toBe(0); }); it('calculates sparsity', () => { expect(sparsity(pruned)).toBeCloseTo(0.6); }); });"
