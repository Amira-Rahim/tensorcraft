slug: structured-prune
lessonSlug: structured-pruning
title: "Neuron-Wise L1 Score with tf.norm"
mlContent: data
instructions: "Build `neuronScore(weights)` that takes an array of incoming weights for one neuron and returns the L1 norm (sum of absolute values) as a number. Use tf.tensor1d.abs().sum().dataSync()[0]."
starterCode: |
  function neuronScore(weights) {
    return 0;
  }
solutionCode: |
  function neuronScore(weights) {
    return tf.tensor1d(weights).abs().sum().dataSync()[0];
  }
testCode: |
  describe('neuronScore (tf abs + sum)', () => {
    it('sums positive weights', () => {
      expect(neuronScore([1, 2, 3])).toBeCloseTo(6, 4);
    });
    it('uses absolute values', () => {
      expect(neuronScore([-1, -2, 3])).toBeCloseTo(6, 4);
    });
    it('zero for empty-magnitude vector', () => {
      expect(neuronScore([0, 0, 0])).toBeCloseTo(0, 4);
    });
  });
estimatedMinutes: 8
difficulty: intermediate
