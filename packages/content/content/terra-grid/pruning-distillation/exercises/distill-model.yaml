slug: distill-model
lessonSlug: knowledge-distillation
title: "Temperature-Scaled Softmax for Distillation"
mlContent: data
instructions: "Build `softmax(logits, temperature)` returning a number array. Wrap logits as tf.tensor1d, divide by temperature, and use tf.softmax. Read back with arraySync()."
starterCode: |
  function softmax(logits, temperature) {
    return [];
  }
solutionCode: |
  function softmax(logits, temperature) {
    return tf.tensor1d(logits).div(temperature).softmax().arraySync();
  }
testCode: |
  describe('temperature softmax (tf.softmax)', () => {
    it('sums to 1', () => {
      const p = softmax([2, 1, 0.5], 1);
      const s = p[0] + p[1] + p[2];
      expect(s).toBeCloseTo(1, 4);
    });
    it('low temperature concentrates probability', () => {
      const p = softmax([2, 1, 0.5], 0.1);
      expect(p[0]).toBeGreaterThan(0.99);
    });
    it('high temperature flattens probability', () => {
      const p = softmax([2, 1, 0.5], 10);
      expect(p[0]).toBeLessThan(0.4);
      expect(p[2]).toBeGreaterThan(0.25);
    });
  });
estimatedMinutes: 10
difficulty: intermediate
