slug: combined-optimize
lessonSlug: combined-optimization
title: "Calculate Combined Optimization"
instructions: "Write a function combinedReduction(originalMB, distillRatio, pruneRatio, quantizeRatio) that applies each ratio sequentially and returns the final size in MB. distillRatio=0.1 means 10x smaller, pruneRatio=0.5 means 2x smaller, quantizeRatio=0.25 means 4x smaller."
starterCode: "function combinedReduction(originalMB, distillRatio, pruneRatio, quantizeRatio) {\n  // Apply each ratio sequentially\n  return null; // your code here\n}\n\nfunction totalReductionFactor(originalMB, finalMB) {\n  return null; // your code here\n}"
solutionCode: "function combinedReduction(originalMB, distillRatio, pruneRatio, quantizeRatio) {\n  return originalMB * distillRatio * pruneRatio * quantizeRatio;\n}\n\nfunction totalReductionFactor(originalMB, finalMB) {\n  return originalMB / finalMB;\n}"
testCode: "describe('Combined', () => { it('calculates compound reduction', () => { expect(combinedReduction(200, 0.1, 0.5, 0.25)).toBeCloseTo(2.5); }); it('calculates reduction factor', () => { expect(totalReductionFactor(200, 2.5)).toBeCloseTo(80); }); it('handles different ratios', () => { expect(combinedReduction(100, 0.2, 0.5, 0.25)).toBeCloseTo(2.5); }); });"
