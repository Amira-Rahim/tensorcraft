slug: private-training
lessonSlug: privacy-preservation
title: "Clip a Contribution and Add Noise"
instructions: |
  Implement `clipAndNoise(gradients, clipNorm, noiseSigma, standardNormal)`.
  `gradients` is an array of finite numbers. `clipNorm` is positive and finite;
  `noiseSigma` is finite and nonnegative. `standardNormal()` supplies one draw
  from a standard normal distribution; the tests supply fixed draws so the
  arithmetic can be checked exactly.

  Compute the vector's L2 norm. If it exceeds `clipNorm`, scale every coordinate
  by `clipNorm / norm`. Then add `noiseSigma * standardNormal()` to each
  coordinate, calling the supplied function once per coordinate. Return a new
  array and leave the input unchanged. A zero vector stays zero before noise.

  This exercise covers clipping and noise addition only. It does not implement
  a privacy accountant, a random-number generator, or a complete DP-SGD system.
  The caller must separately justify the noise scale and protected contribution.
starterCode: |
  function clipAndNoise(gradients, clipNorm, noiseSigma, standardNormal) {
    // Clip the vector, then add one supplied noise draw per coordinate.
    return [];
  }
solutionCode: |
  function clipAndNoise(gradients, clipNorm, noiseSigma, standardNormal) {
    const norm = Math.sqrt(gradients.reduce((sum, g) => sum + g * g, 0));
    const factor = norm === 0 ? 1 : Math.min(1, clipNorm / norm);
    return gradients.map(g => g * factor + noiseSigma * standardNormal());
  }
testCode: |
  describe('clipAndNoise', () => {
    it('clips the whole vector while preserving its direction', () => {
      const result = clipAndNoise([3, 4], 1, 0, () => 0);
      expect(result[0]).toBeCloseTo(0.6, 6);
      expect(result[1]).toBeCloseTo(0.8, 6);
    });
    it('leaves a short vector unchanged before adding noise', () => {
      expect(clipAndNoise([0.1, -0.2], 1, 0, () => 0)).toEqual([0.1, -0.2]);
    });
    it('adds supplied draws after clipping, even when the final norm exceeds the bound', () => {
      const draws = [2, -3];
      let calls = 0;
      const result = clipAndNoise([3, 4], 1, 0.5, () => draws[calls++]);
      expect(result[0]).toBeCloseTo(1.6, 6);
      expect(result[1]).toBeCloseTo(-0.7, 6);
      expect(calls).toBe(2);
    });
    it('handles a zero vector and does not mutate its input', () => {
      const input = [0, 0];
      expect(clipAndNoise(input, 1, 0.5, () => 1)).toEqual([0.5, 0.5]);
      expect(input).toEqual([0, 0]);
      const nonzero = [6, 8];
      clipAndNoise(nonzero, 2, 0, () => 0);
      expect(nonzero).toEqual([6, 8]);
    });
  });
estimatedMinutes: 12
difficulty: intermediate
mlContent: arithmetic
