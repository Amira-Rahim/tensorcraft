title: "Compress Gradient Updates"
instructions: "Write a function topKSparsify that takes a gradients array (number[]) and a k (number of top values to keep). Return an object with indices (number[], the indices of the k largest values by absolute magnitude) and values (number[], the gradient values at those indices), sorted by descending absolute magnitude."
starterCode: |
  interface SparseUpdate {
    indices: number[];
    values: number[];
  }

  function topKSparsify(gradients: number[], k: number): SparseUpdate {
    // Your code here
    return { indices: [], values: [] };
  }
solutionCode: |
  interface SparseUpdate {
    indices: number[];
    values: number[];
  }

  function topKSparsify(gradients: number[], k: number): SparseUpdate {
    const indexed = gradients.map((v, i) => ({ v, i, abs: Math.abs(v) }));
    indexed.sort((a, b) => b.abs - a.abs);
    const topK = indexed.slice(0, k);
    return {
      indices: topK.map(x => x.i),
      values: topK.map(x => x.v),
    };
  }
testCode: |
  describe('topKSparsify', () => {
    it('returns top K values by magnitude', () => {
      const result = topKSparsify([0.1, -0.5, 0.3, -0.9, 0.2], 2);
      expect(result.indices.length).toBe(2);
      expect(result.values.length).toBe(2);
      expect(result.indices).toContain(3);
      expect(result.indices).toContain(1);
    });
    it('preserves original values including sign', () => {
      const result = topKSparsify([0.1, -0.9, 0.5], 1);
      expect(result.values[0]).toBe(-0.9);
    });
    it('handles k equal to array length', () => {
      const result = topKSparsify([1, 2, 3], 3);
      expect(result.indices.length).toBe(3);
    });
    it('sorts by descending absolute magnitude', () => {
      const result = topKSparsify([0.1, -0.5, 0.3], 3);
      expect(Math.abs(result.values[0])).toBeGreaterThanOrEqual(Math.abs(result.values[1]));
    });
  });
