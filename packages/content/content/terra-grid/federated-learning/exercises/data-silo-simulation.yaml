solutionCode: |
  interface Silo {
    org: string;
    dataSize: number;
  }

  interface Strategy {
    totalData: number;
    participants: number;
    approach: 'centralized' | 'federated';
  }

  function federatedStrategy(silos: Silo[]): Strategy {
    const totalData = silos.reduce((sum, s) => sum + s.dataSize, 0);
    return {
      totalData,
      participants: silos.length,
      approach: silos.length >= 2 ? 'federated' : 'centralized',
    };
  }
testCode: |
  describe('federatedStrategy', () => {
    it('uses centralized for single silo', () => {
      const result = federatedStrategy([{ org: 'Alpha', dataSize: 1000 }]);
      expect(result.approach).toBe('centralized');
      expect(result.totalData).toBe(1000);
    });
    it('uses federated for multiple silos', () => {
      const result = federatedStrategy([
        { org: 'Alpha', dataSize: 2400 },
        { org: 'Beta', dataSize: 1800 },
        { org: 'Volta', dataSize: 3100 },
      ]);
      expect(result.approach).toBe('federated');
      expect(result.totalData).toBe(7300);
      expect(result.participants).toBe(3);
    });
  });
