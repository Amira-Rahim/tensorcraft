title: "Validate System Architecture"
instructions: "Build a function validateArchitecture that takes an array of system components and checks: (1) all dependencies reference existing components, (2) no circular dependencies exist, (3) total memory fits within the budget. Return an object with valid (boolean) and issues (string array)."
