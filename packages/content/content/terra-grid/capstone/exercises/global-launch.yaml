solutionCode: |
  interface PreFlightCheck {
    name: string;
    verify: () => boolean;
  }

  interface LaunchMetrics {
    devicesOnline: number;
    devicesUpdated: number;
    accuracy: number;
    latencyMs: number;
  }

  class LaunchController {
    private checks: PreFlightCheck[] = [];

    addCheck(check: PreFlightCheck): void {
      this.checks.push(check);
    }

    preFlight(): { ready: boolean; results: { name: string; passed: boolean }[] } {
      const results = this.checks.map(check => ({
        name: check.name,
        passed: check.verify(),
      }));
      return {
        ready: results.every(r => r.passed),
        results,
      };
    }

    monitorPostLaunch(metrics: LaunchMetrics): {
      status: 'healthy' | 'degraded' | 'critical';
      alerts: string[];
    } {
      const alerts: string[] = [];

      const updateRate = metrics.devicesUpdated / metrics.devicesOnline;
      if (updateRate < 0.95) {
        alerts.push(`Update rate ${(updateRate * 100).toFixed(1)}% below 95%`);
      }
      if (metrics.accuracy < 0.90) {
        alerts.push(`Accuracy ${metrics.accuracy} below 90%`);
      }
      if (metrics.latencyMs > 20) {
        alerts.push(`Latency ${metrics.latencyMs}ms above 20ms`);
      }

      const status = alerts.length === 0 ? 'healthy'
        : alerts.some(a => a.includes('Accuracy')) ? 'critical'
        : 'degraded';

      return { status, alerts };
    }
  }
testCode: |
  describe('LaunchController', () => {
    it('passes pre-flight when all checks pass', () => {
      const controller = new LaunchController();
      controller.addCheck({ name: 'security', verify: () => true });
      controller.addCheck({ name: 'testing', verify: () => true });
      const result = controller.preFlight();
      expect(result.ready).toBe(true);
    });

    it('fails pre-flight when any check fails', () => {
      const controller = new LaunchController();
      controller.addCheck({ name: 'security', verify: () => true });
      controller.addCheck({ name: 'testing', verify: () => false });
      const result = controller.preFlight();
      expect(result.ready).toBe(false);
    });

    it('reports healthy metrics', () => {
      const controller = new LaunchController();
      const result = controller.monitorPostLaunch({
        devicesOnline: 100, devicesUpdated: 98, accuracy: 0.95, latencyMs: 12,
      });
      expect(result.status).toBe('healthy');
      expect(result.alerts.length).toBe(0);
    });

    it('detects critical accuracy drop', () => {
      const controller = new LaunchController();
      const result = controller.monitorPostLaunch({
        devicesOnline: 100, devicesUpdated: 98, accuracy: 0.85, latencyMs: 12,
      });
      expect(result.status).toBe('critical');
    });

    it('detects degraded status on latency spike', () => {
      const controller = new LaunchController();
      const result = controller.monitorPostLaunch({
        devicesOnline: 100, devicesUpdated: 98, accuracy: 0.95, latencyMs: 25,
      });
      expect(result.status).toBe('degraded');
      expect(result.alerts.length).toBeGreaterThan(0);
    });

    it('handles empty pre-flight checks', () => {
      const controller = new LaunchController();
      const result = controller.preFlight();
      expect(result.ready).toBe(true);
      expect(result.results).toEqual([]);
    });
  });
estimatedMinutes: 10
