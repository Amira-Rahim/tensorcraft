solutionCode: |
  interface Trigger {
    name: string;
    condition: () => boolean;
    cooldownMs: number;
  }

  function evaluateTriggers(
    triggers: Trigger[],
    lastFiredMap: Record<string, number>,
    currentTime: number,
  ): string | null {
    for (const trigger of triggers) {
      const lastFired = lastFiredMap[trigger.name] || 0;
      if (currentTime - lastFired < trigger.cooldownMs) continue;
      if (trigger.condition()) {
        lastFiredMap[trigger.name] = currentTime;
        return trigger.name;
      }
    }
    return null;
  }
testCode: |
  describe('evaluateTriggers', () => {
    it('fires when condition is true and cooldown elapsed', () => {
      const triggers = [{ name: 'drift', condition: () => true, cooldownMs: 1000 }];
      const map = {};
      expect(evaluateTriggers(triggers, map, 5000)).toBe('drift');
    });
    it('respects cooldown', () => {
      const triggers = [{ name: 'drift', condition: () => true, cooldownMs: 1000 }];
      const map = { drift: 4500 };
      expect(evaluateTriggers(triggers, map, 5000)).toBeNull();
    });
    it('returns null when no conditions met', () => {
      const triggers = [{ name: 'drift', condition: () => false, cooldownMs: 1000 }];
      expect(evaluateTriggers(triggers, {}, 5000)).toBeNull();
    });
    it('updates lastFiredMap', () => {
      const triggers = [{ name: 'drift', condition: () => true, cooldownMs: 1000 }];
      const map = {};
      evaluateTriggers(triggers, map, 5000);
      expect(map['drift']).toBe(5000);
    });
  });
