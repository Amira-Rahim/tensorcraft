slug: track-experiment
lessonSlug: experiment-tracking
title: "Track an Experiment"
instructions: "Implement an ExperimentTracker class with: logRun(run: { id: string; accuracy: number; loss: number }) that stores the run, getRuns() that returns all runs, and getBest() that returns the run with highest accuracy (or null if empty)."
starterCode: |
