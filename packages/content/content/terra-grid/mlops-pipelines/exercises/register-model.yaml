slug: register-model
lessonSlug: model-registry
title: "Build a Model Registry"
instructions: "Implement a ModelRegistry class with: register(model: { name: string; version: string; stage: string }) that stores the model, promote(name: string, version: string, newStage: string) that changes the model's stage, and getByStage(name: string, stage: string) that returns the matching model or null."
