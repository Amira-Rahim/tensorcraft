solutionCode: |
  interface Model {
    name: string;
    version: string;
    stage: string;
  }

  class ModelRegistry {
    private models: Model[] = [];

    register(model: Model): void {
      this.models.push(model);
    }

    promote(name: string, version: string, newStage: string): void {
      const model = this.models.find(m => m.name === name && m.version === version);
      if (model) model.stage = newStage;
    }

    getByStage(name: string, stage: string): Model | null {
      return this.models.find(m => m.name === name && m.stage === stage) || null;
    }
  }
testCode: |
  describe('ModelRegistry', () => {
    it('registers a model', () => {
      const reg = new ModelRegistry();
      reg.register({ name: 'tgi', version: '1.0', stage: 'development' });
      expect(reg.getByStage('tgi', 'development')).not.toBeNull();
    });
    it('promotes a model', () => {
      const reg = new ModelRegistry();
      reg.register({ name: 'tgi', version: '1.0', stage: 'development' });
      reg.promote('tgi', '1.0', 'production');
      expect(reg.getByStage('tgi', 'production')!.version).toBe('1.0');
    });
    it('returns null for missing stage', () => {
      const reg = new ModelRegistry();
      reg.register({ name: 'tgi', version: '1.0', stage: 'development' });
      expect(reg.getByStage('tgi', 'production')).toBeNull();
    });
  });
estimatedMinutes: 10
