solutionCode: |
  interface Stage {
    name: string;
    gate: () => boolean;
  }

  interface PipelineResult {
    completed: boolean;
    failedAt: string | null;
  }

  function runPipeline(stages: Stage[]): PipelineResult {
    for (const stage of stages) {
      if (!stage.gate()) {
        return { completed: false, failedAt: stage.name };
      }
    }
    return { completed: true, failedAt: null };
  }
testCode: |
  describe('runPipeline', () => {
    it('completes when all gates pass', () => {
      const stages = [
        { name: 'validate', gate: () => true },
        { name: 'train', gate: () => true },
        { name: 'deploy', gate: () => true },
      ];
      expect(runPipeline(stages)).toEqual({ completed: true, failedAt: null });
    });
    it('stops at first failed gate', () => {
      const stages = [
        { name: 'validate', gate: () => true },
        { name: 'train', gate: () => false },
        { name: 'deploy', gate: () => true },
      ];
      expect(runPipeline(stages)).toEqual({ completed: false, failedAt: 'train' });
    });
    it('handles empty pipeline', () => {
      expect(runPipeline([])).toEqual({ completed: true, failedAt: null });
    });
  });
