slug: qat-training
lessonSlug: quantization-aware-training
title: "Fake Quantization for QAT"
instructions: "Write a function fakeQuantize(value, min, max, levels) that simulates quantization by: clamping value to [min, max], scaling to [0, levels-1], rounding, then scaling back. This simulates quantization noise during training."
starterCode: "function fakeQuantize(value, min, max, levels) {\n  // Clamp, scale to [0, levels-1], round, scale back\n  return null; // your code here\n}"
solutionCode: "function fakeQuantize(value, min, max, levels) {\n  const clamped = Math.max(min, Math.min(max, value));\n  const scale = (max - min) / (levels - 1);\n  const quantized = Math.round((clamped - min) / scale);\n  return quantized * scale + min;\n}"
testCode: "describe('fakeQuantize', () => { it('preserves min', () => { expect(fakeQuantize(-1.0, -1.0, 1.0, 256)).toBeCloseTo(-1.0, 2); }); it('preserves max', () => { expect(fakeQuantize(1.0, -1.0, 1.0, 256)).toBeCloseTo(1.0, 2); }); it('rounds to nearest level', () => { const q = fakeQuantize(0.123, -1.0, 1.0, 256); expect(Math.abs(q - 0.123)).toBeLessThan(0.01); }); it('clamps out of range', () => { expect(fakeQuantize(2.0, -1.0, 1.0, 256)).toBeCloseTo(1.0, 2); }); });"
estimatedMinutes: 15
difficulty: intermediate
