slug: measure-efficiency
lessonSlug: architecture-efficiency
title: "Measure Architecture Efficiency"
instructions: "Build two models: naiveModel() with layers dense(inputShape [128], 256 units, relu) then dense(1 unit, sigmoid), and efficientModel() with dense(inputShape [128], 256 units, relu), dense(16 units, relu), dense(256 units, relu), dense(1 unit, sigmoid). Return { naiveParams, efficientParams } from compareModels()."
starterCode: "function naiveModel() {\n  const model = tf.sequential();\n  // dense: inputShape [128], 256 units, relu\n  // dense: 1 unit, sigmoid\n  return model;\n}\n\nfunction efficientModel() {\n  const model = tf.sequential();\n  // dense: inputShape [128], 256 units, relu\n  // dense: 16 units, relu (bottleneck)\n  // dense: 256 units, relu\n  // dense: 1 unit, sigmoid\n  return model;\n}\n\nfunction compareModels() {\n  return { naiveParams: null, efficientParams: null };\n}"
solutionCode: "function naiveModel() {\n  const model = tf.sequential();\n  model.add(tf.layers.dense({ inputShape: [128], units: 256, activation: 'relu' }));\n  model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));\n  return model;\n}\n\nfunction efficientModel() {\n  const model = tf.sequential();\n  model.add(tf.layers.dense({ inputShape: [128], units: 256, activation: 'relu' }));\n  model.add(tf.layers.dense({ units: 16, activation: 'relu' }));\n  model.add(tf.layers.dense({ units: 256, activation: 'relu' }));\n  model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));\n  return model;\n}\n\nfunction compareModels() {\n  return { naiveParams: naiveModel().countParams(), efficientParams: efficientModel().countParams() };\n}"
testCode: "describe('compareModels', () => { const result = compareModels(); it('naive has more params', () => { expect(result.naiveParams).toBeGreaterThan(result.efficientParams); }); it('efficient uses bottleneck', () => { expect(result.efficientParams).toBeLessThan(40000); }); });"
estimatedMinutes: 15
difficulty: intermediate
