slug: tg-profile-model
lessonSlug: tg-model-profiling
title: "Profile a Model"
instructions: "Write a function profileModel(model) that returns an object with totalParams (from model.countParams()) and totalSizeMB (totalParams * 4 / 1024 / 1024). Use TensorFlow.js model API."
starterCode: "function profileModel(model) {\n  // Return { totalParams, totalSizeMB }\n  return null; // your code here\n}"
solutionCode: "function profileModel(model) {\n  const totalParams = model.countParams();\n  const totalSizeMB = (totalParams * 4) / (1024 * 1024);\n  return { totalParams, totalSizeMB };\n}"
testCode: "describe('profileModel', () => { const m = tf.sequential(); m.add(tf.layers.dense({ inputShape: [4], units: 8 })); m.add(tf.layers.dense({ units: 1 })); const result = profileModel(m); it('reports a positive param count', () => { expect(result.totalParams).toBeGreaterThan(0); }); it('calculates size from params', () => { expect(result.totalSizeMB).toBeCloseTo((result.totalParams * 4) / (1024 * 1024), 6); }); });"
estimatedMinutes: 10
difficulty: intermediate
