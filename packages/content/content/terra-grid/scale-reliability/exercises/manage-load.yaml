solutionCode: |
  type Priority = 'critical' | 'high' | 'normal' | 'low';

  interface QueueItem {
    id: string;
    priority: Priority;
    data: number;
  }

  class PriorityQueue {
    private queues: Map<Priority, QueueItem[]> = new Map([
      ['critical', []], ['high', []], ['normal', []], ['low', []],
    ]);

    private maxSize: number;
    constructor(maxSize: number) { this.maxSize = maxSize; }

    enqueue(item: QueueItem): boolean {
      if (this.size() >= this.maxSize && item.priority === 'low') {
        return false;
      }
      this.queues.get(item.priority)!.push(item);
      return true;
    }

    dequeue(): QueueItem | null {
      for (const priority of ['critical', 'high', 'normal', 'low'] as Priority[]) {
        const queue = this.queues.get(priority)!;
        if (queue.length > 0) return queue.shift()!;
      }
      return null;
    }

    size(): number {
      let total = 0;
      this.queues.forEach(q => total += q.length);
      return total;
    }
  }
testCode: |
  describe('PriorityQueue', () => {
    it('dequeues highest priority first', () => {
      const pq = new PriorityQueue(10);
      pq.enqueue({ id: '1', priority: 'low', data: 1 });
      pq.enqueue({ id: '2', priority: 'critical', data: 2 });
      pq.enqueue({ id: '3', priority: 'normal', data: 3 });
      expect(pq.dequeue()!.id).toBe('2');
      expect(pq.dequeue()!.id).toBe('3');
      expect(pq.dequeue()!.id).toBe('1');
    });

    it('returns null when empty', () => {
      const pq = new PriorityQueue(10);
      expect(pq.dequeue()).toBeNull();
    });

    it('rejects low-priority when full', () => {
      const pq = new PriorityQueue(2);
      pq.enqueue({ id: '1', priority: 'high', data: 1 });
      pq.enqueue({ id: '2', priority: 'high', data: 2 });
      const accepted = pq.enqueue({ id: '3', priority: 'low', data: 3 });
      expect(accepted).toBe(false);
      expect(pq.size()).toBe(2);
    });

    it('accepts high-priority when full', () => {
      const pq = new PriorityQueue(2);
      pq.enqueue({ id: '1', priority: 'low', data: 1 });
      pq.enqueue({ id: '2', priority: 'low', data: 2 });
      const accepted = pq.enqueue({ id: '3', priority: 'critical', data: 3 });
      expect(accepted).toBe(true);
    });

    it('tracks size correctly', () => {
      const pq = new PriorityQueue(10);
      expect(pq.size()).toBe(0);
      pq.enqueue({ id: '1', priority: 'normal', data: 1 });
      pq.enqueue({ id: '2', priority: 'high', data: 2 });
      expect(pq.size()).toBe(2);
      pq.dequeue();
      expect(pq.size()).toBe(1);
    });
  });
