description: |
  GRID simulates simultaneous sensor anomalies across 3 regions and 12,400
  devices. Everything fails eventually, Hassan says. The only question is
  whether it fails well. Scaling strategies, model sharding, failover, load
  management, and global operations are the parts of an ML system that only
  matter on the worst day.
