slug: generate-mask
lessonSlug: mask-generation
title: "Generate Binary Segmentation Mask"
mlContent: data
instructions: "Build `generateMask(probs, threshold)` taking [H, W] probability tensor + threshold, returning a [H, W] int32 mask with values {0, 1}."
starterCode: |
  function generateMask(probs, threshold) {
    return null;
  }
solutionCode: |
  function generateMask(probs, threshold) {
    return tf.greater(probs, tf.scalar(threshold)).cast('int32');
  }
testCode: |
  describe('generateMask (real tf.greater + cast)', () => {
    it('preserves shape', () => {
      const probs = tf.randomUniform([8, 8]);
      const mask = generateMask(probs, 0.5);
      expect(mask.shape).toEqual([8, 8]);
    });
    it('binarizes correctly', () => {
      const probs = tf.tensor2d([[0.1, 0.9], [0.7, 0.3]]);
      const mask = generateMask(probs, 0.5);
      const arr = mask.arraySync();
      expect(arr).toEqual([[0, 1], [1, 0]]);
    });
  });
estimatedMinutes: 8
difficulty: intermediate
skillAxis: data_prep
