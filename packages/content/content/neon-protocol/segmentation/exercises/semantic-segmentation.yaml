slug: semantic-segmentation
lessonSlug: semantic-segmentation
title: "Per-Pixel Class Prediction via argMax"
mlContent: data
instructions: "Build `segmentImage(logits)` taking [H, W, numClasses] logits tensor and returning [H, W] int32 class assignments via argMax along the channel axis."
starterCode: |
  function segmentImage(logits) {
    return null;
  }
solutionCode: |
  function segmentImage(logits) {
    return logits.argMax(-1).cast('int32');
  }
testCode: |
  describe('segmentImage (real tf.argMax)', () => {
    it('reduces channel axis', () => {
      const logits = tf.tensor3d([
        [[10, 0, 0], [0, 10, 0]],
        [[0, 0, 10], [10, 0, 0]]
      ]);
      const seg = segmentImage(logits);
      expect(seg.shape).toEqual([2, 2]);
      const arr = seg.arraySync();
      expect(arr).toEqual([[0, 1], [2, 0]]);
    });
    it('handles 5 classes', () => {
      const logits = tf.randomNormal([4, 4, 5]);
      const seg = segmentImage(logits);
      expect(seg.shape).toEqual([4, 4]);
      const flat = Array.from(seg.dataSync());
      for (const v of flat) {
        expect(v).toBeGreaterThanOrEqual(0);
        expect(v).toBeLessThan(5);
      }
    });
  });
estimatedMinutes: 10
difficulty: intermediate
skillAxis: model_arch
