solutionCode: |
  function segmentationMask(
    logits: number[][][],
    height: number,
    width: number,
    numClasses: number
  ): number[][] {
    const mask: number[][] = [];
    for (let y = 0; y < height; y++) {
      const row: number[] = [];
      for (let x = 0; x < width; x++) {
        let maxIdx = 0;
        let maxVal = logits[y][x][0];
        for (let c = 1; c < numClasses; c++) {
          if (logits[y][x][c] > maxVal) {
            maxVal = logits[y][x][c];
            maxIdx = c;
          }
        }
        row.push(maxIdx);
      }
      mask.push(row);
    }
    return mask;
  }
testCode: |
  describe('segmentationMask', () => {
    it('returns correct class for single pixel', () => {
      const logits = [[[0.1, 0.9, 0.3]]];
      const mask = segmentationMask(logits, 1, 1, 3);
      expect(mask[0][0]).toBe(1);
    });

    it('handles a 2x2 image', () => {
      const logits = [
        [[0.8, 0.1, 0.1], [0.1, 0.7, 0.2]],
        [[0.2, 0.2, 0.6], [0.3, 0.3, 0.4]],
      ];
      const mask = segmentationMask(logits, 2, 2, 3);
      expect(mask[0][0]).toBe(0);
      expect(mask[0][1]).toBe(1);
      expect(mask[1][0]).toBe(2);
      expect(mask[1][1]).toBe(2);
    });

    it('returns 2D array with correct dimensions', () => {
      const logits = [
        [[0.5, 0.5], [0.3, 0.7]],
        [[0.9, 0.1], [0.4, 0.6]],
        [[0.2, 0.8], [0.6, 0.4]],
      ];
      const mask = segmentationMask(logits, 3, 2, 2);
      expect(mask.length).toBe(3);
      expect(mask[0].length).toBe(2);
    });
  });
