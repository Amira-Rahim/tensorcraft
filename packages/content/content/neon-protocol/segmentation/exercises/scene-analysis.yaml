title: "Analyze Scene Adjacency"
instructions: "Write a function that takes a 2D segmentation mask (class indices) and a list of class names, and returns a set of adjacency pairs — strings like 'building-road' (alphabetically sorted) — for any two different classes that are horizontally or vertically adjacent."
