solutionCode: |
  function binaryCrossEntropy(predicted: number, target: number): number {
    const p = Math.max(1e-7, Math.min(1 - 1e-7, predicted));
    return -(target * Math.log(p) + (1 - target) * Math.log(1 - p));
  }

  interface GanLosses {
    discriminatorLossReal: number;
    discriminatorLossFake: number;
    discriminatorLossTotal: number;
    generatorLoss: number;
  }

  function calculateGanLosses(
    realScores: number[],
    fakeScores: number[]
  ): GanLosses {
    const avg = (arr: number[]) => arr.reduce((a, b) => a + b, 0) / arr.length;

    const discriminatorLossReal = avg(realScores.map(s => binaryCrossEntropy(s, 1)));
    const discriminatorLossFake = avg(fakeScores.map(s => binaryCrossEntropy(s, 0)));
    const discriminatorLossTotal = (discriminatorLossReal + discriminatorLossFake) / 2;
    const generatorLoss = avg(fakeScores.map(s => binaryCrossEntropy(s, 1)));

    return {
      discriminatorLossReal,
      discriminatorLossFake,
      discriminatorLossTotal,
      generatorLoss,
    };
  }
testCode: |
  describe('binaryCrossEntropy', () => {
    it('returns low loss for correct prediction (target=1, predicted=0.9)', () => {
      expect(binaryCrossEntropy(0.9, 1)).toBeCloseTo(0.105, 2);
    });

    it('returns high loss for wrong prediction (target=1, predicted=0.1)', () => {
      expect(binaryCrossEntropy(0.1, 1)).toBeCloseTo(2.303, 2);
    });
  });

  describe('calculateGanLosses', () => {
    it('calculates discriminator loss for perfect discrimination', () => {
      const losses = calculateGanLosses([0.9, 0.95], [0.1, 0.05]);
      expect(losses.discriminatorLossReal).toBeLessThan(0.2);
      expect(losses.discriminatorLossFake).toBeLessThan(0.2);
    });

    it('calculates high generator loss when discriminator wins', () => {
      const losses = calculateGanLosses([0.9], [0.1]);
      expect(losses.generatorLoss).toBeGreaterThan(2);
    });

    it('calculates low generator loss when generator fools discriminator', () => {
      const losses = calculateGanLosses([0.9], [0.9]);
      expect(losses.generatorLoss).toBeLessThan(0.2);
    });

    it('discriminatorLossTotal is average of real and fake', () => {
      const losses = calculateGanLosses([0.8], [0.2]);
      const expected = (losses.discriminatorLossReal + losses.discriminatorLossFake) / 2;
      expect(losses.discriminatorLossTotal).toBeCloseTo(expected, 5);
    });
  });
