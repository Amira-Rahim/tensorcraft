slug: build-gan
lessonSlug: gans-primer
title: "Binary Cross-Entropy with tf Ops"
mlContent: training
instructions: "Build `binaryCrossEntropy(predicted, target)` returning a number. Wrap inputs as tf.tensor1d. Do not use tf.losses.sigmoidCrossEntropy here: it expects raw logits, and predicted is already a probability. Instead, clamp predicted and compute the BCE formula directly via tf ops: -(t*log(p) + (1-t)*log(1-p)). Read scalar with dataSync."
starterCode: |
  function binaryCrossEntropy(predicted, target) {
    return 0;
  }
solutionCode: |
  function binaryCrossEntropy(predicted, target) {
    const p = tf.scalar(Math.max(1e-7, Math.min(1 - 1e-7, predicted)));
    const t = tf.scalar(target);
    const term1 = t.mul(p.log());
    const term2 = tf.scalar(1).sub(t).mul(tf.scalar(1).sub(p).log());
    return term1.add(term2).neg().dataSync()[0];
  }
testCode: |
  describe('binaryCrossEntropy (tf scalar BCE)', () => {
    it('zero when prediction matches target=1', () => {
      expect(binaryCrossEntropy(0.999, 1)).toBeLessThan(0.01);
    });
    it('zero when prediction matches target=0', () => {
      expect(binaryCrossEntropy(0.001, 0)).toBeLessThan(0.01);
    });
    it('high when prediction is wrong direction', () => {
      expect(binaryCrossEntropy(0.99, 0)).toBeGreaterThan(4);
    });
    it('symmetric around 0.5', () => {
      const a = binaryCrossEntropy(0.5, 1);
      const b = binaryCrossEntropy(0.5, 0);
      expect(Math.abs(a - b)).toBeLessThan(0.001);
    });
  });
estimatedMinutes: 12
difficulty: intermediate
