instructions: "Implement the Gram matrix and style transfer loss functions. The Gram matrix captures texture/style by computing correlations between feature channels: gram[i][j] = sum(features[p][i] * features[p][j]) / numPixels. Content loss is MSE between feature maps. Style loss is MSE between Gram matrices. Total loss combines both with weights alpha (content) and beta (style)."
