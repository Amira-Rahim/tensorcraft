  function interpolateLatent(
    z1: number[],
    z2: number[],
    steps: number
  ): number[][] {
    // Return (steps + 1) vectors: from z1 (alpha=0) to z2 (alpha=1)
    // Each vector: z1[i] * (1 - alpha) + z2[i] * alpha
    return []; // your code here
  }

  // Generate variations around a base vector
  function generateVariations(
    base: number[],
    numVariations: number,
    scale: number
  ): number[][] {
    // For each variation, add random perturbations to base
    // Use simple deterministic "noise": index-based offsets for testability
