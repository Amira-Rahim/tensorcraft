solutionCode: |
  function interpolateLatent(
    z1: number[],
    z2: number[],
    steps: number
  ): number[][] {
    const results: number[][] = [];
    for (let i = 0; i <= steps; i++) {
      const alpha = i / steps;
      const interpolated = z1.map((val, j) =>
        val * (1 - alpha) + z2[j] * alpha
      );
      results.push(interpolated);
    }
    return results;
  }

  function generateVariations(
    base: number[],
    numVariations: number,
    scale: number
  ): number[][] {
    const results: number[][] = [];
    for (let i = 0; i < numVariations; i++) {
      const variation = base.map((val, j) =>
        val + scale * ((i * j) % 7 - 3) / 3
      );
      results.push(variation);
    }
    return results;
  }
testCode: |
  describe('interpolateLatent', () => {
    it('returns steps+1 vectors', () => {
      const result = interpolateLatent([0, 0], [1, 1], 4);
      expect(result.length).toBe(5);
    });

    it('first vector equals z1', () => {
      const result = interpolateLatent([0, 0], [10, 10], 4);
      expect(result[0]).toEqual([0, 0]);
    });

    it('last vector equals z2', () => {
      const result = interpolateLatent([0, 0], [10, 10], 4);
      expect(result[4]).toEqual([10, 10]);
    });

    it('midpoint is average of z1 and z2', () => {
      const result = interpolateLatent([0, 0], [10, 10], 2);
      expect(result[1]).toEqual([5, 5]);
    });

    it('preserves vector dimensions', () => {
      const result = interpolateLatent([1, 2, 3], [4, 5, 6], 1);
      expect(result[0].length).toBe(3);
    });
  });

  describe('generateVariations', () => {
    it('returns correct number of variations', () => {
      const result = generateVariations([1, 2, 3], 5, 0.1);
      expect(result.length).toBe(5);
    });

    it('preserves vector dimensions', () => {
      const result = generateVariations([1, 2, 3], 3, 0.1);
      result.forEach(v => expect(v.length).toBe(3));
    });

    it('variations differ from base when scale > 0', () => {
      const base = [1, 2, 3];
      const result = generateVariations(base, 3, 1.0);
      const allSame = result.every(v => v.every((val, i) => val === base[i]));
      expect(allSame).toBe(false);
    });
  });
