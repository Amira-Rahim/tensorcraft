solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  interface FeatureMapResult {
    shape: number[];
    numFilters: number;
  }

  function buildCNN(): tf.LayersModel {
    const model = tf.sequential();
    model.add(tf.layers.conv2d({
      filters: 8,
      kernelSize: 3,
      padding: 'same',
      activation: 'relu',
      inputShape: [28, 28, 1],
    }));
    model.add(tf.layers.conv2d({
      filters: 16,
      kernelSize: 3,
      padding: 'same',
      activation: 'relu',
    }));
    return model;
  }

  function createFeatureExtractor(
    model: tf.LayersModel,
    layerIndex: number
  ): tf.LayersModel {
    const targetLayer = model.layers[layerIndex];
    return tf.model({
      inputs: model.input,
      outputs: targetLayer.output,
    });
  }

  function extractFeatureMaps(
    extractor: tf.LayersModel,
    image: tf.Tensor4D
  ): FeatureMapResult {
    const output = extractor.predict(image) as tf.Tensor;
    const shape = output.shape;
    const numFilters = shape[shape.length - 1];
    output.dispose();
    return { shape: shape as number[], numFilters };
  }
testCode: |
  describe('Feature Visualization', () => {
    describe('buildCNN', () => {
      it('creates a model with two layers', () => {
        const model = buildCNN();
        expect(model.layers.length).toBe(2);
      });

      it('first layer has 8 filters', () => {
        const model = buildCNN();
        const config = model.layers[0].getConfig();
        expect(config.filters).toBe(8);
      });

      it('second layer has 16 filters', () => {
        const model = buildCNN();
        const config = model.layers[1].getConfig();
        expect(config.filters).toBe(16);
      });

      it('accepts 28x28x1 input', () => {
        const model = buildCNN();
        const inputShape = model.inputShape;
        expect(inputShape).toEqual([null, 28, 28, 1]);
      });
    });

    describe('createFeatureExtractor', () => {
      it('returns a defined extractor model', () => {
        const model = buildCNN();
        const extractor = createFeatureExtractor(model, 0);
        expect(extractor).toBeDefined();
        expect(extractor.inputs).toBeDefined();
      });

      it('can target the second layer', () => {
        const model = buildCNN();
        const extractor = createFeatureExtractor(model, 1);
        expect(extractor).toBeDefined();
      });
    });

    describe('extractFeatureMaps', () => {
      it('returns a result with shape and filter metadata', () => {
        const model = buildCNN();
        const extractor = createFeatureExtractor(model, 0);
        const image = tf.zeros([1, 28, 28, 1]) as tf.Tensor4D;
        const result = extractFeatureMaps(extractor, image);
        expect(Array.isArray(result.shape)).toBe(true);
        expect(typeof result.numFilters).toBe('number');
        image.dispose();
      });
    });
  });
