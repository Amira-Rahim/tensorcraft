title: "Visualize CNN Feature Maps"
instructions: "Implement two functions. normalizeMap takes a 2D array of raw activation values and normalizes them to the [0, 1] range using min-max normalization (return all zeros if range is 0). extractActivations takes an array of 2D feature maps (number[][][]) and returns an array of ActivationMap objects, each containing the filterIndex, the normalized map, and the maxActivation (peak value from the raw map)."
