title: "Visualize CNN Feature Maps"
instructions: "Extract and visualize intermediate feature maps from a CNN to see what patterns each layer detects. Implement three functions. buildCNN constructs a simple sequential CNN with two conv2d layers (8 and 16 filters, 3x3 kernel, 'same' padding, relu activation) that accepts 28x28x1 input. createFeatureExtractor takes the trained model and a target layer index, and returns a new tf.LayersModel whose input is the original model's input and whose output is the target layer's output. extractFeatureMaps takes the feature extractor model and a 28x28x1 image tensor, runs a forward pass, and returns an object with the output shape (as a number array) and the number of filters (the last dimension of the output)."
