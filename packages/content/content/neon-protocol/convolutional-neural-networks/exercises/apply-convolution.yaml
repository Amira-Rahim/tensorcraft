title: "Apply a 2D Convolution"
instructions: "Implement a function convolve2D that takes a 2D grayscale image (number[][]) and a 2D kernel (number[][]), and returns the convolution result using valid padding (no padding). At each position, multiply the overlapping region element-wise with the kernel and sum the values."
