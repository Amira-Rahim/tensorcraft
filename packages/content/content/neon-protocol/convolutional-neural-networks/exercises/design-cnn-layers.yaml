solutionCode: |
  interface LayerConfig {
    type: 'conv' | 'pool';
    value: number;
  }

  interface LayerOutput {
    type: string;
    outputShape: [number, number, number];
  }

  function calculateCNNShapes(
    inputShape: [number, number, number],
    layers: LayerConfig[]
  ): LayerOutput[] {
    const results: LayerOutput[] = [];
    let [h, w, ch] = inputShape;

    for (const layer of layers) {
      if (layer.type === 'conv') {
        ch = layer.value;
        results.push({ type: 'conv', outputShape: [h, w, ch] });
      } else {
        h = Math.floor(h / layer.value);
        w = Math.floor(w / layer.value);
        results.push({ type: 'pool', outputShape: [h, w, ch] });
      }
    }

    return results;
  }
testCode: |
  describe('calculateCNNShapes', () => {
    it('handles a single conv layer', () => {
      const result = calculateCNNShapes([224, 224, 3], [{ type: 'conv', value: 8 }]);
      expect(result).toEqual([{ type: 'conv', outputShape: [224, 224, 8] }]);
    });

    it('handles a single pool layer', () => {
      const result = calculateCNNShapes([224, 224, 3], [{ type: 'pool', value: 2 }]);
      expect(result).toEqual([{ type: 'pool', outputShape: [112, 112, 3] }]);
    });

    it('handles conv then pool', () => {
      const result = calculateCNNShapes([224, 224, 3], [
        { type: 'conv', value: 16 },
        { type: 'pool', value: 2 }
      ]);
      expect(result.length).toBe(2);
      expect(result[0].outputShape).toEqual([224, 224, 16]);
      expect(result[1].outputShape).toEqual([112, 112, 16]);
    });

    it('handles three conv-pool blocks', () => {
      const result = calculateCNNShapes([224, 224, 3], [
        { type: 'conv', value: 8 },
        { type: 'pool', value: 2 },
        { type: 'conv', value: 16 },
        { type: 'pool', value: 2 },
        { type: 'conv', value: 32 },
        { type: 'pool', value: 2 }
      ]);
      expect(result.length).toBe(6);
      expect(result[5].outputShape).toEqual([28, 28, 32]);
    });
  });
