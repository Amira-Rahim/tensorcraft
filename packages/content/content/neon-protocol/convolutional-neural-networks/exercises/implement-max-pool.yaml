title: "Implement Max Pooling"
instructions: "Implement a function maxPool2D that takes a 2D feature map (number[][]) and a pool size (number), and returns the max-pooled result. Divide the input into non-overlapping blocks of poolSize x poolSize and take the maximum value from each block."
