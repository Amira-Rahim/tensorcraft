solutionCode: |
  interface EpochResult {
    loss: number;
    accuracy: number;
  }

  function softmax(logits: number[]): number[] {
    const maxLogit = Math.max(...logits);
    const exps = logits.map(l => Math.exp(l - maxLogit));
    const sumExps = exps.reduce((a, b) => a + b, 0);
    return exps.map(e => e / sumExps);
  }

  function crossEntropyLoss(probs: number[], trueLabel: number): number {
    const clampedProb = Math.max(probs[trueLabel], 1e-7);
    return -Math.log(clampedProb);
  }

  function trainEpoch(
    dataSize: number,
    batchSize: number,
    numClasses: number
  ): EpochResult {
    const numBatches = Math.floor(dataSize / batchSize);
    let totalLoss = 0;
    let correctPredictions = 0;

    for (let b = 0; b < numBatches; b++) {
      for (let s = 0; s < batchSize; s++) {
        const logits = Array.from({ length: numClasses }, () =>
          Math.random() * 2 - 1
        );
        const probs = softmax(logits);
        const trueLabel = Math.floor(Math.random() * numClasses);

        totalLoss += crossEntropyLoss(probs, trueLabel);

        const predicted = probs.indexOf(Math.max(...probs));
        if (predicted === trueLabel) correctPredictions++;
      }
    }

    const totalSamples = numBatches * batchSize;
    return {
      loss: totalLoss / totalSamples,
      accuracy: correctPredictions / totalSamples,
    };
  }
testCode: |
  describe('CNN Training Pipeline', () => {
    describe('softmax', () => {
      it('returns probabilities that sum to 1', () => {
        const result = softmax([1, 2, 3]);
        const sum = result.reduce((a, b) => a + b, 0);
        expect(sum).toBeCloseTo(1.0);
      });

      it('highest logit gets highest probability', () => {
        const result = softmax([1, 5, 2]);
        expect(result[1]).toBeGreaterThan(result[0]);
        expect(result[1]).toBeGreaterThan(result[2]);
      });

      it('handles equal logits', () => {
        const result = softmax([1, 1, 1]);
        expect(result[0]).toBeCloseTo(1/3, 4);
        expect(result[1]).toBeCloseTo(1/3, 4);
        expect(result[2]).toBeCloseTo(1/3, 4);
      });

      it('handles large logits without overflow', () => {
        const result = softmax([1000, 1001, 1002]);
        const sum = result.reduce((a, b) => a + b, 0);
        expect(sum).toBeCloseTo(1.0);
        expect(Number.isFinite(result[0])).toBe(true);
      });
    });

    describe('crossEntropyLoss', () => {
      it('returns 0 for perfect prediction', () => {
        const loss = crossEntropyLoss([0, 1, 0], 1);
        expect(loss).toBeCloseTo(0, 4);
      });

      it('returns high loss for wrong prediction', () => {
        const loss = crossEntropyLoss([0.9, 0.05, 0.05], 1);
        expect(loss).toBeGreaterThan(2);
      });

      it('handles near-zero probability without NaN', () => {
        const loss = crossEntropyLoss([1, 0, 0], 1);
        expect(Number.isFinite(loss)).toBe(true);
      });
    });

    describe('trainEpoch', () => {
      it('returns loss and accuracy', () => {
        const result = trainEpoch(100, 10, 5);
        expect(result).toHaveProperty('loss');
        expect(result).toHaveProperty('accuracy');
        expect(result.loss).toBeGreaterThan(0);
        expect(result.accuracy).toBeGreaterThanOrEqual(0);
        expect(result.accuracy).toBeLessThanOrEqual(1);
      });
    });
  });
