title: "Build a Middleware Pipeline"
instructions: "Implement a middleware-style pipeline where each stage receives a context object and a next() function. Stages process data and call next() to continue. If a stage does not call next(), downstream stages are skipped. The pipeline should execute stages in order and return the final context."
