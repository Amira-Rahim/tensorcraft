solutionCode: |
  interface AugmentConfig {
    brightnessFactor: number;
    noiseValues: number[];
  }

  function augmentForNight(
    pixels: number[],
    config: AugmentConfig
  ): number[] {
    return pixels.map((pixel, i) => {
      const dimmed = pixel * config.brightnessFactor;
      const noisy = dimmed + config.noiseValues[i];
      return Math.round(Math.max(0, Math.min(255, noisy)));
    });
  }
testCode: |
  describe('augmentForNight', () => {
    it('reduces brightness', () => {
      const result = augmentForNight([200, 200, 200], {
        brightnessFactor: 0.5,
        noiseValues: [0, 0, 0],
      });
      expect(result).toEqual([100, 100, 100]);
    });

    it('adds noise', () => {
      const result = augmentForNight([100, 100, 100], {
        brightnessFactor: 1.0,
        noiseValues: [10, -10, 5],
      });
      expect(result).toEqual([110, 90, 105]);
    });

    it('clamps to 0-255', () => {
      const result = augmentForNight([250, 10], {
        brightnessFactor: 1.0,
        noiseValues: [20, -20],
      });
      expect(result[0]).toBe(255);
      expect(result[1]).toBe(0);
    });

    it('rounds to integers', () => {
      const result = augmentForNight([100], {
        brightnessFactor: 0.33,
        noiseValues: [0],
      });
      expect(Number.isInteger(result[0])).toBe(true);
    });

    it('combines brightness and noise', () => {
      const result = augmentForNight([200], {
        brightnessFactor: 0.5,
        noiseValues: [10],
      });
      expect(result[0]).toBe(110); // 200 * 0.5 + 10
    });
  });
