solutionCode: |
  class FpsTracker {
    private timestamps: number[] = [];
    private windowSize: number;

    constructor(windowSize: number = 60) {
      this.windowSize = windowSize;
    }

    tick(timestamp: number): void {
      this.timestamps.push(timestamp);
      if (this.timestamps.length > this.windowSize) {
        this.timestamps.shift();
      }
    }

    getFps(): number {
      if (this.timestamps.length < 2) return 0;
      const oldest = this.timestamps[0];
      const newest = this.timestamps[this.timestamps.length - 1];
      const elapsed = newest - oldest;
      if (elapsed === 0) return 0;
      return ((this.timestamps.length - 1) / elapsed) * 1000;
    }

    meetsTarget(targetFps: number): boolean {
      return this.getFps() >= targetFps;
    }

    budgetRemaining(targetFps: number): number {
      const currentFps = this.getFps();
      if (currentFps === 0) return 1000 / targetFps;
      const budget = 1000 / targetFps;
      const actual = 1000 / currentFps;
      return budget - actual;
    }
  }
testCode: |
  describe('FpsTracker', () => {
    it('returns 0 fps with fewer than 2 timestamps', () => {
      const tracker = new FpsTracker();
      expect(tracker.getFps()).toBe(0);
      tracker.tick(0);
      expect(tracker.getFps()).toBe(0);
    });

    it('calculates fps from timestamps', () => {
      const tracker = new FpsTracker();
      // 30 frames over 1 second = 30fps
      for (let i = 0; i <= 30; i++) {
        tracker.tick(i * (1000 / 30));
      }
      expect(tracker.getFps()).toBeCloseTo(30, 0);
    });

    it('meets target when fps is sufficient', () => {
      const tracker = new FpsTracker();
      for (let i = 0; i <= 60; i++) {
        tracker.tick(i * (1000 / 60));
      }
      expect(tracker.meetsTarget(30)).toBe(true);
      expect(tracker.meetsTarget(60)).toBe(true);
    });

    it('does not meet target when fps is too low', () => {
      const tracker = new FpsTracker();
      for (let i = 0; i <= 10; i++) {
        tracker.tick(i * 100);
      }
      expect(tracker.meetsTarget(30)).toBe(false);
    });

    it('respects window size', () => {
      const tracker = new FpsTracker(5);
      for (let i = 0; i < 10; i++) {
        tracker.tick(i * 100);
      }
      // Only last 5 timestamps kept
      expect(tracker.getFps()).toBeCloseTo(10, 0);
    });
  });
