slug: frame-inference
lessonSlug: frame-by-frame-inference
title: "Frame-Per-Second Inference Loop"
mlContent: deployment
instructions: "Build async `measureFps(model, input, durationMs)` that runs model.predict in a tight loop for durationMs milliseconds, awaits each prediction, and returns the frames-per-second rate as a number. Use performance.now() for timing."
starterCode: |
  async function measureFps(model, input, durationMs) {
    return 0;
  }
solutionCode: |
  async function measureFps(model, input, durationMs) {
    const start = performance.now();
    let frames = 0;
    while (performance.now() - start < durationMs) {
      const out = model.predict(input);
      await out.data();
      out.dispose();
      frames++;
    }
    const elapsed = (performance.now() - start) / 1000;
    return frames / elapsed;
  }
testCode: |
  describe('measureFps (real model.predict + perf.now)', () => {
    function makeModel() {
      const m = tf.sequential();
      m.add(tf.layers.dense({ units: 1, inputShape: [4] }));
      return m;
    }
    it('returns a positive fps number', async () => {
      const m = makeModel();
      const input = tf.tensor2d([[1, 2, 3, 4]]);
      const fps = await measureFps(m, input, 100);
      expect(fps).toBeGreaterThan(0);
    });
    it('reports finite number', async () => {
      const m = makeModel();
      const input = tf.tensor2d([[0.5, 0.5, 0.5, 0.5]]);
      const fps = await measureFps(m, input, 50);
      expect(Number.isFinite(fps)).toBe(true);
    });
  });
