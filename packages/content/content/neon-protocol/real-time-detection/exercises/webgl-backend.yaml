solutionCode: |
  interface BackendComparison {
    cpuAvgMs: number;
    webglAvgMs: number;
    speedup: number;
    cpuFps: number;
    webglFps: number;
    webglMeetsBudget: boolean;
  }

  function compareBackends(
    cpuTimes: number[],
    webglTimes: number[],
    targetFps: number
  ): BackendComparison {
    const avg = (arr: number[]) => arr.reduce((a, b) => a + b, 0) / arr.length;
    const cpuAvgMs = avg(cpuTimes);
    const webglAvgMs = avg(webglTimes);
    return {
      cpuAvgMs,
      webglAvgMs,
      speedup: cpuAvgMs / webglAvgMs,
      cpuFps: 1000 / cpuAvgMs,
      webglFps: 1000 / webglAvgMs,
      webglMeetsBudget: webglAvgMs <= 1000 / targetFps,
    };
  }
testCode: |
  describe('compareBackends', () => {
    it('calculates average times', () => {
      const result = compareBackends([40, 50, 45], [8, 10, 9], 30);
      expect(result.cpuAvgMs).toBe(45);
      expect(result.webglAvgMs).toBe(9);
    });

    it('calculates speedup factor', () => {
      const result = compareBackends([40, 50, 45], [8, 10, 9], 30);
      expect(result.speedup).toBe(5);
    });

    it('calculates FPS from average times', () => {
      const result = compareBackends([50, 50], [10, 10], 30);
      expect(result.cpuFps).toBe(20);
      expect(result.webglFps).toBe(100);
    });

    it('reports WebGL meets budget at 30fps', () => {
      const result = compareBackends([50, 50], [10, 10], 30);
      expect(result.webglMeetsBudget).toBe(true);
    });

    it('reports WebGL fails budget when too slow', () => {
      const result = compareBackends([50, 50], [40, 40], 30);
      expect(result.webglMeetsBudget).toBe(false);
    });
  });
