title: "Balance the Surveillance Camera Dataset"
instructions: "Implement two functions: oversample takes an array of labeled samples and returns a new array where every class has the same count as the majority class (by repeating minority samples cyclically). calculateClassWeights takes an array of label strings and returns an object mapping each label to its weight using the formula: totalSamples / (numClasses * classSampleCount)."
