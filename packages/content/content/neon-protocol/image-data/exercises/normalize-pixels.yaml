title: "Normalize Surveillance Image Pixels"
instructions: "Implement a minMaxNormalize function that scales a 2D pixel grid to the [0, 1] range. Find the global minimum and maximum across all pixels, then apply the formula (pixel - min) / (max - min). Handle the edge case where all pixels are the same value (max === min) by returning all zeros."
