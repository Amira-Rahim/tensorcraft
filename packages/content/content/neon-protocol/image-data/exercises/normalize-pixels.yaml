slug: normalize-pixels
lessonSlug: normalization
title: "Min-Max Normalize Pixels with tf"
mlContent: data
instructions: "Build `minMaxNormalize(pixels)` that takes a 2D number array and returns a 2D number array scaled to [0, 1]. Wrap input as a tf.tensor2d, compute min and max with tf.min / tf.max, scale with tf ops, and read back as arraySync(). If max equals min, return all zeros (use tf.zerosLike)."
starterCode: |
  function minMaxNormalize(pixels) {
    return [];
  }
solutionCode: |
  function minMaxNormalize(pixels) {
    const t = tf.tensor2d(pixels);
    const mn = t.min();
    const mx = t.max();
    const range = mx.sub(mn).dataSync()[0];
    if (range === 0) return tf.zerosLike(t).arraySync();
    return t.sub(mn).div(mx.sub(mn)).arraySync();
  }
testCode: |
  describe('minMaxNormalize (real tf min/max)', () => {
    it('scales values to [0,1]', () => {
      const result = minMaxNormalize([[0, 10], [5, 15]]);
      expect(result[0][0]).toBeCloseTo(0, 4);
      expect(result[1][1]).toBeCloseTo(1, 4);
    });
    it('preserves intermediate ratios', () => {
      const result = minMaxNormalize([[0, 5], [10, 15]]);
      expect(result[0][1]).toBeCloseTo(5 / 15, 4);
    });
    it('returns zeros when all pixels equal', () => {
      const result = minMaxNormalize([[7, 7], [7, 7]]);
      expect(result[0][0]).toBe(0);
      expect(result[1][1]).toBe(0);
    });
  });
estimatedMinutes: 10
difficulty: beginner
