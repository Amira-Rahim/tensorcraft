slug: augment-image
lessonSlug: data-augmentation
title: "Image Augmentation with tf.image"
mlContent: data
instructions: "Build `flipHorizontal(pixels)` taking a 2D array (rows of pixel values) and returning a 2D array reversed along the column axis using tf.reverse. Build `adjustBrightness(pixels, delta)` returning a 2D array with delta added (clipped to [0, 255]) using tf ops. Both return arraySync results."
starterCode: |
  function flipHorizontal(pixels) {
    return [];
  }
  function adjustBrightness(pixels, delta) {
    return [];
  }
solutionCode: |
  function flipHorizontal(pixels) {
    return tf.tensor2d(pixels).reverse(1).arraySync();
  }
  function adjustBrightness(pixels, delta) {
    return tf.tensor2d(pixels).add(delta).clipByValue(0, 255).arraySync();
  }
testCode: |
  describe('flipHorizontal (tf.reverse)', () => {
    it('reverses each row', () => {
      const out = flipHorizontal([[1, 2, 3], [4, 5, 6]]);
      expect(out[0]).toEqual([3, 2, 1]);
      expect(out[1]).toEqual([6, 5, 4]);
    });
    it('preserves shape', () => {
      const out = flipHorizontal([[10, 20], [30, 40]]);
      expect(out.length).toBe(2);
      expect(out[0].length).toBe(2);
    });
  });
  describe('adjustBrightness (tf.add + clipByValue)', () => {
    it('adds delta uniformly', () => {
      const out = adjustBrightness([[10, 20], [30, 40]], 5);
      expect(out[0][0]).toBeCloseTo(15, 4);
      expect(out[1][1]).toBeCloseTo(45, 4);
    });
    it('clips to [0, 255]', () => {
      const out = adjustBrightness([[250, 0]], 20);
      expect(out[0][0]).toBeCloseTo(255, 4);
    });
    it('clips negative delta', () => {
      const out = adjustBrightness([[5, 0]], -20);
      expect(out[0][0]).toBeCloseTo(0, 4);
      expect(out[0][1]).toBeCloseTo(0, 4);
    });
  });
estimatedMinutes: 10
