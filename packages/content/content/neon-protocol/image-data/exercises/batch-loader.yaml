solutionCode: |
  class DataLoader<T> {
    private cursor: number = 0;
    private currentEpoch: number = 0;

    constructor(
      private data: T[],
      private batchSize: number
    ) {}

    nextBatch(): T[] | null {
      if (this.cursor >= this.data.length) {
        return null;
      }

      const batch = this.data.slice(
        this.cursor,
        this.cursor + this.batchSize
      );
      this.cursor += this.batchSize;
      return batch;
    }

    startNewEpoch(): void {
      this.cursor = 0;
      this.currentEpoch++;
    }

    getEpoch(): number {
      return this.currentEpoch;
    }
  }
testCode: |
  describe('DataLoader', () => {
    it('returns correct batch size', () => {
      const loader = new DataLoader([1, 2, 3, 4, 5, 6], 2);
      const batch = loader.nextBatch();
      expect(batch).toEqual([1, 2]);
    });

    it('advances through the data', () => {
      const loader = new DataLoader([1, 2, 3, 4, 5, 6], 2);
      loader.nextBatch();
      const batch2 = loader.nextBatch();
      expect(batch2).toEqual([3, 4]);
    });

    it('returns null when epoch is complete', () => {
      const loader = new DataLoader([1, 2, 3, 4], 2);
      loader.nextBatch();
      loader.nextBatch();
      const batch3 = loader.nextBatch();
      expect(batch3).toBe(null);
    });

    it('handles incomplete last batch', () => {
      const loader = new DataLoader([1, 2, 3, 4, 5], 2);
      loader.nextBatch();
      loader.nextBatch();
      const batch3 = loader.nextBatch();
      expect(batch3).toEqual([5]);
    });

    it('resets on new epoch', () => {
      const loader = new DataLoader([1, 2, 3, 4], 2);
      loader.nextBatch();
      loader.nextBatch();
      loader.startNewEpoch();
      const batch = loader.nextBatch();
      expect(batch).toEqual([1, 2]);
    });

    it('tracks epoch number', () => {
      const loader = new DataLoader([1, 2], 2);
      expect(loader.getEpoch()).toBe(0);
      loader.startNewEpoch();
      expect(loader.getEpoch()).toBe(1);
      loader.startNewEpoch();
      expect(loader.getEpoch()).toBe(2);
    });
  });
