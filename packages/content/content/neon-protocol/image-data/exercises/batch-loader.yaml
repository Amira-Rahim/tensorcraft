title: "Build a Batched Data Loader"
instructions: "Implement a DataLoader class that serves data in fixed-size batches. The constructor takes an array of items and a batchSize. The nextBatch method returns the next batch of items (or null if the epoch is complete). The startNewEpoch method resets the cursor and increments the epoch counter. The getEpoch method returns the current epoch number (starting at 0)."
