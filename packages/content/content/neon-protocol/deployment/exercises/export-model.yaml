solutionCode: |
  interface ModelExportMeta {
    layerCount: number;
    totalParams: number;
    weightShardSizes: number[];
    topologySize: number;
    format: 'tfjs_layers_model';
  }

  function extractExportMeta(
    layerConfigs: { name: string; units: number; inputDim: number }[]
  ): ModelExportMeta {
    const weightShardSizes = layerConfigs.map(layer => {
      const weights = layer.inputDim * layer.units;
      const biases = layer.units;
      return (weights + biases) * 4;
    });

    const totalParams = layerConfigs.reduce((sum, layer) => {
      return sum + (layer.inputDim * layer.units) + layer.units;
    }, 0);

    return {
      layerCount: layerConfigs.length,
      totalParams,
      weightShardSizes,
      topologySize: layerConfigs.length * 200,
      format: 'tfjs_layers_model',
    };
  }

  function verifyExportIntegrity(
    originalMeta: ModelExportMeta,
    loadedMeta: ModelExportMeta
  ): { isValid: boolean; errors: string[] } {
    const errors: string[] = [];

    if (originalMeta.layerCount !== loadedMeta.layerCount) {
      errors.push(`Layer count mismatch: ${originalMeta.layerCount} vs ${loadedMeta.layerCount}`);
    }

    if (originalMeta.totalParams !== loadedMeta.totalParams) {
      errors.push(`Param count mismatch: ${originalMeta.totalParams} vs ${loadedMeta.totalParams}`);
    }

    if (originalMeta.weightShardSizes.length !== loadedMeta.weightShardSizes.length) {
      errors.push('Weight shard count mismatch');
    } else {
      originalMeta.weightShardSizes.forEach((size, i) => {
        if (size !== loadedMeta.weightShardSizes[i]) {
          errors.push(`Shard ${i} size mismatch: ${size} vs ${loadedMeta.weightShardSizes[i]}`);
        }
      });
    }

    return { isValid: errors.length === 0, errors };
  }
testCode: |
  describe('extractExportMeta', () => {
    const layers = [
      { name: 'dense1', units: 128, inputDim: 784 },
      { name: 'dense2', units: 10, inputDim: 128 },
    ];

    it('counts layers correctly', () => {
      const meta = extractExportMeta(layers);
      expect(meta.layerCount).toBe(2);
    });

    it('calculates total params (weights + biases)', () => {
      const meta = extractExportMeta(layers);
      // Layer 1: 784*128 + 128 = 100480
      // Layer 2: 128*10 + 10 = 1290
      expect(meta.totalParams).toBe(101770);
    });

    it('calculates weight shard sizes in bytes', () => {
      const meta = extractExportMeta(layers);
      expect(meta.weightShardSizes).toEqual([100480 * 4, 1290 * 4]);
    });

    it('estimates topology size', () => {
      const meta = extractExportMeta(layers);
      expect(meta.topologySize).toBe(400);
    });

    it('sets format to tfjs_layers_model', () => {
      const meta = extractExportMeta(layers);
      expect(meta.format).toBe('tfjs_layers_model');
    });
  });

  describe('verifyExportIntegrity', () => {
    it('returns valid for identical metadata', () => {
      const meta = extractExportMeta([
        { name: 'dense1', units: 64, inputDim: 100 },
      ]);
      const result = verifyExportIntegrity(meta, { ...meta });
      expect(result.isValid).toBe(true);
      expect(result.errors).toEqual([]);
    });

    it('detects layer count mismatch', () => {
      const original = extractExportMeta([
        { name: 'dense1', units: 64, inputDim: 100 },
      ]);
      const loaded = { ...original, layerCount: 2 };
      const result = verifyExportIntegrity(original, loaded);
      expect(result.isValid).toBe(false);
      expect(result.errors.length).toBeGreaterThan(0);
    });

    it('detects param count mismatch', () => {
      const original = extractExportMeta([
        { name: 'dense1', units: 64, inputDim: 100 },
      ]);
      const loaded = { ...original, totalParams: 999 };
      const result = verifyExportIntegrity(original, loaded);
      expect(result.isValid).toBe(false);
    });
  });
