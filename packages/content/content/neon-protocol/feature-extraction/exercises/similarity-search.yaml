solutionCode: |
  interface SearchResult {
    index: number;
    label: string;
    similarity: number;
  }

  interface DatabaseItem {
    vector: number[];
    label: string;
  }

  function cosineSim(a: number[], b: number[]): number {
    let dot = 0, normA = 0, normB = 0;
    for (let i = 0; i < a.length; i++) {
      dot += a[i] * b[i];
      normA += a[i] * a[i];
      normB += b[i] * b[i];
    }
    return dot / (Math.sqrt(normA) * Math.sqrt(normB));
  }

  function findKNearest(
    query: number[],
    database: DatabaseItem[],
    k: number
  ): SearchResult[] {
    const scored = database.map((item, index) => ({
      index,
      label: item.label,
      similarity: cosineSim(query, item.vector),
    }));
    scored.sort((a, b) => b.similarity - a.similarity);
    return scored.slice(0, k);
  }
testCode: |
  describe('findKNearest', () => {
    const db: DatabaseItem[] = [
      { vector: [1, 0, 0], label: 'drone-a' },
      { vector: [0.9, 0.1, 0], label: 'drone-b' },
      { vector: [0, 1, 0], label: 'car' },
      { vector: [0, 0, 1], label: 'person' },
    ];

    it('returns k results', () => {
      const results = findKNearest([1, 0, 0], db, 2);
      expect(results.length).toBe(2);
    });

    it('returns most similar first', () => {
      const results = findKNearest([1, 0, 0], db, 2);
      expect(results[0].label).toBe('drone-a');
      expect(results[1].label).toBe('drone-b');
    });

    it('similarity is descending', () => {
      const results = findKNearest([1, 0, 0], db, 4);
      for (let i = 1; i < results.length; i++) {
        expect(results[i].similarity).toBeLessThanOrEqual(results[i - 1].similarity);
      }
    });

    it('includes index and label', () => {
      const results = findKNearest([0, 0, 1], db, 1);
      expect(results[0].index).toBe(3);
      expect(results[0].label).toBe('person');
    });

    it('handles k larger than database', () => {
      const results = findKNearest([1, 0, 0], db, 10);
      expect(results.length).toBe(4);
    });
  });
