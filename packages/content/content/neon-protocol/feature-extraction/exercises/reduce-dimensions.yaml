solutionCode: |
  interface Point2D {
    x: number;
    y: number;
  }

  function projectTo2D(data: number[][]): Point2D[] {
    const numSamples = data.length;
    const numFeatures = data[0].length;

    // Compute column means
    const means = new Array(numFeatures).fill(0);
    for (let i = 0; i < numSamples; i++) {
      for (let j = 0; j < numFeatures; j++) {
        means[j] += data[i][j];
      }
    }
    for (let j = 0; j < numFeatures; j++) {
      means[j] /= numSamples;
    }

    // Center and project to first 2 dimensions
    return data.map(row => ({
      x: row[0] - means[0],
      y: row[1] - means[1],
    }));
  }
testCode: |
  describe('projectTo2D', () => {
    it('returns Point2D array', () => {
      const result = projectTo2D([[1, 2, 3], [4, 5, 6]]);
      expect(result.length).toBe(2);
      expect(result[0]).toHaveProperty('x');
      expect(result[0]).toHaveProperty('y');
    });

    it('centers data around zero', () => {
      const data = [[2, 4, 10], [4, 6, 20]];
      const result = projectTo2D(data);
      const sumX = result.reduce((s, p) => s + p.x, 0);
      const sumY = result.reduce((s, p) => s + p.y, 0);
      expect(sumX).toBeCloseTo(0, 5);
      expect(sumY).toBeCloseTo(0, 5);
    });

    it('preserves relative positions', () => {
      const data = [[1, 1, 99], [3, 3, 99], [5, 5, 99]];
      const result = projectTo2D(data);
      expect(result[0].x).toBeLessThan(result[1].x);
      expect(result[1].x).toBeLessThan(result[2].x);
    });

    it('handles single sample', () => {
      const result = projectTo2D([[10, 20, 30]]);
      expect(result[0].x).toBeCloseTo(0, 5);
      expect(result[0].y).toBeCloseTo(0, 5);
    });
  });
