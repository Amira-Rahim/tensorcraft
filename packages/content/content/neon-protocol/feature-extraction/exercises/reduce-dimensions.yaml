title: "Project to 2D with PCA"
instructions: "Write a function that performs a simplified PCA-like projection. Given a 2D array of data points (each row is a sample, each column a feature), compute the mean of each feature, center the data by subtracting the mean, then return the centered data using only the first 2 features (columns) as a basic projection to 2D."
