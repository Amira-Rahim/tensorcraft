solutionCode: |
  interface Match {
    index: number;
    label: string;
    similarity: number;
  }

  interface DbEntry {
    vector: number[];
    label: string;
  }

  function cosineSim(a: number[], b: number[]): number {
    let dot = 0, normA = 0, normB = 0;
    for (let i = 0; i < a.length; i++) {
      dot += a[i] * b[i];
      normA += a[i] * a[i];
      normB += b[i] * b[i];
    }
    return dot / (Math.sqrt(normA) * Math.sqrt(normB));
  }

  function findAboveThreshold(
    query: number[],
    database: DbEntry[],
    threshold: number
  ): Match[] {
    const matches: Match[] = [];
    for (let i = 0; i < database.length; i++) {
      const sim = cosineSim(query, database[i].vector);
      const rounded = Math.round(sim * 10000) / 10000;
      if (rounded >= threshold) {
        matches.push({ index: i, label: database[i].label, similarity: rounded });
      }
    }
    matches.sort((a, b) => b.similarity - a.similarity);
    return matches;
  }
testCode: |
  describe('findAboveThreshold', () => {
    const db: DbEntry[] = [
      { vector: [1, 0, 0], label: 'drone-x7' },
      { vector: [0.95, 0.05, 0], label: 'drone-x7-alt' },
      { vector: [0.5, 0.5, 0], label: 'unknown' },
      { vector: [0, 1, 0], label: 'vehicle' },
      { vector: [0, 0, 1], label: 'person' },
    ];

    it('returns only items above threshold', () => {
      const results = findAboveThreshold([1, 0, 0], db, 0.9);
      expect(results.length).toBe(2);
      expect(results.every(r => r.similarity >= 0.9)).toBe(true);
    });

    it('results are sorted by similarity descending', () => {
      const results = findAboveThreshold([1, 0, 0], db, 0.5);
      for (let i = 1; i < results.length; i++) {
        expect(results[i].similarity).toBeLessThanOrEqual(results[i - 1].similarity);
      }
    });

    it('returns empty array when nothing matches', () => {
      const results = findAboveThreshold([0, 0, 1], db, 0.99);
      expect(results.length).toBe(1);
      expect(results[0].label).toBe('person');
    });

    it('includes correct index and label', () => {
      const results = findAboveThreshold([1, 0, 0], db, 0.99);
      expect(results[0].index).toBe(0);
      expect(results[0].label).toBe('drone-x7');
    });

    it('similarities are rounded to 4 decimal places', () => {
      const results = findAboveThreshold([1, 0, 0], db, 0.0);
      results.forEach(r => {
        const str = r.similarity.toString();
        const decimals = str.includes('.') ? str.split('.')[1].length : 0;
        expect(decimals).toBeLessThanOrEqual(4);
      });
    });
  });
