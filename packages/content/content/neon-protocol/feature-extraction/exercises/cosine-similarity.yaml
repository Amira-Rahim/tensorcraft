title: "Implement Cosine Similarity Search"
instructions: "Write a function that finds all items in a database whose cosine similarity to a query vector exceeds a given threshold. Return matching items sorted by similarity (descending), each with index, label, and similarity score rounded to 4 decimal places. This is how the resistance filters drone matches from camera feeds — only frames above the threshold are flagged."
