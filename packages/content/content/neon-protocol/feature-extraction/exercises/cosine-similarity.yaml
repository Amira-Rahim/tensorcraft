slug: cosine-similarity
lessonSlug: similarity-search
title: "Cosine Similarity Between Feature Vectors"
mlContent: data
instructions: "Build `cosineSim(a, b)` taking two 1D tensors and returning the cosine of the angle between them. Use tf.dot for the inner product and tf.norm for magnitudes. Return a JS number."
starterCode: |
  function cosineSim(a, b) {
    return 0;
  }
solutionCode: |
  function cosineSim(a, b) {
    const dot = tf.dot(a, b);
    const denom = tf.norm(a).mul(tf.norm(b));
    return dot.div(denom).dataSync()[0];
  }
testCode: |
  describe('cosineSim (real tf.dot + tf.norm)', () => {
    it('identical vectors → 1', () => {
      const v = tf.tensor1d([3, 4]);
      expect(cosineSim(v, v)).toBeCloseTo(1, 4);
    });
    it('orthogonal → 0', () => {
      const a = tf.tensor1d([1, 0]);
      const b = tf.tensor1d([0, 1]);
      expect(cosineSim(a, b)).toBeCloseTo(0, 4);
    });
    it('opposite direction → -1', () => {
      const a = tf.tensor1d([1, 1]);
      const b = tf.tensor1d([-1, -1]);
      expect(cosineSim(a, b)).toBeCloseTo(-1, 4);
    });
    it('scale-invariant', () => {
      const a = tf.tensor1d([1, 2]);
      const b = tf.tensor1d([100, 200]);
      expect(cosineSim(a, b)).toBeCloseTo(1, 4);
    });
  });
estimatedMinutes: 10
difficulty: intermediate
skillAxis: data_prep
