slug: compute-embeddings
lessonSlug: embedding-spaces
title: "Compute Cosine Similarity"
instructions: "Write a function that computes the cosine similarity between two number arrays (vectors). Cosine similarity = dot product of a and b divided by the product of their magnitudes. Return a value between -1 and 1."
starterCode: |
  function cosineSimilarity(a: number[], b: number[]): number {
    // 1. Compute the dot product: sum of a[i] * b[i]
    // 2. Compute magnitude of a: sqrt(sum of a[i]^2)
    // 3. Compute magnitude of b: sqrt(sum of b[i]^2)
    // 4. Return dotProduct / (magnitudeA * magnitudeB)
    return 0; // your code here
  }
solutionCode: |
  function cosineSimilarity(a: number[], b: number[]): number {
    let dot = 0;
    let normA = 0;
    let normB = 0;
    for (let i = 0; i < a.length; i++) {
      dot += a[i] * b[i];
      normA += a[i] * a[i];
      normB += b[i] * b[i];
    }
    return dot / (Math.sqrt(normA) * Math.sqrt(normB));
  }
testCode: |
  describe('cosineSimilarity', () => {
    it('returns 1 for identical vectors', () => {
      const result = cosineSimilarity([1, 2, 3], [1, 2, 3]);
      expect(result).toBeCloseTo(1.0, 5);
    });

    it('returns 1 for scaled vectors', () => {
      const result = cosineSimilarity([1, 0, 0], [5, 0, 0]);
      expect(result).toBeCloseTo(1.0, 5);
    });

    it('returns 0 for orthogonal vectors', () => {
      const result = cosineSimilarity([1, 0], [0, 1]);
      expect(result).toBeCloseTo(0.0, 5);
    });

    it('returns -1 for opposite vectors', () => {
      const result = cosineSimilarity([1, 0], [-1, 0]);
      expect(result).toBeCloseTo(-1.0, 5);
    });

    it('handles longer vectors', () => {
      const a = [1, 2, 3, 4, 5];
      const b = [5, 4, 3, 2, 1];
      const result = cosineSimilarity(a, b);
      expect(result).toBeGreaterThan(0);
      expect(result).toBeLessThan(1);
    });
  });
estimatedMinutes: 7
difficulty: intermediate
