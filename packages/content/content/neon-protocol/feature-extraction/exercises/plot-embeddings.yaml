slug: plot-embeddings
lessonSlug: embedding-spaces
title: "Project Embeddings to 2D for Plotting"
mlContent: data
instructions: "Build `projectTo2D(embeddings, axisA, axisB)` that takes a [N, dim] embedding tensor and two axis indices, and returns a [N, 2] tensor selecting only those two dimensions. Used as a poor-man's projection before PCA/UMAP."
starterCode: |
  function projectTo2D(embeddings, axisA, axisB) {
    return null;
  }
solutionCode: |
  function projectTo2D(embeddings, axisA, axisB) {
    const sliceA = embeddings.slice([0, axisA], [-1, 1]);
    const sliceB = embeddings.slice([0, axisB], [-1, 1]);
    return tf.concat([sliceA, sliceB], 1);
  }
testCode: |
  describe('projectTo2D (real tf.slice + concat)', () => {
    it('returns [N, 2] shape', () => {
      const E = tf.randomNormal([10, 16]);
      const proj = projectTo2D(E, 0, 5);
      expect(proj.shape).toEqual([10, 2]);
    });
    it('selects correct axes', () => {
      const E = tf.tensor2d([[1, 2, 3, 4], [5, 6, 7, 8]]);
      const proj = projectTo2D(E, 0, 2);
      const arr = proj.arraySync();
      expect(arr).toEqual([[1, 3], [5, 7]]);
    });
  });
estimatedMinutes: 10
difficulty: intermediate
skillAxis: data_prep
