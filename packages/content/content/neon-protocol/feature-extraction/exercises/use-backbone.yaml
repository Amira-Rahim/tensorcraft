solutionCode: |
  interface Backbone {
    name: string;
    accuracy: number;
    inferenceMs: number;
    sizeMB: number;
  }

  interface Constraints {
    maxInferenceMs: number;
    maxSizeMB: number;
  }

  function selectBackbone(
    backbones: Backbone[],
    constraints: Constraints
  ): Backbone | null {
    const valid = backbones.filter(
      b => b.inferenceMs <= constraints.maxInferenceMs && b.sizeMB <= constraints.maxSizeMB
    );
    if (valid.length === 0) return null;
    valid.sort((a, b) => b.accuracy - a.accuracy);
    return valid[0];
  }
testCode: |
  describe('selectBackbone', () => {
    const backbones: Backbone[] = [
      { name: 'MobileNetV2', accuracy: 71.8, inferenceMs: 45, sizeMB: 14 },
      { name: 'MobileNetV3', accuracy: 75.2, inferenceMs: 35, sizeMB: 22 },
      { name: 'ResNet50', accuracy: 76.1, inferenceMs: 180, sizeMB: 98 },
      { name: 'EfficientNet-B0', accuracy: 77.1, inferenceMs: 60, sizeMB: 21 },
    ];

    it('selects highest accuracy within constraints', () => {
      const result = selectBackbone(backbones, { maxInferenceMs: 100, maxSizeMB: 50 });
      expect(result!.name).toBe('EfficientNet-B0');
    });

    it('returns null when no backbone qualifies', () => {
      const result = selectBackbone(backbones, { maxInferenceMs: 10, maxSizeMB: 5 });
      expect(result).toBeNull();
    });

    it('respects size constraints', () => {
      const result = selectBackbone(backbones, { maxInferenceMs: 200, maxSizeMB: 15 });
      expect(result!.name).toBe('MobileNetV2');
    });

    it('respects speed constraints', () => {
      const result = selectBackbone(backbones, { maxInferenceMs: 40, maxSizeMB: 100 });
      expect(result!.name).toBe('MobileNetV3');
    });
  });
