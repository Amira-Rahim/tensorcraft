title: "Build a Feature Pipeline"
instructions: "Write a FeaturePipeline class that chains preprocessing, feature extraction, and normalization into a single process method. The constructor takes a config with inputSize ([width, height]) and normalize (boolean). Implement three methods: preprocess (resize a flat pixel array to the target size by sampling), extractFeatures (compute the mean of each channel as a simple feature), and process (run preprocess → extractFeatures → optional L2 normalize, returning the final feature vector). L2 normalization divides each element by the vector's Euclidean magnitude."
