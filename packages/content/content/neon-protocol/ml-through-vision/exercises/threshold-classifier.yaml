slug: threshold-classifier
lessonSlug: np-your-first-classifier
title: "Threshold Classifier on Pixel Tensors"
mlContent: data
instructions: "Build `classifyBrightness(pixels)` that takes a 1D pixel-value tensor (uint8 range 0-255) and returns a string: 'dark' (mean < 64), 'dim' (< 128), 'bright' (< 192), or 'overexposed' (>= 192). Use tf.mean to compute the mean. Then build `measureAccuracy(classifier, testData)` that returns fraction correct over a list of `{ pixels: tf.Tensor, label: string }` samples."
starterCode: |
  function classifyBrightness(pixels) {
    return null;
  }
  function measureAccuracy(classifier, testData) {
    return 0;
  }
solutionCode: |
  function classifyBrightness(pixels) {
    const meanVal = pixels.mean().dataSync()[0];
    if (meanVal < 64) return 'dark';
    if (meanVal < 128) return 'dim';
    if (meanVal < 192) return 'bright';
    return 'overexposed';
  }
  function measureAccuracy(classifier, testData) {
    let correct = 0;
    for (const sample of testData) {
      if (classifier(sample.pixels) === sample.label) correct++;
    }
    return testData.length > 0 ? correct / testData.length : 0;
  }
testCode: |
  describe('classifyBrightness (real tf.mean)', () => {
    it('classifies dark images', () => {
      const pixels = tf.tensor1d([10, 20, 30]);
      expect(classifyBrightness(pixels)).toBe('dark');
    });
    it('classifies dim images', () => {
      const pixels = tf.tensor1d([100, 110, 120]);
      expect(classifyBrightness(pixels)).toBe('dim');
    });
    it('classifies bright images', () => {
      const pixels = tf.tensor1d([150, 160, 170]);
      expect(classifyBrightness(pixels)).toBe('bright');
    });
    it('classifies overexposed images', () => {
      const pixels = tf.tensor1d([200, 220, 240]);
      expect(classifyBrightness(pixels)).toBe('overexposed');
    });
  });

  describe('measureAccuracy', () => {
    it('returns 1.0 for perfect predictions', () => {
      const data = [
        { pixels: tf.tensor1d([10, 20]), label: 'dark' },
        { pixels: tf.tensor1d([200, 210]), label: 'overexposed' },
      ];
      expect(measureAccuracy(classifyBrightness, data)).toBe(1.0);
    });
    it('returns 0.5 for half correct', () => {
      const data = [
        { pixels: tf.tensor1d([10, 20]), label: 'dark' },
        { pixels: tf.tensor1d([10, 20]), label: 'bright' },
      ];
      expect(measureAccuracy(classifyBrightness, data)).toBe(0.5);
    });
  });
