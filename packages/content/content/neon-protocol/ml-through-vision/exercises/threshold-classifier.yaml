solutionCode: |
  function classifyBrightness(pixels: number[]): string {
    const mean = pixels.reduce((sum, p) => sum + p, 0) / pixels.length;
    if (mean < 64) return 'dark';
    if (mean < 128) return 'dim';
    if (mean < 192) return 'bright';
    return 'overexposed';
  }

  function measureAccuracy(
    classifier: (pixels: number[]) => string,
    testData: { pixels: number[]; label: string }[]
  ): number {
    let correct = 0;
    for (const sample of testData) {
      if (classifier(sample.pixels) === sample.label) correct++;
    }
    return correct / testData.length;
  }
testCode: |
  describe('classifyBrightness', () => {
    it('classifies dark images', () => {
      expect(classifyBrightness([10, 20, 30])).toBe('dark');
    });

    it('classifies dim images', () => {
      expect(classifyBrightness([100, 110, 120])).toBe('dim');
    });

    it('classifies bright images', () => {
      expect(classifyBrightness([150, 160, 170])).toBe('bright');
    });

    it('classifies overexposed images', () => {
      expect(classifyBrightness([200, 220, 240])).toBe('overexposed');
    });
  });

  describe('measureAccuracy', () => {
    it('returns 1.0 for perfect predictions', () => {
      const data = [
        { pixels: [10, 20], label: 'dark' },
        { pixels: [200, 210], label: 'overexposed' },
      ];
      expect(measureAccuracy(classifyBrightness, data)).toBe(1.0);
    });

    it('returns 0.5 for half correct', () => {
      const data = [
        { pixels: [10, 20], label: 'dark' },
        { pixels: [10, 20], label: 'bright' },
      ];
      expect(measureAccuracy(classifyBrightness, data)).toBe(0.5);
    });
  });
