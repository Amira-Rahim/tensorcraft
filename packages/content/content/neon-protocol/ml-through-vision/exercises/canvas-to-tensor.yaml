slug: canvas-to-tensor
lessonSlug: seeing-like-a-machine
title: "Convert Canvas Pixels to a Tensor"
instructions: "Build `pixelsToTensor(pixelData, width, height)` that takes a flat Uint8 RGBA array (length = width*height*4), creates an RGB tensor of shape [height, width, 3] (drop alpha channel), and normalizes to [0, 1] (divide by 255). This is the canonical preprocessing for browser-based vision models."
mlContent: data
starterCode: |
  function pixelsToTensor(pixelData, width, height) {
    return null;
  }
solutionCode: |
  function pixelsToTensor(pixelData, width, height) {
    const rgb = [];
    for (let i = 0; i < pixelData.length; i += 4) {
      rgb.push(pixelData[i], pixelData[i + 1], pixelData[i + 2]);
    }
    const t = tf.tensor3d(rgb, [height, width, 3]);
    return t.div(255);
  }
testCode: |
  describe('pixelsToTensor (real tf.tensor3d + div)', () => {
    it('returns shape [height, width, 3] dropping alpha', () => {
      const data = new Uint8Array([255,0,0,255, 0,255,0,255]);   // 2 pixels: red, green
      const t = pixelsToTensor(data, 2, 1);
      expect(t.shape).toEqual([1, 2, 3]);
    });

    it('normalizes to [0,1]', () => {
      const data = new Uint8Array([255, 0, 128, 255]);   // 1 pixel
      const t = pixelsToTensor(data, 1, 1);
      const arr = t.arraySync();
      expect(arr[0][0][0]).toBeCloseTo(1, 4);
      expect(arr[0][0][1]).toBeCloseTo(0, 4);
      expect(arr[0][0][2]).toBeCloseTo(128 / 255, 3);
    });

    it('drops alpha channel entirely', () => {
      const data = new Uint8Array([100, 100, 100, 1]);
      const t = pixelsToTensor(data, 1, 1);
      const arr = t.arraySync();
      expect(arr[0][0].length).toBe(3);
    });
  });
