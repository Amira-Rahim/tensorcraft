solutionCode: |
  interface TensorInfo {
    shape: [number, number, number];
    totalElements: number;
  }

  function describeTensor(width: number, height: number, channels: number): TensorInfo {
    return {
      shape: [height, width, channels],
      totalElements: height * width * channels,
    };
  }
testCode: |
  describe('describeTensor', () => {
    it('returns correct shape for RGB image', () => {
      const info = describeTensor(224, 224, 3);
      expect(info.shape).toEqual([224, 224, 3]);
    });

    it('puts height before width', () => {
      const info = describeTensor(640, 480, 3);
      expect(info.shape[0]).toBe(480);
      expect(info.shape[1]).toBe(640);
    });

    it('calculates total elements', () => {
      const info = describeTensor(224, 224, 3);
      expect(info.totalElements).toBe(224 * 224 * 3);
    });

    it('handles grayscale', () => {
      const info = describeTensor(100, 100, 1);
      expect(info.shape).toEqual([100, 100, 1]);
      expect(info.totalElements).toBe(10000);
    });
  });
