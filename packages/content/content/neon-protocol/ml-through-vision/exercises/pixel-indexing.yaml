solutionCode: |
  interface Pixel {
    x: number;
    y: number;
  }

  function flatToPixel(flatIndex: number, width: number): Pixel {
    const pixelIndex = Math.floor(flatIndex / 4);
    return {
      x: pixelIndex % width,
      y: Math.floor(pixelIndex / width),
    };
  }

  function pixelToFlat(x: number, y: number, width: number): number {
    return (y * width + x) * 4;
  }
testCode: |
  describe('flatToPixel', () => {
    it('converts first pixel', () => {
      expect(flatToPixel(0, 100)).toEqual({ x: 0, y: 0 });
    });

    it('converts within first row', () => {
      expect(flatToPixel(20, 100)).toEqual({ x: 5, y: 0 });
    });

    it('converts to second row', () => {
      expect(flatToPixel(400, 100)).toEqual({ x: 0, y: 1 });
    });
  });

  describe('pixelToFlat', () => {
    it('converts origin', () => {
      expect(pixelToFlat(0, 0, 100)).toBe(0);
    });

    it('converts first row', () => {
      expect(pixelToFlat(5, 0, 100)).toBe(20);
    });

    it('converts second row', () => {
      expect(pixelToFlat(0, 1, 100)).toBe(400);
    });

    it('roundtrips correctly', () => {
      const flat = pixelToFlat(7, 3, 50);
      const pixel = flatToPixel(flat, 50);
      expect(pixel).toEqual({ x: 7, y: 3 });
    });
  });
