slug: channel-analysis
lessonSlug: color-channels
title: "Per-Channel Means with tf.mean"
mlContent: data
instructions: "Build `computeChannelMeans(pixels)` taking an array of [r, g, b] triplets and returning {r, g, b} numbers. Wrap as a tf.tensor2d of shape [n, 3] and use tf.mean across axis 0. Use dataSync to read individual channel values."
starterCode: |
  function computeChannelMeans(pixels) {
    return { r: 0, g: 0, b: 0 };
  }
solutionCode: |
  function computeChannelMeans(pixels) {
    const t = tf.tensor2d(pixels);
    const means = t.mean(0).dataSync();
    return { r: means[0], g: means[1], b: means[2] };
  }
testCode: |
  describe('computeChannelMeans (tf.mean axis 0)', () => {
    it('handles uniform pixels', () => {
      const m = computeChannelMeans([[100, 50, 25], [100, 50, 25]]);
      expect(m.r).toBeCloseTo(100, 4);
      expect(m.g).toBeCloseTo(50, 4);
      expect(m.b).toBeCloseTo(25, 4);
    });
    it('averages varying pixels', () => {
      const m = computeChannelMeans([[0, 0, 0], [100, 200, 50]]);
      expect(m.r).toBeCloseTo(50, 4);
      expect(m.g).toBeCloseTo(100, 4);
      expect(m.b).toBeCloseTo(25, 4);
    });
  });
estimatedMinutes: 8
difficulty: beginner
skillAxis: data_prep
