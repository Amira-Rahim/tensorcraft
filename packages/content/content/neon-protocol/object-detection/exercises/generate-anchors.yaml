slug: generate-anchors
lessonSlug: anchor-boxes
title: "Generate Anchor Boxes for the City Grid"
instructions: "The Neon Protocol detection system scans the city grid using anchor boxes at multiple scales. Implement generateAnchors that takes gridSize (number of cells along one axis), imageSize (pixel dimension, assume square image), and scales (an array of box size multipliers). For each grid cell (row, col) and each scale, generate an anchor box centered on that cell. The cell center is computed as ((col + 0.5) * stride, (row + 0.5) * stride) where stride = imageSize / gridSize. The anchor width and height are both stride * scale. Return a tf.Tensor with shape [gridSize * gridSize * scales.length, 4] where each row is [centerX, centerY, anchorWidth, anchorHeight]."
starterCode: |
  function generateAnchors(
    gridSize: number,
    imageSize: number,
    scales: number[]
  ): tf.Tensor2D {
    // stride = imageSize / gridSize
