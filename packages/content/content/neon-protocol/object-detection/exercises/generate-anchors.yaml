solutionCode: |
  function generateAnchors(
    gridSize: number,
    imageSize: number,
    scales: number[]
  ): tf.Tensor2D {
    const stride = imageSize / gridSize;
    const anchors: number[][] = [];

    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const cx = (col + 0.5) * stride;
        const cy = (row + 0.5) * stride;
        for (const scale of scales) {
          const w = stride * scale;
          const h = stride * scale;
          anchors.push([cx, cy, w, h]);
        }
      }
    }

    return tf.tensor2d(anchors, [gridSize * gridSize * scales.length, 4]);
  }
testCode: |
  describe('generateAnchors', () => {
    afterEach(() => tf.disposeVariables());

    it('returns correct shape for 2x2 grid with 2 scales', () => {
      const result = generateAnchors(2, 416, [1, 2]);
      expect(result.shape).toEqual([8, 4]);
      result.dispose();
    });

    it('returns correct shape for 3x3 grid with 3 scales', () => {
      const result = generateAnchors(3, 416, [0.5, 1, 1.5]);
      expect(result.shape).toEqual([27, 4]);
      result.dispose();
    });

    it('computes correct center for top-left cell', () => {
      const result = generateAnchors(2, 100, [1]);
      const data = result.arraySync();
      expect(data[0][0]).toBeCloseTo(25, 1);
      expect(data[0][1]).toBeCloseTo(25, 1);
      result.dispose();
    });

    it('computes correct anchor dimensions with scale', () => {
      const result = generateAnchors(2, 100, [1, 2]);
      const data = result.arraySync();
      expect(data[0][2]).toBeCloseTo(50, 1);
      expect(data[0][3]).toBeCloseTo(50, 1);
      expect(data[1][2]).toBeCloseTo(100, 1);
      expect(data[1][3]).toBeCloseTo(100, 1);
      result.dispose();
    });

    it('generates anchors in row-major order', () => {
      const result = generateAnchors(2, 100, [1]);
      const data = result.arraySync();
      expect(data[0][0]).toBeCloseTo(25, 1);
      expect(data[1][0]).toBeCloseTo(75, 1);
      expect(data[2][0]).toBeCloseTo(25, 1);
      expect(data[3][0]).toBeCloseTo(75, 1);
      result.dispose();
    });
  });
