solutionCode: |
  interface Box {
    x: number;
    y: number;
    width: number;
    height: number;
  }

  function toNormalized(
    pixelBox: Box,
    imageWidth: number,
    imageHeight: number
  ): Box {
    return {
      x: pixelBox.x / imageWidth,
      y: pixelBox.y / imageHeight,
      width: pixelBox.width / imageWidth,
      height: pixelBox.height / imageHeight,
    };
  }

  function toPixels(
    normalizedBox: Box,
    imageWidth: number,
    imageHeight: number
  ): Box {
    return {
      x: normalizedBox.x * imageWidth,
      y: normalizedBox.y * imageHeight,
      width: normalizedBox.width * imageWidth,
      height: normalizedBox.height * imageHeight,
    };
  }
testCode: |
  describe('Bounding Box Conversion', () => {
    describe('toNormalized', () => {
      it('converts pixel coordinates to normalized', () => {
        const box = { x: 320, y: 240, width: 160, height: 120 };
        const result = toNormalized(box, 640, 480);
        expect(result.x).toBeCloseTo(0.5);
        expect(result.y).toBeCloseTo(0.5);
        expect(result.width).toBeCloseTo(0.25);
        expect(result.height).toBeCloseTo(0.25);
      });

      it('handles origin box', () => {
        const box = { x: 0, y: 0, width: 640, height: 480 };
        const result = toNormalized(box, 640, 480);
        expect(result.x).toBe(0);
        expect(result.y).toBe(0);
        expect(result.width).toBeCloseTo(1);
        expect(result.height).toBeCloseTo(1);
      });
    });

    describe('toPixels', () => {
      it('converts normalized coordinates to pixels', () => {
        const box = { x: 0.5, y: 0.5, width: 0.25, height: 0.25 };
        const result = toPixels(box, 640, 480);
        expect(result.x).toBeCloseTo(320);
        expect(result.y).toBeCloseTo(240);
        expect(result.width).toBeCloseTo(160);
        expect(result.height).toBeCloseTo(120);
      });

      it('scales to different resolutions', () => {
        const box = { x: 0.5, y: 0.5, width: 0.25, height: 0.25 };
        const result = toPixels(box, 1920, 1080);
        expect(result.x).toBeCloseTo(960);
        expect(result.y).toBeCloseTo(540);
        expect(result.width).toBeCloseTo(480);
        expect(result.height).toBeCloseTo(270);
      });
    });

    describe('roundtrip', () => {
      it('converts to normalized and back without loss', () => {
        const original = { x: 100, y: 200, width: 50, height: 75 };
        const normalized = toNormalized(original, 640, 480);
        const restored = toPixels(normalized, 640, 480);
        expect(restored.x).toBeCloseTo(original.x);
        expect(restored.y).toBeCloseTo(original.y);
        expect(restored.width).toBeCloseTo(original.width);
        expect(restored.height).toBeCloseTo(original.height);
      });
    });
  });
