solutionCode: |
  interface Detection {
    box: [number, number, number, number];
    score: number;
    label: string;
  }

  function computeIoU(
    boxA: [number, number, number, number],
    boxB: [number, number, number, number]
  ): number {
    const interX1 = Math.max(boxA[0], boxB[0]);
    const interY1 = Math.max(boxA[1], boxB[1]);
    const interX2 = Math.min(boxA[2], boxB[2]);
    const interY2 = Math.min(boxA[3], boxB[3]);

    const interW = Math.max(0, interX2 - interX1);
    const interH = Math.max(0, interY2 - interY1);
    const interArea = interW * interH;

    const areaA = (boxA[2] - boxA[0]) * (boxA[3] - boxA[1]);
    const areaB = (boxB[2] - boxB[0]) * (boxB[3] - boxB[1]);
    const unionArea = areaA + areaB - interArea;

    return unionArea === 0 ? 0 : interArea / unionArea;
  }

  function applyNMS(
    detections: Detection[],
    iouThreshold: number
  ): Detection[] {
    const sorted = [...detections].sort((a, b) => b.score - a.score);
    const kept: Detection[] = [];

    for (const det of sorted) {
      let shouldKeep = true;
      for (const keptDet of kept) {
        if (computeIoU(det.box, keptDet.box) > iouThreshold) {
          shouldKeep = false;
          break;
        }
      }
      if (shouldKeep) {
        kept.push(det);
      }
    }

    return kept;
  }
testCode: |
  describe('applyNMS', () => {
    it('keeps single detection unchanged', () => {
      const dets: Detection[] = [
        { box: [0, 0, 10, 10], score: 0.9, label: 'drone' }
      ];
      const result = applyNMS(dets, 0.5);
      expect(result.length).toBe(1);
      expect(result[0].score).toBe(0.9);
    });

    it('suppresses overlapping lower-score detection', () => {
      const dets: Detection[] = [
        { box: [0, 0, 10, 10], score: 0.9, label: 'drone' },
        { box: [1, 1, 11, 11], score: 0.7, label: 'drone' },
      ];
      const result = applyNMS(dets, 0.5);
      expect(result.length).toBe(1);
      expect(result[0].score).toBe(0.9);
    });

    it('keeps non-overlapping detections', () => {
      const dets: Detection[] = [
        { box: [0, 0, 10, 10], score: 0.9, label: 'drone' },
        { box: [50, 50, 60, 60], score: 0.8, label: 'vehicle' },
      ];
      const result = applyNMS(dets, 0.5);
      expect(result.length).toBe(2);
    });

    it('returns detections sorted by score descending', () => {
      const dets: Detection[] = [
        { box: [50, 50, 60, 60], score: 0.6, label: 'vehicle' },
        { box: [0, 0, 10, 10], score: 0.95, label: 'drone' },
        { box: [200, 200, 220, 220], score: 0.8, label: 'person' },
      ];
      const result = applyNMS(dets, 0.5);
      expect(result[0].score).toBe(0.95);
      expect(result[1].score).toBe(0.8);
      expect(result[2].score).toBe(0.6);
    });

    it('handles three overlapping detections correctly', () => {
      const dets: Detection[] = [
        { box: [0, 0, 10, 10], score: 0.5, label: 'drone' },
        { box: [0, 0, 10, 10], score: 0.9, label: 'drone' },
        { box: [0, 0, 10, 10], score: 0.7, label: 'drone' },
      ];
      const result = applyNMS(dets, 0.5);
      expect(result.length).toBe(1);
      expect(result[0].score).toBe(0.9);
    });

    it('returns empty array for empty input', () => {
      const result = applyNMS([], 0.5);
      expect(result.length).toBe(0);
    });
  });
