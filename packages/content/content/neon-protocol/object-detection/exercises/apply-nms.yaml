title: "Apply Non-Max Suppression to Filter Duplicate Targets"
instructions: "Neon Protocol's sensor array generates redundant detections for the same target. Implement applyNMS that takes an array of detections (each with { box: [x1, y1, x2, y2], score: number, label: string }) and an iouThreshold. The function should: (1) sort detections by score in descending order, (2) iterate through detections, keeping a detection only if its IoU with all previously kept detections is below iouThreshold, (3) return the filtered array. Implement a helper computeIoU(boxA, boxB) that takes two [x1, y1, x2, y2] arrays and returns the IoU as a number."
