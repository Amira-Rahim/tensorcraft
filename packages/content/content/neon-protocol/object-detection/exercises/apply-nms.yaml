title: "Apply Non-Max Suppression"
instructions: "Implement the nms function that takes an array of Detection objects (each with box in [xmin, ymin, xmax, ymax] format, confidence score, and label) and an iouThreshold. Sort detections by confidence (highest first). Keep the top detection, suppress any remaining detections that overlap it with IoU >= threshold, then repeat for the next unsuppressed detection. Return the array of kept detections."
