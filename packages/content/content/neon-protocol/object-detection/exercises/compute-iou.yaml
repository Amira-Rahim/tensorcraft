title: "Compute IoU for Overlapping Detections"
instructions: "When multiple cameras in Neon Protocol's network detect the same target, we need to measure how much their bounding boxes overlap. Implement computeIoU that takes two bounding boxes in [x1, y1, x2, y2] format (top-left and bottom-right corners) as tf.Tensor1D inputs and returns a scalar tf.Tensor with the Intersection over Union value. IoU = area of intersection / area of union. If the boxes do not overlap, return 0. Use TensorFlow.js tensor operations (tf.maximum, tf.minimum, tf.mul, tf.sub, tf.div) rather than extracting values to JavaScript."
