solutionCode: |
  function buildYoloHead(
    inputShape: [number, number, number],
    numClasses: number
  ): tf.LayersModel {
    const input = tf.input({ shape: inputShape });

    let x = tf.layers.conv2d({
      filters: 128,
      kernelSize: 3,
      padding: 'same',
      activation: 'relu',
    }).apply(input) as tf.SymbolicTensor;

    const output = tf.layers.conv2d({
      filters: 5 + numClasses,
      kernelSize: 1,
      padding: 'same',
      activation: 'linear',
    }).apply(x) as tf.SymbolicTensor;

    return tf.model({ inputs: input, outputs: output });
  }

  function decodeYoloOutput(
    rawOutput: tf.Tensor4D,
    numClasses: number
  ): { boxes: tf.Tensor; objectness: tf.Tensor; classScores: tf.Tensor } {
    return tf.tidy(() => {
      const boxes = rawOutput.slice([0, 0, 0, 0], [-1, -1, -1, 4]);
      const objectness = rawOutput.slice([0, 0, 0, 4], [-1, -1, -1, 1]);
      const classScores = rawOutput.slice([0, 0, 0, 5], [-1, -1, -1, numClasses]);
      return { boxes, objectness, classScores };
    });
  }
testCode: |
  describe('buildYoloHead', () => {
    afterEach(() => tf.disposeVariables());

    it('returns a tf.LayersModel', () => {
      const model = buildYoloHead([13, 13, 256], 3);
      expect(model).toBeDefined();
      expect(model.predict).toBeDefined();
      model.dispose();
    });

    it('output shape is [1, gridH, gridW, 5 + numClasses]', () => {
      const model = buildYoloHead([7, 7, 128], 5);
      const input = tf.randomNormal([1, 7, 7, 128]);
      const output = model.predict(input) as tf.Tensor;
      expect(output.shape).toEqual([1, 7, 7, 10]);
      input.dispose(); output.dispose(); model.dispose();
    });
  });

  describe('decodeYoloOutput', () => {
    afterEach(() => tf.disposeVariables());

    it('splits into boxes, objectness, and classScores tensors', () => {
      const raw = tf.randomNormal([1, 7, 7, 8]) as tf.Tensor4D;
      const { boxes, objectness, classScores } = decodeYoloOutput(raw, 3);
      expect(boxes.shape).toEqual([1, 7, 7, 4]);
      expect(objectness.shape).toEqual([1, 7, 7, 1]);
      expect(classScores.shape).toEqual([1, 7, 7, 3]);
      raw.dispose(); boxes.dispose(); objectness.dispose(); classScores.dispose();
    });

    it('preserves numeric data after split', () => {
      const data = new Float32Array(1 * 2 * 2 * 6).fill(0);
      data[0] = 1; data[1] = 2; data[2] = 3; data[3] = 4; data[4] = 5; data[5] = 6;
      const raw = tf.tensor4d(data, [1, 2, 2, 6]);
      const { boxes, objectness, classScores } = decodeYoloOutput(raw, 1);
      expect(Array.from(boxes.dataSync()).slice(0, 4)).toEqual([1, 2, 3, 4]);
      expect(objectness.dataSync()[0]).toBeCloseTo(5, 5);
      expect(classScores.dataSync()[0]).toBeCloseTo(6, 5);
      raw.dispose(); boxes.dispose(); objectness.dispose(); classScores.dispose();
    });
  });
