title: "Build a YOLO Detection Head"
instructions: "Neon Protocol's real-time threat detection uses a YOLO-style architecture. Implement buildYoloHead that takes an input shape [gridH, gridW, channels] and numClasses, then returns a tf.LayersModel. The detection head should: (1) apply a 2D convolution with 128 filters, 3x3 kernel, 'same' padding, and 'relu' activation, (2) apply a second 2D convolution with (5 + numClasses) filters, 1x1 kernel, 'same' padding, and no activation (linear). The output shape should be [null, gridH, gridW, 5 + numClasses] where the 5 values are [tx, ty, tw, th, objectness] and the remaining values are class scores. Also implement decodeYoloOutput that takes a raw output tf.Tensor of shape [1, gridH, gridW, 5 + numClasses] and returns an object { boxes: tf.Tensor, objectness: tf.Tensor, classScores: tf.Tensor } by splitting the last axis using tf.slice."
