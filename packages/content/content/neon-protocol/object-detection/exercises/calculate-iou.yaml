solutionCode: |
  function computeIoU(boxA: number[], boxB: number[]): number {
    const interLeft = Math.max(boxA[0], boxB[0]);
    const interTop = Math.max(boxA[1], boxB[1]);
    const interRight = Math.min(boxA[2], boxB[2]);
    const interBottom = Math.min(boxA[3], boxB[3]);

    const interWidth = Math.max(0, interRight - interLeft);
    const interHeight = Math.max(0, interBottom - interTop);
    const interArea = interWidth * interHeight;

    const areaA = (boxA[2] - boxA[0]) * (boxA[3] - boxA[1]);
    const areaB = (boxB[2] - boxB[0]) * (boxB[3] - boxB[1]);
    const unionArea = areaA + areaB - interArea;

    if (unionArea === 0) return 0;
    return interArea / unionArea;
  }
testCode: |
  describe('computeIoU', () => {
    it('returns 1 for identical boxes', () => {
      const box = [0.2, 0.2, 0.8, 0.8];
      expect(computeIoU(box, box)).toBeCloseTo(1.0);
    });

    it('returns 0 for non-overlapping boxes', () => {
      const boxA = [0.0, 0.0, 0.3, 0.3];
      const boxB = [0.5, 0.5, 0.8, 0.8];
      expect(computeIoU(boxA, boxB)).toBe(0);
    });

    it('computes partial overlap correctly', () => {
      const boxA = [0.0, 0.0, 0.5, 0.5];
      const boxB = [0.25, 0.25, 0.75, 0.75];
      // Intersection: [0.25, 0.25, 0.5, 0.5] = 0.25 * 0.25 = 0.0625
      // areaA = 0.25, areaB = 0.25
      // Union = 0.25 + 0.25 - 0.0625 = 0.4375
      // IoU = 0.0625 / 0.4375 = ~0.143
      const iou = computeIoU(boxA, boxB);
      expect(iou).toBeCloseTo(0.143, 2);
    });

    it('handles one box inside the other', () => {
      const outer = [0.0, 0.0, 1.0, 1.0];
      const inner = [0.25, 0.25, 0.75, 0.75];
      // Intersection = inner area = 0.25
      // Union = 1.0 + 0.25 - 0.25 = 1.0
      // IoU = 0.25
      expect(computeIoU(outer, inner)).toBeCloseTo(0.25);
    });

    it('is commutative', () => {
      const boxA = [0.1, 0.2, 0.6, 0.7];
      const boxB = [0.3, 0.3, 0.8, 0.9];
      expect(computeIoU(boxA, boxB)).toBeCloseTo(computeIoU(boxB, boxA));
    });

    it('returns 0 for zero-area box', () => {
      const boxA = [0.5, 0.5, 0.5, 0.5];
      const boxB = [0.0, 0.0, 1.0, 1.0];
      expect(computeIoU(boxA, boxB)).toBe(0);
    });
  });
