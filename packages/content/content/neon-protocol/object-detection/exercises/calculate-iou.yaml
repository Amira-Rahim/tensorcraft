title: "Calculate Intersection over Union"
instructions: "Implement a computeIoU function that calculates the Intersection over Union between two bounding boxes. Both boxes are in [xmin, ymin, xmax, ymax] format. Find the intersection rectangle by taking the max of left edges and min of right edges (clamp to 0 if no overlap). IoU = intersection area / union area, where union = areaA + areaB - intersection. Return 0 if union is 0."
