title: "Read the Model's Reply"
instructions: |
  Write analyzeSignal(prompt, apiCall). Call the API once with the supplied prompt. Extract and parse its JSON object, then validate the parsed fields before returning it. Throw on invalid JSON or an invalid field.

  The reply contains one JSON object, optionally surrounded by prose without other braces. classification must be 'noise', 'anomaly' or 'unknown'. confidence must be a finite number from 0 to 1 inclusive. reasoning must be a non-empty string after trimming whitespace. Zero is a valid confidence, and additional fields are allowed. Do not coerce strings or null into numbers.

  These checks establish the response shape. They do not establish factual accuracy or calibrate the model's self-reported confidence.
starterCode: |
  interface Analysis {
    classification: string;
    confidence: number;
    reasoning: string;
  }

  async function analyzeSignal(prompt: string, apiCall: (p: string) => Promise<string>): Promise<Analysis> {
    // apiCall answers with text, and text is not an analysis yet. Decide what
    // has to be true of the reply before this function calls it an analysis.
    return null; // your code here
  }
solutionCode: |
  interface Analysis {
    classification: string;
    confidence: number;
    reasoning: string;
  }

  async function analyzeSignal(prompt: string, apiCall: (p: string) => Promise<string>): Promise<Analysis> {
    const response = await apiCall(prompt);
    const jsonMatch = response.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('No JSON in response');
    const parsed = JSON.parse(jsonMatch[0]);
    if (!['noise', 'anomaly', 'unknown'].includes(parsed.classification) || !Number.isFinite(parsed.confidence) || parsed.confidence < 0 || parsed.confidence > 1 || typeof parsed.reasoning !== 'string' || parsed.reasoning.trim().length === 0) {
      throw new Error('Invalid analysis fields');
    }
    return parsed as Analysis;
  }
testCode: |
  describe('analyzeSignal', () => {
    const mockApi = async () => '{"classification":"anomaly","confidence":0.95,"reasoning":"High amplitude"}';
    const analysisFrom = async (api, prompt) => {
      const result = await analyzeSignal(prompt, api);
      expect(
        result,
        'The client has to hand back the analysis it read out of the reply. While it returns null there is no classification for anything downstream to act on.',
      ).toBeDefined();
      return result;
    };
    // Replies are BUILT at grade time, never listed. A table keyed on the reply
    // string cleared every fixed-literal version of this suite, including the
    // test named for catching exactly that.
    const draw = () => ({
      classification: ['noise', 'anomaly', 'unknown'][Math.floor(Math.random() * 3)],
      confidence: Math.round(Math.random() * 1000) / 1000,
      reasoning:
        'capture ' + (1000 + Math.floor(Math.random() * 9000)) +
        ', band ' + (1 + Math.floor(Math.random() * 9)),
    });
    const wrap = (json, i) =>
      i % 3 === 0
        ? json
        : i % 3 === 1
          ? 'Here is the analysis you asked for.\n' + json + '\nHappy to revise.'
          : 'Assessment follows.\n\n' + json;

    it('calls the API with the prompt it was handed, and reports that reply', async () => {
      const seen = [];
      const api = async (p) => {
        seen.push(p);
        return '{"classification":"anomaly","confidence":0.95,"reasoning":"High amplitude"}';
      };
      const result = await analysisFrom(api, 'classify capture 7741');
      expect(
        seen,
        'The analysis has to come from calling apiCall with the prompt you were given, not from a string you kept.',
      ).toEqual(['classify capture 7741']);
      expect(result.classification).toBe('anomaly');
    });
    it('hands back a numeric confidence', async () => {
      const result = await analysisFrom(mockApi, 'test');
      expect(typeof result.confidence).toBe('number');
    });
    it('throws on invalid JSON', async () => {
      const badApi = async () => 'not json';
      await expect(
        analyzeSignal('test', badApi),
        'A reply with no object in it is not an analysis. Refuse it here, or the caller gets a half-built object wearing the Analysis type.',
      ).rejects.toThrow();
    });
    it('throws on valid JSON that leaves out a required field (validation, not just parsing)', async () => {
      const missingReasoning = async () => '{"classification":"anomaly","confidence":0.95}';
      await expect(
        analyzeSignal('test', missingReasoning),
        'Valid JSON can still lack required fields. Check reasoning and classification after parsing.',
      ).rejects.toThrow();
      const missingClassification = async () => '{"confidence":0.95,"reasoning":"High amplitude"}';
      await expect(analyzeSignal('test', missingClassification)).rejects.toThrow();
    });
    it('rejects a reply that renames a field, even when the field count looks right', async () => {
      const renamed = async () => '{"classification":"anomaly","confidence":0.9,"explanation":"High amplitude"}';
      await expect(
        analyzeSignal('test', renamed),
        'Three fields arrived and one of them is not a field you asked for. Counting keys cannot see that; checking the names can.',
      ).rejects.toThrow();
    });
    it('treats a confidence of zero like any other reading, not a missing field', async () => {
      const flat = async () =>
        '{"classification":"noise","confidence":0,"reasoning":"Every dial reads inside the natural band"}';
      const result = await analysisFrom(flat, 'test');
      expect(
        result.confidence,
        'A model reporting zero confidence has answered you. A field is missing only when it is absent, so test for absence rather than for truthiness.',
      ).toBe(0);
      expect(result.classification).toBe('noise');
      expect(result.reasoning).toBe('Every dial reads inside the natural band');
    });
    it('accepts a reply that carries more fields than the three it needs', async () => {
      const verbose = async () =>
        '{"classification":"unknown","confidence":0.11,"reasoning":"Two channels dropped mid-capture","model":"scan-7","tokens":184}';
      const result = await analysisFrom(verbose, 'test');
      expect(
        result.classification,
        'A model that volunteers extra fields has still answered the question. Check for the fields you need instead of counting how many arrived.',
      ).toBe('unknown');
      expect(result.confidence).toBe(0.11);
      expect(result.reasoning).toBe('Two channels dropped mid-capture');
    });
    it('finds the JSON block in a reply wrapped in prose', async () => {
      const chatty = async () =>
        'Here is my analysis:\n{"classification":"anomaly","confidence":0.95,"reasoning":"High amplitude"}\nLet me know if you need more detail.';
      const result = await analysisFrom(chatty, 'test');
      expect(
        result.classification,
        'Models answer in sentences. The object is in there, with prose on both sides of it.',
      ).toBe('anomaly');
      expect(result.confidence).toBe(0.95);
    });
    it('throws when confidence is the only field missing', async () => {
      const noConfidence = async () => '{"classification":"anomaly","reasoning":"High amplitude"}';
      await expect(
        analyzeSignal('test', noConfidence),
        'The contract requires a confidence field. Reject a missing field; a supplied score still needs calibration before probability-based use.',
      ).rejects.toThrow();
    });
    it('checks the parsed object, not the prose around it', async () => {
      const namesItInProse = async () =>
        'Reasoning: the 73.4 Hz tone matches no natural band.\n{"classification":"anomaly","confidence":0.88}';
      await expect(
        analyzeSignal('test', namesItInProse),
        'Check the parsed reasoning property. Mentioning it in the surrounding prose does not supply the field.',
      ).rejects.toThrow();
      const talksAboutConfidence = async () =>
        'My confidence here is low.\n{"classification":"noise","reasoning":"Zero crossings sit inside the natural band"}';
      await expect(analyzeSignal('test', talksAboutConfidence)).rejects.toThrow();
      // The field name INSIDE the braces, as another key's value. A check
      // that string-searches the extracted JSON block for the three names
      // finds all three here and hands back an analysis with no reasoning.
      const namesItInsideTheObject = async () =>
        '{"classification":"anomaly","confidence":0.88,"note":"reasoning withheld pending review"}';
      await expect(
        analyzeSignal('test', namesItInsideTheObject),
        'A note containing the word reasoning does not supply a reasoning property.',
      ).rejects.toThrow();
      const renamedInsideAValue = async () =>
        '{"classification":"noise","reasoning":"confidence is low on this one"}';
      await expect(
        analyzeSignal('test', renamedInsideAValue),
        'Check the confidence property itself, not a mention inside another value.',
      ).rejects.toThrow();
    });
    it('refuses a reply whose object never parses, however complete it reads', async () => {
      const trailingComma = async () =>
        '{"classification":"anomaly","confidence":0.95,"reasoning":"High amplitude",}';
      await expect(
        analyzeSignal('test', trailingComma),
        'The trailing comma makes this invalid JSON. Parse the complete object before validating fields.',
      ).rejects.toThrow();
      const cutOff = async () =>
        'Assessment follows.\n{"classification":"noise","confidence":0.2,"reasoning":"Zero crossings sit inside the natural band"';
      await expect(
        analyzeSignal('test', cutOff),
        'Reject this truncated object rather than scraping its fields from incomplete text.',
      ).rejects.toThrow();
    });
    it('reads replies built at grade time, field for field', async () => {
      for (let i = 0; i < 9; i += 1) {
        const drawn = draw();
        const raw = wrap(JSON.stringify(drawn), i);
        const result = await analysisFrom(async () => raw, 'classify capture ' + i);
        expect(
          result.classification,
          'Return the values from the supplied reply, including when they change.',
        ).toBe(drawn.classification);
        expect(result.confidence).toBe(drawn.confidence);
        expect(result.reasoning).toBe(drawn.reasoning);
      }
    });
    it('refuses a reply built at grade time with one field taken out, whichever field it is', async () => {
      for (const missing of ['classification', 'confidence', 'reasoning']) {
        for (let i = 0; i < 3; i += 1) {
          const drawn = draw();
          delete drawn[missing];
          const raw = wrap(JSON.stringify(drawn), i);
          await expect(
            analyzeSignal('test', async () => raw),
            'One of the three fields is gone from this object and the other two are fine. Which one it is changes between runs, so the check has to name all three.',
          ).rejects.toThrow();
        }
      }
    });
  });

  it('rejects invalid confidence types and range', async () => {
    for (const confidence of [null, '0.7', -0.1, 1.1])
      await expect(
        analyzeSignal('x', async () =>
          JSON.stringify({ classification: 'noise', confidence, reasoning: 'x' }),
        ),
      ).rejects.toThrow();
  });
  it('rejects invalid classes and explanations', async () => {
    for (const patch of [
      { classification: 'alien' },
      { classification: 1 },
      { reasoning: 1 },
      { reasoning: '  ' },
      { reasoning: [] },
    ])
      await expect(
        analyzeSignal('x', async () =>
          JSON.stringify({ classification: 'noise', confidence: 0.4, reasoning: 'x', ...patch }),
        ),
      ).rejects.toThrow();
  });
estimatedMinutes: 10
