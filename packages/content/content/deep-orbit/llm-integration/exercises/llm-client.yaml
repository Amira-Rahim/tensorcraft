title: "Read the Model's Reply"
instructions: |
  Write analyzeSignal(prompt, apiCall). Call apiCall once with the supplied prompt. Find its JSON object, parse it, and check the required fields before returning the result. Throw an error if the JSON or a required field is invalid.

  For this exercise, the reply contains one JSON object. It may have text around it, but that text contains no other braces.

  Check these fields:
  - classification must be 'noise', 'anomaly', or 'unknown'.
  - confidence must be a finite number from 0 to 1 inclusive. Zero is valid. Do not convert strings or null into numbers.
  - reasoning must be a string with at least one non-whitespace character.

  Extra fields are allowed. These checks verify the reply's structure. They do not prove its claims are true or that its confidence score is a reliable probability.
