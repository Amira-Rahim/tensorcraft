solutionCode: |
  interface Analysis {
    classification: string;
    confidence: number;
    reasoning: string;
  }

  async function analyzeSignal(prompt: string, apiCall: (p: string) => Promise<string>): Promise<Analysis> {
    const response = await apiCall(prompt);
    const jsonMatch = response.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('No JSON in response');
    const parsed = JSON.parse(jsonMatch[0]);
    if (!parsed.classification || parsed.confidence === undefined || !parsed.reasoning) {
      throw new Error('Missing required fields');
    }
    return parsed as Analysis;
  }
testCode: |
  describe('analyzeSignal', () => {
    const mockApi = async () => '{"classification":"anomaly","confidence":0.95,"reasoning":"High amplitude"}';
    it('returns an analysis object', async () => {
      const result = await analyzeSignal('test', mockApi);
      expect(result.classification).toBe('anomaly');
    });
    it('parses confidence as number', async () => {
      const result = await analyzeSignal('test', mockApi);
      expect(typeof result.confidence).toBe('number');
    });
    it('throws on invalid JSON', async () => {
      const badApi = async () => 'not json';
      await expect(analyzeSignal('test', badApi)).rejects.toThrow();
    });
    it('throws on valid JSON missing a required field (validation, not just parsing)', async () => {
      const missingReasoning = async () => '{"classification":"anomaly","confidence":0.95}';
      await expect(analyzeSignal('test', missingReasoning)).rejects.toThrow();
      const missingClassification = async () => '{"confidence":0.95,"reasoning":"High amplitude"}';
      await expect(analyzeSignal('test', missingClassification)).rejects.toThrow();
    });
    it('finds the JSON block in a reply wrapped in prose', async () => {
      const chatty = async () =>
        'Here is my analysis:\n{"classification":"anomaly","confidence":0.95,"reasoning":"High amplitude"}\nLet me know if you need more detail.';
      const result = await analyzeSignal('test', chatty);
      expect(result.classification).toBe('anomaly');
      expect(result.confidence).toBe(0.95);
    });
    it('throws when confidence is the only field missing', async () => {
      const noConfidence = async () => '{"classification":"anomaly","reasoning":"High amplitude"}';
      await expect(analyzeSignal('test', noConfidence)).rejects.toThrow();
    });
    it('reports what the model actually said, not a memorized answer', async () => {
      const quiet = async () =>
        '{"classification":"noise","confidence":0.37,"reasoning":"Zero crossings sit inside the natural band"}';
      const result = await analyzeSignal('test', quiet);
      expect(result.classification).toBe('noise');
      expect(result.confidence).toBe(0.37);
      expect(result.reasoning).toBe('Zero crossings sit inside the natural band');
    });
    it('reads a third reply, wrapped in prose, field for field', async () => {
      const wrapped = async () =>
        'Assessment follows.\n{"classification":"unknown","confidence":0.08,"reasoning":"Two channels dropped mid-capture"}\nHappy to revise.';
      const result = await analyzeSignal('test', wrapped);
      expect(result.classification).toBe('unknown');
      expect(result.confidence).toBe(0.08);
      expect(result.reasoning).toBe('Two channels dropped mid-capture');
    });
  });
