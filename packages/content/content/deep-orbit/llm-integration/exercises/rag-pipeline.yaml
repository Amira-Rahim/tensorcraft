testCode: |
  describe('Structured claim verification', () => {
    const records = [
      { id: 'a', eventCount: 14, frequencyHz: 73.4, intervalSeconds: 61.2 },
      { id: 'b', eventCount: 3, frequencyHz: 14, intervalSeconds: 29.7 },
    ];
    // The synthetic interval fixture is 61.2 seconds; it is not a live clock.
    const reading = (id, patch = {}) => ({
      id,
      kind: 'reading',
      rowIds: ['a'],
      field: 'frequencyHz',
      value: 73.4,
      unit: 'Hz',
      ...patch,
    });
    const check = (claims, rows = records) => {
      const result = verifyClaims(claims, rows);
      expect(result, 'Return verified and unverified lists of claim IDs.').toBeDefined();
      return result;
    };
    it('matches a field in the cited row and keeps claim order', () => {
      const result = check([
        reading('frequency'),
        reading('wrong', { value: 80 }),
        reading('count', { field: 'eventCount', value: 14, unit: 'events' }),
        reading('missing', { rowIds: ['absent'] }),
      ]);
      expect(result).toEqual({ verified: ['frequency', 'count'], unverified: ['wrong', 'missing'] });
    });
    it('rejects swapped fields even when both numbers appear in the evidence', () => {
      const result = check([
        reading('swapped-count', { field: 'eventCount', value: 73.4, unit: 'events' }),
        reading('swapped-frequency', { value: 14 }),
      ]);
      expect(result).toEqual({ verified: [], unverified: ['swapped-count', 'swapped-frequency'] });
    });
    it('does not borrow a value from a different row', () => {
      expect(check([reading('wrong-source', { rowIds: ['b'] })])).toEqual({
        verified: [],
        unverified: ['wrong-source'],
      });
    });
    it('requires the declared unit without implicit conversion', () => {
      expect(check([reading('unit', { unit: 'kHz' })])).toEqual({
        verified: [],
        unverified: ['unit'],
      });
    });
    it('uses each fields tolerance and includes its boundary', () => {
      const result = check([
        reading('rounded', { value: 73.44 }),
        reading('boundary', { value: 73.45 }),
        reading('too-far', { value: 73.451 }),
        reading('count-exact', { field: 'eventCount', value: 14, unit: 'events' }),
        reading('count-rounded', { field: 'eventCount', value: 14.04, unit: 'events' }),
        reading('interval', { field: 'intervalSeconds', value: 61.24, unit: 's' }),
      ]);
      expect(result).toEqual({
        verified: ['rounded', 'boundary', 'count-exact', 'interval'],
        unverified: ['too-far', 'count-rounded'],
      });
    });
    it('allows a sum of cited event counts, not a guessed total or other operation', () => {
      const sum = reading('sum', {
        kind: 'sum',
        rowIds: ['a', 'b'],
        field: 'eventCount',
        value: 17,
        unit: 'events',
      });
      expect(
        check([
          sum,
          { ...sum, id: 'wrong-total', value: 14 },
          { ...sum, id: 'double-count', rowIds: ['a', 'a'], value: 28 },
          { ...sum, id: 'missing-source', rowIds: ['a', 'absent'] },
          reading('unsupported-sum', { kind: 'sum', rowIds: ['a', 'b'], value: 87.4 }),
          { ...sum, id: 'mean', kind: 'mean', value: 8.5 },
        ]),
      ).toEqual({
        verified: ['sum'],
        unverified: ['wrong-total', 'double-count', 'missing-source', 'unsupported-sum', 'mean'],
      });
    });
    it('does not approve unsupported prose or a missing citation', () => {
      expect(
        check([
          { id: 'safe', kind: 'text', text: 'The signal is definitely safe' },
          reading('no-source', { rowIds: [] }),
          reading('missing-list', { rowIds: undefined }),
          reading('two-sources', { rowIds: ['a', 'b'] }),
        ]),
      ).toEqual({ verified: [], unverified: ['safe', 'no-source', 'missing-list', 'two-sources'] });
    });
    it('supports nothing when retrieval is empty', () => {
      expect(check([reading('a'), { id: 'safe', kind: 'text' }], [])).toEqual({
        verified: [],
        unverified: ['a', 'safe'],
      });
      expect(check([])).toEqual({ verified: [], unverified: [] });
    });
    it('requires a finite number in a supported field on both sides', () => {
      const claims = [
        reading('nan', { value: NaN }),
        reading('infinite', { value: Infinity }),
        reading('string', { value: '73.4' }),
        reading('field', { field: 'amplitude' }),
        reading('prototype', { field: 'toString' }),
        reading('absent-field', { rowIds: ['c'] }),
      ];
      expect(check(claims, [...records, { id: 'c', eventCount: 1 }])).toEqual({
        verified: [],
        unverified: claims.map((c) => c.id),
      });
      expect(check([reading('bad-data')], [{ id: 'a', frequencyHz: NaN }])).toEqual({
        verified: [],
        unverified: ['bad-data'],
      });
    });
    it('compares fresh values rather than memorized fixtures', () => {
      const n = 100 + Math.floor(Math.random() * 1000);
      const id = 'fresh-' + n;
      const rows = [{ id, eventCount: n, frequencyHz: n / 10 }];
      expect(
        check(
          [
            reading('fresh', { rowIds: [id], value: n / 10 }),
            reading('nearby', { rowIds: [id], value: n / 10 + 0.04 }),
            reading('wrong', { rowIds: [id], value: n / 10 + 0.09 }),
          ],
          rows,
        ),
      ).toEqual({ verified: ['fresh', 'nearby'], unverified: ['wrong'] });
    });
  });

  it('rejects fractional, negative and unsafe counts even when they match a record', () => {
    const claim = (value) => ({
      id: 'c',
      kind: 'reading',
      rowIds: ['a'],
      field: 'eventCount',
      unit: 'events',
      value,
    });
    for (const value of [1.5, -1, Number.MAX_SAFE_INTEGER + 1])
      expect(verifyClaims([claim(value)], [{ id: 'a', eventCount: value }])).toEqual({
        verified: [],
        unverified: ['c'],
      });
    expect(verifyClaims([claim(0)], [{ id: 'a', eventCount: 0 }]).verified).toEqual(['c']);
    const sum = { ...claim(Number.MAX_SAFE_INTEGER + 1), kind: 'sum', rowIds: ['a', 'b'] };
    expect(
      verifyClaims(
        [sum],
        [
          { id: 'a', eventCount: Number.MAX_SAFE_INTEGER },
          { id: 'b', eventCount: 1 },
        ],
      ).unverified,
    ).toEqual(['c']);
  });
