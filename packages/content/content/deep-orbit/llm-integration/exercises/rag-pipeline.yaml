slug: rag-pipeline
lessonSlug: rag-for-signals
title: "Build the Claim Checker"
instructions: |
  Retrieval does not make the answer true. It makes the answer checkable, and
  this is the step that checks it: Demir's audit-hour checker, for real.
  `verifyClaims(answerText, retrievedRows)` is the deterministic gate that
  lets a generated report ship. Every number in it traces to a retrieved row,
  or the report does not go.

  Every number in the generated text is a claim, and the retrieved rows are
  the only evidence you may admit. Read the numbers out of `answerText` in the
  order they appear there, and a minus sign in front of one belongs to it: a
  band label written `Band-7` reads as a claim of -7, and the rows have to
  account for it like any other. A claim is verified when some value in some
  retrieved row sits within 0.05 of it, and fabricated when no value does.
  Return `{ verified, fabricated }`, each list in that same text order, and
  both lists hold the claims as numbers, parsed out of the text, not the
  strings the match handed back.

  Three properties of the rule decide whether the gate is worth having. The
  tolerance is absolute rather than a percentage, because a model reprinting a
  logged reading rounds it and a model inventing one does not. The comparison
  is between magnitudes rather than text, so a claimed 9 does not trace to a
  row holding 29.7. And an empty retrieval is the worst case rather than a
  free pass: no evidence was in hand, so nothing in the answer is supported
  and every number in it is fabricated.
hints:
  - level: nudge
    content: "Every number in the answer is unsupported until a retrieved reading accounts for it, so two decisions carry this: what you admit as evidence, and how near a reading has to sit before it accounts for anything. Settle the retrieval that came back empty first, because it is the case with no evidence at all, and the list you send its numbers to decides whether the gate protects the report or waves it through."
  - level: guidance
    content: |
      Read the answer once, in the order the numbers appear in it, and both
      lists come back in that order for free. Whoever audits the report reads
      a flagged number against the sentence it came from, so the first number
      flagged has to be the first offending number in the text. Score the two
      lists in separate passes and you have to put the order back afterwards.

      Getting the numbers out of the prose is the step that quietly breaks.
      The answer is a sentence rather than a data structure, so whatever
      reads it has to carry a decimal point and a leading minus sign through.
      A scan that stops at the period turns 73.4 into a 73 and a 4: it invents
      a claim nobody made and loses the one they did.
  - level: solution
    content: |
      function verifyClaims(
        answerText: string,
        retrievedRows: number[][],
      ): { verified: number[]; fabricated: number[] } {
        const claims = (answerText.match(/-?\d+(\.\d+)?/g) ?? []).map(parseFloat);
        const values = retrievedRows.flat();
        const verified: number[] = [];
        const fabricated: number[] = [];
        for (const claim of claims) {
          if (values.some((v) => Math.abs(v - claim) <= 0.05)) {
            verified.push(claim);
          } else {
            fabricated.push(claim);
          }
        }
        return { verified, fabricated };
      }
