slug: rag-pipeline
lessonSlug: rag-for-signals
title: "Check Claims Against Their Sources"
instructions: |
  Check structured claims against the exact records they cite. Matching a
  number anywhere in the evidence does not establish its meaning.

  Implement `verifyClaims(claims, records)`. Return `{ verified, unverified }`:
  arrays of claim IDs in input order. Each claim appears in exactly one list.
  Claim IDs and record IDs are unique strings. Records are trusted numeric
  observations for this exercise; the other claim fields may be wrong or absent.

  A claim has `{ id, kind, rowIds, field, value, unit }`. A record has `id`
  and any available numeric fields. Only these field/unit pairs are supported:

  - `eventCount`, `events`: exact integer count (allow 1e-10 for arithmetic).
  - `frequencyHz`, `Hz`: absolute tolerance 0.05, plus 1e-10 for arithmetic.
  - `intervalSeconds`, `s`: the same tolerance as frequency, in seconds.

  `kind: 'reading'` cites exactly one record in `rowIds`; compare the claimed
  value with that record's named field. `kind: 'sum'` may sum `eventCount`
  across one or more distinct cited records. No other calculation is supported.
  A sum covers only its cited records; it says nothing about omitted data.

  A missing record, missing field, wrong unit, repeated citation, non-finite
  value, or unsupported kind/field makes the claim unverified. A qualitative
  claim such as `{ id: 'safe', kind: 'text', text: 'The signal is safe' }` also
  stays unverified. Empty retrieval supports nothing; empty claims return two
  empty lists and establish nothing about a report.

  For example, evidence `{ id: 'a', eventCount: 14, frequencyHz: 73.4 }`
  supports a reading of 14 events from `a`, but not 73.4 events or 14 Hz.
  These checks establish agreement with evidence, not that the evidence is
  correct or that generated prose includes every claim. Free-text reports
  still need review. A display made from verified fields must keep their
  field names, units, and citations. Do not publish a separate unreviewed draft.
hints:
  - level: nudge
    content: |
      Start with the citation. Which record and field does this claim actually name? A correct number from the wrong place is still unsupported.
  - level: guidance
    content: |
      Separate the supported operations. A reading refers to one row; a count sum refers to distinct rows. Check the field and its unit before comparing values. Missing evidence and unsupported text belong in the unverified list, even when the sentence sounds plausible.
  - level: solution
    content: |
      function verifyClaims(claims, records) {
        const rules = {
          eventCount: { unit: 'events', tolerance: 0 },
          frequencyHz: { unit: 'Hz', tolerance: 0.05 },
          intervalSeconds: { unit: 's', tolerance: 0.05 },
        };
        const verified = [];
        const unverified = [];
        for (const claim of claims) {
          const rule = Object.hasOwn(rules, claim.field) ? rules[claim.field] : null;
          const ids = claim.rowIds;
          let supported = rule !== null && claim.unit === rule.unit &&
            Number.isFinite(claim.value) && Array.isArray(ids) && ids.length > 0;
          if (supported) {
            supported = new Set(ids).size === ids.length &&
              ((claim.kind === 'reading' && ids.length === 1) ||
               (claim.kind === 'sum' && claim.field === 'eventCount'));
          }
          if (supported) {
            const cited = ids.map((id) => records.find((row) => row.id === id));
            supported = cited.every((row) => row && Number.isFinite(row[claim.field]));
            if (supported) {
              const expected = cited.reduce((total, row) => total + row[claim.field], 0);
              supported = Math.abs(claim.value - expected) <= rule.tolerance + 1e-10;
            }
          }
          (supported ? verified : unverified).push(claim.id);
        }
        return { verified, unverified };
      }
