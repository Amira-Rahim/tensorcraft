slug: rag-pipeline
lessonSlug: rag-for-signals
title: "Check Claims Against Their Sources"
instructions: |
  Implement verifyClaims(claims, records). Check each structured claim against the exact records it cites. Finding the same number somewhere in the records is not enough.

  Return { verified, unverified }, two arrays of claim IDs in input order. Put each claim in exactly one list. Claim IDs and record IDs are unique strings. Check numeric types in the records too. Other claim fields may be missing or wrong.

  A claim has { id, kind, rowIds, field, value, unit }. A record has id and any available numeric fields. Support only these field and unit pairs:
  - eventCount with unit 'events': a nonnegative safe integer, compared exactly.
  - frequencyHz with unit 'Hz': absolute tolerance 0.05, plus 1e-10 for arithmetic rounding.
  - intervalSeconds with unit 's': the same tolerance, measured in seconds.

  For kind 'reading', rowIds must cite exactly one record. Compare the claimed value with its named field. For kind 'sum', add eventCount across one or more distinct cited records. No other calculation is supported. A sum covers only the cited records, not anything left out.

  Mark a claim unverified if a record or field is missing, its unit is wrong, a citation repeats, a number is non-finite, or its kind or field is unsupported. Text claims such as { id: 'safe', kind: 'text', text: 'The signal is safe' } also remain unverified. With no records, nothing can be verified. With no claims, return two empty lists; that does not approve a report.

  For counts, the cited values, claimed value, and any sum must all be nonnegative safe integers. Reject fractions, negative counts, and unsafe totals.

  For example, { id: 'a', eventCount: 14, frequencyHz: 73.4 } supports a claim of 14 events from 'a'. It does not support 73.4 events or 14 Hz.

  These checks establish agreement with the supplied records. They do not prove the records are correct or that the generated text includes every relevant claim. Keep field names, units, and citations when displaying verified values. A separate free-text report still needs review before publication.
hints:
  - level: nudge
    content: |
      A matching number needs the right record, field, unit and type. Counts cannot be fractional.
  - level: guidance
    content: |
      Validate the cited records before computing the expected value. Count readings and sums must be nonnegative safe integers. Keep the absolute tolerance for frequency and interval measurements, and reject unsupported qualitative claims.
  - level: solution
    content: |
      function verifyClaims(claims, records) {
        const rules = {
          eventCount: { unit: 'events', tolerance: 0 },
          frequencyHz: { unit: 'Hz', tolerance: 0.05 },
          intervalSeconds: { unit: 's', tolerance: 0.05 },
        };
        const verified = [];
        const unverified = [];
        for (const claim of claims) {
          const rule = Object.hasOwn(rules, claim.field) ? rules[claim.field] : null;
          const ids = claim.rowIds;
          let supported =
            rule !== null &&
            claim.unit === rule.unit &&
            Number.isFinite(claim.value) &&
            Array.isArray(ids) &&
            ids.length > 0;
          if (supported) {
            supported =
              new Set(ids).size === ids.length &&
              ((claim.kind === 'reading' && ids.length === 1) ||
                (claim.kind === 'sum' && claim.field === 'eventCount'));
          }
          if (supported && claim.field === 'eventCount')
            supported = Number.isSafeInteger(claim.value) && claim.value >= 0;
          if (supported) {
            const cited = ids.map((id) => records.find((row) => row.id === id));
            supported = cited.every(
              (row) =>
                row &&
                Number.isFinite(row[claim.field]) &&
                (claim.field !== 'eventCount' ||
                  (Number.isSafeInteger(row.eventCount) && row.eventCount >= 0)),
            );
            if (supported) {
              const expected = cited.reduce((total, row) => total + row[claim.field], 0);
              supported =
                claim.field === 'eventCount'
                  ? Number.isSafeInteger(expected) && claim.value === expected
                  : Math.abs(claim.value - expected) <= rule.tolerance + 1e-10;
            }
          }
          (supported ? verified : unverified).push(claim.id);
        }
        return { verified, unverified };
      }
