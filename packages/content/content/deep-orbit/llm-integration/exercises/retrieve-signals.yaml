slug: retrieve-signals
lessonSlug: rag-for-signals
title: "Evidence for the report"
instructions: |
  Write retrieveSignals(query, db, now). Select matching records and report any matches left out of the result. Adding retrieved records does not remove what a model learned during training.

  Apply each filter only if its pattern appears in query. When several filters appear, a row must pass all of them:
  - Band: match /band[- ]?(\w+)/i. Keep rows whose band matches the captured word, ignoring case on both sides.
  - Age: match /(\d+)\s*hours/i. Keep timestamps strictly newer than now - hours * 3600 * 1000 and no later than now. Invalid timestamps fail this filter. Calculate the cutoff from the supplied now value.
  - Anomalies: match /anomal/i. Keep rows whose classification is 'anomaly'.

  If no pattern appears, every database row matches. This simple parser does not understand general English, negation, or 'overnight'.

  Return { rows, matched, truncated }:
  - rows contains the first 20 matches in database order. Do not sort them.
  - matched is the total match count before limiting the list.
  - truncated is true only when the limit excludes at least one matching row.

  Keep complete row objects, including id, timestamp, band, classification, confidence, amplitude, frequency, and anomalyScore. The supplied scores do not establish certainty. A 20-row limit is not a token limit, so the application must also check the final prompt size.
