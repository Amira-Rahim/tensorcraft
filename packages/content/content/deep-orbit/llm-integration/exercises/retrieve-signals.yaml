slug: retrieve-signals
lessonSlug: rag-for-signals
title: "Retrieve the Rows the Prompt Will Carry"
instructions: |
  Retrieval decides what the model is allowed to know. Write
  `retrieveSignals(query, db, now)`: the step that picks the rows and counts
  what it left behind.

  Three filters, each applied only when the query carries it. Band:
  `/band[- ]?(\w+)/i`, keep rows whose `band` equals the captured word, both
  sides lowercased. Age: `/(\d+)\s*hours/i`, keep rows whose
  `Date.parse(timestamp)` is strictly newer than `now - hours * 3600 * 1000`,
  and no later than `now`. Invalid timestamps fail this age filter. Use the supplied clock.
  Anomalies: `/anomal/i`, keep rows whose `classification` is 'anomaly'. Every
  filter the query carries has to hold at once, and a query carrying none of
  the three matches the whole database.

  This parser recognizes only those patterns; it does not interpret negation or "overnight".

  Then the cap. At most 20 rows travel to
  the model: the first 20 survivors in database order. Nothing here is
  ranked, so the survivors are never sorted before the cap, not by recency
  and not by any reading a row carries (`confidence`, `amplitude`,
  `frequency`, anomaly score). The 21st survivor is dropped for arriving
  late, not for scoring low. Return `{ rows, matched, truncated }`. `rows` is
  that capped list. `matched` is how many rows passed the filters, counted
  before the cap. `truncated` is true when the cap dropped at least one
  matching row. Only `rows` reaches the prompt, so `matched` and `truncated`
  tell the caller whether records were omitted. A row cap is not a token cap;
  the application must also check the final prompt size.
