solutionCode: |
  interface Signal {
    id: string;
    timestamp: string;
    band: string;
    classification: string;
    confidence: number;
    amplitude: number;
    frequency: number;
    anomalyScore: number;
  }

  interface Retrieval {
    rows: Signal[];
    matched: number;
    truncated: boolean;
  }

  const CONTEXT_ROWS = 20;

  function retrieveSignals(query: string, db: Signal[], now: number): Retrieval {
    const bandMatch = query.match(/band[- ]?(\w+)/i);
    const hoursMatch = query.match(/(\d+)\s*hours/i);
    const wantsAnomalies = /anomal/i.test(query);

    let survivors = db;
    if (bandMatch) {
      survivors = survivors.filter(
        (s) => s.band.toLowerCase() === bandMatch[1].toLowerCase(),
      );
    }
    if (hoursMatch) {
      const cutoff = now - parseInt(hoursMatch[1], 10) * 3600 * 1000;
      survivors = survivors.filter((s) => Date.parse(s.timestamp) > cutoff && Date.parse(s.timestamp) <= now);
    }
    if (wantsAnomalies) {
      survivors = survivors.filter((s) => s.classification === 'anomaly');
    }

    const rows = survivors.slice(0, CONTEXT_ROWS);
    return {
      rows,
      matched: survivors.length,
      truncated: survivors.length > rows.length,
    };
  }
testCode: |
  describe('retrieveSignals', () => {
    const HOUR = 3600 * 1000;
    const CLOCK = Date.parse('2149-06-01T00:00:00Z');

    const makeRow = (id, opts) => ({
      id,
      timestamp: new Date(CLOCK - (opts.hoursAgo ?? 1) * HOUR).toISOString(),
      band: opts.band ?? '7',
      classification: opts.classification ?? 'anomaly',
      confidence: opts.confidence ?? 0.91,
      amplitude: opts.amplitude ?? 1024,
      // 73.4 Hz is the flagship tone, so only rows classified as anomalies
      // carry it by default; noise rows sit on 23 Hz, inside the natural set.
      frequency: opts.frequency ?? ((opts.classification ?? 'anomaly') === 'noise' ? 23 : 73.4),
      anomalyScore: opts.anomalyScore ?? 0.8,
    });

    const retrieve = (query, db, now) => {
      const r = retrieveSignals(query, db, now ?? CLOCK);
      expect(
        r,
        'Return { rows, matched, truncated } from retrieveSignals.',
      ).toBeDefined();
      return r;
    };

    it('a query with no filters matches the whole database', () => {
      // One row here would be rejected by each filter the question never
      // raised: b by a band, c by anomalies, d by an age window.
      const db = [
        makeRow('a', {}),
        makeRow('b', { band: '3' }),
        makeRow('c', { classification: 'noise' }),
        makeRow('d', { hoursAgo: 96 }),
      ];
      const r = retrieve('what did the array log overnight', db);
      expect(
        r.rows.map((s) => s.id),
        'This parser recognizes none of its filters here. Return all rows before applying the cap. It does not interpret overnight.',
      ).toEqual(['a', 'b', 'c', 'd']);
      expect(
        r.rows[0],
        'Preserve complete row objects so later steps can read their fields.',
      ).toMatchObject({
        id: db[0].id,
        band: db[0].band,
        classification: db[0].classification,
        confidence: db[0].confidence,
        amplitude: db[0].amplitude,
        frequency: db[0].frequency,
        anomalyScore: db[0].anomalyScore,
      });
      expect(
        r.matched,
        'Count matches before applying the cap.',
      ).toBe(db.length);
      expect(r.truncated).toBe(false);
    });

    it('an age filter excludes future and invalid timestamps and includes now', () => {
      const db = [makeRow('future', { hoursAgo: -1 }), makeRow('now', { hoursAgo: 0 }),
        { ...makeRow('invalid', {}), timestamp: 'invalid' }];
      expect(retrieve('last 24 hours', db).rows.map(row => row.id)).toEqual(['now']);
    });
    it('the band filter folds case on both sides', () => {
      const db = [
        makeRow('a', { band: 'K7' }),
        makeRow('b', { band: 'k3' }),
        makeRow('near', { band: 'K70' }),
        makeRow('c', { band: 'k7' }),
      ];
      const r = retrieve('signals in Band-K7', db);
      expect(
        r.rows.map((s) => s.id),
        'Compare the complete band values after lowercasing. K70 is not K7.',
      ).toEqual(['a', 'c']);
      expect(r.matched).toBe(2);
    });

    it('applies every filter present in the query', () => {
      const db = [
        makeRow('wrong-band', { band: '3' }),
        makeRow('wrong-class', { classification: 'noise' }),
        makeRow('too-old', { hoursAgo: 80 }),
        makeRow('keeper', {}),
      ];
      const r = retrieve('anomalous signals in Band-7 from the last 72 hours', db);
      expect(
        r.rows.map((s) => s.id),
        'Apply all three active filters together. Only the last row matches the band, age, and classification requirements.',
      ).toEqual(['keeper']);
      expect(r.matched).toBe(1);
    });

    it('the window is measured from the now it was handed', () => {
      const db = [makeRow('inside', { hoursAgo: 71 }), makeRow('outside', { hoursAgo: 73 })];
      expect(retrieve('anomalies in Band-7 over 72 hours', db).rows.map((s) => s.id)).toEqual(['inside']);
      expect(
        retrieve('anomalies in Band-7 over 24 hours', db).rows,
        'Use the supplied now and requested duration for the age boundary.',
      ).toEqual([]);
    });

    it('the cap runs after the filters, not before', () => {
      const db = [];
      for (let i = 0; i < 25; i += 1) db.push(makeRow('filler-' + i, { band: '3', classification: 'noise' }));
      for (let i = 0; i < 6; i += 1) db.push(makeRow('hit-' + i, {}));
      const r = retrieve('anomalous signals in Band-7', db);
      expect(
        r.rows.map((s) => s.id),
        'Filter before taking the first 20 matches. In this case, all matching rows occur after the first 20 database entries.',
      ).toEqual(['hit-0', 'hit-1', 'hit-2', 'hit-3', 'hit-4', 'hit-5']);
      expect(r.matched).toBe(6);
      expect(r.truncated).toBe(false);
    });

    it('returns the first twenty matches in database order', () => {
      const size = 26;
      const db = [];
      for (let i = 0; i < size; i += 1) {
        // Each reading walks its own permutation of the database and none of
        // them walks it in database order, so a ranking applied before the
        // cap ships a different twenty whichever reading it ranks on.
        db.push(
          makeRow('row-' + i, {
            hoursAgo: (1 + ((i * 7) % size)) / 4,
            confidence: (1 + ((i * 11) % size)) / 100,
            amplitude: 570 + ((i * 3) % size) * 37,
            frequency: 5 + ((i * 19) % size) * 4,
            anomalyScore: (1 + ((i * 17) % size)) / 100,
          }),
        );
      }
      const r = retrieve('anomalous signals in Band-7', db);
      expect(
        r.rows.map((s) => s.id),
        'Preserve database order in this exercise. Other systems can rank metadata or keyword matches, but sorting here changes the required subset.',
      ).toEqual(db.slice(0, 20).map((s) => s.id));
    });

    it('counts all matching records before limiting the result', () => {
      const db = [];
      for (let i = 0; i < 40; i += 1) {
        // Every row carries a different anomalyScore, and the scores run in a
        // different order from the rows. Retrieval here is not ranked, so
        // sorting the survivors by score before the cap ships a different
        // twenty and the report cannot tell.
        db.push(
          makeRow('row-' + i, {
            band: i % 4 === 3 ? '3' : '7',
            anomalyScore: ((i * 13) % 40) / 100,
          }),
        );
      }
      const r = retrieve('anomalous signals in Band-7', db);
      const expected = db.filter((s) => s.band === '7').map((s) => s.id);
      expect(
        r.rows.map((s) => s.id),
        'Return the first 20 matching records in database order. Sorting by anomalyScore would change which records you return.',
      ).toEqual(expected.slice(0, 20));
      expect(
        r.matched,
        'matched counts rows that passed the filters, before the cap.',
      ).toBe(expected.length);
      expect(r.truncated).toBe(true);
      recordResult({
        kind: 'table',
        title: 'Evidence selected for the prompt',
        summary: r.matched + ' supplied records matched. Your retriever returned ' + r.rows.length + '. Omitted matches: ' + (r.matched - r.rows.length) + '. The report must say that the limit excluded some matches.',
        columns: ['Record', 'Band', 'Classification', 'Frequency (Hz)', 'Anomaly score'],
        rows: r.rows.slice(0, 20).map((row) => [row.id, row.band, row.classification, row.frequency, row.anomalyScore]),
      });
    });

    it('at exactly the cap nothing was dropped', () => {
      const db = [];
      for (let i = 0; i < 20; i += 1) db.push(makeRow('hit-' + i, {}));
      for (let i = 0; i < 5; i += 1) db.push(makeRow('miss-' + i, { band: '3' }));
      const r = retrieve('anomalous signals in Band-7', db);
      expect(r.rows).toHaveLength(20);
      expect(r.matched).toBe(20);
      expect(
        r.truncated,
        'Exactly 20 rows matched, and the retriever returned all of them. Set truncated to false.',
      ).toBe(false);
    });

    it('runs against a database sized at grade time, so the counts cannot be memorised', () => {
      const hits = 21 + Math.floor(Math.random() * 15);
      const misses = Math.floor(Math.random() * 9);
      const db = [];
      for (let i = 0; i < hits; i += 1) db.push(makeRow('hit-' + i, {}));
      for (let i = 0; i < misses; i += 1) db.push(makeRow('miss-' + i, { classification: 'noise' }));
      const r = retrieve('anomalous signals in Band-7', db);
      expect(r.rows).toHaveLength(20);
      expect(
        r.matched,
        'Count the matching rows in the current database.',
      ).toBe(hits);
      expect(r.truncated).toBe(true);
    });

    it('returns an empty list when no records match', () => {
      const db = [makeRow('a', { band: '3' }), makeRow('b', { band: '3' })];
      const r = retrieve('anomalous signals in Band-9', db);
      expect(r.rows).toEqual([]);
      expect(
        r.matched,
        'No records matched. Return an empty rows array, matched: 0, and truncated: false.',
      ).toBe(0);
      expect(r.truncated).toBe(false);
    });
  });
