slug: incident-checker-down
lessonSlug: multi-model-systems
title: "Incident: Claim Checker Down, Reports Queueing"
mlContent: systems
instructions: |
  PAGER: the claim checker crashed at 02:40 and reports are queueing. Standing order: no unverified NUMBER leaves the ship. Build `triageQueue(reports, checkerUp)`. Each report has { id, numericClaims, unverifiedClaims }. Checker UP: ship reports whose unverifiedClaims is 0, hold the rest. Checker DOWN: nothing can be verified, so ship only reports with NO numeric claims at all (prose can sail; numbers wait), hold everything else. Return { ship, hold } as id arrays in input order.
starterCode: |
  function triageQueue(
    reports: { id: string; numericClaims: number; unverifiedClaims: number }[],
    checkerUp: boolean,
  ): { ship: string[]; hold: string[] } {
    // Concept: an outage changes the shipping RULE, never the standing order:
    // no unverified number leaves the ship.
    // Recipe:
    // 1. Walk reports in input order, filling two id arrays: ship and hold.
    // 2. checkerUp true: a report ships when r.unverifiedClaims === 0.
    // 3. checkerUp false: nothing can be verified, so a report ships only
    //    when r.numericClaims === 0. Prose sails; numbers wait, including
    //    previously verified ones (nobody can re-check them).
    // 4. Push r.id into ship or hold, then return { ship, hold }.
    return null; // your code here
  }
solutionCode: |
  function triageQueue(
    reports: { id: string; numericClaims: number; unverifiedClaims: number }[],
    checkerUp: boolean,
  ): { ship: string[]; hold: string[] } {
    const ship: string[] = [];
    const hold: string[] = [];
    for (const r of reports) {
      const shippable = checkerUp
        ? r.unverifiedClaims === 0
        : r.numericClaims === 0;
      (shippable ? ship : hold).push(r.id);
    }
    return { ship, hold };
  }
testCode: |
  describe('triageQueue', () => {
    it('checker up: clean reports ship, flagged reports hold', () => {
      const r = triageQueue(
        [
          { id: 'r1', numericClaims: 4, unverifiedClaims: 0 },
          { id: 'r2', numericClaims: 3, unverifiedClaims: 1 },
        ],
        true,
      );
      expect(r.ship).toEqual(['r1']);
      expect(r.hold).toEqual(['r2']);
    });
    it('checker down: numbers wait, prose sails', () => {
      const r = triageQueue(
        [
          { id: 'r3', numericClaims: 0, unverifiedClaims: 0 },
          { id: 'r4', numericClaims: 2, unverifiedClaims: 0 },
        ],
        false,
      );
      expect(r.ship).toEqual(['r3']);
      expect(r.hold).toEqual(['r4']);
    });
    it('checker down holds even previously-verified reports (nobody can re-check)', () => {
      const r = triageQueue(
        [{ id: 'r5', numericClaims: 5, unverifiedClaims: 0 }],
        false,
      );
      expect(r.hold).toEqual(['r5']);
    });
    it('preserves queue order in both buckets', () => {
      const r = triageQueue(
        [
          { id: 'a', numericClaims: 1, unverifiedClaims: 1 },
          { id: 'b', numericClaims: 0, unverifiedClaims: 0 },
          { id: 'c', numericClaims: 2, unverifiedClaims: 2 },
          { id: 'd', numericClaims: 0, unverifiedClaims: 0 },
        ],
        true,
      );
      expect(r.ship).toEqual(['b', 'd']);
      expect(r.hold).toEqual(['a', 'c']);
    });
    it('splits the same queue two different ways: the outage changes the rule, not the ids', () => {
      const queue = [
        { id: 'q7', numericClaims: 0, unverifiedClaims: 0 },
        { id: 'q8', numericClaims: 6, unverifiedClaims: 0 },
        { id: 'q9', numericClaims: 2, unverifiedClaims: 2 },
      ];
      const up = triageQueue(queue, true);
      expect(up.ship).toEqual(['q7', 'q8']);
      expect(up.hold).toEqual(['q9']);
      const down = triageQueue(queue, false);
      expect(down.ship).toEqual(['q7']);
      expect(down.hold).toEqual(['q8', 'q9']);
    });
    it('reads the counts, not the position in the queue', () => {
      const queue = [
        { id: 'z1', numericClaims: 3, unverifiedClaims: 3 },
        { id: 'z2', numericClaims: 0, unverifiedClaims: 0 },
        { id: 'z3', numericClaims: 1, unverifiedClaims: 0 },
      ];
      expect(triageQueue(queue, true).ship).toEqual(['z2', 'z3']);
      expect(triageQueue(queue, false).ship).toEqual(['z2']);
      const swapped = [queue[2], queue[0], queue[1]];
      expect(triageQueue(swapped, true).ship).toEqual(['z3', 'z2']);
      expect(triageQueue(swapped, false).hold).toEqual(['z3', 'z1']);
    });
  });
estimatedMinutes: 12
difficulty: intermediate
skillAxis: deployment
