slug: generate-report
lessonSlug: report-generation
title: "Assembly of the reviewed report"
instructions: |
  Write assembleReport(title, sections). Each section has { heading, content, validated }. The validated flag records a person's earlier review decision. Assembling the text does not check its claims.

  Start with # title followed by a blank line. Keep approved sections in the supplied order. Format each as ## heading, a blank line, and its content.

  If any section fails review, add one ## Withheld block at the end. After a blank line, list each withheld heading as - heading in the original order. Never include its content. Leave out the Withheld block if every section passes review.

  Put \n\n---\n\n between blocks, with no separator after the last one. If sections is empty, return only the title and its following blank line.
starterCode: |
