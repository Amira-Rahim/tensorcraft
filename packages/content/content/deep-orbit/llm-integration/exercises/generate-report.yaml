solutionCode: |
  interface Section { heading: string; content: string; validated: boolean; }

  function assembleReport(title: string, sections: Section[]): string {
    const shipped = sections.filter(s => s.validated);
    const withheld = sections.filter(s => !s.validated);
    const parts = shipped.map(s => `## ${s.heading}\n\n${s.content}`);
    if (withheld.length > 0) {
      parts.push(`## Withheld\n\n${withheld.map(s => `- ${s.heading}`).join('\n')}`);
    }
    return `# ${title}\n\n${parts.join('\n\n---\n\n')}`;
  }
testCode: |
  describe('assembleReport', () => {
    const clean = [
      { heading: 'Summary', content: 'Brief overview.', validated: true },
      { heading: 'Analysis', content: 'Detailed analysis.', validated: true },
    ];
    const mixed = [
      { heading: 'Executive Summary', content: '12,001 events catalogued.', validated: true },
      { heading: 'Hypotheses', content: 'The pulse train is a reply.', validated: false },
      { heading: 'Results', content: '153 anomalous, 1 unclassified.', validated: true },
    ];
    const reportFor = (title, sections) => {
      const report = assembleReport(title, sections);
      expect(
        report,
        'Return the completed Markdown document from assembleReport.',
      ).toBeDefined();
      return report;
    };

    it('ships validated sections under the title, in order, with one separator between blocks', () => {
      const report = reportFor('Report', clean);
      expect(report.startsWith('# Report')).toBe(true);
      expect(report.indexOf('## Summary')).toBeLessThan(report.indexOf('## Analysis'));
      expect(report).toContain('Brief overview.');
      expect(report).toContain('Detailed analysis.');
      expect(
        report,
        'The rule needs a blank line above it and below it. In markdown a "---" line sitting directly under text creates a heading underline: that last line of the section renders as a heading and no rule appears at all.',
      ).toContain('\n\n---\n\n');
      expect(
        report.split('\n\n---\n\n').length - 1,
        'A rule sits between two blocks, so two blocks take one rule. One per block leaves a trailing rule under the last section.',
      ).toBe(1);
    });
    it('an empty report contains only the title', () => {
      expect(reportFor('Empty', [])).toBe('# Empty\n\n');
    });
    it('a clean report carries no Withheld section', () => {
      const report = reportFor('Report', clean);
      expect(report).toContain('Brief overview.');
      expect(report).toContain('Detailed analysis.');
      expect(
        report,
        'Every section passed review. Omit the Withheld block.',
      ).not.toContain('Withheld');
    });
    it('a failed section is cut, its content never ships, and its heading is listed under Withheld', () => {
      const report = reportFor('Relay Report', mixed);
      expect(
        report,
        'This section lacks approval. The exercise release gate withholds its content for every story choice.',
      ).not.toContain('The pulse train is a reply.');
      expect(report).toContain('## Withheld');
      expect(
        report,
        'Name the missing section so Earth knows which part of the report remains incomplete.',
      ).toContain('- Hypotheses');
      expect(report).toContain('153 anomalous, 1 unclassified.');
      recordResult({
        kind: 'text',
        title: 'Your report for the relay',
        summary: 'Assembled from supplied fictional sections and review decisions. The unapproved explanation stays out, and Earth can see which section is missing.',
        text: report.slice(0, 6000),
      });
    });
    it('the withheld list is one block at the end: separators equal blocks minus one', () => {
      const report = reportFor('Relay Report', mixed);
      // 2 shipped blocks + 1 Withheld block = 3 blocks, 2 separators
      expect(report.split('\n\n---\n\n').length - 1).toBe(2);
      expect(
        report.trim().endsWith('- Hypotheses'),
        'List all withheld headings in one final Withheld block.',
      ).toBe(true);
    });
    it('when nothing validates, the document is the title and the withheld list alone', () => {
      const report = reportFor('Held', [
        { heading: 'A', content: 'x', validated: false },
        { heading: 'B', content: 'y', validated: false },
      ]);
      expect(report).not.toContain('x');
      expect(report).toContain('- A');
      expect(report).toContain('- B');
      expect(
        report.split('\n\n---\n\n').length - 1,
        'There is one block in this document, and a rule needs a block on each side of it.',
      ).toBe(0);
    });
    it('assembles whatever sections it is given, not a memorized document', () => {
      const other = [
        { heading: 'Telemetry', content: 'Pulse interval still falling.', validated: true },
        { heading: 'Recommendation', content: 'Hold the relay window.', validated: false },
        { heading: 'Risks', content: 'Bandwidth budget is tight.', validated: true },
      ];
      const report = reportFor('Relay Briefing', other);
      expect(report).toContain('# Relay Briefing');
      expect(report).toContain('Pulse interval still falling.');
      expect(report).not.toContain('Hold the relay window.');
      expect(report).toContain('- Recommendation');
      expect(report.split('\n\n---\n\n').length - 1).toBe(2);
    });
    it('reads the verdict on each section, not its heading or its position, on bodies drawn at grade time', () => {
      const draw = Math.floor(Math.random() * 1e6);
      for (const pattern of [[true, false, true], [false, true, false], [false, false, true]]) {
        const tag = pattern.map((validated) => (validated ? 1 : 0)).join('') + '-' + draw;
        const sections = pattern.map((validated, i) => ({
          heading: `Section ${i}`,
          content: `body ${i} of ${tag}`,
          validated,
        }));
        const report = reportFor(`Pattern ${tag}`, sections);
        pattern.forEach((validated, i) => {
          if (validated) {
            expect(
              report,
              'Use each section’s validated flag, regardless of its heading or position.',
            ).toContain(`body ${i} of ${tag}`);
            expect(report).not.toContain(`- Section ${i}`);
          } else {
            expect(report).not.toContain(`body ${i} of ${tag}`);
            expect(report).toContain(`- Section ${i}`);
          }
        });
      }
    });
  });
