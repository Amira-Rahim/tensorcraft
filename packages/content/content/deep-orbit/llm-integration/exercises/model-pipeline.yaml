slug: model-pipeline
lessonSlug: multi-model-systems
title: "Wire a Model Pipeline"
instructions: |
  Implement classifierStage(model) and pipeline(signal, classify, detectAnomaly, generateAlert).

  The classifier receives three raw features: amplitude in counts, zero-crossing count, and phase in radians. Reject an array of the wrong length or any non-finite value. Scale the features with the supplied min-max RANGES. Predict once using shape [1, 3] and release temporary tensors.

  The model must return one finite sigmoid value p between 0 and 1 inclusive. Return 'anomaly' when p > 0.5 and 'noise' otherwise. Set confidence to p for anomaly or 1-p for noise. That is the chosen class's model score, not a verified probability of correctness.

  The pipeline passes the original raw signal to each stage. Keep classifier labels 'noise' and 'anomaly'; replace any other label with 'unknown'. Reject a non-finite or out-of-range confidence before calling the detector.

  The detector must return a boolean. If true, call the alert writer and require a string containing at least one non-whitespace character. If false, skip the writer and return null for alert. Return { classification, confidence, isAnomaly, alert }.

  The exercise supplies stage callbacks rather than the full autoencoder and forecast helpers shown in the lesson. These checks catch invalid data. A plausible prediction can pass them and still be wrong.
