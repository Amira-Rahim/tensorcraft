solutionCode: |
  interface Verdict {
    class: string;
    confidence: number;
  }

  interface PipelineResult {
    classification: string;
    confidence: number;
    isAnomaly: boolean;
    alert: string | null;
  }

  const RANGES = {
    amplitude: { min: 0, max: 2048 },
    frequency: { min: 0, max: 63 },
    phase: { min: -Math.PI, max: Math.PI },
  };

  function classifierStage(model: tf.LayersModel): (s: number[]) => Promise<Verdict> {
    const order = [RANGES.amplitude, RANGES.frequency, RANGES.phase];
    return async (reading: number[]) => {
      if (reading.length !== order.length) {
        throw new Error('the classifier reads ' + order.length + ' features and was handed ' + reading.length);
      }
      if (!reading.every(Number.isFinite)) throw new Error('Non-finite reading');
      const features = reading.map((v, i) => (v - order[i].min) / (order[i].max - order[i].min));
      return tf.tidy(() => {
        const row = tf.tensor2d([features]);
        const output = (model.predict(row) as tf.Tensor).dataSync();
        if (output.length !== 1 || !Number.isFinite(output[0]) || output[0] < 0 || output[0] > 1) throw new Error('Invalid sigmoid output');
        const p = output[0];
        return { class: p > 0.5 ? 'anomaly' : 'noise', confidence: p > 0.5 ? p : 1 - p };
      });
    };
  }

  async function pipeline(
    signal: number[],
    classify: (s: number[]) => Promise<Verdict>,
    detectAnomaly: (s: number[], cls: string) => Promise<boolean>,
    generateAlert: (s: number[], cls: string) => Promise<string>,
  ): Promise<PipelineResult> {
    const verdict = await classify(signal);
    const confidence = verdict.confidence;
    if (!Number.isFinite(confidence) || confidence < 0 || confidence > 1) {
      throw new Error('classifier broke its contract');
    }
    const classification = ['noise', 'anomaly'].includes(verdict.class)
      ? verdict.class
      : 'unknown';
    const isAnomaly = await detectAnomaly(signal, classification);
    if (typeof isAnomaly !== 'boolean') throw new Error('detector must return a boolean');
    const alert = isAnomaly ? await generateAlert(signal, classification) : null;
    if (isAnomaly && (typeof alert !== 'string' || alert.trim().length === 0)) throw new Error('alert must be a non-empty string');
    return { classification, confidence, isAnomaly, alert };
  }
testCode: |
  describe('pipeline', () => {
    const runPipeline = async (signal, classify, detectAnomaly, generateAlert) => {
      const r = await pipeline(signal, classify, detectAnomaly, generateAlert);
      expect(
        r,
        'pipeline has to return the finished run: the class it settled on, the confidence behind it, whether the detector fired, and the alert text or null. While it returns null the operator on watch has nothing to read.',
      ).toBeDefined();
      return r;
    };
    const verdict = (cls, confidence) => async () => ({ class: cls, confidence });

    it('reports the class and the confidence it was handed', async () => {
      const r = await runPipeline([1], verdict('noise', 0.73), async () => false, async () => '');
      expect(r.classification).toBe('noise');
      expect(
        r.confidence,
        'The confidence is the classifier\'s own number and the alert quotes it. Carry it through rather than re-deriving it.',
      ).toBe(0.73);
    });
    it('skips the alert for normal signals', async () => {
      let alertCalls = 0;
      const r = await runPipeline(
        [1],
        verdict('noise', 0.9),
        async () => false,
        async () => { alertCalls += 1; return 'ALERT'; },
      );
      expect(r.alert).toBeNull();
      expect(alertCalls).toBe(0);
    });
    it('generates the alert for anomalies', async () => {
      const r = await runPipeline([1], verdict('anomaly', 0.88), async () => true, async () => 'ALERT!');
      expect(r.isAnomaly).toBe(true);
      expect(r.alert).toBe('ALERT!');
    });
    it('falls back to unknown when the classifier breaks the class contract', async () => {
      const seen = [];
      const r = await runPipeline(
        [1],
        verdict('garbled', 0.5),
        async (s, cls) => { seen.push(cls); return true; },
        async () => 'ALERT!',
      );
      expect(r.classification).toBe('unknown');
      expect(seen).toEqual(['unknown']);
      expect(r.alert).toBe('ALERT!');
    });
    it('allowlists the two contracted classes instead of blacklisting known-bad ones', async () => {
      // Built, not listed. A blacklist can memorise a handful of literals from a
      // test file; it cannot memorise a generated space, and it cannot know what
      // a real classifier will emit on the day it breaks. The near-misses at the
      // end are the ones that matter: they are what a trimming or
      // case-insensitive blacklist lets through.
      const candidates = [];
      for (const a of ['n', 'a', 'x', 'q']) {
        for (const b of ['o', 'n', 'z', '_']) {
          candidates.push(a + b, (a + b).toUpperCase(), a + b + 'oise');
        }
      }
      candidates.push('NOISE', 'Noise', 'noise ', ' noise', 'noisy', 'anomaly ',
        'ANOMALY', 'Anomaly', 'anomalous', 'signal', 'undefined', '', undefined, null);
      for (const reported of candidates) {
        const seen = [];
        const r = await runPipeline(
          [7, 8, 9],
          verdict(reported, 0.42),
          async (s, cls) => { seen.push(cls); return false; },
          async () => 'ALERT!',
        );
        expect(
          r.classification,
          'Only the exact strings "noise" and "anomaly" are inside the contract. Everything else is a broken contract and has to become "unknown", including a value nobody wrote down in advance.',
        ).toBe('unknown');
        expect(
          seen,
          'Pass unknown to the detector when the classifier returns an unsupported class.',
        ).toEqual(['unknown']);
      }
    });
    it('passes both contracted classes through untouched', async () => {
      for (const reported of ['noise', 'anomaly']) {
        const seen = [];
        const r = await runPipeline(
          [7, 8, 9],
          verdict(reported, 0.6),
          async (s, cls) => { seen.push(cls); return false; },
          async () => 'ALERT!',
        );
        expect(r.classification).toBe(reported);
        expect(seen).toEqual([reported]);
      }
    });
    it('stops the run on a confidence the contract does not allow, before the next stage reads it', async () => {
      // Listed edge cases plus draws made at grade time, above the range and
      // below it. Nothing here has an honest stand-in: substituting a number
      // hands the operator a certainty the classifier never reported.
      const broken = [NaN, Infinity, -Infinity, -0.0001, 1.0001, 2, -1, 47,
        undefined, null, '0.5', 'high'];
      for (let i = 0; i < 8; i += 1) {
        broken.push(1.01 + Math.round(Math.random() * 10000) / 100);
        broken.push(-Math.round(Math.random() * 10000) / 100 - 0.01);
      }
      for (const confidence of broken) {
        let reached = 0;
        await expect(
          pipeline(
            [7, 8, 9],
            verdict('anomaly', confidence),
            async () => { reached += 1; return true; },
            async () => 'ALERT!',
          ),
          'Reject the invalid score before calling the detector. Do not invent a replacement score.',
        ).rejects.toThrow();
        expect(
          reached,
          'The throw comes before the next stage runs. A check that fires after detectAnomaly has already read the verdict is a check on work that has been done.',
        ).toBe(0);
      }
    });
    it('accepts both endpoints and anything between them, on confidences drawn at grade time', async () => {
      const allowed = [0, 1, 0.5];
      for (let i = 0; i < 8; i += 1) allowed.push(Math.round(Math.random() * 10000) / 10000);
      for (const confidence of allowed) {
        const r = await runPipeline([7, 8, 9], verdict('anomaly', confidence), async () => true, async () => 'ALERT!');
        expect(
          r.confidence,
          'The contract includes both endpoints. Scores of zero and one do not prove certainty; keep the reported value.',
        ).toBe(confidence);
        expect(r.classification).toBe('anomaly');
      }
    });

    it('hands the capture itself to every stage', async () => {
      // The lesson's headline point: every stage does its own preprocessing
      // on the raw capture, so each one has to receive the array the
      // pipeline was handed. Every stub above ignored its first argument, and
      // a submission that called every stage with nothing at all cleared the
      // suite (round 7, 2026-09-13).
      const capture = [7, 8, 9];
      const seenBy = { classify: [], detectAnomaly: [], generateAlert: [] };
      const r = await runPipeline(
        capture,
        async (s) => { seenBy.classify.push(s); return { class: 'anomaly', confidence: 0.9 }; },
        async (s, cls) => { seenBy.detectAnomaly.push(s); return true; },
        async (s, cls) => { seenBy.generateAlert.push(s); return 'ALERT!'; },
      );
      expect(r.alert).toBe('ALERT!');
      for (const stage of ['classify', 'detectAnomaly', 'generateAlert']) {
        expect(
          seenBy[stage].length,
          stage + ' ran ' + seenBy[stage].length + ' time(s) on this run; it has to run exactly once.',
        ).toBe(1);
        expect(
          seenBy[stage][0],
          stage + ' received something other than the capture the pipeline was handed. Every stage is handed the raw capture itself and does its own preprocessing on it; the classifier\'s verdict rides along as context, it does not replace the signal.',
        ).toEqual(capture);
      }
    });
  });
  describe('classifierStage', () => {
    it('rejects non-finite input before predicting', async () => {
      let calls = 0;
      const stage = classifierStage({ predict() { calls++; throw new Error('unexpected prediction'); } });
      for (const bad of [NaN, Infinity, -Infinity]) await expect(stage([bad, 5, 0.3])).rejects.toThrow();
      expect(calls).toBe(0);
    });

    // Module 4's classifier, real: three features in, one sigmoid out. Seeded
    // so a failure reproduces run to run; the expected verdicts below are
    // read off the model itself, never off a table.
    const realClassifier = (seed) => {
      const m = tf.sequential();
      m.add(tf.layers.dense({ units: 8, activation: 'relu', inputShape: [3], kernelInitializer: tf.initializers.glorotNormal({ seed }) }));
      m.add(tf.layers.dense({ units: 1, activation: 'sigmoid', kernelInitializer: tf.initializers.glorotNormal({ seed: seed + 1 }) }));
      return m;
    };
    const RANGE_ORDER = [
      { min: 0, max: 2048 },
      { min: 0, max: 63 },
      { min: -Math.PI, max: Math.PI },
    ];
    const minMax = (reading) => reading.map((v, i) => (v - RANGE_ORDER[i].min) / (RANGE_ORDER[i].max - RANGE_ORDER[i].min));
    const modelSays = (model, features) =>
      tf.tidy(() => model.predict(tf.tensor2d([features])).dataSync()[0]);
    const verdictOf = (p) => ({ class: p > 0.5 ? 'anomaly' : 'noise', confidence: p > 0.5 ? p : 1 - p });
    // Readings in module 4's units: counts, zero-crossings, radians.
    const calm = [180, 5, 0.3];
    const loud = [1650, 41, -2.4];
    // The harness starts every it() at once, and these tests count predict
    // calls and live tensors, so they take turns through one queue.
    let turn = Promise.resolve();
    const serial = (fn) => {
      const run = turn.then(fn);
      turn = run.catch(() => {});
      return run;
    };
    const stageOf = (model) => {
      const stage = classifierStage(model);
      expect(stage, 'classifierStage handed back nothing. It returns the classify function the pipeline takes: one that scales a reading, runs the model on one row, and reads the verdict off the sigmoid.').toBeTruthy();
      expect(typeof stage, 'classifierStage returns a function, the stage itself, not a verdict.').toBe('function');
      return stage;
    };

    it('rejects invalid sigmoid outputs and releases temporary tensors', () => serial(async () => {
      for (const values of [[NaN], [Infinity], [-0.1], [1.1], [0.2, 0.8]]) {
        const model = { predict: () => tf.tensor2d([values]) };
        const before = tf.memory().numTensors;
        await expect(classifierStage(model)([1024, 31.5, 0])).rejects.toThrow();
        expect(tf.memory().numTensors).toBe(before);
      }
    }));

    it('runs the model once, on one [1, 3] row, and leaves no tensors behind', () => serial(async () => {
      const model = realClassifier(7741);
      const shapes = [];
      const realPredict = model.predict.bind(model);
      Object.defineProperty(model, 'predict', { value: (x) => { shapes.push(x.shape); return realPredict(x); }, configurable: true });
      const stage = stageOf(model);
      const before = tf.memory().numTensors;
      const calls0 = tf.__calls['model.predict'] || 0;
      const v = await stage(calm);
      expect(v, 'The stage resolved to nothing. It hands back { class, confidence }.').toBeDefined();
      expect((tf.__calls['model.predict'] || 0) - calls0, 'One reading is one predict call. This stage ran the model ' + ((tf.__calls['model.predict'] || 0) - calls0) + ' time(s).').toBe(1);
      expect(shapes, 'The model reads one row of three features, shape [1, 3]: a batch axis of one in front of the features.').toEqual([[1, 3]]);
      expect(tf.memory().numTensors - before, 'The stage left tensors behind. Run the row and the prediction inside tf.tidy, and hand back plain numbers.').toBe(0);
    }));

    it("reads the verdict off this model's own output, confidence in the verdict", () => serial(async () => {
      for (const seed of [11, 23]) {
        const model = realClassifier(seed);
        const stage = stageOf(model);
        for (const reading of [calm, loud]) {
          const want = verdictOf(modelSays(model, minMax(reading)));
          const got = await stage(reading);
          expect(got.class, 'On this model the sigmoid says ' + (want.class === 'anomaly' ? 'above' : 'at or below') + ' 0.5 for this reading, so the class is ' + want.class + '. A verdict that does not follow this model was read off something else.').toBe(want.class);
          expect(got.confidence, 'Confidence is chosen-class score: the sigmoid output when the class is anomaly, one minus it when the class is noise. A 0.2 output is noise at 0.8, not noise at 0.2.').toBeCloseTo(want.confidence, 4);
        }
      }
    }));

    it("scales the reading the way module 4 trained the model: min-max, not raw units and not z-scores", () => serial(async () => {
      const model = realClassifier(31);
      const stage = stageOf(model);
      const got = await stage(loud);
      const want = verdictOf(modelSays(model, minMax(loud)));
      const raw = verdictOf(modelSays(model, loud));
      expect(
        got.confidence,
        'Use the supplied RANGES to scale every feature before inference. A valid output range does not establish that the input scale was correct.' + (Math.abs(got.confidence - raw.confidence) < 1e-4 ? ' The number you returned is exactly the raw-units answer.' : ''),
      ).toBeCloseTo(want.confidence, 4);
    }));

    it('lets a capture of the wrong length throw instead of trimming it to fit', () => serial(async () => {
      const model = realClassifier(43);
      const stage = stageOf(model);
      const eleven = [0.4, -1.2, 0.8, 0.1, 2.2, -0.3, 0.9, 1.1, -0.7, 0.2, 0.5];
      let verdict = null;
      let threw = false;
      try {
        verdict = await stage(eleven);
      } catch (err) {
        threw = true;
      }
      expect(
        threw,
        'Eleven values is module 5\'s array, not module 4\'s reading. Handed to this model whole, tfjs throws its own shape error before the model runs; trimmed to three, it runs on the wrong numbers and returns a verdict nobody should trust. Let the wrong length throw.' + (verdict ? ' This stage returned ' + JSON.stringify(verdict) + ' instead.' : ''),
      ).toBe(true);
    }));

    it('wires into the pipeline, and a broken stage 1 stops the run before stage 2', () => serial(async () => {
      const model = realClassifier(59);
      const want = verdictOf(modelSays(model, minMax(loud)));
      let detectorRuns = 0;
      const r = await pipeline(loud, classifierStage(model), async () => { detectorRuns += 1; return true; }, async () => 'ALERT!');
      expect(r && r.classification, 'The pipeline carries the real stage\'s class through.').toBe(want.class);
      expect(r.confidence, 'And its confidence, unchanged.').toBeCloseTo(want.confidence, 4);
      expect(r.alert).toBe('ALERT!');
      let stopped = false;
      try {
        await pipeline([0.4, -1.2, 0.8, 0.1, 2.2, -0.3, 0.9, 1.1, -0.7, 0.2, 0.5], classifierStage(model), async () => { detectorRuns += 1; return true; }, async () => 'ALERT!');
      } catch (err) {
        stopped = true;
      }
      expect(stopped, 'A stage 1 that throws ends the run. There is no verdict to carry, so nothing downstream should have run.').toBe(true);
      expect(detectorRuns, 'The detector ran on the run that had no verdict.').toBe(1);
    }));
  });

  it('rejects a detector string instead of treating it as a boolean', async () => {
    await expect(
      pipeline(
        [],
        async () => ({ class: 'noise', confidence: 0.5 }),
        async () => 'false',
        async () => 'alert',
      ),
    ).rejects.toThrow();
  });
  it('stops before alerting on invalid detector output', async () => {
    for (const bad of [null, undefined, 0, 1, {}, 'false']) {
      let calls = 0;
      await expect(
        pipeline(
          [],
          async () => ({ class: 'noise', confidence: 0.5 }),
          async () => bad,
          async () => {
            calls++;
            return 'alert';
          },
        ),
      ).rejects.toThrow();
      expect(calls).toBe(0);
    }
  });
  it('rejects invalid alert messages', async () => {
    for (const bad of [null, undefined, 42, {}, '', '  '])
      await expect(
        pipeline(
          [],
          async () => ({ class: 'noise', confidence: 0.5 }),
          async () => true,
          async () => bad,
        ),
      ).rejects.toThrow();
  });
