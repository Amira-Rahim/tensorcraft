title: "Wire a Model Pipeline"
instructions: "Write a pipeline function that runs three stages over one signal: classify (returns a class string), detectAnomaly (returns a boolean), and generateAlert (returns a message string). Every stage is handed the raw capture and does its own preprocessing, and the classification rides along as context. The classifier is contracted to return 'noise' or 'anomaly'. Anything else is a broken contract: fall back to 'unknown' instead of passing it on. If the signal is not anomalous, skip the alert stage and return null for the message."
starterCode: |
