    classification: string;
    isAnomaly: boolean;
    alert: string | null;
  }

  async function pipeline(
    signal: number[],
    classify: (s: number[]) => Promise<string>,
    detectAnomaly: (s: number[], cls: string) => Promise<boolean>,
    generateAlert: (s: number[], cls: string) => Promise<string>,
  ): Promise<PipelineResult> {
    // 1. Classify the signal
    // 2. Reject a class outside 'noise' and 'anomaly'; use 'unknown' instead
    // 3. Check for anomaly
    // 4. Generate alert only if anomalous
    return null; // your code here
  }
solutionCode: |
  interface PipelineResult {
    classification: string;
    isAnomaly: boolean;
    alert: string | null;
  }

  async function pipeline(
    signal: number[],
    classify: (s: number[]) => Promise<string>,
    detectAnomaly: (s: number[], cls: string) => Promise<boolean>,
    generateAlert: (s: number[], cls: string) => Promise<string>,
  ): Promise<PipelineResult> {
    const reported = await classify(signal);
    const classification = ['noise', 'anomaly'].includes(reported)
      ? reported
      : 'unknown';
    const isAnomaly = await detectAnomaly(signal, classification);
    const alert = isAnomaly ? await generateAlert(signal, classification) : null;
    return { classification, isAnomaly, alert };
  }
testCode: |
  describe('pipeline', () => {
    it('returns classification', async () => {
      const r = await pipeline([1], async () => 'noise', async () => false, async () => '');
      expect(r.classification).toBe('noise');
    });
    it('skips alert for normal signals', async () => {
      let alertCalls = 0;
      const r = await pipeline(
        [1],
        async () => 'noise',
        async () => false,
        async () => { alertCalls += 1; return 'ALERT'; },
      );
      expect(r.alert).toBeNull();
      expect(alertCalls).toBe(0);
    });
    it('generates alert for anomalies', async () => {
      const r = await pipeline([1], async () => 'anomaly', async () => true, async () => 'ALERT!');
      expect(r.isAnomaly).toBe(true);
      expect(r.alert).toBe('ALERT!');
    });
    it('falls back to unknown when the classifier breaks its contract', async () => {
      const seen = [];
      const r = await pipeline(
        [1],
        async () => 'garbled',
        async (s, cls) => { seen.push(cls); return true; },
        async () => 'ALERT!',
      );
      expect(r.classification).toBe('unknown');
      expect(seen).toEqual(['unknown']);
      expect(r.alert).toBe('ALERT!');
    });
    it('allows the two contracted classes and nothing else (not one blacklisted string)', async () => {
      for (const reported of ['ANOMALY', 'Noise', 'anomaly ', 'signal', 'undefined', '', undefined, null]) {
        const seen = [];
        const r = await pipeline(
          [7, 8, 9],
          async () => reported,
          async (s, cls) => { seen.push(cls); return false; },
          async () => 'ALERT!',
        );
        expect(r.classification).toBe('unknown');
        expect(seen).toEqual(['unknown']);
      }
    });
    it('passes both contracted classes through untouched', async () => {
      for (const reported of ['noise', 'anomaly']) {
        const seen = [];
        const r = await pipeline(
          [7, 8, 9],
          async () => reported,
          async (s, cls) => { seen.push(cls); return false; },
          async () => 'ALERT!',
        );
        expect(r.classification).toBe(reported);
        expect(seen).toEqual([reported]);
      }
    });
  });
