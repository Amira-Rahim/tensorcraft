title: "Build a Prompt Template"
instructions: "Write a function that takes signal data (amplitude, frequency, phase) and returns a multi-line prompt with the four parts on separate lines, in order. First the role, a line naming DEEP SCAN and carrying no signal values. Then the reference context: known natural frequencies 5, 12, 23, 47 Hz. Then the signal data, one line per value, each next to its label (Amplitude, Frequency, Phase) and read off the argument. Then the output request: JSON with classification, confidence, and reasoning fields. The grader checks position as well as presence, and rebuilds the prompt from a second signal."
