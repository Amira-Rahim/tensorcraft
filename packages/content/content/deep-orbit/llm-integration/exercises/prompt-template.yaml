solutionCode: |
  interface SignalInput {
    amplitude: number;
    frequency: number;
    phase: number;
  }

  function buildPrompt(signal: SignalInput): string {
    const lines = [
      'You are DEEP SCAN, a signal classifier for deep space signals.',
      '',
      'Known natural frequencies: 5, 12, 23, 47 Hz.',
      'Normal amplitude range: 0.1 to 1.0.',
      '',
      'Signal data:',
      '- Amplitude: ' + signal.amplitude,
      '- Frequency: ' + signal.frequency + ' Hz',
      '- Phase: ' + signal.phase + ' rad',
      '',
      'Classify this signal. Respond in JSON with fields: classification (normal or anomalous), confidence (0.0-1.0), reasoning (explanation).',
    ];
    return lines.join('\n');
  }
testCode: |
  describe('buildPrompt', () => {
    const signal = { amplitude: 1.82, frequency: 73.4, phase: 0.23 };
    const lines = (prompt) =>
      prompt.split('\n').map((line) => line.trim()).filter((line) => line.length > 0);

    it('includes the signal data', () => {
      const prompt = buildPrompt(signal);
      expect(prompt).toContain('1.82');
      expect(prompt).toContain('73.4');
    });

    it('includes all four natural frequencies', () => {
      const prompt = buildPrompt(signal);
      expect(prompt).toContain('5');
      expect(prompt).toContain('12');
      expect(prompt).toContain('23');
      expect(prompt).toContain('47');
    });

    it('requests JSON output and names all three fields', () => {
      const lower = buildPrompt(signal).toLowerCase();
      expect(lower).toContain('json');
      expect(lower).toContain('classification');
      expect(lower).toContain('confidence');
      expect(lower).toContain('reasoning');
    });

    it('opens with the role on a line of its own', () => {
      const prompt = buildPrompt(signal);
      expect(prompt).toContain('DEEP SCAN');
      const first = lines(prompt)[0];
      expect(first).toContain('DEEP SCAN');
      expect(first).not.toContain('1.82');
      expect(first).not.toContain('73.4');
      expect(first.toLowerCase()).not.toContain('json');
    });

    it('orders the parts role, context, data, format', () => {
      const prompt = buildPrompt(signal);
      const role = prompt.indexOf('DEEP SCAN');
      const context = prompt.indexOf('47');
      const data = prompt.indexOf('73.4');
      const format = prompt.toLowerCase().indexOf('json');
      expect(role).toBeGreaterThan(-1);
      expect(context).toBeGreaterThan(role);
      expect(data).toBeGreaterThan(context);
      expect(format).toBeGreaterThan(data);
    });

    it('puts each value on its own line beside its label, for any signal', () => {
      const check = (input) => {
        const parts = lines(buildPrompt(input));
        const carrying = (value) =>
          parts.filter((line) => line.includes(String(value)));
        const amp = carrying(input.amplitude);
        const freq = carrying(input.frequency);
        const phase = carrying(input.phase);
        expect(amp).toHaveLength(1);
        expect(freq).toHaveLength(1);
        expect(phase).toHaveLength(1);
        expect(amp[0].toLowerCase()).toContain('amplitude');
        expect(freq[0].toLowerCase()).toContain('frequency');
        expect(phase[0].toLowerCase()).toContain('phase');
        expect(amp[0]).not.toBe(freq[0]);
        expect(freq[0]).not.toBe(phase[0]);
        expect(amp[0]).not.toBe(phase[0]);
        for (const line of [amp[0], freq[0], phase[0]]) {
          expect(line).not.toContain('DEEP SCAN');
          expect(line.toLowerCase()).not.toContain('json');
        }
      };
      check(signal);
      check({ amplitude: 2.9, frequency: 118.6, phase: 0.05 });
    });

    it('templates the input, not a memorized string (different signal, different prompt)', () => {
      const other = buildPrompt({ amplitude: 0.34, frequency: 12.0, phase: 1.57 });
      expect(other).toContain('0.34');
      expect(other).toContain('12');
      expect(other).toContain('1.57');
      expect(other).not.toContain('1.82');
      expect(other).not.toContain('73.4');
      const third = buildPrompt({ amplitude: 2.9, frequency: 118.6, phase: 0.05 });
      expect(third).toContain('2.9');
      expect(third).toContain('118.6');
      expect(third).toContain('0.05');
      expect(third).not.toContain('0.34');
      expect(third).not.toContain('1.57');
    });
  });
