slug: prompt-template
lessonSlug: prompt-engineering
title: "The prompt template"
instructions: |
  Build a multi-line prompt from signal.amplitude, signal.frequency, and signal.phase. Keep four parts in this order, on separate lines:

  1. A role line naming DEEP SCAN and its task: classify, label, or categorize signals.
  2. A reference line listing natural frequencies 5, 12, 23, and 47 Hz. Do not put the current reading on this line.
  3. The supplied signal values, each on its own line labeled Amplitude, Frequency, or Phase.
  4. A request for JSON with classification, confidence, and reasoning. You may also ask for no text around the JSON.

  Read the signal values from the argument on every call. The checks accept several ways to word the role and verify the prompt's structure and data. They cannot prove an LLM will follow the prompt or produce a correct answer.
