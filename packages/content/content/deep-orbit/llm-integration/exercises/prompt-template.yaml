slug: prompt-template
lessonSlug: prompt-engineering
title: "Build a Prompt Template"
instructions: |
  Build a multi-line prompt from signal.amplitude, signal.frequency and signal.phase. Keep these four sections in order:

  1. A role line naming DEEP SCAN and its job: classify, label or categorize signals.
  2. A separate reference line naming the natural frequencies 5, 12, 23 and 47 Hz. Keep the current reading off this line.
  3. One labeled line per signal value: Amplitude, Frequency and Phase, taken from the argument.
  4. A request for JSON containing classification, confidence and reasoning. You may also ask for no surrounding prose.

  Rebuild the signal section on every call. The grader checks this template's structure and data, with several accepted role wordings. It cannot judge whether an LLM will follow the prompt or whether its answer is correct.
starterCode: |
  interface SignalInput {
    amplitude: number;
    frequency: number;
    phase: number;
  }

  function buildPrompt(signal: SignalInput): string {
    // Four parts in a fixed order, and no single line may carry two of them.
    // What is true of every capture stays apart from what arrived in the
    // argument. That split is the decision here.
    return null; // your code here
  }
solutionCode: |
  interface SignalInput {
    amplitude: number;
    frequency: number;
    phase: number;
  }

  function buildPrompt(signal: SignalInput): string {
    const lines = [
      'You are DEEP SCAN, a signal classifier for deep space signals.',
      '',
      'Known natural frequencies: 5, 12, 23, 47 Hz.',
      'Normal amplitude range: 570 to 1560 counts.',
      '',
      'Signal data:',
      '- Amplitude: ' + signal.amplitude + ' counts',
      '- Frequency: ' + signal.frequency + ' Hz',
      '- Phase: ' + signal.phase + ' rad',
      '',
      'Classify this signal. Respond in JSON with fields: classification (noise, anomaly or unknown), confidence (self-reported score, 0.0-1.0), reasoning (explanation).',
    ];
    return lines.join('\n');
  }
testCode: |
  describe('buildPrompt', () => {
    const signal = { amplitude: 1024, frequency: 73.4, phase: 0.23 };
    const promptFor = (input) => {
      const prompt = buildPrompt(input);
      expect(
        prompt,
        'buildPrompt has to return the finished prompt string. While it returns null there is nothing to send the model.',
      ).toBeDefined();
      return prompt;
    };
    const lines = (prompt) =>
      prompt.split('\n').map((line) => line.trim()).filter((line) => line.length > 0);
    const REFERENCE = ['5', '12', '23', '47'];

    // Readings are DRAWN, never listed. A map from the graded signals to
    // hand-written prompts cleared every fixed-literal version of this suite,
    // including the test named for catching exactly that. The draw rejects any
    // triple whose printed values overlap each other or the fixed text of the
    // prompt, so "one line carries this value" stays a question about layout.
    const FIXED = ['5, 12, 23, 47', '570 to 1560', '0.0-1.0'];
    const drawSignal = (avoid) => {
      const blocked = FIXED.concat(avoid || []);
      for (;;) {
        const amplitude = 206 + Math.floor(Math.random() * 1841);
        const frequency = Math.round((60 + Math.random() * 59) * 10) / 10;
        const phase = Math.round((Math.random() * 6 - 3) * 100) / 100;
        if (!/^\d{2,3}\.\d$/.test(String(frequency))) continue;
        if (!/^-?\d\.\d\d$/.test(String(phase))) continue;
        const strs = [String(amplitude), String(frequency), String(phase)];
        const overlaps = strs.some((a, i) =>
          strs.some((b, j) => i !== j && (a.includes(b) || b.includes(a))),
        );
        const collides = strs.some((a) => blocked.some((b) => b.includes(a) || a.includes(b)));
        if (!overlaps && !collides) return { amplitude, frequency, phase };
      }
    };
    const printed = (input) => [String(input.amplitude), String(input.frequency), String(input.phase)];

    it('includes the signal data', () => {
      const prompt = promptFor(signal);
      expect(prompt).toContain('1024');
      expect(prompt).toContain('73.4');
    });

    it('states the reference frequencies together on one line, and says what they are', () => {
      for (const input of [signal, drawSignal(), drawSignal()]) {
        const parts = lines(promptFor(input));
        const reference = parts.filter((line) => REFERENCE.every((hz) => line.includes(hz)));
        expect(
          reference,
          'Put the supplied natural-frequency catalogue together on a separate reference line.',
        ).toHaveLength(1);
        expect(
          reference[0].toLowerCase(),
          'Four bare numbers are not context. The line has to say what they are, which is the set of frequencies known to be natural here.',
        ).toContain('natural');
        expect(
          reference[0].toLowerCase(),
          'Label the quantity with frequencies or Hz.',
        ).toMatch(/frequenc|hz/);
        for (const value of printed(input)) {
          expect(
            reference[0],
            'Keep the reference catalogue separate from the current reading.',
          ).not.toContain(value);
        }
      }
    });

    it('requests JSON output and names all three fields', () => {
      const prompt = promptFor(drawSignal());
      const lower = prompt.toLowerCase();
      expect(lower).toContain('json');
      expect(
        lower,
        'Output you cannot parse is output you cannot use. Name every field you intend to read.',
      ).toContain('classification');
      expect(lower).toContain('confidence');
      expect(lower).toContain('reasoning');
      for (const line of lines(prompt)) {
        if (!line.toLowerCase().includes('json')) continue;
        expect(
          line.toLowerCase(),
          'Request JSON rather than prohibiting JSON. Asking to omit surrounding prose is allowed.',
        ).not.toMatch(/\b(?:never|not|don't|omit|without)\s+(?:(?:return|produce|output|use|include)\s+|respond\s+(?:in|with)\s+)?json\b/);
      }
    });

    it('opens with the role, and the role says what the model is doing', () => {
      for (const input of [signal, drawSignal()]) {
        const first = lines(promptFor(input))[0];
        expect(first).toContain('DEEP SCAN');
        expect(
          first.toLowerCase(),
          'A name on its own is an address label. The role line has to tell the model what job it is doing here.',
        ).toMatch(/classif|label|categori[sz]/);
        expect(
          first.toLowerCase(),
          'Name signals as the subject of the classification task.',
        ).toContain('signal');
        for (const value of printed(input)) expect(first).not.toContain(value);
        for (const hz of REFERENCE) {
          expect(
            first,
            'This template keeps role and reference context on separate lines.',
          ).not.toContain(hz);
        }
        expect(first.toLowerCase()).not.toContain('json');
      }
    });

    it('orders the parts role, context, data, format', () => {
      for (const input of [signal, drawSignal(), drawSignal()]) {
        const prompt = promptFor(input);
        const role = prompt.indexOf('DEEP SCAN');
        const context = prompt.indexOf('47');
        const data = prompt.indexOf(String(input.frequency));
        const format = prompt.toLowerCase().indexOf('json');
        expect(role).toBeGreaterThan(-1);
        expect(context).toBeGreaterThan(role);
        expect(data).toBeGreaterThan(context);
        expect(format).toBeGreaterThan(data);
      }
    });

    it('puts each value on its own line beside its label, for any signal', () => {
      const check = (input) => {
        const parts = lines(promptFor(input));
        const carrying = (value) => parts.filter((line) => line.includes(String(value)));
        const amp = carrying(input.amplitude);
        const freq = carrying(input.frequency);
        const phase = carrying(input.phase);
        expect(amp).toHaveLength(1);
        expect(freq).toHaveLength(1);
        expect(phase).toHaveLength(1);
        expect(amp[0].toLowerCase()).toContain('amplitude');
        expect(freq[0].toLowerCase()).toContain('frequency');
        expect(phase[0].toLowerCase()).toContain('phase');
        const wrongLabels = {
          amplitude: ['frequency', 'phase'],
          frequency: ['amplitude', 'phase'],
          phase: ['amplitude', 'frequency'],
        };
        const labelled = [['amplitude', amp[0]], ['frequency', freq[0]], ['phase', phase[0]]];
        for (const entry of labelled) {
          for (const wrong of wrongLabels[entry[0]]) {
            expect(
              entry[1].toLowerCase(),
              'Give each value its own correct label. Do not attach all three labels to one value.',
            ).not.toContain(wrong);
          }
        }
        expect(amp[0]).not.toBe(freq[0]);
        expect(freq[0]).not.toBe(phase[0]);
        expect(amp[0]).not.toBe(phase[0]);
        for (const line of [amp[0], freq[0], phase[0]]) {
          expect(line).not.toContain('DEEP SCAN');
          expect(line.toLowerCase()).not.toContain('json');
        }
      };
      check(signal);
      for (let i = 0; i < 5; i += 1) check(drawSignal());
    });

    it('templates the input, not a memorized string (readings drawn at grade time)', () => {
      for (let i = 0; i < 6; i += 1) {
        const first = drawSignal();
        const second = drawSignal(printed(first));
        const one = promptFor(first);
        const two = promptFor(second);
        for (const value of printed(first)) {
          expect(
            one,
            'Build each prompt from the supplied reading.',
          ).toContain(value);
          expect(two).not.toContain(value);
        }
        for (const value of printed(second)) {
          expect(two).toContain(value);
          expect(one).not.toContain(value);
        }
      }
      // A prompt stored for the reading in the lesson and handed back on
      // sight survives two fresh draws, because neither draw looks like the
      // one it memorized. Move ONE dial off that reading instead.
      const dials = ['amplitude', 'frequency', 'phase'];
      for (const dial of dials) {
        const fresh = drawSignal(printed(signal));
        const input = {
          amplitude: signal.amplitude,
          frequency: signal.frequency,
          phase: signal.phase,
        };
        input[dial] = fresh[dial];
        const prompt = promptFor(input);
        expect(
          prompt,
          'Use the changed value even when the other two values match a previous reading.',
        ).toContain(String(fresh[dial]));
        expect(
          prompt,
          'This capture no longer holds that value, so no line of its prompt may carry it. Seeing it means the prompt came from a stored string rather than from the argument.',
        ).not.toContain(String(signal[dial]));
      }
    });
  });
estimatedMinutes: 10
difficulty: beginner
