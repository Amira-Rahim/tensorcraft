slug: temporal-attention
lessonSlug: temporal-attention
title: "Temporal Attention Over a Window"
mlContent: model
instructions: |
  Build temporalAttention(sequence, scorerWeights). sequence contains readings with shape [T, d]. scorerWeights has shape [d + 1, 1]. Its last row gives a weight to position.

  Add a position column to sequence. Positions run evenly from 0 at the first step to 1 at the last. For a single step, use position 0. Multiply these extended readings by scorerWeights to get one score per step. Flatten those scores and apply softmax to produce weights with shape [T].

  Use those weights to combine the original readings, without the extra position column. The resulting summary has shape [d]. Return { summary, weights }, keeping both as tensors.

  Remove only the batch axis. When d is 1, summary must keep shape [1]. A scalar would lose the feature axis. The sequence is non-empty. Use tf.tidy to free temporary tensors while keeping the caller's inputs and both returned tensors alive.
starterCode: |
  function temporalAttention(sequence, scorerWeights) {
    // Add position when calculating scores.
    // Combine the original readings, without the position column.
    return { summary: null, weights: null };
  }
solutionCode: |
  function temporalAttention(sequence, scorerWeights) {
    return tf.tidy(() => {
      const [T] = sequence.shape;
      const pos = tf.linspace(0, 1, T).reshape([T, 1]);
      const withPos = tf.concat([sequence, pos], 1);
      const scores = tf.matMul(withPos, scorerWeights).reshape([T]);
      const weights = tf.softmax(scores);
      const summary = tf.matMul(weights.reshape([1, T]), sequence).squeeze([0]);
      return { summary, weights };
    });
  }
testCode: |
  describe('temporalAttention (real tf.matMul + softmax)', () => {
    const readings = () => tf.tensor2d([[2, 4], [9, 1], [3, 5]]);

    // Every test goes through this, so the first Run of the starter reads
    // as a missing return value rather than a property access on null, and
    // a throw from inside the submission arrives in words of its own rather
    // than as a raw library notice.
    const parts = (call) => {
      let out;
      try {
        out = call();
      } catch (err) {
        const detail = (err && err.message) || String(err);
        if (detail.toLowerCase().indexOf('softmax') !== -1) {
          throw new Error(
            'tf.softmax operates along the last axis. Reshape the [T, 1] scores to [T], then apply softmax across the steps. TensorFlow.js error: ' + detail,
          );
        }
        throw new Error(
          'temporalAttention threw before it returned a summary and weights. tfjs said: ' + detail,
        );
      }
      expect(
        out,
        'Return an object with two tensors: summary and weights.',
      ).toBeDefined();
      expect(
        out && out.weights,
        'weights is missing. Return one softmax weight per time step.',
      ).toBeDefined();
      expect(
        out && out.summary,
        'summary is missing. Return the weighted sum of the readings, with one number per feature.',
      ).toBeDefined();
      return out;
    };

    it('returns a [d] summary and [T] weights that sum to 1', () => {
      const out = parts(() =>
        temporalAttention(tf.randomNormal([10, 16]), tf.randomNormal([17, 1])),
      );
      expect(
        out.summary.shape,
        'Return one number per original reading column. Leave the position column out of the summary. A [T] result suggests you pooled across features. Pool over time to keep one output per feature.',
      ).toEqual([16]);
      expect(
        out.weights.shape,
        'One weight per time step, so this window of 10 steps needs 10 of them.',
      ).toEqual([10]);
      expect(
        out.weights.sum().dataSync()[0],
        'The attention weights must add to 1. Apply softmax to the scores. Do not just divide them by the number of steps.',
      ).toBeCloseTo(1, 4);
    });
    it('a zero scorer spreads the weight evenly, so the summary is the column average', () => {
      const out = parts(() => temporalAttention(readings(), tf.zeros([3, 1])));
      const w = Array.from(out.weights.dataSync());
      const s = Array.from(out.summary.dataSync());
      expect(
        w[0],
        'Every step scores zero here, including the position column, so the weight splits evenly over the three steps.',
      ).toBeCloseTo(1 / 3, 4);
      expect(
        s[0],
        'Even weights make the summary the plain column average of the readings.',
      ).toBeCloseTo(4.6667, 3);
      expect(
        s[1],
        'Both columns use the same pooling weights, so the second one averages too.',
      ).toBeCloseTo(3.3333, 3);
    });
    it('the top-weighted index is the step the scorer scores highest', () => {
      const out = parts(() =>
        temporalAttention(readings(), tf.tensor2d([[10], [0], [0]])),
      );
      expect(
        out.weights.argMax().dataSync()[0],
        'This scorer weights the first reading column heavily and ignores the rest, so the step with the largest first reading wins.',
      ).toBe(1);
      expect(
        Array.from(out.summary.dataSync())[0],
        'A weight this concentrated pulls the summary onto the winning step, so the first column reads that step back.',
      ).toBeCloseTo(9, 3);
    });
    it('position is a scored feature: the scorer can prefer late steps', () => {
      const out = parts(() =>
        temporalAttention(readings(), tf.tensor2d([[0], [0], [20]])),
      );
      expect(
        out.weights.argMax().dataSync()[0],
        'This scorer uses only position. Include the position column when calculating scores.',
      ).toBe(2);
      expect(
        Array.from(out.summary.dataSync())[1],
        'The scorer prefers the latest step, so the summary reads that step back.',
      ).toBeCloseTo(5, 3);
      recordResult({
        kind: 'series', title: 'Where your positional scorer puts its weight',
        summary: 'Three synthetic readings, with a supplied scorer that uses position alone. Larger weights give a reading more influence in the blend. They cannot establish a cause or an anomaly verdict.',
        xLabel: 'Time step index', yLabel: 'Attention weight',
        labels: Array.from(out.weights.dataSync(), (_, i) => String(i)),
        series: [{ name: 'Your attention weights', values: Array.from(out.weights.dataSync()) }],
      });
      recordResult({
        kind: 'table', title: 'Your pooled readings',
        summary: 'The position column affects scores but stays out of the returned feature summary.',
        columns: ['Reading feature index', 'Your summary value'],
        rows: Array.from(out.summary.dataSync(), (value, i) => [i, value]),
      });
    });
    it('moderate scores give the largest weight about half the total', () => {
      // The scores here come out 0, 0.5 and 1. That spread is small enough
      // that the softmax stays soft: the top step takes about half the
      // weight and the other two keep the rest. The other fixtures score
      // with an extreme scorer, where the softmax lands within 5e-5 of a
      // one-hot pick (the position fixture's runner-up weighs 4.5e-5), so
      // this fixture is where a hard pick and a real softmax come apart by
      // a margin the tests can see.
      const mild = tf.tensor2d([[0, 4], [0.25, 2], [0.5, 0]]);
      const out = parts(() =>
        temporalAttention(mild, tf.tensor2d([[1], [0], [0.5]])),
      );
      const w = Array.from(out.weights.dataSync());
      const s = Array.from(out.summary.dataSync());
      expect(
        out.summary.shape,
        'The summary must contain one number for each original reading column, two here. Leave out the position column.',
      ).toEqual([2]);
      expect(
        w[2],
        'The last step has the highest score, but its softmax weight is below 1. Keep the weighted contributions from the other steps too.',
      ).toBeCloseTo(0.5065, 3);
      expect(
        w[0],
        'The lowest-scoring step still keeps a real share. For these finite, mild scores, every step keeps a positive share.',
      ).toBeCloseTo(0.1863, 3);
      expect(
        s[0],
        'The summary is the weighted sum of all three readings. Returning the winning row alone reads 0.5 on this column.',
      ).toBeCloseTo(0.33, 3);
      expect(
        s[1],
        'The scorer ignores this column, but its values still contribute to the weighted summary. The winning row alone reads 0 here and a flat average reads 2.',
      ).toBeCloseTo(1.3597, 3);
    });
    it('a window and its reversal no longer summarize the same', () => {
      const positionScorer = tf.tensor2d([[0], [0], [20]]);
      const forward = parts(() => temporalAttention(readings(), positionScorer));
      const reversed = parts(() =>
        temporalAttention(
          tf.tensor2d([[3, 5], [9, 1], [2, 4]]),
          positionScorer,
        ),
      );
      expect(
        Array.from(forward.summary.dataSync())[0],
        'These two windows hold the same three readings in opposite order. The position column is the only thing that can tell them apart.',
      ).toBeCloseTo(3, 3);
      expect(
        Array.from(reversed.summary.dataSync())[0],
        'Reversing the window has to move the summary. A pooling that ignores position returns the same number twice.',
      ).toBeCloseTo(2, 3);
    });
    it('rederives scores, softmax and pooling on a window drawn at random', () => {
      const T = 5;
      const d = 3;
      const spread = () => (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random());
      const rows = [];
      for (let t = 0; t < T; t++) {
        const row = [];
        for (let i = 0; i < d; i++) row.push(Math.random() * 2 - 1);
        rows.push(row);
      }
      const scorer = [];
      for (let i = 0; i <= d; i++) scorer.push([spread()]);
      const scores = rows.map(
        (row, t) =>
          row.reduce((s, v, i) => s + v * scorer[i][0], 0) +
          (t / (T - 1)) * scorer[d][0],
      );
      const top = Math.max.apply(null, scores);
      const exps = scores.map((s) => Math.exp(s - top));
      const total = exps.reduce((a, b) => a + b, 0);
      const weights = exps.map((e) => e / total);
      const out = parts(() => temporalAttention(tf.tensor2d(rows), tf.tensor2d(scorer)));
      expect(
        out.weights.shape,
        'One weight per step of this drawn window. A weights tensor of another length did not come from a softmax over these five scores.',
      ).toEqual([T]);
      expect(
        out.summary.shape,
        'One number per reading column, three here. A summary with an extra column means you pooled the position column too. Apply the weights to the original readings.',
      ).toEqual([d]);
      const gotWeights = Array.from(out.weights.dataSync());
      for (let t = 0; t < T; t++) {
        expect(
          gotWeights[t],
          'This window and this scorer are drawn fresh on every run, so the weights have to come from scoring these readings and this position column.',
        ).toBeCloseTo(weights[t], 3);
      }
      const gotSummary = Array.from(out.summary.dataSync());
      for (let i = 0; i < d; i++) {
        const expected = rows.reduce((s, row, t) => s + weights[t] * row[i], 0);
        expect(
          gotSummary[i],
          'Calculate the weighted sum of the original readings using the attention weights. Exclude the added position column from the summary.',
        ).toBeCloseTo(expected, 3);
      }
    });
  });

  it('uses position zero for a single step', () => {
    const r = temporalAttention(tf.tensor2d([[7]]), tf.tensor2d([[0], [20]]));
    expect(r.summary.shape).toEqual([1]);
    expect(r.summary.dataSync()[0]).toBe(7);
    expect(Array.from(r.weights.dataSync())).toEqual([1]);
  });
  it('keeps a one-feature summary axis',()=>{const r=temporalAttention(tf.tensor2d([[2],[4]]),tf.zeros([2,1]));expect(r.summary.shape).toEqual([1]);});
estimatedMinutes: 15
difficulty: intermediate
skillAxis: model_arch
