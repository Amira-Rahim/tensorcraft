slug: temporal-attention
lessonSlug: temporal-attention
title: "Temporal Attention Over a Window"
mlContent: data
instructions: "Build `temporalAttention(sequence, scorerWeights)`. `sequence` is a [T, d] tensor of readings; `scorerWeights` is a [d + 1, 1] linear scorer whose last row weights position. Concatenate a position column (step index scaled to [0, 1]) onto the readings, score every step with one matMul, softmax the [T] scores into weights, then pool the ORIGINAL readings into a [d] summary. Return `{ summary, weights }`. Skip the position column and the scorer's shape will not line up."
starterCode: |
  function temporalAttention(sequence, scorerWeights) {
    // 1. position column: [T, 1], first step 0, last step 1
    // 2. concat it onto the readings along axis 1  -> [T, d + 1]
    // 3. score with the scorer, reshape [T, 1]      -> [T]
    // 4. weights = tf.softmax(scores)               -> [T]
    // 5. pool the ORIGINAL [T, d] sequence under the weights -> [d]
    return { summary: null, weights: null };
  }
solutionCode: |
  function temporalAttention(sequence, scorerWeights) {
    const [T] = sequence.shape;
    const pos = tf.linspace(0, 1, T).reshape([T, 1]);
    const withPos = tf.concat([sequence, pos], 1);
    const scores = tf.matMul(withPos, scorerWeights).reshape([T]);
    const weights = tf.softmax(scores);
    const summary = tf.matMul(weights.reshape([1, T]), sequence).squeeze();
    return { summary, weights };
  }
testCode: |
  describe('temporalAttention (real tf.matMul + softmax)', () => {
    const readings = () => tf.tensor2d([[2, 4], [9, 1], [3, 5]]);

    it('returns a [d] summary and [T] weights that sum to 1', () => {
      const out = temporalAttention(
        tf.randomNormal([10, 16]),
        tf.randomNormal([17, 1]),
      );
      expect(out.summary.shape).toEqual([16]);
      expect(out.weights.shape).toEqual([10]);
      expect(out.weights.sum().dataSync()[0]).toBeCloseTo(1, 4);
    });
    it('a zero scorer spreads the weight evenly, so the summary is the column average', () => {
      const out = temporalAttention(readings(), tf.zeros([3, 1]));
      const w = Array.from(out.weights.dataSync());
      const s = Array.from(out.summary.dataSync());
      expect(w[0]).toBeCloseTo(1 / 3, 4);
      expect(s[0]).toBeCloseTo(4.6667, 3);
      expect(s[1]).toBeCloseTo(3.3333, 3);
    });
    it('the top-weighted index is the step the scorer scores highest', () => {
      const out = temporalAttention(readings(), tf.tensor2d([[10], [0], [0]]));
      expect(out.weights.argMax().dataSync()[0]).toBe(1);
      expect(Array.from(out.summary.dataSync())[0]).toBeCloseTo(9, 3);
    });
    it('position is a scored feature: the scorer can prefer late steps', () => {
      const out = temporalAttention(readings(), tf.tensor2d([[0], [0], [20]]));
      expect(out.weights.argMax().dataSync()[0]).toBe(2);
      expect(Array.from(out.summary.dataSync())[1]).toBeCloseTo(5, 3);
    });
    it('a window and its reversal no longer summarize the same', () => {
      const positionScorer = tf.tensor2d([[0], [0], [20]]);
      const forward = temporalAttention(readings(), positionScorer);
      const reversed = temporalAttention(
        tf.tensor2d([[3, 5], [9, 1], [2, 4]]),
        positionScorer,
      );
      expect(Array.from(forward.summary.dataSync())[0]).toBeCloseTo(3, 3);
      expect(Array.from(reversed.summary.dataSync())[0]).toBeCloseTo(2, 3);
    });
  });
