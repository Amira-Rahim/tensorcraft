slug: temporal-attention
lessonSlug: temporal-attention
title: "Temporal Attention Weighted Summary"
mlContent: data
instructions: "Build `temporalSummary(sequence, attentionWeights)` taking [T, d] sequence + [T] attention weights, and returning a [d] weighted summary."
starterCode: |
  function temporalSummary(sequence, attentionWeights) {
    return null;
  }
solutionCode: |
  function temporalSummary(sequence, attentionWeights) {
    const weightsCol = attentionWeights.reshape([1, attentionWeights.shape[0]]);
    return tf.matMul(weightsCol, sequence).squeeze();
  }
testCode: |
  describe('temporalSummary (real tf.matMul)', () => {
    it('returns [d] shape', () => {
      const seq = tf.randomNormal([10, 16]);
      const w = tf.softmax(tf.randomNormal([10]));
      const out = temporalSummary(seq, w);
      expect(out.shape).toEqual([16]);
    });
    it('attention=[1,0,0] selects first timestep', () => {
      const seq = tf.tensor2d([[1, 2], [3, 4], [5, 6]]);
      const w = tf.tensor1d([1, 0, 0]);
      const out = temporalSummary(seq, w);
      expect(Array.from(out.dataSync())).toEqual([1, 2]);
    });
    it('uniform attention → average', () => {
      const seq = tf.tensor2d([[2, 4], [4, 8]]);
      const w = tf.tensor1d([0.5, 0.5]);
      const out = temporalSummary(seq, w);
      expect(Array.from(out.dataSync())).toEqual([3, 6]);
    });
  });
estimatedMinutes: 12
difficulty: intermediate
skillAxis: model_arch
