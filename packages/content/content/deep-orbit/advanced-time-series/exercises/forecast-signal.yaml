slug: forecast-signal
lessonSlug: forecasting
title: "Roll Forward, Then Replay One Step at a Time"
instructions: |
  Train a one-step model, then run it twice over the same stretch: once as a rollout that feeds itself, once re-seeded from the readings that actually arrived.

  What you are given. `trainX` is a [windows, windowSize, 1] tensor of past readings, and `trainY` is the [windows, 1] tensor holding the reading that followed each window. Both are built for you, and `windowSize` is `trainX.shape[1]`. `past` holds every reading up to now, oldest first, and `arrived` holds the ones that turned up afterwards, so this is a forecast being replayed against what really happened. `epochs` is how many passes to train for. Read it from the arguments, because the grader runs this twice with different values.

  What to build. Stack `tf.sequential()` with `tf.layers.lstm({ units: 8, inputShape: [windowSize, 1] })` and then `tf.layers.dense({ units: 1 })`. Compile it with the adam optimizer and meanSquaredError loss, then `await model.fit(trainX, trainY, { epochs, batchSize: 8 })` and keep what fit resolves to. Every prediction goes in the same way: the LAST `windowSize` values of a history, handed to `model.predict` as one [1, windowSize, 1] tensor, with the single number read out of the [1, 1] result. `rollout` is `arrived.length` predictions where each one is appended to the history before the next step, so from step 2 on the model is reading its own output. `oneStep` is `arrived.length` predictions where the history is `past` followed by the arrived readings BEFORE that step. Step 1 reads `past` alone, step 2 reads `past` plus the first arrived reading, and no prediction ever re-enters it. Leave `past` and `arrived` as you found them, and return `{ model, history, rollout, oneStep }` with both series plain arrays of numbers, oldest first.

  What the grader ties together. It recomputes both arms beside you out of your own model and compares them step by step. It also reads `model.optimizer.iterations` against the length of the loss trace you hand back. The optimizer increments that counter once per batch and refuses to be assigned, so a trace built by hand does not agree with a real fit. It reads the first and last entries of that trace too, and checks the loss fell over the run, since weights that never moved are not a forecaster.
