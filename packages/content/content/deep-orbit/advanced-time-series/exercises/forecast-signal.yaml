slug: forecast-signal
lessonSlug: forecasting
title: "Roll Forward, Then Replay One Step at a Time"
instructions: |
  Implement forecastTwoWays(trainX, trainY, past, arrived, epochs, providedModel?).
  trainX is [windows, windowSize, 1], trainY is [windows, 1]. past contains at
  least windowSize finite readings, oldest first. arrived contains the later
  readings against which both forecasts will be compared.

  Use providedModel as compiled when supplied. Otherwise build an 8-unit LSTM
  with inputShape [windowSize, 1] and a linear Dense output of 1. Compile with
  'adam' and 'meanSquaredError'. Await fit(trainX, trainY, { epochs, batchSize: 8 }).

  Build arrived.length predictions in each arm. Each predict call reads the
  last windowSize readings as [1, windowSize, 1] and returns one finite scalar.
  rollout starts from past and appends each prediction before the next call.
  oneStep uses past plus only the arrived readings BEFORE the target step.
  Never append a prediction to oneStep's input history. Keep both input arrays
  unchanged. Return { model, history, rollout, oneStep }, with the exact fit
  history and both series as plain number arrays.

  Free prediction tensors, including on failure. Keep caller-owned inputs and
  a supplied model alive. Dispose a newly created model if fitting or prediction
  fails; on success the caller owns it. No fixed improvement or difference
  between the two series is required: correct code can still forecast poorly.
starterCode: |
