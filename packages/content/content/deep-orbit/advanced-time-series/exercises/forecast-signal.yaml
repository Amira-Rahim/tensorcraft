slug: forecast-signal
lessonSlug: forecasting
title: "Recursive forecasts and one-step replay"
instructions: |
  Implement forecastTwoWays(trainX, trainY, past, arrived, epochs, providedModel?). trainX has shape [windows, windowSize, 1], and trainY has shape [windows, 1]. past contains at least windowSize finite readings, oldest first. arrived contains the later readings you will compare both forecasts against.

  Use providedModel with its existing compilation when the caller supplies it. Otherwise build an 8-unit LSTM with inputShape [windowSize, 1], followed by a linear Dense layer with 1 output. Compile with 'adam' and 'meanSquaredError'. Await fit(trainX, trainY, { epochs, batchSize: 8 }).

  Create arrived.length predictions in each run. Every predict call takes the last windowSize readings as [1, windowSize, 1] and must return one finite number.

  For rollout, start with past and add each prediction to the history before the next call. For oneStep, use past plus only the arrived readings from before the step you are predicting. Never add predictions to oneStep's history. Leave both input arrays unchanged.

  Return { model, history, rollout, oneStep }. Use the exact history returned by fit, and return both prediction series as plain number arrays.

  Dispose prediction tensors even if a call fails. Keep the caller's input tensors and any supplied model alive. If a model you created fails during training or prediction, dispose it. On success, the caller owns that model. The two runs do not have to differ or reach a fixed quality score. Correct code can still make poor forecasts.
