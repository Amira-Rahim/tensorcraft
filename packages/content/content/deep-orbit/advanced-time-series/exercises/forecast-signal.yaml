lessonSlug: forecasting
title: "Multi-Step Forecast"
instructions: "Write a function that generates a multi-step forecast. Given a prediction function (that takes a window of values and returns the next value), a seed array of historical values, a window size, and a horizon (number of steps to predict), generate the forecast by feeding each prediction back as input. Every call to the prediction function must receive exactly windowSize values, not the whole history. The prediction function is called once per step, and from step 2 on the window it receives already holds the values you predicted."
starterCode: |
  function forecast(
    predictNext: (window: number[]) => number,
    seed: number[],
    windowSize: number,
    horizon: number,
  ): number[] {
    // For each step in horizon:
    //   1. Take the last windowSize values
    //   2. Predict the next value
    //   3. Append to the data
    // Return only the predicted values
    return null; // your code here
  }
solutionCode: |
  function forecast(
    predictNext: (window: number[]) => number,
    seed: number[],
    windowSize: number,
    horizon: number,
  ): number[] {
    const data = [...seed];
    const predictions: number[] = [];
    for (let i = 0; i < horizon; i++) {
      const window = data.slice(-windowSize);
      const next = predictNext(window);
      predictions.push(next);
      data.push(next);
    }
    return predictions;
  }
testCode: |
  describe('forecast', () => {
    const identity = (w: number[]) => w[w.length - 1];
    it('returns correct number of predictions', () => {
      expect(forecast(identity, [1, 2, 3], 3, 5).length).toBe(5);
    });
    // The prediction here doubles the window's last value, so a fed-back
    // forecast grows geometrically and an arithmetic ramp cannot fake it.
    // The captured windows are the real check: window 2 and window 3 have
    // to contain the values predicted at steps 1 and 2.
    it('feeds each prediction back into the next window', () => {
      const windows: number[][] = [];
      const doubleLast = (w: number[]) => {
        windows.push([...w]);
        return w[w.length - 1] * 2;
      };
      const result = forecast(doubleLast, [3, 4, 5], 3, 3);
      expect(result).toEqual([10, 20, 40]);
      expect(windows).toEqual([
        [3, 4, 5],
        [4, 5, 10],
        [5, 10, 20],
      ]);
    });
    it('calls the prediction function once per horizon step', () => {
      let calls = 0;
      const counted = (w: number[]) => {
        calls += 1;
        return w[w.length - 1];
      };
      forecast(counted, [7, 7, 7], 3, 6);
      expect(calls).toBe(6);
    });
    // windowSize 2 against a 4-value seed: by step 3 the window holds
    // nothing but predictions, so a solution that keeps re-reading the seed
    // diverges here even if it calls the model every step.
    it('slides the window off the seed and onto the predictions', () => {
      const sumWindow = (w: number[]) => w.reduce((a, b) => a + b, 0);
      expect(forecast(sumWindow, [1, 1, 1, 1], 2, 5)).toEqual([2, 3, 5, 8, 13]);
    });
    it('uses correct window size', () => {
      let lastWindow: number[] = [];
      const capture = (w: number[]) => { lastWindow = w; return 0; };
      forecast(capture, [1, 2, 3, 4, 5], 3, 1);
      expect(lastWindow.length).toBe(3);
    });
  });
