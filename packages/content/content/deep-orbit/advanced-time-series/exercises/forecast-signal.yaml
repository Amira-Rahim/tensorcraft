solutionCode: |
  async function forecastTwoWays(trainX, trainY, past, arrived, epochs, providedModel) {
    const windowSize = trainX.shape[1];
    const model = providedModel || tf.sequential();
    if (!providedModel) {
      model.add(tf.layers.lstm({ units: 8, inputShape: [windowSize, 1] }));
      model.add(tf.layers.dense({ units: 1 }));
      model.compile({ optimizer: 'adam', loss: 'meanSquaredError' });
    }
    try {
      const history = await model.fit(trainX, trainY, { epochs, batchSize: 8 });

      const predictFrom = (readings) =>
        tf.tidy(() => {
          const window = readings.slice(-windowSize).map((value) => [value]);
          const output = model.predict(tf.tensor3d([window])).dataSync();
          if (output.length !== 1 || !Number.isFinite(output[0])) throw new Error('Invalid prediction');
          return output[0];
        });

      const fedBack = [...past];
      const rollout = [];
      for (let step = 0; step < arrived.length; step++) {
        const next = predictFrom(fedBack);
        rollout.push(next);
        fedBack.push(next);
      }

      const oneStep = [];
      for (let step = 0; step < arrived.length; step++) {
        oneStep.push(predictFrom([...past, ...arrived.slice(0, step)]));
      }

      return { model, history, rollout, oneStep };
    } catch (error) {
      if (!providedModel) model.dispose();
      throw error;
    }
  }
testCode: |
  // A calm stretch of one DEEP SCAN channel: min-max normalized amplitude,
  // one reading per second, inside the band module 7 baselined as normal.
  // Period, phase and swing are drawn at run time, so the weights this model
  // trains to are different on every run and neither arm can be memorised.
  const buildCase = (windowSize, length, horizon) => {
    const period = 6 + Math.floor(Math.random() * 5);
    const phase = Math.random() * Math.PI * 2;
    const swing = 0.12 + Math.random() * 0.1;
    const readings = [];
    for (let t = 0; t < length + horizon; t++) {
      readings.push(0.5 + swing * Math.sin(phase + (2 * Math.PI * t) / period));
    }
    const past = readings.slice(0, length);
    const arrived = readings.slice(length);
    const windows = [];
    const targets = [];
    for (let i = 0; i + windowSize < past.length; i++) {
      windows.push(past.slice(i, i + windowSize).map((v) => [v]));
      targets.push([past[i + windowSize]]);
    }
    return {
      past,
      arrived,
      windowSize,
      trainX: tf.tensor3d(windows),
      trainY: tf.tensor2d(targets),
      batchesPerEpoch: Math.ceil(windows.length / 8),
    };
  };

  const CASE_A = buildCase(6 + Math.floor(Math.random() * 5), 48, 8);
  const EPOCHS_A = 20;
  const pastA = CASE_A.past.slice();
  const arrivedA = CASE_A.arrived.slice();

  // A second width and a second epoch count, so a submission that pins either
  // one to what it saw the first time is caught.
  const CASE_B = buildCase(CASE_A.windowSize + 3, 40, 4);
  const EPOCHS_B = 5;

  // Training runs once per case, no matter how many tests read it.
  let runA = null;
  let runB = null;
  const caseA = () => {
    if (!runA) {
      runA = forecastTwoWays(CASE_A.trainX, CASE_A.trainY, pastA, arrivedA, EPOCHS_A);
    }
    return runA;
  };
  const caseB = () => {
    if (!runB) {
      runB = forecastTwoWays(
        CASE_B.trainX,
        CASE_B.trainY,
        CASE_B.past.slice(),
        CASE_B.arrived.slice(),
        EPOCHS_B,
      );
    }
    return runB;
  };

  // One place to say what is missing, so the first Run on the untouched
  // starter names the task instead of reading a property off null.
  const outcome = async (run) => {
    const out = await run;
    expect(
      out,
      'forecastTwoWays returned nothing. Train the model, forecast each new reading using both methods, and return the model, training history, and two prediction arrays.',
    ).toBeTruthy();
    expect(
      out.model && typeof out.model.predict,
      'Return the tf.LayersModel you trained. The checks use it to recalculate both prediction arrays.',
    ).toBe('function');
    expect(
      !!(out.history && out.history.history && Array.isArray(out.history.history.loss)),
      'history is what model.fit resolved to, and its history.loss is the per-epoch trace.',
    ).toBe(true);
    expect(
      Array.isArray(out.rollout) && Array.isArray(out.oneStep),
      'rollout and oneStep both come back as plain arrays of numbers, oldest first.',
    ).toBe(true);
    return out;
  };

  const predictBeside = (model, readings, windowSize) =>
    tf.tidy(() => {
      const window = readings.slice(-windowSize).map((value) => [value]);
      return model.predict(tf.tensor3d([window])).dataSync()[0];
    });

  const rollBeside = (model, past, steps, windowSize) => {
    const history = past.slice();
    const rows = [];
    for (let step = 0; step < steps; step++) {
      const next = predictBeside(model, history, windowSize);
      rows.push(next);
      history.push(next);
    }
    return rows;
  };

  const replayBeside = (model, past, arrived, windowSize) => {
    const rows = [];
    for (let step = 0; step < arrived.length; step++) {
      rows.push(predictBeside(model, past.concat(arrived.slice(0, step)), windowSize));
    }
    return rows;
  };

  describe('forecastTwoWays', () => {
    it('returns one prediction per observed reading for both methods without changing the inputs', async () => {
      const out = await outcome(caseA());
      expect(
        out.rollout.length,
        'Return one rollout prediction per new observation so you can compare matching positions in the arrays.',
      ).toBe(CASE_A.arrived.length);
      expect(
        out.oneStep.length,
        'Return one replay prediction per new observation.',
      ).toBe(CASE_A.arrived.length);
      out.rollout.concat(out.oneStep).forEach((value) => {
        expect(
          typeof value,
          'Every entry is one number. A [1, 1] tensor or a one-element array means your code still needs to read the numeric prediction from the result.',
        ).toBe('number');
        expect(
          Number.isFinite(value),
          'A NaN here means the window went in the wrong shape or a history picked up something that is not a number.',
        ).toBe(true);
      });
      expect(
        pastA.length,
        'Copy the past readings before appending predictions. Keep the supplied array unchanged.',
      ).toBe(CASE_A.past.length);
      expect(arrivedA.length, 'Keep the supplied observations unchanged.').toBe(
        CASE_A.arrived.length,
      );
      recordResult({
        kind: 'series', title: 'Predictions using forecast history or observed history',
        summary: 'Actual predictions from your trained model on the synthetic series generated for this run. Rollout feeds predictions back. Replay receives the observations that have arrived. Compare each horizon without assuming either method must win.',
        xLabel: 'Steps ahead', yLabel: 'Synthetic scalar value',
        labels: out.rollout.map((_, i) => String(i + 1)),
        series: [
          { name: 'Observed', values: CASE_A.arrived },
          { name: 'Your rollout', values: out.rollout },
          { name: 'Your one-step replay', values: out.oneStep },
        ],
      });
    });

    it('builds the recurrent stack the instructions describe', async () => {
      const out = await outcome(caseA());
      expect(
        out.model.layers.length,
        'Two layers: the recurrent layer that reads the window, and the one-unit dense head that turns its output into a single reading.',
      ).toBe(2);
      expect(
        out.model.layers[0].getClassName(),
        'The first layer is the one named in the instructions. A flattened dense baseline has a different contract. This exercise requires recurrent updates.',
      ).toBe('LSTM');
      expect(
        out.model.layers[0].getConfig().units,
        'The instructions fix the width of the recurrent layer.',
      ).toBe(8);
      expect(
        out.model.inputs[0].shape,
        'A recurrent layer reads [batch, timeSteps, features], and this channel is one feature wide, so inputShape is [windowSize, 1] with windowSize read off trainX.',
      ).toEqual([null, CASE_A.windowSize, 1]);
      expect(
        out.model.outputs[0].shape,
        'One reading comes out per window, so the head is one unit wide.',
      ).toEqual([null, 1]);
    });

    it('the loss trace and the model come from the same fit', async () => {
      const out = await outcome(caseA());
      expect(
        out.history.history.loss.length,
        'One loss per epoch, and the epoch count is an argument. A trace of another length did not come from this run.',
      ).toBe(EPOCHS_A);
      expect(
        out.model.optimizer.iterations,
        'The optimizer counts one update per training batch. Its count must match batches per epoch times the number of epochs. Use the requested batch size and return the history from this fit.',
      ).toBe(CASE_A.batchesPerEpoch * EPOCHS_A);
      const losses = out.history.history.loss;
      expect(losses.every(Number.isFinite)).toBe(true);
    });

    it('the rollout feeds itself: every prediction re-enters the window', async () => {
      const out = await outcome(caseA());
      const beside = rollBeside(out.model, CASE_A.past, CASE_A.arrived.length, CASE_A.windowSize);
      out.rollout.forEach((value, step) => {
        expect(
          value,
          'Step ' +
            step +
            ' does not match the rollout from your model. After each prediction, append it to the history and use the latest window for the next step.',
        ).toBeCloseTo(beside[step], 6);
      });
    });

    it('the replay never reads its own output: the window is re-seeded from what arrived', async () => {
      const out = await outcome(caseA());
      const beside = replayBeside(out.model, CASE_A.past, CASE_A.arrived, CASE_A.windowSize);
      out.oneStep.forEach((value, step) => {
        expect(
          value,
          'Step ' +
            step +
            ' of the replay does not match your model. Build each window from past observations and the new observations before this step. Do not include predictions.',
        ).toBeCloseTo(beside[step], 6);
      });
    });

    it('starts both forecasts from the same observed history', async () => {
      const out = await outcome(caseA());
      expect(out.rollout[0]).toBeCloseTo(out.oneStep[0], 6);
    });

    it('reads the window width and the epoch count from its arguments', async () => {
      const out = await outcome(caseB());
      expect(
        out.model.inputs[0].shape,
        'This case trains on a wider window than the first one, and trainX determines its width. Read the shape for each call.',
      ).toEqual([null, CASE_B.windowSize, 1]);
      expect(
        out.history.history.loss.length,
        'This case asks for a different number of epochs. A pinned epoch count returns the wrong length here.',
      ).toBe(EPOCHS_B);
      expect(
        out.model.optimizer.iterations,
        'This run uses fewer epochs and a different number of windows. The optimizer update count must still match the returned training history.',
      ).toBe(CASE_B.batchesPerEpoch * EPOCHS_B);
      const rolled = rollBeside(out.model, CASE_B.past, CASE_B.arrived.length, CASE_B.windowSize);
      const replayed = replayBeside(out.model, CASE_B.past, CASE_B.arrived, CASE_B.windowSize);
      out.rollout.forEach((value, step) => {
        expect(
          value,
          'Step ' +
            step +
            ' of the second rollout does not match the same step rolled out of your own model. A window width fixed at whatever the first case used slices the history in the wrong place here.',
        ).toBeCloseTo(rolled[step], 6);
      });
      out.oneStep.forEach((value, step) => {
        expect(
          value,
          'Step ' + step + ' of the second replay does not match either, for the same reason.',
        ).toBeCloseTo(replayed[step], 6);
      });
    });
  });

  it('uses controlled histories and allows identical forecasts', async () => {
    for (const constant of [false, true]) {
      const xs = tf.zeros([2, 2, 1]),
        ys = tf.ones([2, 1]),
        calls = [];
      const trace = { history: { loss: [3, 4] } };
      const model = {
        fit: async (x, y, options) => {
          calls.push({ x, y, options });
          return trace;
        },
        predict: (input) => {
          const rows = input.arraySync()[0];
          return tf.tensor2d([[constant ? 7 : rows[rows.length - 1][0] + 1]]);
        },
      };
      const past = [1, 2],
        arrived = [10, 20, 30];
      const out = await forecastTwoWays(xs, ys, past, arrived, 2, model);
      expect(out.model).toBe(model);
      expect(out.history).toBe(trace);
      expect(out.rollout).toEqual(constant ? [7, 7, 7] : [3, 4, 5]);
      expect(out.oneStep).toEqual(constant ? [7, 7, 7] : [3, 11, 21]);
      expect(calls.length).toBe(1);
      expect(calls[0].x).toBe(xs);
      expect(calls[0].y).toBe(ys);
      expect(calls[0].options.epochs).toBe(2);
      expect(calls[0].options.batchSize).toBe(8);
      expect(past).toEqual([1, 2]);
      expect(arrived).toEqual([10, 20, 30]);
    }
  });
