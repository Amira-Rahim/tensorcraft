slug: weighted-ensemble
lessonSlug: time-series-ensemble-methods
title: "Confidence-Weighted Ensemble with tf"
mlContent: data
instructions: "Build `weightedEnsemble(predictions)` taking an array of {prediction: number[], confidence: number} and returning a JS number array: each output element is the confidence-weighted average of the models' predictions for that position. Plain JS loops (like the lesson's own version) or tensors, your choice; the grader only checks the numbers. Tensor route, if you want it: stack with tf.tensor2d, multiply by confidence weights, sum across the model axis, divide by total confidence, arraySync() back."
starterCode: |
  function weightedEnsemble(predictions) {
    return [];
  }
solutionCode: |
  function weightedEnsemble(predictions) {
    const stacked = tf.tensor2d(predictions.map(p => p.prediction));
    const conf = tf.tensor1d(predictions.map(p => p.confidence));
    const total = conf.sum();
    const weights = conf.div(total).expandDims(1);
    return stacked.mul(weights).sum(0).arraySync();
  }
testCode: |
  describe('weightedEnsemble (tf stacked weighted sum)', () => {
    it('returns correct dimension', () => {
      const result = weightedEnsemble([
        { prediction: [1, 2], confidence: 1 },
        { prediction: [3, 4], confidence: 1 },
      ]);
      expect(result.length).toBe(2);
    });
    it('equal confidence = simple average', () => {
      const result = weightedEnsemble([
        { prediction: [10], confidence: 1 },
        { prediction: [20], confidence: 1 },
      ]);
      expect(result[0]).toBeCloseTo(15, 4);
    });
    it('higher confidence has more influence', () => {
      const result = weightedEnsemble([
        { prediction: [10], confidence: 0.9 },
        { prediction: [20], confidence: 0.1 },
      ]);
      expect(result[0]).toBeCloseTo(11, 4);
    });
  });
estimatedMinutes: 10
difficulty: intermediate
