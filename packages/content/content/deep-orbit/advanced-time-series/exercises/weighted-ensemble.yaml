slug: weighted-ensemble
lessonSlug: time-series-ensemble-methods
title: "Ensemble Gain Over the Best Member"
mlContent: evaluation
instructions: "Write `ensembleGain(members, actual)` and report whether the ensemble was worth running. `members` is an array of `{ name, predictions }`; `actual` holds the true values at the same positions. Return `{ perMember, ensemble, beatsBest }`. `perMember` maps each member name to that member's mean absolute error. `ensemble` is the MAE of the plain average of the members' predictions at each position. `beatsBest` is true only when `ensemble` is lower than every member's error. A tie is not a win: one test hands you three members that are all wrong by the same amount in the same direction, and one hands you a strong member with two weak ones. A third hands you members whose errors partly cancel, so the blend beats the average member and still loses to the best one. A fourth lists the worst member first: the blend beats that one and still loses to the best."
starterCode: |
  function ensembleGain(members, actual) {
    // Mean absolute error of one prediction series against `actual`.
    // Score every member with it, then score the averaged predictions.
    // beatsBest: is the ensemble error below EVERY member's error?
    return { perMember: {}, ensemble: 0, beatsBest: false };
  }
solutionCode: |
  function ensembleGain(members, actual) {
    const mae = (values) =>
      values.reduce((sum, v, i) => sum + Math.abs(v - actual[i]), 0) /
      actual.length;

    const perMember = {};
    for (const member of members) {
      perMember[member.name] = mae(member.predictions);
    }

    const blended = actual.map(
      (_, i) =>
        members.reduce((sum, m) => sum + m.predictions[i], 0) / members.length,
    );

    const ensemble = mae(blended);
    const best = Math.min(...Object.values(perMember));
    return { perMember, ensemble, beatsBest: ensemble < best };
  }
testCode: |
  describe('ensembleGain scores members and the blend', () => {
    it('reports one mean absolute error per member', () => {
      const result = ensembleGain(
        [
          { name: 'LSTM', predictions: [12, 18, 30, 40] },
          { name: 'Attention', predictions: [8, 22, 30, 40] },
          { name: 'Kalman', predictions: [10, 20, 33, 37] },
        ],
        [10, 20, 30, 40],
      );
      expect(result.perMember.LSTM).toBeCloseTo(1, 4);
      expect(result.perMember.Attention).toBeCloseTo(1, 4);
      expect(result.perMember.Kalman).toBeCloseTo(1.5, 4);
    });
    it('beats the best member when the errors land in different places', () => {
      const result = ensembleGain(
        [
          { name: 'LSTM', predictions: [12, 18, 30, 40] },
          { name: 'Attention', predictions: [8, 22, 30, 40] },
          { name: 'Kalman', predictions: [10, 20, 33, 37] },
        ],
        [10, 20, 30, 40],
      );
      expect(result.ensemble).toBeCloseTo(0.5, 4);
      expect(result.beatsBest).toBe(true);
    });
  });
  describe('ensembleGain when averaging buys nothing', () => {
    it('ties the best member when every member is off by the same amount', () => {
      const result = ensembleGain(
        [
          { name: 'LSTM', predictions: [37, 39, 38, 40] },
          { name: 'Attention', predictions: [37, 39, 38, 40] },
          { name: 'Kalman', predictions: [37, 39, 38, 40] },
        ],
        [36, 38, 37, 39],
      );
      expect(result.ensemble).toBeCloseTo(1, 4);
      expect(result.perMember.LSTM).toBeCloseTo(1, 4);
      expect(result.beatsBest).toBe(false);
    });
    it('loses to a strong member two weak ones drag down', () => {
      const result = ensembleGain(
        [
          { name: 'LSTM', predictions: [10, 20, 30, 40] },
          { name: 'Attention', predictions: [16, 20, 30, 40] },
          { name: 'Kalman', predictions: [10, 26, 30, 40] },
        ],
        [10, 20, 30, 40],
      );
      expect(result.perMember.LSTM).toBeCloseTo(0, 4);
      expect(result.ensemble).toBeCloseTo(1, 4);
      expect(result.beatsBest).toBe(false);
    });
    it('still loses when the blend beats the average member but not the best one', () => {
      const result = ensembleGain(
        [
          { name: 'LSTM', predictions: [10, 20, 30, 41] },
          { name: 'Attention', predictions: [16, 20, 30, 41] },
          { name: 'Kalman', predictions: [7, 20, 30, 41] },
        ],
        [10, 20, 30, 40],
      );
      expect(result.perMember.LSTM).toBeCloseTo(0.25, 4);
      expect(result.perMember.Attention).toBeCloseTo(1.75, 4);
      expect(result.perMember.Kalman).toBeCloseTo(1, 4);
      // Mean of the member errors is 1, so a solution that compares the
      // ensemble against that mean returns true here. The best member scored
      // 0.25, and 0.5 is worse than 0.25.
      expect(result.ensemble).toBeCloseTo(0.5, 4);
      expect(result.beatsBest).toBe(false);
    });
    // Member order is the point of this one. The worst member is listed
    // first and the best is listed last, so comparing the ensemble against
    // members[0] returns true here. All three overshoot position 1 by 6 and
    // the blend keeps every bit of that; they disagree at position 0 and
    // partly cancel there. Comparing against the mean member error (3.75) or
    // the worst (6) also returns true. The best member scored 2.25.
    it('loses to the best member even when it beats the one listed first', () => {
      const result = ensembleGain(
        [
          { name: 'Kalman', predictions: [78, 70, 68, 72] },
          { name: 'Attention', predictions: [66, 70, 68, 72] },
          { name: 'LSTM', predictions: [57, 70, 68, 72] },
        ],
        [60, 64, 68, 72],
      );
      expect(result.perMember.Kalman).toBeCloseTo(6, 4);
      expect(result.perMember.Attention).toBeCloseTo(3, 4);
      expect(result.perMember.LSTM).toBeCloseTo(2.25, 4);
      expect(result.ensemble).toBeCloseTo(3.25, 4);
      expect(result.beatsBest).toBe(false);
    });
  });
