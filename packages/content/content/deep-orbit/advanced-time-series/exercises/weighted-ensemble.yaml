solutionCode: |
  interface ModelPred {
    prediction: number[];
    confidence: number;
  }

  function weightedEnsemble(predictions: ModelPred[]): number[] {
    const totalConf = predictions.reduce((s, p) => s + p.confidence, 0);
    const dim = predictions[0].prediction.length;
    const result = new Array(dim).fill(0);
    for (const p of predictions) {
      const weight = p.confidence / totalConf;
      for (let i = 0; i < dim; i++) {
        result[i] += p.prediction[i] * weight;
      }
    }
    return result;
  }
testCode: |
  describe('weightedEnsemble', () => {
    it('returns correct dimension', () => {
      const result = weightedEnsemble([
        { prediction: [1, 2], confidence: 1 },
        { prediction: [3, 4], confidence: 1 },
      ]);
      expect(result.length).toBe(2);
    });
    it('equal confidence = simple average', () => {
      const result = weightedEnsemble([
        { prediction: [10], confidence: 1 },
        { prediction: [20], confidence: 1 },
      ]);
      expect(result[0]).toBeCloseTo(15);
    });
    it('higher confidence has more influence', () => {
      const result = weightedEnsemble([
        { prediction: [10], confidence: 0.9 },
        { prediction: [20], confidence: 0.1 },
      ]);
      expect(result[0]).toBeCloseTo(11);
    });
  });
