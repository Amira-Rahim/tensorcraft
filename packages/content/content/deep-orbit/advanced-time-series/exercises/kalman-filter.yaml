title: "Track the Changing Pulse Interval"
instructions: |
  Implement update(measurement) in SimpleKalman. Calculate the predicted variance, then the Kalman gain. Use that gain to update this.estimate and this.variance. Return the updated estimate as a number.

  The prediction assumes the level stays where it was, with added process noise. The constructor starts variance at 1. processNoise and measureNoise are variances, not standard deviations. Inputs are finite, processNoise >= 0, and measureNoise > 0.

  Keep the updated estimate and variance for the next call. The checks compare your calculations with the filter equations and a fictional series of falling pulse intervals. This one-state filter does not track a rate of change, so its smooth output can fall behind the trend. Smoothness alone does not prove accuracy.
