title: "Implement a Kalman Filter"
instructions: "Implement a simple 1D Kalman filter. The constructor is written for you, including the starting variance of 1. Write `update(measurement)`: one predict-correct step, returning the new estimate. Two fields carry state between calls and the tests read both, `this.estimate` and `this.variance`. Predicting widens the variance by the process noise. The weight on the new measurement is that widened variance as a share of itself plus the measurement noise. Correcting moves the estimate that fraction of the way to the measurement, then multiplies the widened variance by one minus that fraction. Because the weight is rebuilt from the variance on every call it changes step to step, so an EMA with one fixed alpha fails the arithmetic tests. One test runs your filter across the falling pulse-interval log from the lesson and reads the gap between the final estimate and the final reading. A filter whose state is one number, with no term for change, trails a drifting signal instead of tracking it, and the test checks that your estimate lands on the trailing side."
