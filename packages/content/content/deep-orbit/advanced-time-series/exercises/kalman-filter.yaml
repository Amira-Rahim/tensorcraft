solutionCode: |
  class SimpleKalman {
    estimate: number;
    variance: number;
    processNoise: number;
    measureNoise: number;

    constructor(initial: number, processNoise: number, measureNoise: number) {
      this.estimate = initial;
      this.variance = 1;
      this.processNoise = processNoise;
      this.measureNoise = measureNoise;
    }

    update(measurement: number): number {
      const predictedVariance = this.variance + this.processNoise;
      const gain = predictedVariance / (predictedVariance + this.measureNoise);
      this.estimate = this.estimate + gain * (measurement - this.estimate);
      this.variance = (1 - gain) * predictedVariance;
      return this.estimate;
    }
  }
testCode: |
  describe('SimpleKalman', () => {
    it('returns a number', () => {
      const kf = new SimpleKalman(0, 0.1, 1);
      expect(
        typeof kf.update(1),
        'update() returns the corrected estimate itself, not the object and not a promise.',
      ).toBe('number');
    });
    it('moves toward measurement', () => {
      const kf = new SimpleKalman(0, 0.1, 1);
      const est = kf.update(10);
      expect(
        est,
        'One correction moves the estimate off its starting value toward the measurement.',
      ).toBeGreaterThan(0);
      expect(
        est,
        'A correction is partial. Landing on the measurement means the weight came out at 1, which throws the prior estimate away.',
      ).toBeLessThan(10);
    });
    it('converges with repeated measurements', () => {
      const kf = new SimpleKalman(0, 0.01, 1);
      for (let i = 0; i < 50; i++) kf.update(5);
      expect(
        kf.estimate,
        'Fifty readings of the same value should pull the estimate onto it. An estimate stuck short of it means the weight stayed too small, which happens when the variance is not widened by the process noise before the weight is built, or is shrunk by more than (1 - weight) after.',
      ).toBeCloseTo(5, 0);
    });
    it('smooths noisy data', () => {
      const kf = new SimpleKalman(10, 0.1, 1);
      const noisy = [10, 12, 9, 11, 10, 13, 9, 11];
      const estimates = noisy.map(m => kf.update(m));
      const variance = estimates.reduce((s, e) => s + (e - 10.5) ** 2, 0) / estimates.length;
      const inputVariance = noisy.reduce((s, n) => s + (n - 10.5) ** 2, 0) / noisy.length;
      expect(
        variance,
        'For this fixture, filtering reduces mean squared distance from the chosen reference. This is not a general accuracy guarantee.',
      ).toBeLessThan(inputVariance);
    });
    it('follows the exact predict-correct arithmetic (a fixed-alpha EMA fails this)', () => {
      const kf = new SimpleKalman(0, 0.1, 1);
      expect(
        kf.update(10),
        'This is the first correction from a starting variance of 1 and a process noise of 0.1. A weight built from the two noise parameters alone lands well short of it.',
      ).toBeCloseTo(5.238, 3);
      expect(
        kf.update(10),
        'Same measurement, second call, and the weight is smaller now because the last correction shrank the variance. A fixed alpha repeats the first step instead.',
      ).toBeCloseTo(7.067, 3);
      expect(
        kf.variance,
        'The variance after two corrections. It has to be the field the corrections wrote to, not the 1 the constructor set.',
      ).toBeCloseTo(0.384, 3);
    });
    it('the gain responds to the noise parameters', () => {
      const kf = new SimpleKalman(0, 0.5, 0.5);
      expect(
        kf.update(4),
        'Equal noise parameters and a starting variance of 1 make this first weight larger than the one above. A weight that ignores the variance cannot move between the two fixtures.',
      ).toBeCloseTo(3, 4);
    });
    it('trails a drifting signal: the lag the lesson reads off this log', () => {
      // The eight daily first-cycle readings from the lesson, falling by
      // about a sixth of a unit per day, filtered with the lesson's noise
      // parameters.
      const log = [73.1, 72.9, 73.0, 72.6, 72.7, 72.3, 72.4, 72.0];
      const kf = new SimpleKalman(73.1, 0.1, 1.0);
      const estimates = log.slice(1).map((m) => kf.update(m));
      const final = estimates[estimates.length - 1];
      expect(
        final,
        'This is the whole run the lesson prints: eight readings, the lesson\'s noise parameters, and the estimate they leave behind.',
      ).toBeCloseTo(72.43168, 3);
      expect(
        final,
        'The readings end at 72.0 and this estimate sits above them. That gap is the lag: the state here is one number with no term for its own change, so a steady drift is something the filter follows late rather than tracks. An estimate that lands on the newest reading means the weight came out at 1 and nothing was smoothed.',
      ).toBeGreaterThan(72.0);
      expect(
        final,
        'The same gap from the other side: the estimate has to have moved down off the first reading. One that has not is ignoring the measurements.',
      ).toBeLessThan(73.1);
      recordResult({
        kind: 'series', title: 'Your estimate follows the changing pulse interval',
        summary: 'Fictional daily first-cycle log. Day 1 initializes the filter; days 2–8 show its returned updates. A smoother curve can lag the measurements and does not establish greater accuracy.',
        xLabel: 'Day in this log', yLabel: 'Pulse interval (seconds)',
        labels: estimates.map((_, i) => String(i + 2)),
        series: [{ name: 'Recorded interval', values: log.slice(1) }, { name: 'Your filter estimate', values: estimates }],
      });
    });
    it('rederives gain and variance from parameters no fixture pins', () => {
      for (let trial = 0; trial < 4; trial++) {
        const initial = Math.random() * 20 - 10;
        const processNoise = 0.05 + Math.random();
        const measureNoise = 0.05 + Math.random();
        const kf = new SimpleKalman(initial, processNoise, measureNoise);
        let estimate = initial;
        let variance = 1;
        for (let step = 0; step < 4; step++) {
          const measurement = Math.random() * 20 - 10;
          const predicted = variance + processNoise;
          const gain = predicted / (predicted + measureNoise);
          estimate = estimate + gain * (measurement - estimate);
          variance = (1 - gain) * predicted;
          expect(
            kf.update(measurement),
            'The noise parameters and the measurements are drawn at run time here, so this estimate has to be computed from them rather than recognised.',
          ).toBeCloseTo(estimate, 6);
        }
        expect(
          kf.variance,
          'The variance is graded too. Four corrections on parameters nobody published, and the stored variance has to match the loop step for step.',
        ).toBeCloseTo(variance, 6);
      }
    });
  });
