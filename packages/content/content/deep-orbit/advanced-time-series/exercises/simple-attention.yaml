solutionCode: |
  function softmax(scores: number[]): number[] {
    const max = Math.max(...scores);
    const exps = scores.map(s => Math.exp(s - max));
    const sum = exps.reduce((a, b) => a + b, 0);
    return exps.map(e => e / sum);
  }

  function attend(scores: number[], values: number[]): { weights: number[]; output: number } {
    const weights = softmax(scores);
    const output = weights.reduce((sum, w, i) => sum + w * values[i], 0);
    return { weights, output };
  }
testCode: |
  describe('attend', () => {
    it('returns weights that sum to 1', () => {
      const { weights } = attend([1, 2, 3], [10, 20, 30]);
      const sum = weights.reduce((a, b) => a + b, 0);
      expect(sum).toBeCloseTo(1.0);
    });
    it('highest score gets highest weight', () => {
      const { weights } = attend([1, 5, 2], [10, 20, 30]);
      expect(weights[1]).toBeGreaterThan(weights[0]);
      expect(weights[1]).toBeGreaterThan(weights[2]);
    });
    it('output is weighted sum', () => {
      const { output } = attend([0, 0, 0], [10, 20, 30]);
      expect(output).toBeCloseTo(20);
    });
  });
