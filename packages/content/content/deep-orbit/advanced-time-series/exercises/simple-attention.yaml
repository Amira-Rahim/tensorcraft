slug: simple-attention
lessonSlug: beyond-lstm
title: "Simple Attention Over RNN Hidden States"
mlContent: model
instructions: "Build `simpleAttention(query, hiddenStates)` taking a [d] query vector and a [T, d] sequence of hidden states. Compute attention weights via dot product + softmax, then return the weighted sum of hidden states (a [d] vector)."
starterCode: |
  function simpleAttention(query, hiddenStates) {
    return null;
  }
solutionCode: |
  function simpleAttention(query, hiddenStates) {
    const queryRow = query.reshape([1, query.shape[0]]);
    const scores = tf.matMul(queryRow, hiddenStates, false, true);
    const weights = tf.softmax(scores);
    const weighted = tf.matMul(weights, hiddenStates);
    return weighted.squeeze();
  }
testCode: |
  describe('simpleAttention (real tf.matMul + softmax)', () => {
    it('output shape matches query dim', () => {
      const q = tf.randomNormal([8]);
      const H = tf.randomNormal([5, 8]);
      const out = simpleAttention(q, H);
      expect(out.shape).toEqual([8]);
    });
    it('uniform attention with zero query → average of hidden states', () => {
      const q = tf.zeros([4]);
      const H = tf.tensor2d([[1, 1, 1, 1], [3, 3, 3, 3]]);
      const out = simpleAttention(q, H);
      const arr = out.dataSync();
      // softmax of all-zero scores is uniform → average row = [2, 2, 2, 2]
      expect(arr[0]).toBeCloseTo(2, 4);
    });
    it('weights follow the query: softmax([1, 0]) gives a 0.731/0.269 blend', () => {
      const q = tf.tensor1d([1, 0]);
      const H = tf.tensor2d([[1, 0], [0, 1]]);
      const out = simpleAttention(q, H).dataSync();
      expect(out[0]).toBeCloseTo(0.7311, 3);
      expect(out[1]).toBeCloseTo(0.2689, 3);
    });
    it('a strong query focuses attention on the matching state (soft, not argmax)', () => {
      const q = tf.tensor1d([10, 0]);
      const H = tf.tensor2d([[1, 0], [0, 1]]);
      const out = simpleAttention(q, H).dataSync();
      expect(out[0]).toBeCloseTo(1.0, 3);
      expect(out[1]).toBeCloseTo(0.0, 3);
    });
  });
estimatedMinutes: 15
difficulty: intermediate
skillAxis: model_arch
