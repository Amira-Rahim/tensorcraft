slug: simple-attention
lessonSlug: beyond-lstm
title: "Simple Attention Over RNN Hidden States"
mlContent: model
instructions: |
  Implement simpleAttention(query, keys, values). query has shape [d], keys has shape [T, d], and values has shape [T, dv]. T is the number of steps. d is the key width, and dv is the value width. All dimensions are positive and all inputs are finite.

  Calculate the dot product of the query with every key. Apply softmax across the T scores, then use those weights to combine the values. Return one tensor with shape [dv]. This exercise uses unscaled scores, so do not divide by sqrt(d).

  Reshape the query to [1, d] for matMul and transpose the keys. Remove only the result's batch axis. Even when dv is 1, the result must keep shape [1]. A scalar would lose the value axis.

  Use tf.tidy to free temporary tensors. Keep the caller's inputs alive, and leave the returned tensor for the caller to dispose. Keys and values may have different widths, so apply the attention weights to the value rows.
starterCode: |
  function simpleAttention(query, keys, values) {
    // Compare the query with keys to get weights.
    // Use those weights to combine values.
    return null;
  }
solutionCode: |
  function simpleAttention(query, keys, values) {
    return tf.tidy(() => {
      const queryRow = query.reshape([1, query.shape[0]]);
      const scores = tf.matMul(queryRow, keys, false, true);
      const weights = tf.softmax(scores);
      const blended = tf.matMul(weights, values);
      return blended.squeeze([0]);
    });
  }
testCode: |
  describe('simpleAttention (real tf.matMul + softmax)', () => {
    // Every test goes through this, so the first Run of the starter reads
    // as a missing return value rather than a property access on null, and
    // a throw from inside the submission arrives in words of its own rather
    // than as a raw library notice.
    const blend = (call) => {
      let out;
      try {
        out = call();
      } catch (err) {
        const detail = (err && err.message) || String(err);
        if (detail.toLowerCase().indexOf('softmax') !== -1) {
          throw new Error(
            'tf.softmax operates along the last axis. Arrange the T scores in one row, then apply softmax across that row. TensorFlow.js error: ' + detail,
          );
        }
        throw new Error(
          'simpleAttention failed before returning the weighted sum. TensorFlow.js error: ' + detail,
        );
      }
      expect(
        out,
        'simpleAttention has to return the blended vector itself, one rank-1 tensor.',
      ).toBeDefined();
      expect(
        out && typeof out.dataSync,
        'The tests read the result with dataSync(), so return a tensor with that method.',
      ).toBe('function');
      return out;
    };

    it('the blend is one value row wide, not one key row wide', () => {
      const out = blend(() =>
        simpleAttention(
          tf.randomNormal([8]),
          tf.randomNormal([5, 8]),
          tf.randomNormal([5, 3]),
        ),
      );
      expect(
        out.shape,
        'Each key has 8 features and each value has 3. Apply the attention weights to the values, so the result has 3 features.',
      ).toEqual([3]);
    });

    it('a zero query scores every key the same, so the blend is the average value row', () => {
      const out = blend(() =>
        simpleAttention(
          tf.zeros([4]),
          tf.tensor2d([[9, 9, 9, 9], [-9, -9, -9, -9]]),
          tf.tensor2d([[1, 1, 1, 1], [3, 3, 3, 3]]),
        ),
      );
      const got = Array.from(out.dataSync());
      expect(
        got[0],
        'Both keys score zero against a zero query, so softmax splits the weight evenly and the two value rows average.',
      ).toBeCloseTo(2, 4);
    });

    it('the matching key takes most of the weight and the other keeps a real share', () => {
      const out = blend(() =>
        simpleAttention(
          tf.tensor1d([1, 0]),
          tf.tensor2d([[1, 0], [0, 1]]),
          tf.tensor2d([[2, 0], [0, 2]]),
        ),
      );
      // The values are twice the identity, so halving the blend reads the
      // two attention weights straight back out of it.
      const got = Array.from(out.dataSync());
      const first = got[0] / 2;
      const second = got[1] / 2;
      expect(
        first + second,
        'Softmax weights add to 1, so these two doubled rows have to blend back to 2 in total.',
      ).toBeCloseTo(1, 4);
      expect(
        first,
        'The first key is the one that matches the query, so it takes the larger share.',
      ).toBeGreaterThan(second);
      expect(
        second,
        'This finite score gap leaves both steps a positive share. A hard pick (argMax, or an if that selects one row) fails here.',
      ).toBeGreaterThan(0.2);
      expect(
        first,
        'One point of score gap sets this split. A weighted sum with weights that are not the softmax of the scores lands somewhere else, and so does the scaled dot product: dividing the scores by the square root of the key width reads 0.670 here.',
      ).toBeCloseTo(0.7311, 3);

      // The same read, on a score gap drawn at run time. 0.7311 is a number
      // an answer can carry around; this one is not. The draw comes from a
      // generator the submission cannot touch: Math.random in the grader is
      // a sealed per-run stream and the tf namespace is read-only (round 7,
      // 2026-09-13, after a pinned Math.random made this draw a constant;
      // tf seeds its own generator from Math.random on every call).
      const gap = tf.randomUniform([1], 0.5, 2.5).dataSync()[0];
      const drawn = blend(() =>
        simpleAttention(
          tf.tensor1d([gap, 0]),
          tf.tensor2d([[1, 0], [0, 1]]),
          tf.tensor2d([[2, 0], [0, 2]]),
        ),
      );
      expect(
        Array.from(drawn.dataSync())[0] / 2,
        'The score gap is drawn fresh on every run, so the matching key\'s share has to come out of a softmax over these two scores.',
      ).toBeCloseTo(1 / (1 + Math.exp(-gap)), 3);
      recordResult({
        kind: 'table', title: 'Your weighted attention blend',
        summary: 'Synthetic query and keys. Values are twice the identity matrix, so dividing each returned component by two reveals its attention weight for this probe. This calculation performs no training and explains no forecast.',
        columns: ['Value row', 'Weight derived from your blend', 'Returned output component'],
        rows: [[0, first, got[0]], [1, second, got[1]]],
      });
    });

    it('a strong query concentrates the weight, still without erasing the other step', () => {
      const out = blend(() =>
        simpleAttention(
          tf.tensor1d([10, 0]),
          tf.tensor2d([[1, 0], [0, 1]]),
          tf.tensor2d([[5, 7], [1, 1]]),
        ),
      );
      const got = Array.from(out.dataSync());
      expect(
        got[0],
        'A score gap of ten leaves the losing step a share too small to see at three decimals, so the blend sits on the first value row.',
      ).toBeCloseTo(5, 2);
      expect(
        got[1],
        'Use the same attention weights for both coordinates of the output.',
      ).toBeCloseTo(7, 2);
    });

    it('the score reads the whole query against the whole key row', () => {
      // Full dot products: key one scores 1*1 + 2*0 + (-1)*1 = 0, key two
      // scores 1*0 + 2*1 + (-1)*0 = 2, so the SECOND step wins by two
      // points. Compare only the first coordinates and the first step wins
      // instead; drop the third and the gap shrinks to one point. Either way
      // the blend lands somewhere else. The values are twice the identity
      // again, so halving the blend reads the weights back out of it.
      const out = blend(() =>
        simpleAttention(
          tf.tensor1d([1, 2, -1]),
          tf.tensor2d([[1, 0, 1], [0, 1, 0]]),
          tf.tensor2d([[2, 0], [0, 2]]),
        ),
      );
      const got = Array.from(out.dataSync());
      expect(
        got[1] / 2,
        'Score each key by multiplying matching coordinates with the query and adding all d products. Score on one coordinate, or leave one out, and this window ranks the wrong step.',
      ).toBeCloseTo(0.8808, 3);
      expect(
        got[0] / 2,
        'The two attention weights must add to 1. The second weight is 1 minus the first.',
      ).toBeCloseTo(0.1192, 3);
    });

    it('rederives the blend on keys and values drawn at random, so a memorised answer fails', () => {
      const T = 4;
      const d = 3;
      const dv = 2;
      // Every number in this window comes from tf's generator rather than
      // Math.random, so the window is settled outside the sandbox the
      // submission runs in and a memorised answer has nothing to key on.
      // Each query coordinate is pushed 0.4 clear of zero so the scores keep
      // a real spread and the blend is not just the average value row.
      const queryTensor = tf.tensor1d(
        Array.from(tf.randomUniform([d], -1, 1).dataSync()).map((v) =>
          v < 0 ? v - 0.4 : v + 0.4,
        ),
      );
      const keysTensor = tf.randomUniform([T, d], -1, 1);
      const valuesTensor = tf.randomUniform([T, dv], -2, 2);
      const query = Array.from(queryTensor.dataSync());
      const keys = keysTensor.arraySync();
      const values = valuesTensor.arraySync();
      const scores = keys.map((key) =>
        key.reduce((s, v, i) => s + v * query[i], 0),
      );
      const top = Math.max.apply(null, scores);
      const exps = scores.map((s) => Math.exp(s - top));
      const total = exps.reduce((a, b) => a + b, 0);
      const weights = exps.map((e) => e / total);
      const out = blend(() =>
        simpleAttention(queryTensor, keysTensor, valuesTensor),
      );
      expect(
        out.shape,
        'The values are narrower than the keys on this window, so the blend is only a value row wide.',
      ).toEqual([dv]);
      const got = Array.from(out.dataSync());
      for (let i = 0; i < dv; i++) {
        const expected = values.reduce((s, row, t) => s + weights[t] * row[i], 0);
        expect(
          got[i],
          'The test draws a fresh window on every run. Calculate the blend from its keys and values. Scores come from the keys, and the weighted sum runs over the values.',
        ).toBeCloseTo(expected, 3);
      }
    });
  });

  it('keeps a one-feature value axis', () => {
    const r = simpleAttention(tf.tensor1d([0]), tf.tensor2d([[1], [2]]), tf.tensor2d([[2], [4]]));
    expect(r.shape).toEqual([1]);
    expect(r.dataSync()[0]).toBeCloseTo(3, 5);
  });
