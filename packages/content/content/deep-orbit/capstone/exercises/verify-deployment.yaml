slug: verify-deployment
lessonSlug: launch
title: "Deployment verification"
instructions: |
  Help Demir run the deployment checks. Write `verifyDeployment(checks, timeoutMs = 1000)` and return one result for the whole run.

  Each check is an async function that receives an `AbortSignal` and returns `{ name, passed, message }`. It can ignore the signal if it has no cancellable work. Require a non-empty string name, a boolean passed, and a string message. Treat malformed results as failures. A truthy string must not pass. Require a finite, positive `timeoutMs`.

  Run checks one at a time, awaiting each before starting the next. Keep results in call order. If a check throws or rejects, record a failure named `check N`, where N is its 1-based position. Use the error's message, then continue with the next check.

  Give each check `timeoutMs` to finish. On timeout:

  - Record a failed `check N` with a message containing "Timed out".
  - Signal cancellation.
  - Do not start any remaining checks. Record each as failed with "Skipped after timeout".

  Clear each timer when its check settles. A timeout stops waiting, but `Promise.race` cannot stop the underlying work. A check may ignore cancellation. Ordinary rejections still allow later checks to run.

  Return:

      {
        passed: boolean,       // true only for a non-empty run where every check passed
        checks: CheckResult[], // one result per supplied check, in order
        summary: string,       // for example, '2/3 checks passed'
      }

  An empty run fails with `0/0 checks passed`. The checks include real TFJS inference: output range, an anomaly input, and a calm input.
hints:
  - level: nudge
    content: |
      Await each check in order, but bound the wait so you can report a hung probe.
  - level: guidance
    content: |
      Race each check against a timer and clear the timer after settlement. A timeout only stops waiting: signal cancellation, then skip dependent checks. Record a settled rejection and continue the ordinary sequence.
  - level: solution
    content: |
      interface CheckResult {
        name: string;
        passed: boolean;
        message: string;
      }

      interface DeploymentResult {
        passed: boolean;
        checks: CheckResult[];
        summary: string;
      }

      async function verifyDeployment(
        checks: ((signal: AbortSignal) => Promise<CheckResult>)[],
        timeoutMs = 1000,
      ): Promise<DeploymentResult> {
        if (!Number.isFinite(timeoutMs) || timeoutMs <= 0) throw new Error('Invalid timeout');
        const results: CheckResult[] = [];

        for (let i = 0; i < checks.length; i++) {
          const controller = new AbortController();
          let timer;
          let timedOut = false;
          try {
            const result = await Promise.race([
              Promise.resolve().then(() => checks[i](controller.signal)),
              new Promise<CheckResult>((_, reject) => {
                timer = setTimeout(() => {
                  timedOut = true;
                  reject(new Error('Timed out'));
                  controller.abort();
                }, timeoutMs);
              }),
            ]);
            if (!result || typeof result.name !== 'string' || !result.name.trim() || typeof result.passed !== 'boolean' || typeof result.message !== 'string') throw new Error('Invalid check result');
            results.push(result);
          } catch (error) {
            results.push({
              name: 'check ' + (i + 1),
              passed: false,
              message: error instanceof Error ? error.message : String(error),
            });
          } finally {
            clearTimeout(timer);
          }
          if (timedOut) {
            for (let j = i + 1; j < checks.length; j++)
              results.push({ name: 'check ' + (j + 1), passed: false, message: 'Skipped after timeout' });
            break;
          }
        }

        const passedCount = results.filter((r) => r.passed).length;
        const total = results.length;

        return {
          passed: total > 0 && passedCount === total,
          checks: results,
          summary: `${passedCount}/${total} checks passed`,
        };
      }
