slug: verify-deployment
lessonSlug: launch
title: "Verify a Deployment"
instructions: |
  **Contract revision 2026-09-17b:** verifyDeployment accepts timeoutMs (default 1000). A timed-out check fails, receives an abort signal and prevents later checks from starting.

  Write the runner under the launch script. It takes an array of checks and answers with one verdict for the whole deployment.

  A check is an async function receiving an AbortSignal and returning `{ name, passed, message }`. It may ignore the argument when it has no cancellable work. timeoutMs must be a finite positive number.

  1. Run the checks one at a time, awaiting each before the next one starts. A later check can depend on work an earlier one finished: load the model, then probe it.
  2. Collect every result in call order under `checks`.
  3. A check that throws is a failed check, not a lost run. Catch it, record a check named `check N` for its 1-based position with `passed: false` and the error's message as `message`, then carry on. A rejection has settled; a never-settling promise needs a timeout.
  4. The deployment passes only when every check passed. A verification with no checks in it measured nothing, so it fails, and its summary reads `0/0 checks passed`.

  Return:

      {
        passed: boolean,       // true only when checks ran and every one passed
        checks: CheckResult[], // one per check, in call order
        summary: string,       // '2/3 checks passed'
      }

  The grader runs real TFJS inference probes through your runner: an output-range contract, an anomaly-probe gate, and a calm-probe gate against a live scoring function.

  Give each check timeoutMs to settle. On timeout, record a failed check named check N with a message containing "Timed out", signal cancellation and record all remaining checks as failed with "Skipped after timeout". Do not start them: Promise.race does not stop underlying work, and a check may ignore cancellation. Clear each timer after settlement. Ordinary rejections still allow later checks to run. This is a reporting timeout, not a guarantee that external work stopped.
hints:
  - level: nudge
    content: |
      Await each check in order, but bound the wait so a hung probe can be reported.
  - level: guidance
    content: |
      Race each check against a timer and clear the timer after settlement. A timeout only stops waiting: signal cancellation, then skip dependent checks. A settled rejection can be recorded while the ordinary sequence continues.
  - level: solution
    content: |
      interface CheckResult {
        name: string;
        passed: boolean;
        message: string;
      }

      interface DeploymentResult {
        passed: boolean;
        checks: CheckResult[];
        summary: string;
      }

      async function verifyDeployment(
        checks: ((signal: AbortSignal) => Promise<CheckResult>)[],
        timeoutMs = 1000,
      ): Promise<DeploymentResult> {
        if (!Number.isFinite(timeoutMs) || timeoutMs <= 0) throw new Error('Invalid timeout');
        const results: CheckResult[] = [];

        for (let i = 0; i < checks.length; i++) {
          const controller = new AbortController();
          let timer;
          let timedOut = false;
          try {
            const result = await Promise.race([
              Promise.resolve().then(() => checks[i](controller.signal)),
              new Promise<CheckResult>((_, reject) => {
                timer = setTimeout(() => {
                  timedOut = true;
                  reject(new Error('Timed out'));
                  controller.abort();
                }, timeoutMs);
              }),
            ]);
            results.push(result);
          } catch (error) {
            results.push({
              name: 'check ' + (i + 1),
              passed: false,
              message: error instanceof Error ? error.message : String(error),
            });
          } finally {
            clearTimeout(timer);
          }
          if (timedOut) {
            for (let j = i + 1; j < checks.length; j++)
              results.push({ name: 'check ' + (j + 1), passed: false, message: 'Skipped after timeout' });
            break;
          }
        }

        const passedCount = results.filter((r) => r.passed).length;
        const total = results.length;

        return {
          passed: total > 0 && passedCount === total,
          checks: results,
          summary: `${passedCount}/${total} checks passed`,
        };
      }
