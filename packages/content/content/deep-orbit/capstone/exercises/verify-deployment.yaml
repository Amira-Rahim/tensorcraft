  interface CheckResult {
    name: string;
    passed: boolean;
    message: string;
  }

  interface DeploymentResult {
    passed: boolean;
    checks: CheckResult[];
    summary: string;
  }

  async function verifyDeployment(
    checks: ((signal: AbortSignal) => Promise<CheckResult>)[],
    timeoutMs = 1000,
  ): Promise<DeploymentResult> {
    if (!Number.isFinite(timeoutMs) || timeoutMs <= 0) throw new Error('Invalid timeout');
    const results: CheckResult[] = [];

    for (let i = 0; i < checks.length; i++) {
      const controller = new AbortController();
      let timer;
      let timedOut = false;
      try {
        const result = await Promise.race([
          Promise.resolve().then(() => checks[i](controller.signal)),
          new Promise<CheckResult>((_, reject) => {
            timer = setTimeout(() => {
              timedOut = true;
              reject(new Error('Timed out'));
              controller.abort();
            }, timeoutMs);
          }),
        ]);
        if (!result || typeof result.name !== 'string' || !result.name.trim() || typeof result.passed !== 'boolean' || typeof result.message !== 'string') throw new Error('Invalid check result');
        results.push(result);
      } catch (error) {
        results.push({
          name: 'check ' + (i + 1),
          passed: false,
          message: error instanceof Error ? error.message : String(error),
        });
      } finally {
        clearTimeout(timer);
      }
      if (timedOut) {
        for (let j = i + 1; j < checks.length; j++)
          results.push({ name: 'check ' + (j + 1), passed: false, message: 'Skipped after timeout' });
        break;
      }
    }

    const passedCount = results.filter((r) => r.passed).length;
    const total = results.length;

    return {
      passed: total > 0 && passedCount === total,
      checks: results,
      summary: `${passedCount}/${total} checks passed`,
    };
  }
testCode: |
  // A tiny real scorer standing in for DEEP SCAN: sigmoid(w·x + 0.1)
  const w = tf.tensor1d([0.4, -0.2, 0.6]);
  const score = (x) => tf.tidy(() => tf.sigmoid(tf.dot(tf.tensor1d(x), w).add(0.1)).dataSync()[0]);

  // Every test below reads fields off the verdict, so the shape is named
  // once here. Without it the first Run against the starter throws a
  // TypeError on null instead of saying what is missing.
  const verdict = (result) => {
    expect(
      result,
      'verifyDeployment returns { passed, checks, summary }. The starter returns null until you build it.',
    ).toBeDefined();
    return result;
  };

  describe('verifyDeployment', () => {
    it('fails malformed check results', async () => {
      for (const bad of [null, {name:'gate',passed:'false',message:''}, {name:'',passed:true,message:''}]) {
        const result = await verifyDeployment([async () => bad]);
        expect(result.passed).toBe(false); expect(result.checks[0].message).toContain('Invalid');
      }
    });
    it('passes a healthy deployment: output contract + anomaly gate + calm gate', async () => {
      const checks = [
        async () => {
          const p = score([0.5, 0.8, 0.2]);
          return {
            name: 'output-contract',
            passed: p >= 0 && p <= 1,
            message: 'score ' + p.toFixed(3),
          };
        },
        async () => {
          const p = score([3, 0, 3]); // strong anomaly probe, sigmoid(3.1) ≈ 0.957
          return { name: 'anomaly-gate', passed: p > 0.9, message: 'anomaly probe ' + p.toFixed(3) };
        },
        async () => {
          const p = score([0, 3, 0]); // calm probe, sigmoid(-0.5) ≈ 0.378
          return { name: 'calm-gate', passed: p < 0.5, message: 'calm probe ' + p.toFixed(3) };
        },
      ];
      const result = verdict(await verifyDeployment(checks));
      expect(result.passed).toBe(true);
      expect(result.summary).toBe('3/3 checks passed');
      recordResult({
        kind: 'table',
        title: 'The verification record your runner returned',
        summary: result.summary + '. These probes ran a small local TFJS scorer. They did not contact or deploy a hosted service.',
        columns: ['Check', 'Passed', 'Returned evidence'],
        rows: result.checks.slice(0, 40).map((check) => [check.name, check.passed, check.message]),
      });
    });

    it('fails the whole deployment when one real gate fails (stricter threshold)', async () => {
      const checks = [
        async () => ({ name: 'output-contract', passed: true, message: 'OK' }),
        async () => {
          const p = score([3, 0, 3]);
          return { name: 'strict-gate', passed: p > 0.999, message: 'scored ' + p.toFixed(3) };
        },
      ];
      const result = verdict(await verifyDeployment(checks));
      expect(result.passed).toBe(false);
      expect(result.summary).toBe('1/2 checks passed');
      expect(result.checks[1].passed).toBe(false);
      recordResult({
        kind: 'table',
        title: 'A failed check blocks the release',
        summary: result.summary + '. The stricter threshold changes the release decision. The underlying local scorer stays the same.',
        columns: ['Check', 'Passed', 'Returned evidence'],
        rows: result.checks.slice(0, 40).map((check) => [check.name, check.passed, check.message]),
      });
    });

    it('runs checks in order and collects every result', async () => {
      const order = [];
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      // Descending waits, so a runner that fires all three at once records
      // them fastest-first: accuracy, latency, shape. Without a real await
      // in here, an async body finishes synchronously and parallel and
      // sequential are indistinguishable.
      const checks = [
        async () => {
          await sleep(30);
          order.push('shape');
          return { name: 'shape', passed: true, message: '' };
        },
        async () => {
          await sleep(20);
          order.push('latency');
          return { name: 'latency', passed: true, message: '' };
        },
        async () => {
          await sleep(10);
          order.push('accuracy');
          return { name: 'accuracy', passed: false, message: 'below gate' };
        },
      ];
      const result = verdict(await verifyDeployment(checks));
      expect(order).toEqual(['shape', 'latency', 'accuracy']);
      expect(result.checks).toHaveLength(3);
      expect(result.checks[2].name).toBe('accuracy');
      // Two of the three cleared. A runner that ships on a majority says
      // this deployment is fine.
      expect(
        result.passed,
        'The accuracy check failed, so the deployment failed. Two out of three is not a pass.',
      ).toBe(false);
      expect(result.summary).toBe('2/3 checks passed');
    });

    it('a failed check anywhere fails the deployment, even when the last one passes', async () => {
      // Which of these fails is decided by the live scorer rather than by a
      // literal in this file: the first probe scores 0.957 against a 0.999
      // floor. The failure is first and the run ends on two passes, so a
      // runner that reports the majority verdict, or the last one it saw,
      // calls this deployment healthy.
      const probes = [
        [3, 0, 3],
        [0.5, 0.8, 0.2],
        [0, 3, 0],
      ];
      const scored = probes.map(score);
      const checks = [
        async () => ({
          name: 'strict-gate',
          passed: scored[0] > 0.999,
          message: 'anomaly probe ' + scored[0].toFixed(3),
        }),
        async () => ({
          name: 'output-contract',
          passed: scored[1] >= 0 && scored[1] <= 1,
          message: 'score ' + scored[1].toFixed(3),
        }),
        async () => ({
          name: 'calm-gate',
          passed: scored[2] < 0.5,
          message: 'calm probe ' + scored[2].toFixed(3),
        }),
      ];
      const result = verdict(await verifyDeployment(checks));
      expect(result.checks.filter((c) => c.passed)).toHaveLength(2);
      expect(result.checks[2].passed).toBe(true);
      expect(
        result.passed,
        'One gate failed out of three. ALL of them have to pass for the deployment to pass.',
      ).toBe(false);
      expect(result.summary).toBe('2/3 checks passed');
    });

    it('a check that throws is recorded as a failed check, not a lost run', async () => {
      // The probe that never answers: DNS fails, the host 503s, the fetch
      // for model.json rejects. A runner that lets the rejection through
      // produces no verdict at all, and nobody on the bridge learns which
      // check died.
      const checks = [
        async () => {
          throw new Error('fetch failed: getaddrinfo ENOTFOUND deep-scan.github.io');
        },
        async () => ({ name: 'probe', passed: true, message: 'scored 0.957' }),
      ];
      const settled = await verifyDeployment(checks).then(
        (value) => ({ ok: true, value }),
        (error) => ({ ok: false, error }),
      );
      expect(
        settled.ok,
        'The first check rejected and the rejection left the runner, so the run reported nothing. Catch it and record it as a failed check.',
      ).toBe(true);
      const result = verdict(settled.value);
      expect(result.checks).toHaveLength(2);
      expect(
        result.checks[0].passed,
        'A check that threw did not pass. Record the failure and run the rest.',
      ).toBe(false);
      expect(
        result.checks[0].name,
        'A check that throws has no result to read a name off, so use its position as its name: the first one is check 1.',
      ).toBe('check 1');
      expect(
        result.checks[0].message,
        'The operator has to read which failure this was. Carry the error message onto the check.',
      ).toContain('ENOTFOUND');
      expect(result.checks[1].passed).toBe(true);
      expect(result.passed).toBe(false);
      expect(result.summary).toBe('1/2 checks passed');
    });

    it('a later check sees the work an earlier one finished', async () => {
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      let modelLoaded = false;
      const checks = [
        async () => {
          await sleep(20);
          modelLoaded = true;
          return { name: 'load', passed: true, message: 'weights in memory' };
        },
        async () => ({
          name: 'probe',
          passed: modelLoaded,
          message: modelLoaded ? 'probe scored' : 'model not loaded yet',
        }),
      ];
      const result = verdict(await verifyDeployment(checks));
      expect(result.checks[1].passed).toBe(true);
      expect(result.passed).toBe(true);
      expect(result.summary).toBe('2/2 checks passed');
    });

    it('a verification with no checks in it fails: nothing was measured', async () => {
      // The launch script can hand over an empty list: a glob that matched
      // no files, a renamed config key, a check module that failed to
      // import. Every check passed is true of a list with no checks in it,
      // so a runner that only counts passes signs off a deployment nobody
      // probed. The accuracy gate one lesson back rules the same way on an
      // empty eval batch.
      const result = verdict(await verifyDeployment([]));
      expect(result.checks).toHaveLength(0);
      expect(
        result.passed,
        'No checks ran. Return passed: false because there is no verification result.',
      ).toBe(false);
      expect(
        result.summary,
        'The summary should report 0 passed out of 0 checks.',
      ).toBe('0/0 checks passed');
    });
  });

  it('reports a hung check and does not start its dependents', async () => {
    let aborted = false,
      started = false;
    const r = await verifyDeployment(
      [
        async (signal) => {
          signal.addEventListener('abort', () => {
            aborted = true;
          });
          return new Promise(() => {});
        },
        async () => {
          started = true;
          return { name: 'dependent', passed: true, message: '' };
        },
      ],
      5,
    );
    expect(aborted).toBe(true);
    expect(started).toBe(false);
    expect(r.passed).toBe(false);
    expect(r.summary).toBe('0/2 checks passed');
    expect(r.checks[0].name).toBe('check 1');
    expect(r.checks[0].message).toContain('Timed out');
    expect(r.checks[1].message).toContain('Skipped after timeout');
  });
  it('accepts a settled check before its timeout and validates the budget', async () => {
    let signal;
    const r = await verifyDeployment(
      [
        async (s) => {
          signal = s;
          return { name: 'ready', passed: true, message: '' };
        },
      ],
      100,
    );
    expect(r.passed).toBe(true);
    expect(signal.aborted).toBe(false);
    await expect(verifyDeployment([], 0)).rejects.toThrow();
  });
