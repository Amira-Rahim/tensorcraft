  import * as tf from '@tensorflow/tfjs';

  interface Reading { amplitude: number; frequency: number; phase: number; label: 0 | 1; }
  interface Range { min: number; max: number; }
  interface Ranges { amplitude: Range; frequency: Range; phase: Range }
  interface RehearsalConfig {
    ranges: Ranges;
    epochs: number;
    batchSize: number;
    baselineMeanScore: number;
    driftTolerance: number;
    minAccuracy: number;
  }
  interface RehearsalVerdict {
    scores: number[];
    losses: number[];
    batchesRun: number;
    canaryAccuracy: number;
    drift: boolean;
    launch: boolean;
  }

  function toRows(readings: Reading[], ranges: Ranges): number[][] {
    if (!readings.length || !readings.every(r => [r.amplitude,r.frequency,r.phase].every(Number.isFinite))) throw new Error('Invalid readings');
    if (![ranges.amplitude,ranges.frequency,ranges.phase].every(r => Number.isFinite(r.min) && Number.isFinite(r.max) && r.max > r.min && Number.isFinite(r.max-r.min))) throw new Error('Invalid ranges');
    const norm = (v: number, r: Range) => {
      const value = (v - r.min) / (r.max - r.min);
      if (!Number.isFinite(Math.fround(value))) throw new Error('Invalid normalized value');
      return value;
    };
    return readings.map((reading) => [
      norm(reading.amplitude, ranges.amplitude),
      norm(reading.frequency, ranges.frequency),
      norm(reading.phase, ranges.phase),
    ]);
  }

  function scoreReadings(
    model: tf.LayersModel,
    readings: Reading[],
    ranges: Ranges,
  ): number[] {
    return tf.tidy(() => {
      const out = model.predict(tf.tensor2d(toRows(readings, ranges))) as tf.Tensor;
      const values = Array.from(out.dataSync());
      if (values.length !== readings.length || !values.every(Number.isFinite)) throw new Error('Invalid predictions');
      return values;
    });
  }

  async function runLaunchRehearsal(
    model: tf.LayersModel,
    archive: Reading[],
    canary: Reading[],
    config: RehearsalConfig,
  ): Promise<RehearsalVerdict> {
    if (!Number.isInteger(config.epochs) || config.epochs <= 0 || !Number.isInteger(config.batchSize) || config.batchSize <= 0 || ![config.baselineMeanScore,config.minAccuracy].every(v => Number.isFinite(v) && v >= 0 && v <= 1) || !Number.isFinite(config.driftTolerance) || config.driftTolerance < 0) throw new Error('Invalid rehearsal config');
    if (![...archive,...canary].every(r => r.label === 0 || r.label === 1)) throw new Error('Invalid labels');
    toRows(canary, config.ranges);
    const xs = tf.tensor2d(toRows(archive, config.ranges));
    const ys = tf.tensor2d(archive.map((r) => [r.label]));
    let history;
    try {
    history = await model.fit(xs, ys, {
      epochs: config.epochs,
      batchSize: config.batchSize,
      shuffle: false,
    });
    } finally {
      xs.dispose(); ys.dispose();
    }

    const losses = history.history.loss as number[];
    if (losses.length !== config.epochs || !losses.every(Number.isFinite)) throw new Error('Invalid loss history');
    const batchesRun = model.optimizer.iterations;

    const scores = scoreReadings(model, canary, config.ranges);

    const correct = scores.filter(
      (s, i) => (s > 0.5 ? 1 : 0) === canary[i].label,
    ).length;
    const canaryAccuracy = correct / canary.length;
    const mean = scores.reduce((a, b) => a + b, 0) / scores.length;
    const drift = Math.abs(mean - config.baselineMeanScore) > config.driftTolerance;
    const launch = canaryAccuracy >= config.minAccuracy && !drift;

    return { scores, losses, batchesRun, canaryAccuracy, drift, launch };
  }
testCode: |
  // A fixed slice of the archive, in raw instrument units: amplitude in ADC
  // counts on a 2048-count full scale, frequency as a zero-crossing count
  // over the 64-sample window, phase in radians. Flagged windows run hot on
  // amplitude and cross zero far less often, the separation module 3 trained
  // the classifier on.
  const makeArchive = (n, seed) => {
    let s = seed;
    const rnd = () => ((s = (s * 1103515245 + 12345) % 2147483648) / 2147483648);
    const rows = [];
    for (let i = 0; i < n; i++) {
      rows.push(i % 2 === 1
        ? { amplitude: 1400 + Math.round(rnd() * 600), frequency: 4 + Math.round(rnd() * 14), phase: 0.8 + rnd() * 1.8, label: 1 }
        : { amplitude: 600 + Math.round(rnd() * 600), frequency: 36 + Math.round(rnd() * 22), phase: -2.4 + rnd() * 1.8, label: 0 });
    }
    return rows;
  };
  const ranges = {
    amplitude: { min: 0, max: 2048 },
    frequency: { min: 0, max: 63 },
    phase: { min: -Math.PI, max: Math.PI },
  };
  const archive = makeArchive(64, 7741);
  const canary = makeArchive(16, 991);
  const greenConfig = {
    ranges,
    epochs: 12,
    batchSize: 16,
    baselineMeanScore: 0.5,
    driftTolerance: 0.15,
    minAccuracy: 0.95,
  };

  // The rehearsal candidate: module 4's three-feature gate, compiled and
  // untrained, standing in for the eleven-feature classifier so the whole
  // chain fits one run. Seeds control initialization for this fixture;
  // numerical results can still vary across backends and runtime versions.
  const buildCandidate = () => {
    const m = tf.sequential();
    m.add(tf.layers.dense({
      inputShape: [3], units: 8, activation: 'relu',
      kernelInitializer: tf.initializers.glorotNormal({ seed: 7741 }),
    }));
    m.add(tf.layers.dense({
      units: 1, activation: 'sigmoid',
      kernelInitializer: tf.initializers.glorotNormal({ seed: 7742 }),
    }));
    m.compile({ optimizer: tf.train.adam(0.05), loss: 'binaryCrossentropy' });
    return m;
  };

  // Module 4's identity trick: a one-unit layer with weights [1, 0, 0] and
  // no bias returns the normalized amplitude untouched, so every score it
  // produces is hand-checkable.
  const columnProbe = (weights) => {
    const m = tf.sequential();
    m.add(tf.layers.dense({ inputShape: [3], units: 1, useBias: false }));
    m.layers[0].setWeights([tf.tensor2d(weights)]);
    return m;
  };

  describe('scoreReadings', () => {
    it('rejects scaling overflow before prediction without retaining tensors', () => {
      let calls = 0;
      const model = { predict: () => { calls++; throw new Error('should not predict'); } };
      const before = tf.memory().numTensors;
      const tiny = { ...ranges, amplitude: { min: 0, max: 1e-100 } };
      expect(() => scoreReadings(model, [{ amplitude: 1, frequency: 0, phase: 0, label: 0 }], tiny)).toThrow();
      expect(calls).toBe(0);
      expect(tf.memory().numTensors).toBe(before);
    });

    it('scores are the normalized amplitudes, in input order', () => {
      const probe = columnProbe([[1], [0], [0]]);
      const readings = [
        { amplitude: 1536, frequency: 0, phase: -Math.PI, label: 1 },  // 0.75
        { amplitude: 512, frequency: 0, phase: -Math.PI, label: 0 },   // 0.25
        { amplitude: 1024, frequency: 0, phase: -Math.PI, label: 0 },  // 0.50
      ];
      const scores = scoreReadings(probe, readings, ranges);
      expect(
        scores,
        'scoreReadings returns one plain number per reading. The starter returns null until you build it.',
      ).toHaveLength(3);
      expect(scores[0]).toBeCloseTo(0.75, 4);
      expect(scores[1]).toBeCloseTo(0.25, 4);
      expect(scores[2]).toBeCloseTo(0.5, 4);
      probe.dispose();
    });

    it('the phase column is normalized too, so the row layout is graded', () => {
      const probe = columnProbe([[0], [0], [1]]);
      const readings = [
        // (phase + PI) / (2 * PI): 0.6 PI -> 0.80, -0.7 PI -> 0.15.
        { amplitude: 1024, frequency: 30, phase: 0.6 * Math.PI, label: 1 },
        { amplitude: 1024, frequency: 30, phase: -0.7 * Math.PI, label: 0 },
      ];
      const scores = scoreReadings(probe, readings, ranges);
      expect(scores, 'scoreReadings returns one plain number per reading. The starter returns null until you build it.').toBeDefined();
      expect(scores[0]).toBeCloseTo(0.8, 4);
      expect(
        scores[1],
        'phase runs from -PI to PI, so range.min is negative and subtracting it moves the value up.',
      ).toBeCloseTo(0.15, 4);
      probe.dispose();
    });

    it('reads the limits off ranges, min included, not a hardcoded full scale', () => {
      // A recalibrated amplitude channel: 512 counts of offset, 1024 of span.
      const probe = columnProbe([[1], [0], [0]]);
      const recalibrated = { ...ranges, amplitude: { min: 512, max: 1536 } };
      const readings = [
        { amplitude: 1152, frequency: 0, phase: -Math.PI, label: 1 },  // 0.625
        { amplitude: 896, frequency: 0, phase: -Math.PI, label: 0 },   // 0.375
      ];
      const scores = scoreReadings(probe, readings, recalibrated);
      expect(scores, 'scoreReadings returns one plain number per reading. The starter returns null until you build it.').toBeDefined();
      // Read against the old 0-2048 scale these would be 0.5625 and 0.4375.
      expect(scores[0]).toBeCloseTo(0.625, 4);
      expect(scores[1]).toBeCloseTo(0.375, 4);
      probe.dispose();
    });

    it('leaves no tensor behind', () => {
      const probe = columnProbe([[1], [0], [0]]);
      const before = tf.memory().numTensors;
      const scores = scoreReadings(probe, canary, ranges);
      expect(scores).toHaveLength(canary.length);
      expect(
        tf.memory().numTensors,
        'The input tensor and the prediction both have to be gone by the time the numbers come back. The dashboard runs this on 512 MB, once per capture, for as long as the mission lasts.',
      ).toBe(before);
      probe.dispose();
    });
  });

  describe('runLaunchRehearsal', () => {
    it('releases training tensors when fitting fails', async () => {
      const captured = [];
      const failedModel = { fit: async (x,y) => { captured.push(x,y); throw new Error('fit failed'); } };
      await expect(runLaunchRehearsal(failedModel, archive, canary, greenConfig)).rejects.toThrow('fit failed');
      expect(captured.map(t => t.isDisposed)).toEqual([true,true]);
    });
    it('rejects empty data and invalid configuration before fitting', async () => {
      let calls = 0;
      const model = {fit: async () => {calls++; throw new Error('should not fit');}};
      await expect(runLaunchRehearsal(model, archive, [], greenConfig)).rejects.toThrow();
      await expect(runLaunchRehearsal(model, [], canary, greenConfig)).rejects.toThrow();
      await expect(runLaunchRehearsal(model, archive, canary, {...greenConfig,driftTolerance:NaN})).rejects.toThrow();
      expect(calls).toBe(0);
    });

    it('trains the candidate: 64 rows at batch 16 is 4 batches an epoch, 12 epochs, 48 updates', async () => {
      const model = buildCandidate();
      const v = await runLaunchRehearsal(model, archive, canary, greenConfig);
      expect(
        v,
        'runLaunchRehearsal returns the verdict object. The starter returns null until you build it.',
      ).toBeDefined();
      expect(
        v.losses,
        'history.history.loss carries one entry per epoch, so a 12-epoch fit reports 12 losses.',
      ).toHaveLength(12);
      expect(
        v.batchesRun,
        'Read model.optimizer.iterations after fitting. Here, 64 rows in batches of 16 give 4 updates per epoch, or 48 over 12 epochs. The counter also includes earlier training. Report it with the loss history from this fit.',
      ).toBe(48);
      expect(v.batchesRun).toBe(Math.ceil(archive.length / greenConfig.batchSize) * v.losses.length);
      model.dispose();

      // Same function, a different schedule. 32 rows in batches of 8 is
      // 4 batches, and 5 epochs of that is 20 updates. A count typed in
      // rather than read off the optimizer reports 48 again here.
      const shorter = buildCandidate();
      const w = await runLaunchRehearsal(
        shorter,
        archive.slice(0, 32),
        canary,
        { ...greenConfig, epochs: 5, batchSize: 8 },
      );
      expect(w.losses).toHaveLength(5);
      expect(
        w.batchesRun,
        'The schedule changed, so the update count changed with it.',
      ).toBe(20);
      shorter.dispose();
    });

    it('the verdict reports the fit that ran: its rows, its trace, its count', async () => {
      // A schedule and an instrument calibration this file uses nowhere
      // else, so nothing below can be recognized instead of read: the
      // amplitude channel offset by 512 counts with 1024 of span, the
      // frequency counter reading against a 40-crossing ceiling, and a
      // phase sensor re-zeroed to report 0 to 2*PI instead of -PI to PI.
      // The expected rows are recomputed here from the config's own
      // limits, and the loss trace is whatever the fit hands back on the
      // day.
      const model = buildCandidate();
      const recalibrated = {
        ...greenConfig,
        ranges: {
          amplitude: { min: 512, max: 1536 },
          frequency: { min: 0, max: 40 },
          phase: { min: 0, max: 2 * Math.PI },
        },
        epochs: 6,
        batchSize: 32,
      };
      const norm = (v, r) => (v - r.min) / (r.max - r.min);
      const expectedRows = archive.map((r) => [
        norm(r.amplitude, recalibrated.ranges.amplitude),
        norm(r.frequency, recalibrated.ranges.frequency),
        norm(r.phase, recalibrated.ranges.phase),
      ]);
      // CI hands this candidate over warm: a one-batch smoke fit already
      // ran on it and the optimizer kept that update.
      const warmXs = tf.tensor2d(expectedRows.slice(0, 32));
      const warmYs = tf.tensor2d(archive.slice(0, 32).map((r) => [r.label]));
      await model.fit(warmXs, warmYs, { epochs: 1, batchSize: 32, shuffle: false });
      warmXs.dispose();
      warmYs.dispose();

      const calls = [];
      const realFit = model.fit.bind(model);
      model.fit = (xs, ys, options) => {
        const call = { rows: xs.arraySync(), options: options || {} };
        calls.push(call);
        return realFit(xs, ys, options).then((history) => {
          call.loss = history.history.loss;
          return history;
        });
      };
      const v = await runLaunchRehearsal(model, archive, canary, recalibrated);
      expect(
        v,
        'runLaunchRehearsal returns the verdict object. The starter returns null until you build it.',
      ).toBeDefined();
      expect(
        calls,
        'One fit call per rehearsal, handed the whole archive at once.',
      ).toHaveLength(1);
      expect(
        calls[0].options.epochs,
        'The fit runs the schedule the config names, and this rehearsal asked for 6 epochs. A schedule chosen inside the function is a different training run from the one the verdict reports.',
      ).toBe(6);
      expect(
        calls[0].options.batchSize,
        'The fit runs the schedule the config names, and this rehearsal asked for batches of 32.',
      ).toBe(32);
      expect(
        calls[0].rows,
        'The fit is handed one row per archive reading.',
      ).toHaveLength(archive.length);
      for (let i = 0; i < expectedRows.length; i++) {
        for (let c = 0; c < 3; c++) {
          expect(
            calls[0].rows[i][c],
            'Row ' + i + ' column ' + c + ' does not match normalization with config.ranges. This case changes all three ranges: amplitude starts at 512 with width 1024, frequency has a 40-crossing ceiling, and phase runs from 0 through 2*PI. Read the configured limits for training and scoring; do not hardcode them.',
          ).toBeCloseTo(expectedRows[i][c], 4);
        }
      }
      expect(
        calls[0].loss,
        'Await the fit: its history is what the loss trace comes from.',
      ).toBeDefined();
      expect(
        v.losses,
        'The fit reported one loss per epoch, and this rehearsal ran 6.',
      ).toHaveLength(calls[0].loss.length);
      for (let i = 0; i < calls[0].loss.length; i++) {
        expect(
          v.losses[i],
          'Loss ' + i + ' differs from the loss returned by this fit. Report history.history.loss from the actual training call instead of making a separate trace.',
        ).toBeCloseTo(calls[0].loss[i], 6);
      }
      expect(
        v.batchesRun,
        'The optimizer already had one update. Training 64 rows in batches of 32 for 6 epochs adds 12, so its counter should read 13. Read that counter instead of calculating only this run’s scheduled updates.',
      ).toBe(13);
      expect(
        v.batchesRun,
        'Read batchesRun from model.optimizer.iterations after fitting. Do not replace the optimizer’s actual counter with a number calculated from the schedule.',
      ).toBe(model.optimizer.iterations);
      model.dispose();
    });

    it('the loss falls: the candidate is better after the fit than before it', async () => {
      const model = buildCandidate();
      const v = await runLaunchRehearsal(model, archive, canary, greenConfig);
      expect(v, 'runLaunchRehearsal returns the verdict object. The starter returns null until you build it.').toBeDefined();
      expect(Number.isFinite(v.losses[0])).toBe(true);
      expect(
        v.losses[v.losses.length - 1],
        'This seeded fixture should reduce loss from its initial value near ln 2, where scores are near 0.5. Real training can run without improving loss.',
      ).toBeLessThan(v.losses[0]);
      expect(
        v.losses[v.losses.length - 1],
        'The floor is loose next to the 0.003 this fixture lands on, because a browser backend will not reproduce the last digits. A run still above 0.05 after twelve epochs did not separate this archive.',
      ).toBeLessThan(0.05);
      model.dispose();
    });

    it('the scores are what THIS model predicts after the fit, not before it', async () => {
      const model = buildCandidate();
      const untrained = scoreReadings(model, canary, ranges);
      const v = await runLaunchRehearsal(model, archive, canary, greenConfig);
      expect(v, 'runLaunchRehearsal returns the verdict object. The starter returns null until you build it.').toBeDefined();
      const trained = scoreReadings(model, canary, ranges);
      expect(v.scores, 'One score per canary reading.').toHaveLength(canary.length);
      for (let i = 0; i < trained.length; i++) {
        expect(
          v.scores[i],
          'Score ' + i + ' does not match what the trained model returns for that reading. Score the canary set after the fit, with the model the fit updated.',
        ).toBeCloseTo(trained[i], 6);
      }
      let moved = 0;
      for (let i = 0; i < trained.length; i++) {
        moved = Math.max(moved, Math.abs(trained[i] - untrained[i]));
      }
      expect(
        moved,
        'Training moved this model, so scoring it before the fit and after it cannot give the same answers.',
      ).toBeGreaterThan(0.1);
      model.dispose();
    });

    it('a clean rehearsal clears the gate and launches', async () => {
      const model = buildCandidate();
      const v = await runLaunchRehearsal(model, archive, canary, greenConfig);
      expect(v, 'runLaunchRehearsal returns the verdict object. The starter returns null until you build it.').toBeDefined();
      expect(
        v.canaryAccuracy,
        'A trained candidate separates this archive slice, so every canary verdict should match its label.',
      ).toBeGreaterThanOrEqual(0.9);
      expect(v.drift).toBe(false);
      expect(v.launch).toBe(true);
      recordResult({
        kind: 'series',
        title: 'Loss from your rehearsal fit',
        summary: 'Returned from this training run on the supplied synthetic archive. The optimizer reports ' + v.batchesRun + ' updates; falling training loss alone does not establish performance on new data.',
        xLabel: 'Epoch',
        yLabel: 'Training loss',
        labels: v.losses.slice(0, 64).map((_, i) => String(i + 1)),
        series: [{ name: 'Training loss', values: v.losses.slice(0, 64) }],
      });
      recordResult({
        kind: 'table',
        title: 'Canary predictions from the trained candidate',
        summary: 'Your rehearsal returned accuracy ' + v.canaryAccuracy + ', score drift ' + v.drift + ', and launch ' + v.launch + '. This is a local release-policy rehearsal, not a deployment.',
        columns: ['Canary case', 'Returned score', 'Supplied label'],
        rows: v.scores.slice(0, 40).map((value, i) => [i + 1, value, canary[i].label]),
      });
      model.dispose();
    });

    it('a mislabeled canary drops the accuracy and blocks the launch', async () => {
      const model = buildCandidate();
      const flipped = canary.map((r, i) => (i === 3 ? { ...r, label: r.label === 1 ? 0 : 1 } : r));
      const v = await runLaunchRehearsal(model, archive, flipped, greenConfig);
      expect(v, 'runLaunchRehearsal returns the verdict object. The starter returns null until you build it.').toBeDefined();
      expect(
        v.canaryAccuracy,
        'Fifteen of sixteen canary verdicts match, which is 0.9375 and under the 0.95 floor.',
      ).toBeCloseTo(15 / 16, 5);
      expect(v.launch).toBe(false);
      model.dispose();
    });

    it('drift blocks the launch even when every canary verdict is right', async () => {
      const model = buildCandidate();
      const drifted = { ...greenConfig, baselineMeanScore: 0.05 };
      const v = await runLaunchRehearsal(model, archive, canary, drifted);
      expect(v, 'runLaunchRehearsal returns the verdict object. The starter returns null until you build it.').toBeDefined();
      expect(v.canaryAccuracy).toBeGreaterThanOrEqual(0.9);
      expect(
        v.drift,
        'The canary set is half flagged, so the scores average near 0.5. A deployment whose recorded baseline is 0.05 is scoring something else.',
      ).toBe(true);
      expect(v.launch).toBe(false);
      model.dispose();
    });

    it('drift is measured on the scores the model produced, not on the canary labels', async () => {
      // A miscoded canary: the eight flagged readings, every one of them
      // filed under label 0. It is the one fixture here where the scores
      // and the labels average to different numbers.
      const model = buildCandidate();
      const miscoded = canary
        .filter((r) => r.label === 1)
        .map((r) => ({ ...r, label: 0 }));
      const miscodedConfig = {
        ...greenConfig,
        baselineMeanScore: 0.99,
        driftTolerance: 0.05,
      };
      const v = await runLaunchRehearsal(model, archive, miscoded, miscodedConfig);
      expect(
        v,
        'runLaunchRehearsal returns the verdict object. The starter returns null until you build it.',
      ).toBeDefined();
      expect(
        v.canaryAccuracy,
        'Every reading in this set is flagged and every label says otherwise, so no verdict matches.',
      ).toBe(0);
      expect(
        v.drift,
        'Compare the mean predicted score with the baseline. About 0.997 is within tolerance of 0.99. This mean-only check cannot detect every distribution change; averaging labels checks a different quantity.',
      ).toBe(false);
      expect(
        v.launch,
        'Nothing launches on a canary set where no verdict matched its label, whatever the drift check says.',
      ).toBe(false);
      model.dispose();
    });

    it('disposes the training tensors instead of leaving a pair behind per rehearsal', async () => {
      // The two biggest tensors in the module are allocated here, and this
      // runs again every time CI hands over a candidate. The model records
      // what it was fitted on, so the check reads those two tensors rather
      // than a backend-wide count that another test could move under it.
      const model = buildCandidate();
      const fitted = [];
      const realFit = model.fit.bind(model);
      model.fit = (xs, ys, options) => {
        fitted.push(xs, ys);
        return realFit(xs, ys, options);
      };
      const v = await runLaunchRehearsal(model, archive, canary, greenConfig);
      expect(
        v,
        'runLaunchRehearsal returns the verdict object. The starter returns null until you build it.',
      ).toBeDefined();
      expect(
        fitted.length,
        'One fit, handed a feature tensor and a label tensor. Build both with tf.tensor2d.',
      ).toBe(2);
      expect(
        fitted.map((t) => t && t.isDisposed === true),
        'Training tensors remain after the rehearsal. Dispose both after fit settles, including on rejection. tf.tidy does not manage tensors across an await.',
      ).toEqual([true, true]);
      model.dispose();
    });

    it('a second rehearsal keeps training the same model, it does not start over', async () => {
      const model = buildCandidate();
      const first = await runLaunchRehearsal(model, archive, canary, greenConfig);
      expect(first, 'runLaunchRehearsal returns the verdict object. The starter returns null until you build it.').toBeDefined();
      const second = await runLaunchRehearsal(model, archive, canary, greenConfig);
      expect(first.batchesRun, 'The first rehearsal ran 48 updates.').toBe(48);
      expect(
        second.batchesRun,
        'The same optimizer kept counting through the second rehearsal, so it reports 96. A rehearsal that compiled the model again would reset this to 48 and throw away the training state it was handed.',
      ).toBe(96);
      expect(
        second.losses[0],
        'The second rehearsal starts from where the first one finished, so its opening loss sits near the first one\'s closing loss rather than back near 0.70.',
      ).toBeLessThan(first.losses[0]);
      model.dispose();
    });
  });
