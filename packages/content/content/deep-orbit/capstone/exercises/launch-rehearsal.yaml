slug: launch-rehearsal
lessonSlug: launch
title: "Launch Rehearsal: Train the Candidate, Then Gate It"
mlContent: model
instructions: |
  The whole system, once, on your own hands. Two functions.

  `scoreReadings(model, readings, ranges)` is the inference path, and it is synchronous. Every reading is raw instrument output: `amplitude` in ADC counts, `frequency` as a zero-crossing count, `phase` in radians. Turn each one into a row `[amplitude, frequency, phase]` with module 4's min-max rule, `(value - range.min) / (range.max - range.min)`, reading the limits off `ranges.amplitude`, `ranges.frequency` and `ranges.phase`. Build one `tf.tensor2d` of those rows inside `tf.tidy()`, predict, and return plain numbers in reading order. It must leave no tensor behind: the grader counts live tensors either side of the call and the two counts have to match.

  `runLaunchRehearsal(model, archive, canary, config)` is async and runs the rehearsal.

  1. Train. The model arrives compiled, so do not compile it again. Build `tf.tensor2d` for the archive rows and for their labels, `await model.fit(xs, ys, { epochs: config.epochs, batchSize: config.batchSize, shuffle: false })`, then dispose both tensors.
  2. Score the canary set with `scoreReadings` and the model you just trained.
  3. Gate the run.

  Return:

      {
        scores: number[],        // candidate score per canary reading, input order
        losses: number[],        // history.history.loss, one entry per epoch
        batchesRun: number,      // model.optimizer.iterations after the fit
        canaryAccuracy: number,  // fraction where (score > 0.5) matches reading.label
        drift: boolean,          // |mean(scores) - config.baselineMeanScore| > config.driftTolerance
        launch: boolean,         // canaryAccuracy >= config.minAccuracy AND no drift
      }

  `batchesRun` reads `model.optimizer.iterations`, which the optimizer increments once per batch and nothing outside it can set. The grader checks it against the number of epochs in `losses`, and runs a second schedule with different numbers, so a loss trace and a trained model have to come from the same call.
