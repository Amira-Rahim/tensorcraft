slug: launch-rehearsal
lessonSlug: launch
title: "Launch Rehearsal: The Full Chain, Gated"
mlContent: model
instructions: |
  Assemble the whole system once, end to end. Build `runLaunchRehearsal(model, readings, config)`: normalize each reading's features to [0, 1] using `config.ranges` (module 4's pipeline), batch-predict all readings inside `tf.tidy()`, then judge the run the way module 11 gates a deploy. Return:

    {
      confidences: number[],   // model output per reading, input order
      canaryAccuracy: number,  // fraction where (confidence > 0.5) matches reading.label
      drift: boolean,          // |mean(confidences) - config.baselineMeanConfidence| > config.driftTolerance
      launch: boolean,         // canaryAccuracy >= config.minAccuracy AND no drift
    }

  A rehearsal that leaks tensors fails the rehearsal: the whole prediction pass lives inside tidy.
