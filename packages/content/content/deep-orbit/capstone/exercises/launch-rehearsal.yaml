slug: launch-rehearsal
lessonSlug: launch
title: "Launch Rehearsal: Train the Candidate, Then Gate It"
mlContent: model
instructions: |
  Help Nazari rehearse training and release with a small synthetic model. This does not deploy the full mission system. Write two functions.

  `scoreReadings(model, readings, ranges)` is synchronous. Each raw reading has `amplitude` in ADC counts, `frequency` as a zero-crossing count, and `phase` in radians.

  - Make rows in `[amplitude, frequency, phase]` order.
  - Normalize each value with `(value - range.min) / (range.max - range.min)`, using its matching entry in `ranges`.
  - Inside `tf.tidy()`, build one `tf.tensor2d`, predict, and return plain numbers in reading order.
  - Leave no tensors behind. The live tensor count must match before and after the call.

  `runLaunchRehearsal(model, archive, canary, config)` is async:

  1. Normalize archive rows in the same way, using `config.ranges`. Build one `tf.tensor2d` for those rows and one for labels. The model is already compiled; keep its model and optimizer.
  2. Call `await model.fit(xs, ys, { epochs: config.epochs, batchSize: config.batchSize, shuffle: false })`. Dispose both training tensors, even if fit rejects. The caller owns the model.
  3. Use the trained model and `scoreReadings` to score the canary set, then apply the launch gate below.

  Reject invalid inputs or configuration. Require non-empty archive and canary sets, finite input values, positive range widths, binary labels, and positive integer epochs and batchSize. Require finite baselineMeanScore and minAccuracy in [0, 1], plus finite nonnegative driftTolerance. Reject values that become non-finite after normalization or float32 conversion, and reject non-finite predictions or losses.

  Return:

      {
        scores: number[],        // canary scores, in reading order
        losses: number[],        // history.history.loss, one per epoch
        batchesRun: number,      // model.optimizer.iterations after fitting
        canaryAccuracy: number,  // fraction where (score > 0.5) matches reading.label
        drift: boolean,          // |mean(scores) - config.baselineMeanScore| > config.driftTolerance
        launch: boolean,         // canaryAccuracy >= config.minAccuracy AND no drift
      }

  Read the optimizer's total update count, including any training before this rehearsal. Return the loss history from this fit. The checks vary the schedule and all three ranges, and inspect the actual training rows. These checks help verify consistency; they are not a tamper-proof training record.

  Drift here means a change in the mean prediction score. It does not measure input drift or prove accuracy loss. The fixed synthetic examples demonstrate this policy.
hints:
  - level: nudge
    content: "Every number in the verdict has to come from the same training run, so the order of operations is the exercise: train first, then judge what you trained. Read the optimizer update count and compare it with the fit call, including updates made before this rehearsal."
  - level: guidance
    content: |
      Read each feature's min and max from config. For phase, subtracting a
      negative minimum shifts the value upward. Use tf.tidy for synchronous
      prediction, and try/finally to dispose the tensors used by async fit.

      Keep the supplied compiled model and optimizer. After fitting, read
      its total update count and loss history, then score the canary rows.
      Launch requires both sufficient labeled accuracy and a mean score
      within the configured drift tolerance.
  - level: solution
    content: |
      import * as tf from '@tensorflow/tfjs';

      interface Reading { amplitude: number; frequency: number; phase: number; label: 0 | 1; }
      interface Range { min: number; max: number; }
      interface Ranges { amplitude: Range; frequency: Range; phase: Range }
      interface RehearsalConfig {
        ranges: Ranges;
        epochs: number;
        batchSize: number;
        baselineMeanScore: number;
        driftTolerance: number;
        minAccuracy: number;
      }
      interface RehearsalVerdict {
        scores: number[];
        losses: number[];
        batchesRun: number;
        canaryAccuracy: number;
        drift: boolean;
        launch: boolean;
      }

      function toRows(readings: Reading[], ranges: Ranges): number[][] {
        if (!readings.length || !readings.every(r => [r.amplitude,r.frequency,r.phase].every(Number.isFinite))) throw new Error('Invalid readings');
        if (![ranges.amplitude,ranges.frequency,ranges.phase].every(r => Number.isFinite(r.min) && Number.isFinite(r.max) && r.max > r.min && Number.isFinite(r.max-r.min))) throw new Error('Invalid ranges');
        const norm = (v: number, r: Range) => {
          const value = (v - r.min) / (r.max - r.min);
          if (!Number.isFinite(Math.fround(value))) throw new Error('Invalid normalized value');
          return value;
        };
        return readings.map((reading) => [
          norm(reading.amplitude, ranges.amplitude),
          norm(reading.frequency, ranges.frequency),
          norm(reading.phase, ranges.phase),
        ]);
      }

      function scoreReadings(
        model: tf.LayersModel,
        readings: Reading[],
        ranges: Ranges,
      ): number[] {
        return tf.tidy(() => {
          const out = model.predict(tf.tensor2d(toRows(readings, ranges))) as tf.Tensor;
          const values = Array.from(out.dataSync());
          if (values.length !== readings.length || !values.every(Number.isFinite)) throw new Error('Invalid predictions');
          return values;
        });
      }

      async function runLaunchRehearsal(
        model: tf.LayersModel,
        archive: Reading[],
        canary: Reading[],
        config: RehearsalConfig,
      ): Promise<RehearsalVerdict> {
        if (!Number.isInteger(config.epochs) || config.epochs <= 0 || !Number.isInteger(config.batchSize) || config.batchSize <= 0 || ![config.baselineMeanScore,config.minAccuracy].every(v => Number.isFinite(v) && v >= 0 && v <= 1) || !Number.isFinite(config.driftTolerance) || config.driftTolerance < 0) throw new Error('Invalid rehearsal config');
        if (![...archive,...canary].every(r => r.label === 0 || r.label === 1)) throw new Error('Invalid labels');
        toRows(canary, config.ranges);
        const xs = tf.tensor2d(toRows(archive, config.ranges));
        const ys = tf.tensor2d(archive.map((r) => [r.label]));
        let history;
        try {
        history = await model.fit(xs, ys, {
          epochs: config.epochs,
          batchSize: config.batchSize,
          shuffle: false,
        });
        } finally {
          xs.dispose(); ys.dispose();
        }

        const losses = history.history.loss as number[];
        if (losses.length !== config.epochs || !losses.every(Number.isFinite)) throw new Error('Invalid loss history');
        const batchesRun = model.optimizer.iterations;

        const scores = scoreReadings(model, canary, config.ranges);

        const correct = scores.filter(
          (s, i) => (s > 0.5 ? 1 : 0) === canary[i].label,
        ).length;
        const canaryAccuracy = correct / canary.length;
        const mean = scores.reduce((a, b) => a + b, 0) / scores.length;
        const drift = Math.abs(mean - config.baselineMeanScore) > config.driftTolerance;
        const launch = canaryAccuracy >= config.minAccuracy && !drift;

        return { scores, losses, batchesRun, canaryAccuracy, drift, launch };
      }
