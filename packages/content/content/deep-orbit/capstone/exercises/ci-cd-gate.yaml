slug: ci-cd-gate
lessonSlug: ci-cd-pipeline
title: "The CI/CD release check"
instructions: |
  Help Nazari check whether the supplied predictions pass the release gate. Write `validateModelAccuracy(predictions, minAccuracy)`.

  `minAccuracy` must be finite and between 0 and 1 inclusive. Throw if it is invalid. Return:

      {
        total: number,    // all supplied rows
        correct: number,  // rows with two valid, matching labels
        accuracy: number, // correct / total, or 0 for an empty batch
        passed: boolean,  // non-empty batch with accuracy >= minAccuracy
      }

  A row is correct only when `predicted` and `actual` are both non-empty strings and match. Missing, null, or empty labels never count as correct, even when both are missing. Every row still counts in `total`.

  A score exactly at the minimum passes. An empty batch fails with accuracy 0. Because rows without usable labels remain in the total, this conservative score is not accuracy measured on a fully labeled evaluation set.
hints:
  - level: nudge
    content: |
      Check that both labels exist before comparing them. What does JavaScript return for undefined === undefined?
  - level: guidance
    content: |
      Count a match only when both labels are non-empty strings. Keep all rows in the total, including those without usable labels. Guard the empty batch before dividing, and require a non-empty batch as well as the accuracy floor.
  - level: solution
    content: |
      interface Prediction {
        predicted?: unknown;
        actual?: unknown;
      }

      interface GateResult {
        accuracy: number;
        passed: boolean;
        total: number;
        correct: number;
      }

      function validateModelAccuracy(
        predictions: Prediction[],
        minAccuracy: number
      ): GateResult {
        if (!Number.isFinite(minAccuracy) || minAccuracy < 0 || minAccuracy > 1) throw new Error('Invalid accuracy floor');
        const correct = predictions.filter(p => typeof p.predicted === 'string' && p.predicted.trim().length > 0 && typeof p.actual === 'string' && p.actual.trim().length > 0 && p.predicted === p.actual).length;
        const total = predictions.length;
        const accuracy = total === 0 ? 0 : correct / total;

        return {
          accuracy,
          passed: total > 0 && accuracy >= minAccuracy,
          total,
          correct,
        };
      }
