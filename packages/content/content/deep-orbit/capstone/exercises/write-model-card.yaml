solutionCode: |
  interface ModelMetadata {
    name: string;
    version: string;
    accuracy: number;
    benchmarkedOn: string;
    weightBytes: number;
    inferenceMs: number;
    recallByClass: Record<string, number>;
    limitations: string[];
    inputFormat: string;
    outputFormat: string;
  }

  function generateModelCard(meta: ModelMetadata): string {
    const pct = (v: number) => `${(v * 100).toFixed(1)}%`;
    const [worstClass, worstRecall] = Object.entries(meta.recallByClass).sort(
      (a, b) => a[1] - b[1],
    )[0];

    const lines = [
      `# ${meta.name} v${meta.version}`,
      '',
      '## Performance',
      `- Accuracy: ${pct(meta.accuracy)} (measured at ${meta.benchmarkedOn})`,
      `- Size: ${meta.weightBytes} bytes`,
      `- Inference: ${meta.inferenceMs}ms`,
      '',
      '## Limitations',
      `- Lowest recall: ${worstClass} at ${pct(worstRecall)}`,
      ...meta.limitations.map(l => `- ${l}`),
      '',
      '## Usage',
      `- Input: ${meta.inputFormat}`,
      `- Output: ${meta.outputFormat}`,
    ];
    return lines.join('\n');
  }
testCode: |
  describe('generateModelCard', () => {
    const meta = {
      name: 'DEEP SCAN',
      version: '1.0.0',
      accuracy: 0.918,
      benchmarkedOn: 'the pruning review',
      weightBytes: 3988,
      inferenceMs: 0.035,
      recallByClass: {
        pulsar: 0.96,
        noise: 0.95,
        quasar: 0.94,
        interference: 0.9,
        anomaly: 0.84,
      },
      limitations: ['Only tested on Sector 7-G data', 'Requires 64-sample capture window'],
      inputFormat: 'Float32Array(64)',
      outputFormat: '{ label, confidence }',
    };

    it('includes model name and version', () => {
      const card = generateModelCard(meta);
      expect(
        typeof card,
        'generateModelCard returns the whole card as one string, sections and all. The starter returns null until you build it.',
      ).toBe('string');
      expect(card).toContain('# DEEP SCAN v1.0.0');
    });

    it('dates the accuracy number instead of stating it bare', () => {
      const card = generateModelCard(meta);
      expect(card).toContain('- Accuracy: 91.8% (measured at the pruning review)');
    });

    it('includes size and inference speed', () => {
      const card = generateModelCard(meta);
      expect(card).toContain('- Size: 3988 bytes');
      expect(card).toContain('- Inference: 0.035ms');
    });

    it('files the lowest-recall class under Limitations', () => {
      const card = generateModelCard(meta);
      expect(
        card,
        'Five classes here, and anomaly is the one an operator has to be warned about.',
      ).toContain('- Lowest recall: anomaly at 84.0%');
    });

    it('finds the lowest recall wherever it sits in the object', () => {
      // Three orderings of the same five classes. Insertion order is not
      // a ranking, so a card that reads whichever key happens to come
      // first or last files a healthy class under Limitations and tells
      // the operator the model is weakest where it is strongest.
      const worstInTheMiddle = {
        ...meta,
        recallByClass: { pulsar: 0.96, noise: 0.95, anomaly: 0.84, quasar: 0.94, interference: 0.9 },
      };
      const worstFirst = {
        ...meta,
        recallByClass: { anomaly: 0.84, pulsar: 0.96, noise: 0.95, quasar: 0.94, interference: 0.9 },
      };
      for (const variant of [worstInTheMiddle, worstFirst]) {
        const card = generateModelCard(variant);
        expect(
          card,
          'The limitation line names the minimum recall in the object, which means comparing the values rather than trusting their order.',
        ).toContain('- Lowest recall: anomaly at 84.0%');
        expect(
          card,
          'pulsar at 96.0% is the strongest class in this card. Nothing about it belongs under Limitations.',
        ).not.toContain('- Lowest recall: pulsar');
        expect(card).not.toContain('- Lowest recall: interference');
      }
    });

    it('compares the recall values: the worst class is neither named nor last', () => {
      // Two shortcuts clear every card above without comparing anything:
      // report the class called anomaly if the object has one, or report
      // whichever key was written last. Here the weakest class is called
      // drift and it was written first, so both shortcuts file a healthy
      // class under Limitations.
      const weather = {
        ...meta,
        name: 'SENTINEL',
        version: '2.3.1',
        recallByClass: { drift: 0.41, clear: 0.93, storm: 0.88 },
      };
      const card = generateModelCard(weather);
      expect(
        card,
        'drift at 41.0% is the lowest recall in this object. Finding it means comparing the values, not matching a class name or reading the last key.',
      ).toContain('- Lowest recall: drift at 41.0%');
      expect(
        card,
        'storm is the last class written in this object and the second weakest of the three. A card that reports the last key names storm here.',
      ).not.toContain('- Lowest recall: storm');
      expect(card).not.toContain('- Lowest recall: clear');
    });

    it('lists all limitations', () => {
      const card = generateModelCard(meta);
      expect(card).toContain('- Only tested on Sector 7-G data');
      expect(card).toContain('- Requires 64-sample capture window');
    });

    it('includes usage information', () => {
      const card = generateModelCard(meta);
      expect(card).toContain('- Input: Float32Array(64)');
      expect(card).toContain('- Output: { label, confidence }');
    });

    it('carries all three section headings', () => {
      const card = generateModelCard(meta);
      expect(card).toContain('## Performance');
      expect(card).toContain('## Limitations');
      expect(card).toContain('## Usage');
    });

    it('files every bullet under its own heading', () => {
      const card = generateModelCard(meta);
      const at = (s) => card.indexOf(s);
      expect(at('## Performance')).toBeGreaterThan(at('# DEEP SCAN v1.0.0'));
      expect(at('- Accuracy: 91.8% (measured at the pruning review)')).toBeGreaterThan(at('## Performance'));
      expect(at('## Limitations')).toBeGreaterThan(at('- Size: 3988 bytes'));
      expect(at('- Lowest recall: anomaly at 84.0%')).toBeGreaterThan(at('## Limitations'));
      expect(at('## Usage')).toBeGreaterThan(at('- Only tested on Sector 7-G data'));
      expect(at('- Input: Float32Array(64)')).toBeGreaterThan(at('## Usage'));
    });

    it('renders the metadata it is given, not a memorized card', () => {
      const other = {
        name: 'SENTINEL',
        version: '2.3.1',
        accuracy: 0.874,
        benchmarkedOn: 'the v2.3 handover',
        weightBytes: 9248,
        inferenceMs: 12,
        recallByClass: { clear: 0.91, storm: 0.62 },
        limitations: ['Drifts on unseen bands'],
        inputFormat: 'Float32Array(256)',
        outputFormat: '{ score }',
      };
      const card = generateModelCard(other);
      expect(card).toContain('# SENTINEL v2.3.1');
      expect(
        card,
        'Every number on the card is read off the metadata argument, so a second model renders a second card.',
      ).toContain('- Accuracy: 87.4% (measured at the v2.3 handover)');
      expect(card).toContain('- Size: 9248 bytes');
      expect(card).toContain('- Lowest recall: storm at 62.0%');
      expect(card).toContain('- Drifts on unseen bands');
    });
  });
