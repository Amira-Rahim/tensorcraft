slug: write-model-card
lessonSlug: documentation
title: "Write a Model Card"
instructions: |
  Help Farah prepare the model handover. Render the supplied metadata as one Model Card string, using this exact line order and format:

      # {name} v{version}
      ## Performance
      - Accuracy: {accuracy as a percentage}% (measured at {benchmarkedOn})
      - Size: {weightBytes} bytes
      - Inference: {inferenceMs}ms
      ## Limitations
      - Lowest recall: {class} at {that class recall as a percentage}%
      - {one line per entry of limitations}
      ## Usage
      - Input: {inputFormat}
      - Output: {outputFormat}

  Read every value from `meta`. Format percentages with one decimal place. Find the smallest value in `recallByClass`; do not assume a class name or key order. If values tie, you may use the first minimum in insertion order. Keep each bullet under its named heading.

  Inputs are already validated. Metric fractions are finite in [0, 1], sizes and durations are nonnegative, and `recallByClass` is non-empty. `weightBytes` describes the weight file, not the whole download.

  This is part of a model card. A release card also needs purpose, model and data versions, split method, per-class sample counts, metric definitions, and the timing environment. The supplied mission values are fictional; formatting them does not verify them.
