slug: write-model-card
lessonSlug: documentation
title: "Write a Model Card"
instructions: |
  Render a Model Card from structured model metadata: one string whose lines the grader matches literally, in this order.

      # {name} v{version}
      ## Performance
      - Accuracy: {accuracy as a percentage}% (measured at {benchmarkedOn})
      - Size: {weightBytes} bytes
      - Inference: {inferenceMs}ms
      ## Limitations
      - Lowest recall: {class} at {that class recall as a percentage}%
      - {one line per entry of limitations}
      ## Usage
      - Input: {inputFormat}
      - Output: {outputFormat}

  Percentages carry one decimal place, and every bullet sits under its own heading. The size line carries the weight file in bytes, which is the figure that was measured, not a rounded megabyte total for the whole download.

  Two lines are computed instead of copied.

  1. Accuracy renders with the benchmark it was measured on, because a percentage with no measurement attached says nothing about whether it still holds.
  2. The first limitation is the class with the lowest recall in `recallByClass`, which maps each class name to its recall as a fraction. Finding it means comparing the values. The order the classes were written in is not a ranking, and the weakest class is not always the one with a worrying name.
