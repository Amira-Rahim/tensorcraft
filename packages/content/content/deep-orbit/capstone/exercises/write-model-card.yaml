title: "Write a Model Card"
instructions: "Render a Model Card from structured model metadata: a title line, then Performance, Limitations, and Usage sections. Two of the lines carry what an operator has to be told. Accuracy is a past measurement, so it renders with the benchmark it came from, and the lowest-recall class renders as the first limitation."
