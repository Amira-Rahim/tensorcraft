solutionCode: |
  interface PipelineStage<TIn, TOut> {
    name: string;
    process: (input: TIn) => TOut;
    validate: (input: TIn) => boolean;
  }

  class Pipeline {
    private stages: PipelineStage<any, any>[] = [];

    addStage(stage: PipelineStage<any, any>): Pipeline {
      this.stages.push(stage);
      return this;
    }

    run(input: any): any {
      let data = input;
      for (const stage of this.stages) {
        if (!stage.validate(data)) {
          throw new Error(`Validation failed at: ${stage.name}`);
        }
        data = stage.process(data);
      }
      return data;
    }
  }
testCode: |
  const normalizeStage = {
    name: 'normalize',
    validate: (w) => Array.isArray(w) && w.length === 8,
    process: (w) => tf.tidy(() => {
      const t = tf.tensor1d(w);
      const { mean, variance } = tf.moments(t);
      return t.sub(mean).div(variance.sqrt().add(1e-8)).arraySync();
    }),
  };
  const fftStage = {
    name: 'fft-features',
    validate: (w) => Array.isArray(w) && w.length === 8,
    process: (w) => tf.tidy(() => tf.abs(tf.spectral.rfft(tf.tensor1d(w))).arraySync()),
  };
  const tensorStage = {
    name: 'to-model-input',
    validate: (f) => Array.isArray(f) && f.length === 5,
    process: (f) => tf.tensor2d([f]),
  };

  describe('Pipeline', () => {
    it('runs the real DEEP SCAN feature path: window -> normalize -> FFT -> [1,5] tensor', () => {
      const pipeline = new Pipeline()
        .addStage(normalizeStage)
        .addStage(fftStage)
        .addStage(tensorStage);
      const out = pipeline.run([1.0, 1.4, 0.6, 1.0, 1.0, 1.4, 0.6, 1.0]);
      expect(out.shape).toEqual([1, 5]);
    });

    it('stage output actually feeds the next stage (normalize: mean 0, unit spread)', () => {
      const normalized = new Pipeline().addStage(normalizeStage).run([2, 4, 2, 4, 2, 4, 2, 4]);
      const mean = normalized.reduce((s, v) => s + v, 0) / normalized.length;
      expect(mean).toBeCloseTo(0, 4);
      expect(normalized[0]).toBeCloseTo(-1, 3);
    });

    it('enforces the input shape contract at the named stage', () => {
      const pipeline = new Pipeline().addStage(normalizeStage).addStage(fftStage);
      expect(() => pipeline.run([1, 2, 3, 4, 5, 6])).toThrow('Validation failed at: normalize');
    });

    it('catches a mid-pipeline contract break (FFT emits 5 bins, next stage demands 8)', () => {
      const badStage = {
        name: 'expects-raw-window',
        validate: (w) => Array.isArray(w) && w.length === 8,
        process: (w) => w,
      };
      const pipeline = new Pipeline().addStage(fftStage).addStage(badStage);
      expect(() => pipeline.run([1, 0, 1, 0, 1, 0, 1, 0])).toThrow('Validation failed at: expects-raw-window');
    });

    it('supports method chaining', () => {
      const pipeline = new Pipeline();
      expect(pipeline.addStage(normalizeStage)).toBe(pipeline);
    });
  });
