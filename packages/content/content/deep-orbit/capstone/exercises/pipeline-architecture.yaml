lessonSlug: system-architecture
title: "Build a Typed Pipeline"
instructions: |
  Help Demir connect the pipeline. Build the `Pipeline` class shown in the lesson. Each stage has a `name`, a `validate` function, and a `process` function.

  1. `addStage(stage)` appends a stage and returns the pipeline so calls can chain.
  2. `run(input)` is async. Pass the input through the stages in order and return the final result.
  3. Before processing a stage, call its `validate` on the value arriving at that stage. If it returns false, throw an Error with the exact message `Validation failed at: {stage.name}`. Do not call that stage's `process`. The async caller receives a rejected promise.
  4. Await each `process` result before passing it to the next stage. A stage may return a value or a Promise.

  The any-typed stage array does not enforce matching TypeScript types between stages. Each stage's runtime validator must check the data it accepts.

  The checks use an eight-sample example: raw window -> z-normalize -> FFT magnitudes -> model-input tensor. Some stages are async, including stages in the middle and at the end. Normalizing each window removes amplitude information here; this example demonstrates composition, not the production classifier's scaler.
