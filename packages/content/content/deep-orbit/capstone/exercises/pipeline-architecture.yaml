slug: pipeline-architecture
lessonSlug: system-architecture
title: "Build a Typed Pipeline"
instructions: |
  Build the Pipeline class the lesson prints. Each stage has a `name`, a `process` function and a `validate` function.

  1. `addStage(stage)` appends the stage and returns the pipeline, so calls chain.
  2. `run(input)` is async and returns a Promise, because a real stage does async work: loading weights, reading a tensor back off the GPU.
  3. Validate the data arriving at each stage before that stage sees it. When validate returns false, throw an Error whose message is `Validation failed at: {stage.name}`. Since run is async, the caller receives that as a rejected promise.
  4. A stage's process may hand back a value or a Promise, so await what it returns before the next stage sees it.
  5. run hands back whatever the last stage returned.

  The grader wires DEEP SCAN's real feature path through your class: raw window -> z-normalize -> FFT magnitudes -> model-input tensor, with a shape contract between every stage. Async stages appear in the middle of a chain and at the end of one.
