solutionCode: |
  class ModelMonitor {
    private confidences: number[] = [];
    private latencies: number[] = [];
    private baselineMean: number[];

    constructor(baselineMean: number[]) {
      if (baselineMean.length === 0 || !baselineMean.every(Number.isFinite))
        throw new Error('Invalid baseline');
      this.baselineMean = baselineMean.slice();
    }

    logPrediction(confidence: number): void {
      if (!Number.isFinite(confidence) || confidence < 0 || confidence > 1)
        throw new Error('Invalid confidence');
      this.confidences.push(confidence);
    }

    get avgConfidence(): number | null {
      if (this.confidences.length === 0) return null;
      return this.confidences.reduce((a, b) => a + b, 0) / this.confidences.length;
    }

    logLatency(ms: number): void {
      if (!Number.isFinite(ms) || ms < 0) throw new Error('Invalid latency');
      this.latencies.push(ms);
    }

    getLatencyPercentile(p: number): number | null {
      if (!Number.isFinite(p) || p < 0 || p > 100) throw new Error('Invalid percentile');
      if (this.latencies.length === 0) return null;
      const sorted = [...this.latencies].sort((a, b) => a - b);
      const index = Math.min(sorted.length - 1, Math.floor((sorted.length * p) / 100));
      return sorted[index];
    }

    computeDrift(recentInputs: number[][]): number | null {
      if (recentInputs.length === 0) return null;
      const featureCount = this.baselineMean.length;
      if (!recentInputs.every((row) => row.length === featureCount && row.every(Number.isFinite)))
        throw new Error('Invalid feature row');
      const recentMean = new Array(featureCount).fill(0);

      for (const row of recentInputs) {
        for (let i = 0; i < featureCount; i++) {
          recentMean[i] += row[i] / recentInputs.length;
        }
      }

      let sumSqDiff = 0;
      for (let i = 0; i < featureCount; i++) {
        sumSqDiff += (this.baselineMean[i] - recentMean[i]) ** 2;
      }
      return Math.sqrt(sumSqDiff);
    }
  }
testCode: |
  describe('ModelMonitor', () => {
    it('tracks average confidence', () => {
      const monitor = new ModelMonitor([0, 0]);
      monitor.logPrediction(0.9);
      monitor.logPrediction(0.8);
      monitor.logPrediction(0.7);
      expect(
        monitor.avgConfidence,
        'avgConfidence is the mean of every confidence logged so far. The starter returns null, which is not a measurement a dashboard can plot.',
      ).toBeCloseTo(0.8, 5);
    });

    it('average confidence is the mean, which one weak prediction pulls down', () => {
      const monitor = new ModelMonitor([0, 0]);
      monitor.logPrediction(0.9);
      monitor.logPrediction(0.9);
      monitor.logPrediction(0.3);
      // The middle value here is 0.9. A monitor reporting 0.9 says the
      // model is confident while a third of its verdicts are not, and
      // confidence decay is exactly the shape of failure this dashboard
      // exists to catch.
      expect(
        monitor.avgConfidence,
        'Every logged prediction moves the average by its share. The middle value ignores two of the three.',
      ).toBeCloseTo(0.7, 5);
    });

    it('has no average before predictions arrive, then measures a real zero', () => {
      const m = new ModelMonitor([0]);
      expect(m.avgConfidence).toBe(null);
      m.logPrediction(0);
      expect(m.avgConfidence).toBe(0);
    });

    it('divides by the count so far, so the average moves with every prediction', () => {
      // Five verdicts over one shift, confidence decaying while the input
      // window drifts. Both parts of the average move as each one lands: the
      // total and the number of predictions it is divided by. A fixed
      // divisor drifts away from any mean once the count passes it. A
      // trailing window over the last few would move faster than this
      // cumulative mean (the last three here average 0.533 against 0.68 over
      // all five); the contract asks for every prediction so far, and the
      // lesson keeps the trailing window for latency.
      const monitor = new ModelMonitor([0, 0]);
      const scores = [0.92, 0.88, 0.61, 0.55, 0.44];
      let sum = 0;
      scores.forEach((score, i) => {
        monitor.logPrediction(score);
        sum += score;
        expect(
          monitor.avgConfidence,
          'The average is the total of every prediction logged so far over how many there have been, and both of those change with each call. After the first prediction the average is that prediction.',
        ).toBeCloseTo(sum / (i + 1), 5);
      });
    });

    it('detects no drift when data matches baseline', () => {
      const monitor = new ModelMonitor([1.0, 2.0]);
      const drift = monitor.computeDrift([
        [1.0, 2.0],
        [1.0, 2.0],
      ]);
      expect(
        typeof drift,
        'computeDrift returns a number: the distance between the baseline mean vector and the recent one. The starter returns null.',
      ).toBe('number');
      expect(drift).toBeCloseTo(0, 5);
    });

    it('distinguishes no window from a measured mean distance', () => {
      const m = new ModelMonitor([0, 0]);
      expect(m.computeDrift([])).toBe(null);
      expect(m.computeDrift([[0, 0]])).toBe(0);
      expect(m.computeDrift([[3, 4]])).toBe(5);
    });

    it('detects drift when data shifts', () => {
      const monitor = new ModelMonitor([0, 0]);
      const drift = monitor.computeDrift([
        [3, 4],
        [3, 4],
      ]);
      expect(Number.isFinite(drift)).toBe(true);
      expect(
        drift,
        'Both rows sit at [3, 4], so the recent mean is [3, 4] and the distance from [0, 0] is the 3-4-5 triangle.',
      ).toBeCloseTo(5, 5);
    });

    it('computes drift by straight-line distance from the baseline', () => {
      const monitor = new ModelMonitor([0, 0, 0]);
      const drift = monitor.computeDrift([[1, 0, 0]]);
      expect(drift).toBeCloseTo(1, 5);
    });

    it('drift is the distance between the means, so a window that only wobbles scores zero', () => {
      const monitor = new ModelMonitor([0, 0]);
      // Two rows a unit either side of the baseline. The column means are
      // back on the baseline, so the level has not moved and the score is
      // zero. Measuring each row against the baseline and averaging those
      // distances reports 1.0 instead, and a detector that fires on a
      // window which merely wobbles pages someone every night. The
      // lesson makes the same point from the other side: a mean vector
      // reads a shift in level and nothing else, so two windows with the
      // same means score 0.0 whatever their spread.
      const drift = monitor.computeDrift([
        [1, 0],
        [-1, 0],
      ]);
      expect(
        typeof drift,
        'computeDrift returns a number. The starter returns null, which is not a drift score.',
      ).toBe('number');
      expect(
        drift,
        'Collapse the window to its column means first, then measure the distance once. Deviations that cancel in a mean cannot cancel once each row has been turned into a distance.',
      ).toBeCloseTo(0, 6);
    });

    it('averages the window first: the rows differ, so the column means matter', () => {
      const monitor = new ModelMonitor([0, 0]);
      // Column means are 1 and 2. Distance from the baseline is sqrt(5).
      // Reading row 0 alone would score 0 and report no drift at all.
      const drift = monitor.computeDrift([
        [0, 0],
        [2, 4],
      ]);
      expect(drift).toBeCloseTo(Math.sqrt(5), 5);
    });

    it('reports the tail, not the average: P50 is 90 here and the mean is 102.65', () => {
      // 100 inference times off the wasm seat: 95 of them climbing from
      // 40 ms to 134 ms, and five calls at 400. The mean is 102.65 and
      // reports a system that is mostly fine. The P95 is 400, which is
      // what the operator on watch actually sat through.
      const monitor = new ModelMonitor([0, 0]);
      for (let i = 0; i < 95; i++) monitor.logLatency(40 + i);
      for (let i = 0; i < 5; i++) monitor.logLatency(400);
      expect(
        monitor.getLatencyPercentile(50),
        'Index 50 of the 100 sorted times. A monitor reporting the mean says 102.65 here and a monitor reporting the middle says 90; only one of them is the P50.',
      ).toBe(90);
      expect(
        monitor.getLatencyPercentile(95),
        'Five calls in a hundred ran at 400 ms. That is exactly what a P95 exists to surface and what the CI benchmark gate reads.',
      ).toBe(400);
      expect(monitor.getLatencyPercentile(99)).toBe(400);
      expect(monitor.getLatencyPercentile(0)).toBe(40);
    });

    it('sorts the times as numbers: a string sort puts 100 before 9', () => {
      // Array.prototype.sort with no comparator compares strings, and
      // ["100", "10", "9"] orders as 10, 100, 9. The middle of that is
      // 100, which is the slowest call in the set reported as typical.
      const monitor = new ModelMonitor([0, 0]);
      for (const ms of [100, 9, 10]) monitor.logLatency(ms);
      expect(
        monitor.getLatencyPercentile(50),
        'Three times sorted numerically are 9, 10, 100, and index 1 of that is 10. A string sort answers 100 here.',
      ).toBe(10);
      expect(monitor.getLatencyPercentile(0)).toBe(9);
      expect(monitor.getLatencyPercentile(100)).toBe(100);
    });

    it('p = 100 is the slowest call recorded, not a read past the end', () => {
      const monitor = new ModelMonitor([0, 0]);
      for (const ms of [12, 48, 31, 7]) monitor.logLatency(ms);
      expect(
        monitor.getLatencyPercentile(100),
        'count * 100 / 100 is the count itself, which is one index past the last element. Clamp it.',
      ).toBe(48);
      expect(monitor.getLatencyPercentile(50)).toBe(31);
      expect(monitor.getLatencyPercentile(25)).toBe(12);
    });

    it('has no percentile before any inference is timed', () => {
      const m = new ModelMonitor([0]);
      expect(m.getLatencyPercentile(95)).toBe(null);
      m.logLatency(0);
      expect(m.getLatencyPercentile(95)).toBe(0);
    });

    it('one loud reading moves the mean by its share, not the whole way', () => {
      const monitor = new ModelMonitor([0.5, 0.5, 0.5]);
      const window = [
        [0.8, 0.8, 0.8],
        [0.5, 0.5, 0.5],
        [0.5, 0.5, 0.5],
      ];
      // Column means are 0.6, so each feature sits 0.1 off baseline and
      // the distance is sqrt(3 * 0.01). Scoring the loud row on its own
      // would treble that.
      const drift = monitor.computeDrift(window);
      expect(drift).toBeCloseTo(Math.sqrt(0.03), 5);

      // A mean does not care about row order.
      const reordered = monitor.computeDrift([window[1], window[2], window[0]]);
      expect(reordered).toBeCloseTo(drift, 10);
    });
  });

  it('rejects invalid measurements without recording them', () => {
    const m = new ModelMonitor([0, 0]);
    for (const v of [-1, 1.1, NaN, Infinity]) expect(() => m.logPrediction(v)).toThrow();
    for (const v of [-1, NaN, Infinity]) expect(() => m.logLatency(v)).toThrow();
    for (const p of [-1, 101, NaN]) expect(() => m.getLatencyPercentile(p)).toThrow();
    expect(() => m.computeDrift([[1]])).toThrow();
    expect(() => m.computeDrift([[1, NaN]])).toThrow();
    expect(m.avgConfidence).toBe(null);
    expect(m.getLatencyPercentile(50)).toBe(null);
    expect(() => new ModelMonitor([])).toThrow();
    const baseline = [0, 0];
    const copied = new ModelMonitor(baseline);
    baseline[0] = 99;
    expect(copied.computeDrift([[0, 0]])).toBe(0);
  });
