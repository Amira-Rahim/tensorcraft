slug: model-monitor
lessonSlug: monitoring
title: "Build a Model Monitor"
instructions: |
  Help Demir track changes after deployment. Build `ModelMonitor` with a baseline mean vector. Keep its feature order and scale the same as recent inputs.

  1. `logPrediction(confidence)` records a finite model score in [0, 1]. `avgConfidence` returns the arithmetic mean, or null when no score has been logged. These scores are not proven calibrated probabilities.
  2. `logLatency(ms)` records a finite, nonnegative duration. `getLatencyPercentile(p)` sorts a copy numerically and returns the value at index `max(0, ceil(count * p / 100) - 1)`. This is the nearest-rank rule; P0 returns the minimum. Require a finite `p` in [0, 100]. Return null when there are no durations.
  3. `computeDrift(recentInputs)` finds each column's recent mean, then returns the Euclidean distance to `baselineMean`. Return null for an empty window. A zero distance only means the means match; the spread or distribution shape could still have changed.

  Reject invalid scores, durations, percentiles, or input rows. The baseline must be a non-empty vector of finite numbers. Each recent row must have that same width and finite values. Do not change caller arrays.

  Null means no measurement. Display it as "No data", not a healthy zero. This short exercise keeps its logs; a production monitor needs a limit on how much history it retains.
