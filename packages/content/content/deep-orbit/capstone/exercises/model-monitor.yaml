title: "Build a Model Monitor"
instructions: |
  **Contract revision 2026-09-17b:** Empty-data results are now null.

  Build ModelMonitor with a baseline mean vector in the same feature order and scale as recent inputs.

  1. logPrediction(confidence) records a finite probability in [0, 1]. avgConfidence returns its arithmetic mean, or null before any prediction is logged.
  2. logLatency(ms) records a finite nonnegative duration. getLatencyPercentile(p) sorts a copy numerically and returns index floor(count * p / 100), clamped to the last index. p must be finite and between 0 and 100 inclusive. Return null when no duration is recorded.
  3. computeDrift(recentInputs) returns the Euclidean distance between the recent column means and baselineMean. Return null for an empty window. A zero distance means matching means only; a change in spread or shape can still exist.

  Reject invalid probabilities, durations, percentiles or input rows. The baseline must be a non-empty finite vector. Every recent row must have the same width and finite values. Do not mutate caller arrays. Null means no measurement; it must not appear as a healthy zero on a dashboard. The exercise retains logs for its short session; a production monitor needs a bounded retention window.
