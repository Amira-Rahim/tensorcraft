lessonSlug: monitoring
title: "Build a Model Monitor"
instructions: |
  Build the model monitor the dashboard reads from. Three measurements.

  1. Confidence. `logPrediction(confidence)` records one verdict, and `avgConfidence` is the mean over every prediction logged so far, 0 before anything has been logged.
  2. Latency percentiles. Record each inference time with `logLatency(ms)`, then `getLatencyPercentile(p)` reads one value off the recorded times. Order a copy of them ascending as numbers first, since the default comparison is textual and puts 400 ahead of 41. The value is the one at index `Math.floor(count * p / 100)`, clamped to the last index so p = 100 lands on the slowest call rather than past the end. With nothing recorded it returns 0.
  3. Drift. `computeDrift(recentInputs)` collapses the recent window to its column means first, then returns the Euclidean distance from the baseline mean vector. An empty window returns 0. No traffic is not drift, and a window that never averaged anything sits at the origin. The distance from the baseline to the origin is the length of the baseline vector itself, 1.02 on the five-feature baseline the grader uses, which is twice the 0.5 alert threshold. A quiet hour would page someone.
