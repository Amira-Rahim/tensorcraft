slug: classify-anomaly
lessonSlug: launch
title: "Zero Hour: Classify the Anomaly"
mlContent: systems
instructions: |
  Help the bridge crew apply the final decision rule. Use the supplied fictional scores; this exercise does not run the trained detectors or establish the signal's source. Sample 7741 has a zero-hour ensemble score of 0.999, compared with the module-3 score of 0.518. These came from different systems, so their difference is not an accuracy gain.

  Write three functions:

  1. `decomposeIntervals(intervals)` returns `ratios[i] = intervals[i + 1] / intervals[i]`. Seven gaps give six ratios. Scaling all gaps by the same factor leaves the ratios unchanged, which is why the calibration overlay matched.
  2. `isFibonacciTrain(ratios)` checks the template `[1, 2, 1.5, 1.667, 1.6, 1.625]`. Each ratio must be within 2% of its expected value, with 1e-12 arithmetic slack at the boundary. Align shorter lists to the end of the template, since the opening 1:1 gap may be missing. Return false for an empty list or one longer than the template. A doubling pattern does not match.
  3. `classifyAnomaly(reading)` applies the three detector rules below and uses a two-out-of-three majority.

  Count each detector's vote separately:

  - Statistical: `|z| > 3`, comparing `reading.actual` with the mean and standard deviation of `reading.window`. This window is the supplied reference baseline. Do not replace it with a moving window.
  - Autoencoder: `reconstructionError > reconThreshold`.
  - LSTM: `|predicted - actualForecast| > predTolerance`.

  For sample 7741, the statistical check gives no vote: its amplitude is normal. The other two votes carry the decision.

  Return:

      {
        votes: number,           // number of detector thresholds crossed
        isAnomaly: boolean,      // true for two or more votes
        ratios: number[],        // decomposeIntervals(reading.intervals)
        fibonacciTrain: boolean, // isFibonacciTrain(ratios)
        classification: string,  // 'confirmed-anomaly', 'anomaly', or 'noise'
        scoreDelta: number,      // ensembleScore - module3Score, rounded to 3 decimals
      }

  Use 'confirmed-anomaly' when the vote passes and the ratio pattern matches. Use 'anomaly' when the vote passes without a match, and 'noise' when the vote fails.

  Reject invalid inputs. Intervals must be finite and positive, and their ratios must not overflow or underflow. Detector values must be finite, error thresholds nonnegative, and both model scores in [0, 1]. The reference window must be non-empty and contain only finite readings; `actual` must also be finite.

  Check whether the original window is constant before converting it to float32. For a constant window, an exactly matching `actual` gives no statistical vote; any difference gives a vote. Reject a nonconstant window whose variance becomes zero in float32. An undefined z-score is not a measured zero. This exact-match policy is for the exercise; deployment needs a measurement tolerance.

  The pattern check assumes recordings end at the final gap, 13. Aligning from the end does not work for arbitrary recordings, and a short match is weak evidence. The 2% band is relative to each expected value, so an expected 2 allows twice the difference of an expected 1. The mission label 'confirmed-anomaly' combines the vote and this pattern check. It does not establish the signal's origin.
