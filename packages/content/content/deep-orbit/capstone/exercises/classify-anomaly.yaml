slug: classify-anomaly
lessonSlug: launch
title: "Zero Hour: Classify the Anomaly"
mlContent: systems
instructions: |
  Apply the final decision rule to supplied fictional scores. This exercise
  does not run the trained detectors or prove the signal has a particular source. Sample 7741's zero-hour readout is on the console: the deployed ensemble scores it 0.999 where the module-3 classifier managed 0.518. Your job is the decision layer the bridge crew signs their names to. Three functions.

  1. `decomposeIntervals(intervals)` returns the successive ratios of the pulse sub-intervals, `ratios[i] = intervals[i + 1] / intervals[i]`. Dividing removes the scale, so the same train measured in seconds and counted abstractly decomposes to the same ratios. That property is the whole reason the calibration overlay worked.
  2. `isFibonacciTrain(ratios)` is true when every ratio sits within 2% of its own expected value in the Fibonacci-succession ratios [1, 2, 1.5, 1.667, 1.6, 1.625]. The band is a share of the expected value rather than a fixed width, so the slot expecting 2 admits twice the miss the slot expecting 1 does. Align from the tail, because a train may omit the 1:1 opener. A ratio list longer than that succession has nothing to align against, so it is not a Fibonacci train.
  3. `classifyAnomaly(reading)` runs the three-detector vote exactly as module 7 built it and takes the 2-of-3 majority.

  The three rules follow module 7. Here reading.window is an explicitly supplied
  reference slice; do not silently replace a fixed baseline with a moving window. The statistical one fires on `|z| > 3`, where z reads `reading.actual` against the mean and the standard deviation of `reading.window`. The autoencoder fires on `reconstructionError > reconThreshold`. The lstm fires on `|predicted - actualForecast| > predTolerance`. Module 7's canon holds on sample 7741: the amplitude dial reads normal, so the statistical gate clears and two votes carry the verdict.

  classifyAnomaly returns:

      {
        votes: number,           // how many of the three fired
        isAnomaly: boolean,      // true at two or more
        ratios: number[],        // decomposeIntervals(reading.intervals)
        fibonacciTrain: boolean, // isFibonacciTrain(ratios)
        classification: string,  // 'confirmed-anomaly', 'anomaly' or 'noise'
        scoreDelta: number,      // ensembleScore - module3Score
      }

  `classification` reads 'confirmed-anomaly' when the vote passes and the interval train is Fibonacci, 'anomaly' when the vote passes without the train, and 'noise' when the vote does not pass.

  The template assumes the recording ends at the final gap (13). Tail
  alignment is not valid for arbitrary recordings, and a short match is weak
  evidence. scoreDelta is rounded to three decimals; it is not accuracy gain.

  `ratios` holds the decomposition and not the pulse gaps that came in, so seven intervals leave six numbers, and a capture in seconds leaves the same six as the abstract count. `fibonacciTrain` is those ratios run through `isFibonacciTrain`. Gaps that double every step grow, and a doubling train is not a Fibonacci train.

  Every interval must be finite and positive; reject invalid intervals. All
  detector values must be finite, error thresholds nonnegative, and both
  reported model scores in [0, 1]. Reject invalid values before voting.

  An empty ratio list is insufficient evidence and returns false. The label confirmed-anomaly is a mission rule combining the vote and this pattern check; it does not establish the signal's origin.

  The window must be non-empty and contain finite readings; actual must be finite. Reject invalid inputs. Compare against the original window values to identify a constant window before float32 conversion. At zero spread, equality with that constant gives no statistical vote; any difference gives a vote. This exact-reading policy is for the exercise; deployment needs a measurement tolerance. An undefined z-score is not a measured zero.
