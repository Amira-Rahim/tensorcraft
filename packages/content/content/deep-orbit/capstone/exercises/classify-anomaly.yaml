  // Tonight's reading, as the bridge sees it.
  const zeroHourReading = {
    // Twenty normalized amplitudes from the archive's calm slice. Their
    // spread is the one lesson 1 measured over eleven days: tf.moments
    // returns mean 0.520 and std 0.150 on this window.
    window: [
      0.523, 0.607, 0.407, 0.703, 0.462, 0.548, 0.338, 0.823, 0.568, 0.43,
      0.633, 0.217, 0.538, 0.66, 0.38, 0.588, 0.492, 0.745, 0.443, 0.295,
    ],
    actual: 0.61,             // 0.6 sigma off the mean: the dial reads normal
    reconstructionError: 0.062,
    reconThreshold: 0.01,     // module 7's locked cutoff
    predicted: 0.55,
    actualForecast: 0.61,
    predTolerance: 0.02,
    intervals: [0.9, 0.9, 1.8, 2.7, 4.5, 7.2, 11.7],
    ensembleScore: 0.999,
    module3Score: 0.518,
  };
solutionCode: |
  function decomposeIntervals(intervals) {
    const ratios = [];
    for (let i = 0; i < intervals.length - 1; i++) {
      ratios.push(intervals[i + 1] / intervals[i]);
    }
    return ratios;
  }

  function isFibonacciTrain(ratios) {
    const fibonacciRatios = [1, 2, 1.5, 5 / 3, 1.6, 1.625];
    // The reading's first ratio may be the 1:1 opener or start at the 2;
    // align on length from the tail, where the train converges on phi.
    const expected = fibonacciRatios.slice(
      fibonacciRatios.length - ratios.length,
    );
    if (expected.length !== ratios.length) return false;
    return ratios.every(
      (r, i) => Math.abs(r - expected[i]) / expected[i] <= 0.02,
    );
  }

  function classifyAnomaly(reading) {
    const { mean, variance } = tf.tidy(() => {
      const m = tf.moments(tf.tensor1d(reading.window));
      return {
        mean: m.mean.dataSync()[0],
        variance: m.variance.dataSync()[0],
      };
    });
    const std = Math.sqrt(variance);
    const z = std === 0 ? 0 : (reading.actual - mean) / std;

    const verdicts = {
      statistical: Math.abs(z) > 3,
      autoencoder: reading.reconstructionError > reading.reconThreshold,
      lstm:
        Math.abs(reading.predicted - reading.actualForecast) >
        reading.predTolerance,
    };
    const votes = Object.values(verdicts).filter(Boolean).length;
    const isAnomaly = votes >= 2;

    const ratios = decomposeIntervals(reading.intervals);
    const fibonacciTrain = isFibonacciTrain(ratios);

    return {
      votes,
      isAnomaly,
      ratios,
      fibonacciTrain,
      classification:
        isAnomaly && fibonacciTrain
          ? "confirmed-anomaly"
          : isAnomaly
            ? "anomaly"
            : "noise",
      scoreDelta:
        Math.round((reading.ensembleScore - reading.module3Score) * 1000) /
        1000,
    };
  }

  const zeroHourReading = {
    // Twenty normalized amplitudes from the archive's calm slice. Their
    // spread is the one lesson 1 measured over eleven days: tf.moments
    // returns mean 0.520 and std 0.150 on this window.
    window: [
      0.523, 0.607, 0.407, 0.703, 0.462, 0.548, 0.338, 0.823, 0.568, 0.43,
      0.633, 0.217, 0.538, 0.66, 0.38, 0.588, 0.492, 0.745, 0.443, 0.295,
    ],
    actual: 0.61,             // 0.6 sigma off the mean: the dial reads normal
    reconstructionError: 0.062,
    reconThreshold: 0.01,     // module 7's locked cutoff
    predicted: 0.55,
    actualForecast: 0.61,
    predTolerance: 0.02,
    intervals: [0.9, 0.9, 1.8, 2.7, 4.5, 7.2, 11.7],
    ensembleScore: 0.999,
    module3Score: 0.518,
  };
testCode: |
  describe('Zero Hour', () => {
    const result = classifyAnomaly(zeroHourReading);

    it('decomposes the interval train into successive ratios', () => {
      const ratios = decomposeIntervals([1, 1, 2, 3, 5, 8, 13]);
      expect(ratios.length).toBe(6);
      expect(ratios[0]).toBeCloseTo(1, 4);
      expect(ratios[1]).toBeCloseTo(2, 4);
      expect(ratios[2]).toBeCloseTo(1.5, 4);
      expect(ratios[5]).toBeCloseTo(1.625, 4);
    });

    it('the decomposition is scale-invariant (ratios care about proportion, not units)', () => {
      const seconds = decomposeIntervals([0.9, 0.9, 1.8, 2.7, 4.5, 7.2, 11.7]);
      const abstract = decomposeIntervals([1, 1, 2, 3, 5, 8, 13]);
      for (let i = 0; i < abstract.length; i++) {
        expect(seconds[i]).toBeCloseTo(abstract[i], 4);
      }
    });

    it('recognizes the Fibonacci train and rejects a metronome', () => {
      expect(isFibonacciTrain(decomposeIntervals([1, 1, 2, 3, 5, 8, 13]))).toBe(true);
      expect(isFibonacciTrain(decomposeIntervals([1, 1, 1, 1, 1, 1, 1]))).toBe(false);
    });

    it('aligns from the tail, rejects a wrong-length train, and holds the 2% tolerance', () => {
      // A train that omits the 1:1 opener: 5 ratios against the last 5 expected.
      expect(isFibonacciTrain(decomposeIntervals([1, 2, 3, 5, 8, 13]))).toBe(true);
      // More ratios than the succession list has slots: no alignment exists.
      expect(isFibonacciTrain([1, 2, 1.5, 5 / 3, 1.6, 1.625, 1.615])).toBe(false);
      // 1.71 against the 5/3 slot is 2.6% off, just outside tolerance.
      expect(isFibonacciTrain([1, 2, 1.5, 1.71, 1.6, 1.625])).toBe(false);
    });

    it('the z-score gate clears sample 7741, and two votes carry it', () => {
      // Module 7's reading of this sample, unchanged: every dial normal.
      // 0.61 against the window's measured mean 0.520 and std 0.150 is
      // 0.6 sigma, so the statistical detector abstains and the
      // autoencoder and the LSTM decide it between them.
      expect(result.votes).toBe(2);
      expect(result.isAnomaly).toBe(true);

      // Silence those two and nothing is left. The statistical verdict is
      // measured false here, not assumed true.
      const dialsOnly = classifyAnomaly({
        ...zeroHourReading,
        reconstructionError: 0.001,
        predicted: 0.61,
      });
      expect(dialsOnly.votes).toBe(0);
      expect(dialsOnly.isAnomaly).toBe(false);
      expect(dialsOnly.classification).toBe('noise');
    });

    it('a full-scale amplitude does fire it: 1.00 is 3.2 sigma off this spread', () => {
      // The live-feed reading module 7 caught: amplitude pegged at the
      // hull sensor's 1.00 ceiling. Against mean 0.520 and std 0.150 that
      // is 3.2 sigma, the loudest this feature can ever read.
      const pegged = classifyAnomaly({ ...zeroHourReading, actual: 1.0 });
      expect(pegged.votes).toBe(3);
      expect(pegged.isAnomaly).toBe(true);

      const peggedAlone = classifyAnomaly({
        ...zeroHourReading,
        actual: 1.0,
        reconstructionError: 0.001,
        predicted: 0.61,
      });
      expect(peggedAlone.votes).toBe(1);
      expect(peggedAlone.isAnomaly).toBe(false);
    });

    it('the gate reads |z|, so a dead channel at 0.00 trips it too', () => {
      // 3.47 sigma below the mean. A gate written `z > 3` misses this.
      const dead = classifyAnomaly({
        ...zeroHourReading,
        actual: 0.0,
        reconstructionError: 0.001,
        predicted: 0.61,
      });
      expect(dead.votes).toBe(1);

      const deadPlusRecon = classifyAnomaly({
        ...zeroHourReading,
        actual: 0.0,
        predicted: 0.61,
      });
      expect(deadPlusRecon.votes).toBe(2);
      expect(deadPlusRecon.isAnomaly).toBe(true);
    });

    it('majority vote is 2-of-3, not unanimity', () => {
      // Drop one of the two that fired and the alarm goes quiet.
      const oneVote = classifyAnomaly({
        ...zeroHourReading,
        reconstructionError: 0.001,
      });
      expect(oneVote.votes).toBe(1);
      expect(oneVote.isAnomaly).toBe(false);
      expect(oneVote.classification).toBe('noise');

      // Any two are enough, including a pair the autoencoder sits out.
      const statPlusLstm = classifyAnomaly({
        ...zeroHourReading,
        actual: 1.0,
        reconstructionError: 0.001,
      });
      expect(statPlusLstm.votes).toBe(2);
      expect(statPlusLstm.isAnomaly).toBe(true);
    });

    it('a calm night with a Fibonacci train is still noise: the vote gates it', () => {
      // A different reading entirely, on its own numbers.
      const calmNight = {
        window: [
          0.474, 0.556, 0.512, 0.398, 0.601, 0.489, 0.533, 0.462, 0.578, 0.507,
        ],
        actual: 0.55,
        reconstructionError: 0.003,
        reconThreshold: 0.01,
        predicted: 0.542,
        actualForecast: 0.55,
        predTolerance: 0.02,
        intervals: [2, 2, 4, 6, 10, 16, 26],
        ensembleScore: 0.114,
        module3Score: 0.093,
      };
      const calm = classifyAnomaly(calmNight);
      expect(calm.votes).toBe(0);
      expect(calm.isAnomaly).toBe(false);
      expect(calm.fibonacciTrain).toBe(true);
      expect(calm.classification).toBe('noise');
      expect(calm.scoreDelta).toBeCloseTo(0.021, 3);
    });

    it('settles the season: confirmed anomaly, and the 51.8 -> 99.9 delta', () => {
      expect(result.classification).toBe('confirmed-anomaly');
      expect(result.fibonacciTrain).toBe(true);
      expect(result.scoreDelta).toBeCloseTo(0.481, 3);
    });

    it('an anomalous vote without the Fibonacci train stays "anomaly", not confirmed', () => {
      const uniform = classifyAnomaly({
        ...zeroHourReading,
        intervals: [1, 1, 1, 1, 1, 1, 1],
      });
      expect(uniform.isAnomaly).toBe(true);
      expect(uniform.classification).toBe('anomaly');
    });
  });
