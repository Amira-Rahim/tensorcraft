title: "Zero Hour: Classify the Anomaly"
mlContent: systems
instructions: "The season's final inference, run by you. Sample 7741's zero-hour readout is on the console: the deployed ensemble scores it 0.999 where the module-3 classifier managed 0.518. Your job is the decision layer the bridge crew signs their names to. Implement decomposeIntervals(intervals): successive ratios of the pulse sub-intervals (ratios[i] = intervals[i+1] / intervals[i]). Implement isFibonacciTrain(ratios): true when every ratio matches the Fibonacci-succession ratios (2, 1.5, 1.667, 1.6, 1.625, converging on the golden ratio) within 2%. Then classifyAnomaly(reading): run the three-detector vote exactly as module 7 built it (statistical fires on |z| > 3 computed from reading.window vs reading.actual, autoencoder fires on reconstructionError > reconThreshold, lstm fires on |predicted - actual| > predTolerance) and take the 2-of-3 majority. Return { votes, isAnomaly, ratios, fibonacciTrain, classification, scoreDelta }: classification is 'confirmed-anomaly' only when the vote passes AND the interval train is Fibonacci, and scoreDelta = ensembleScore - module3Score. The decomposition must be scale-invariant: the ratios care about proportion, not units. That property is the whole reason the calibration overlay worked."
starterCode: |
  // Zero hour. The readout for sample 7741, tonight:
  //
  //   deployed ensemble score : 0.999
  //   module-3 classifier     : 0.518  (the score that started everything)
  //   pulse sub-intervals (s) : proportional to 1, 1, 2, 3, 5, 8, 13
  //
  // Recipe, exactly as the modules taught it:
  //  1. decomposeIntervals: ratios[i] = intervals[i+1] / intervals[i]
  //  2. isFibonacciTrain: the full succession ratio list is
  //     [1, 2, 1.5, 1.6667, 1.6, 1.625] (a 1:1 opener, then converging on
  //     the golden ratio). A train may or may not include the opener, so
  //     align on length FROM THE TAIL: expected = the last ratios.length
  //     entries of the full list (return false if lengths still differ),
  //     then require every ratio within 2% relative error of its expected
  //     value: Math.abs(r - expected[i]) / expected[i] <= 0.02.
  //  3. classifyAnomaly: module 7's three-detector vote.
  //     statistical: mean/std of reading.window via tf.moments (inside
  //     tf.tidy; std = sqrt(variance)); z = (reading.actual - mean) / std,
  //     with z = 0 when std is 0; fires on Math.abs(z) > 3.
  //     autoencoder: fires on reading.reconstructionError >
  //     reading.reconThreshold.
  //     lstm: fires on Math.abs(reading.predicted - reading.actualForecast)
  //     > reading.predTolerance.
  //     votes = how many fired; isAnomaly = votes >= 2 (majority, not
  //     unanimity). ratios = decomposeIntervals(reading.intervals);
  //     fibonacciTrain = isFibonacciTrain(ratios). classification =
  //     'confirmed-anomaly' only when isAnomaly AND fibonacciTrain, else
  //     'anomaly' when isAnomaly, else 'noise'. scoreDelta =
  //     reading.ensembleScore - reading.module3Score.
  //     Return { votes, isAnomaly, ratios, fibonacciTrain, classification,
  //     scoreDelta }.

