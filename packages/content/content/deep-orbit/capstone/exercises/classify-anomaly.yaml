solutionCode: |
  function decomposeIntervals(intervals) {
    if (!intervals.every(v => Number.isFinite(v) && v > 0)) throw new Error('Invalid intervals');
    const ratios = [];
    for (let i = 0; i < intervals.length - 1; i++) {
      const ratio = intervals[i + 1] / intervals[i];
      if (!Number.isFinite(ratio) || ratio <= 0) throw new Error('Unrepresentable ratio');
      ratios.push(ratio);
    }
    return ratios;
  }

  function isFibonacciTrain(ratios) {
    if (ratios.length === 0) return false;
    const fibonacciRatios = [1, 2, 1.5, 5 / 3, 1.6, 1.625];
    // The reading's first ratio may be the 1:1 opener or start at the 2;
    // align on length from the tail, where the train converges on phi.
    const expected = fibonacciRatios.slice(fibonacciRatios.length - ratios.length);
    if (expected.length !== ratios.length) return false;
    return ratios.every((r, i) => Number.isFinite(r) && Math.abs(r - expected[i]) / expected[i] <= 0.02 + 1e-12);
  }

  function classifyAnomaly(reading) {
    if (
      !Array.isArray(reading.window) ||
      reading.window.length === 0 ||
      !reading.window.every(Number.isFinite) ||
      !Number.isFinite(reading.actual)
    )
      throw new Error('Invalid window or reading');
    if (![reading.reconstructionError, reading.reconThreshold, reading.predicted, reading.actualForecast, reading.predTolerance, reading.ensembleScore, reading.module3Score].every(Number.isFinite) || reading.reconstructionError < 0 || reading.reconThreshold < 0 || reading.predTolerance < 0 || reading.ensembleScore < 0 || reading.ensembleScore > 1 || reading.module3Score < 0 || reading.module3Score > 1) throw new Error('Invalid detector values');
    const constant = reading.window.every((value) => value === reading.window[0]);
    const { mean, variance } = tf.tidy(() => {
      const m = tf.moments(tf.tensor1d(reading.window));
      return {
        mean: m.mean.dataSync()[0],
        variance: m.variance.dataSync()[0],
      };
    });
    if (!Number.isFinite(mean) || !Number.isFinite(variance) || (!constant && variance === 0)) throw new Error('Invalid moments or collapsed spread');
    const std = Math.sqrt(variance);
    const z = constant ? null : (reading.actual - mean) / std;

    const verdicts = {
      statistical: z === null ? reading.actual !== reading.window[0] : Math.abs(z) > 3,
      autoencoder: reading.reconstructionError > reading.reconThreshold,
      lstm: Math.abs(reading.predicted - reading.actualForecast) > reading.predTolerance,
    };
    const votes = Object.values(verdicts).filter(Boolean).length;
    const isAnomaly = votes >= 2;

    const ratios = decomposeIntervals(reading.intervals);
    const fibonacciTrain = isFibonacciTrain(ratios);

    return {
      votes,
      isAnomaly,
      ratios,
      fibonacciTrain,
      classification:
        isAnomaly && fibonacciTrain ? 'confirmed-anomaly' : isAnomaly ? 'anomaly' : 'noise',
      scoreDelta: Math.round((reading.ensembleScore - reading.module3Score) * 1000) / 1000,
    };
  }

  const zeroHourReading = {
    // Twenty normalized amplitudes from the archive's calm slice. Their
    // spread is the one lesson 1 measured over eleven days: this window
    // averages 0.520 and its standard deviation is 0.150.
    window: [
      0.523, 0.607, 0.407, 0.703, 0.462, 0.548, 0.338, 0.823, 0.568, 0.43, 0.633, 0.217, 0.538, 0.66,
      0.38, 0.588, 0.492, 0.745, 0.443, 0.295,
    ],
    actual: 0.5, // 0.1 sigma under that centre: the dial reads normal
    reconstructionError: 6.2,
    reconThreshold: 1.0, // module 7's locked cutoff
    predicted: 0.541, // module 7's forecast miss: 0.041 against a 0.01 gate
    actualForecast: 0.5,
    predTolerance: 0.01,
    intervals: [0.9, 0.9, 1.8, 2.7, 4.5, 7.2, 11.7],
    ensembleScore: 0.999,
    module3Score: 0.518,
  };
testCode: |
  // Every test below reads fields off a verdict, so the shape is named once
  // here. Without it the first Run against the starter throws a TypeError on
  // null instead of saying what is missing.
  const built = (verdict) => {
    expect(
      verdict,
      'classifyAnomaly returns { votes, isAnomaly, ratios, fibonacciTrain, classification, scoreDelta }. The starter returns null until you build it.',
    ).toBeDefined();
    return verdict;
  };

  describe('Zero Hour', () => {
    it('rejects malformed detector values and intervals before a verdict', () => {
      for (const key of ['reconstructionError','reconThreshold','predicted','actualForecast','predTolerance','ensembleScore','module3Score']) {
        expect(() => classifyAnomaly({...zeroHourReading,[key]:NaN})).toThrow();
      }
      for (const intervals of [[0,1],[-1,1],[1,Infinity]]) expect(() => decomposeIntervals(intervals)).toThrow();
    });

    it('rejects collapsed spread and preserves the relative tolerance boundary', () => {
      expect(() => classifyAnomaly({...zeroHourReading, window:[1, 1 + 1e-9]})).toThrow();
      expect(() => decomposeIntervals([1e-300, 1e300])).toThrow();
      expect(() => decomposeIntervals([1e300, 1e-300])).toThrow();
      expect(isFibonacciTrain([1.02, 2.04, 1.53, (5/3)*1.02, 1.632, 1.6575])).toBe(true);
      expect(isFibonacciTrain([1, 2, 1.5, 5/3, 1.6, '1.625'])).toBe(false);
    });

    const result = classifyAnomaly(zeroHourReading);

    it('decomposes the interval train into successive ratios', () => {
      const ratios = decomposeIntervals([1, 1, 2, 3, 5, 8, 13]);
      expect(
        ratios.length,
        'decomposeIntervals returns one ratio per adjacent pair, so seven intervals give six. The starter returns an empty list until you build it.',
      ).toBe(6);
      expect(ratios[0]).toBeCloseTo(1, 4);
      expect(ratios[1]).toBeCloseTo(2, 4);
      expect(ratios[2]).toBeCloseTo(1.5, 4);
      expect(ratios[5]).toBeCloseTo(1.625, 4);
    });

    it('the decomposition is scale-invariant (ratios care about proportion, not units)', () => {
      const seconds = decomposeIntervals([0.9, 0.9, 1.8, 2.7, 4.5, 7.2, 11.7]);
      const abstract = decomposeIntervals([1, 1, 2, 3, 5, 8, 13]);
      expect(
        abstract,
        'Seven intervals decompose into six ratios. An empty list agrees with every other empty list, which is why this check counts them first.',
      ).toHaveLength(6);
      expect(seconds).toHaveLength(6);
      for (let i = 0; i < abstract.length; i++) {
        expect(seconds[i]).toBeCloseTo(abstract[i], 4);
      }
    });

    it('recognizes the Fibonacci train and rejects a metronome', () => {
      expect(
        isFibonacciTrain(decomposeIntervals([1, 1, 2, 3, 5, 8, 13])),
        'These six ratios ARE the succession, to the last decimal. The starter answers false until you build it.',
      ).toBe(true);
      expect(isFibonacciTrain(decomposeIntervals([1, 1, 1, 1, 1, 1, 1]))).toBe(false);
    });

    it('aligns from the tail, rejects a wrong-length train, and holds the 2% tolerance', () => {
      // A train that omits the 1:1 opener: 5 ratios against the last 5 expected.
      expect(
        isFibonacciTrain(decomposeIntervals([1, 2, 3, 5, 8, 13])),
        'Five ratios, and the succession holds six slots. Compare them against the END of the list: a capture that starts mid-train has lost the 1:1 opener, not the tail.',
      ).toBe(true);
      // More ratios than the succession list has slots: no alignment exists.
      expect(isFibonacciTrain([1, 2, 1.5, 5 / 3, 1.6, 1.625, 1.615])).toBe(false);
      // 1.71 against the 5/3 slot is 2.6% off, just outside tolerance.
      expect(isFibonacciTrain([1, 2, 1.5, 1.71, 1.6, 1.625])).toBe(false);
      // 2% OF THE EXPECTED VALUE, so the band is widest where the
      // succession is largest. 2.03 misses the 2 slot by 1.5% and belongs
      // inside it; a fixed plus-or-minus-0.02 window calls this train
      // broken, and calls it broken hardest exactly where a real capture
      // has the most room to wander.
      expect(
        isFibonacciTrain([1, 2.03, 1.5, 5 / 3, 1.6, 1.625]),
        '2.03 against the 2 slot is 1.5% off, inside a 2% relative band. A fixed 0.02 band answers false here.',
      ).toBe(true);
      // 2.05 against the same slot is 2.5% off, outside it.
      expect(isFibonacciTrain([1, 2.05, 1.5, 5 / 3, 1.6, 1.625])).toBe(false);
    });

    it('the z-score gate clears sample 7741, and two votes carry it', () => {
      // Module 7's reading of this sample, unchanged: every dial normal.
      // 0.50 against the window's measured mean 0.520 and std 0.150 is
      // 0.1 sigma under it, so the statistical detector does not flag it and the
      // autoencoder and the LSTM decide it between them.
      expect(built(result).votes).toBe(2);
      expect(result.isAnomaly).toBe(true);

      // Silence those two and nothing is left. The statistical verdict is
      // measured false here, not assumed true.
      const dialsOnly = classifyAnomaly({
        ...zeroHourReading,
        reconstructionError: 0.1,
        predicted: 0.5,
      });
      expect(dialsOnly.votes).toBe(0);
      expect(dialsOnly.isAnomaly).toBe(false);
      expect(dialsOnly.classification).toBe('noise');
    });

    it('a full-scale amplitude does fire it: 1.00 is 3.2 sigma off this spread', () => {
      // A reading pegged at the hull sensor's 1.00 ceiling, which neither
      // of module 7's captures ever was. Against mean 0.520 and std 0.150
      // that is about 3.2 sigma; a zero reading is farther below the mean.
      const pegged = classifyAnomaly({ ...zeroHourReading, actual: 1.0 });
      expect(built(pegged).votes).toBe(3);
      expect(pegged.isAnomaly).toBe(true);

      const peggedAlone = classifyAnomaly({
        ...zeroHourReading,
        actual: 1.0,
        reconstructionError: 0.1,
        predicted: 0.5,
      });
      expect(peggedAlone.votes).toBe(1);
      expect(peggedAlone.isAnomaly).toBe(false);
    });

    it('the gate reads |z|, so a dead channel at 0.00 trips it too', () => {
      // 3.47 sigma below the mean. A gate written `z > 3` misses this.
      const dead = classifyAnomaly({
        ...zeroHourReading,
        actual: 0.0,
        reconstructionError: 0.1,
        predicted: 0.5,
      });
      expect(built(dead).votes).toBe(1);

      const deadPlusRecon = classifyAnomaly({
        ...zeroHourReading,
        actual: 0.0,
        predicted: 0.5,
      });
      expect(deadPlusRecon.votes).toBe(2);
      expect(deadPlusRecon.isAnomaly).toBe(true);
    });

    it('majority vote is 2-of-3, not unanimity', () => {
      // Drop one of the two that fired and the alarm goes quiet.
      const oneVote = classifyAnomaly({
        ...zeroHourReading,
        reconstructionError: 0.1,
      });
      expect(built(oneVote).votes).toBe(1);
      expect(oneVote.isAnomaly).toBe(false);
      expect(oneVote.classification).toBe('noise');

      // Any two are enough, including a pair the autoencoder sits out.
      const statPlusLstm = classifyAnomaly({
        ...zeroHourReading,
        actual: 1.0,
        reconstructionError: 0.1,
      });
      expect(statPlusLstm.votes).toBe(2);
      expect(statPlusLstm.isAnomaly).toBe(true);
    });

    it('the sigma comes from reading.window, so one value reads differently on two channels', () => {
      // Generated windows, and each probe is derived from its own window's
      // measured moments rather than listed here. Lesson 1's 0.520 and
      // 0.150 belong to the archive slice above and to nothing else, so a
      // detector that carries them gets both of these channels wrong.
      const moments = (window) =>
        tf.tidy(() => {
          const m = tf.moments(tf.tensor1d(window));
          return {
            mean: m.mean.dataSync()[0],
            std: Math.sqrt(m.variance.dataSync()[0]),
          };
        });
      const quiet = { reconstructionError: 0.1, predicted: 0.5, actualForecast: 0.5 };

      // A drifted channel first: centred near 0.80 with a spread near 0.05,
      // and the reading sits exactly on this window's own mean. A centre
      // measured from the window reads 0 sigma; a carried mid-scale 0.5
      // reads about 6 and fires (round 7, 2026-09-13: a submission that
      // measured only the spread and carried 0.5 as the centre cleared
      // every fixture here, because every window was centred at 0.5).
      const driftedWindow = Array.from({ length: 24 }, (_, i) => 0.8 + 0.07 * Math.sin(i * 2.3));
      const drifted = moments(driftedWindow);
      const onDrifted = classifyAnomaly({
        ...zeroHourReading,
        ...quiet,
        window: driftedWindow,
        actual: drifted.mean,
      });
      expect(
        built(onDrifted).votes,
        'This reading equals the mean of reading.window, so its z-score is 0 and the statistical detector must not vote. Calculate the mean and spread from that supplied window. A fixed mid-scale baseline would incorrectly put it about 6 standard deviations away.',
      ).toBe(0);

      // A tight channel: the same mid-scale amplitude, a tenth of the
      // spread. Measured here: mean 0.5007, std 0.0141.
      const tightWindow = Array.from({ length: 24 }, (_, i) => 0.5 + 0.02 * Math.sin(i * 1.7));
      const tight = moments(tightWindow);
      const onTight = classifyAnomaly({
        ...zeroHourReading,
        ...quiet,
        window: tightWindow,
        actual: tight.mean + 4 * tight.std,
      });
      expect(
        built(onTight).votes,
        'The reading is 4 sigma above this window and it reads 0.557, which is 0.25 sigma against the archive spread. Only a sigma measured from reading.window sees it.',
      ).toBe(1);

      // Two votes flip the verdict, and the statistical one is the vote
      // that arrives only from the window.
      const onTightPlusLstm = classifyAnomaly({
        ...zeroHourReading,
        reconstructionError: 0.1,
        window: tightWindow,
        actual: tight.mean + 4 * tight.std,
      });
      expect(onTightPlusLstm.votes).toBe(2);
      expect(onTightPlusLstm.isAnomaly).toBe(true);
      expect(onTightPlusLstm.classification).toBe('confirmed-anomaly');

      // A noisy channel, the other way round: 0.975 is 1.9 sigma against
      // its own window and 3.03 against the carried spread.
      const wideWindow = Array.from({ length: 24 }, (_, i) => (i % 2 === 0 ? 0.25 : 0.75));
      const wide = moments(wideWindow);
      const onWide = classifyAnomaly({
        ...zeroHourReading,
        ...quiet,
        window: wideWindow,
        actual: wide.mean + 1.9 * wide.std,
      });
      expect(
        onWide.votes,
        'Nothing fired. 1.9 sigma is not 3, and this channel swings 0.25 either side of its mean every sample.',
      ).toBe(0);
      expect(onWide.isAnomaly).toBe(false);
      expect(onWide.classification).toBe('noise');
    });

    it('a calm night with a Fibonacci train is still noise: the vote gates it', () => {
      // A different reading entirely, on its own numbers.
      const calmNight = {
        window: [0.474, 0.556, 0.512, 0.398, 0.601, 0.489, 0.533, 0.462, 0.578, 0.507],
        actual: 0.55,
        reconstructionError: 0.3,
        reconThreshold: 1.0,
        predicted: 0.542,
        actualForecast: 0.55,
        predTolerance: 0.01,
        intervals: [2, 2, 4, 6, 10, 16, 26],
        ensembleScore: 0.114,
        module3Score: 0.093,
      };
      const calm = classifyAnomaly(calmNight);
      expect(built(calm).votes).toBe(0);
      expect(calm.isAnomaly).toBe(false);
      expect(calm.fibonacciTrain).toBe(true);
      expect(calm.classification).toBe('noise');
      expect(calm.scoreDelta).toBeCloseTo(0.021, 3);
    });

    it('the verdict carries the decomposition, and a growing train is not a Fibonacci train', () => {
      // The same train twice: the capture in seconds, and the sequence
      // counted abstractly. Both records are computed here, neither is
      // listed, and the ratios are read off the verdict rather than off a
      // direct call to decomposeIntervals.
      const inSeconds = classifyAnomaly(zeroHourReading);
      const abstract = classifyAnomaly({
        ...zeroHourReading,
        intervals: [1, 1, 2, 3, 5, 8, 13],
      });
      const expectedRatios = decomposeIntervals(zeroHourReading.intervals);
      expect(
        built(inSeconds).ratios,
        'The verdict reports ratios, so the seven pulse gaps it was handed have to be collapsed into six numbers before they go in the record. Passing the gaps straight through, or leaving the field empty, records something else.',
      ).toHaveLength(expectedRatios.length);
      for (let i = 0; i < expectedRatios.length; i++) {
        expect(inSeconds.ratios[i]).toBeCloseTo(expectedRatios[i], 6);
        expect(
          abstract.ratios[i],
          'A record still carrying seconds reads differently from the same train counted abstractly. Dividing is what removes the units, and it is the reason the calibration overlay lined up at all.',
        ).toBeCloseTo(inSeconds.ratios[i], 6);
      }

      // Gaps that grow every step, and not by the succession.
      const doubling = classifyAnomaly({
        ...zeroHourReading,
        intervals: [0.9, 1.8, 3.6, 7.2, 14.4, 28.8, 57.6],
      });
      expect(
        built(doubling).fibonacciTrain,
        'Every gap here is twice the one before it, so the gaps grow and the ratio train is a flat 2. Growing is not the test. Matching the succession ratios slot by slot is.',
      ).toBe(false);
      expect(doubling.classification).toBe('anomaly');
    });

    it('settles the season: confirmed anomaly, and the 51.8 -> 99.9 delta', () => {
      expect(built(result).classification).toBe('confirmed-anomaly');
      expect(result.fibonacciTrain).toBe(true);
      expect(result.scoreDelta).toBeCloseTo(0.481, 3);
    });

    it('an anomalous vote without the Fibonacci train stays "anomaly", not confirmed', () => {
      const uniform = classifyAnomaly({
        ...zeroHourReading,
        intervals: [1, 1, 1, 1, 1, 1, 1],
      });
      expect(built(uniform).isAnomaly).toBe(true);
      expect(uniform.classification).toBe('anomaly');
    });
  });

  it('an empty interval pattern is no evidence', () => {
    expect(isFibonacciTrain([])).toBe(false);
    expect(isFibonacciTrain([1, 2, 1.5, 5 / 3, 1.6, 1.625])).toBe(true);
  });

  it('a different reading against a constant window keeps its statistical vote', () => {
    const base = {
      ...zeroHourReading,
      window: [0.1, 0.1],
      actual: 0.1,
      reconstructionError: 2,
      reconThreshold: 1,
      predicted: 0.1,
      actualForecast: 0.1,
      predTolerance: 1,
    };
    expect(classifyAnomaly(base).votes).toBe(1);
    expect(classifyAnomaly({ ...base, actual: 0.2 }).votes).toBe(2);
    expect(classifyAnomaly({ ...base, actual: 0 }).isAnomaly).toBe(true);
    expect(() => classifyAnomaly({ ...base, window: [] })).toThrow();
  });
estimatedMinutes: 15
difficulty: advanced
