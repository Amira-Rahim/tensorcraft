slug: export-model-artifact
lessonSlug: ci-cd-pipeline
title: "Model export for CI"
instructions: |
  Help Nazari identify the saved model that CI will check. Serialize the supplied uncompiled LayersModel, with three inputs and dense layers of 16, 8, and 1 units, into memory.

  1. Await `model.save(tf.io.withSaveHandler(...))` before reading the saved data. Keep the handler's argument in `artifacts`. From the handler, return `{ modelArtifactsInfo: { dateSaved: new Date(), modelTopologyType: 'JSON' } }`.
  2. Write `describeArtifact(a)` to return `{ tensors, totalParams, weightBytes }`. Count entries in `weightSpecs` for tensors. For each spec, multiply its dimensions, then sum those products for totalParams. Read `weightData.byteLength` for weightBytes.
  3. Set `manifest` to `describeArtifact(artifacts)`.

  The handler provides one `weightData` ArrayBuffer. Read its byte length directly. A fixed four-byte multiplier does not work for every quantized or mixed-precision file. One check supplies a buffer with extra bytes: measuring that buffer does not prove it is a valid model.

  Use the real save handler. The checks reload your saved topology and weights and compare predictions, so do not build an artifact by hand. This exercise writes no file and publishes no model.
starterCode: |
  // Export this supplied model through the same save handler
  // the release checks will inspect.
