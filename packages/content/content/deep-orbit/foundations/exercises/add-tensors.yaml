slug: add-tensors
lessonSlug: tensor-operations
title: "The combined sensor passes"
instructions: |
  Help Demir write reusable functions to average readings and combine channels.
  The supplied values are separate diagnostic test inputs. They check your
  functions on several shapes and gains, rather than process the ship recording.

  1. Write `mergePasses(pass1, pass2, gain)`. Return `{ merged, boosted }`.
     `merged` adds matching readings and divides by 2. `boosted` multiplies
     that average by `gain`. Return both as tensors. Support broadcasting,
     including a `[3, 2]` set paired with one `[2]` row.
  2. Write `mixChannels(block, mix)`. Each row of `block` is one reading,
     with shape `[readings, channels]`. Each row of `mix` is one set of weights,
     with shape `[banks, channels]`. Return shape `[readings, banks]`.
     Multiply each reading by each set of channel weights and sum the products.
     Work out which axes need to swap before the multiplication.

  Use tensor operations for the average and gain, and `matMul` or `dot` for
  combining channels. JavaScript loops do not meet this task's requirements.
  Averaging can reduce independent noise whose mean is zero. It does not
  remove every kind of error.
starterCode: |
  function mergePasses(pass1, pass2, gain) {
    // 1. Element-wise average of the two passes
    // 2. Amplify the average by gain
    return null; // your code here
  }

  function mixChannels(block, mix) {
    // The two axis orders do not line up for this multiply.
    return null; // your code here
  }
solutionCode: |
  function mergePasses(pass1, pass2, gain) {
    return tf.tidy(() => {
      const merged = pass1.add(pass2).div(2);
      const boosted = merged.mul(gain);
      return { merged, boosted };
    });
  }

  function mixChannels(block, mix) {
    return tf.tidy(() => block.matMul(mix.transpose()));
  }
testCode: |
  describe('mergePasses', () => {
    // The naive route (dataSync plus Array.map) is what the [3, 2] against
    // [2] pair below catches: on tfjs 4.22.0 it reads past the end of the
    // shorter pass and returns a flat [6] of NaN. What no assertion on the
    // RETURNED values can settle is which execution model produced them,
    // since a JS loop that implements broadcast semantics by hand arrives at
    // the same numbers and the same shape (measured 2026-09-08). That
    // submission reproduces every number here; what it never does is run the
    // op on the tensor, which the tf.__calls counters below now catch.
    //
    // mixChannels is the lesson's headline op made load-bearing (added
    // 2026-09-12). Before it, three of the lesson's five objectives, matMul
    // and transpose included, were graded nowhere: every test in this file
    // passed for a submission that never wrote a matrix multiply, which is
    // also true of the reference solution the lesson opened on.
    const merge = (pass1, pass2, gain) => {
      const out = mergePasses(pass1, pass2, gain);
      expect(
        Boolean(out),
        'mergePasses has to hand back an object carrying both passes. The starter returns null until you fill it in.',
      ).toBe(true);
      expect(
        out.merged,
        'The averaged pass is missing from what came back. Step 1 is the element-wise average of the two passes.',
      ).toBeDefined();
      expect(
        out.boosted,
        'The amplified pass is missing from what came back. Step 2 scales the average by gain.',
      ).toBeDefined();
      return out;
    };
    const scored = (block, mix) => {
      const out = mixChannels(block, mix);
      expect(
        Boolean(out && typeof out.arraySync === 'function'),
        'mixChannels has to hand back a tensor of scores. The starter returns null until you fill it in.',
      ).toBe(true);
      return out;
    };
    // The harness counts tensor ops on tf.__calls. Every objective of this
    // lesson is a tensor op, and a submission that loops over dataSync()
    // output in plain JavaScript and re-wraps the answer reproduces every
    // number here; what it never does is run the op on the tensor.
    const elementWiseOps = () =>
      ['tensor.add', 'tensor.sub', 'tensor.mul', 'tensor.div', 'add', 'sub', 'mul', 'div'].reduce(
        (n, k) => n + (tf.__calls[k] || 0),
        0,
      );
    const matMulOps = () =>
      ['tensor.matMul', 'tensor.dot', 'matMul', 'dot'].reduce((n, k) => n + (tf.__calls[k] || 0), 0);
    it('merged is the element-wise average', () => {
      const opsBefore = elementWiseOps();
      const { merged } = merge(
        tf.tensor([0.2, 0.6, 0.4, 0.8]),
        tf.tensor([0.4, 0.2, 0.6, 0.6]),
        2.5,
      );
      expect(
        elementWiseOps() - opsBefore,
        'Use tensor operations such as add(), div(), and mul() for the average and gain. Do not calculate copied values in JavaScript and wrap them in a new tensor.',
      ).toBeGreaterThan(0);
      const v = Array.from(merged.dataSync());
      const why = 'Averaging pairs each position with the matching position in the other pass, then halves it.';
      expect(v[0], why).toBeCloseTo(0.3, 5);
      expect(v[1], why).toBeCloseTo(0.4, 5);
      expect(v[2], why).toBeCloseTo(0.5, 5);
      expect(v[3], why).toBeCloseTo(0.7, 5);
      recordResult({
        kind: 'table', title: 'Your averaged diagnostic pass',
        summary: 'Output from your merge function on two supplied diagnostic passes: [0.2, 0.6, 0.4, 0.8] and [0.4, 0.2, 0.6, 0.6]. These values are separate from the recording excerpt.',
        columns: ['Position', 'Averaged reading'],
        rows: v.map((value, i) => [i + 1, value]),
      });
    });
    it('boosted applies the gain', () => {
      const { boosted } = merge(
        tf.tensor([0.2, 0.6, 0.4, 0.8]),
        tf.tensor([0.4, 0.2, 0.6, 0.6]),
        2.5,
      );
      const v = Array.from(boosted.dataSync());
      const why = 'boosted is the average scaled by gain, so apply it to the merged pass.';
      expect(v[0], why).toBeCloseTo(0.75, 5);
      expect(v[3], why).toBeCloseTo(1.75, 5);
      recordResult({
        kind: 'table', title: 'The amplified pass',
        summary: 'Your averaged diagnostic pass after gain 2.5. The inputs are the same four-position passes used in the average table.',
        columns: ['Position', 'Amplified reading'],
        rows: v.map((value, i) => [i + 1, value]),
      });
    });
    it('works on a different pair of passes and gain (no memorized outputs)', () => {
      const { merged, boosted } = merge(tf.tensor([1, 2]), tf.tensor([3, 6]), 10);
      expect(
        Array.from(merged.dataSync()),
        'Same function, different readings. Anything pinned to the numbers in the first case fails here.',
      ).toEqual([2, 4]);
      expect(
        Array.from(boosted.dataSync()),
        'And use the gain from the current call. The earlier value of 2.5 applies only to that case.',
      ).toEqual([20, 40]);
    });
    it('broadcasts a [3, 2] block against a pass that arrived as a single row and keeps the shape', () => {
      // The shapes differ, so this pair only merges if the op broadcasts.
      // dataSync() plus Array.map reads past the end of the shorter pass and
      // returns a flat [6] of NaN (measured on tfjs 4.22.0).
      const { merged, boosted } = merge(
        tf.tensor2d([
          [0, 2],
          [4, 6],
          [8, 10],
        ]),
        tf.tensor([2, 4]),
        3,
      );
      const shapeWhy =
        'Broadcast the single row across all rows in the block. The result must keep the block shape.';
      expect(merged.shape, shapeWhy).toEqual([3, 2]);
      expect(
        merged.arraySync(),
        'Each value in the single row lines up with its own channel, which is the column it sits in.',
      ).toEqual([
        [1, 3],
        [3, 5],
        [5, 7],
      ]);
      expect(boosted.shape, shapeWhy).toEqual([3, 2]);
      expect(
        boosted.arraySync(),
        'The gain reaches every element of the block, so the shape survives step 2 as well.',
      ).toEqual([
        [3, 9],
        [9, 15],
        [15, 21],
      ]);
    });
    it('mixChannels scores every reading against every bank', () => {
      // Three readings of two channels against three banks of two weights.
      // Left columns 2, right rows 3: the multiply refuses to run until one
      // of the two tensors is turned, which is the rule the error at the top
      // of the lesson was enforcing. Element-wise ops cannot reach this
      // result without a sum across an axis.
      const matMulBefore = matMulOps();
      const out = scored(
        tf.tensor2d([
          [1, 2],
          [3, 4],
          [5, 6],
        ]),
        tf.tensor2d([
          [1, 0],
          [0, 1],
          [1, 1],
        ]),
      );
      expect(
        matMulOps() - matMulBefore,
        'Use matMul() or dot() to combine each reading with each set of weights. JavaScript loops do not meet this task\'s requirements.',
      ).toBeGreaterThan(0);
      expect(
        out.shape,
        'One row per reading and one column per bank: the readings stay on the rows and the banks become the columns.',
      ).toEqual([3, 3]);
      expect(
        out.arraySync(),
        'The shape is [3, 3] either way, so check the values too. Each score multiplies one reading by one set of channel weights and adds the products. Bank 0 keeps channel 0, bank 1 keeps channel 1, and bank 2 adds both.',
      ).toEqual([
        [1, 2, 3],
        [3, 4, 7],
        [5, 6, 11],
      ]);
      recordResult({
        kind: 'table', title: 'Channel-bank scores',
        summary: 'Your matrix multiplication on diagnostic rows [1, 2], [3, 4], [5, 6] and banks [1, 0], [0, 1], [1, 1]. Rows hold readings. Columns hold banks.',
        columns: ['Reading', 'Bank 0', 'Bank 1', 'Bank 2'],
        rows: out.arraySync().map((row, i) => [i + 1, ...row]),
      });
    });
    it('mixChannels holds up on a different bank count (no memorized outputs)', () => {
      const out = scored(
        tf.tensor2d([
          [2, 0.5],
          [0, 1],
        ]),
        tf.tensor2d([[2, 4]]),
      );
      expect(
        out.shape,
        'This case has two readings and one set of weights. Read the shapes from the supplied tensors.',
      ).toEqual([2, 1]);
      expect(
        Array.from(out.dataSync()),
        'Reading one is 2 and 0.5 against weights 2 and 4. Reading two is 0 and 1 against the same pair.',
      ).toEqual([6, 4]);
    });
  });
