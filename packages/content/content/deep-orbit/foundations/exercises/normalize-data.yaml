slug: normalize-data
lessonSlug: normalization
title: "Normalize, Then Ask the Preview Neuron"
instructions: "Real normalization is two jobs: scale the training data AND keep the statistics so future readings get the identical treatment. This time the pipeline ends where every pipeline should: at a model. Given a [4, 2] batch (4 readings × 2 features: temperature, signal strength), (1) compute per-column mean and std into `mean` and `std` using tf.moments with axis 0, (2) z-score the batch into `normalized`, (3) build `previewModel`: one dense neuron with sigmoid activation (tf.sequential + tf.layers.dense, inputShape [2]), then load Farah's frozen weights with setWeights, (4) score the whole normalized batch in one predict() call into `scores`, (5) write `scoreReading(reading)` that applies THOSE SAVED STATS to any new 1D reading and returns the neuron's verdict; at inference time there is no batch to recompute from."
