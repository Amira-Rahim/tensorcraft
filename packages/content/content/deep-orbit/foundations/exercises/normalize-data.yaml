slug: normalize-data
lessonSlug: normalization
title: "Normalize — and Save the Stats"
instructions: "Real normalization is two jobs: scale the training data AND keep the statistics so future readings get the identical treatment. Given a [4, 2] batch (4 readings × 2 features: temperature, signal strength), (1) compute per-column mean and std into `mean` and `std` using tf.moments with axis 0, (2) z-score the batch into `normalized`, (3) write `normalizeReading(reading)` that applies THOSE SAVED STATS to any new 1D reading — at inference time there is no batch to recompute from."
starterCode: "const batch = tf.tensor2d([\n  [20, 0.2],\n  [22, 0.8],\n  [24, 0.4],\n  [26, 0.6],\n]);\n\n// 1. Per-column stats (axis 0). std = variance.sqrt()\nconst mean = null; // your code here\nconst std = null;\n\n// 2. Z-score the batch with those stats\nconst normalized = null;\n\n// 3. Same treatment for any future reading\nfunction normalizeReading(reading) {\n  // your code here\n}"
solutionCode: "const batch = tf.tensor2d([\n  [20, 0.2],\n  [22, 0.8],\n  [24, 0.4],\n  [26, 0.6],\n]);\n\nconst moments = tf.moments(batch, 0);\nconst mean = moments.mean;\nconst std = moments.variance.sqrt();\n\nconst normalized = batch.sub(mean).div(std);\n\nfunction normalizeReading(reading) {\n  return reading.sub(mean).div(std);\n}"
testCode: |
  describe('Normalize and Save', () => {
    it('per-column mean is [23, 0.5]', () => {
      const m = Array.from(mean.dataSync());
      expect(m[0]).toBeCloseTo(23, 4);
      expect(m[1]).toBeCloseTo(0.5, 4);
    });
    it('normalized columns have mean ~0', () => {
      const colMeans = Array.from(normalized.mean(0).dataSync());
      expect(Math.abs(colMeans[0])).toBeLessThan(1e-5);
      expect(Math.abs(colMeans[1])).toBeLessThan(1e-5);
    });
    it('normalized columns have std ~1', () => {
      const v = tf.moments(normalized, 0).variance.sqrt();
      const stds = Array.from(v.dataSync());
      expect(stds[0]).toBeCloseTo(1, 4);
      expect(stds[1]).toBeCloseTo(1, 4);
    });
    it('normalizeReading applies the SAVED stats to a new reading', () => {
      const out = normalizeReading(tf.tensor([23, 0.5]));
      const vals = Array.from(out.dataSync());
      expect(vals[0]).toBeCloseTo(0, 4);
      expect(vals[1]).toBeCloseTo(0, 4);
      const out2 = normalizeReading(tf.tensor([25, 0.8]));
      expect(out2.dataSync()[0]).toBeGreaterThan(0);
    });
  });
