solutionCode: |
  const batch = tf.tensor2d([
    [20, 0.2],
    [22, 0.8],
    [24, 0.4],
    [26, 0.6],
  ]);

  const KERNEL = [[0.9], [-1.4]];
  const BIAS = [-0.3];

  function fitStats(rows) {
    return tf.tidy(() => {
      const { mean, variance } = tf.moments(rows, 0);
      return { mean, std: variance.sqrt() };
    });
  }

  const { mean, std } = fitStats(batch);

  function scaleFeatures(rows, offset, scale) {
    return tf.tidy(() => {
      const divisor = tf.where(scale.equal(0), tf.onesLike(scale), scale);
      return rows.sub(offset).div(divisor);
    });
  }

  const normalized = scaleFeatures(batch, mean, std);

  const previewModel = tf.sequential();
  previewModel.add(tf.layers.dense({ units: 1, activation: 'sigmoid', inputShape: [2] }));
  tf.tidy(() => previewModel.setWeights([tf.tensor2d(KERNEL), tf.tensor1d(BIAS)]));

  const scores = previewModel.predict(normalized);

  function scoreReading(reading) {
    return tf.tidy(() => {
      const z = scaleFeatures(reading, mean, std);
      return previewModel.predict(z.reshape([1, 2]));
    });
  }

  function minMaxStats(rows) {
    return { min: rows.min(0), max: rows.max(0) };
  }

  const { min, max } = minMaxStats(batch);

  const unitRange = tf.tidy(() => scaleFeatures(batch, min, max.sub(min)));
testCode: |
  describe('Normalize, Then Ask the Preview Neuron', () => {
    const filled = (value, what) => expect(value, what).toBeDefined();
    // Statistics come back as tensors; anything else is not a
    // statistic the batch can broadcast against.
    const values = (value, what) => {
      filled(value, what);
      expect(value instanceof tf.Tensor, 'Return each statistic as a tensor.').toBe(true);
      const raw = typeof value.dataSync === 'function' ? value.dataSync() : value;
      expect(
        Array.isArray(raw) || ArrayBuffer.isView(raw),
        'fitStats has to return its statistics as tensors, the way tf.moments hands them back, so the batch can broadcast against them.',
      ).toBe(true);
      return Array.from(raw);
    };
    it('fitStats returns one statistic per feature, not one for the batch', () => {
      const m = values(mean, 'Step 1 has not run yet: fitStats still returns nulls.');
      const why =
        'Calculate a separate mean for each column. One mean for the whole batch would mix temperature with signal strength.';
      expect(m.length, 'Two features in, two statistics out.').toBe(2);
      expect(m[0], why).toBeCloseTo(23, 4);
      expect(m[1], why).toBeCloseTo(0.5, 4);
      recordResult({
        kind: 'table', title: 'Saved training statistics',
        summary: 'Your statistics for the supplied four-row temperature and signal-strength batch.',
        columns: ['Feature', 'Mean', 'Standard deviation'],
        rows: m.map((value, i) => [i === 0 ? 'Temperature' : 'Signal strength', value, std.dataSync()[i]]),
      });
    });
    it('fitStats reads the rows it is handed, not a memorized answer', () => {
      // A three-row batch that appears nowhere else in this exercise. Its
      // stats were measured on tfjs 4.22.0: mean [12, 4], population std
      // [1.6329932, 2.4494898]. Hand-typed constants fitted to the
      // four-row batch above cannot clear this.
      const other = fitStats(tf.tensor2d([[10, 1], [12, 4], [14, 7]]));
      const m = values(other && other.mean, 'fitStats returned no mean for this batch.');
      const sd = values(other && other.std, 'fitStats returned no std for this batch.');
      const why =
        'Calculate the statistics from the rows passed into the function. The tests also use batches unlike the starter example.';
      const stdWhy =
        why +
        ' Use population standard deviation: divide by n, not n - 1.';
      expect(m[0], why).toBeCloseTo(12, 4);
      expect(m[1], why).toBeCloseTo(4, 4);
      expect(sd[0], stdWhy).toBeCloseTo(1.63299, 4);
      expect(sd[1], stdWhy).toBeCloseTo(2.44949, 4);
    });
    it('fitStats holds up on a five-row slice with untidy numbers', () => {
      // Five rows, none of them round: mean [26.9, 0.43], std
      // [5.9803843, 0.3209361] on tfjs 4.22.0. A different row count also
      // rules out a divisor pinned to four.
      const other = fitStats(
        tf.tensor2d([[31.5, 0.05], [18.25, 0.93], [27, 0.41], [22.75, 0.62], [35, 0.14]]),
      );
      const m = values(other && other.mean, 'fitStats returned no mean for this batch.');
      const sd = values(other && other.std, 'fitStats returned no std for this batch.');
      const why =
        'Five rows this time. A row count baked into the arithmetic, or a divisor of four, lands off here.';
      const stdWhy =
        why +
        ' So does dividing by n - 1 instead of n, which lands high by a factor of sqrt(n / (n - 1)) on any row count.';
      expect(m[0], why).toBeCloseTo(26.9, 3);
      expect(m[1], why).toBeCloseTo(0.43, 4);
      expect(sd[0], stdWhy).toBeCloseTo(5.98038, 3);
      expect(sd[1], stdWhy).toBeCloseTo(0.32094, 4);
    });
    it('normalized columns have mean ~0 and std ~1', () => {
      filled(normalized, 'Step 2 is still empty. Z-score the batch with the statistics from step 1.');
      const colMeans = Array.from(normalized.mean(0).dataSync());
      const why =
        'Subtract each column\'s mean and divide by its standard deviation. This puts both columns on a comparable scale.';
      expect(Math.abs(colMeans[0]), why).toBeLessThan(1e-5);
      expect(Math.abs(colMeans[1]), why).toBeLessThan(1e-5);
      const stds = Array.from(tf.moments(normalized, 0).variance.sqrt().dataSync());
      const stdWhy =
        'Use population standard deviation. The scaled column has standard deviation 1; using n - 1 gives about 0.87 here.';
      expect(stds[0], stdWhy).toBeCloseTo(1, 4);
      expect(stds[1], stdWhy).toBeCloseTo(1, 4);
    });
    function checkSuppliedModel() {
      filled(previewModel, 'Keep the supplied fixed preview model available.');
      expect(
        previewModel instanceof tf.LayersModel,
        'Keep the supplied LayersModel. An object with getWeights and predict methods does not run the provided dense layer.',
      ).toBe(true);
      expect(previewModel.layers.length, 'One dense layer, nothing else in the stack.').toBe(1);
      expect(
        previewModel.layers[0].getClassName(),
        'The one layer is tf.layers.dense: one unit reading two features, sigmoid on the way out.',
      ).toBe('Dense');
      const w = previewModel.getWeights();
      expect(w, 'A dense layer keeps two weight tensors: the kernel and the bias.').toHaveLength(2);
      expect(
        w[0].shape,
        'The kernel is one weight per input feature, arranged as a column because the layer has one unit.',
      ).toEqual([2, 1]);
      const k = Array.from(w[0].dataSync());
      const why =
        'Pass the kernel first and the bias second to setWeights(). Keep the supplied kernel shape.';
      expect(k[0], why).toBeCloseTo(0.9, 5);
      expect(k[1], why).toBeCloseTo(-1.4, 5);
      expect(w[1].dataSync()[0], why).toBeCloseTo(-0.3, 5);
    }
    it('scores = predict(normalized): one sigmoid verdict per reading', () => {
      expect(scores instanceof tf.Tensor, 'Score the normalized batch before checking its fixed model.').toBe(true);
      checkSuppliedModel();
      checkModelOnAnotherInput();
      expect(
        scores.shape,
        'One row of output per row of input, and one column because the layer has a single unit.',
      ).toEqual([4, 1]);
      const s = Array.from(scores.dataSync());
      const why =
        'Predict on the scaled rows. Check that you used the supplied weights and bias, and population standard deviation with divisor n.';
      expect(s[0], why).toBeCloseTo(0.5917, 3);
      expect(s[1], why).toBeCloseTo(0.0704, 3);
      expect(s[2], why).toBeCloseTo(0.6745, 3);
      expect(s[3], why).toBeCloseTo(0.5699, 3);
      recordResult({
        kind: 'table', title: 'Scaled readings entering Farah\'s preview',
        summary: 'Your scaled inputs and scores from the supplied fixed neuron. These scores do not measure classifier accuracy.',
        columns: ['Reading', 'Temperature z-score', 'Signal z-score', 'Model score'],
        rows: normalized.arraySync().map((row, i) => [i + 1, ...row, s[i]]),
      });
    });
    function checkModelOnAnotherInput() {
      filled(previewModel, 'Keep the supplied fixed preview model available.');
      const out = previewModel.predict(tf.tensor2d([[1, -1]]));
      expect(
        out.dataSync()[0],
        'These two numbers are not in the batch. The layer has to do the arithmetic rather than return a stored answer.',
      ).toBeCloseTo(0.8808, 3);
    }
    it('scoreReading keeps working after the training rows are gone', () => {
      // A [2] reading handed straight to predict throws a raw framework
      // error on tfjs 4.22.0 (measured 2026-09-13: "expected ... input to
      // have shape [null,2] but got array with shape [2,1]"), the only
      // unauthored failure message this exercise could print. Name the
      // missing axis instead.
      let centre;
      try {
        centre = scoreReading(tf.tensor([23, 0.5]));
      } catch (err) {
        throw new Error(
          'scoreReading threw on a single reading. Two features arrive shaped [2], and predict reads a BATCH: it wants a leading axis of one, shape [1, 2], so the reading goes in as a single row. Underlying error: ' +
            ((err && err.message) || String(err)),
        );
      }
      filled(centre, 'Step 5 is still empty: scoreReading returned nothing.');
      const verdict = typeof centre === 'number' ? centre : centre.dataSync()[0];
      expect(
        verdict,
        'A reading sitting exactly at the training mean normalizes to zeros, so this verdict is the bias alone.',
      ).toBeCloseTo(0.4256, 3);
      // PROVENANCE, and the only route to it. Refitting the statistics off
      // `batch` at call time returns numerically IDENTICAL values, so no
      // assertion on the RESULT can separate saved stats from recomputed
      // ones: a submission that reran fitStats(batch) inside scoreReading
      // passed all eight tests (measured 2026-09-08). Releasing the training
      // batch settles it, and it is also the situation the lesson describes,
      // since a deployed model has no training rows to reach for. Measured
      // 2026-09-08 on tfjs 4.22.0: a scoreReading that refits throws
      // "Cannot read properties of undefined (reading 'backend')" from the
      // next line, and one that uses the saved statistics returns
      // 0.5099692940711975.
      batch.dispose();
      let archived;
      try {
        archived = scoreReading(tf.tensor([24, 0.51]));
      } catch (err) {
        throw new Error(
          'The training rows have been released here, and scoreReading reached for them anyway. Fit the statistics once, hold on to them, and normalize each new reading with those. A model in production has no training batch to recompute from. Underlying error: ' +
            ((err && err.message) || String(err)),
        );
      }
      expect(
        typeof archived === 'number' ? archived : archived.dataSync()[0],
        'Use the saved training mean and standard deviation for this reading. Do not fit new statistics or use n - 1 for the variance.',
      ).toBeCloseTo(0.51, 3);
    });
    it('minMaxStats returns one min and one max per feature, as tensors', () => {
      // The last test releases `batch` while the others run, so this one
      // hands minMaxStats the same four readings on a tensor of its own.
      const stats = minMaxStats(tf.tensor2d([[20, 0.2], [22, 0.8], [24, 0.4], [26, 0.6]]));
      filled(stats && stats.min, 'Step 6 is still empty: minMaxStats returned no min.');
      filled(stats && stats.max, 'Step 6 is still empty: minMaxStats returned no max.');
      const mins = Array.from(stats.min.dataSync ? stats.min.dataSync() : stats.min);
      const maxs = Array.from(stats.max.dataSync ? stats.max.dataSync() : stats.max);
      const why = 'One minimum and one maximum per column: the coldest temperature and the weakest signal are two different numbers, and a reduction over the whole batch mixes them.';
      expect(mins.length, why).toBe(2);
      expect(mins[0], why).toBeCloseTo(20, 5);
      expect(mins[1], why).toBeCloseTo(0.2, 5);
      expect(maxs[0], why).toBeCloseTo(26, 5);
      expect(maxs[1], why).toBeCloseTo(0.8, 5);
    });
    it('minMaxStats reads the rows it is handed', () => {
      const other = minMaxStats(tf.tensor2d([[10, 1], [12, 4], [14, 7]]));
      const mins = Array.from(other.min.dataSync ? other.min.dataSync() : other.min);
      const maxs = Array.from(other.max.dataSync ? other.max.dataSync() : other.max);
      const why = 'These rows are not the batch above. The statistics have to come off the argument.';
      expect(mins[0], why).toBeCloseTo(10, 5);
      expect(mins[1], why).toBeCloseTo(1, 5);
      expect(maxs[0], why).toBeCloseTo(14, 5);
      expect(maxs[1], why).toBeCloseTo(7, 5);
    });
    it('unitRange maps each column onto 0 to 1, lowest reading first', () => {
      filled(unitRange, 'Step 6 is still empty: unitRange is null.');
      expect(unitRange.shape, 'Same shape as the batch: four readings, two features.').toEqual([4, 2]);
      const rows = unitRange.arraySync();
      const col = (c) => rows.map((r) => r[c]);
      for (const c of [0, 1]) {
        expect(Math.min.apply(null, col(c)), 'The lowest reading in each column lands on 0.').toBeCloseTo(0, 5);
        expect(Math.max.apply(null, col(c)), 'The highest reading in each column lands on 1.').toBeCloseTo(1, 5);
      }
      expect(rows[2][0], 'Reading three sits four of the six degrees up the temperature range.').toBeCloseTo(0.6667, 3);
      expect(rows[2][1], 'And a third of the way up the signal range.').toBeCloseTo(0.3333, 3);
      recordResult({
        kind: 'table', title: 'The same batch with min-max scaling',
        summary: 'Your unitRange output, using each feature\'s fitted minimum and maximum.',
        columns: ['Reading', 'Temperature scaled', 'Signal strength scaled'],
        rows: rows.map((row, i) => [i + 1, ...row]),
      });
    });
    it('keeps true zero statistics and handles a constant feature without NaN', () => {
      const rows = tf.tensor2d([[7, 10], [7, 14]]);
      const stats = fitStats(rows);
      filled(stats && stats.std, 'Return the measured standard deviation, including zero.');
      expect(Array.from(stats.std.dataSync())).toEqual([0, 2]);
      const normalized = scaleFeatures(rows, stats.mean, stats.std);
      filled(normalized, 'scaleFeatures must return the scaled tensor.');
      expect(normalized.arraySync()).toEqual([[0, -1], [0, 1]]);
      const future = scaleFeatures(tf.tensor1d([9, 16]), stats.mean, stats.std);
      expect(future.arraySync(), 'Reuse the saved scale; a zero scale uses divisor 1.').toEqual([2, 2]);
      expect(Array.from(stats.std.dataSync()), 'Do not replace the measured zero in the saved statistics.').toEqual([0, 2]);
      const bounds = minMaxStats(rows);
      const unit = scaleFeatures(rows, bounds.min, bounds.max.sub(bounds.min));
      expect(unit.arraySync()).toEqual([[0, 0], [0, 1]]);
    });
  });
