solutionCode: |
  const batch = tf.tensor2d([
    [20, 0.2],
    [22, 0.8],
    [24, 0.4],
    [26, 0.6],
  ]);

  const KERNEL = [[0.9], [-1.4]];
  const BIAS = [-0.3];

  const moments = tf.moments(batch, 0);
  const mean = moments.mean;
  const std = moments.variance.sqrt();

  const normalized = batch.sub(mean).div(std);

  const previewModel = tf.sequential();
  previewModel.add(tf.layers.dense({ units: 1, activation: 'sigmoid', inputShape: [2] }));
  previewModel.setWeights([tf.tensor2d(KERNEL), tf.tensor1d(BIAS)]);

  const scores = previewModel.predict(normalized);

  function scoreReading(reading) {
    const z = reading.sub(mean).div(std);
    return previewModel.predict(z.reshape([1, 2]));
  }
testCode: |
  describe('Normalize, Then Ask the Preview Neuron', () => {
    it('per-column mean is [23, 0.5]', () => {
      const m = Array.from(mean.dataSync());
      expect(m[0]).toBeCloseTo(23, 4);
      expect(m[1]).toBeCloseTo(0.5, 4);
    });
    it('normalized columns have mean ~0 and std ~1', () => {
      const colMeans = Array.from(normalized.mean(0).dataSync());
      expect(Math.abs(colMeans[0])).toBeLessThan(1e-5);
      expect(Math.abs(colMeans[1])).toBeLessThan(1e-5);
      const stds = Array.from(tf.moments(normalized, 0).variance.sqrt().dataSync());
      expect(stds[0]).toBeCloseTo(1, 4);
      expect(stds[1]).toBeCloseTo(1, 4);
    });
    it('previewModel is a real dense layer carrying the frozen weights', () => {
      const w = previewModel.getWeights();
      expect(w).toHaveLength(2);
      expect(w[0].shape).toEqual([2, 1]);
      const k = Array.from(w[0].dataSync());
      expect(k[0]).toBeCloseTo(0.9, 5);
      expect(k[1]).toBeCloseTo(-1.4, 5);
      expect(w[1].dataSync()[0]).toBeCloseTo(-0.3, 5);
    });
    it('scores = predict(normalized): one sigmoid verdict per reading', () => {
      expect(scores.shape).toEqual([4, 1]);
      const s = Array.from(scores.dataSync());
      expect(s[0]).toBeCloseTo(0.5917, 3);
      expect(s[1]).toBeCloseTo(0.0704, 3);
      expect(s[2]).toBeCloseTo(0.6745, 3);
      expect(s[3]).toBeCloseTo(0.5699, 3);
    });
    it('the neuron computes on inputs it has never seen', () => {
      const out = previewModel.predict(tf.tensor2d([[1, -1]]));
      expect(out.dataSync()[0]).toBeCloseTo(0.8808, 3);
    });
    it('scoreReading applies the SAVED stats, then asks the neuron', () => {
      const centre = scoreReading(tf.tensor([23, 0.5]));
      expect(centre.dataSync()[0]).toBeCloseTo(0.4256, 3);
      const archived = scoreReading(tf.tensor([24, 0.51]));
      expect(archived.dataSync()[0]).toBeCloseTo(0.51, 3);
    });
  });
