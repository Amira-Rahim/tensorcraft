slug: normalize-data
lessonSlug: normalization
title: "Normalize, Then Ask the Preview Neuron"
instructions: |
  Normalize a batch of four readings, then score them with Farah's fixed preview
  neuron. Each row has two features: temperature and signal strength. Save the
  training statistics so a later reading receives the same transformation.

  1. Implement `fitStats(rows)` for a non-empty `[n, 2]` tensor with finite values. Return `{ mean, std }`
     as two per-feature tensors. Reduce over axis 0 and use population standard
     deviation (divide squared deviations by n). `tf.moments` returns variance;
     take its square root for std. Apply the function to `batch`, saving `mean`
     and `std`.
  2. Implement `scaleFeatures(rows, offset, scale)` for a 1D reading or 2D batch.
     Subtract the per-feature offset and divide by scale. When scale is zero,
     use divisor 1 without changing the saved statistics. The lesson shows
     `tf.where` for this choice. Set `normalized` using the saved mean and std.
  3. Build `previewModel` as a real `tf.sequential()` model with one dense sigmoid
     unit and input shape `[2]`. Set its weights from `KERNEL` and `BIAS`: the
     kernel is a `[2, 1]` tensor and the bias is a `[1]` tensor, in that order.
  4. Predict on `normalized` in one batch. Save the `[4, 1]` output as `scores`.
  5. Implement `scoreReading(reading)` for a new `[2]` tensor. Reuse the saved
     mean and std, add a batch axis, and predict with `previewModel`. Return the
     prediction tensor or its single number. This must work after the original
     training batch is disposed; do not fit statistics again.
  6. Implement `minMaxStats(rows)` returning per-feature `{ min, max }` tensors
     for a non-empty `[n, 2]` batch with finite values. Use `scaleFeatures` with the minimum and range to
     produce `unitRange` for the original batch. Its nonconstant columns span
     0 to 1; constant columns become zero.

  Both statistics functions must work on new batches of different lengths,
  including a constant feature. With the zero-scale rule, a changed future
  value becomes its difference from the saved offset. That is a numerical
  policy, not evidence that the model learned how to handle the new variation.
