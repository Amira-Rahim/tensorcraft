slug: normalize-data
lessonSlug: normalization
title: "Normalize, Then Ask the Preview Neuron"
instructions: |
  Help Farah scale four readings, then run them through her supplied model.
  Each row has temperature and signal strength. Save the training statistics
  so you can use them for later readings too.

  1. Implement `fitStats(rows)` for a non-empty `[n, 2]` tensor of finite values.
     Return `{ mean, std }`, one value per column in each tensor. Reduce over
     axis 0. Use population variance, the mean squared difference from the column
     mean. It divides by `n`. `tf.moments` returns that variance; take its
     square root to get `std`. Apply this function to `batch` and save `mean` and `std`.
  2. Implement `scaleFeatures(rows, offset, scale)` for one reading or a batch.
     Subtract each column's offset, then divide by its scale. If a scale is
     zero, divide by 1 instead. Keep the saved statistics unchanged.
     The lesson shows how to choose the divisor with `tf.where`.
     Save the scaled `batch` as `normalized`, using the saved mean and std.
  3. Use the supplied `previewModel`. Model construction is provided.
     Its weights and bias are already set; your work is scaling the inputs.
  4. Predict on `normalized` in one call. Save the `[4, 1]` tensor as `scores`.
  5. Implement `scoreReading(reading)` for a new `[2]` tensor. Scale it using
     the saved mean and std, add a batch axis, then call `previewModel`.
     Return the prediction tensor or its one numerical value. This must still
     work after `batch` is disposed. Do not calculate the statistics again.
  6. Implement `minMaxStats(rows)` for a non-empty `[n, 2]` tensor of finite
     values. Return `{ min, max }` tensors with one value per column.
     Use `scaleFeatures` with the minimum and range (`max - min`) to scale
     the original batch into `unitRange`. Nonconstant columns should span
     0 to 1. Constant columns should become zero.

  Both statistics functions must work on batches of different lengths,
  including columns with only one repeated value. With a zero scale, a changed
  future reading becomes its difference from the saved offset. This avoids
  division by zero. It does not prove the model can handle that new variation.
