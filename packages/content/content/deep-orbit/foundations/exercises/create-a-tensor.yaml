slug: create-a-tensor
lessonSlug: introduction-to-tensors
title: "Prepare the Five Readings"
instructions: |
  Help Demir prepare the five sensor readings for TensorFlow.js.
  Replace the two `null` values:

  1. Create `reading` with `tf.tensor(streamValues)`.
  2. Save `reading.shape` in `shape`. It should be `[5]`, meaning the tensor holds a list of five numbers.

  TensorFlow.js is already available as `tf`. The supplied lines copy the
  values for Farah and release the tensor's memory. Leave them in place,
  then select Run Tests to check that all five readings are present and in order.
starterCode: |
  const streamValues = [0.12, 0.94, 0.31, 0.88, 0.47];

  // Your work: replace the two nulls.
  const reading = null;
  const shape = null;

  // Supplied: copy the readings into a JavaScript array for Farah.
  const values = reading?.arraySync();
  // Supplied: release memory after copying the values.
  reading?.dispose();
solutionCode: |
  const streamValues = [0.12, 0.94, 0.31, 0.88, 0.47];
  const reading = tf.tensor(streamValues);
  const shape = reading.shape;
  const values = reading.arraySync();
  reading?.dispose();
testCode: |
  describe('Prepare the Five Readings', () => {
    // Capture readback calls made by the exercise, before grading begins.
    const reads = (tf.__calls['tensor.arraySync'] || 0)
      + (tf.__calls['tensor.dataSync'] || 0)
      + (tf.__calls['tensor.array'] || 0)
      + (tf.__calls['tensor.data'] || 0);
    const source = [0.12, 0.94, 0.31, 0.88, 0.47];

    it('reading is a TensorFlow.js tensor', () => {
      expect(
        reading instanceof tf.Tensor,
        'Replace reading’s null with tf.tensor(streamValues).',
      ).toBe(true);
    });
    it('the tensor holds a list of five numbers', () => {
      expect(reading?.size, 'Include all five readings from streamValues.').toBe(5);
      expect(reading?.shape, 'Pass the flat array directly to tf.tensor.').toEqual([5]);
    });
    it('shape is [5]', () => {
      expect(shape, 'Save reading.shape in shape before the cleanup line.').toEqual([5]);
    });
    it('values contains the five readings in order', () => {
      expect(
        Array.isArray(values),
        'Keep the supplied values = reading?.arraySync() line after creating the tensor.',
      ).toBe(true);
      expect(values.length, 'Keep all five readings.').toBe(5);
      for (let i = 0; i < source.length; i++) {
        expect(
          values[i],
          'Reading ' + (i + 1) + ' should match streamValues at the same position.',
        ).toBeCloseTo(source[i], 6);
      }
      expect(
        reads,
        'Keep the supplied readback line so the values come from the tensor.',
      ).toBeGreaterThan(0);
    });
    it('the provided cleanup runs after the values are saved', () => {
      expect(reading?.isDisposed, 'Keep the provided cleanup line at the end.').toBe(true);
      expect(
        () => reading.dataSync(),
        'The provided cleanup should release the tensor after you read it.',
      ).toThrow('Tensor is disposed');
    });
  });
estimatedMinutes: 4
