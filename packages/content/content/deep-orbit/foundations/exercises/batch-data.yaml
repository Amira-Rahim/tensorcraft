solutionCode: |
  let readCount = 0;
  function readSample(i) {
    readCount++;
    return { features: [i * 100, i, i / 10], label: i % 2 };
  }

  function* sensorGen() {
    for (let i = 0; i < 16; i++) {
      const row = readSample(i);
      yield { xs: tf.tensor(row.features), ys: tf.tensor([row.label]) };
    }
  }

  function makeDataset(source) {
    return source.shuffle(10).batch(4);
  }
  const dataset = makeDataset(tf.data.generator(sensorGen));

  const batchShapes = [];
  await dataset.forEachAsync((b) => {
    batchShapes.push(b.xs.shape);
  });

  const trainIdx = Array.from(tf.util.createShuffledIndices(12));
  const valIdx = Array.from({ length: 4 }, (_, i) => i + 12);
testCode: |
  describe('Lazy Pipeline', () => {
    const filled = (value, what) => expect(value, what).toBeDefined();
    it('produced 4 batches of 4', () => {
      expect(
        batchShapes.length,
        'Sixteen samples at four per batch. A count of zero means the dataset was never drained.',
      ).toBe(4);
      expect(
        batchShapes[0],
        'Each batch stacks its samples into one tensor, so a batch carries an axis the samples do not.',
      ).toEqual([4, 3]);
    });
    it('every batch has the [batch, features] shape', () => {
      // An empty batchShapes used to clear this test for free, which handed
      // the untouched starter a green line on its first run (measured
      // 2026-09-08).
      expect(
        batchShapes.length,
        'There are no shapes to check yet, so this test had nothing to say. Drain the dataset and push each batch xs shape into batchShapes.',
      ).toBeGreaterThan(0);
      for (const s of batchShapes) {
        expect(s, 'Four samples, three features each, on every batch including the last.').toEqual([
          4, 3,
        ]);
      }
    });
    it('read all 16 samples through the lazy reader', () => {
      expect(
        readCount,
        'readSample counts its own calls. Every sample has to come through it, and none of them twice.',
      ).toBe(16);
    });
    it('reads lazily and re-drains: batches are not frozen blocks', async () => {
      filled(
        dataset,
        'The pipeline is still null. Build it from the generator, then shuffle, then batch.',
      );
      const drain = async () => {
        const shapes = [];
        const groups = [];
        await dataset.forEachAsync((b) => {
          shapes.push({ xs: b.xs.shape, ys: b.ys.shape });
          const ids = b.xs.arraySync().map((row) => row[0]);
          groups.push(
            ids
              .slice()
              .sort((x, y) => x - y)
              .join(','),
          );
        });
        return { shapes, membership: groups.slice().sort().join(' | ') };
      };
      const first = await drain();
      expect(first.shapes.length, 'Four batches per pass over sixteen samples.').toBe(4);
      first.shapes.forEach((s) => {
        expect(s.xs, 'Four samples, three features each.').toEqual([4, 3]);
        expect(
          s.ys,
          'The labels stack into a column, one label per row of the batch, so each sample yields its label as a tensor with an axis rather than a bare number.',
        ).toEqual([4, 1]);
      });
      expect(
        readCount,
        'A second pass over the dataset reads the archive again. A generator that cached its rows would not.',
      ).toBe(32);
      await drain();
      expect(readCount, 'Third pass, sixteen more reads.').toBe(48);
      // Laziness is only visible mid-drain, and inside YOUR pipeline the
      // shuffle buffer hides it. On tfjs 4.22.0 a lazy generator has read 14
      // rows when batch one arrives out of shuffle(10) and all 16 out of
      // shuffle(16), and 16 is also what a generator reads when it fills an
      // array before its first yield. So a count taken through the shuffle
      // cannot tell eager loading from a big buffer.
      //
      // sensorGen drained with no shuffle and ONE sample per batch is where
      // they part company, and the batch size is the whole point of this
      // probe. Measured 2026-09-08 on tfjs 4.22.0, reads before batch one:
      //
      //   pipeline      lazy   4-row chunks   2-row chunks   eager array
      //   batch(4)         4              4              4            16
      //   batch(1)         1              4              2            16
      //
      // Batching four at a time cannot see a reader that fetches four at a
      // time, and the same held for a reader fetching two. Asking for one
      // sample admits exactly one answer: a generator that reads a row per
      // turn of the loop has read one row, and any reader that buys its rows
      // in blocks has read a block.
      const bare = tf.data.generator(sensorGen).batch(1);
      const startCount = readCount;
      let readsAtFirstBatch = -1;
      let bareBatches = 0;
      const rowsSeen = [];
      // One sample per batch and no shuffle, so every batch here carries one
      // archive row and its first feature says which row that is. This drain
      // is also the only place the file looks at what the features and the
      // label HOLD: before these four assertions (round 7, 2026-09-13), a
      // generator that called readSample(i) purely to move the counter and
      // then yielded invented numbers with a label of zero cleared all four
      // tests, and feature and label are the two words this lesson defines.
      await bare.forEachAsync((b) => {
        if (readsAtFirstBatch < 0) readsAtFirstBatch = readCount - startCount;
        bareBatches++;
        const xs = b.xs.arraySync()[0];
        const ys = b.ys.arraySync()[0];
        const i = Math.round(xs[0] / 100);
        rowsSeen.push(i);
        const featureWhy =
          'A batch carried three numbers the archive never handed out. xs is the row readSample returned, in the order it returned it: amplitude in counts, frequency as a zero-crossing count, phase in radians.';
        expect(xs.length, featureWhy).toBe(3);
        expect(xs[0], featureWhy).toBeCloseTo(i * 100, 3);
        expect(xs[1], featureWhy).toBeCloseTo(i, 5);
        expect(xs[2], featureWhy).toBeCloseTo(i / 10, 5);
        expect(
          ys,
          'ys has to carry the label that arrived beside those features, for that same row. A label invented in the generator teaches the model nothing about the reading it sits next to.',
        ).toEqual([i % 2]);
      });
      expect(
        rowsSeen.slice().sort((x, y) => x - y),
        'Every row the archive holds has to reach the pipeline once, with its own features. A generator that yields the same reading sixteen times reads sixteen rows and passes on none of them.',
      ).toEqual(Array.from({ length: 16 }, (_, n) => n));
      expect(
        readsAtFirstBatch,
        'One sample was asked for and the generator read more than one row to answer, so it is buying rows in blocks rather than yielding them as they are read. The whole archive is never supposed to be in flight at once, and neither is a block of it.',
      ).toBe(1);
      expect(bareBatches, 'Sixteen samples, one per batch.').toBe(16);
      expect(readCount - startCount, 'Every sample read once, none read twice.').toBe(16);
    });
    it('splits the 16 readings 12 and 4 on indices, disjoint and complete', () => {
      filled(trainIdx, 'trainIdx is still null. Deal the indices once and cut off the first twelve.');
      filled(valIdx, 'valIdx is still null. The other four indices are the held-out set.');
      const train = Array.from(trainIdx);
      const val = Array.from(valIdx);
      expect(train.length, 'Twelve readings train.').toBe(12);
      expect(val.length, 'Four readings are held out.').toBe(4);
      const all = train
        .concat(val)
        .slice()
        .sort((a, b) => a - b);
      expect(
        all,
        'Together the two sides cover every reading exactly once: no index missing, none on both sides. A reading the model trained on has no business in the validation set, and a reading on neither side was thrown away.',
      ).toEqual(Array.from({ length: 16 }, (_, i) => i));
      expect(
        train.slice().sort((a, b) => a - b),
        'Training uses the earlier readings, even when their order is shuffled.',
      ).toEqual(Array.from({ length: 12 }, (_, i) => i));
      expect(
        val,
        'Validation must represent later readings. Mixing future rows into training defeats this split.',
      ).toEqual([12, 13, 14, 15]);
    });
  });

  it('shuffles individual samples before forming batches', () => {
    const calls = [];
    const result = {};
    const source = {
      shuffle: (size) => {
        calls.push(['shuffle', size]);
        return {
          batch: (n) => {
            calls.push(['batch', n]);
            return result;
          },
        };
      },
      batch: () => {
        throw new Error('Shuffle the samples before batching');
      },
    };
    expect(makeDataset(source)).toBe(result);
    expect(calls).toEqual([
      ['shuffle', 10],
      ['batch', 4],
    ]);
  });
