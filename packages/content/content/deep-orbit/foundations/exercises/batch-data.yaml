slug: batch-data
lessonSlug: data-loading
title: "The lazy data pipeline"
instructions: |
  Help Demir process a small practice archive of 16 rows. The supplied
  `readSample(i)` returns three features and one label. It counts every read.

  1. Complete `sensorGen` as a generator for IDs 0 through 15. Read one sample
     inside the loop, then yield `{ xs, ys }` tensors. Give `xs` shape `[3]`
     and `ys` shape `[1]`. Do not read the whole archive before yielding.
  2. Implement `makeDataset(source)`: shuffle with buffer size 10, then batch
     with size 4. Pass `tf.data.generator(sensorGen)` into it. This shuffles
     individual samples. Two random runs may happen to produce the same groups.
  3. Await `dataset.forEachAsync` and add each batch's `xs.shape` to
     `batchShapes`. There should be four `[4, 3]` batches. Wait until reading
     finishes before the code ends. The generator must also support a second pass.
  4. Set JavaScript arrays `trainIdx` and `valIdx`. IDs 0-11 go in training.
     IDs 12-15 go in validation. You can shuffle the training order with
     `tf.util.createShuffledIndices(12)`. No ID may belong to both sets.

  This first pipeline uses all 16 rows to demonstrate batching. A training run
  would read only `trainIdx`. The three features are amplitude, zero-crossing
  count, and phase, in that order. The practice values depend on each row's ID
  so the tests can check which readings reach the pipeline.
starterCode: |
  // Provided: lazy archive access (do NOT modify)
  let readCount = 0;
  function readSample(i) {
    readCount++;
    // [amplitude, zero-crossing count, phase], stand-in values keyed to i
    return { features: [i * 100, i, i / 10], label: i % 2 };
  }

  // Read and yield one sample at a time. Do not collect the archive
  // before yielding the first sample.
  function* sensorGen() {
    // your code here
  }

  // Decide whether to shuffle samples or whole batches.
  // The order of these two steps changes the result.
  function makeDataset(source) {
    return null; // your code here
  }
  const dataset = makeDataset(tf.data.generator(sensorGen));

  // Save each batch shape here. Await forEachAsync so all batches
  // have been processed before the tests run.
  const batchShapes = [];

  // IDs follow recording time. Keep the later readings out of training.
  // Return plain arrays. Training order may vary within its assigned set.
  const trainIdx = null;
  const valIdx = null;
solutionCode: |
  let readCount = 0;
  function readSample(i) {
    readCount++;
    return { features: [i * 100, i, i / 10], label: i % 2 };
  }

  function* sensorGen() {
    for (let i = 0; i < 16; i++) {
      const row = readSample(i);
      yield { xs: tf.tensor(row.features), ys: tf.tensor([row.label]) };
    }
  }

  function makeDataset(source) {
    return source.shuffle(10).batch(4);
  }
  const dataset = makeDataset(tf.data.generator(sensorGen));

  const batchShapes = [];
  await dataset.forEachAsync((b) => {
    batchShapes.push(b.xs.shape);
  });

  const trainIdx = Array.from(tf.util.createShuffledIndices(12));
  const valIdx = Array.from({ length: 4 }, (_, i) => i + 12);
testCode: |
  describe('Lazy Pipeline', () => {
    const filled = (value, what) => expect(value, what).toBeDefined();
    it('produced 4 batches of 4', () => {
      expect(
        batchShapes.length,
        'Sixteen samples at four per batch. A count of zero means your loop never consumed the dataset.',
      ).toBe(4);
      expect(
        batchShapes[0],
        'Each batch stacks its samples into one tensor, so a batch carries an axis the samples do not.',
      ).toEqual([4, 3]);
      recordResult({
        kind: 'table', title: 'Batches read by your loader',
        summary: 'The batch shapes your loader saved while reading the 16-row practice archive.',
        columns: ['Batch', 'Readings', 'Features'],
        rows: batchShapes.map((shape, i) => [i + 1, shape[0], shape[1]]),
      });
    });
    it('every batch has the [batch, features] shape', () => {
      // An empty batchShapes used to clear this test for free, which handed
      // the untouched starter a green line on its first run (measured
      // 2026-09-08).
      expect(
        batchShapes.length,
        'batchShapes is empty. Await the dataset read and add each batch\'s xs.shape.',
      ).toBeGreaterThan(0);
      for (const s of batchShapes) {
        expect(s, 'Four samples, three features each, on every batch including the last.').toEqual([
          4, 3,
        ]);
      }
    });
    it('read all 16 samples through the lazy reader', () => {
      expect(
        readCount,
        'readSample counts its own calls. Every sample has to come through it, and none of them twice.',
      ).toBe(16);
    });
    it('reads on demand and can read all samples again', async () => {
      filled(
        dataset,
        'The pipeline is still null. Build it from the generator, then shuffle, then batch.',
      );
      const drain = async () => {
        const shapes = [];
        const groups = [];
        await dataset.forEachAsync((b) => {
          shapes.push({ xs: b.xs.shape, ys: b.ys.shape });
          const ids = b.xs.arraySync().map((row) => row[0]);
          groups.push(
            ids
              .slice()
              .sort((x, y) => x - y)
              .join(','),
          );
        });
        return { shapes, membership: groups.slice().sort().join(' | ') };
      };
      const first = await drain();
      expect(first.shapes.length, 'Four batches per pass over sixteen samples.').toBe(4);
      first.shapes.forEach((s) => {
        expect(s.xs, 'Four samples, three features each.').toEqual([4, 3]);
        expect(
          s.ys,
          'Each sample needs a label tensor shaped [1]. The labels then stack into one column, with one label per row.',
        ).toEqual([4, 1]);
      });
      expect(
        readCount,
        'A second pass over the dataset reads the archive again. A generator that cached its rows would not.',
      ).toBe(32);
      await drain();
      expect(readCount, 'Third pass, sixteen more reads.').toBe(48);
      // Laziness is only visible mid-drain, and inside YOUR pipeline the
      // shuffle buffer hides it. On tfjs 4.22.0 a lazy generator has read 14
      // rows when batch one arrives out of shuffle(10) and all 16 out of
      // shuffle(16), and 16 is also what a generator reads when it fills an
      // array before its first yield. So a count taken through the shuffle
      // cannot tell eager loading from a big buffer.
      //
      // sensorGen drained with no shuffle and ONE sample per batch is where
      // they part company, and the batch size is the whole point of this
      // probe. Measured 2026-09-08 on tfjs 4.22.0, reads before batch one:
      //
      //   pipeline      lazy   4-row chunks   2-row chunks   eager array
      //   batch(4)         4              4              4            16
      //   batch(1)         1              4              2            16
      //
      // Batching four at a time cannot see a reader that fetches four at a
      // time, and the same held for a reader fetching two. Asking for one
      // sample admits exactly one answer: a generator that reads a row per
      // turn of the loop has read one row, and any reader that buys its rows
      // in blocks has read a block.
      const bare = tf.data.generator(sensorGen).batch(1);
      const startCount = readCount;
      let readsAtFirstBatch = -1;
      let bareBatches = 0;
      const rowsSeen = [];
      const previewRows = [];
      // One sample per batch and no shuffle, so every batch here carries one
      // archive row and its first feature says which row that is. This drain
      // is also the only place the file looks at what the features and the
      // label HOLD: before these four assertions (round 7, 2026-09-13), a
      // generator that called readSample(i) purely to move the counter and
      // then yielded invented numbers with a label of zero cleared all four
      // tests, and feature and label are the two words this lesson defines.
      await bare.forEachAsync((b) => {
        if (readsAtFirstBatch < 0) readsAtFirstBatch = readCount - startCount;
        bareBatches++;
        const xs = b.xs.arraySync()[0];
        const ys = b.ys.arraySync()[0];
        const i = Math.round(xs[0] / 100);
        rowsSeen.push(i);
        previewRows.push([i, ...xs, ys[0]]);
        const featureWhy =
          'Use the features returned by readSample in their original order: amplitude, zero-crossing count, and phase.';
        expect(xs.length, featureWhy).toBe(3);
        expect(xs[0], featureWhy).toBeCloseTo(i * 100, 3);
        expect(xs[1], featureWhy).toBeCloseTo(i, 5);
        expect(xs[2], featureWhy).toBeCloseTo(i / 10, 5);
        expect(
          ys,
          'Keep each row\'s label paired with its own features. Do not make up a different label in the generator.',
        ).toEqual([i % 2]);
      });
      expect(
        rowsSeen.slice().sort((x, y) => x - y),
        'Read and yield every archive row exactly once, with its own features. Repeating one row does not meet the task.',
      ).toEqual(Array.from({ length: 16 }, (_, n) => n));
      expect(
        readsAtFirstBatch,
        'Read only one archive row when the consumer requests one sample. Do not read a group of rows before yielding the first.',
      ).toBe(1);
      expect(bareBatches, 'Sixteen samples, one per batch.').toBe(16);
      expect(readCount - startCount, 'Every sample read once, none read twice.').toBe(16);
      recordResult({
        kind: 'table', title: 'Readings yielded by your generator',
        summary: 'Rows returned by your generator before shuffling. These practice values come from the row IDs. They are not measurements from the ship.',
        columns: ['Row ID', 'Amplitude', 'Zero-crossing count', 'Phase', 'Label'],
        rows: previewRows,
      });
    });
    it('assigns all 16 readings to separate training and validation sets of 12 and 4', () => {
      filled(trainIdx, 'trainIdx is still null. Use IDs 0 through 11 for training.');
      filled(valIdx, 'valIdx is still null. Use IDs 12 through 15 for validation.');
      const train = Array.from(trainIdx);
      const val = Array.from(valIdx);
      expect(train.length, 'Twelve readings train.').toBe(12);
      expect(val.length, 'Reserve four readings for validation.').toBe(4);
      const all = train
        .concat(val)
        .slice()
        .sort((a, b) => a - b);
      expect(
        all,
        'Every row ID must be in exactly one set. No ID may be missing or shared between training and validation.',
      ).toEqual(Array.from({ length: 16 }, (_, i) => i));
      expect(
        train.slice().sort((a, b) => a - b),
        'Training uses the earlier readings, even when the shuffle changes their order.',
      ).toEqual(Array.from({ length: 12 }, (_, i) => i));
      expect(
        val,
        'Validation must represent later readings. Mixing future rows into training defeats this split.',
      ).toEqual([12, 13, 14, 15]);
      recordResult({
        kind: 'table', title: 'The saved time split',
        summary: 'Your training order and later validation IDs. This task trains no model.',
        columns: ['Split', 'Row ID'],
        rows: [...train.map((id) => ['Training', id]), ...val.map((id) => ['Validation', id])],
      });
    });
  });

  it('shuffles individual samples before forming batches', () => {
    const calls = [];
    const result = {};
    const source = {
      shuffle: (size) => {
        calls.push(['shuffle', size]);
        return {
          batch: (n) => {
            calls.push(['batch', n]);
            return result;
          },
        };
      },
      batch: () => {
        throw new Error('Shuffle the samples before batching');
      },
    };
    expect(makeDataset(source)).toBe(result);
    expect(calls).toEqual([
      ['shuffle', 10],
      ['batch', 4],
    ]);
  });
