slug: reshape-tensor
lessonSlug: tensor-shapes
title: "Find the Signal's Layout"
instructions: |
  `flat` holds 12 sensor readings. Each group of four comes from the same moment.

  1. Before running the code, work out which four numbers go in the second row.
  2. Use `reshape()` on `flat` to make a tensor named `grid` with shape `[3, 4]`.
  3. Read the second row into a JavaScript array named `step1`. The second row
     is at index `1`, since JavaScript counts from `0`.

  Use the original `flat` tensor so `grid` shares its data in memory. Do not
  create a new tensor by typing the readings again.

  The tests check all three rows. Keep `grid` for the tests. You can dispose
  of `flat` afterward.
starterCode: |
  const flat = tf.tensor([3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8]);

  // Predict the second row before running the code.
  const grid = null; // your code here

  // Save the second row as a JS array, not a tensor.
  const step1 = null;
solutionCode: "const flat = tf.tensor([3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8]);\n\nconst grid = flat.reshape([3, 4]);\n\nconst step1 = grid.arraySync()[1];"
testCode: |
  describe('Signal Layout', () => {
    // Expected rows are sliced out of a private copy of the readings, so no
    // test name hands the learner the row it is asking for. The copy is
    // private on purpose. Reading `flat.dataSync()` here threw "Tensor is
    // disposed." for anyone who released `flat` after reshaping, which is the
    // habit lesson 1 teaches, and it destroyed all five tests from the suite
    // body. It also let a submission redefine `flat` as twelve zeros and then
    // satisfy the grader's own expectations (both measured 2026-09-08).
    const source = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8];
    const filled = (value, what) => expect(value, what).toBeDefined();
    const isTensor = (value) =>
      expect(
        value instanceof tf.Tensor,
        'grid must be a TensorFlow.js tensor, not a JavaScript object with matching properties.',
      ).toBe(true);
    // Rows are read back THROUGH the tensor, not through whatever arraySync()
    // the submission supplies. Before this (round 7, 2026-09-13), an object
    // literal carrying shape, flat's dataId and an arraySync() that returned
    // three slices of flat.dataSync() cleared all six tests without running a
    // single tensor op.
    const rowsOf = () => {
      isTensor(grid);
      const parts = tf.unstack(grid);
      const out = parts.map((row) => Array.from(row.dataSync()));
      parts.forEach((row) => row.dispose());
      return out;
    };
    it('grid has shape [3, 4]', () => {
      filled(grid, 'grid is still empty. Reshape flat into three rows of four.');
      expect(grid.shape, 'grid needs 3 rows and 4 columns.').toEqual([3, 4]);
    });
    it('grid reuses the data from flat', () => {
      // Provenance, not values. On tfjs 4.22.0 a reshape hands back a tensor
      // that SHARES its source's data buffer, so grid.dataId === flat.dataId.
      // Measured 2026-09-08: reshape(), tf.reshape(), as2D() and clone() all
      // keep the source dataId, and the comparison still holds after `flat`
      // is disposed, which the instructions allow. A grid typed out with
      // tf.tensor2d, or rebuilt from arraySync(), allocates a second buffer,
      // and that is exactly what lets it hold anything at all: before this
      // check, a hand-typed [3, 4] grid cleared every other test in the file.
      filled(grid, 'grid is still empty.');
      isTensor(grid);
      expect(
        grid.dataId === flat.dataId,
        'Use reshape() on flat itself. grid must reuse its data in memory. Creating a new tensor with the same numbers does not meet this requirement.',
      ).toBe(true);
    });
    it('the first row keeps the first readings in order', () => {
      filled(grid, 'grid is still empty.');
      const rows = rowsOf();
      expect(
        rows[0],
        'The first row must hold the first four readings in their original order.',
      ).toEqual(source.slice(0, 4));
    });
    it('middle row lands correctly', () => {
      filled(grid, 'grid is still empty.');
      const rows = rowsOf();
      expect(
        rows[1],
        'Skip the first four readings, then take the next four in order.',
      ).toEqual(source.slice(4, 8));
    });
    it('last row lands correctly', () => {
      filled(grid, 'grid is still empty.');
      const rows = rowsOf();
      expect(rows[2], 'The last row must hold the final four readings in order.').toEqual(
        source.slice(8, 12),
      );
    });
    it('step1 holds the second row as a JavaScript array', () => {
      filled(step1, 'step1 is still empty. Read row index 1 from grid.');
      expect(
        Array.isArray(step1),
        'step1 must be a JavaScript array of four numbers. arraySync() gives you nested arrays. Select the second row from those arrays. tf.slice() alone still returns a tensor.',
      ).toBe(true);
      expect(
        step1,
        'Take the whole second row: all four sensor readings from that time step.',
      ).toEqual(source.slice(4, 8));
    });
  });
estimatedMinutes: 8
difficulty: beginner
