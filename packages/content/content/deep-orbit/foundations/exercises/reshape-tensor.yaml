slug: reshape-tensor
lessonSlug: tensor-shapes
title: "Prepare Farah's Sensor Chart"
instructions: |
  Farah takes 12 more readings from Demir's recording: the same four sensors
  at three later moments. They are already in `flat`, ready to arrange.
  The recording notes label these sensors A, B, C, and D, in that order at each moment.

  1. Before running the code, predict which four readings go in the second row.
  2. Use `reshape()` on `flat` to create `grid` with shape `[3, 4]`.
     Each row is one moment. Each column is one sensor.
  3. Save the second row as a JavaScript array named `step1`.
     Use row index `1`, since JavaScript counts from `0`.
  4. Farah's chart needs one row per sensor, with its readings in time order.
     Use `transpose()` on `grid` to create `bySensor` with shape `[4, 3]`.

  Use the supplied tensors. Do not type out new tensors containing the answers.
  Keep `grid` and `bySensor` for the tests. You can dispose of `flat` after
  creating `grid`.
starterCode: |
  // Selected from Demir's recording: sensors A, B, C, D at three moments.
  // Each group of four keeps the sensor order from the recording notes.
  const flat = tf.tensor([3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8]);

  // Predict the second row, then make one row per moment.
  const grid = null; // your code here

  // Save the second row as a JS array, not a tensor.
  const step1 = null;

  // Give the chart one row per sensor, in time order.
  const bySensor = null;
solutionCode: "const flat = tf.tensor([3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8]);\n\nconst grid = flat.reshape([3, 4]);\n\nconst step1 = grid.arraySync()[1];\n\nconst bySensor = grid.transpose();"
testCode: |
  describe('Signal Layout', () => {
    // Expected values come from the recording, not a learner-controlled
    // tensor. This also lets learners dispose of flat after reshaping it.
    const source = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8];
    // Capture the submitted operation paths before grader readback runs.
    // These shared runtime records refer to actual input/output tensors,
    // so a dummy operation cannot validate a separately typed-out answer.
    const gridOperation = tf.__shapeOf(grid);
    const sensorOperation = tf.__shapeOf(bySensor);
    const filled = (value, what) => expect(value, what).toBeDefined();
    const isTensor = (value, name) =>
      expect(
        value instanceof tf.Tensor,
        name + ' must be a TensorFlow.js tensor, not a JavaScript object with matching properties.',
      ).toBe(true);
    // Read through TensorFlow.js rather than trusting a submitted arraySync
    // method. Fake objects must not pass by returning the expected arrays.
    const rowsOf = (tensor, name) => {
      isTensor(tensor, name);
      const parts = tf.unstack(tensor);
      try {
        return parts.map((row) => Array.from(row.dataSync()));
      } finally {
        parts.forEach((row) => row.dispose());
      }
    };
    it('grid has shape [3, 4]', () => {
      filled(grid, 'grid is still empty. Reshape flat into three rows of four.');
      isTensor(grid, 'grid');
      expect(grid.shape, 'grid needs 3 rows and 4 columns.').toEqual([3, 4]);
    });
    it('grid comes from reshaping flat', () => {
      isTensor(flat, 'flat');
      isTensor(grid, 'grid');
      expect(
        gridOperation && gridOperation.operation === 'reshape' && gridOperation.input === flat,
        'Use reshape() on flat itself to create grid. Do not create a new tensor from copied values.',
      ).toBe(true);
    });
    it('the first row keeps the first readings in order', () => {
      const rows = rowsOf(grid, 'grid');
      expect(
        rows[0],
        'The first row must hold the first four readings in their original order.',
      ).toEqual(source.slice(0, 4));
    });
    it('the second row keeps the next readings in order', () => {
      const rows = rowsOf(grid, 'grid');
      expect(
        rows[1],
        'Skip the first four readings, then take the next four in order.',
      ).toEqual(source.slice(4, 8));
    });
    it('the last row keeps the final readings in order', () => {
      const rows = rowsOf(grid, 'grid');
      expect(rows[2], 'The last row must hold the final four readings in order.').toEqual(
        source.slice(8, 12),
      );
    });
    it('step1 holds the second row as a JavaScript array', () => {
      filled(step1, 'step1 is still empty. Read row index 1 from grid.');
      expect(
        Array.isArray(step1),
        'step1 must be a JavaScript array. arraySync() gives you nested arrays. Select the second row from those arrays.',
      ).toBe(true);
      expect(
        step1,
        'Take the whole second row: all four sensor readings from that moment.',
      ).toEqual(source.slice(4, 8));
    });
    it('bySensor has shape [4, 3]', () => {
      isTensor(bySensor, 'bySensor');
      expect(bySensor.shape, 'The chart needs 4 sensor rows and 3 moments per row.').toEqual([4, 3]);
    });
    it('bySensor comes from transposing grid', () => {
      isTensor(bySensor, 'bySensor');
      expect(
        sensorOperation && sensorOperation.operation === 'transpose' && sensorOperation.input === grid,
        'Use transpose() on grid to create bySensor. Reshape keeps the flat order and mixes sensors in these rows.',
      ).toBe(true);
    });
    it('every sensor row keeps its readings in time order', () => {
      const rows = rowsOf(bySensor, 'bySensor');
      const expected = [0, 1, 2, 3].map((sensor) =>
        [0, 1, 2].map((moment) => source[moment * 4 + sensor]),
      );
      expect(
        rows,
        'Each row must contain one sensor across all three moments. Keep the moments in their original order.',
      ).toEqual(expected);
    });
  });
estimatedMinutes: 10
