slug: reshape-tensor
lessonSlug: tensor-shapes
title: "Find the Signal's Layout"
instructions: |
  Twelve readings arrived in `flat`. Farah proposes three time steps with four
  channels each.

  Reshape `flat` into a `[3, 4]` tensor called `grid`. Extract its second row
  (time step index 1) into `step1`, a plain JavaScript array of four numbers.
  Predict that row from the flat order before running your code.

  The checks compare all three rows and require `grid` to share `flat`'s
  buffer in this TFJS runtime. Reshape the supplied tensor rather than
  building a separate grid by hand. You may dispose `flat` afterward, but
  retain `grid` for the checks.
starterCode: |
  const flat = tf.tensor([3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8]);

  // Row-major fill settles which four readings land in the row you were
  // asked for. Work that out before you run anything.
  const grid = null; // your code here

  // step1 is a plain JS list of four numbers, which is not what a tensor
  // hands back.
  const step1 = null;
solutionCode: "const flat = tf.tensor([3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8]);\n\nconst grid = flat.reshape([3, 4]);\n\nconst step1 = grid.arraySync()[1];"
testCode: |
  describe('Signal Layout', () => {
    // Expected rows are sliced out of a private copy of the readings, so no
    // test name hands the learner the row it is asking for. The copy is
    // private on purpose. Reading `flat.dataSync()` here threw "Tensor is
    // disposed." for anyone who released `flat` after reshaping, which is the
    // habit lesson 1 teaches, and it destroyed all five tests from the suite
    // body. It also let a submission redefine `flat` as twelve zeros and then
    // satisfy the grader's own expectations (both measured 2026-09-08).
    const source = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8];
    const filled = (value, what) => expect(value, what).toBeDefined();
    const isTensor = (value) =>
      expect(
        value instanceof tf.Tensor,
        'shape, dataId and arraySync are ordinary object properties, so an object literal can carry all three. This asks whether tf produced the grid.',
      ).toBe(true);
    // Rows are read back THROUGH the tensor, not through whatever arraySync()
    // the submission supplies. Before this (round 7, 2026-09-13), an object
    // literal carrying shape, flat's dataId and an arraySync() that returned
    // three slices of flat.dataSync() cleared all six tests without running a
    // single tensor op.
    const rowsOf = () => {
      isTensor(grid);
      const parts = tf.unstack(grid);
      const out = parts.map((row) => Array.from(row.dataSync()));
      parts.forEach((row) => row.dispose());
      return out;
    };
    it('grid has shape [3, 4]', () => {
      filled(grid, 'Step 1 is still empty. Reshape flat into the layout Farah proposes.');
      expect(grid.shape, 'Three time steps, four channels in each.').toEqual([3, 4]);
    });
    it('grid is a view over flat, which is what makes it a reshape', () => {
      // Provenance, not values. On tfjs 4.22.0 a reshape hands back a tensor
      // that SHARES its source's data buffer, so grid.dataId === flat.dataId.
      // Measured 2026-09-08: reshape(), tf.reshape(), as2D() and clone() all
      // keep the source dataId, and the comparison still holds after `flat`
      // is disposed, which the instructions allow. A grid typed out with
      // tf.tensor2d, or rebuilt from arraySync(), allocates a second buffer,
      // and that is exactly what lets it hold anything at all: before this
      // check, a hand-typed [3, 4] grid cleared every other test in the file.
      filled(grid, 'Step 1 is still empty.');
      isTensor(grid);
      expect(
        grid.dataId === flat.dataId,
        'The numbers may be right, but they were not produced by reshaping flat. A reshape rewraps the same buffer under a new shape, so it cannot say anything the readings do not; a grid built with tf.tensor2d allocates its own buffer and can say whatever you type. Reshape flat itself.',
      ).toBe(true);
    });
    it('row-major fill: row 0 holds the first readings in order', () => {
      filled(grid, 'Step 1 is still empty.');
      const rows = rowsOf();
      expect(
        rows[0],
        'A reshape fills the first row before it starts the second, so row 0 is the front of the flat list, in order.',
      ).toEqual(source.slice(0, 4));
    });
    it('middle row lands correctly', () => {
      filled(grid, 'Step 1 is still empty.');
      const rows = rowsOf();
      expect(
        rows[1],
        'Count four values into the flat list and read the next four. Nothing is rearranged on the way in.',
      ).toEqual(source.slice(4, 8));
    });
    it('last row lands correctly', () => {
      filled(grid, 'Step 1 is still empty.');
      const rows = rowsOf();
      expect(rows[2], 'The tail of the flat list, in the order it arrived.').toEqual(
        source.slice(8, 12),
      );
    });
    it('step1 holds time step index 1, not a column', () => {
      filled(step1, 'Step 2 is still empty. Pull row index 1 out of the grid.');
      expect(
        Array.isArray(step1),
        'step1 has to arrive as a plain JS array of four numbers, which is what create-a-tensor asked for in lesson 1 as well. tf.slice returns a tensor. dataSync() returns flat typed storage; Array.from() converts it to a plain array. arraySync() instead returns ordinary nested arrays, from which you can select a row.',
      ).toBe(true);
      expect(
        step1,
        'A column takes one value from every time step. This asks for one whole time step, all four of its channels.',
      ).toEqual(source.slice(4, 8));
    });
  });
estimatedMinutes: 8
difficulty: beginner
