slug: reshape-tensor
lessonSlug: tensor-shapes
title: "Find the Signal's Layout"
instructions: "Twelve readings arrived flat: [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8]. Farah believes they're 3 time steps × 4 channels. Reshape `flat` into a [3, 4] matrix called `grid`, then extract the SECOND row (time step index 1) into `step1` as a plain JS array. Careful: row-major fill means you need to know exactly which four values land in that row. The tests check all three rows against the flat list, so a wrong guess fails."
starterCode: "const flat = tf.tensor([3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8]);\n\n// 1. Reshape to [3, 4]\nconst grid = null; // your code here\n\n// 2. Extract row index 1 as a JS array\n// Hint: tf.slice or array indexing after .arraySync()\nconst step1 = null;"
solutionCode: "const flat = tf.tensor([3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8]);\n\nconst grid = flat.reshape([3, 4]);\n\nconst step1 = grid.arraySync()[1];"
testCode: |
  describe('Signal Layout', () => {
    // Expectations are sliced out of `flat` at grade time rather than
    // written out here, so no test name hands the learner the row it is
    // asking for.
    const source = Array.from(flat.dataSync());
    it('grid has shape [3, 4]', () => {
      expect(grid.shape).toEqual([3, 4]);
    });
    it('row-major fill: row 0 holds the first readings in order', () => {
      const rows = grid.arraySync();
      expect(rows[0]).toEqual(source.slice(0, 4));
    });
    it('step1 holds time step index 1, not a column', () => {
      expect(Array.from(step1)).toEqual(source.slice(4, 8));
    });
    it('last row lands correctly', () => {
      const rows = grid.arraySync();
      expect(rows[2]).toEqual(source.slice(8, 12));
    });
  });
estimatedMinutes: 8
difficulty: beginner
mlContent: data
skillAxis: data_prep
