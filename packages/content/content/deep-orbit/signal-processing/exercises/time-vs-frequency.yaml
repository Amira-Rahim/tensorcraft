title: "Two Views, One Verdict"
instructions: "Make the lesson's claim executable. compareViews(timeA, timeB, magsA, magsB, tolerance) receives two signals in BOTH representations: their time-domain samples and their frequency-domain magnitude arrays (precomputed for you; the transform itself is next lesson). Return { timeTwin, divergentBin }: timeTwin is true when every time-domain difference is within tolerance (the two signals are indistinguishable to the eye), and divergentBin is the index of the FIRST magnitude bin where they differ by more than tolerance, or -1 if none does. When timeTwin is true and divergentBin is not -1, you have proven the lesson: the views hide different things."
