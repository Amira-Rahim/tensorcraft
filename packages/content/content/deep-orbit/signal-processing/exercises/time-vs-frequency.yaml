solutionCode: |
  function compareViews(
    timeA: number[],
    timeB: number[],
    magsA: number[],
    magsB: number[],
    tolerance: number,
  ): { timeTwin: boolean; divergentBin: number } {
    const timeTwin = timeA.every((v, i) => Math.abs(v - timeB[i]) <= tolerance);
    let divergentBin = -1;
    for (let i = 0; i < magsA.length; i++) {
      if (Math.abs(magsA[i] - magsB[i]) > tolerance) {
        divergentBin = i;
        break;
      }
    }
    return { timeTwin, divergentBin };
  }
testCode: |
  describe('compareViews', () => {
    it('proves the lesson: twins in time, distinct at bin 5', () => {
      const timeA = [0.50, 0.87, 1.00, 0.87, 0.50, 0.00];
      const timeB = [0.53, 0.84, 1.02, 0.89, 0.47, 0.02];
      const magsA = [0, 0, 3.0, 0, 0, 0.0, 0];
      const magsB = [0, 0, 3.0, 0, 0, 6.4, 0];
      const r = compareViews(timeA, timeB, magsA, magsB, 0.05);
      expect(r.timeTwin).toBe(true);
      expect(r.divergentBin).toBe(5);
    });

    it('returns -1 when the spectra agree everywhere', () => {
      const r = compareViews([1, 2], [1, 2], [4, 4, 4], [4, 4, 4], 0.1);
      expect(r.timeTwin).toBe(true);
      expect(r.divergentBin).toBe(-1);
    });

    it('reports non-twins in time honestly', () => {
      const r = compareViews([0, 1], [0.5, 1], [1], [1], 0.1);
      expect(r.timeTwin).toBe(false);
    });

    it('finds the FIRST divergent bin, not the largest', () => {
      const magsA = [0, 1.0, 5.0, 9.0];
      const magsB = [0, 1.3, 5.0, 2.0];
      const r = compareViews([0], [0], magsA, magsB, 0.2);
      expect(r.divergentBin).toBe(1);
    });

    it('respects the tolerance in both directions', () => {
      const within = compareViews([0], [0.04], [1.0], [1.04], 0.05);
      expect(within.timeTwin).toBe(true);
      expect(within.divergentBin).toBe(-1);

      const beyond = compareViews([0], [0.04], [1.0], [1.2], 0.05);
      expect(beyond.divergentBin).toBe(0);
    });
  });
