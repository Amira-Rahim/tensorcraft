lessonSlug: time-vs-frequency
title: "The hidden tone"
instructions: |
  Implement `compareViews(baseline, suspect, tolerance, threshold)`. Transform each capture into FFT magnitudes with `tf.abs(tf.spectral.rfft(tf.tensor1d(samples))).arraySync()`.

  Return `{ timeTwin, divergentBin }`:
  - `timeTwin` is true when every pair of samples differs by at most `tolerance`.
  - `divergentBin` is the first bin whose magnitudes differ by more than `threshold`, or -1 if none does. Compare absolute differences, including bin 0.

  The two limits use different scales: sample values and raw FFT magnitudes. Assume equal-length finite captures with at least two samples and nonnegative limits. Release temporary tensors after reading the magnitudes.
