solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function compareViews(
    baseline: number[],
    suspect: number[],
    tolerance: number,
    threshold: number,
  ): { timeTwin: boolean; divergentBin: number } {
    const timeTwin = baseline.every((v, i) => Math.abs(v - suspect[i]) <= tolerance);
    const spectrumOf = (samples: number[]) =>
      tf.tidy(() => tf.abs(tf.spectral.rfft(tf.tensor1d(samples))).arraySync() as number[]);
    const magsA = spectrumOf(baseline);
    const magsB = spectrumOf(suspect);
    let divergentBin = -1;
    for (let i = 0; i < magsA.length; i++) {
      if (Math.abs(magsA[i] - magsB[i]) > threshold) {
        divergentBin = i;
        break;
      }
    }
    return { timeTwin, divergentBin };
  }
testCode: |
  describe('compareViews', () => {
    // The lesson's own generator. Both captures carry the four catalogued
    // components (5, 12, 23, 47 Hz); the suspect also carries one tone the
    // catalog has no source for.
    const generate = (components, samples, sampleRate) => {
      const out = [];
      for (let i = 0; i < samples; i++) {
        let value = 0;
        for (const c of components) {
          value += c.amp * Math.sin(2 * Math.PI * c.hz * i / sampleRate);
        }
        out.push(value);
      }
      return out;
    };
    const catalogued = [
      { hz: 5, amp: 0.8 },
      { hz: 12, amp: 0.6 },
      { hz: 23, amp: 0.4 },
      { hz: 47, amp: 0.2 },
    ];
    // 512 samples at the hull rate of 256 Hz: two seconds, 0.5 Hz per bin.
    const background = (samples = 512) => generate(catalogued, samples, 256);
    const intruder = (hz, amp, samples = 512) =>
      generate([...catalogued, { hz, amp }], samples, 256);

    // Every probe goes through this helper. The starter returns null, and
    // reading a verdict off null reports a JavaScript error about a property
    // name instead of saying anything about the task.
    const views = (baseline, suspect, tolerance, threshold) => {
      const r = compareViews(baseline, suspect, tolerance, threshold);
      expect(
        r,
        'Return an object containing timeTwin and divergentBin.',
      ).toBeDefined();
      expect(
        typeof r.timeTwin,
        'timeTwin is the verdict on the time-domain pair, so it has to be a boolean.',
      ).toBe('boolean');
      expect(
        typeof r.divergentBin,
        'divergentBin is a bin index, so it has to be a number. Use the sentinel the instructions name when no bin diverges.',
      ).toBe('number');
      return r;
    };

    it('reports that the sample differences stay within the time tolerance', () => {
      const r = views(background(), intruder(73.4, 0.05), 0.05, 5.0);
      expect(
        r.timeTwin,
        'Every pair of matching samples differs by at most 0.05, so these captures match within the supplied time-domain tolerance.',
      ).toBe(true);
    });

    it('names the bin the hidden tone lands in', () => {
      const r = views(background(), intruder(73.4, 0.05), 0.05, 5.0);
      expect(
        r.divergentBin,
        'Two seconds of capture at 256 Hz makes each bin 0.5 Hz wide, so the 73.4 Hz tone lands on the line at 73.5 Hz. Its gap there measures 11.96, the only gap in the spectrum above 5.0.',
      ).toBe(147);
      recordResult({
        kind: 'table',
        title: 'Your capture comparison',
        summary: 'Synthetic two-second captures at 256 samples per second. A differing bin selects a frequency band to inspect. It does not identify a physical source.',
        columns: ['Measurement', 'Your result'],
        rows: [
          ['Within the sample tolerance', r.timeTwin],
          ['First differing FFT bin', r.divergentBin],
          ['Bin center (Hz)', r.divergentBin < 0 ? null : r.divergentBin * 256 / 512],
        ],
      });
    });

    it('detects a missing frequency component using the absolute difference', () => {
      // The suspect LOST the 47 Hz component. Every other probe in this
      // suite adds energy, so a comparison that only notices energy
      // arriving (b - a > threshold) clears them all and misses this one.
      const dead = generate(catalogued.filter((c) => c.hz !== 47), 512, 256);
      const r = compareViews(background(), dead, 0.05, 5.0);
      expect(r, 'Return an object containing timeTwin and divergentBin.').toBeDefined();
      expect(
        r.divergentBin,
        'The 47 Hz component is missing from the suspect capture. Bin 94 has magnitude 51.2 in the baseline and 0 in the suspect. Compare absolute differences so missing components count too.',
      ).toBe(94);
    });
    it('reports no divergence when the suspect is the same capture', () => {
      const samples = background();
      const r = views(samples, samples.slice(), 0.05, 5.0);
      expect(r.timeTwin).toBe(true);
      expect(
        r.divergentBin,
        'These spectra are identical. Subtract matching bins and compare the size of each difference.',
      ).toBe(-1);
    });

    it('updates the first differing bin when the tone amplitude changes', () => {
      const loud = views(background(), intruder(73.4, 0.05), 0.05, 5.0);
      expect(loud.divergentBin).toBe(147);

      const quiet = views(background(), intruder(73.4, 0.01), 0.05, 5.0);
      expect(
        quiet.divergentBin,
        'At one fifth of the amplitude, the largest bin difference is 2.39. None exceeds the threshold of 5.0, so return -1.',
      ).toBe(-1);
      expect(quiet.timeTwin).toBe(true);
    });

    it('uses the supplied threshold to find the first differing bin', () => {
      const r = views(background(), intruder(73.4, 0.05), 0.05, 2.0);
      expect(
        r.divergentBin,
        'The tone falls between FFT bins. Bin 146 differs by 3.01 and bin 147 by 11.96. With threshold 2.0, return bin 146. With threshold 5.0, return bin 147.',
      ).toBe(146);
    });

    it('returns the first bin above the difference threshold, even before the peak', () => {
      const r = views(background(), intruder(73.4, 0.5), 0.05, 20.0);
      expect(
        r.timeTwin,
        'This tone reaches 0.5 in the raw samples, ten times the archived one. It is no longer hidden in the time view.',
      ).toBe(false);
      expect(
        r.divergentBin,
        'Bin 147 has the largest difference, but bin 146 already exceeds the threshold of 20.0. Return the first bin above the threshold, even if a later bin has a larger difference.',
      ).toBe(146);
    });

    it('follows the tone, not a memorized bin index', () => {
      const r = views(background(), intruder(40, 0.05), 0.05, 5.0);
      expect(
        r.divergentBin,
        '40 Hz sits exactly on a bin line here (40 x 512 / 256), so its whole gap of 12.8 lands in bin 80 while every earlier bin agrees to within 0.00001.',
      ).toBe(80);
    });

    it('compares captures containing a newly generated tone', () => {
      // Bin 100 to 199 of this 512-sample capture, so the tone sits exactly
      // on a line between 50 and 99.5 Hz and carries its whole gap of 12.8
      // into that one bin.
      const bin = 100 + Math.floor(Math.random() * 100);
      const hz = bin / 2;
      const loud = views(background(), intruder(hz, 0.05), 0.05, 5.0);
      expect(
        loud.divergentBin,
        'The test chooses a new tone each run. Compare the two spectra to find the first difference above the supplied threshold.',
      ).toBe(bin);

      const quiet = views(background(), intruder(hz, 0.01), 0.05, 5.0);
      expect(
        quiet.divergentBin,
        'The quieter tone leaves no bin difference above the threshold. Return -1 because no bin exceeds the difference threshold.',
      ).toBe(-1);
    });

    it('follows the capture length, because the bin grid does', () => {
      const r = views(background(256), intruder(73.4, 0.05, 256), 0.05, 2.0);
      expect(
        r.divergentBin,
        'The same 73.4 Hz tone, in a capture half as long. One second at 256 Hz makes each bin 1 Hz wide, so the tone now lands in bin 73 with a gap of 4.83. A bin index is not a frequency until you know how many samples went in.',
      ).toBe(73);
    });

    it('compares spectra, not samples: a time-shifted copy is a spectral twin', () => {
      const samples = background();
      const rotated = samples.map((_, i) => samples[(i + 137) % 512]);
      const r = views(samples, rotated, 0.05, 0.5);
      expect(
        r.timeTwin,
        'Rotating the capture by 137 samples moves individual readings by as much as 2.99, so these are nothing like twins in time.',
      ).toBe(false);
      expect(
        r.divergentBin,
        'A rotation changes the component phases while preserving their magnitudes, so both spectra carry the same four magnitudes and the largest gap between them is 0.0000153. Comparing raw samples would report a divergence in the first few readings. This task compares spectra.',
      ).toBe(-1);
    });

    it('reads the tolerance argument for the time verdict', () => {
      const r = views(background(), intruder(73.4, 0.05), 0.04, 5.0);
      expect(
        r.timeTwin,
        'The largest sample gap in this pair is 0.05. Under a tolerance of 0.04 the pair is not a twin, and use the tolerance from the caller.',
      ).toBe(false);
    });

    it('detects a constant offset in the samples and in bin 0', () => {
      const samples = background();
      const lowered = samples.map((v) => v - 0.5);
      const r = views(samples, lowered, 0.05, 5.0);
      expect(
        r.timeTwin,
        'The suspect is lower than the baseline at every sample. Compare absolute differences so decreases count too.',
      ).toBe(false);
      expect(
        r.divergentBin,
        'A constant offset is not a tone: it puts 256.0 into bin 0 and leaves every other bin alone to within 0.00001. Bin 0 counts how far the whole capture sits from zero, and it is still a bin.',
      ).toBe(0);
    });
  });
