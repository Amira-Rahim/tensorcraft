solutionCode: |
  interface Component { hz: number; amplitude: number; }

  function generateSignal(components: Component[], samples: number, sampleRate: number): number[] {
    const signal: number[] = [];
    for (let i = 0; i < samples; i++) {
      const t = i / sampleRate;
      let value = 0;
      for (const c of components) {
        value += c.amplitude * Math.sin(2 * Math.PI * c.hz * t);
      }
      signal.push(value);
    }
    return signal;
  }
testCode: |
  describe('generateSignal', () => {
    it('returns correct number of samples', () => {
      const result = generateSignal([{ hz: 5, amplitude: 1 }], 100, 100);
      expect(result.length).toBe(100);
    });
    it('starts near zero for a sine wave', () => {
      const result = generateSignal([{ hz: 1, amplitude: 1 }], 100, 100);
      expect(Math.abs(result[0])).toBeLessThan(0.01);
    });
    it('combines multiple frequencies', () => {
      const result = generateSignal([{ hz: 5, amplitude: 1 }, { hz: 10, amplitude: 0.5 }], 100, 100);
      expect(result.length).toBe(100);
      expect(Math.abs(result[0])).toBeLessThan(0.01);
    });
    it('amplitude scales correctly', () => {
      const result = generateSignal([{ hz: 1, amplitude: 2 }], 400, 100);
      const max = Math.max(...result.map(Math.abs));
      expect(max).toBeGreaterThan(1.9);
      expect(max).toBeLessThan(2.1);
    });
  });
