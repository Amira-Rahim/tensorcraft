slug: time-vs-frequency
lessonSlug: time-vs-frequency
title: "Find the Hidden Tone"
instructions: |
  The lesson claims a tone too weak to see in the time view is a clear peak in the frequency view. Make that claim executable on raw samples. compareViews(baseline, suspect, tolerance, threshold) receives two captures, and nothing is precomputed for you: transform BOTH of them yourself with tf.abs(tf.spectral.rfft(tf.tensor1d(samples))).arraySync(), which is the call the lesson prints above the challenge (lesson 2 explains what it does).

  Return { timeTwin, divergentBin }. timeTwin is true when every pair of samples differs by no more than tolerance. divergentBin is the index of the first bin whose two magnitudes differ by MORE than threshold, or -1 when no bin does.

  Three details the grader holds you to.

  1. A gap counts by size, not by direction: a bin that lost energy diverged as much as one that gained it.
  2. Every bin is eligible, bin 0 included.
  3. tolerance and threshold are never the same number, because a magnitude grows with the number of samples you transformed while a sample difference does not.

  One of the grader's intruders is generated when it runs, so the bin it asks for has to come out of the comparison rather than out of a remembered index.
