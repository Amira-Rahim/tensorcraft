solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function stft(signal: number[], windowSize: number, hopSize: number): number[][] {
    const spectrogram: number[][] = [];
    const numWindows = Math.floor((signal.length - windowSize) / hopSize) + 1;
    for (let i = 0; i < numWindows; i++) {
      const start = i * hopSize;
      const chunk = signal.slice(start, start + windowSize);
      const magnitudes = tf.tidy(() => {
        const fft = tf.spectral.rfft(tf.tensor1d(chunk));
        return tf.abs(fft).arraySync() as number[];
      });
      spectrogram.push(magnitudes);
    }
    return spectrogram;
  }
testCode: |
  describe('stft', () => {
    const signal = Array.from({ length: 256 }, (_, i) => Math.sin(2 * Math.PI * 20 * i / 256));
    // Sample rate 256, the hull array's, so window 64 puts a tone of f Hz
    // in bin f / 4. 20 Hz for the first half, 60 Hz for the second half.
    const twoTone = Array.from({ length: 256 }, (_, i) =>
      i < 128 ? Math.sin(2 * Math.PI * 20 * i / 256) : Math.sin(2 * Math.PI * 60 * i / 256));
    // A 40 Hz burst that exists only in samples 64 to 127. Silence elsewhere.
    const burst = Array.from({ length: 256 }, (_, i) =>
      i >= 64 && i < 128 ? Math.sin(2 * Math.PI * 40 * i / 256) : 0);
    // 20 Hz at full amplitude and 60 Hz at half, both sounding through the
    // whole capture, so every window holds both at once.
    const chord = Array.from({ length: 256 }, (_, i) =>
      Math.sin(2 * Math.PI * 20 * i / 256) + 0.5 * Math.sin(2 * Math.PI * 60 * i / 256));
    const rowMax = (row) => Math.max(...row);
    const loudestRow = (spec) => spec.reduce((best, row, i) => rowMax(row) > rowMax(spec[best]) ? i : best, 0);
    // Every probe goes through here. The starter returns null, and indexing
    // null reports a JavaScript error about a property name instead of
    // saying anything about the task.
    const rowsOf = (samples, windowSize, hopSize) => {
      const spec = stft(samples, windowSize, hopSize);
      expect(
        spec,
        'stft returned nothing to read. It has to hand back the stack of windows, one row per window position.',
      ).toBeDefined();
      expect(
        Array.isArray(spec),
        'The outer value is the stack of time windows, so it has to be an array of rows.',
      ).toBe(true);
      expect(
        Array.isArray(spec[0]),
        'Each row is the magnitude spectrum of one window, so it has to be an array of numbers.',
      ).toBe(true);
      return spec;
    };
    it('returns a 2D array', () => {
      const result = rowsOf(signal, 64, 32);
      expect(Array.isArray(result)).toBe(true);
      expect(Array.isArray(result[0])).toBe(true);
    });
    it('the row count follows the signal length, the window and the hop', () => {
      const result = rowsOf(signal, 64, 32);
      const expected = Math.floor((256 - 64) / 32) + 1;
      expect(result.length).toBe(expected);
    });
    it('each row carries one magnitude per bin the window resolves', () => {
      const result = rowsOf(signal, 64, 32);
      expect(
        result[0].length,
        'A real-valued window of N samples has only N/2 + 1 bins that carry unique information, which is what rfft returns.',
      ).toBe(33);
    });
    it('a steady tone peaks in the same bin in every window', () => {
      const result = rowsOf(signal, 64, 32);
      result.forEach(row => {
        const peak = row.indexOf(Math.max(...row));
        expect(peak).toBe(5);
        expect(
          row[5],
          'A 1.0 tone on a bin center puts windowSize / 2 = 32 into that bin. Magnitudes arriving at about half their expected height mean the samples were tapered before the transform, which is what tf.signal.stft does unless you hand it your own window.',
        ).toBeCloseTo(32, 0);
      });
    });
    it('every row is a whole spectrum, so a window holding two tones shows both', () => {
      const result = rowsOf(chord, 64, 32);
      result.forEach(row => {
        expect(
          row[5],
          'The loud tone puts windowSize / 2 = 32 into bin 5 here. A row that reads about 16 across the board was tapered before the transform rather than cut straight out of the signal.',
        ).toBeCloseTo(32, 0);
        expect(
          row[15],
          'The second tone is quieter, not missing. A row built by marking one frequency and zeroing the rest can match a peak, but it cannot carry a second component, and carrying every component at once is what a magnitude spectrum is for.',
        ).toBeCloseTo(16, 0);
      });
    });
    it('a tone between two bin centers shows up in both of them', () => {
      // 22 Hz at this rate falls halfway between two bin centers, so its
      // energy has to appear in both, and neither can hold all of it.
      const offCenter = Array.from({ length: 256 }, (_, i) => Math.sin(2 * Math.PI * 22 * i / 256));
      const result = rowsOf(offCenter, 64, 32);
      result.forEach(row => {
        expect(
          Math.min(row[5], row[6]),
          'This off-bin tone has magnitude in both neighboring bins and leaks into farther bins too. A row that puts the whole window into one bin and zero everywhere else is a marker, not a spectrum.',
        ).toBeGreaterThan(15);
        expect(
          Math.max(...row),
          'No single bin can hold all of an off-center tone.',
        ).toBeLessThan(25);
      });
    });
    it('dimensions follow the parameters, not constants (windowSize 128, hop 64)', () => {
      const result = rowsOf(signal, 128, 64);
      expect(result.length).toBe(3);
      expect(result[0].length).toBe(65);
    });
    it('a tone that changes halfway gives rows with different peak bins', () => {
      const result = rowsOf(twoTone, 64, 64);
      expect(result.length).toBe(4);
      const peaks = result.map(row => row.indexOf(Math.max(...row)));
      expect(
        peaks,
        'The tone changes partway through the capture, so the later rows have to disagree with the earlier ones. One spectrum computed once and repeated cannot.',
      ).toEqual([5, 5, 15, 15]);
      expect(
        result[0][5],
        'The first tone is 1.0 loud on a bin center, so its bin holds windowSize / 2 = 32. About half that is the height a tapered window returns.',
      ).toBeCloseTo(32, 0);
      expect(result[3][15]).toBeCloseTo(32, 0);
    });
    it('a burst leaves the rows before and after it silent', () => {
      const result = rowsOf(burst, 64, 64);
      expect(result.length).toBe(4);
      expect(rowMax(result[0])).toBeLessThan(1e-6);
      expect(rowMax(result[2])).toBeLessThan(1e-6);
      expect(rowMax(result[3])).toBeLessThan(1e-6);
      expect(result[1].indexOf(rowMax(result[1]))).toBe(10);
      expect(
        result[1][10],
        'The burst fills this window completely, so its bin holds windowSize / 2 = 32. About half that is the height a tapered window returns.',
      ).toBeCloseTo(32, 0);
    });
    it('rows advance by hopSize, so the loud row moves when hopSize changes', () => {
      const hop64 = rowsOf(burst, 64, 64);
      const hop32 = rowsOf(burst, 64, 32);
      expect(hop32.length).toBe(7);
      expect(loudestRow(hop64)).toBe(1);
      expect(loudestRow(hop32)).toBe(2);
      expect(rowMax(hop32[0])).toBeLessThan(1e-6);
      expect(rowMax(hop32[6])).toBeLessThan(1e-6);
    });
  });
