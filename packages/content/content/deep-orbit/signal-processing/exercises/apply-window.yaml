slug: apply-window
lessonSlug: windowing-and-overlap
title: "Vectorized Hann Window with tf"
mlContent: data
instructions: "Build `hannWindow(n)` returning a JS number array using tf.range and vectorized cos. Build `applyWindow(signal, window)` returning element-wise product as a JS number array using tf.tensor1d.mul."
starterCode: |
  function hannWindow(n) {
    return [];
  }
  function applyWindow(signal, window) {
    return [];
  }
solutionCode: |
  function hannWindow(n) {
    const i = tf.range(0, n);
    const angle = i.mul(2 * Math.PI).div(n - 1);
    return tf.scalar(0.5).mul(tf.scalar(1).sub(angle.cos())).arraySync();
  }
  function applyWindow(signal, window) {
    return tf.tensor1d(signal).mul(tf.tensor1d(window)).arraySync();
  }
testCode: |
  describe('hannWindow (vectorized tf cos)', () => {
    it('returns correct length', () => {
      expect(hannWindow(64).length).toBe(64);
    });
    it('starts at zero', () => {
      expect(hannWindow(64)[0]).toBeCloseTo(0, 4);
    });
    it('ends at zero', () => {
      const w = hannWindow(64);
      expect(w[63]).toBeCloseTo(0, 4);
    });
    it('peaks at center', () => {
      const w = hannWindow(65);
      expect(w[32]).toBeCloseTo(1, 4);
    });
  });
  describe('applyWindow (tf element-wise mul)', () => {
    it('returns same length', () => {
      expect(applyWindow([1, 2, 3, 4], [0.5, 1, 1, 0.5]).length).toBe(4);
    });
    it('multiplies element-wise', () => {
      const out = applyWindow([2, 4, 6, 8], [0.5, 1, 1, 0.5]);
      expect(out[0]).toBeCloseTo(1, 4);
      expect(out[1]).toBeCloseTo(4, 4);
      expect(out[3]).toBeCloseTo(4, 4);
    });
  });
estimatedMinutes: 10
difficulty: intermediate
