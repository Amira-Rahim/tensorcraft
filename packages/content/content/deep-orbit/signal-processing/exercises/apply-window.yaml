title: "Apply a Hann Window"
instructions: "Implement a Hann window function and apply it to a signal. The Hann window formula is: w[i] = 0.5 * (1 - cos(2 * PI * i / (N - 1))). Return the windowed signal (element-wise multiplication of signal and window)."
