slug: compute-fft
lessonSlug: fourier-transform
title: "Compute FFT and Find Dominant Frequency"
instructions: |
  Implement `findDominantFrequency(signal, sampleRate)` using `tf.spectral.rfft()`. Return the frequency in hertz of the bin with the largest magnitude, excluding bin 0, the constant offset. Convert its index using `bin * sampleRate / signal.length`. Keep the lowest eligible index when magnitudes tie.

  Return the measured bin center. An isolated off-bin tone often peaks nearby, but phase, leakage and neighboring tones can change the winner. Use the computed magnitudes rather than rounding an estimated frequency.

  Assume finite input with at least two samples and a positive sample rate. For a silent signal, the tie rule returns the first non-DC bin; this is a function convention, not evidence of a tone.
starterCode: |
  import * as tf from '@tensorflow/tfjs';

  function findDominantFrequency(signal: number[], sampleRate: number): number {
    // Skip bin 0. Find the largest remaining magnitude and convert its index to Hz.
    return null; // your code here
  }
solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function findDominantFrequency(signal: number[], sampleRate: number): number {
    return tf.tidy(() => {
      const fft = tf.spectral.rfft(tf.tensor1d(signal));
      const magnitudes = tf.abs(fft).arraySync() as number[];
      let maxBin = 1;
      let maxMag = magnitudes[1];
      for (let i = 2; i < magnitudes.length; i++) {
        if (magnitudes[i] > maxMag) {
          maxMag = magnitudes[i];
          maxBin = i;
        }
      }
      return (maxBin * sampleRate) / signal.length;
    });
  }
testCode: |
  describe('findDominantFrequency', () => {
    it('keeps the first eligible bin when magnitudes tie', () => {
      expect(findDominantFrequency([0, 0, 0, 0], 8)).toBe(2);
      expect(findDominantFrequency([1, 0, 0, 0], 8)).toBe(2);
    });
    it('finds the one tone in a 1-second, 128 Hz capture', () => {
      const signal = Array.from({ length: 128 }, (_, i) => Math.sin((2 * Math.PI * 5 * i) / 128));
      const freq = findDominantFrequency(signal, 128);
      expect(
        Number.isFinite(freq),
        'The return value here is a number of hertz. The starter returns null, so nothing has been computed yet.',
      ).toBe(true);
      expect(freq).toBeCloseTo(5, 1);
    });
    it('picks the stronger of two components, not the slower one', () => {
      const signal = Array.from(
        { length: 256 },
        (_, i) =>
          0.3 * Math.sin((2 * Math.PI * 3 * i) / 256) + 1.0 * Math.sin((2 * Math.PI * 20 * i) / 256),
      );
      expect(
        findDominantFrequency(signal, 256),
        'Both components are really there. The winner is the one with the largest magnitude, which is not the one that repeats most slowly.',
      ).toBeCloseTo(20, 1);
    });
    it('skips the DC component, so a constant offset cannot win', () => {
      const signal = Array.from(
        { length: 128 },
        (_, i) => 5.0 + Math.sin((2 * Math.PI * 7 * i) / 128),
      );
      expect(
        findDominantFrequency(signal, 128),
        'A +5.0 offset puts far more energy in bin 0 than the tone puts anywhere else. Bin 0 counts how much the whole slice sits away from zero, which is the zero-frequency component excluded by this task.',
      ).toBeCloseTo(7, 1);
    });
    it('tracks the input rather than a memorized answer (a second tone at a second length)', () => {
      const signal = Array.from({ length: 64 }, (_, i) => Math.sin((2 * Math.PI * 12 * i) / 64));
      expect(
        findDominantFrequency(signal, 64),
        'A different tone at a different capture length, so nothing that worked above can be carried over by hand.',
      ).toBeCloseTo(12, 1);
    });
    it('converts the bin to hertz instead of returning the bin index (256 samples at 128 Hz)', () => {
      const signal = Array.from({ length: 256 }, (_, i) => Math.sin((2 * Math.PI * 5 * i) / 128));
      expect(findDominantFrequency(signal, 128)).toBeCloseTo(5, 1);
    });
    it('returns the winning bin center for this isolated 7.3 Hz fixture', () => {
      // 128 samples at 128 Hz spaces the bin centers 1 Hz apart, and this
      // tone sits between two of them. The spectrum has nothing finer to
      // report, so the answer is quantized.
      const signal = Array.from({ length: 128 }, (_, i) => Math.sin((2 * Math.PI * 7.3 * i) / 128));
      expect(
        findDominantFrequency(signal, 128),
        'Return the frequency of the winning FFT bin. Estimating the tone from zero crossings or its period answers a different question.',
      ).toBeCloseTo(7, 1);
    });
    it('magnitude decides the winner, not how often the wave crosses zero', () => {
      // A strong slow tone with a weaker fast one riding on it. The slow
      // component owns the largest magnitude; the fast one owns the zero
      // crossings.
      const signal = Array.from(
        { length: 128 },
        (_, i) =>
          Math.sin((2 * Math.PI * 4 * i) / 128) + 0.55 * Math.sin((2 * Math.PI * 29 * i) / 128),
      );
      expect(
        findDominantFrequency(signal, 128),
        'Counting how often this signal changes sign answers a different question: it crosses zero far more often than its strongest component repeats.',
      ).toBeCloseTo(4, 1);
    });
    it('is not a lookup: the tone is drawn at grade time', () => {
      // 256 samples at 128 Hz space the bin centers 0.5 Hz apart. Drawing the
      // BIN rather than the frequency keeps the tone exactly on a center, so
      // the answer is whatever this run's draw makes it.
      const bin = 20 + Math.floor(Math.random() * 80);
      const hz = (bin * 128) / 256;
      const signal = Array.from({ length: 256 }, (_, i) => Math.sin((2 * Math.PI * hz * i) / 128));
      expect(
        findDominantFrequency(signal, 128),
        'The test chooses a new tone each run. Find its largest eligible FFT magnitude, then convert that index using the supplied sample rate and capture length.',
      ).toBeCloseTo(hz, 1);
    });
  });
