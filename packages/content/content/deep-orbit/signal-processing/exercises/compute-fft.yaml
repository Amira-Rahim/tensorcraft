solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function findDominantFrequency(signal: number[], sampleRate: number): number {
    return tf.tidy(() => {
      const fft = tf.spectral.rfft(tf.tensor1d(signal));
      const magnitudes = tf.abs(fft).arraySync() as number[];
      let maxBin = 1;
      let maxMag = magnitudes[1];
      for (let i = 2; i < magnitudes.length; i++) {
        if (magnitudes[i] > maxMag) {
          maxMag = magnitudes[i];
          maxBin = i;
        }
      }
      return maxBin * sampleRate / signal.length;
    });
  }
testCode: |
  describe('findDominantFrequency', () => {
    it('returns a finite non-negative frequency', () => {
      const signal = Array.from({ length: 128 }, (_, i) => Math.sin(2 * Math.PI * 5 * i / 128));
      const freq = findDominantFrequency(signal, 128);
      expect(Number.isFinite(freq)).toBe(true);
      expect(freq).toBeGreaterThanOrEqual(0);
    });
    it('returns a number', () => {
      const signal = Array.from({ length: 64 }, (_, i) => Math.sin(2 * Math.PI * 3 * i / 64));
      expect(typeof findDominantFrequency(signal, 64)).toBe('number');
    });
  });
