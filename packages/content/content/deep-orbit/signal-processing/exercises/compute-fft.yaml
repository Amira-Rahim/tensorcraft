title: "Compute FFT and Find Dominant Frequency"
instructions: "Write a function that takes a signal array and sample rate, computes the FFT using tf.spectral.rfft(), and returns the dominant frequency (the frequency with the highest magnitude, excluding the DC component at bin 0)."
