solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function topKFrequencies(signal: number[], k: number): number[] {
    return tf.tidy(() => {
      const fft = tf.spectral.rfft(tf.tensor1d(signal));
      const magnitudes = tf.abs(fft).arraySync() as number[];
      const sorted = magnitudes
        .slice(1)
        .sort((a, b) => b - a)
        .slice(0, k);
      return sorted;
    });
  }
testCode: |
  describe('topKFrequencies', () => {
    const signal = Array.from({ length: 128 }, (_, i) =>
      1.0 * Math.sin(2 * Math.PI * 5 * i / 128) +
      0.5 * Math.sin(2 * Math.PI * 20 * i / 128)
    );
    it('returns K values', () => {
      expect(topKFrequencies(signal, 3).length).toBe(3);
    });
    it('returns sorted descending', () => {
      const result = topKFrequencies(signal, 4);
      for (let i = 1; i < result.length; i++) {
        expect(result[i]).toBeLessThanOrEqual(result[i - 1]);
      }
    });
    it('top-2 magnitudes are the real peaks: 64 (5 Hz at 1.0x) and 32 (20 Hz at 0.5x)', () => {
      const result = topKFrequencies(signal, 2);
      expect(result[0]).toBeCloseTo(64, 0);
      expect(result[1]).toBeCloseTo(32, 0);
    });
    it('third-strongest is noise-floor small (clean two-tone signal)', () => {
      const result = topKFrequencies(signal, 3);
      expect(result[2]).toBeLessThan(1);
    });
    it('features track the signal: a lone 10 Hz tone gives top 64, second near zero', () => {
      const s2 = Array.from({ length: 128 }, (_, i) => Math.sin(2 * Math.PI * 10 * i / 128));
      const r = topKFrequencies(s2, 2);
      expect(r[0]).toBeCloseTo(64, 0);
      expect(r[1]).toBeLessThan(1);
    });
  });
