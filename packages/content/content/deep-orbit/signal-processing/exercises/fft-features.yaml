solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function extractFeatures(signal: number[], sampleRate: number, loHz: number, hiHz: number): number[] {
    return tf.tidy(() => {
      // Raw features, unchanged by the FFT work.
      const amplitude = Math.max(...signal.map(Math.abs));
      const zeroCrossings = signal.reduce((sum, v, i) =>
        i > 0 && Math.sign(v) !== Math.sign(signal[i - 1]) ? sum + 1 : sum, 0
      );

      // Bin k has its center at k * binWidth hertz. Keep every bin whose
      // center lands inside the band, which fixes the same bin indices for
      // every signal of this length at this sample rate.
      const binWidth = sampleRate / signal.length;
      const loBin = Math.ceil(loHz / binWidth);
      const hiBin = Math.floor(hiHz / binWidth);

      const magnitudes = tf.abs(tf.spectral.rfft(tf.tensor1d(signal))).arraySync() as number[];
      return [amplitude, zeroCrossings, ...magnitudes.slice(loBin, hiBin + 1)];
    });
  }
testCode: |
  describe('extractFeatures', () => {
    // 0.25 s of archive: 64 samples at 256 Hz, a 52 Hz tone at 1.0 and a
    // 72 Hz tone at 0.5. Both land on bin centers, so the magnitudes are
    // exactly amplitude * 64 / 2. The 0.45 radian offset only shifts where
    // the window opens, which leaves those magnitudes alone and keeps every
    // sample off exact zero, so any sign test counts the same crossings.
    const signal = Array.from({ length: 64 }, (_, i) =>
      1.0 * Math.sin(2 * Math.PI * 52 * i / 256 + 0.45) +
      0.5 * Math.sin(2 * Math.PI * 72 * i / 256 + 0.45)
    );

    it('returns the two raw features followed by one magnitude per bin in the band', () => {
      expect(extractFeatures(signal, 256, 50, 82)).toHaveLength(10);
    });

    it('leads with peak amplitude and the zero-crossing count', () => {
      const features = extractFeatures(signal, 256, 50, 82);
      expect(features[0]).toBeCloseTo(1.467, 2);
      expect(features[1]).toBe(25);
    });

    it('50 to 82 Hz over 64 samples at 256 Hz is bins 13 to 20', () => {
      const features = extractFeatures(signal, 256, 50, 82);
      // bin 13 (center 52 Hz) is the first magnitude, bin 18 (center 72 Hz) the sixth
      expect(features[2]).toBeCloseTo(32, 0);
      expect(features[7]).toBeCloseTo(16, 0);
    });

    it('keeps the bins in bin order instead of sorting by magnitude', () => {
      const features = extractFeatures(signal, 256, 50, 82);
      const quiet = [3, 4, 5, 6, 8, 9].map((i) => features[i]);
      quiet.forEach((magnitude) => {
        expect(magnitude).toBeLessThan(1);
      });
    });

    it('a narrower band moves the window: 68 to 76 Hz is bins 17 to 19', () => {
      const features = extractFeatures(signal, 256, 68, 76);
      expect(features).toHaveLength(5);
      expect(features[2]).toBeLessThan(1);
      expect(features[3]).toBeCloseTo(16, 0);
      expect(features[4]).toBeLessThan(1);
    });

    it('bin width follows the sample rate, not a hardcoded 4 Hz', () => {
      const slow = Array.from({ length: 64 }, (_, i) => Math.sin(2 * Math.PI * 26 * i / 128));
      const features = extractFeatures(slow, 128, 24, 28);
      expect(features).toHaveLength(5);
      expect(features[3]).toBeCloseTo(32, 0);
    });
  });
