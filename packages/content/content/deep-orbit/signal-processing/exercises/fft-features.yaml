lessonSlug: fft-as-features
title: "Extract Fixed-Bin FFT Features"
instructions: "Build the feature vector DEEP SCAN 2.0 trains on. extractFeatures(signal, sampleRate, loHz, hiHz) returns the peak amplitude, then the zero-crossing count, then one FFT magnitude per fixed bin whose center falls inside the band from loHz to hiHz. Bin width is sampleRate divided by the number of samples, so 64 samples at 256 Hz gives 4 Hz bins and the 50 to 82 Hz band is bins 13 through 20. Leave the magnitudes in bin order. Sorting them by size would make the third feature mean a different frequency in every row. The lesson's version carries phase as a third raw feature. This one stops at amplitude and zero crossings."
starterCode: |
