lessonSlug: fft-as-features
title: "Extract Fixed-Bin FFT Features"
instructions: "Build DEEP SCAN 2.0's input vector without the phase term. extractFeatures(signal, sampleRate, loHz, hiHz) returns the peak amplitude (the largest sample size in the capture, whichever side of zero it falls on), then the zero-crossing count (how many times consecutive samples land on opposite sides of zero), then one FFT magnitude per fixed bin whose center falls inside the band from loHz to hiHz, endpoints included. Bin width is sampleRate divided by the number of samples, so 64 samples at 256 Hz gives 4 Hz bins and the 50 to 82 Hz band is bins 13 through 20. Leave the magnitudes in bin order. Sorting them by size would make the third feature mean a different frequency in every row."
