solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function extractFeatures(signal: number[], sampleRate: number, loHz: number, hiHz: number): number[] {
    return tf.tidy(() => {
      // Raw features, unchanged by the FFT work.
      const amplitude = Math.max(...signal.map(Math.abs));
      const zeroCrossings = signal.reduce((sum, v, i) =>
        i > 0 && v * signal[i - 1] < 0 ? sum + 1 : sum, 0
      );

      // Bin k has its center at k * binWidth hertz. Keep every bin whose
      // center lands inside the band, which fixes the same bin indices for
      // every signal of this length at this sample rate.
      const binWidth = sampleRate / signal.length;
      const loBin = Math.ceil(loHz / binWidth);
      const hiBin = Math.floor(hiHz / binWidth);

      const magnitudes = tf.abs(tf.spectral.rfft(tf.tensor1d(signal))).arraySync() as number[];
      return [amplitude, zeroCrossings, ...magnitudes.slice(loBin, hiBin + 1)];
    });
  }
testCode: |
  describe('extractFeatures', () => {
    // A synthetic quarter second: 64 samples at 256 Hz, a 52 Hz tone at 1.0
    // and a 72 Hz tone at 0.5. These are unit amplitudes, not the archive's
    // ADC counts on 0 to 2048, so every magnitude below stays checkable by
    // hand. Both tones land on bin centers, so the magnitudes are exactly
    // amplitude * 64 / 2. The 0.45 radian offset only shifts where the
    // window opens, which leaves those magnitudes alone and keeps every
    // sample off exact zero, so any sign test counts the same crossings.
    const signal = Array.from({ length: 64 }, (_, i) =>
      1.0 * Math.sin(2 * Math.PI * 52 * i / 256 + 0.45) +
      0.5 * Math.sin(2 * Math.PI * 72 * i / 256 + 0.45)
    );

    // A second capture with nothing in common with the first: a quieter
    // 22 Hz tone, sampled at 128 Hz, read over a different band. Its two raw
    // features and its magnitudes all differ from the first capture's, so a
    // pair of remembered numbers cannot satisfy both.
    const slower = Array.from({ length: 64 }, (_, i) =>
      0.75 * Math.sin(2 * Math.PI * 22 * i / 128 + 0.45)
    );

    // Every probe goes through here. The starter returns null, and indexing
    // null reports a JavaScript error about a property name instead of
    // saying anything about the task.
    const featuresOf = (samples, sampleRate, loHz, hiHz) => {
      const out = extractFeatures(samples, sampleRate, loHz, hiHz);
      expect(
        out,
        'extractFeatures returned nothing to read. It has to hand back one flat row: the two raw features first, then one magnitude per bin in the band.',
      ).toBeDefined();
      expect(
        Array.isArray(out),
        'The row is what the model trains on, so it has to be a flat array of numbers.',
      ).toBe(true);
      return out;
    };

    it('returns the two raw features followed by one magnitude per bin in the band', () => {
      expect(
        featuresOf(signal, 256, 50, 82),
        'Bin width is 256 / 64 = 4 Hz here, so the 50 to 82 Hz band covers bins 13 through 20 with both endpoints in. That is eight magnitudes behind the two raw features. A slice that stops at the top bin instead of including it returns nine.',
      ).toHaveLength(10);
    });

    it('leads with peak amplitude and the zero-crossing count', () => {
      const features = featuresOf(signal, 256, 50, 82);
      expect(features[0]).toBeCloseTo(1.467, 2);
      expect(features[1]).toBe(25);
    });

    it('the band picks out fixed bin indices, and each tone lands on its own', () => {
      const features = featuresOf(signal, 256, 50, 82);
      // The first magnitude is the lowest bin in the band, and the two tones
      // sit at known offsets from it.
      expect(
        features[2],
        'A 1.0 tone sitting on a bin center puts 64 / 2 = 32 into that bin, and this row reports magnitudes as the transform gives them. A value near 1.0 here is that 32 divided by half the window length, which is amplitude-spectrum scaling. This task returns raw magnitudes; training-set z-score normalization is a separate later operation.',
      ).toBeCloseTo(32, 0);
      expect(features[7]).toBeCloseTo(16, 0);
    });

    it('keeps the bins in bin order instead of sorting by magnitude', () => {
      const features = featuresOf(signal, 256, 50, 82);
      const quiet = [3, 4, 5, 6, 8, 9].map((i) => features[i]);
      quiet.forEach((magnitude) => {
        expect(magnitude).toBeLessThan(1);
      });
    });

    it('a narrower band moves the window and returns fewer magnitudes', () => {
      const features = featuresOf(signal, 256, 68, 76);
      expect(features).toHaveLength(5);
      expect(features[2]).toBeLessThan(1);
      expect(
        features[3],
        'The 0.5 tone on this bin center puts 0.5 * 64 / 2 = 16 into it. A value near 0.5 is that 16 divided by half the window length: magnitudes go into the row unscaled, and the lesson normalizes the whole training set afterwards.',
      ).toBeCloseTo(16, 0);
      expect(features[4]).toBeLessThan(1);
    });

    it('bin width follows the sample rate instead of a constant', () => {
      const features = featuresOf(slower, 128, 20, 24);
      expect(features).toHaveLength(5);
      expect(
        features[3],
        'This capture is 0.75 loud on a bin center, so the bin holds 0.75 * 64 / 2 = 24. A value near 0.75 is that 24 divided by half the window length, and the row carries magnitudes unscaled.',
      ).toBeCloseTo(24, 0);
      expect(features[2]).toBeLessThan(1);
      expect(features[4]).toBeLessThan(1);
    });

    it('measures the two raw features on whatever capture it is handed', () => {
      // Same two features, a different capture. A row that remembers the
      // numbers from the first one gets both of these wrong, and a feature
      // that ignores its input is worth nothing to the model downstream.
      const features = featuresOf(slower, 128, 20, 24);
      expect(
        features[0],
        'Peak amplitude is a property of these samples. This capture is quieter than the one above.',
      ).toBeCloseTo(0.749, 2);
      expect(
        features[1],
        'The crossing count is a property of these samples too. This tone repeats at a different rate over the same number of samples.',
      ).toBe(21);
    });

    it('is an extraction, not a lookup: the band is drawn at grade time', () => {
      // 64 samples at 256 Hz makes 4 Hz bins. Drawing the tone's bin and both
      // band edges leaves the row's length, and the tone's place in it, decided
      // only by this run.
      const toneBin = 8 + Math.floor(Math.random() * 17);
      const below = 1 + Math.floor(Math.random() * 3);
      const above = 1 + Math.floor(Math.random() * 3);
      const drawn = Array.from({ length: 64 }, (_, i) =>
        Math.sin(2 * Math.PI * (toneBin * 4) * i / 256 + 0.45)
      );
      const features = featuresOf(drawn, 256, (toneBin - below) * 4, (toneBin + above) * 4);
      expect(
        features,
        'This band was drawn when the grader ran, so no table of remembered rows covers it. Its width decides how many magnitudes follow the two raw features: two plus one per bin from the low edge to the high edge, both included.',
      ).toHaveLength(3 + below + above);
      expect(
        features[2 + below],
        'The tone sits on the center of a bin drawn this run, and a 1.0 tone on a bin center puts 64 / 2 = 32 there. Where that 32 lands in the row depends on which bin the band opened at, so it comes out of the band arithmetic rather than out of a remembered index.',
      ).toBeCloseTo(32, 0);
    });
  });

  it('touching zero does not cross to the opposite side',()=>{expect(extractFeatures([1,0,1,0,-1,0,-1,0],8,1,3)[1]).toBe(0);});
