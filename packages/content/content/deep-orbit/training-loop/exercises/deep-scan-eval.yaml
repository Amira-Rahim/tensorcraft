title: "Train DEEP SCAN, Then Read the Gap"
instructions: "The first training run you grade yourself. `trainX`/`trainY` are 100 seeded archive readings (the calm and flagged clusters from lesson 4); `testX`/`testY` are 40 held-out readings drawn with fresh seeds, never seen in training. (1) Train `model` with model.fit for 30 epochs at batchSize 16 and store the result in `history`. (2) Score the held-out slice with model.evaluate into `evalResult` ([loss, accuracy]). (3) Write `diagnose(trainAcc, testAcc)`: 'overfitting' when trainAcc - testAcc exceeds 0.15, 'underfitting' when both sit below 0.7, else 'healthy'. (4) Read your own run: `verdict` = diagnose(final training accuracy from history, held-out accuracy from evalResult). The grader checks that the model really learned, that the held-out number came from model.evaluate, and that diagnose is a function of its arguments rather than a memorized string."
