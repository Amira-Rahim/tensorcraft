title: "Train DEEP SCAN, Then Read the Gap"
instructions: "The first training run you grade yourself. `trainX`/`trainY` are 100 seeded archive readings (the calm and flagged clusters from lesson 4); `testX`/`testY` are 40 held-out readings drawn with fresh seeds, never seen in training. (1) Train `model` with model.fit for 30 epochs at batchSize 16 and store the result in `history`. (2) Score the held-out slice with model.evaluate into `evalResult` ([loss, accuracy]). (3) Write `diagnose(trainAcc, testAcc)`, and read the gap first: 'overfitting' when trainAcc - testAcc exceeds 0.15, then 'underfitting' when BOTH numbers sit below 0.7, else 'healthy'. Gap first means a run with two low numbers and a wide gap reads overfitting. (4) Read your own run into two variables, `trainAcc` (the last entry of history.history.acc) and `testAcc` (the accuracy inside evalResult[1]), then set `verdict` to diagnose of those two. The grader reruns the held-out evaluation itself, calls diagnose on eleven pairs of its own, and checks that trainAcc and testAcc are the numbers this run produced rather than numbers you picked."
