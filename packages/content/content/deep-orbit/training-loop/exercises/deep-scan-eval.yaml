title: "Train DEEP SCAN, Then Read the Gap"
instructions: |
  Help Mirza check the classifier on data it has not trained on.
  The supplied tensors hold 100 generated training rows and 43 separate test
  rows: 40 generated examples and three hand-written story cases.
  Keep all test rows and labels out of training.

  1. Save `await model.fit(trainX, trainY, { epochs: 30, batchSize: 16 })`
     as `history`.
  2. Save `model.evaluate(testX, testY)` as `evalResult`. It contains two
     tensors: `[loss, accuracy]`.
  3. Write `diagnose(trainAcc, testAcc)`. Check these rules in order:
     - If `trainAcc - testAcc > 0.15`, return `'large-gap'`.
     - Otherwise, if both scores are below 0.7, return `'low-scores'`.
     - Otherwise, return `'no-gap-warning'`.
  4. Read `trainAcc` from the last entry in `history.history.acc`.
     Read `testAcc` from `evalResult[1].dataSync()[0]`.
     Set `verdict = diagnose(trainAcc, testAcc)`.

  Report the scores the run actually produced. The verdict names a result,
  not its cause. Passing the tests checks your procedure. It does not prove
  the model is ready for real use.
starterCode: |
  // Synthetic practice rows. Clipping enforces this fixture's [0, 1] range.
  // Labels and distributions illustrate the story, not a real archive.
  const { trainX, trainY, testX, testY } = tf.tidy(() => {
