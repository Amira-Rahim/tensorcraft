solutionCode: |
  const { trainX, trainY, testX, testY } = tf.tidy(() => {
    const calm = tf.clipByValue(
      tf.concat(
        [
          tf.randomNormal([50, 1], 0.17, 0.1, 'float32', 7),
          tf.randomNormal([50, 1], 0.81, 0.1, 'float32', 8),
          tf.randomNormal([50, 1], 0.23, 0.1, 'float32', 9),
        ],
        1,
      ),
      0,
      1,
    );
    const flagged = tf.clipByValue(
      tf.concat(
        [
          tf.randomNormal([50, 1], 0.84, 0.1, 'float32', 41),
          tf.randomNormal([50, 1], 0.18, 0.1, 'float32', 42),
          tf.randomNormal([50, 1], 0.78, 0.1, 'float32', 43),
        ],
        1,
      ),
      0,
      1,
    );
    const order = Array.from(tf.util.createShuffledIndices(100));
    const trainX = tf.concat([calm, flagged]).gather(order);
    const trainY = tf.concat([tf.zeros([50, 1]), tf.ones([50, 1])]).gather(order);

    const testX = tf.concat([
      tf.clipByValue(
        tf.concat(
          [
            tf.randomNormal([20, 1], 0.17, 0.1, 'float32', 204),
            tf.randomNormal([20, 1], 0.81, 0.1, 'float32', 205),
            tf.randomNormal([20, 1], 0.23, 0.1, 'float32', 206),
          ],
          1,
        ),
        0,
        1,
      ),
      tf.clipByValue(
        tf.concat(
          [
            tf.randomNormal([20, 1], 0.84, 0.1, 'float32', 201),
            tf.randomNormal([20, 1], 0.18, 0.1, 'float32', 202),
            tf.randomNormal([20, 1], 0.78, 0.1, 'float32', 203),
          ],
          1,
        ),
        0,
        1,
      ),
      tf.tensor2d([
        [0.3, 0.68, 0.34],
        [0.26, 0.75, 0.29],
        [0.33, 0.71, 0.36],
      ]),
    ]);
    const testY = tf.concat([tf.zeros([20, 1]), tf.ones([20, 1]), tf.ones([3, 1])]);
    return { trainX, trainY, testX, testY };
  });

  const model = tf.sequential();
  model.add(tf.layers.dense({ units: 32, activation: 'relu', inputShape: [3] }));
  model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
  model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
  model.compile({ optimizer: 'adam', loss: 'binaryCrossentropy', metrics: ['accuracy'] });

  const history = await model.fit(trainX, trainY, { epochs: 30, batchSize: 16 });

  const evalResult = model.evaluate(testX, testY);

  function diagnose(trainAcc, testAcc) {
    if (trainAcc - testAcc > 0.15) return 'large-gap';
    if (trainAcc < 0.7 && testAcc < 0.7) return 'low-scores';
    return 'no-gap-warning';
  }

  const trainAcc = history.history.acc[history.history.acc.length - 1];
  const testAcc = evalResult[1].dataSync()[0];
  const verdict = diagnose(trainAcc, testAcc);
testCode: |
  // Capture completes before the harness schedules any diagnosis checks.
  const evaluationCapture = captureEvaluation({
    model: typeof model === 'undefined' ? null : model,
    history: typeof history === 'undefined' ? null : history,
    testX: typeof testX === 'undefined' ? null : testX,
    testY: typeof testY === 'undefined' ? null : testY,
    evalResult: typeof evalResult === 'undefined' ? null : evalResult,
    trainAcc: typeof trainAcc === 'undefined' ? null : trainAcc,
    testAcc: typeof testAcc === 'undefined' ? null : testAcc,
    verdict: typeof verdict === 'undefined' ? null : verdict,
  });
  evaluationCapture.artifacts.forEach((artifact) => recordResult(artifact));
  const observed = evaluationCapture.context;

  describe('Train DEEP SCAN, Then Read the Gap', () => {
    it('trained for exactly 30 epochs', () => {
      expect(observed.requestedEpochs,
        'Await the supplied model.fit call with epochs: 30.').toBe(30);
      expect(observed.completedEpochs,
        'The recorded fit must finish all 30 epochs.').toBe(30);
    });
    it('records finite losses without imposing a training outcome', () => {
      expect(observed.trainingLogStatus,
        'Use the supplied training call without custom callbacks. The check needs its original loss and accuracy log.').toBe('available');
      expect(Number.isFinite(evaluationCapture.trainingLoss)).toBe(true);
      expect(evaluationCapture.trainingLoss >= 0).toBe(true);
    });
    it('the training call saw the 100 supplied rows and none of the 43 held out', () => {
      expect(observed.trainingRows,
        'Train on all 100 training rows. Keep the test rows separate.').toBe(100);
      expect(observed.fitHistoryStatus,
        'Use one recorded fit on this model for 30 epochs with batch size 16. Keep test rows and extra validation data out of training.').toBe('matched');
      expect(observed.recordingStatus,
        'The recorded training history must be complete. Await training and use the supplied fitting procedure.').toBe('complete');
    });
    it('uses every supplied training pair and rejects an equal-sized mixture with test rows', () => {
      expect(observed.trainingSourceStatus,
        'Keep every supplied training row with its paired label. Reordering pairs is valid. Changing values or substituting test rows fails this check.').toBe('matched');
    });
    it('evaluates the original held-out rows and labels', () => {
      expect(evaluationCapture.captureUnavailable,
        'The evaluation report uses the four output slots. Remove extra recordResult calls to make room. Your earlier output remains available.').toBe(null);
      expect(observed.evaluationSourceStatus,
        'Keep all 43 supplied test rows and labels in their original order.').toBe('matched');
      expect(observed.modelSupportStatus,
        'Keep the supplied three-layer sigmoid classifier compiled with binary crossentropy and accuracy.').toBe('supported');
      expect(observed.measurementStatus,
        'The measured accuracy must agree with the captured decisions from one model state.').toBe('consistent');
      expect(observed.submittedEvaluationStatus,
        'Store the loss and accuracy returned by model.evaluate(testX, testY). They must agree with the measured model output.').toBe('matched');
    });
    it('keeps the trained model state for evaluation', () => {
      expect(observed.modelStateStatus,
        'Evaluate the model produced by the recorded fit. The check could not confirm unchanged weights and configuration.').toBe('matched');
    });
    it('diagnose reports a large gap above the stated boundary', () => {
      expect(diagnose(0.95, 0.6), 'A gap above 0.15 returns large-gap.').toBe('large-gap');
      expect(diagnose(0.15, 0), 'A gap equal to 0.15 is not above the boundary. Both scores are low.').toBe('low-scores');
      expect(diagnose(0.99, 0.83)).toBe('large-gap');
      expect(diagnose(0.9, 0.74)).toBe('large-gap');
      expect(diagnose(0.9, 0.76), 'A smaller gap raises no gap warning.').toBe('no-gap-warning');
      expect(diagnose(0.93, 0.91)).toBe('no-gap-warning');
    });
    it('diagnose reports low scores only after checking the gap', () => {
      expect(diagnose(0.55, 0.52)).toBe('low-scores');
      expect(diagnose(0.69, 0.69)).toBe('low-scores');
      expect(diagnose(0.7, 0.7), 'The low-score comparison is strict. Equality does not trigger it.').toBe('no-gap-warning');
      expect(diagnose(0.71, 0.71)).toBe('no-gap-warning');
      expect(diagnose(0.71, 0.69)).toBe('no-gap-warning');
      expect(diagnose(0.69, 0.71)).toBe('no-gap-warning');
      expect(diagnose(0.68, 0.4), 'Check the gap before checking whether both scores are low.').toBe('large-gap');
    });
    it('trainAcc and testAcc are the two numbers this run produced', () => {
      expect(evaluationCapture.submitted.trainAcc,
        'Read the final training accuracy from history.history.acc before changing the history.').toBe(evaluationCapture.trainingAccuracy);
      expect(Number.isFinite(evaluationCapture.submitted.trainAcc)).toBe(true);
      expect(Number.isFinite(evaluationCapture.submitted.testAcc)).toBe(true);
      expect(Math.abs(evaluationCapture.submitted.testAcc - evaluationCapture.evaluationAccuracy) <= 1e-6,
        'Read testAcc from evalResult[1].dataSync()[0].').toBe(true);
    });
    it('reports the rule applied to the actual measured scores', () => {
      const training = evaluationCapture.trainingAccuracy;
      const evaluation = evaluationCapture.evaluationAccuracy;
      expect(Number.isFinite(training)).toBe(true);
      expect(Number.isFinite(evaluation)).toBe(true);
      const expected = training - evaluation > 0.15 ? 'large-gap'
        : training < 0.7 && evaluation < 0.7 ? 'low-scores' : 'no-gap-warning';
      expect(evaluationCapture.submitted.verdict,
        'Apply the diagnosis rule to the recorded scores from this run. Its label does not identify a cause or authorize release.').toBe(expected);
    });
  });
