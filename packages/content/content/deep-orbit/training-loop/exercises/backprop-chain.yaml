slug: backprop-chain
lessonSlug: backpropagation
title: "Automatic Backpropagation"
instructions: "Use tf.variableGrads() to compute gradients automatically. The starter declares the variable w at 3.0. Write lossFn so it returns w squared, then fill in gradOf(fn) so it returns tf.variableGrads() called on the function it was handed. The grader reassigns w and calls gradOf() again, and its last call hands gradOf a loss function the exercise never shows you, so the gradient has to come out of the function rather than off the page."
starterCode: "const w = tf.variable(tf.scalar(3.0));\n\n// 1. lossFn: the forward pass. Return w squared.\nconst lossFn = () => null; // your code here\n\n// 2. gradOf: differentiate whatever loss function it is handed. The grader\n// calls it again after changing w, and once on a loss of its own.\nfunction gradOf(fn) {\n  return { value: null, grads: null }; // your code here\n}\n\nconst { value: loss, grads } = gradOf(lossFn);"
solutionCode: "const w = tf.variable(tf.scalar(3.0));\n\nconst lossFn = () => w.square();\n\nfunction gradOf(fn) {\n  return tf.variableGrads(fn);\n}\n\nconst { value: loss, grads } = gradOf(lossFn);"
testCode: |
  describe('Backprop', () => {
    it('computes loss w^2 = 9 in the forward pass', () => {
      expect(loss).toBeDefined();
      expect(loss.dataSync()[0]).toBeCloseTo(9.0, 4);
    });
    it('autograd produced dLoss/dw = 2w = 6 for the variable', () => {
      expect(grads).toBeDefined();
      const keys = Object.keys(grads);
      expect(keys.length).toBeGreaterThanOrEqual(1);
      expect(grads[keys[0]].dataSync()[0]).toBeCloseTo(6.0, 4);
    });
    it('the gradient is registered under the trained variable itself', () => {
      expect(Object.keys(grads)).toContain(w.name);
    });
    it('gradOf recomputes: after w = 5, it returns loss 25 and gradient 10', () => {
      w.assign(tf.scalar(5.0));
      const second = gradOf(lossFn);
      expect(second.value.dataSync()[0]).toBeCloseTo(25.0, 4);
      const g = second.grads[Object.keys(second.grads)[0]];
      expect(g.dataSync()[0]).toBeCloseTo(10.0, 4);
    });
    it('gradOf differentiates a loss the grader wrote: 3w^2 + 2w at w = 0.5 gives loss 1.75 and gradient 5.0', () => {
      w.assign(tf.scalar(0.5));
      const third = gradOf(() => w.square().mul(3).add(w.mul(2)));
      expect(third.value.dataSync()[0]).toBeCloseTo(1.75, 4);
      const g = third.grads[Object.keys(third.grads)[0]];
      expect(g.dataSync()[0]).toBeCloseTo(5.0, 4);
    });
  });
