slug: backprop-chain
lessonSlug: backpropagation
title: "Automatic Backpropagation"
instructions: "Two ways to reach the same slope, and the exercise is the comparison between them. The starter declares the variable w at 3.0. (1) Write lossFn so it returns w squared. (2) Fill in gradOf(fn), which differentiates whatever loss function it is handed. It returns the loss the forward pass produced and, beside it, a gradient for every variable that loss touched, filed under the variable's own name. No derivative you worked out yourself appears anywhere in it. (3) Fill in numericGradOf(fn, variable), the estimate this lesson opens with, for one scalar variable at a time. Run fn at the variable's current value, run it again with that variable 0.001 higher, turn the difference into a slope, put the variable back, and return a plain number. The grader reassigns w and calls gradOf again, hands it two loss functions the exercise never shows you, the second over three variables at once, and checks that your two answers for it land within 0.05 of each other. It also counts how many times each of them runs the loss it was given, because that count is the difference between the two methods: the estimate pays a forward pass per variable, and the recorded pass pays one for all of them."
starterCode: |
  const w = tf.variable(tf.scalar(3.0));

  // 1. lossFn: the forward pass. Return w squared.
  const lossFn = () => null; // your code here

  // 2. gradOf: differentiate whatever loss function it is handed. The grader
  // calls it again after changing w, and once on a loss of its own.
  function gradOf(fn) {
    return { value: null, grads: null }; // your code here
  }

  const { value: loss, grads } = gradOf(lossFn);

  // The older method, kept beside the newer one so the two can be measured
  // against each other. One scalar variable at a time, one plain number back.
  function numericGradOf(fn, variable) {
    return null; // your code here
  }
solutionCode: |
  const w = tf.variable(tf.scalar(3.0));

  const lossFn = () => w.square();

  function gradOf(fn) {
    return tf.variableGrads(fn);
  }

  const { value: loss, grads } = gradOf(lossFn);

  function numericGradOf(fn, variable) {
    const saved = variable.dataSync()[0];
    const base = fn().dataSync()[0];
    variable.assign(tf.scalar(saved + 0.001));
    const bumped = fn().dataSync()[0];
    variable.assign(tf.scalar(saved));
    return (bumped - base) / 0.001;
  }
testCode: |
  describe('Backprop', () => {
    it('the forward-pass value comes back next to the gradients', () => {
      expect(loss, 'gradOf returned no value, so the forward pass either never ran or its result was dropped. One call returns both halves: the loss the forward pass produced, and the gradients the backward pass found.').toBeDefined();
      expect(loss.dataSync()[0], 'The value half is the loss at the current weight, computed by running the function rather than copied from anywhere.').toBeCloseTo(9.0, 4);
    });
    it('the backward pass produced a gradient for the variable, not a number you typed', () => {
      expect(grads, 'gradOf returned no gradients.').toBeDefined();
      const keys = Object.keys(grads);
      expect(keys.length, 'The gradients arrive in an object with one entry per variable the loss touched, so an empty object means nothing was differentiated.').toBeGreaterThanOrEqual(1);
      expect(grads[keys[0]].dataSync()[0], 'This is the slope of the loss at the current weight. A gradient of 0 usually means the loss never touched the variable.').toBeCloseTo(6.0, 4);
    });
    it('the gradient is registered under the trained variable itself', () => {
      expect(grads, 'gradOf returned no gradients, so there is no key to look under.').toBeDefined();
      expect(Object.keys(grads), 'The gradients are keyed by variable name, which is how a real model keeps 673 of them apart. This one is filed under a different key.').toContain(w.name);
    });
    it('gradOf recomputes after the weight changes', () => {
      w.assign(tf.scalar(5.0));
      const second = gradOf(lossFn);
      expect(second, 'The second call returned nothing.').toBeDefined();
      expect(second.value, 'The second call came back without a value half, so the forward pass result was dropped.').toBeDefined();
      expect(second.grads, 'The second call came back without a gradients half.').toBeDefined();
      expect(second.value.dataSync()[0], 'The loss has to be recomputed at the new weight. A number frozen at call one was right only for the old weight.').toBeCloseTo(25.0, 4);
      const g = second.grads[Object.keys(second.grads)[0]];
      expect(g, 'No gradient came back for the variable on this call.').toBeDefined();
      expect(g.dataSync()[0], 'The slope moves with the weight. A gradient that repeats the first call means the answer was stored rather than computed.').toBeCloseTo(10.0, 4);
    });
    it('gradOf differentiates a loss the grader wrote, which this exercise never shows', () => {
      w.assign(tf.scalar(0.5));
      const third = gradOf(() => w.square().mul(3).add(w.mul(2)));
      expect(third, 'The call on the loss the grader wrote returned nothing.').toBeDefined();
      expect(third.value, 'That call came back without a value half.').toBeDefined();
      expect(third.grads, 'That call came back without a gradients half.').toBeDefined();
      expect(third.value.dataSync()[0], 'This loss carries a term the starter never had, so its value has to come from running the function you were handed.').toBeCloseTo(1.75, 4);
      const g = third.grads[Object.keys(third.grads)[0]];
      expect(g, 'No gradient came back for the variable on the loss the grader wrote.').toBeDefined();
      expect(g.dataSync()[0], 'A derivative written by hand inside gradOf answers for the wrong function here. The call differentiates whatever it records.').toBeCloseTo(5.0, 4);
    });
    it('one forward pass per call, on a loss with three variables in it', () => {
      // The method this lesson retires costs one extra forward pass per
      // parameter. A gradOf built on finite differences passed every test above
      // on 2026-09-08 (audit round 5), because a central difference is exact on
      // a parabola at any step size. Two things stop it here: this loss is not
      // a polynomial, and the forward pass is counted. Autograd runs it once
      // and reads all three gradients off that single recording.
      const a = tf.variable(tf.scalar(1.5));
      const b = tf.variable(tf.scalar(-0.5));
      const c = tf.variable(tf.scalar(0.25));
      let passes = 0;
      const composed = () => {
        passes += 1;
        return a.sin().add(b.square()).add(c.mul(a));
      };
      const out = gradOf(composed);
      expect(out, 'The call on the three-variable loss returned nothing.').toBeDefined();
      expect(out.value, 'That call came back without a value half.').toBeDefined();
      expect(out.grads, 'That call came back without a gradients half, so no variable was differentiated.').toBeDefined();
      expect(out.value.dataSync()[0], 'The value is this composed loss at the three weights the grader set.').toBeCloseTo(Math.sin(1.5) + 0.25 + 0.25 * 1.5, 4);
      expect(out.grads[a.name], 'Every variable the loss touched gets an entry, keyed by its own name. The first one is missing.').toBeDefined();
      expect(out.grads[a.name].dataSync()[0], 'The first variable reaches the loss along two routes, through the sine and through the product, so its gradient is the sum of both. That summing is the chain rule doing its work.').toBeCloseTo(Math.cos(1.5) + 0.25, 4);
      expect(out.grads[b.name].dataSync()[0], 'The second variable only ever appears squared.').toBeCloseTo(-1.0, 4);
      expect(out.grads[c.name].dataSync()[0], 'The third variable is multiplied by the first, so its slope is whatever the first one currently holds.').toBeCloseTo(1.5, 4);
      expect(passes, 'The loss function ran more times than a recorded forward pass needs. Re-running it per parameter is the numeric-gradient method this lesson retires: 673 extra forward passes for DEEP SCAN, 27 seconds a step. The backward pass runs the forward pass once and reads every gradient off that one sweep.').toBeLessThanOrEqual(2);
    });
    it('the estimate agrees with the recorded pass and costs a forward pass per variable', () => {
      // Where the lesson's claim gets measured rather than asserted. Both
      // methods answer the same question here, so the only thing separating
      // them is what they cost, and the learner reads that off their own two
      // functions. THE TOLERANCE IS MEASURED, not chosen for comfort. With the
      // 0.001 step the instructions name, on float32 scalars, the estimate
      // missed the recorded gradient by 0.000519 on the parabola and by
      // 0.000422, 0.001026 and 0.000010 on the three variables of the
      // composed loss (2026-09-13, cpu backend). Most of that is the forward
      // difference itself: a one-sided nudge of size h carries an error of
      // about h/2 times the curvature, which comes to 0.001 on the two
      // squared terms. The checks allow 0.05, roughly fifty times the worst
      // of those, since the learner's browser runs webgl and this harness
      // cannot measure its float arithmetic. Every wrong answer this test
      // exists to catch misses by at least a whole unit.
      expect(typeof numericGradOf, 'numericGradOf is missing. This exercise asks for the method the lesson retires as well as the one that replaces it, because the cost of the first is the whole argument for the second.').toBe('function');
      w.assign(tf.scalar(3.0));
      const recorded = gradOf(lossFn).grads[w.name].dataSync()[0];
      const estimate = numericGradOf(lossFn, w);
      expect(typeof estimate, 'numericGradOf hands back a plain number: a change in loss divided by the nudge that caused it. A tensor or an object is the shape the other function returns.').toBe('number');
      expect(estimate, 'The estimate is nowhere near the slope the backward pass reports at this weight. A nudge of the size the instructions name lands within 0.001 of it on this loss, so a gap this wide is a different calculation rather than a rounding difference.').toBeCloseTo(recorded, 1);
      expect(w.dataSync()[0], 'The weight came back changed. A nudge that is never undone leaves the model somewhere the optimizer did not put it, and every number read afterwards is read at the wrong place.').toBeCloseTo(3.0, 4);
      const a = tf.variable(tf.scalar(1.5));
      const b = tf.variable(tf.scalar(-0.5));
      const c = tf.variable(tf.scalar(0.25));
      let passes = 0;
      const composed = () => {
        passes += 1;
        return a.sin().add(b.square()).add(c.mul(a));
      };
      const autoNames = ['variableGrads', 'grad', 'grads', 'valueAndGrad', 'valueAndGrads', 'customGrad'];
      const autoCalls = () => autoNames.reduce((s, k) => s + (tf.__calls[k] || 0), 0);
      gradOf(composed);
      const recordedPasses = passes;
      passes = 0;
      const before = autoCalls();
      const est = [numericGradOf(composed, a), numericGradOf(composed, b), numericGradOf(composed, c)];
      const estimatePasses = passes;
      expect(autoCalls() - before, 'numericGradOf called the automatic differentiator. That is the other half of this exercise. This half is the method that needs none, and routing it through the recorded pass reports the cost of the recorded pass, which is the one number the comparison cannot borrow.').toBe(0);
      expect(est[0], 'The estimate for the first variable misses the slope the backward pass reports for it. That variable reaches the loss along two routes, and a nudge moves both at once, so the estimate carries the sum the same way the chain rule does.').toBeCloseTo(Math.cos(1.5) + 0.25, 1);
      expect(est[1], 'The estimate for the second variable misses its slope. Only one variable may move per estimate: the other two stay where they are, or the difference in loss belongs to more than one of them.').toBeCloseTo(-1.0, 1);
      expect(est[2], 'The estimate for the third variable misses its slope.').toBeCloseTo(1.5, 1);
      expect(recordedPasses, 'gradOf ran the loss more times than one recording needs, so the two costs below are not being compared on equal terms.').toBeLessThanOrEqual(2);
      expect(estimatePasses, 'Estimating three slopes ran the forward pass ' + estimatePasses + ' times, against ' + recordedPasses + ' for the recorded pass that produced all three at once. Each estimate needs the loss where the variable stands and the loss with it moved, so three of them cannot cost fewer than six runs. DEEP SCAN has 673 parameters and the same arithmetic applies to every one of them.').toBeGreaterThanOrEqual(6);
    });
  });
estimatedMinutes: 15
difficulty: intermediate
