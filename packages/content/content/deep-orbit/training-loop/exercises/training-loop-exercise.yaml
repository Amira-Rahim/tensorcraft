slug: training-loop-exercise
lessonSlug: training-loop
title: "Early stopping on validation loss"
instructions: |
  Help Demir stop the supplied training run when validation loss stops improving.

  1. Write `makeEarlyStopping()` to return
     `tf.callbacks.earlyStopping({ monitor: 'val_loss', patience: 5, minDelta: 0 })`.
  2. Fit the model on `trainX` and `trainY` with at most 500 epochs,
     `validationSplit: 0.2`, and a batch size from 8 to 64 (default 32).
     Attach the callback and save the awaited result as `history`.
     A valid run may stop early or reach the epoch limit.
  3. Write `diagnose(trainLosses, valLosses)` to describe the recent loss trends.
     Both arguments must be equally long arrays of finite, nonnegative numbers.
     Reject invalid arrays. Return `'insufficient-history'` for fewer than 20 entries.

  For each curve, compare the mean of its last ten values with the mean of
  the previous ten. A drop greater than 5% is improving. A rise greater than
  5% is worsening. Exactly 5% is flat. Use multiplication for the comparison,
  not division: zero to positive is worsening. Zero to zero is flat.
  Allow an absolute tolerance of `1e-12` at the 5% boundaries.

  Check these rules in order:

  - Validation improves: return `'validation-improving'`.
  - Both curves worsen: return `'both-worsening'`.
  - Training improves while validation worsens: return `'train-down-validation-up'`.
  - Any other validation worsening: return `'validation-worsening'`.
  - Otherwise: return `'plateau'`.

  Inspect the curves and the diagnosis from this same fit. The chart keeps at most
  64 original epoch samples. Diagnosis uses copies of the full histories, and
  its summary retains the original recent windows. A diagnosis error keeps the
  measured curves available. This inspection does not run another fit.

  These labels describe what the curves did. They cannot tell you why.
  Investigate the data and run further checks before blaming overfitting,
  changed data, or the learning rate.
starterCode: |
  // Synthetic practice rows. Clipping enforces this fixture's [0, 1] range.
  // These synthetic labels and distributions illustrate the story.
  const { trainX, trainY } = tf.tidy(() => {
    const calm = tf.clipByValue(
      tf.concat(
        [
          tf.randomNormal([50, 1], 0.17, 0.1, 'float32', 7),
          tf.randomNormal([50, 1], 0.81, 0.1, 'float32', 8),
          tf.randomNormal([50, 1], 0.23, 0.1, 'float32', 9),
        ],
        1,
      ),
      0,
      1,
    );
    const flagged = tf.clipByValue(
      tf.concat(
        [
          tf.randomNormal([50, 1], 0.84, 0.1, 'float32', 41),
          tf.randomNormal([50, 1], 0.18, 0.1, 'float32', 42),
          tf.randomNormal([50, 1], 0.78, 0.1, 'float32', 43),
        ],
        1,
      ),
      0,
      1,
    );
    // Interleaved, because validationSplit takes the LAST rows and a validation
    // set containing only flagged windows cannot measure both classes.
    const order = [];
    for (let i = 0; i < 50; i++) {
      order.push(i);
      order.push(50 + i);
    }
    const trainX = tf.concat([calm, flagged]).gather(order);
    const cleanY = tf.concat([tf.zeros([50, 1]), tf.ones([50, 1])]).gather(order);
    const labels = cleanY.arraySync();
    for (const i of [3, 17, 29, 41, 52, 68]) labels[i] = [1 - labels[i][0]];
    const trainY = tf.tensor2d(labels);
    return { trainX, trainY };
  });

  // Start a fresh network so this history records the run from initialization.
  const model = tf.sequential();
  model.add(tf.layers.dense({ units: 32, activation: 'relu', inputShape: [3] }));
  model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
  model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
  model.compile({ optimizer: 'adam', loss: 'binaryCrossentropy', metrics: ['accuracy'] });

  function makeEarlyStopping() {
    return null; // your code here
  }

  const history = null; // your code here

  function diagnose(trainLosses, valLosses) {
    // your code here
  }
solutionCode: |
  const { trainX, trainY } = tf.tidy(() => {
    const calm = tf.clipByValue(
      tf.concat(
        [
          tf.randomNormal([50, 1], 0.17, 0.1, 'float32', 7),
          tf.randomNormal([50, 1], 0.81, 0.1, 'float32', 8),
          tf.randomNormal([50, 1], 0.23, 0.1, 'float32', 9),
        ],
        1,
      ),
      0,
      1,
    );
    const flagged = tf.clipByValue(
      tf.concat(
        [
          tf.randomNormal([50, 1], 0.84, 0.1, 'float32', 41),
          tf.randomNormal([50, 1], 0.18, 0.1, 'float32', 42),
          tf.randomNormal([50, 1], 0.78, 0.1, 'float32', 43),
        ],
        1,
      ),
      0,
      1,
    );
    const order = [];
    for (let i = 0; i < 50; i++) {
      order.push(i);
      order.push(50 + i);
    }
    const trainX = tf.concat([calm, flagged]).gather(order);
    const cleanY = tf.concat([tf.zeros([50, 1]), tf.ones([50, 1])]).gather(order);
    const labels = cleanY.arraySync();
    for (const i of [3, 17, 29, 41, 52, 68]) labels[i] = [1 - labels[i][0]];
    const trainY = tf.tensor2d(labels);
    return { trainX, trainY };
  });

  const model = tf.sequential();
  model.add(tf.layers.dense({ units: 32, activation: 'relu', inputShape: [3] }));
  model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
  model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
  model.compile({ optimizer: 'adam', loss: 'binaryCrossentropy', metrics: ['accuracy'] });

  function makeEarlyStopping() {
    return tf.callbacks.earlyStopping({ monitor: 'val_loss', patience: 5, minDelta: 0 });
  }

  const history = await model.fit(trainX, trainY, {
    epochs: 500,
    validationSplit: 0.2,
    callbacks: makeEarlyStopping(),
  });

  function diagnose(trainLosses, valLosses) {
    if (
      !Array.isArray(trainLosses) ||
      !Array.isArray(valLosses) ||
      trainLosses.length !== valLosses.length ||
      ![...trainLosses, ...valLosses].every((v) => Number.isFinite(v) && v >= 0)
    )
      throw new Error('Invalid loss history');
    if (valLosses.length < 20) return 'insufficient-history';
    const trend = (values) => {
      const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
      const before = mean(values.slice(-20, -10)),
        recent = mean(values.slice(-10));
      if (before === 0) return recent === 0 ? 'flat' : 'up';
      if (recent < before * 0.95 - 1e-12) return 'down';
      if (recent > before * 1.05 + 1e-12) return 'up';
      return 'flat';
    };
    const training = trend(trainLosses),
      validation = trend(valLosses);
    if (validation === 'down') return 'validation-improving';
    if (validation === 'up' && training === 'up') return 'both-worsening';
    if (validation === 'up' && training === 'down') return 'train-down-validation-up';
    if (validation === 'up') return 'validation-worsening';
    return 'plateau';
  }
testCode: |
  describe('Early stopping and observed trends', () => {
    it('returns aligned finite training and validation histories from a real fit', () => {
      expect(history).toBeDefined();
      expect(history instanceof tf.History).toBe(true);
      const loss = history.history.loss,
        val = history.history.val_loss;
      expect(loss.length).toBeGreaterThan(0);
      expect(loss.length).toBeLessThanOrEqual(500);
      expect(val.length).toBe(loss.length);
      expect([...loss, ...val].every((v) => Number.isFinite(v) && v >= 0)).toBe(true);
      expect(history.params.samples).toBe(80);
      const batch = history.params.batchSize || 32;
      expect(batch >= 8 && batch <= 64).toBe(true);
      expect(model.optimizer.iterations).toBe(Math.ceil(80 / batch) * loss.length);
      const shown = Math.min(64, loss.length);
      const epochs = Array.from({ length: shown }, (_, i) => Math.round(i * (loss.length - 1) / Math.max(1, shown - 1)));
      recordResult({
        kind: 'series', title: 'Your training and validation losses',
        summary: 'Up to 64 evenly spaced epochs from your actual fit history on the supplied synthetic rows. This summary runs no extra training.',
        xLabel: 'Epoch', yLabel: 'Loss', labels: epochs.map((i) => String(i + 1)),
        series: [{ name: 'Training', values: epochs.map((i) => loss[i]) }, { name: 'Validation', values: epochs.map((i) => val[i]) }],
      });
      // Capture before learner diagnosis can mutate its argument copies or fail.
      const count = loss.length;
      const hasWindows = count >= 20;
      const windowMean = (values, start, end) =>
        values.slice(start, end).reduce((total, value) => total + value / 10, 0);
      const trainingPrevious = hasWindows ? windowMean(loss, count - 20, count - 10) : null;
      const trainingRecent = hasWindows ? windowMean(loss, count - 10, count) : null;
      const validationPrevious = hasWindows ? windowMean(val, count - 20, count - 10) : null;
      const validationRecent = hasWindows ? windowMean(val, count - 10, count) : null;
      let status = 'returned', diagnosis = null, detail = '';
      const labels = ['insufficient-history', 'validation-improving', 'both-worsening',
        'train-down-validation-up', 'validation-worsening', 'plateau'];
      try {
        const result = diagnose([...loss], [...val]);
        if (labels.includes(result)) diagnosis = result;
        else {
          status = 'invalid';
          detail = 'diagnose returned ' + (result === null ? 'null' : typeof result) +
            '. Expected one of the six trend labels.';
        }
      } catch (error) {
        status = 'threw';
        try {
          detail = String(error && error.message || error).slice(0, 200);
        } catch {
          detail = 'diagnose threw a value that could not be converted to text.';
        }
      }
      recordResult({
        kind: 'table', title: 'Your full-history diagnosis',
        summary: 'Your diagnose result from copies of the complete actual fit histories. The original epoch windows and means are recorded before diagnosis. No extra fit runs.',
        columns: ['Measure', 'Value'],
        rows: [
          ['Completed epochs', count],
          ['Previous window first epoch', hasWindows ? count - 19 : null],
          ['Previous window last epoch', hasWindows ? count - 10 : null],
          ['Recent window first epoch', hasWindows ? count - 9 : null],
          ['Recent window last epoch', hasWindows ? count : null],
          ['Training previous mean', trainingPrevious],
          ['Training recent mean', trainingRecent],
          ['Validation previous mean', validationPrevious],
          ['Validation recent mean', validationRecent],
          ['Diagnosis status', status],
          ['Returned diagnosis', diagnosis],
          ['Diagnosis detail', detail],
        ],
      });
      const direction = (previous, recent) => {
        if (previous === 0) return recent === 0 ? 'flat' : 'up';
        if (recent < previous * 0.95 - 1e-12) return 'down';
        if (recent > previous * 1.05 + 1e-12) return 'up';
        return 'flat';
      };
      let expected = 'insufficient-history';
      if (hasWindows) {
        const training = direction(trainingPrevious, trainingRecent);
        const validation = direction(validationPrevious, validationRecent);
        expected = validation === 'down' ? 'validation-improving'
          : validation === 'up' && training === 'up' ? 'both-worsening'
          : validation === 'up' && training === 'down' ? 'train-down-validation-up'
          : validation === 'up' ? 'validation-worsening' : 'plateau';
      }
      expect(status, 'Your curves were captured, but diagnose must return a valid trend label for the full history.').toBe('returned');
      expect(diagnosis, 'Apply diagnose to the full actual histories, using the final two ten-epoch windows.').toBe(expected);
    });
    it('attaches the validation callback to the fit that produced history', () => {
      const fit = tf.__fits.find((entry) => entry && entry.history === history);
      expect(fit, 'No recorded model.fit call produced this history. Await the training call.').toBeDefined();
      expect(fit.callbacks.some((c) => c.monitor === 'val_loss' && c.patience === 5 && c.minDelta === 0),
        'The requested early-stopping callback never reached this fit. Pass it in the callbacks option.').toBe(true);
    });
    it('stops on five consecutive non-improvements, watching validation rather than training', async () => {
      const probe = async (values) => {
        const callback = makeEarlyStopping(),
          m = tf.sequential();
        m.add(tf.layers.dense({ units: 1, inputShape: [1] }));
        m.compile({ optimizer: 'sgd', loss: 'meanSquaredError' });
        m.stopTraining = false;
        callback.setModel(m);
        await callback.onTrainBegin({});
        let seen = 0;
        for (let i = 0; i < values.length; i++) {
          await callback.onEpochEnd(i, { val_loss: values[i], loss: 10 - i });
          seen++;
          if (m.stopTraining) break;
        }
        const stopped = m.stopTraining;
        m.dispose();
        return { seen, stopped };
      };
      expect(await probe([1, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.4])).toEqual({ seen: 7, stopped: true });
      expect(await probe([1, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3])).toEqual({
        seen: 8,
        stopped: false,
      });
      expect(await probe([1, 0.999, 0.998, 0.997, 0.996, 0.995, 0.994, 0.993])).toEqual({
        seen: 8,
        stopped: false,
      });
      expect(await probe([1, 1, 1, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9])).toEqual({
        seen: 9,
        stopped: true,
      });
    });
    it('respects patience when a real run ends before the budget', () => {
      const v = history.history.val_loss;
      const fit = tf.__fits.find((entry) => entry && entry.history === history);
      const budget = fit && fit.settings && fit.settings.epochs;
      expect(Number.isInteger(budget) && budget >= 1 && budget <= 500,
        'Choose an epoch budget from 1 to 500.').toBe(true);
      if (v.length === budget) return;
      expect(v.length).toBeLessThan(budget);
      let best = 0;
      for (let i = 1; i < v.length; i++) if (v[i] < v[best]) best = i;
      expect(v.length - 1 - best).toBe(5);
    });
    it('distinguishes validation trends using both curves', () => {
      const curve = (a, b) => [...Array(10).fill(a), ...Array(10).fill(b)];
      for (const [tr, va, want] of [
        [[1, 0.8], [1, 0.8], 'validation-improving'],
        [[1, 0.8], [1, 1.2], 'train-down-validation-up'],
        [[1, 1.2], [1, 1.2], 'both-worsening'],
        [[1, 1], [1, 1.2], 'validation-worsening'],
        [[1, 0.8], [1, 1], 'plateau'],
        [[1, 1], [0, 0], 'plateau'],
        [[0, 1], [0, 1], 'both-worsening'],
        [[1, 1], [1, 1.05], 'plateau'],
        [[1, 1], [1, 0.95], 'plateau'],
      ])
        expect(diagnose(curve(...tr), curve(...va))).toBe(want);
    });
    it('uses recent windows and accepts short histories without inventing a diagnosis', () => {
      expect(diagnose([], [])).toBe('insufficient-history');
      expect(diagnose([1], [2])).toBe('insufficient-history');
      const tr = [...Array(30).fill(20), ...Array(10).fill(1), ...Array(10).fill(0.8)],
        va = [...Array(30).fill(20), ...Array(10).fill(1), ...Array(10).fill(1.2)];
      expect(diagnose(tr, va)).toBe('train-down-validation-up');
      expect(() => diagnose([1], [])).toThrow();
      expect(() => diagnose([NaN], [1])).toThrow();
      expect(() => diagnose([-1], [1])).toThrow();
    });
  });
