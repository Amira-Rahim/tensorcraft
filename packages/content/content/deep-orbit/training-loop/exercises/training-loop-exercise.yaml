slug: training-loop-exercise
lessonSlug: training-loop
title: "Train a Model with model.fit()"
instructions: "Train the compiled model using model.fit(). Use the provided training data (xs and ys), train for 10 epochs with a batch size of 2, and store the training result in a variable called 'history'."
starterCode: "const model = tf.sequential();\nmodel.add(tf.layers.dense({ units: 1, inputShape: [2] }));\nmodel.compile({ optimizer: 'sgd', loss: 'meanSquaredError' });\n\nconst xs = tf.tensor2d([[1, 2], [3, 4], [5, 6], [7, 8]]);\nconst ys = tf.tensor2d([[3], [7], [11], [15]]);\n\n// Train the model\nconst history = null; // your code here"
solutionCode: "const model = tf.sequential();\nmodel.add(tf.layers.dense({ units: 1, inputShape: [2] }));\nmodel.compile({ optimizer: 'sgd', loss: 'meanSquaredError' });\n\nconst xs = tf.tensor2d([[1, 2], [3, 4], [5, 6], [7, 8]]);\nconst ys = tf.tensor2d([[3], [7], [11], [15]]);\n\nconst history = await model.fit(xs, ys, { epochs: 10, batchSize: 2 });"
testCode: |
  describe('Training', () => {
    it('trained for exactly 10 epochs', () => {
      expect(history).toBeDefined();
      expect(history.history.loss).toHaveLength(10);
    });
    it('loss decreased across training', () => {
      const losses = history.history.loss;
      expect(losses[losses.length - 1]).toBeLessThan(losses[0]);
    });
    it('the model itself actually learned: its live MSE beats the epoch-0 loss', () => {
      const mse = tf.losses.meanSquaredError(ys, model.predict(xs)).dataSync()[0];
      expect(Number.isFinite(mse)).toBe(true);
      expect(mse).toBeLessThan(history.history.loss[0]);
    });
  });
estimatedMinutes: 15
difficulty: intermediate
