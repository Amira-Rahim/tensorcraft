title: "Two Losses, and the Rule for Picking One"
instructions: "Three functions. (1) `mseLoss(labels, predictions)` returns the mean squared error as a scalar tensor: use tf.losses.meanSquaredError(). (2) `bceLoss(labels, logits)` returns binary cross-entropy as a scalar tensor, reading its second argument as raw logits: use tf.losses.sigmoidCrossEntropy(), which applies the sigmoid itself. (3) `pickLoss(lastLayerActivation)` returns 'binaryCrossentropy' when the last layer is 'sigmoid', because that layer has already produced probabilities, and 'sigmoidCrossEntropy' for any other last layer, because it emits logits. The grader calls all three on inputs of its own."
