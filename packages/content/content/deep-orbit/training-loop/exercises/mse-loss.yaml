slug: mse-loss
lessonSlug: loss-functions
title: "Calculate MSE Loss"
instructions: "Calculate the Mean Squared Error loss between a tensor of predictions and a tensor of true labels. Use tf.losses.meanSquaredError()."
starterCode: "const predictions = tf.tensor([2.5, 0.0, 2.1, 1.3]);\nconst labels = tf.tensor([3.0, -0.5, 2.0, 1.0]);\n\n// Calculate MSE loss\nconst loss = null; // your code here"
solutionCode: "const predictions = tf.tensor([2.5, 0.0, 2.1, 1.3]);\nconst labels = tf.tensor([3.0, -0.5, 2.0, 1.0]);\n\nconst loss = tf.losses.meanSquaredError(labels, predictions);"
testCode: "describe('MSE Loss', () => { it('produces a loss value', () => { expect(loss).toBeDefined(); }); it('is a scalar', () => { expect(loss.shape).toEqual([]); }); it('computes correct MSE', () => { const val = loss.dataSync()[0]; expect(val).toBeCloseTo(0.1475, 3); }); });"
estimatedMinutes: 10
difficulty: beginner
