solutionCode: |
  function mseLoss(labels: tf.Tensor, predictions: tf.Tensor): tf.Tensor {
    return tf.losses.meanSquaredError(labels, predictions);
  }

  function bceLoss(labels: tf.Tensor, logits: tf.Tensor): tf.Tensor {
    return tf.losses.sigmoidCrossEntropy(labels, logits);
  }

  function pickLoss(lastLayerActivation: string): string {
    return lastLayerActivation === 'sigmoid' ? 'binaryCrossentropy' : 'sigmoidCrossEntropy';
  }
testCode: |
  describe('two losses and the rule for picking one', () => {
    it('mseLoss is a scalar', () => {
      const loss = mseLoss(tf.tensor([3.0, -0.5, 2.0, 1.0]), tf.tensor([2.5, 0.0, 2.1, 1.3]));
      expect(loss.shape).toEqual([]);
    });
    it('computes correct MSE', () => {
      const loss = mseLoss(tf.tensor([3.0, -0.5, 2.0, 1.0]), tf.tensor([2.5, 0.0, 2.1, 1.3]));
      expect(loss.dataSync()[0]).toBeCloseTo(0.15, 2);
    });
    it('works on a second pair (no memorized value): errors [2, 0] -> MSE 2', () => {
      const loss = mseLoss(tf.tensor([1, 2]), tf.tensor([3, 2]));
      expect(loss.dataSync()[0]).toBeCloseTo(2.0, 5);
    });
    it('bceLoss reads argument two as logits: a logit of 0 is a probability of 0.5, so the loss is ln(2)', () => {
      const loss = bceLoss(tf.tensor([1, 0]), tf.tensor([0, 0]));
      expect(loss.shape).toEqual([]);
      expect(loss.dataSync()[0]).toBeCloseTo(0.6931, 3);
    });
    it('bceLoss tracks its inputs: confident and right scores far below confident and wrong', () => {
      const right = bceLoss(tf.tensor([1, 0]), tf.tensor([3, -3])).dataSync()[0];
      const wrong = bceLoss(tf.tensor([1, 0]), tf.tensor([-3, 3])).dataSync()[0];
      expect(right).toBeLessThan(0.1);
      expect(wrong).toBeGreaterThan(3);
    });
    it('the two losses disagree on the same tensors, so the one you pick decides what counts as wrong', () => {
      const labels = tf.tensor([1, 0, 1, 0, 1]);
      const logits = tf.tensor([0.4, -0.4, -0.8, 0.8, 1.4]);
      const mse = mseLoss(labels, logits).dataSync()[0];
      const bce = bceLoss(labels, logits).dataSync()[0];
      expect(mse).toBeCloseTo(0.912, 2);
      expect(bce).toBeCloseTo(0.7177, 3);
      expect(Math.abs(mse - bce)).toBeGreaterThan(0.1);
    });
    it('pickLoss follows the last layer it is given, not a memorized string', () => {
      expect(pickLoss('sigmoid')).toBe('binaryCrossentropy');
      expect(pickLoss('linear')).toBe('sigmoidCrossEntropy');
      expect(pickLoss('none')).toBe('sigmoidCrossEntropy');
    });
  });
