slug: mse-loss
lessonSlug: loss-functions
title: "MSE and binary cross-entropy"
instructions: |
  Help Farah measure prediction errors. Write three functions:

  1. `mseLoss(labels, predictions)` returns a scalar mean squared error tensor
     using `tf.losses.meanSquaredError`.
  2. `bceLoss(labels, logits)` returns a scalar binary cross-entropy tensor
     using `tf.losses.sigmoidCrossEntropy`. This API takes raw scores called
     logits and applies sigmoid itself.
  3. `pickBceForm(outputKind)` chooses the cross-entropy form. For
     `'probabilities'`, return `'binaryCrossentropy'`. For `'logits'`, return
     `'sigmoidCrossEntropy'`. Throw an error for any other or missing value.

  For the third function, the task has already chosen binary cross-entropy.
  You are choosing which API matches the output. A sigmoid output supplies
  probabilities. A linear output trained as a logit uses the logits form.
  If you do not know what an output represents, its activation name alone
  may not give you enough information to choose.
