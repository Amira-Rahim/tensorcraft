slug: mse-loss
lessonSlug: loss-functions
title: "Two Losses, and Cross-Entropy's Two Forms"
instructions: "Three functions. (1) `mseLoss(labels, predictions)` returns the mean squared error as a scalar tensor: use tf.losses.meanSquaredError(). (2) `bceLoss(labels, logits)` returns binary cross-entropy as a scalar tensor, reading its second argument as raw logits: use tf.losses.sigmoidCrossEntropy(), which applies the sigmoid itself. (3) `pickBceForm(lastLayerActivation)` starts from a loss you have already chosen, binary cross-entropy, and picks which of its two forms to call. A sigmoid last layer hands you probabilities, so return 'binaryCrossentropy'. Any other last layer hands you logits, so return 'sigmoidCrossEntropy', and that stays true for activation names this lesson never shows you. The task type picks the loss; the last layer only picks the form. The grader calls all three on inputs of its own."
