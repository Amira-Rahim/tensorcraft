solutionCode: |
  function mseLoss(labels: tf.Tensor, predictions: tf.Tensor): tf.Tensor {
    return tf.losses.meanSquaredError(labels, predictions);
  }

  function bceLoss(labels: tf.Tensor, logits: tf.Tensor): tf.Tensor {
    return tf.losses.sigmoidCrossEntropy(labels, logits);
  }

  function pickBceForm(outputKind: string): string {
    if (outputKind === 'probabilities') return 'binaryCrossentropy';
    if (outputKind === 'logits') return 'sigmoidCrossEntropy';
    throw new Error('Expected probabilities or logits');
  }
testCode: |
  describe('two losses and the form rule', () => {
    it('mseLoss comes back reduced: one number for the whole batch, not one per row', () => {
      const loss = mseLoss(tf.tensor([3.0, -0.5, 2.0, 1.0]), tf.tensor([2.5, 0.0, 2.1, 1.3]));
      expect(loss, 'mseLoss returned nothing, so there is no loss to grade. The TFJS call hands back a tensor. Return it.').toBeDefined();
      expect(loss.shape, 'A loss is one number for the whole batch, so its shape is the empty list. A shape with a row count in it means your code still needs to average the per-row errors.').toEqual([]);
    });
    it('mseLoss squares the differences before it averages them', () => {
      const loss = mseLoss(tf.tensor([3.0, -0.5, 2.0, 1.0]), tf.tensor([2.5, 0.0, 2.1, 1.3]));
      expect(loss, 'mseLoss returned nothing, so there is no number to check.').toBeDefined();
      expect(loss.dataSync()[0], 'The squares come first, then the mean. Averaging the raw differences lets a positive miss cancel a negative one, which is the reason the squares are there at all.').toBeCloseTo(0.15, 2);
    });
    it('mseLoss reads the pair it is handed, including one the lesson never shows', () => {
      const loss = mseLoss(tf.tensor([1, 2]), tf.tensor([3, 2]));
      expect(loss, 'mseLoss returned nothing on the second pair.').toBeDefined();
      expect(loss.dataSync()[0], 'These are not the numbers from the lesson, so a memorized answer cannot clear this one. One row misses, the other is exact, and the mean runs over both.').toBeCloseTo(2.0, 5);
    });
    it('bceLoss reads argument two like a raw score, not like a probability', () => {
      const loss = bceLoss(tf.tensor([1, 0]), tf.tensor([0, 0]));
      expect(loss, 'bceLoss returned nothing, so there is no loss to grade.').toBeDefined();
      expect(loss.shape, 'Cross-entropy also reduces to one number for the whole batch.').toEqual([]);
      expect(loss.dataSync()[0], 'A logit of 0 is the fifty-fifty prediction, and the loss of a fifty-fifty guess is a number you can work out on paper. Anything else here means your code treated the second argument as a probability and applied sigmoid again.').toBeCloseTo(0.6931, 3);
    });
    it('bceLoss tracks its inputs: confident and right scores far below confident and wrong', () => {
      const rightLoss = bceLoss(tf.tensor([1, 0]), tf.tensor([3, -3]));
      const wrongLoss = bceLoss(tf.tensor([1, 0]), tf.tensor([-3, 3]));
      expect(rightLoss, 'bceLoss returned nothing on the confident-and-right pair.').toBeDefined();
      expect(wrongLoss, 'bceLoss returned nothing on the confident-and-wrong pair.').toBeDefined();
      const right = rightLoss.dataSync()[0];
      const wrong = wrongLoss.dataSync()[0];
      expect(right, 'Confident correct predictions should produce a loss close to zero.').toBeLessThan(0.1);
      expect(wrong, 'Confident wrong predictions should produce a large binary cross-entropy loss. Pass the raw logits to the loss function.').toBeGreaterThan(3);
      recordResult({
        kind: 'table', title: 'Farah\'s loss comparison',
        summary: 'Your binary cross-entropy on the two supplied logit test cases. Both use the same labels. The confident wrong case should cost more.',
        columns: ['Test case', 'Loss'],
        rows: [['Confident and correct', right], ['Confident and wrong', wrong]],
      });
    });
    it('MSE and binary cross-entropy return their expected losses for the same inputs', () => {
      const labels = tf.tensor([1, 0, 1, 0, 1]);
      const logits = tf.tensor([0.4, -0.4, -0.8, 0.8, 1.4]);
      const mseTensor = mseLoss(labels, logits);
      const bceTensor = bceLoss(labels, logits);
      expect(mseTensor, 'mseLoss returned nothing on the shared tensors.').toBeDefined();
      expect(bceTensor, 'bceLoss returned nothing on the shared tensors.').toBeDefined();
      const mse = mseTensor.dataSync()[0];
      const bce = bceTensor.dataSync()[0];
      expect(mse, 'Squared error reads these five numbers at face value.').toBeCloseTo(0.912, 2);
      expect(bce, 'Cross-entropy reads the same five numbers through a sigmoid first, so it scores them on a different scale.').toBeCloseTo(0.7177, 3);
      expect(Math.abs(mse - bce), 'The two have to disagree here. Getting one number twice means both functions are running the same calculation.').toBeGreaterThan(0.1);
    });
    it('selects a BCE form from the declared output contract', () => {
      expect(pickBceForm('probabilities')).toBe('binaryCrossentropy');
      expect(pickBceForm('logits')).toBe('sigmoidCrossEntropy');
    });
    it('rejects an activation name when the output format is unknown', () => {
      for (const kind of [
        'sigmoid',
        'softmax',
        'relu',
        'unknown',
        undefined,
        null,
        'act' + Math.random(),
      ])
        expect(
          () => pickBceForm(kind),
          'Declare probabilities or logits explicitly. An activation name alone is not the declared contract.',
        ).toThrow();
    });
  });
