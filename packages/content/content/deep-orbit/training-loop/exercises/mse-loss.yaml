solutionCode: |
  function mseLoss(labels: tf.Tensor, predictions: tf.Tensor): tf.Tensor {
    return tf.losses.meanSquaredError(labels, predictions);
  }

  function bceLoss(labels: tf.Tensor, logits: tf.Tensor): tf.Tensor {
    return tf.losses.sigmoidCrossEntropy(labels, logits);
  }

  function pickBceForm(lastLayerActivation: string): string {
    return lastLayerActivation === 'sigmoid' ? 'binaryCrossentropy' : 'sigmoidCrossEntropy';
  }
testCode: |
  describe('two losses and the form rule', () => {
    it('mseLoss comes back reduced: one number for the whole batch, not one per row', () => {
      const loss = mseLoss(tf.tensor([3.0, -0.5, 2.0, 1.0]), tf.tensor([2.5, 0.0, 2.1, 1.3]));
      expect(loss, 'mseLoss returned nothing, so there is no loss to grade. The TFJS call hands back a tensor; return it.').toBeDefined();
      expect(loss.shape, 'A loss is one number for the whole batch, so its shape is the empty list. A shape with a row count in it means the per-row errors were never averaged.').toEqual([]);
    });
    it('mseLoss squares the differences before it averages them', () => {
      const loss = mseLoss(tf.tensor([3.0, -0.5, 2.0, 1.0]), tf.tensor([2.5, 0.0, 2.1, 1.3]));
      expect(loss, 'mseLoss returned nothing, so there is no number to check.').toBeDefined();
      expect(loss.dataSync()[0], 'The squares come first, then the mean. Averaging the raw differences lets a positive miss cancel a negative one, which is the reason the squares are there at all.').toBeCloseTo(0.15, 2);
    });
    it('mseLoss reads the pair it is handed, including one the lesson never shows', () => {
      const loss = mseLoss(tf.tensor([1, 2]), tf.tensor([3, 2]));
      expect(loss, 'mseLoss returned nothing on the second pair.').toBeDefined();
      expect(loss.dataSync()[0], 'These are not the numbers from the lesson, so a memorized answer cannot clear this one. One row misses, the other is exact, and the mean runs over both.').toBeCloseTo(2.0, 5);
    });
    it('bceLoss reads argument two like a raw score, not like a probability', () => {
      const loss = bceLoss(tf.tensor([1, 0]), tf.tensor([0, 0]));
      expect(loss, 'bceLoss returned nothing, so there is no loss to grade.').toBeDefined();
      expect(loss.shape, 'Cross-entropy also reduces to one number for the whole batch.').toEqual([]);
      expect(loss.dataSync()[0], 'A logit of 0 is the fifty-fifty prediction, and the loss of a fifty-fifty guess is a number you can work out on paper. Anything else here means the second argument was treated like a probability and squashed a second time.').toBeCloseTo(0.6931, 3);
    });
    it('bceLoss tracks its inputs: confident and right scores far below confident and wrong', () => {
      const rightLoss = bceLoss(tf.tensor([1, 0]), tf.tensor([3, -3]));
      const wrongLoss = bceLoss(tf.tensor([1, 0]), tf.tensor([-3, 3]));
      expect(rightLoss, 'bceLoss returned nothing on the confident-and-right pair.').toBeDefined();
      expect(wrongLoss, 'bceLoss returned nothing on the confident-and-wrong pair.').toBeDefined();
      const right = rightLoss.dataSync()[0];
      const wrong = wrongLoss.dataSync()[0];
      expect(right, 'Two confident correct calls have to score near nothing.').toBeLessThan(0.1);
      expect(wrong, 'Two confident wrong calls have to be punished hard. A loss that flattens out here is the reason cross-entropy exists: it keeps a gradient where squared error has almost none.').toBeGreaterThan(3);
    });
    it('the two loss functions score the same tensors differently, so the one you pick decides what counts', () => {
      const labels = tf.tensor([1, 0, 1, 0, 1]);
      const logits = tf.tensor([0.4, -0.4, -0.8, 0.8, 1.4]);
      const mseTensor = mseLoss(labels, logits);
      const bceTensor = bceLoss(labels, logits);
      expect(mseTensor, 'mseLoss returned nothing on the shared tensors.').toBeDefined();
      expect(bceTensor, 'bceLoss returned nothing on the shared tensors.').toBeDefined();
      const mse = mseTensor.dataSync()[0];
      const bce = bceTensor.dataSync()[0];
      expect(mse, 'Squared error reads these five numbers at face value.').toBeCloseTo(0.912, 2);
      expect(bce, 'Cross-entropy reads the same five numbers through a sigmoid first, so it scores them on a different scale.').toBeCloseTo(0.7177, 3);
      expect(Math.abs(mse - bce), 'The two have to disagree here. Getting one number twice means both functions are running the same calculation.').toBeGreaterThan(0.1);
    });
    it('pickBceForm reads the last layer it is given, not a memorized string and not the length of one', () => {
      expect(pickBceForm('sigmoid'), 'A sigmoid last layer emits probabilities, so the probability form is the one to name.').toBe('binaryCrossentropy');
      expect(pickBceForm('linear'), 'A linear last layer emits raw scores, so the logit form is the one to name.').toBe('sigmoidCrossEntropy');
      expect(pickBceForm('none'), 'No activation means raw scores leave the layer untouched.').toBe('sigmoidCrossEntropy');
      expect(pickBceForm('relu'), 'ReLU clips negatives and leaves the rest raw, so its output is still not a probability.').toBe('sigmoidCrossEntropy');
      // 'unknown' is also seven characters long, so a rule that sorts on
      // string length instead of reading it gets this one wrong. A last layer
      // you cannot identify is not a sigmoid, and its outputs have to be
      // treated like logits.
      expect(pickBceForm('unknown'), 'This string runs seven characters, the same length sigmoid runs, so a rule built on length answers it backwards. A last layer you cannot identify is not a sigmoid.').toBe('sigmoidCrossEntropy');
    });
    it('pickBceForm answers for a last layer it has never seen', () => {
      // Generated per run: no table of activation names can enumerate this,
      // so the only thing that answers it is the rule. The five-string lookup
      // that beat this grader on 2026-09-08 fails here (audit round 5).
      const unseen = 'act' + Math.floor(Math.random() * 1e9).toString(36);
      expect(pickBceForm(unseen), 'This activation name is made up fresh on every run, so a lookup table of the names in the lesson cannot cover it. Only one last layer emits probabilities. Everything else, recognized or not, emits raw scores and needs the logit form.').toBe('sigmoidCrossEntropy');
      expect(pickBceForm('sigmoid'), 'The recognized case still has to return the probability form. A rule that answers everything with the logit form is not reading its argument.').toBe('binaryCrossentropy');
    });
  });
