slug: gradient-step
lessonSlug: gradient-descent
title: "Perform a Gradient Descent Step"
instructions: "Write step(): one descent step on loss = weight². Use tf.variableGrads() to compute the gradient automatically (don't derive it by hand; the whole point is that TFJS does calculus for you), store it in gradient, then update the weight by subtracting learningRate × gradient. Starting at weight = 5.0 with learningRate = 0.1, the first call lands the weight at exactly 4.0. The grader calls step() twice more, so the body has to recompute the gradient rather than restate 4.0."
starterCode: "const weight = tf.variable(tf.scalar(5.0));\nconst learningRate = 0.1;\nlet gradient;\n\n// 1. Define the loss as a function: () => weight.square().asScalar()\n// 2. Get gradients with tf.variableGrads(lossFn)\n// 3. Pull this weight's gradient out of the returned grads object into gradient\n// 4. weight.assign(...) the updated value\nfunction step() {\n  // your code here\n}\n\nstep();"
solutionCode: "const weight = tf.variable(tf.scalar(5.0));\nconst learningRate = 0.1;\nlet gradient;\n\nfunction step() {\n  const lossFn = () => weight.square().asScalar();\n  const { grads } = tf.variableGrads(lossFn);\n  gradient = grads[Object.keys(grads)[0]];\n  weight.assign(weight.sub(gradient.mul(learningRate)));\n}\n\nstep();"
testCode: |
  describe('Gradient Step', () => {
    it('gradient was computed by autograd and equals 2×weight = 10', () => {
      expect(gradient).toBeDefined();
      expect(gradient.dataSync()[0]).toBeCloseTo(10.0, 4);
    });
    it('weight was updated to 5.0 − 0.1 × 10 = 4.0', () => {
      expect(weight.dataSync()[0]).toBeCloseTo(4.0, 4);
    });
    it('two more calls to step() keep descending: 4.0 to 3.2 to 2.56', () => {
      step();
      expect(gradient.dataSync()[0]).toBeCloseTo(8.0, 4);
      expect(weight.dataSync()[0]).toBeCloseTo(3.2, 4);
      step();
      expect(gradient.dataSync()[0]).toBeCloseTo(6.4, 4);
      expect(weight.dataSync()[0]).toBeCloseTo(2.56, 4);
    });
  });
