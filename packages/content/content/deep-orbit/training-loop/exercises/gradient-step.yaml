slug: gradient-step
lessonSlug: gradient-descent
title: "Perform a Gradient Descent Step"
instructions: "Write step(fn): one descent step on the loss function it is handed. First define lossFn, a function of no arguments that returns the weight squared as a scalar. Then fill in step. Use tf.variableGrads(fn) for the slope rather than deriving it by hand: the whole point is that TFJS does the calculus for you. That call hands back an object of gradients keyed by variable name, so this weight's entry has to be pulled out of it and stored in gradient. Store the tensor itself, not a number read off it. Then update the weight by subtracting learningRate × gradient, and apply that with weight.assign so the tf.variable changes in place. Starting at weight = 5.0 with learningRate = 0.1, the first call lands the weight at exactly 4.0. The grader calls step() twice more on your loss, then twice on losses of its own, and one of those two is not a polynomial, so the body has to differentiate the function it receives instead of rebuilding the slope out of the loss value."
starterCode: |
  const weight = tf.variable(tf.scalar(5.0));
  const learningRate = 0.1;
  let gradient;

  // The loss, written as a function of no arguments so it can be re-run at
  // whatever value the weight holds by then.
  const lossFn = null; // your code here

  // One descent step on the loss it is handed. The grader calls this with
  // losses of its own, so the slope you move against has to come from fn.
  function step(fn) {
    // your code here
  }

  step(lossFn);
solutionCode: "const weight = tf.variable(tf.scalar(5.0));\nconst learningRate = 0.1;\nlet gradient;\n\nconst lossFn = () => weight.square().asScalar();\n\nfunction step(fn) {\n  const { grads } = tf.variableGrads(fn);\n  gradient = grads[Object.keys(grads)[0]];\n  weight.assign(weight.sub(gradient.mul(learningRate)));\n}\n\nstep(lossFn);"
testCode: |
  describe('Gradient Step', () => {
    it('gradient holds the slope autograd computed for the loss step() was handed', () => {
      expect(gradient, 'step() never stored a gradient. The differentiation call hands back an object of gradients keyed by variable name, and this exercise keeps the one for weight in the module-level gradient.').toBeDefined();
      expect(gradient.dataSync, 'gradient has to be the tensor autograd produced, not a number already read out of it.').toBeDefined();
      expect(gradient.dataSync()[0], 'The stored gradient is not the slope of the loss step() received. Autograd computes that slope from the function itself, so the number follows the function rather than any formula written inside step().').toBeCloseTo(10.0, 4);
    });
    it('one step moved the weight downhill by learningRate times the gradient', () => {
      expect(weight.dataSync()[0], 'The weight did not land one descent step from where it started. Subtract learningRate times the gradient, and use weight.assign so the tf.variable itself changes: rebinding the name with = leaves the variable where it was.').toBeCloseTo(4.0, 4);
    });
    it('three steps in a row keep walking downhill', () => {
      step(lossFn);
      expect(gradient, 'The second call to step() left no gradient behind.').toBeDefined();
      expect(gradient.dataSync()[0], 'The slope has to be recomputed at the new weight. A gradient that repeats the first one means step() is reusing it.').toBeCloseTo(8.0, 4);
      expect(weight.dataSync()[0], 'Each step starts from the weight the step before it produced.').toBeCloseTo(3.2, 4);
      step(lossFn);
      expect(gradient.dataSync()[0], 'The slope keeps shrinking on the way down, which is why descent slows near a minimum instead of overshooting it.').toBeCloseTo(6.4, 4);
      expect(weight.dataSync()[0], 'Three steps in, the weight is still moving the same direction.').toBeCloseTo(2.56, 4);
    });
    it('step() differentiates the function it receives, not the one this exercise defines', () => {
      step(() => weight.square().mul(3).asScalar());
      expect(gradient, 'step() left no gradient for the loss the grader wrote.').toBeDefined();
      expect(gradient.dataSync()[0], 'This loss is not the one in the starter, so a derivative written by hand inside step() answers for the wrong function. Differentiate fn.').toBeCloseTo(15.36, 4);
      expect(weight.dataSync()[0], 'The update rule does not change with the loss: one learningRate-sized step against whatever gradient came back.').toBeCloseTo(1.024, 4);
    });
    it('step() works on a loss whose slope cannot be recovered from the loss value', () => {
      // Every loss above is a multiple of weight squared, where the shortcut
      // grad = 2 * loss / weight happens to hold. A submission that took that
      // shortcut and never differentiated anything cleared all four tests
      // above on 2026-09-08 (audit round 5). A sine offers no such shortcut.
      weight.assign(tf.scalar(0.5));
      step(() => weight.sin().asScalar());
      expect(gradient, 'step() left no gradient for the sine loss.').toBeDefined();
      expect(gradient.dataSync()[0], 'The slope of this loss is its cosine, and autograd knows that without being told. A gradient reconstructed from the loss VALUE instead (twice the loss over the weight, say) is right for a squared loss by accident and wrong here.').toBeCloseTo(Math.cos(0.5), 4);
      expect(weight.dataSync()[0], 'The step itself is unchanged: learningRate against whatever gradient came back.').toBeCloseTo(0.5 - 0.1 * Math.cos(0.5), 4);
    });
  });
estimatedMinutes: 10
