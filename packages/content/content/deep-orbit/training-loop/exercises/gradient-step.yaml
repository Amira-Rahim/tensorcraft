slug: gradient-step
lessonSlug: gradient-descent
title: "A gradient descent step"
instructions: |
  Help Demir update one weight using its loss gradient.

  1. Set `lossFn` to a function with no arguments that returns `weight` squared.
  2. Write `step(fn)`. Use `tf.variableGrads(fn)` to calculate the gradient of
     the supplied loss. Save this weight's gradient tensor in `gradient`.
  3. Use `weight.assign()` to update the variable to
     `weight - learningRate * gradient`. The first call moves it from 5 to 4.

  The tests call `step` again with different loss functions. Calculate the
  gradient from `fn` each time. Do not type in a derivative for just one loss.
  Keep the latest `gradient` for inspection. Dispose of the old gradient when
  you replace it.
starterCode: |
  const weight = tf.tidy(() => tf.variable(tf.scalar(5.0)));
  const learningRate = 0.1;
  let gradient;

  // The loss, written as a function of no arguments so it can be re-run at
  // whatever value the weight holds by then.
  const lossFn = null; // your code here

  // One descent step on the loss it is handed. The grader calls this with
  // losses of its own, so the slope you move against has to come from fn.
  function step(fn) {
    // your code here
  }

  step(lossFn);
solutionCode: |
  const weight = tf.tidy(() => tf.variable(tf.scalar(5.0)));
  const learningRate = 0.1;
  let gradient;

  const lossFn = () => weight.square().asScalar();

  function step(fn) {
    if (gradient) gradient.dispose();
    gradient = tf.tidy(() => {
      const { grads } = tf.variableGrads(fn, [weight]);
      const current = grads[weight.name];
      weight.assign(weight.sub(current.mul(learningRate)));
      return current;
    });
  }

  step(lossFn);
testCode: |
  describe('Gradient Step', () => {
    it('gradient holds the slope autograd computed for the loss step() was handed', () => {
      expect(gradient, 'step() never stored a gradient. The differentiation call hands back an object of gradients keyed by variable name, and this exercise keeps the one for weight in the module-level gradient.').toBeDefined();
      expect(gradient.dataSync, 'Keep the gradient tensor that autograd produces. The caller needs to read it.').toBeDefined();
      expect(gradient.dataSync()[0], 'The stored gradient is not the slope of the loss step() received. Autograd computes that slope from the function itself, so calculate the derivative of the supplied function on each call.').toBeCloseTo(10.0, 4);
    });
    it('one step moved the weight downhill by learningRate times the gradient', () => {
      expect(weight.dataSync()[0], 'Update the weight with weight.assign(weight - learningRate * gradient), using tensor operations. Assigning a different value to the JavaScript name does not update the original tf.Variable.').toBeCloseTo(4.0, 4);
      recordResult({
        kind: 'table', title: 'Your first weight update',
        summary: 'The captured state after your initial step on lossFn. The exercise requests weight squared. This tests one scalar optimization update. It trains no spacecraft classifier.',
        columns: ['Learning rate', 'Stored gradient', 'Updated weight'],
        rows: [[learningRate, gradient.dataSync()[0], weight.dataSync()[0]]],
      });
    });
    it('three steps in a row keep walking downhill', () => {
      const trace = [weight.dataSync()[0]];
      const operands = [];
      const beforeSecond = weight.dataSync()[0];
      const secondRate = learningRate;
      const gradientBeforeSecond = gradient;
      step(lossFn);
      expect(gradient, 'The second call to step() left no gradient behind.').toBeDefined();
      expect(gradient.isDisposed, 'Keep the latest gradient readable for inspection.').toBe(false);
      if (gradientBeforeSecond !== gradient) {
        expect(gradientBeforeSecond.isDisposed, 'Dispose of the old gradient when you replace it.').toBe(true);
      }
      expect(gradient.dataSync()[0], 'Recompute the slope at the new weight. A gradient that repeats the first one means step() is reusing it.').toBeCloseTo(8.0, 4);
      expect(weight.dataSync()[0], 'Each step starts from the weight the step before it produced.').toBeCloseTo(3.2, 4);
      trace.push(weight.dataSync()[0]);
      operands.push([2, beforeSecond, gradient.dataSync()[0], secondRate, weight.dataSync()[0], tf.tidy(() => lossFn().dataSync()[0])]);
      const beforeThird = weight.dataSync()[0];
      const thirdRate = learningRate;
      const gradientBeforeThird = gradient;
      step(lossFn);
      expect(gradient, 'The third call to step() left no gradient behind.').toBeDefined();
      expect(gradient.isDisposed, 'Keep the latest gradient readable for inspection.').toBe(false);
      if (gradientBeforeThird !== gradient) {
        expect(gradientBeforeThird.isDisposed, 'Dispose of the old gradient when you replace it.').toBe(true);
      }
      expect(gradient.dataSync()[0], 'For this squared loss and learning rate, each update gets smaller as the weight approaches the minimum.').toBeCloseTo(6.4, 4);
      expect(weight.dataSync()[0], 'Three steps in, the weight is still moving the same direction.').toBeCloseTo(2.56, 4);
      trace.push(weight.dataSync()[0]);
      operands.push([3, beforeThird, gradient.dataSync()[0], thirdRate, weight.dataSync()[0], tf.tidy(() => lossFn().dataSync()[0])]);
      recordResult({
        kind: 'series', title: 'The weight after three of your steps',
        summary: 'The weight values saved after your three updates on the squared loss.',
        xLabel: 'Update', yLabel: 'Weight', labels: ['1', '2', '3'],
        series: [{ name: 'Weight', values: trace }],
      });
      if (operands.every(row => row.every(Number.isFinite))) {
        recordResult({
          kind: 'table', title: 'Operands from your next two updates',
          summary: 'Observed values around calls two and three to step(lossFn), including the actual loss read after each update. The first learner call already ran before these probes. This table records no before-state for that first call.',
          columns: ['Update', 'Weight before', 'Stored gradient', 'Learning rate', 'Weight after', 'Loss after'],
          rows: operands,
        });
      }
    });
    it('step() differentiates the function it receives, not the one this exercise defines', () => {
      step(() => weight.square().mul(3).asScalar());
      expect(gradient, 'step() left no gradient for the loss the grader wrote.').toBeDefined();
      expect(gradient.dataSync()[0], 'This loss is not the one in the starter, so a derivative written by hand inside step() answers for the wrong function. Differentiate fn.').toBeCloseTo(15.36, 4);
      expect(weight.dataSync()[0], 'The update rule does not change with the loss: one learningRate-sized step against whatever gradient came back.').toBeCloseTo(1.024, 4);
    });
    it('step() works on a loss whose slope cannot be recovered from the loss value', () => {
      // Every loss above is a multiple of weight squared, where the shortcut
      // grad = 2 * loss / weight happens to hold. A submission that took that
      // shortcut and never differentiated anything cleared all four tests
      // above on 2026-09-08 (audit round 5). A sine offers no such shortcut.
      weight.assign(tf.scalar(0.5));
      step(() => weight.sin().asScalar());
      expect(gradient, 'step() left no gradient for the sine loss.').toBeDefined();
      expect(gradient.dataSync()[0], 'The slope of this loss is its cosine, and autograd calculates it from the supplied function. A gradient reconstructed from the loss VALUE instead (twice the loss over the weight, say) is right for a squared loss by accident and wrong here.').toBeCloseTo(Math.cos(0.5), 4);
      expect(weight.dataSync()[0], 'The update rule stays the same: learningRate against whatever gradient came back.').toBeCloseTo(0.5 - 0.1 * Math.cos(0.5), 4);
    });
    it('calculates the gradient for a newly generated loss', () => {
      // Every fixture above is a fixed number, so a submission that
      // differentiates nothing at all can still answer from a table of
      // remembered values keyed by how many times step() has been called. One
      // did, and cleared all five tests above on 2026-09-13 (grader adversary).
      // The multiplier below is picked when the grader runs and the slope is
      // computed here from that same pick, so no remembered value fits it.
      const multiplier = 2 + Math.floor(Math.random() * 7);
      const start = 0.25 + 0.125 * Math.floor(Math.random() * 8);
      weight.assign(tf.scalar(start));
      // The harness counts calls into autograd on tf.__calls. A slope that
      // arrives without one (finite differences, a table) is the right number
      // by the wrong route, and the route is what this exercise teaches.
      const autogradCalls = () =>
        ['variableGrads', 'grad', 'grads', 'valueAndGrad', 'valueAndGrads'].reduce(
          (n, name) => n + (tf.__calls[name] || 0),
          0,
        );
      const autogradBefore = autogradCalls();
      // Presence is not provenance. A decoy tf.variableGrads call on some
      // other function ticks the counter, and the loss handed in can then be
      // probed by hand for its multiplier (one did, 2026-09-13, round 7).
      // tf.engine().state.gradientDepth is 1 while autograd runs the forward
      // pass of the function it was handed and 0 everywhere else (measured on
      // tfjs 4.22.0 for variableGrads, grad and valueAndGrads), so the loss
      // records whether it was ever run under the tape.
      let underTape = false;
      const assembled = () => {
        if (tf.engine().state.gradientDepth > 0) underTape = true;
        return weight.mul(multiplier).sin().asScalar();
      };
      step(assembled);
      expect(
        autogradCalls() - autogradBefore,
        'Use tf.variableGrads() or tf.grad() to differentiate the supplied loss. Do not substitute a numerical estimate or a derivative typed by hand.',
      ).toBeGreaterThan(0);
      expect(
        underTape,
        'Pass fn itself to the differentiation API. The gradient must come from that loss function.',
      ).toBe(true);
      const slope = multiplier * Math.cos(multiplier * start);
      expect(gradient, 'step() left no gradient for the loss the grader picked this run.').toBeDefined();
      expect(gradient.dataSync()[0], 'The test builds this loss using a fresh multiplier, so a number that was the right answer on an earlier run is wrong here. The slope has to come out of differentiating the function step() received.').toBeCloseTo(slope, 4);
      expect(weight.dataSync()[0], 'The update rule does not change with the loss: learningRate against whatever gradient came back, applied with weight.assign.').toBeCloseTo(start - 0.1 * slope, 4);
    });
  });
