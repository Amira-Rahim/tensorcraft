slug: find-threshold
lessonSlug: threshold-tuning
title: "Sweep Candidate Thresholds for the Best F1"
instructions: |
  Choose the best cutoff from the supplied candidate thresholds. errors and labels have the same length. Errors are finite numbers, and each label is a boolean: true means anomaly. The candidate list is non-empty.

  Try every candidate on this validation data. Flag a reading only when its error is strictly greater than the cutoff. Calculate precision, recall, and F1, then return { threshold, f1 } for a candidate with the highest F1. If candidates tie, any tied winner is accepted. If every F1 is zero, return any supplied candidate with f1 set to zero.

  Use zero for F1 when there are no true positives. Choose by F1, not accuracy, recall alone, or the total number of false alarms and misses. Those measures can choose different cutoffs even when each error costs the same. Keep the final test data out of this comparison.
starterCode: |
