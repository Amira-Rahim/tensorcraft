solutionCode: |
  function findBestThreshold(
    errors: number[],
    labels: boolean[],
    candidates: number[],
  ): { threshold: number; f1: number } {
    let best = { threshold: 0, f1: 0 };

    for (const t of candidates) {
      let tp = 0, fp = 0, fn = 0;
      for (let i = 0; i < errors.length; i++) {
        const predicted = errors[i] > t;
        if (predicted && labels[i]) tp++;
        else if (predicted && !labels[i]) fp++;
        else if (!predicted && labels[i]) fn++;
      }
      const precision = tp / (tp + fp) || 0;
      const recall = tp / (tp + fn) || 0;
      const f1 = 2 * precision * recall / (precision + recall) || 0;
      if (f1 > best.f1) best = { threshold: t, f1 };
    }

    return best;
  }
testCode: |
  describe('findBestThreshold', () => {
    const errors = [0.01, 0.02, 0.01, 0.08, 0.09, 0.02, 0.07];
    const labels = [false, false, false, true, true, false, true];
    it('returns an object with threshold and f1', () => {
      const result = findBestThreshold(errors, labels, [0.03, 0.05, 0.07]);
      expect(result.threshold).toBeDefined();
      expect(result.f1).toBeDefined();
    });
    it('achieves the perfect F1 this data allows, with a separating threshold', () => {
      const result = findBestThreshold(errors, labels, [0.01, 0.03, 0.05, 0.10]);
      expect(result.f1).toBeCloseTo(1.0, 5);
      expect(result.threshold).toBeGreaterThan(0.02);
      expect(result.threshold).toBeLessThan(0.07);
    });
    it('on overlapping data picks the candidate with the max F1 (0.03 -> 0.857, not 0.06 -> 0.8)', () => {
      const errs2 = [0.02, 0.04, 0.05, 0.07, 0.09, 0.03];
      const labs2 = [false, true, false, true, true, false];
      const r2 = findBestThreshold(errs2, labs2, [0.03, 0.06]);
      expect(r2.f1).toBeCloseTo(0.857, 2);
      expect(r2.threshold).toBeCloseTo(0.03, 5);
    });
  });
