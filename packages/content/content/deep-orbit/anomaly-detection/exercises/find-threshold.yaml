slug: find-threshold
lessonSlug: threshold-tuning
title: "Sweep Candidate Thresholds for the Best F1"
instructions: "Given parallel arrays of reconstruction errors and ground-truth boolean labels (true = anomaly) from the validation slice, score every candidate threshold and return `{ threshold, f1 }`: the candidate with the highest F1 on that slice, and the F1 it scored. A reading counts as flagged when its error is strictly above the candidate, not when it equals it: readings sit exactly on a candidate in every fixture here, and in two of them `>=` picks a different winner. Accuracy is not the target and one of the tests will catch you if you use it, because anomalies are rare enough that a cutoff which flags nothing looks accurate and catches nothing. The sweep never reads the test slice; the winning cutoff is scored there once, afterwards."
