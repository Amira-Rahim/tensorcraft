slug: incident-missed-anomaly
lessonSlug: reconstruction-error
title: "Incident: True Anomaly Slipped Through"
mlContent: systems
instructions: |
  A person confirmed that a reading was anomalous, but the detector missed it. Compare the reconstruction errors with their usual sizes to help investigate.

  Implement auditReconstruction(input, reconstruction, perFeatureBaseline). These arrays are non-empty, equally sized, and contain finite numbers. Each baseline error is strictly positive. Return { perFeatureError, rankedByRatio, lowErrorFeatures }.

  perFeatureError holds Math.abs(input[i] - reconstruction[i]) for each feature, in the original order. rankedByRatio lists every feature index, sorted by error / baseline from largest to smallest. For a tie, put the smaller index first. lowErrorFeatures lists indices whose error is strictly below half their baseline, from smallest index to largest.

  These ratios show which errors are unusually large or small. They do not explain the physical cause. An anomaly can have low reconstruction error even when the model trained only on normal data. The scores cannot prove the model memorized it or tell you whether to retrain, change the threshold, change the data, or change the model. Review labeled misses and representative normal readings before deciding.
hints:
  - level: nudge
    content: |
      Compute each absolute gap, then compare it with that feature's normal error. A small raw gap can still be a large relative gap.
  - level: guidance
    content: |
      Sort feature indices by error divided by baseline. Build the low-error list separately in input order. Neither list explains why the detector missed the event.
  - level: solution
    content: |
      function auditReconstruction(input, reconstruction, perFeatureBaseline) {
        const perFeatureError = input.map((v, i) => Math.abs(v - reconstruction[i]));
        const ratio = (i) => perFeatureError[i] / perFeatureBaseline[i];
        const rankedByRatio = perFeatureError
          .map((_, i) => i)
          .sort((a, b) => ratio(b) - ratio(a));
        const lowErrorFeatures = [];
        for (let i = 0; i < perFeatureError.length; i++) {
          const baseline = perFeatureBaseline[i];
          if (baseline > 0 && perFeatureError[i] < baseline * 0.5) {
            lowErrorFeatures.push(i);
          }
        }
        return {
          perFeatureError,
          rankedByRatio,
          lowErrorFeatures,
        };
      }
