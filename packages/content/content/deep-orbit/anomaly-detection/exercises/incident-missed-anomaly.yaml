slug: incident-missed-anomaly
lessonSlug: reconstruction-error
title: "Incident: True Anomaly Slipped Through"
mlContent: systems
instructions: |
  A human confirmed that a missed reading was anomalous. Compare its reconstruction with per-feature normal errors to prepare an investigation.

  Implement auditReconstruction(input, reconstruction, perFeatureBaseline). These equally sized, non-empty arrays contain finite numbers; every baseline error is strictly positive. Return { perFeatureError, rankedByRatio, lowErrorFeatures }.

  perFeatureError contains absolute reconstruction gaps, in input order. rankedByRatio contains all feature indices, ordered by error / baseline from highest to lowest; break ties by ascending index. lowErrorFeatures contains indices whose error is strictly below half their baseline, in ascending index order.

  A ratio ranks reconstruction discrepancies relative to normal errors. It does not locate the physical cause. Low reconstruction error can occur on an anomaly even after normal-only training. These numbers cannot establish memorization or choose retraining over a threshold, data or architecture change. Review labeled misses and representative normal examples before changing the detector.
hints:
  - level: nudge
    content: |
      Compute each absolute gap, then compare it with that feature's normal error. A small raw gap can still be a large relative gap.
  - level: guidance
    content: |
      Sort feature indices by error divided by baseline. Build the low-error list separately in input order. Neither list explains why the detector missed the event.
  - level: solution
    content: |
      function auditReconstruction(input, reconstruction, perFeatureBaseline) {
        const perFeatureError = input.map((v, i) => Math.abs(v - reconstruction[i]));
        const ratio = (i) => perFeatureError[i] / perFeatureBaseline[i];
        const rankedByRatio = perFeatureError
          .map((_, i) => i)
          .sort((a, b) => ratio(b) - ratio(a));
        const lowErrorFeatures = [];
        for (let i = 0; i < perFeatureError.length; i++) {
          const baseline = perFeatureBaseline[i];
          if (baseline > 0 && perFeatureError[i] < baseline * 0.5) {
            lowErrorFeatures.push(i);
          }
        }
        return {
          perFeatureError,
          rankedByRatio,
          lowErrorFeatures,
        };
      }
