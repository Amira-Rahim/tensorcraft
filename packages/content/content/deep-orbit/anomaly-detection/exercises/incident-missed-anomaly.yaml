slug: incident-missed-anomaly
lessonSlug: reconstruction-error
title: "Incident: True Anomaly Slipped Through"
mlContent: systems
instructions: |
  PAGER: signal at 14:33 was confirmed anomalous post-hoc, but the autoencoder did not flag it (reconstruction error below threshold). Implement `auditReconstruction(input, reconstruction, perFeatureBaseline)` returning:

    {
      perFeatureError: number[],          // |input - reconstruction| per feature
      suspiciouslyLowFeatures: number[],  // features whose error is under half that feature's baseline error
      requiresRetrain: boolean,            // true if any feature in suspiciouslyLowFeatures
    }

  The training set was normal-only, so genuinely anomalous structure should be hard to reconstruct. When error on a feature that should be hard comes in far below that feature's baseline, the model is leaning on memorized sensor quirks instead of learned structure. That is a retraining problem, not a threshold problem.
starterCode: |
  function auditReconstruction(input, reconstruction, perFeatureBaseline) {
    // Concept: an autoencoder trained on normal-only data SHOULD struggle to
    // reconstruct anomalous structure. Error far below a feature's baseline is
    // its own red flag: the model is reproducing memorized sensor quirks.
    // Recipe:
    // 1. perFeatureError = input.map((v, i) => Math.abs(v - reconstruction[i]))
    // 2. Walk the features: index i is suspicious when perFeatureBaseline[i] > 0
    //    and perFeatureError[i] < perFeatureBaseline[i] * 0.5 (error undercuts
    //    the baseline by 50%). Collect indices in order into suspiciouslyLowFeatures.
    // 3. requiresRetrain = suspiciouslyLowFeatures.length > 0
    // 4. return { perFeatureError, suspiciouslyLowFeatures, requiresRetrain }
    return null; // your code here
  }
solutionCode: |
  function auditReconstruction(input, reconstruction, perFeatureBaseline) {
    const perFeatureError = input.map((v, i) => Math.abs(v - reconstruction[i]));
    const suspiciouslyLowFeatures = [];
    for (let i = 0; i < perFeatureError.length; i++) {
      const baseline = perFeatureBaseline[i];
      if (baseline > 0 && perFeatureError[i] < baseline * 0.5) {
        suspiciouslyLowFeatures.push(i);
      }
    }
    return {
      perFeatureError,
      suspiciouslyLowFeatures,
      requiresRetrain: suspiciouslyLowFeatures.length > 0,
    };
  }
testCode: |
  describe('auditReconstruction', () => {
    it('flags features where reconstruction is suspiciously good', () => {
      const input = [1, 2, 3, 4];
      const recon = [1.001, 2.001, 3.001, 4.001];   // tiny errors
      const baseline = [0.1, 0.1, 0.1, 0.1];        // expected error
      const r = auditReconstruction(input, recon, baseline);
      expect(r.suspiciouslyLowFeatures).toEqual([0, 1, 2, 3]);
      expect(r.requiresRetrain).toBe(true);
    });

    it('does not flag normal reconstruction error', () => {
      const input = [1, 2, 3];
      const recon = [1.1, 2.1, 3.1];
      const baseline = [0.1, 0.1, 0.1];
      const r = auditReconstruction(input, recon, baseline);
      expect(r.suspiciouslyLowFeatures).toEqual([]);
      expect(r.requiresRetrain).toBe(false);
    });

    it('reports per-feature errors', () => {
      const input = [10, 20];
      const recon = [12, 18];
      const baseline = [1, 1];
      const r = auditReconstruction(input, recon, baseline);
      expect(r.perFeatureError).toEqual([2, 2]);
    });
  });
