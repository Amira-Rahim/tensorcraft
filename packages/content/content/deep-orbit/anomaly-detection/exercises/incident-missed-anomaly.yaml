solutionCode: |
  function auditReconstruction(input, reconstruction, perFeatureBaseline) {
    const perFeatureError = input.map((v, i) => Math.abs(v - reconstruction[i]));
    const ratio = (i) => perFeatureError[i] / perFeatureBaseline[i];
    const rankedByRatio = perFeatureError
      .map((_, i) => i)
      .sort((a, b) => ratio(b) - ratio(a));
    const lowErrorFeatures = [];
    for (let i = 0; i < perFeatureError.length; i++) {
      const baseline = perFeatureBaseline[i];
      if (baseline > 0 && perFeatureError[i] < baseline * 0.5) {
        lowErrorFeatures.push(i);
      }
    }
    return {
      perFeatureError,
      rankedByRatio,
      lowErrorFeatures,
    };
  }
testCode: |
  const SHAPE =
    'auditReconstruction has to return the audit object: ' +
    '{ perFeatureError, rankedByRatio, lowErrorFeatures }.';

  describe('auditReconstruction', () => {
    it('flags features where reconstruction is below its usual error', () => {
      const input = [1, 2, 3, 4];
      const recon = [1.001, 2.001, 3.001, 4.001];   // tiny errors
      const baseline = [0.1, 0.1, 0.1, 0.1];        // expected error
      const r = auditReconstruction(input, recon, baseline);
      expect(r, SHAPE).toBeDefined();
      const why =
        'Every feature here was rebuilt to within a thousandth while its ' +
        'normal error is 0.1, so all four came in under half their own ' +
        'baseline and all four belong in the list.';
      expect(r.lowErrorFeatures, why).toEqual([0, 1, 2, 3]);
    });

    it('does not flag normal reconstruction error', () => {
      const input = [1, 2, 3];
      const recon = [1.1, 2.1, 3.1];
      const baseline = [0.1, 0.1, 0.1];
      const r = auditReconstruction(input, recon, baseline);
      expect(r, SHAPE).toBeDefined();
      const why =
        'Each feature missed by exactly the error that feature normally ' +
        'carries, which is twice the half-baseline line, so nothing here is ' +
        'below half its baseline and the list comes back empty.';
      expect(r.lowErrorFeatures, why).toEqual([]);
    });

    it('judges each feature against its own baseline, not one absolute cutoff', () => {
      const input = [1, 2, 3, 4];
      const recon = [1.001, 2.3, 3.5, 4.6];
      const baseline = [0.1, 0.5, 2.0, 0.8];   // per-feature expected error
      const r = auditReconstruction(input, recon, baseline);
      expect(r, SHAPE).toBeDefined();
      // errors 0.001, 0.3, 0.5, 0.6; halves 0.05, 0.25, 1.0, 0.4
      // ratios 0.01, 0.6, 0.25, 0.75
      expect(
        r.rankedByRatio,
        'Raw error ranks these features 3, 2, 1, 0. Each error against that ' +
          'feature\'s own normal error ranks them 3, 1, 2, 0: feature 2 has ' +
          'the bigger raw error, feature 1 sits further from its own normal. ' +
          'Rank the ratios, not the raw errors.',
      ).toEqual([3, 1, 2, 0]);
      expect(
        r.lowErrorFeatures,
        'One absolute cutoff cannot separate these. An error of 0.5 is small ' +
          'against feature 2, whose normal error is 2.0, and large against ' +
          'feature 1, whose normal error is 0.5. Only features 0 and 2 came ' +
          'in under half their own baseline.',
      ).toEqual([0, 2]);
    });

    it('reports per-feature errors', () => {
      const input = [10, 20];
      const recon = [12, 18];
      const baseline = [1, 1];
      const r = auditReconstruction(input, recon, baseline);
      expect(r, SHAPE).toBeDefined();
      expect(
        r.perFeatureError,
        'perFeatureError is the size of each gap, in input order. A rebuild ' +
          '2 above the reading and one 2 below it are both off by 2.',
      ).toEqual([2, 2]);
    });
  });

  it('breaks equal ratios by ascending feature index',()=>{expect(auditReconstruction([2,4,6],[1,2,3],[1,2,3]).rankedByRatio).toEqual([0,1,2]);});
