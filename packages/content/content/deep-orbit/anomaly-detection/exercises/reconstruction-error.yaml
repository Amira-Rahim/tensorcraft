solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function reconstructionError(model: tf.LayersModel, input: number[]): number {
    return tf.tidy(() => {
      const inputTensor = tf.tensor2d([input]);
      const reconstructed = model.predict(inputTensor) as tf.Tensor;
      const mse = tf.losses.meanSquaredError(inputTensor, reconstructed);
      return mse.dataSync()[0];
    });
  }
testCode: |
  describe('reconstructionError', () => {
    let zeroModel, identityModel;
    beforeAll(() => {
      zeroModel = tf.sequential();
      zeroModel.add(tf.layers.dense({ inputShape: [8], units: 8, kernelInitializer: 'zeros', biasInitializer: 'zeros' }));
      identityModel = tf.sequential();
      identityModel.add(tf.layers.dense({ inputShape: [8], units: 8, useBias: false }));
      identityModel.layers[0].setWeights([tf.eye(8)]);
    });
    it('zero-output model: error equals the mean of squared inputs (0.255)', () => {
      const r = reconstructionError(zeroModel, [0.5, 0.3, 0.7, 0.2, 0.8, 0.1, 0.6, 0.4]);
      expect(Number.isFinite(r)).toBe(true);
      expect(r).toBeCloseTo(0.255, 4);
    });
    it('error tracks the input: all-ones against zero output gives exactly 1.0', () => {
      const r = reconstructionError(zeroModel, [1, 1, 1, 1, 1, 1, 1, 1]);
      expect(r).toBeCloseTo(1.0, 4);
    });
    it('a perfect reconstruction gives ~zero error (identity model)', () => {
      const r = reconstructionError(identityModel, [0.5, 0.3, 0.7, 0.2, 0.8, 0.1, 0.6, 0.4]);
      expect(r).toBeCloseTo(0, 4);
    });
  });
