slug: incident-false-alarm-storm
lessonSlug: threshold-tuning
title: "Incident: False Alarm Storm"
mlContent: systems
instructions: |
  **Contract revision 2026-09-17:** Replace cause with nextCheck and use the follow-up actions listed below. Return null for ratio when the baseline rate is zero.

  Implement diagnoseStorm(currentAlerts, baselineAlerts, sensorAuditLog) as a triage helper. currentAlerts.alertsPerHour and baselineAlerts.alertsPerHour are nonnegative rates; baselineAlerts.modelAge is days; sensorAuditLog.recentChanges is an array of logged changes.

  Return { rate, ratio, nextCheck, action }. Round the reported rate and ratio to one decimal, keeping them numeric. ratio is the current rate divided by baseline rate; use null when baseline is zero because that ratio is undefined. Do not invent a nonzero denominator.

  Follow this runbook in order. A non-empty change log selects nextCheck 'sensor-change' and action 'inspect-sensor'. Otherwise age over 90 selects 'model-age' and 'evaluate-model'. Otherwise an unrounded ratio from 5 to 20 inclusive selects 'threshold' and 'review-threshold'. All other cases select 'unexplained' and 'escalate'.

  This is a policy for where to investigate first, not root-cause diagnosis. An old model may still work, a sensor change may be unrelated, and any alert storm may contain real events. Continue reviewing alerts while investigating. Neither model age nor alert volume authorizes automatic retraining or threshold changes.
hints:
  - level: nudge
    content: |
      Separate the measured ratio from the investigation priority. Handle a zero baseline before dividing.
  - level: guidance
    content: |
      Choose the first applicable runbook branch. Compare the unrounded ratio with the band; rounding is only for the report. The return value names a next check, not a proven cause.
  - level: solution
    content: |
      function diagnoseStorm(currentAlerts, baselineAlerts, sensorAuditLog) {
        const rate = Math.round(currentAlerts.alertsPerHour * 10) / 10;
        const rawRatio = baselineAlerts.alertsPerHour === 0 ? null : currentAlerts.alertsPerHour / baselineAlerts.alertsPerHour;
        const ratio = rawRatio === null ? null : Math.round(rawRatio * 10) / 10;
        let nextCheck = 'unexplained';
        let action = 'escalate';
        if (sensorAuditLog.recentChanges.length > 0) { nextCheck = 'sensor-change'; action = 'inspect-sensor'; }
        else if (baselineAlerts.modelAge > 90) { nextCheck = 'model-age'; action = 'evaluate-model'; }
        else if (rawRatio !== null && rawRatio >= 5 && rawRatio <= 20) { nextCheck = 'threshold'; action = 'review-threshold'; }
        return { rate, ratio, nextCheck, action };
      }
