solutionCode: |
  function diagnoseStorm(currentAlerts, baselineAlerts, sensorAuditLog) {
    const rate = Math.round(currentAlerts.alertsPerHour * 10) / 10;
    const rawRatio = baselineAlerts.alertsPerHour === 0 ? null : currentAlerts.alertsPerHour / baselineAlerts.alertsPerHour;
    const ratio = rawRatio === null ? null : Math.round(rawRatio * 10) / 10;
    let nextCheck = 'unexplained';
    let action = 'escalate';
    if (sensorAuditLog.recentChanges.length > 0) { nextCheck = 'sensor-change'; action = 'inspect-sensor'; }
    else if (baselineAlerts.modelAge > 90) { nextCheck = 'model-age'; action = 'evaluate-model'; }
    else if (rawRatio !== null && rawRatio >= 5 && rawRatio <= 20) { nextCheck = 'threshold'; action = 'review-threshold'; }
    return { rate, ratio, nextCheck, action };
  }
testCode: |
  describe('alert-storm triage',()=>{
    const run=(rate=100,base=10,age=30,changes=[])=>diagnoseStorm({alertsPerHour:rate},{alertsPerHour:base,modelAge:age},{recentChanges:changes});
    it('prioritizes a logged change even when other branches apply', () => {
      const r = run(100, 10, 200, [{ sensorId: 'A' }]);
      expect(r.nextCheck).toBe('sensor-change');
      expect(r.action).toBe('inspect-sensor');
    });
    it('uses the model review age strictly above 90 days', () => {
      expect(run(1000, 10, 90).nextCheck).toBe('unexplained');
      expect(run(1000, 10, 91).nextCheck).toBe('model-age');
      expect(run(100, 10, 120).action).toBe('evaluate-model');
    });
    it('reports measurements and uses the inclusive ratio band', () => {
      const r = run(83.33);
      expect(r.rate).toBe(83.3);
      expect(r.ratio).toBe(8.3);
      expect(r.action).toBe('review-threshold');
      for (const rate of [50, 200]) expect(run(rate).nextCheck).toBe('threshold');
    });
    it('rounds for display without changing the decision',()=>{for(const rate of [49.9,200.1,300,1000])expect(run(rate).nextCheck).toBe('unexplained');});
    it('reports an undefined ratio and escalates a zero baseline', () => {
      const r = run(1000, 0);
      expect(r.ratio).toBeNull();
      expect(r.nextCheck).toBe('unexplained');
      expect(r.action).toBe('escalate');
    });
  });
