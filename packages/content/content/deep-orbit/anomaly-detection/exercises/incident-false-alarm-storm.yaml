slug: incident-false-alarm-storm
lessonSlug: threshold-tuning
title: "Incident: False Alarm Storm"
mlContent: systems
instructions: |
  Implement diagnoseStorm(currentAlerts, baselineAlerts, sensorAuditLog) to choose what to investigate first. currentAlerts.alertsPerHour and baselineAlerts.alertsPerHour are nonnegative. baselineAlerts.modelAge is measured in days. sensorAuditLog.recentChanges lists logged sensor changes.

  Return { rate, ratio, nextCheck, action }. Round the reported rate and ratio to one decimal place and keep them as numbers. ratio is the current alert rate divided by the baseline rate. When the baseline is zero, return null for ratio instead of inventing a denominator.

  Check these rules in order and use the first match:
  1. If the sensor change log is non-empty, return nextCheck 'sensor-change' and action 'inspect-sensor'.
  2. Otherwise, if modelAge > 90, return 'model-age' and 'evaluate-model'.
  3. Otherwise, if the unrounded ratio is between 5 and 20 inclusive, return 'threshold' and 'review-threshold'.
  4. Otherwise, return 'unexplained' and 'escalate'.

  This identifies where to look, not what caused the alerts. An old model may still work, and a sensor change may be unrelated. Keep reviewing alerts because some may be real events. Do not automatically retrain or change the cutoff based only on model age or alert volume.
hints:
  - level: nudge
    content: |
      Separate the measured ratio from the investigation priority. Handle a zero baseline before dividing.
  - level: guidance
    content: |
      Choose the first applicable runbook branch. Compare the unrounded ratio with the band; rounding is only for the report. The return value names a next check, not a proven cause.
  - level: solution
    content: |
      function diagnoseStorm(currentAlerts, baselineAlerts, sensorAuditLog) {
        const rate = Math.round(currentAlerts.alertsPerHour * 10) / 10;
        const rawRatio = baselineAlerts.alertsPerHour === 0 ? null : currentAlerts.alertsPerHour / baselineAlerts.alertsPerHour;
        const ratio = rawRatio === null ? null : Math.round(rawRatio * 10) / 10;
        let nextCheck = 'unexplained';
        let action = 'escalate';
        if (sensorAuditLog.recentChanges.length > 0) { nextCheck = 'sensor-change'; action = 'inspect-sensor'; }
        else if (baselineAlerts.modelAge > 90) { nextCheck = 'model-age'; action = 'evaluate-model'; }
        else if (rawRatio !== null && rawRatio >= 5 && rawRatio <= 20) { nextCheck = 'threshold'; action = 'review-threshold'; }
        return { rate, ratio, nextCheck, action };
      }
starterCode: |
