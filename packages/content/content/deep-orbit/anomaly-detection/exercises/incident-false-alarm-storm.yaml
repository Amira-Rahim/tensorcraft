slug: incident-false-alarm-storm
lessonSlug: threshold-tuning
title: "Incident: False Alarm Storm"
mlContent: systems
instructions: |
  PAGER: 1000 anomaly alerts in one hour. The busiest hour in the log never broke double digits. Diagnose root cause via `diagnoseStorm(currentAlerts, baselineAlerts, sensorAuditLog)`. `currentAlerts.alertsPerHour` is the storm's volume and `baselineAlerts.alertsPerHour` the usual hourly rate; `baselineAlerts.modelAge` is the model's age in days; `sensorAuditLog.recentChanges` lists what changed on the hull. Return:

    {
      rate: number,                 // alerts per hour, 1 decimal
      ratio: number,                // current / baseline, 1 decimal
      cause: 'sensor-change' | 'threshold-drift' | 'model-stale' | 'real-event',
      action: 'recompute-baseline' | 'retrain' | 'recalibrate-threshold' | 'escalate',
    }

  Cause logic, checked in this order: if sensorAuditLog.recentChanges.length > 0 → sensor-change; else if baselineAlerts.modelAge > 90 (days) → model-stale; else if ratio is between 5 and 20 (inclusive at both ends) → threshold-drift; else → real-event. The order carries the diagnosis. A logged sensor change and a four-month-old model each name a cause; the ratio only says how loud the storm is. A storm often matches more than one signature, and it is filed under the first one that matches. Each cause carries its remedy: sensor-change → recompute-baseline, model-stale → retrain, threshold-drift → recalibrate-threshold, real-event → escalate. Anything outside the known failure signatures gets escalated to human eyes, that is the point of the default branch. One guard: a baseline of zero alerts an hour still has to produce a ratio someone can read, so keep the divisor off zero.
hints:
  - level: nudge
    content: "Every input here is evidence about something different, and they can all point at once. What decides this exercise is which one you let answer first, and what happens to an hour that matches none of them."
  - level: guidance
    content: "Two of the three inputs are evidence about what changed, and the third only measures how loud the hour was. A line in the audit log is something a person did to the hull. A detector that has not been refitted in months learned normal from readings that no longer describe the hull. Either one explains a flood of alerts by itself. The ratio explains nothing: it says this hour ran eighty times the usual count and leaves you to guess why, which is why it is read last. That ordering is the exercise, and an else-if chain implements it, since the first signature that matches wins and a storm that fits two signatures still sends one team rather than two. Give the final branch the same weight as the other three, because it is the path that wakes a person, and it has to take every hour the known signatures fail to explain, however extreme the numbers get. One arithmetic guard sits underneath all of it. A reference hour with no alerts in it leaves you dividing by nothing, and Infinity on a pager tells the reader less than a large number would, so hold the divisor just above nothing before you divide. Keep both reported numbers numeric, since the usual one-decimal formatter hands back a string and a string will not compare."
  - level: solution
    content: |
      function diagnoseStorm(currentAlerts, baselineAlerts, sensorAuditLog) {
        const rate = Math.round(currentAlerts.alertsPerHour * 10) / 10;
        const ratio = Math.round((currentAlerts.alertsPerHour / Math.max(baselineAlerts.alertsPerHour, 0.1)) * 10) / 10;
        let cause;
        let action;
        if (sensorAuditLog.recentChanges.length > 0) {
          cause = 'sensor-change';
          action = 'recompute-baseline';
        } else if (baselineAlerts.modelAge > 90) {
          cause = 'model-stale';
          action = 'retrain';
        } else if (ratio >= 5 && ratio <= 20) {
          cause = 'threshold-drift';
          action = 'recalibrate-threshold';
        } else {
          cause = 'real-event';
          action = 'escalate';
        }
        return { rate, ratio, cause, action };
      }
