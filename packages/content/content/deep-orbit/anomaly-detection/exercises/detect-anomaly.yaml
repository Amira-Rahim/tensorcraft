slug: detect-anomaly
lessonSlug: normal-vs-anomalous
title: "Anomaly detection with z-scores"
mlContent: arithmetic
instructions: |
  Write `isAnomaly(value, mean, std)`. Return true when the reading is more than 3 standard deviations above or below the mean. Recalculate the allowed distance on every call because mean and std can change.

  You can use plain arithmetic or tensors. If you use tf.scalar, read the result with .dataSync()[0]. The checks accept both approaches.

  Reject non-finite inputs and a negative std. When std is zero, return false if value equals mean and true otherwise. There is no z-score in that case. This exercise uses exact equality. A real sensor needs a tolerance based on its measurement precision.
starterCode: |
  function isAnomaly(value, mean, std) {
    return null;
  }
solutionCode: |
  function isAnomaly(value, mean, std) {
    if (![value, mean, std].every(Number.isFinite) || std < 0)
      throw new Error('Invalid baseline or reading');
    if (std === 0) return value !== mean;
    return Math.abs(value - mean) / std > 3;
  }
testCode: |
  // Deterministic pseudo-random baselines for the last test. A verdict is a
  // boolean, and a boolean is reproducible by any route: a table of
  // (mean, std) rows with a memorised allowed distance clears every fixed
  // fixture below and still has no idea what a standard deviation is. Handing
  // the function baselines nobody can tabulate is how the sweep grades the
  // derivation rather than the answer.
  let seed = 20260908;
  function nextUnit() {
    seed = (seed * 1103515245 + 12345) % 2147483648;
    return seed / 2147483648;
  }

  describe('isAnomaly (z-score against the supplied spread)', () => {
    it('flags values far from mean', () => {
      const flagged = isAnomaly(100, 50, 10);
      expect(
        flagged,
        'This reading is five standard deviations above the mean, beyond the threshold of 3.',
      ).toBe(true);
      recordResult({
        kind: 'table', title: 'Your baseline decision',
        summary: 'The exercise supplies this synthetic reading and baseline. A flag requests investigation. It does not establish a physical cause.',
        columns: ['Reading', 'Baseline mean', 'Baseline standard deviation', 'Your flag'],
        rows: [[100, 50, 10, flagged]],
      });
    });
    it('does not flag normal values', () => {
      expect(
        isAnomaly(52, 50, 10),
        'This reading is only 0.2 standard deviations from the mean. The rule should leave it unflagged.',
      ).toBe(false);
    });
    it('handles boundary z=3', () => {
      expect(
        isAnomaly(80, 50, 10),
        'A distance of exactly 3 standard deviations does not trigger this rule. Flag only distances greater than 3.',
      ).toBe(false);
      expect(
        isAnomaly(81, 50, 10),
        'The rule should flag a distance just above 3 standard deviations. Check the comparison operator.',
      ).toBe(true);
    });
    it('handles negative deviations symmetrically', () => {
      expect(
        isAnomaly(10, 50, 10),
        'This reading is 4 sigma BELOW the mean. Compare the absolute z-score with the threshold.',
      ).toBe(true);
    });
    it('measures deviation in units of std, not absolute distance', () => {
      // mean 100, std 10: 30 sits 7 sigma below
      expect(
        isAnomaly(30, 100, 10),
        'This reading is 70 units from the mean, or seven standard deviations.',
      ).toBe(true);
      // mean 100, std 50: 150 is only 1 sigma out on that wider spread
      expect(
        isAnomaly(150, 100, 50),
        'This reading is 50 units from its mean, exactly one standard deviation.',
      ).toBe(false);
    });
    it('works on a tenth-scale baseline', () => {
      expect(
        isAnomaly(0.55, 0.5, 0.1),
        'This reading is 0.5 standard deviations from the mean, below the threshold.',
      ).toBe(false);
      expect(
        isAnomaly(0.9, 0.5, 0.1),
        'This reading is 4 standard deviations from the mean, above the threshold.',
      ).toBe(true);
    });
    it('derives the verdict from the baseline it is handed, not from a memorised one', () => {
      for (let i = 0; i < 12; i++) {
        const mean = nextUnit() * 200 - 100;
        const std = 0.05 + nextUnit() * 40;
        const why =
          'Calculate each z-score using the supplied value, mean, and standard deviation. ' +
          'These tests change the baseline and check readings both above and below its mean.';
        expect(isAnomaly(mean + 3.4 * std, mean, std), why).toBe(true);
        expect(isAnomaly(mean - 3.4 * std, mean, std), why).toBe(true);
        expect(isAnomaly(mean + 2.6 * std, mean, std), why).toBe(false);
        expect(isAnomaly(mean - 2.6 * std, mean, std), why).toBe(false);
      }
    });
  });

  it('handles a constant baseline explicitly', () => {
    for (const mean of [0, 0.1, -4]) {
      expect(isAnomaly(mean, mean, 0)).toBe(false);
      expect(isAnomaly(mean + 0.01, mean, 0)).toBe(true);
      expect(isAnomaly(mean - 0.01, mean, 0)).toBe(true);
    }
    expect(() => isAnomaly(1, 0, -1)).toThrow();
    expect(() => isAnomaly(NaN, 0, 1)).toThrow();
  });
estimatedMinutes: 8
difficulty: beginner
skillAxis: evaluation
