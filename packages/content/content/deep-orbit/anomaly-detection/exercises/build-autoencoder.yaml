title: "Train an Autoencoder on Normal Data Only"
instructions: |
  Implement trainNormalityModel(archive, flagged, providedModel?). Each archive row has eight finite features. Each entry in flagged says whether to exclude the matching row. Keep unflagged rows, using the same tensor as both training input and reconstruction target. Reject mismatched flag counts or an empty selection before creating a model.

  If providedModel is supplied, use it as compiled. Otherwise build Dense layers with sizes 8 -> 4 relu -> 2 relu -> 4 relu -> 8 linear and inputShape [8]. You can use one Sequential model or nested encoder and decoder models. Compile with 'adam' and 'meanSquaredError'. Await fit with FIT_OPTIONS. Return { model, history }, with the exact history returned by fit.

  Always dispose temporary training tensors, even if training fails. Do not dispose a supplied model: it belongs to the caller. If training a model you created fails, dispose that model. After successful training, the caller owns the returned model.

  The checks use a synthetic archive of 72 rows. They verify which rows reach training and check errors on separate data. They do not require a fixed error ratio or prove that a real detector works. To test the effect of contaminated data, start both runs with identical weights and use the same training settings.
