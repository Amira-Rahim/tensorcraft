solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  const FIT_OPTIONS = { epochs: 400, batchSize: 16, verbose: 0 };

  async function trainNormalityModel(
    archive: number[][],
    flagged: boolean[],
  ): Promise<{ model: tf.Sequential; history: tf.History }> {
    const trainingRows = archive.filter((_, i) => !flagged[i]);
    const model = tf.sequential();
    model.add(tf.layers.dense({ units: 4, activation: 'relu', inputShape: [8] }));
    model.add(tf.layers.dense({ units: 2, activation: 'relu' }));
    model.add(tf.layers.dense({ units: 4, activation: 'relu' }));
    model.add(tf.layers.dense({ units: 8 }));
    model.compile({ optimizer: 'adam', loss: 'meanSquaredError' });
    const xs = tf.tensor2d(trainingRows);
    const history = await model.fit(xs, xs, FIT_OPTIONS);
    xs.dispose();
    return { model, history };
  }
testCode: |
  // The archive both calls train on: 72 readings, 8 features each, every value
  // between 0.00 and 1.00. Eight features rather than module 5's eleven, and a
  // plain 0-to-1 scale rather than its z-scores, so the two fits below stay
  // inside a grader's time budget. The shape of the problem is what carries.
  //
  // A calm row is a step profile, 0.5 + depth * [+ + + + - - - -], with the
  // depth sweeping the range. A tainted row is the SAME step profile with one
  // extra component laid over it, the alternating one: this fixture's stand-in
  // for the 73.4 Hz bin. Two out of every three rows are calm.
  //
  // Only the flag log changes between the two calls. FLAG_LOG_COMPLETE names
  // all 24 tainted rows. FLAG_LOG_EMPTY names none of them, which is the
  // realistic case: a flag log holds what some earlier rule tripped on, so a
  // tainted row nobody ever flagged stays in the training set.
  const CALM_BASIS = [1, 1, 1, 1, -1, -1, -1, -1];
  const EXTRA_COMPONENT = [1, -1, 1, -1, 1, -1, 1, -1];
  const calmRow = (depth) => CALM_BASIS.map((s) => 0.5 + depth * s);
  const taintedRow = (depth) => CALM_BASIS.map((s, i) => 0.5 + depth * s + 0.25 * EXTRA_COMPONENT[i]);

  const ARCHIVE = [];
  const FLAG_LOG_COMPLETE = [];
  let calmSoFar = 0;
  let eventsSoFar = 0;
  for (let i = 0; i < 72; i++) {
    if (i % 3 === 2) {
      ARCHIVE.push(taintedRow(0.1 + (0.15 * eventsSoFar) / 23));
      FLAG_LOG_COMPLETE.push(true);
      eventsSoFar++;
    } else {
      ARCHIVE.push(calmRow(0.1 + (0.15 * calmSoFar) / 47));
      FLAG_LOG_COMPLETE.push(false);
      calmSoFar++;
    }
  }
  const FLAG_LOG_EMPTY = ARCHIVE.map(() => false);

  // Five held-out depths, none of which is an archive row. Scoring a single
  // reading would make the verdict a sample of one: on one calm reading the
  // unscreened detector now and then lands a near-perfect rebuild, and the
  // ratio below reads high for a reason that has nothing to do with
  // screening. Measured on the reference solution, one held-out row put that
  // ratio at 80 once in 160 runs; averaged over these five it stayed under
  // 4.5 across 200.
  const HELD_OUT_DEPTHS = [0.108, 0.138, 0.168, 0.192, 0.222];
  const HELD_OUT_CALM = HELD_OUT_DEPTHS.map(calmRow);
  const HELD_OUT_TAINTED = HELD_OUT_DEPTHS.map(taintedRow);

  const EXPECTED_EPOCHS = 400;
  const BATCHES_WITH_FLAGS = 3;   // ceil(48 / 16)
  const BATCHES_WITHOUT = 5;      // ceil(72 / 16)

  const SHAPE =
    'trainNormalityModel has to return { model, history }: the trained model ' +
    'and the History object fit resolves with.';

  const errorOn = (model, row) =>
    tf.tidy(() => {
      const x = tf.tensor2d([row]);
      return tf.losses.meanSquaredError(x, model.predict(x)).dataSync()[0];
    });

  const meanErrorOn = (model, rows) =>
    rows.reduce((total, row) => total + errorOn(model, row), 0) / rows.length;

  // Each archive is trained once and the result shared, so the suite runs two
  // fits rather than twelve.
  let screenedRun = null;
  let unscreenedRun = null;
  const trainScreened = () => {
    if (!screenedRun) screenedRun = trainNormalityModel(ARCHIVE, FLAG_LOG_COMPLETE);
    return screenedRun;
  };
  const trainUnscreened = () => {
    if (!unscreenedRun) unscreenedRun = trainNormalityModel(ARCHIVE, FLAG_LOG_EMPTY);
    return unscreenedRun;
  };

  describe('trainNormalityModel', () => {
    it('returns the trained model and the history the fit produced', async () => {
      const run = await trainScreened();
      expect(run, SHAPE).toBeDefined();
      expect(run && run.model, SHAPE).toBeDefined();
      expect(
        run && run.history && run.history.history && run.history.history.loss,
        'The history has to be the one model.fit resolved with, so it carries ' +
          'a loss entry per epoch under history.history.loss.',
      ).toBeDefined();
    });

    it('compresses through a 2-unit bottleneck: 8 -> 4 -> 2 -> 4 -> 8 (no bottleneck, no autoencoder)', async () => {
      const run = await trainScreened();
      expect(run && run.model, SHAPE).toBeDefined();
      // A model is a layer in TFJS, and the lesson recommends stacking an
      // encoder model and a decoder model. Walk INTO nested models so that
      // form is graded on its Dense layers rather than failed for having two
      // layers with no units. (Fairness defect found 2026-09-12: a learner who
      // built exactly what the lesson shows failed this test.)
      const denseLayers = (m) => m.layers.flatMap((l) => (l.layers ? denseLayers(l) : [l]));
      const units = denseLayers(run.model).map((l) => l.getConfig().units);
      expect(
        units,
        'The widths have to narrow to the bottleneck and widen back. A stack ' +
          'that never narrows can copy its input through and learns nothing ' +
          'about normal.',
      ).toEqual([4, 2, 4, 8]);
    });

    it('keeps a nonlinearity in every stage but the output (all-linear layers collapse to one projection, which is PCA, not an autoencoder)', async () => {
      const run = await trainScreened();
      expect(run && run.model, SHAPE).toBeDefined();
      const denseLayers = (m) => m.layers.flatMap((l) => (l.layers ? denseLayers(l) : [l]));
      const activations = denseLayers(run.model).map((l) => l.getConfig().activation);
      expect(
        activations,
        'relu on the three inner stages, and the output stage left linear so ' +
          'a reconstruction can reach any value the input can.',
      ).toEqual(['relu', 'relu', 'relu', 'linear']);
    });

    it('fits the rows the flag log cleared, and only those', async () => {
      const run = await trainScreened();
      expect(run && run.model, SHAPE).toBeDefined();
      expect(
        run.model.loss,
        'The target is the input itself, so this trains against a regression loss.',
      ).toBe('meanSquaredError');
      const losses = run.history.history.loss;
      expect(
        losses.length,
        'One loss entry per epoch, and FIT_OPTIONS asks for 400 of them.',
      ).toBe(EXPECTED_EPOCHS);
      expect(
        run.model.optimizer.iterations,
        'The optimizer counts batches, one per weight update, and the count ' +
          'is not assignable, so it reports how many rows really went through ' +
          'fit. The flag log names 24 of these 72 readings, which leaves 48 ' +
          'training rows and 3 batches an epoch at batchSize 16. Training on ' +
          'all 72 gives 5 batches an epoch and lands here. A hand-built ' +
          'history with no fit behind it lands here too.',
      ).toBe(BATCHES_WITH_FLAGS * EXPECTED_EPOCHS);
      expect(
        losses[losses.length - 1] / losses[0],
        'The loss barely moved over 400 epochs of the input against itself. ' +
          'Weights pinned at their starting values (a zeros initializer, or ' +
          'trainable left off) make a model that returns the same thing ' +
          'forever, and an autoencoder that never fit has learned no notion ' +
          'of normal. Measured on the reference solution over 120 runs, this ' +
          'ratio stayed under 0.02; the check asks for under 0.5.',
      ).toBeLessThan(0.5);
    });

    it('keeps every row when the flag log names nothing', async () => {
      const run = await trainUnscreened();
      expect(run && run.model, SHAPE).toBeDefined();
      expect(
        run.model.optimizer.iterations,
        'Same 72 readings, and this flag log names none of them, so all 72 ' +
          'are training rows: 5 batches an epoch at batchSize 16. Filtering ' +
          'on anything other than the flag log you were handed shows up here.',
      ).toBe(BATCHES_WITHOUT * EXPECTED_EPOCHS);
    });

    it('trained on screened rows, it scores the tainted readings far above the calm ones', async () => {
      const run = await trainScreened();
      expect(run && run.model, SHAPE).toBeDefined();
      const calmError = meanErrorOn(run.model, HELD_OUT_CALM);
      const taintedError = meanErrorOn(run.model, HELD_OUT_TAINTED);
      expect(
        taintedError / calmError,
        'This is the whole claim: a model that has only ever seen the calm ' +
          'family rebuilds calm readings it has never seen, and cannot ' +
          'rebuild the extra component, so the two averages are far apart. ' +
          'Measured on the reference solution over 120 runs, this ratio never ' +
          'came in under 29 and its top end wandered into the hundreds; the ' +
          'check asks for more than 10. A ratio near 1 means the output does ' +
          'not depend on the input.',
      ).toBeGreaterThan(10);
    });

    it('trained on the same rows unscreened, the same code goes nearly blind', async () => {
      const screened = await trainScreened();
      const unscreened = await trainUnscreened();
      expect(screened && screened.model, SHAPE).toBeDefined();
      expect(unscreened && unscreened.model, SHAPE).toBeDefined();
      const blindCalm = meanErrorOn(unscreened.model, HELD_OUT_CALM);
      const blindTainted = meanErrorOn(unscreened.model, HELD_OUT_TAINTED);
      const sharpTainted = meanErrorOn(screened.model, HELD_OUT_TAINTED);
      expect(
        blindTainted / blindCalm,
        'Same architecture, same 72 readings, same 400 epochs. The one ' +
          'difference is that 24 tainted rows stayed in, and this detector ' +
          'learned to rebuild them along with everything else, so its two ' +
          'averages sit close together. Measured on the reference solution ' +
          'over 200 runs, this ratio ran from 0.84 to 4.47 while the ' +
          'screened run above never came in under 29, and the check asks for ' +
          'under 10 between them. That is a measurement rather than a ' +
          'guarantee: now and then an unscreened fit pushes its two averages ' +
          'further apart than it usually manages, so run it again before you ' +
          'change any code.',
      ).toBeLessThan(10);
      expect(
        sharpTainted / blindTainted,
        'The tainted readings themselves, through both detectors. The ' +
          'screened one cannot rebuild them and the unscreened one largely ' +
          'can, so this ratio sits above 1. Measured over 120 runs it stayed ' +
          'above 1.9, with a top end past 50; the check asks for more than 1.3.',
      ).toBeGreaterThan(1.3);
    });
  });
