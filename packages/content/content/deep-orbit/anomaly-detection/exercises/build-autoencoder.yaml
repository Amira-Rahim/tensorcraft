solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  const FIT_OPTIONS = { epochs: 400, batchSize: 16, verbose: 0 };

  async function trainNormalityModel(
    archive: number[][],
    flagged: boolean[],
    providedModel?: tf.Sequential,
  ): Promise<{ model: tf.Sequential; history: tf.History }> {
    if (flagged.length !== archive.length) throw new Error('Mismatched flags');
    const trainingRows = archive.filter((_, i) => !flagged[i]);
    if (!trainingRows.length) throw new Error('No training rows');
    const model = providedModel || tf.sequential();
    if (!providedModel) {
      model.add(tf.layers.dense({ units: 4, activation: 'relu', inputShape: [8] }));
      model.add(tf.layers.dense({ units: 2, activation: 'relu' }));
      model.add(tf.layers.dense({ units: 4, activation: 'relu' }));
      model.add(tf.layers.dense({ units: 8 }));
      model.compile({ optimizer: 'adam', loss: 'meanSquaredError' });
    }
    const xs = tf.tensor2d(trainingRows);
    try {
      const history = await model.fit(xs, xs, FIT_OPTIONS);
      return { model, history };
    } catch (error) {
      if (!providedModel) model.dispose();
      throw error;
    } finally {
      xs.dispose();
    }
  }
testCode: |
  // Synthetic archive: 48 calm rows and 24 flagged rows, with eight features.
  // Selection is checked directly through a supplied model; one real fit
  // checks the default architecture and schedule within the browser budget.
  const CALM_BASIS = [1, 1, 1, 1, -1, -1, -1, -1];
  const EXTRA_COMPONENT = [1, -1, 1, -1, 1, -1, 1, -1];
  const calmRow = (depth) => CALM_BASIS.map((s) => 0.5 + depth * s);
  const taintedRow = (depth) => CALM_BASIS.map((s, i) => 0.5 + depth * s + 0.25 * EXTRA_COMPONENT[i]);

  const ARCHIVE = [];
  const FLAG_LOG_COMPLETE = [];
  let calmSoFar = 0;
  let eventsSoFar = 0;
  for (let i = 0; i < 72; i++) {
    if (i % 3 === 2) {
      ARCHIVE.push(taintedRow(0.1 + (0.15 * eventsSoFar) / 23));
      FLAG_LOG_COMPLETE.push(true);
      eventsSoFar++;
    } else {
      ARCHIVE.push(calmRow(0.1 + (0.15 * calmSoFar) / 47));
      FLAG_LOG_COMPLETE.push(false);
      calmSoFar++;
    }
  }

  // These depths are absent from the archive. Held-out errors must be finite;
  // no universal calm/anomaly separation is required.
  const HELD_OUT_DEPTHS = [0.108, 0.138, 0.168, 0.192, 0.222];
  const HELD_OUT_CALM = HELD_OUT_DEPTHS.map(calmRow);
  const HELD_OUT_TAINTED = HELD_OUT_DEPTHS.map(taintedRow);

  const EXPECTED_EPOCHS = 400;
  const BATCHES_WITH_FLAGS = 3; // ceil(48 / 16)

  const SHAPE =
    'trainNormalityModel has to return { model, history }: the trained model ' +
    'and the History object fit resolves with.';

  const errorOn = (model, row) =>
    tf.tidy(() => {
      const x = tf.tensor2d([row]);
      return tf.losses.meanSquaredError(x, model.predict(x)).dataSync()[0];
    });

  const meanErrorOn = (model, rows) =>
    rows.reduce((total, row) => total + errorOn(model, row), 0) / rows.length;

  // Share one real training run across the architecture and history checks.
  let screenedRun = null;
  const trainScreened = () => {
    if (!screenedRun) screenedRun = trainNormalityModel(ARCHIVE, FLAG_LOG_COMPLETE);
    return screenedRun;
  };

  describe('trainNormalityModel', () => {
    it('returns the trained model and the history the fit produced', async () => {
      const run = await trainScreened();
      expect(run, SHAPE).toBeDefined();
      expect(run && run.model, SHAPE).toBeDefined();
      expect(
        run && run.history && run.history.history && run.history.history.loss,
        'The history has to be the one model.fit resolved with, so it carries ' +
          'a loss entry per epoch under history.history.loss.',
      ).toBeDefined();
    });

    it('compresses through a 2-unit bottleneck: 8 -> 4 -> 2 -> 4 -> 8', async () => {
      const run = await trainScreened();
      expect(run && run.model, SHAPE).toBeDefined();
      // A model is a layer in TFJS, and the lesson recommends stacking an
      // encoder model and a decoder model. Walk INTO nested models so that
      // form is graded on its Dense layers rather than failed for having two
      // layers with no units. (Fairness defect found 2026-09-12: a learner who
      // built exactly what the lesson shows failed this test.)
      const denseLayers = (m) => m.layers.flatMap((l) => (l.layers ? denseLayers(l) : [l]));
      const units = denseLayers(run.model).map((l) => l.getConfig().units);
      expect(
        units,
        'The widths have to narrow to the bottleneck and widen back. A stack ' +
          'without a bottleneck does not match the requested architecture.',
      ).toEqual([4, 2, 4, 8]);
    });

    it('uses the nonlinear architecture specified for this exercise', async () => {
      const run = await trainScreened();
      expect(run && run.model, SHAPE).toBeDefined();
      const denseLayers = (m) => m.layers.flatMap((l) => (l.layers ? denseLayers(l) : [l]));
      const activations = denseLayers(run.model).map((l) => l.getConfig().activation);
      expect(
        activations,
        'relu on the three inner stages, and the output stage left linear so ' +
          'a reconstruction can reach any value the input can.',
      ).toEqual(['relu', 'relu', 'relu', 'linear']);
    });

    it('fits the selected row count with the requested schedule', async () => {
      const run = await trainScreened();
      expect(run.model.loss).toBe('meanSquaredError');
      const losses = run.history.history.loss;
      expect(losses.length).toBe(EXPECTED_EPOCHS);
      expect(run.model.optimizer.iterations).toBe(BATCHES_WITH_FLAGS * EXPECTED_EPOCHS);
      expect(losses.every((v) => Number.isFinite(v) && v >= 0)).toBe(true);
    });

    it('reports finite reconstruction errors without a required separation ratio', async () => {
      const run = await trainScreened();
      for (const rows of [HELD_OUT_CALM, HELD_OUT_TAINTED]) {
        const error = meanErrorOn(run.model, rows);
        expect(Number.isFinite(error)).toBe(true);
        expect(error).toBeGreaterThanOrEqual(0);
      }
    });

    it('hands only screened rows to fit as both inputs and reconstruction targets', async () => {
      const rows = [
        [1, 2, 3, 4, 5, 6, 7, 8],
        [2, 3, 4, 5, 6, 7, 8, 9],
        [3, 4, 5, 6, 7, 8, 9, 10],
      ];
      for (const flags of [
        [false, true, false],
        [true, false, false],
        [false, false, false],
      ]) {
        const calls = [];
        const history = { history: { loss: [3, 4] } };
        const provided = {
          fit: async (xs, ys, options) => {
            calls.push({ xs: xs.arraySync(), ys: ys.arraySync(), options });
            return history;
          },
        };
        const out = await trainNormalityModel(rows, flags, provided);
        const kept = rows.filter((_, i) => !flags[i]);
        expect(out.model).toBe(provided);
        expect(out.history).toBe(history);
        expect(calls.length).toBe(1);
        expect(calls[0].xs).toEqual(kept);
        expect(calls[0].ys).toEqual(kept);
        expect(calls[0].options.epochs).toBe(400);
        expect(calls[0].options.batchSize).toBe(16);
      }
    });
  });
  it('rejects an empty training selection before fitting', async () => {
    let called = false;
    const supplied = { fit: async () => { called = true; } };
    await expect(trainNormalityModel([[1,2,3,4,5,6,7,8]], [true], supplied)).rejects.toThrow();
    expect(called).toBe(false);
  });
  it('cleans up after failed fitting without disposing the supplied model', async () => {
    let input, disposed = false;
    const supplied = {
      fit: async xs => { input = xs; throw new Error('fixture fit failure'); },
      dispose: () => { disposed = true; },
    };
    await expect(trainNormalityModel([[1,2,3,4,5,6,7,8]], [false], supplied)).rejects.toThrow();
    expect(input.isDisposedInternal).toBe(true);
    expect(disposed).toBe(false);
  });
