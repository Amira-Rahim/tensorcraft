title: "Train an Autoencoder on Normal Data Only"
instructions: |
  **Contract revision 2026-09-17b:** trainNormalityModel accepts an optional compiled providedModel for controlled fitting checks.

  Train an autoencoder on screened examples and measure its reconstruction errors. Anomalies may still reconstruct well; training selection does not guarantee separation. Write `trainNormalityModel(archive, flagged)`.

  `archive` is 72 readings of 8 features each. `flagged[i]` is true where the flag log names a confirmed event. Keep the rows the flag log did NOT name and train on those only.

  Build the encoder, bottleneck and decoder the lesson builds, one size down so the real fit the grader runs stays inside its time budget: eight features instead of the lesson's eleven, and a two-unit bottleneck instead of its four. Two numbers cannot store eight arbitrary values either, so the squeeze still does its job. encoder (inputShape [8], Dense 4 relu), bottleneck (Dense 2 relu), decoder (Dense 4 relu, Dense 8 linear). Build it either as one Sequential of four Dense layers or the way the lesson recommends, an encoder Sequential and a decoder Sequential stacked into a third; the grader reads the Dense layers either way. Compile with adam and meanSquaredError. Fit the kept rows against themselves with the `FIT_OPTIONS` the starter declares, and return `{ model, history }`.

  The grader checks architecture, row selection, reconstruction targets, fit settings and the history returned by fit. It also scores held-out rows without requiring a particular error ratio. Linear autoencoders are valid models; this exercise specifically asks for a nonlinear bottleneck.

  An optional third argument, providedModel, supplies an already compiled model. Use it as-is when supplied; otherwise build and compile the specified model. This lets the grader observe exactly which rows and targets reach fit. For a controlled contamination comparison, start both models from identical weights, keep the optimizer and row order fixed, and report the measured errors without claiming a universal ratio.
