solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function buildAutoencoder(): tf.Sequential {
    const model = tf.sequential();
    model.add(tf.layers.dense({ units: 4, activation: 'relu', inputShape: [8] }));
    model.add(tf.layers.dense({ units: 2, activation: 'relu' }));
    model.add(tf.layers.dense({ units: 4, activation: 'relu' }));
    model.add(tf.layers.dense({ units: 8 }));
    model.compile({ optimizer: 'adam', loss: 'meanSquaredError' });
    return model;
  }
testCode: |
  describe('buildAutoencoder', () => {
    it('returns a 4-layer model', () => {
      const model = buildAutoencoder();
      expect(model).toBeDefined();
      expect(model.layers.length).toBe(4);
    });
    it('compresses through a 2-unit bottleneck: 8 -> 4 -> 2 -> 4 -> 8 (no bottleneck, no autoencoder)', () => {
      const model = buildAutoencoder();
      const units = model.layers.map((l) => l.getConfig().units);
      expect(units).toEqual([4, 2, 4, 8]);
    });
    it('reconstructs the input shape', () => {
      const model = buildAutoencoder();
      const input = tf.randomNormal([3, 8]);
      const output = model.predict(input) as tf.Tensor;
      expect(output.shape).toEqual([3, 8]);
      input.dispose();
      output.dispose();
    });
    it('is compiled for reconstruction training (mse loss, optimizer set)', () => {
      const model = buildAutoencoder();
      expect(model.loss).toBe('meanSquaredError');
      expect(model.optimizer).toBeDefined();
    });
  });
