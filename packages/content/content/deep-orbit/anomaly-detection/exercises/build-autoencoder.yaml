title: "Build an Autoencoder"
instructions: "Build a simple autoencoder with TensorFlow.js: encoder (inputShape [8], Dense 4 relu), bottleneck (Dense 2 relu), decoder (Dense 4 relu, Dense 8 linear). Compile with adam and meanSquaredError."
