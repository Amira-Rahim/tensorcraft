slug: build-autoencoder
lessonSlug: autoencoders
title: "Train an Autoencoder on Normal Data Only"
instructions: |
  An autoencoder detects anomalies because of what it was trained on, so this time you run the fit. Write `trainNormalityModel(archive, flagged)`.

  `archive` is 72 readings of 8 features each. `flagged[i]` is true where the flag log names a confirmed event. Keep the rows the flag log did NOT name and train on those only.

  Build the encoder, bottleneck and decoder the lesson builds, one size down so the two fits the grader runs stay inside its time budget: eight features instead of the lesson's eleven, and a two-unit bottleneck instead of its four. Two numbers cannot store eight arbitrary values either, so the squeeze still does its job. encoder (inputShape [8], Dense 4 relu), bottleneck (Dense 2 relu), decoder (Dense 4 relu, Dense 8 linear). Build it either as one Sequential of four Dense layers or the way the lesson recommends, an encoder Sequential and a decoder Sequential stacked into a third; the grader reads the Dense layers either way. Compile with adam and meanSquaredError. Fit the kept rows against themselves with the `FIT_OPTIONS` the starter declares, and return `{ model, history }`.

  Two things the grader reads. It counts your training rows through `model.optimizer.iterations`, which the optimizer increments once per batch and which cannot be assigned, so the history you return and the model you return have to come from the same fit: 48 kept rows at batchSize 16 is 3 batches an epoch. And it calls your function a second time on the SAME 72 rows with a flag log that names nothing, then scores both detectors on five held-out calm readings and five held-out tainted ones, none of them an archive row, and compares the two averages. The second detector is the one whose training set the tainted rows leaked into.
