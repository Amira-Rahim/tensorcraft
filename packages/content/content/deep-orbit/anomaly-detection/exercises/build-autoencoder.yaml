title: "Train an Autoencoder on Normal Data Only"
instructions: |
  Implement trainNormalityModel(archive, flagged, providedModel?). The archive
  contains finite eight-feature rows; flagged has one boolean per row. Keep
  unflagged rows and fit them against themselves as reconstruction targets.
  Reject an empty selection or mismatched flag count before allocating a model.

  When providedModel is supplied, use it as compiled. Otherwise build Dense
  layers 8 -> 4 relu -> 2 relu -> 4 relu -> 8 linear, using inputShape [8].
  One Sequential or nested encoder and decoder models are both accepted.
  Compile with 'adam' and 'meanSquaredError'. Await fit with FIT_OPTIONS and
  return { model, history }, using the exact history from fit.

  Dispose temporary training tensors even if fitting fails. Keep a supplied
  model alive; the caller owns it. If fitting your newly created model fails,
  dispose that model. On success the caller owns the returned model.

  The checks use a synthetic 72-row archive, inspect row selection and score
  a small holdout without requiring a particular error ratio. They do not
  establish real anomaly-detection performance. A controlled contamination
  experiment also needs matched initial weights and a fixed fitting schedule.
