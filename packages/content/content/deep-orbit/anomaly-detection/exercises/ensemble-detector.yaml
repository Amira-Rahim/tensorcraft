slug: ensemble-detector
lessonSlug: the-anomaly
title: "The DEEP SCAN ensemble"
instructions: |
  Combine three detector results into one alert. The statistical detector uses the recent amplitudes in window. The main example has eight readings. Your function must also work with other non-empty window lengths. The caller supplies the autoencoder’s reconstruction error and the LSTM’s prediction separately.

  1. Statistical: use tf.moments to calculate the window's mean and variance. Calculate the signed z-score of actual. Values below the mean have a negative z-score. Flag when its absolute value is greater than 3.
  2. Autoencoder: flag when reconstructionError > reconThreshold.
  3. LSTM: flag when Math.abs(predicted - actual) > predTolerance. Both the difference and the tolerance use the 0-to-1 amplitude scale. Compare them directly in those units.

  Count the flagged results in votes. At least 2 votes makes isAnomaly true. Return { zScore, verdicts: { statistical, autoencoder, lstm }, votes, isAnomaly }.

  The window must contain at least one finite reading. All other arguments must be finite. Errors and tolerances must be nonnegative. Reject invalid inputs.

  Before converting to float32, check whether the original window values are all identical. If they are, return null for zScore. The statistical vote is false when actual equals that constant, and true otherwise. This exercise uses exact equality. Real sensors need a measurement tolerance.

  Reject non-finite calculated statistics. Also reject a window whose different values lose their variation after float32 conversion. Lost precision does not make the original window constant.

  The baseline matters: a maximum sensor reading of 1.00 scores 3.2 standard deviations above the eleven-day archive mean, but 32 above this quieter window's mean. Always calculate the score from the supplied window.
starterCode: |
  interface EnsembleVerdict {
    zScore: number | null;
    verdicts: { statistical: boolean; autoencoder: boolean; lstm: boolean };
    votes: number;
    isAnomaly: boolean;
  }

  // window holds the recent normalized amplitudes, 0 to 1, ending just before
  // actual, the latest reading. reconstructionError is the autoencoder's score
  // for that reading and predicted is the LSTM's forecast of it.
  //
  // Two of the three detectors are handed their evidence. The statistical one
  // derives its own, and the window's spread is what turns a distance into a
  // sigma count.
  function detectAnomalyEnsemble(
    window: number[],
    actual: number,
    reconstructionError: number,
    reconThreshold: number,
    predicted: number,
    predTolerance: number,
  ): EnsembleVerdict {
    return null; // your code here
  }
solutionCode: |
  interface EnsembleVerdict {
    zScore: number | null;
    verdicts: { statistical: boolean; autoencoder: boolean; lstm: boolean };
    votes: number;
    isAnomaly: boolean;
  }

  function detectAnomalyEnsemble(
    window: number[],
    actual: number,
    reconstructionError: number,
    reconThreshold: number,
    predicted: number,
    predTolerance: number,
  ): EnsembleVerdict {
    if (
      !Array.isArray(window) ||
      window.length === 0 ||
      !window.every(Number.isFinite) ||
      ![actual, reconstructionError, reconThreshold, predicted, predTolerance].every(Number.isFinite) ||
      reconstructionError < 0 || reconThreshold < 0 || predTolerance < 0
    )
      throw new Error('Invalid window or reading');
    const constant = window.every((value) => value === window[0]);
    const { mean, variance } = tf.tidy(() => {
      const m = tf.moments(tf.tensor1d(window));
      return { mean: m.mean.dataSync()[0], variance: m.variance.dataSync()[0] };
    });
    const std = Math.sqrt(variance);
    if (!Number.isFinite(mean) || !Number.isFinite(std) || (!constant && std === 0)) {
      throw new Error('Window statistics lost precision');
    }
    const zScore = constant ? null : (actual - mean) / std;

    const verdicts = {
      statistical: zScore === null ? actual !== window[0] : Math.abs(zScore) > 3,
      autoencoder: reconstructionError > reconThreshold,
      lstm: Math.abs(predicted - actual) > predTolerance,
    };
    const votes = [verdicts.statistical, verdicts.autoencoder, verdicts.lstm].filter(Boolean).length;

    return { zScore, verdicts, votes, isAnomaly: votes >= 2 };
  }
testCode: |
  // Eight consecutive normalized amplitudes from the calm stream: mean 0.52,
  // population std 0.015. Lesson 1's baseline covers eleven days and its std
  // is 0.15, ten times wider, so a reading pegged at the sensor's full scale
  // (1.00, the highest the feature can report) scores 3.2 sigma against the
  // archive and 32 against this window. The sigma count belongs to the
  // spread you divide by, not to the reading.
  const calmWindow = [0.5, 0.54, 0.51, 0.53, 0.52, 0.52, 0.5, 0.54];

  const SHAPE =
    'detectAnomalyEnsemble has to return the verdict object: ' +
    '{ zScore, verdicts: { statistical, autoencoder, lstm }, votes, isAnomaly }.';

  describe('detectAnomalyEnsemble', () => {
    it('stays quiet on a calm reading', () => {
      const r = detectAnomalyEnsemble(calmWindow, 0.52, 0.1, 1.0, 0.53, 0.1);
      expect(r, SHAPE).toBeDefined();
      const why =
        'This reading is at the window mean. Reconstruction and forecast errors are below their cutoffs, so none of the detectors should flag it.';
      expect(r.votes, why).toBe(0);
      expect(r.isAnomaly, why).toBe(false);
      expect(Math.abs(r.zScore), why).toBeLessThan(1);
    });

    it('computes the z-score from the window it was handed, not from a memorised stretch', () => {
      const r = detectAnomalyEnsemble(calmWindow, 1.0, 0.1, 1.0, 0.98, 0.1);
      expect(r, SHAPE).toBeDefined();
      const why =
        'Calculate the z-score from this window. Its standard deviation is small, so a full-scale reading is far from its mean.';
      expect(r.zScore, why).toBeCloseTo(32, 0);
      expect(r.verdicts.statistical, why).toBe(true);
    });

    // Same reading, different spread. This window is a quieter stretch that
    // drifted low: mean 0.30, population std 0.05. Against it, 0.52 (the
    // archive's own mean, a reading lesson 1 calls dead normal) is 4.4 sigma
    // and trips the gate. Against lesson 1's own baseline the same reading
    // is 0 sigma, dead center of it, and trips nothing. Measure the window
    // you were handed.
    it('reads the window it is given: one reading, two spreads, two verdicts', () => {
      const driftedWindow = [0.25, 0.35, 0.25, 0.35, 0.25, 0.35, 0.25, 0.35];
      const r = detectAnomalyEnsemble(driftedWindow, 0.52, 0.1, 1.0, 0.53, 0.1);
      expect(r, SHAPE).toBeDefined();
      const why =
        'The same reading can have a different z-score in a different window. Use the mean and standard deviation of the supplied window.';
      expect(r.zScore, why).toBeCloseTo(4.4, 2);
      expect(r.verdicts.statistical, why).toBe(true);
      expect(r.verdicts.autoencoder, why).toBe(false);
      expect(r.verdicts.lstm, why).toBe(false);
      expect(r.votes, why).toBe(1);
      expect(r.isAnomaly, why).toBe(false);
    });

    // A third stretch, built from a rule instead of typed out, so the center
    // and the spread below come from measuring it and the two readings are
    // placed a chosen number of spreads away from that center. Every other
    // window here sits at the center or far outside it, so a gate set
    // anywhere below 3, or no gate at all, answers them the same way the
    // real one does. These two readings sit either side of 3.
    it('uses a cutoff of 3 standard deviations: 2.4 stays unflagged, 3.6 triggers a flag', () => {
      const ramp = Array.from({ length: 8 }, (_, i) => 0.36 + i * 0.008);
      const center = ramp.reduce((s, v) => s + v, 0) / ramp.length;
      const spread = Math.sqrt(
        ramp.reduce((s, v) => s + (v - center) * (v - center), 0) / ramp.length,
      );

      const near = center + 2.4 * spread;
      const inside = detectAnomalyEnsemble(ramp, near, 0.1, 1.0, near, 0.1);
      expect(inside, SHAPE).toBeDefined();
      const why =
        'This reading is 2.4 standard deviations from the window mean. That is below the threshold of 3, so the statistical detector should not flag it.';
      expect(inside.zScore, why).toBeCloseTo(2.4, 3);
      expect(inside.verdicts.statistical, why).toBe(false);
      expect(inside.votes, why).toBe(0);
      expect(inside.isAnomaly, why).toBe(false);

      const far = center + 3.6 * spread;
      const outside = detectAnomalyEnsemble(ramp, far, 0.1, 1.0, far, 0.1);
      const why2 =
        'This reading is 3.6 standard deviations from the window mean. It exceeds the threshold of 3, so the rule should flag it.';
      expect(outside.zScore, why2).toBeCloseTo(3.6, 3);
      expect(outside.verdicts.statistical, why2).toBe(true);
      expect(outside.votes, why2).toBe(1);
      expect(outside.isAnomaly, why2).toBe(false);
    });

    // The signal can fail low. A stuck sensor, a lost carrier and a dropped
    // channel all read BELOW the window center, and 0.445 against this window
    // is exactly five spreads down. Every other fixture here deviates upward
    // or sits at the center, so a statistical verdict that compares the signed
    // z-score instead of its size passes all of them and goes silent on the
    // whole low half of the scale, which is where a dead sensor lives.
    it('flags a reading 5 standard deviations below the window mean', () => {
      const low = detectAnomalyEnsemble(calmWindow, 0.445, 0.1, 1.0, 0.45, 0.1);
      expect(low, SHAPE).toBeDefined();
      const why =
        'This reading is five standard deviations below the window mean. Compare the absolute z-score with the threshold so the rule flags large drops too.';
      expect(low.zScore, why).toBeCloseTo(-5, 4);
      expect(low.verdicts.statistical, why).toBe(true);
      expect(low.votes, why).toBe(1);
      expect(low.isAnomaly, why).toBe(false);

      // And the low-side verdict has to be able to carry a vote, not just be
      // reported: here it is the second one.
      const withRecon = detectAnomalyEnsemble(calmWindow, 0.445, 6.2, 1.0, 0.45, 0.1);
      const why2 =
        'The statistical detector and autoencoder both flag this reading. Any two votes out of three should raise the alarm.';
      expect(withRecon.verdicts.statistical, why2).toBe(true);
      expect(withRecon.verdicts.autoencoder, why2).toBe(true);
      expect(withRecon.votes, why2).toBe(2);
      expect(withRecon.isAnomaly, why2).toBe(true);
    });

    // predTolerance is quoted on the same 0-to-1 amplitude scale as the
    // readings, so the forecast miss has to be compared on that scale too.
    // A miss of 0.15 against a tolerance of 0.10 is over the line; the
    // SQUARE of that miss is 0.0225, which is under it. Squaring a deviation
    // smaller than 1 shrinks it, so a squared comparison against an
    // unsquared tolerance answers correctly only by accident.
    it('compares the forecast miss in the units the tolerance is quoted in', () => {
      const over = detectAnomalyEnsemble(calmWindow, 0.52, 0.1, 1.0, 0.67, 0.1);
      expect(over, SHAPE).toBeDefined();
      const why =
        'The forecast error is 1.5 times the tolerance, so the LSTM detector should flag it. Compare absolute error directly with the tolerance. Squaring would change the units.';
      expect(over.verdicts.lstm, why).toBe(true);
      expect(over.votes, why).toBe(1);
      expect(over.isAnomaly, why).toBe(false);

      const under = detectAnomalyEnsemble(calmWindow, 0.52, 0.1, 1.0, 0.37, 0.1);
      const why2 =
        'Same miss in the other direction: a forecast that undershoots by this much is wrong by the same amount one that overshoots is.';
      expect(under.verdicts.lstm, why2).toBe(true);
      expect(under.votes, why2).toBe(1);

      // The tolerance is an amplitude, not a percentage of the reading. On a
      // quiet stretch near 0.10 a miss of 0.03 is inside a tolerance of 0.10,
      // and dividing the miss by the reading turns it into 30% and fires. A
      // submission that did exactly that cleared every fixture above, because
      // none of them sat low enough for the division to matter (round 7,
      // 2026-09-13).
      const quietLow = detectAnomalyEnsemble(
        [0.09, 0.11, 0.1, 0.1, 0.09, 0.11, 0.1, 0.1],
        0.1,
        0.4,
        1.0,
        0.13,
        0.1,
      );
      const why3 =
        'This forecast missed by 0.03 on a reading of 0.10, and the tolerance is 0.10 on the same amplitude scale, so the LSTM verdict stays quiet. If it fired, check whether your code divided the miss by the reading. The tolerance uses amplitude units, so compare it with the absolute difference.';
      expect(quietLow.verdicts.lstm, why3).toBe(false);
      expect(quietLow.votes, why3).toBe(0);
      expect(quietLow.isAnomaly, why3).toBe(false);
    });

    // Both cutoffs arrive as arguments. Lesson 4 locked the rebuild cutoff at
    // 1.0 and every fixture above quotes the forecast tolerance at 0.10, so
    // a submission that types those two numbers in place of the parameters
    // answers every one of them correctly. Here the caller moves both.
    it('compares each score against the cutoff it was handed', () => {
      const loosened = detectAnomalyEnsemble(calmWindow, 0.52, 6.2, 20, 0.67, 0.3);
      expect(loosened, SHAPE).toBeDefined();
      const why =
        'This run widened both cutoffs. A rebuild error of 6.2 is under a threshold of 20 and a forecast miss of 0.15 is under a tolerance of 0.30, so neither detector fires. If either one fired, check whether your code uses the thresholds from the current arguments.';
      expect(loosened.verdicts.autoencoder, why).toBe(false);
      expect(loosened.verdicts.lstm, why).toBe(false);
      expect(loosened.votes, why).toBe(0);
      expect(loosened.isAnomaly, why).toBe(false);

      const tightened = detectAnomalyEnsemble(calmWindow, 0.52, 0.4, 0.1, 0.55, 0.02);
      const why2 =
        'This run tightened both instead. A rebuild error of 0.4 is over a threshold of 0.1 and a forecast miss of 0.03 is over a tolerance of 0.02, so both fire and two votes raise the alarm. reconThreshold and predTolerance are the cutoffs for the run, and the operator can move them between runs.';
      expect(tightened.verdicts.autoencoder, why2).toBe(true);
      expect(tightened.verdicts.lstm, why2).toBe(true);
      expect(tightened.votes, why2).toBe(2);
      expect(tightened.isAnomaly, why2).toBe(true);
    });

    it('one detector alone does not fire the alarm (autoencoder-only)', () => {
      const r = detectAnomalyEnsemble(calmWindow, 0.52, 6.2, 1.0, 0.53, 0.1);
      expect(r, SHAPE).toBeDefined();
      const why =
        'Only the autoencoder flagged this reading. The alarm needs at least two votes.';
      expect(r.verdicts.autoencoder, why).toBe(true);
      expect(r.verdicts.statistical, why).toBe(false);
      expect(r.verdicts.lstm, why).toBe(false);
      expect(r.votes, why).toBe(1);
      expect(r.isAnomaly, why).toBe(false);
    });

    it('sample 7741: the autoencoder and LSTM trigger the alert while the z-score check stays quiet', () => {
      const r = detectAnomalyEnsemble(calmWindow, 0.5, 6.2, 1.0, 0.2, 0.1);
      expect(r, SHAPE).toBeDefined();
      const why =
        '7741 reads normal on the amplitude dial, so the z-score gate clears it here exactly as it did in the archive. The rebuild missed and the forecast missed, and two verdicts out of three are all the ensemble needs.';
      expect(r.verdicts.autoencoder, why).toBe(true);
      expect(r.verdicts.lstm, why).toBe(true);
      expect(r.verdicts.statistical, why).toBe(false);
      expect(r.votes, why).toBe(2);
      expect(r.isAnomaly, why).toBe(true);
      recordResult({
        kind: 'table', title: 'Your detector votes and alert',
        summary: 'Illustrative mission probe with supplied reconstruction and forecast scores. Your function calculates the statistical vote and combines the checks. It does not run an autoencoder or LSTM here. Votes are not event probabilities.',
        columns: ['Check or decision', 'Your result'],
        rows: [['Signed amplitude z-score', r.zScore], ['Statistical flag', r.verdicts.statistical], ['Autoencoder flag', r.verdicts.autoencoder], ['Forecast flag', r.verdicts.lstm], ['Votes', r.votes], ['Raise alert', r.isAnomaly]],
      });
    });

    it('any two detectors are enough: statistical + prediction, autoencoder quiet', () => {
      const r = detectAnomalyEnsemble(calmWindow, 1.0, 0.1, 1.0, 0.52, 0.1);
      expect(r, SHAPE).toBeDefined();
      const why =
        'The autoencoder rebuilt this one fine and the other two disagree with it. The vote does not care which two fire.';
      expect(r.verdicts.statistical, why).toBe(true);
      expect(r.verdicts.lstm, why).toBe(true);
      expect(r.verdicts.autoencoder, why).toBe(false);
      expect(r.votes, why).toBe(2);
      expect(r.isAnomaly, why).toBe(true);
    });

    it('a reading pegged at the sensor ceiling trips all three detectors', () => {
      const r = detectAnomalyEnsemble(calmWindow, 1.0, 6.2, 1.0, 0.52, 0.1);
      expect(r, SHAPE).toBeDefined();
      const why =
        'All three errors exceed their cutoffs in this example. Return three votes and raise the alarm.';
      expect(r.votes, why).toBe(3);
      expect(r.isAnomaly, why).toBe(true);
    });
  });

  it('distinguishes equal and changed readings against constant windows', () => {
    for (const value of [0, 0.1, -2]) {
      const same = detectAnomalyEnsemble([value, value], value, 2, 1, value, 0.1);
      expect(same.zScore).toBe(null);
      expect(same.verdicts.statistical).toBe(false);
      expect(same.votes).toBe(1);
      const changed = detectAnomalyEnsemble([value, value], value + 0.01, 2, 1, value + 0.01, 0.1);
      expect(changed.zScore).toBe(null);
      expect(changed.verdicts.statistical).toBe(true);
      expect(changed.isAnomaly).toBe(true);
    }
    expect(() => detectAnomalyEnsemble([], 1, 0, 1, 1, 1)).toThrow();
  });
  it('rejects statistics lost in float32 conversion', () => {
    expect(() => detectAnomalyEnsemble([1, 1 + 1e-9], 1, 0, 1, 1, 1)).toThrow();
    expect(() => detectAnomalyEnsemble([1e39, 2e39], 1, 0, 1, 1, 1)).toThrow();
  });
  it('rejects invalid detector scores rather than silently voting normal', () => {
    expect(() => detectAnomalyEnsemble([0.5,0.6], 0.5, NaN, 1, 0.5, 0.1)).toThrow();
    expect(() => detectAnomalyEnsemble([0.5,0.6], 0.5, 0, 1, 0.5, -1)).toThrow();
  });
