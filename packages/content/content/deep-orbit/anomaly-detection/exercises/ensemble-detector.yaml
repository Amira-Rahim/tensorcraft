slug: ensemble-detector
lessonSlug: the-anomaly
title: "Build the DEEP SCAN Ensemble"
instructions: |
  Assemble the module's three detectors into one verdict, with the statistical one moved onto a rolling window. A reading pegged at the sensor's 1.00 ceiling scores 3.2 sigma against eleven days of archive and 32 against the eight recent readings you get here, because the sigma count belongs to the spread you divide by. That window of recent normalized amplitudes is what the statistical check gets; the autoencoder's and the LSTM's scores for the latest reading come in beside it. Compute all three verdicts yourself.

  1. Statistical. Take the z-score of `actual` against the window, using `tf.moments` for the window's center and spread. Report it signed, so a reading below the center comes back negative, and flag when |z| > 3.
  2. Autoencoder. Flag when `reconstructionError` > `reconThreshold`.
  3. LSTM. Flag when |`predicted` - `actual`| > `predTolerance`, which is quoted on the same 0-to-1 amplitude scale as `actual`, not in sigmas.

  `votes` is how many of the three flagged, and a majority (at least 2 of 3) sets `isAnomaly`. Return `{ zScore, verdicts: { statistical, autoencoder, lstm }, votes, isAnomaly }`.

  The window must be non-empty and contain finite readings. All other arguments must be finite, and errors and tolerances must be nonnegative. Reject invalid inputs. Compare against the original window values to identify a constant window before float32 conversion. At zero spread, equality with that constant gives no statistical vote; any difference gives a vote. This exact-reading policy is for the exercise; deployment needs a measurement tolerance. An undefined z-score is not a measured zero.
starterCode: |
  interface EnsembleVerdict {
    zScore: number | null;
    verdicts: { statistical: boolean; autoencoder: boolean; lstm: boolean };
    votes: number;
    isAnomaly: boolean;
  }

  // window holds the recent normalized amplitudes, 0 to 1, ending just before
  // actual, the latest reading. reconstructionError is the autoencoder's score
  // for that reading and predicted is the LSTM's forecast of it.
  //
  // Two of the three detectors are handed their evidence. The statistical one
  // derives its own, and the window's spread is what turns a distance into a
  // sigma count.
  function detectAnomalyEnsemble(
    window: number[],
    actual: number,
    reconstructionError: number,
    reconThreshold: number,
    predicted: number,
    predTolerance: number,
  ): EnsembleVerdict {
