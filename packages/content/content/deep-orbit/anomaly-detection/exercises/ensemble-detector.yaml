solutionCode: |
  interface EnsembleResult {
    isAnomaly: boolean;
    confidence: number;
  }

  function ensembleDetect(
    statistical: boolean,
    autoencoder: boolean,
    lstm: boolean,
  ): EnsembleResult {
    const votes = [statistical, autoencoder, lstm].filter(Boolean).length;
    return {
      isAnomaly: votes >= 2,
      confidence: Math.round((votes / 3) * 100) / 100,
    };
  }
testCode: |
  describe('ensembleDetect', () => {
    it('flags when all agree', () => {
      const r = ensembleDetect(true, true, true);
      expect(r.isAnomaly).toBe(true);
      expect(r.confidence).toBeCloseTo(1.0);
    });
    it('flags when majority agrees', () => {
      const r = ensembleDetect(true, true, false);
      expect(r.isAnomaly).toBe(true);
      expect(r.confidence).toBeCloseTo(0.67, 1);
    });
    it('does not flag when minority', () => {
      const r = ensembleDetect(true, false, false);
      expect(r.isAnomaly).toBe(false);
      expect(r.confidence).toBeCloseTo(0.33, 1);
    });
    it('does not flag when none', () => {
      const r = ensembleDetect(false, false, false);
      expect(r.isAnomaly).toBe(false);
      expect(r.confidence).toBe(0);
    });
  });
