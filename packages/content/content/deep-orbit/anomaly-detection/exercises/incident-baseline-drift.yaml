slug: incident-baseline-drift
lessonSlug: normal-vs-anomalous
title: "Incident: Baseline Distribution Drifted"
mlContent: systems
instructions: |
  **Contract revision 2026-09-17:** Rename promisedPerDay to expectedPerDay. Replace roll-forward with evaluate-candidate and investigate with investigate-spread. Choose the action from the unrounded flag fraction.

  Implement auditBaseline(recentNormalData, currentBaseline, readingsPerDay). The recent readings have been reviewed and labeled normal. The array is non-empty and has positive population standard deviation; currentBaseline has { mean, std } with std > 0. Daily volume is positive.

  Return { oldAlertsPerDay, newAlertsPerDay, expectedPerDay, newBaseline: { mean, std }, spreadRatio, action }. Count flags where absolute z-score is strictly greater than 3. Project each observed flag fraction to the daily volume and round to the nearest integer. Compute the new mean and standard deviation over these readings, dividing variance by n. spreadRatio is new std / current std.

  expectedPerDay is round(0.0027 * readingsPerDay), the theoretical Gaussian reference with known population parameters. It is not a guaranteed rate for these readings. The recomputed baseline's flag rate is measured on the data used to fit it, so it is descriptive, not independent validation.

  Follow this triage policy: if the old, unrounded flag fraction is at most 0.0027, action is 'hold'. Otherwise use 'investigate-spread' when spreadRatio > 1.5, and 'evaluate-candidate' for the remaining cases. These actions select follow-up work. Holding does not prove no drift; evaluating a candidate does not authorize rolling it into production. Compare it on separate normal and anomaly examples first.
hints:
  - level: nudge
    content: |
      Compute the observed flag fraction before rounding it to a daily count. Keep the Gaussian reference separate from the measurements.
  - level: guidance
    content: |
      Recompute the center and population spread. Apply the triage policy to the original flag fraction and the spread ratio. The same readings both fit and score the candidate here; an independent check still has to follow.
  - level: solution
    content: |
      function auditBaseline(recentNormalData, currentBaseline, readingsPerDay) {
        const flagged = (values, mean, std) =>
          values.filter((v) => Math.abs(v - mean) / std > 3).length;

        const n = recentNormalData.length;
        const mean = recentNormalData.reduce((a, b) => a + b, 0) / n;
        const variance = recentNormalData.reduce((a, v) => a + (v - mean) ** 2, 0) / n;
        const std = Math.sqrt(variance);

        const oldRate = flagged(recentNormalData, currentBaseline.mean, currentBaseline.std) / n;
        const newRate = flagged(recentNormalData, mean, std) / n;

        const oldAlertsPerDay = Math.round(oldRate * readingsPerDay);
        const newAlertsPerDay = Math.round(newRate * readingsPerDay);
        const expectedPerDay = Math.round(0.0027 * readingsPerDay);
        const spreadRatio = std / currentBaseline.std;

        let action;
        if (oldRate <= 0.0027) action = 'hold';
        else if (spreadRatio > 1.5) action = 'investigate-spread';
        else action = 'evaluate-candidate';

        return {
          oldAlertsPerDay,
          newAlertsPerDay,
          expectedPerDay,
          newBaseline: { mean, std },
          spreadRatio,
          action,
        };
      }
