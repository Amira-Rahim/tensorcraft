solutionCode: |
  function auditBaseline(recentNormalData, currentBaseline, readingsPerDay) {
    const flagged = (values, mean, std) =>
      values.filter((v) => Math.abs(v - mean) / std > 3).length;

    const n = recentNormalData.length;
    const mean = recentNormalData.reduce((a, b) => a + b, 0) / n;
    const variance = recentNormalData.reduce((a, v) => a + (v - mean) ** 2, 0) / n;
    const std = Math.sqrt(variance);

    const oldRate = flagged(recentNormalData, currentBaseline.mean, currentBaseline.std) / n;
    const newRate = flagged(recentNormalData, mean, std) / n;

    const oldAlertsPerDay = Math.round(oldRate * readingsPerDay);
    const newAlertsPerDay = Math.round(newRate * readingsPerDay);
    const promisedPerDay = Math.round(0.0027 * readingsPerDay);
    const spreadRatio = std / currentBaseline.std;

    let action;
    if (oldAlertsPerDay <= promisedPerDay) action = 'hold';
    else if (spreadRatio > 1.5) action = 'investigate';
    else action = 'roll-forward';

    return {
      oldAlertsPerDay,
      newAlertsPerDay,
      promisedPerDay,
      newBaseline: { mean, std },
      spreadRatio,
      action,
    };
  }
testCode: |
  describe('auditBaseline', () => {
    // Deterministic normal-ish samples: Box-Muller over a seeded LCG, so the
    // fixtures are the same on every run and on both harnesses. Clipped to
    // [0, 1] because this is the normalized amplitude channel: the sensor
    // saturates at its full scale and cannot read below zero, so a draw past
    // either end lands ON the end, the way the sensor reports it. Before the
    // clip (round 7, 2026-09-13) the wider fixtures carried readings the
    // channel cannot produce, and lesson 1 tells the learner to call those a
    // units bug.
    const sample = (n, m, s, seed) => {
      let x = seed;
      const rnd = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
      const out = [];
      for (let i = 0; i < n; i++) {
        const u = Math.max(rnd(), 1e-9);
        const v = rnd();
        const draw = m + s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        out.push(Math.min(1, Math.max(0, draw)));
      }
      return out;
    };
    const LIVE = { mean: 0.52, std: 0.15 };
    const PER_DAY = 2618;
    const RETURNED =
      'auditBaseline returned nothing, so there is no result to read. It has ' +
      'to return the six-field object the instructions list, and every field ' +
      'below is read off that object.';
    // The rule, applied independently in the test, so newAlertsPerDay is
    // graded against what a recomputed baseline REALLY flags on this data
    // rather than against a loose bound. A verifier on 2026-09-12 passed
    // this file with newAlertsPerDay hard-wired to 0, because the only
    // assertion on it was "less than oldAlertsPerDay".
    const expectedNewLoad = (data, perDay = PER_DAY) => {
      const mean = data.reduce((s, x) => s + x, 0) / data.length;
      const std = Math.sqrt(data.reduce((s, x) => s + (x - mean) ** 2, 0) / data.length);
      const flags = data.filter((v) => Math.abs(v - mean) / std > 3).length;
      return Math.round((flags / data.length) * perDay);
    };

    it('turns the promised false-alarm RATE into a daily alert count', () => {
      const r = auditBaseline(sample(400, 0.52, 0.15, 11), LIVE, PER_DAY);
      expect(r, 'auditBaseline returned nothing, so there is no result to read. It has to return the six-field object the instructions list, and every field below is read off that object.').toBeDefined();
      expect(
        r.promisedPerDay,
        'The 3-sigma rule promises a rate, not a count: about 0.0027 of readings fall past 3 sigma. What reaches a human is that rate times the volume, and at 2,618 readings a day that is 7 alerts. Reporting the rate itself, or the count for some other volume, is the mistake this incident exists to teach.',
      ).toBe(7);
    });

    it('holds when the live baseline is already inside its promised load', () => {
      // Measured on this fixture: the live baseline flags 0 of 400, so 0 a day
      // against a promise of 7. Nothing has drifted.
      const r = auditBaseline(sample(400, 0.52, 0.15, 11), LIVE, PER_DAY);
      expect(r, 'auditBaseline returned nothing, so there is no result to read. It has to return the six-field object the instructions list, and every field below is read off that object.').toBeDefined();
      expect(r.oldAlertsPerDay, 'These readings were drawn from the same distribution the live baseline describes, so its 3-sigma gate should barely fire on them.').toBeLessThanOrEqual(7);
      expect(r.action, 'The live baseline is costing no more than the rule promised, so there is nothing to roll forward.').toBe('hold');
    });

    it('rolls forward when the world SHIFTED: over-firing, spread steady', () => {
      // Measured: the live baseline flags 4.0% of these (ten of them pegged
      // at the 1.00 ceiling), 105 a day against a promise of 7, while the
      // recomputed spread is 0.99x the old one.
      const shifted = sample(400, 0.72, 0.15, 7);
      const r = auditBaseline(shifted, LIVE, PER_DAY);
      expect(r, 'auditBaseline returned nothing, so there is no result to read. It has to return the six-field object the instructions list, and every field below is read off that object.').toBeDefined();
      expect(r.oldAlertsPerDay, 'The centre of the data moved away from the baseline mean, so the old gate should now fire far more often than its promise.').toBeGreaterThan(50);
      expect(
        r.newAlertsPerDay,
        'newAlertsPerDay is the load a baseline recomputed from THIS data produces on it: count the readings the recomputed 3-sigma gate flags, divide by the sample size, multiply by the daily volume, round. On this fixture that is ' + expectedNewLoad(shifted) + ' a day. It is the whole argument for rolling forward, so it has to be computed, not asserted to be small.',
      ).toBe(expectedNewLoad(shifted));
      expect(r.newBaseline.mean, 'The recomputed mean should sit at the new centre of the data, near 0.72.').toBeCloseTo(0.72, 1);
      expect(r.spreadRatio, 'The spread did not change in this scenario, only the centre, so the ratio should sit near 1.').toBeLessThan(1.5);
      expect(r.action, 'Over-firing with a steady spread is a shift, and the recomputed centre is the honest one.').toBe('roll-forward');
    });

    it('investigates when the world got NOISIER: rolling forward would go blind', () => {
      // The case the alert count alone cannot decide. Measured: the live
      // baseline flags 11% of these (18 pegged at 1.00, 14 dead at 0.00), 288
      // a day, which is 41x its promise, so the count screams roll-forward.
      // But the recomputed spread is 1.75x wider, and a gate that wide stops
      // flagging the events worth catching.
      const noisier = sample(400, 0.52, 0.28, 23);
      const r = auditBaseline(noisier, LIVE, PER_DAY);
      expect(r, 'auditBaseline returned nothing, so there is no result to read. It has to return the six-field object the instructions list, and every field below is read off that object.').toBeDefined();
      expect(r.oldAlertsPerDay, 'A distribution this much wider than the baseline should push far past the promised load.').toBeGreaterThan(100);
      expect(r.newAlertsPerDay, 'Same rule as the shifted case: the recomputed load is counted from the data, and on this fixture it is ' + expectedNewLoad(noisier) + ' a day.').toBe(expectedNewLoad(noisier));
      expect(r.spreadRatio, 'The recomputed standard deviation should come out well above the live one here: the data got noisier rather than moving.').toBeGreaterThan(1.5);
      expect(
        r.action,
        'This is the case the alert count gets wrong on its own. The load says roll forward, and rolling forward would widen the gate by more than half, which quiets the detector by making more of the world count as normal. Growth in spread is the signal to investigate rather than absorb.',
      ).toBe('investigate');
    });

    // Every fixture above runs at 2,618 readings a day, where the promise is
    // 7 and the live load is either 0 or in the hundreds. A submission that
    // computes promisedPerDay because the contract asks for it and then
    // decides on a memorised "under about ten alerts a day" clears all of
    // them (round 7, 2026-09-13). The two fixtures below run the same rule at
    // other volumes, where the promise and that remembered ten point in
    // opposite directions.
    it('over-fires at a quiet volume where the promise is smaller than the load', () => {
      // 1,000 readings a day puts the 3-sigma promise at 3. The live gate
      // flags 2 of these 400 hand-reviewed readings, which is 5 a day: a
      // number nobody would call a storm, and still nearly twice what the
      // rule allows at this volume.
      const quietBus = sample(400, 0.55, 0.15, 3);
      const r = auditBaseline(quietBus, LIVE, 1000);
      expect(r, RETURNED).toBeDefined();
      const why = 'At 1,000 readings a day the rule promises 3 alerts and this baseline is costing 5, on readings a person reviewed and called normal. Five alerts a day is quiet in absolute terms, which is the trap: the load is judged against the promise for this volume, not against a count you remember from the last incident.';
      expect(r.promisedPerDay, why).toBe(3);
      expect(r.oldAlertsPerDay, why).toBe(5);
      expect(r.newAlertsPerDay, why).toBe(expectedNewLoad(quietBus, 1000));
      expect(r.spreadRatio, why).toBeLessThan(1.5);
      expect(r.action, why).toBe('roll-forward');
    });

    it('holds at a busy volume where the promise is larger than the load', () => {
      // The mirror case. 20,000 readings a day puts the promise at 54, and
      // the live gate flags 1 of these 400, which is 50 a day. Fifty alerts
      // reads like a storm and sits inside what the rule allows here.
      const busyBus = sample(400, 0.52, 0.15, 3);
      const r = auditBaseline(busyBus, LIVE, 20000);
      expect(r, RETURNED).toBeDefined();
      const why = 'Same rule, same readings, twenty times the volume. The promise scales with the volume to 54 a day and the live baseline costs 50, so it is inside what it promised and nothing has drifted. A baseline rolled forward here would be churn: the load only looks large because the bus is busy.';
      expect(r.promisedPerDay, why).toBe(54);
      expect(r.oldAlertsPerDay, why).toBe(50);
      expect(r.action, why).toBe('hold');
    });

    it('recomputes the spread over n, not n minus 1', () => {
      // Small, hand-checkable, and it pins the convention the rest of the
      // module uses. For [1, 2, 3, 4, 5] the population std is sqrt(2) and the
      // sample std is sqrt(2.5).
      const r = auditBaseline([1, 2, 3, 4, 5], { mean: 3, std: 1 }, 1000);
      expect(r, 'auditBaseline returned nothing, so there is no result to read. It has to return the six-field object the instructions list, and every field below is read off that object.').toBeDefined();
      expect(r.newBaseline.mean, 'The mean of 1 through 5 is 3.').toBeCloseTo(3, 6);
      expect(
        r.promisedPerDay,
        'At 1000 readings a day the 3-sigma promise is 0.0027 times 1000, which rounds to 3. Every other fixture here runs at 2618 a day, where it rounds to 7; a 7 that survives a change of volume was typed in, not computed from the rate.',
      ).toBe(3);
      expect(
        r.newBaseline.std,
        'The baseline describes the readings in hand, so the spread divides by n and comes out at sqrt(2) = 1.4142. Dividing by n-1 gives sqrt(2.5) = 1.5811, which is the estimator for a wider population this function is not describing.',
      ).toBeCloseTo(Math.sqrt(2), 6);
    });
  });
