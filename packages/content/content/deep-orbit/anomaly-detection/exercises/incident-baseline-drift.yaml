slug: incident-baseline-drift
lessonSlug: normal-vs-anomalous
title: "Incident: Baseline Distribution Drifted"
mlContent: systems
instructions: |
  Implement auditBaseline(recentNormalData, currentBaseline, readingsPerDay). People have reviewed the recent readings and labeled them normal. The array is non-empty and has a positive population standard deviation. currentBaseline contains { mean, std }, with std > 0. readingsPerDay is positive.

  Return { oldAlertsPerDay, newAlertsPerDay, expectedPerDay, newBaseline: { mean, std }, spreadRatio, action }.

  Flag readings whose absolute z-score is strictly greater than 3. Calculate the recent mean and population standard deviation, dividing the variance by n. Count flags with both the current baseline and this new baseline. For each, multiply the fraction flagged by readingsPerDay and round to the nearest integer. spreadRatio is the new std divided by the current std.

  Set expectedPerDay to round(0.0027 * readingsPerDay). This is a reference for a Gaussian distribution with known mean and standard deviation, not a guaranteed rate for these readings. You used the same readings to fit and check the new baseline, so that check is not independent validation.

  Choose action using the old flag fraction before rounding. If it is at most 0.0027, use 'hold'. Otherwise, use 'investigate-spread' when spreadRatio > 1.5, and 'evaluate-candidate' for all remaining cases.

  These actions choose the next investigation step. 'hold' does not prove conditions are unchanged. 'evaluate-candidate' does not mean deploy it. Test the candidate on separate normal readings and known anomalies first.
hints:
  - level: nudge
    content: |
      Compute the observed flag fraction before rounding it to a daily count. Keep the Gaussian reference separate from the measurements.
  - level: guidance
    content: |
      Recompute the center and population spread. Apply the triage policy to the original flag fraction and the spread ratio. The same readings both fit and score the candidate here; an independent check still has to follow.
  - level: solution
    content: |
      function auditBaseline(recentNormalData, currentBaseline, readingsPerDay) {
        const flagged = (values, mean, std) =>
          values.filter((v) => Math.abs(v - mean) / std > 3).length;

        const n = recentNormalData.length;
        const mean = recentNormalData.reduce((a, b) => a + b, 0) / n;
        const variance = recentNormalData.reduce((a, v) => a + (v - mean) ** 2, 0) / n;
        const std = Math.sqrt(variance);

        const oldRate = flagged(recentNormalData, currentBaseline.mean, currentBaseline.std) / n;
        const newRate = flagged(recentNormalData, mean, std) / n;

        const oldAlertsPerDay = Math.round(oldRate * readingsPerDay);
        const newAlertsPerDay = Math.round(newRate * readingsPerDay);
        const expectedPerDay = Math.round(0.0027 * readingsPerDay);
        const spreadRatio = std / currentBaseline.std;

        let action;
        if (oldRate <= 0.0027) action = 'hold';
        else if (spreadRatio > 1.5) action = 'investigate-spread';
        else action = 'evaluate-candidate';

        return {
          oldAlertsPerDay,
          newAlertsPerDay,
          expectedPerDay,
          newBaseline: { mean, std },
          spreadRatio,
          action,
        };
      }
