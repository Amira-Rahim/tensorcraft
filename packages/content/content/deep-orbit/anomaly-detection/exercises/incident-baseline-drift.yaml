solutionCode: |
  function auditBaseline(recentNormalData, currentBaseline, readingsPerDay) {
    const flagged = (values, mean, std) =>
      values.filter((v) => Math.abs(v - mean) / std > 3).length;

    const n = recentNormalData.length;
    const mean = recentNormalData.reduce((a, b) => a + b, 0) / n;
    const variance = recentNormalData.reduce((a, v) => a + (v - mean) ** 2, 0) / n;
    const std = Math.sqrt(variance);

    const oldRate = flagged(recentNormalData, currentBaseline.mean, currentBaseline.std) / n;
    const newRate = flagged(recentNormalData, mean, std) / n;

    const oldAlertsPerDay = Math.round(oldRate * readingsPerDay);
    const newAlertsPerDay = Math.round(newRate * readingsPerDay);
    const expectedPerDay = Math.round(0.0027 * readingsPerDay);
    const spreadRatio = std / currentBaseline.std;

    let action;
    if (oldRate <= 0.0027) action = 'hold';
    else if (spreadRatio > 1.5) action = 'investigate-spread';
    else action = 'evaluate-candidate';

    return {
      oldAlertsPerDay,
      newAlertsPerDay,
      expectedPerDay,
      newBaseline: { mean, std },
      spreadRatio,
      action,
    };
  }
testCode: |
  describe('baseline triage',()=>{
    it('measures the sample and scales counts with volume', () => {
      const r = auditBaseline([1, 2, 3, 4, 5], { mean: 3, std: 1 }, 1000);
      expect(r.newBaseline.mean).toBe(3);
      expect(r.newBaseline.std).toBeCloseTo(Math.sqrt(2), 6);
      expect(r.spreadRatio).toBeCloseTo(Math.sqrt(2), 6);
      expect(r.oldAlertsPerDay).toBe(0);
      expect(r.newAlertsPerDay).toBe(0);
      expect(r.expectedPerDay).toBe(3);
      expect(r.action).toBe('hold');
    });
    it('evaluates a shifted candidate without declaring its cause', () => {
      const r = auditBaseline([11, 12, 13, 14, 15], { mean: 3, std: 2 }, 1000);
      expect(r.oldAlertsPerDay).toBe(1000);
      expect(r.newAlertsPerDay).toBe(0);
      expect(r.action).toBe('evaluate-candidate');
    });
    it('investigates increased spread before widening the gate', () => {
      const r = auditBaseline([-10, -5, 0, 5, 10], { mean: 0, std: 1 }, 1000);
      expect(r.oldAlertsPerDay).toBe(800);
      expect(r.spreadRatio).toBeCloseTo(Math.sqrt(50), 6);
      expect(r.action).toBe('investigate-spread');
    });
    it('uses unrounded rates even when daily counts round to zero', () => {
      const r = auditBaseline([11, 12, 13, 14, 15], { mean: 3, std: 2 }, 0.1);
      expect(r.oldAlertsPerDay).toBe(0);
      expect(r.expectedPerDay).toBe(0);
      expect(r.action).toBe('evaluate-candidate');
    });
    it('recomputes the candidate flag count instead of assuming zero', () => {
      const data = [...Array(99).fill(0), 10];
      const r = auditBaseline(data, { mean: 0, std: 1 }, 10000);
      expect(r.newAlertsPerDay).toBe(100);
      expect(r.expectedPerDay).toBe(27);
    });
  });
