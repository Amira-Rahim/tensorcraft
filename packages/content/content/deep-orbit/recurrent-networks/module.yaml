slug: recurrent-networks
title: "Recurrent Networks"
worldId: deep-orbit
order: 6
description: "The signal has a rhythm across dozens of readings. The deployed classifier sees one reading at a time, so it misses their order. Help the crew build RNNs and LSTMs that carry state from one step to the next, compare them with the smaller GRU, and forecast a later reading. A JavaScript reducer is a useful starting point: each step updates the state for the next."
summary: "Build recurrent models, inspect memory updates, create time-ordered windows, and split the stream before evaluation to avoid overlap."
lessonCount: 5
