slug: predict-next
lessonSlug: sequence-prediction
title: "Predict the Next Signal Value"
instructions: "Build an LSTM-based prediction model: LSTM layer (32 units, inputShape [10, 2]), Dense hidden layer (16 units, relu), Dense output layer (2 units, linear). Compile with adam optimizer and meanSquaredError loss. The model should take 10 time steps of 2 features and predict the next 2-feature reading."
starterCode: |
