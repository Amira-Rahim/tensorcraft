slug: create-sequences
lessonSlug: sequences-matter
title: "Window a Stream for Prediction"
instructions: |
  Write `makeWindows(data, windowSize, stride)`.

  Move a window of windowSize readings through data, advancing by stride each time. Pair each window with the reading immediately after it. Skip windows with no following reading.

  Return `{ xs, ys, xsTensor, ysTensor }`:
  - `xs`: the input windows as nested arrays, in order.
  - `ys`: one next-reading target per window.
  - `xsTensor`: a tensor built from xs, shaped [windows, windowSize, features].
  - `ysTensor`: a tensor built from ys, shaped [windows, features].

  If no window has a target, return empty arrays and null for both tensors. The caller will dispose any returned tensors.

  Assume positive integer windowSize and stride. Each input row has the same positive number of finite features.

starterCode: |
  import * as tf from '@tensorflow/tfjs';

  function makeWindows(data, windowSize, stride) {
    // Keep a window only when a following reading is available as its target.
    return null; // your code here
  }
solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function makeWindows(data, windowSize, stride) {
    const xs = [];
    const ys = [];
    for (let start = 0; start + windowSize < data.length; start += stride) {
      xs.push(data.slice(start, start + windowSize));
      ys.push(data[start + windowSize]);
    }
    const xsTensor = xs.length ? tf.tensor3d(xs) : null;
    const ysTensor = ys.length ? tf.tensor2d(ys) : null;
    return { xs, ys, xsTensor, ysTensor };
  }
testCode: |
  // One place to say what is missing when nothing comes back, so the first
  // Run on the untouched starter names the task instead of a TypeError.
  const windows = (data, windowSize, stride) => {
    const out = makeWindows(data, windowSize, stride);
    expect(
      out,
      'makeWindows handed back nothing. Collect the windows and their targets, then return them together as { xs, ys, xsTensor, ysTensor }.',
    ).toBeTruthy();
    expect(
      Array.isArray(out.xs) && Array.isArray(out.ys),
      'Both xs and ys are lists, and they hold one entry each per window you kept.',
    ).toBe(true);
    return out;
  };

  describe('makeWindows', () => {
    it('pairs each window with the reading after it (stride 1)', () => {
      const { xs, ys } = windows([[1], [2], [3], [4], [5]], 3, 1);
      expect(xs).toEqual([[[1], [2], [3]], [[2], [3], [4]]]);
      expect(
        ys,
        'A target is the reading that arrives after its window, so it is never one of the readings inside it.',
      ).toEqual([[4], [5]]);
    });
    it('advances by stride (stride 2)', () => {
      const { xs, ys } = windows([[1], [2], [3], [4], [5], [6], [7]], 2, 2);
      expect(xs).toEqual([[[1], [2]], [[3], [4]], [[5], [6]]]);
      expect(ys).toEqual([[3], [5], [7]]);
    });
    it('drops the final window when nothing follows it, and builds no tensor out of nothing', () => {
      const { xs, ys, xsTensor, ysTensor } = windows([[1], [2], [3]], 3, 1);
      expect(
        xs,
        'No reading follows this window. Skip it because there is no prediction target.',
      ).toEqual([]);
      expect(ys).toEqual([]);
      expect(
        xsTensor,
        'An empty set has no windows to stack, and a rank-3 tensor cannot be inferred from an empty array. Hand back null instead.',
      ).toBeNull();
      expect(ysTensor).toBeNull();
    });
    it('keeps multi-feature readings intact', () => {
      const { xs, ys } = windows([[1, 10], [2, 20], [3, 30]], 2, 1);
      expect(xs).toEqual([[[1, 10], [2, 20]]]);
      expect(ys).toEqual([[3, 30]]);
    });
    it('follows the parameters on three settings drawn at grade time', () => {
      // The window length, the stride and the length of the archive are drawn
      // here, at grade time, so no table of window positions written against
      // this file can hold the answers. Each expectation below is computed
      // from the three numbers that were drawn: only the loop can reach them.
      for (let trial = 0; trial < 3; trial++) {
        const windowSize = 2 + Math.floor(Math.random() * 5);
        const stride = 1 + Math.floor(Math.random() * windowSize);
        const length = windowSize + 1 + Math.floor(Math.random() * 12);
        const series = Array.from({ length }, (_, i) => [i, i * 10]);
        const starts = [];
        for (let s = 0; s + windowSize < length; s += stride) starts.push(s);
        const { xs, ys } = windows(series, windowSize, stride);
        const setting = `windowSize ${windowSize}, stride ${stride}, ${length} readings`;
        expect(
          xs.length,
          `This setting (${setting}) was drawn at grade time, so the number of windows cannot have been worked out in advance. It follows from the three arguments: the first index advances by the stride, and the loop ends while the archive still holds the reading that answers the window.`,
        ).toBe(starts.length);
        expect(
          ys.length,
          'Each window you keep carries exactly one target, so the two lists end at the same length.',
        ).toBe(starts.length);
        starts.forEach((start, k) => {
          expect(
            xs[k],
            `Window ${k} of this setting (${setting}) holds the wrong readings. A window is the windowSize readings starting at its own first index, and those indices step by stride.`,
          ).toEqual(series.slice(start, start + windowSize));
          expect(
            ys[k],
            `Target ${k} of this setting (${setting}) is not the reading that follows its window. It sits at start plus windowSize, whatever those two numbers happen to be on this call.`,
          ).toEqual(series[start + windowSize]);
        });
      }
    });
    it('stacks the windows into [batch, timeSteps, features], for any window and stride', () => {
      // Two settings, neither of them square: the window length, the feature
      // count and the number of windows are three different numbers here, so
      // an axis in the wrong order lands on a shape this check rejects.
      for (const [length, windowSize, stride, features] of [[12, 4, 3, 2], [17, 5, 4, 3]]) {
        const series = Array.from({ length }, (_, i) =>
          Array.from({ length: features }, (_, f) => i * 10 + f),
        );
        const { xs, ys, xsTensor, ysTensor } = windows(series, windowSize, stride);
        expect(
          xsTensor,
          'Build xsTensor from the nested windows. The recurrent layer needs a tensor with batch, time and feature axes.',
        ).toBeTruthy();
        expect(
          xsTensor instanceof tf.Tensor,
          'xsTensor must be a real tensor. Use tf.tensor3d to build it from the windows.',
        ).toBe(true);
        expect(
          ysTensor instanceof tf.Tensor,
          'ysTensor is not a tensor either. The targets stack with tf.tensor2d, one row per window.',
        ).toBe(true);
        expect(
          xsTensor.rank,
          'The inputs need three axes: windows, time steps and features. A flattened dense input would have a different shape.',
        ).toBe(3);
        expect(
          xsTensor.shape,
          'The axes run [batch, timeSteps, features]: how many windows, how long each one is, how many values a reading carries.',
        ).toEqual([xs.length, windowSize, features]);
        expect(
          ysTensor.shape,
          'Each target is one reading, not a window, so the targets stack one axis lower than the inputs.',
        ).toEqual([ys.length, features]);
        expect(
          xsTensor.arraySync(),
          'The tensor holds the windows you collected, in the order you collected them.',
        ).toEqual(xs);
        expect(ysTensor.arraySync()).toEqual(ys);
        xsTensor.dispose();
        ysTensor.dispose();
      }
    });
  });
