title: "Window a Stream for Prediction"
instructions: "Write makeWindows(data, windowSize, stride): slide a window of windowSize readings across the data, advancing by stride each time, and pair every window with the reading that comes immediately AFTER it (the prediction target). Return { xs, ys }. Windows without a following reading are dropped: you cannot train on a window whose answer the archive does not contain."
starterCode: |
