solutionCode: |
  const sigmoid = (z) => 1 / (1 + Math.exp(-z));

  function lstmStep(prevHidden, prevCell, x, weights) {
    const preact = (row, j) => row[0] * prevHidden[j] + row[1] * x[j] + row[2];
    const newCell = prevCell.map((c, j) => {
      const forget = sigmoid(preact(weights.forget[j], j));
      const store = sigmoid(preact(weights.input[j], j));
      const candidate = Math.tanh(preact(weights.candidate[j], j));
      return forget * c + store * candidate;
    });
    const newHidden = newCell.map((c, j) => sigmoid(preact(weights.output[j], j)) * Math.tanh(c));
    return { newCell, newHidden };
  }
testCode: |
  const sig = (z) => 1 / (1 + Math.exp(-z));
  const rows = (n, row) => Array.from({ length: n }, () => row.slice());
  // Every gate flat at a zero pre-activation; tests override one at a time.
  const flat = (n) => ({
    forget: rows(n, [0, 0, 0]),
    input: rows(n, [0, 0, 0]),
    output: rows(n, [0, 0, 0]),
    candidate: rows(n, [0, 0, 0]),
  });

  describe('lstmStep', () => {
    it('gates are sigmoids, so a zero pre-activation opens each one halfway', () => {
      const { newCell, newHidden } = lstmStep([0, 0], [2, -1], [0, 0], flat(2));
      expect(newCell[0]).toBeCloseTo(1, 6);
      expect(newCell[1]).toBeCloseTo(-0.5, 6);
      expect(newHidden[0]).toBeCloseTo(0.5 * Math.tanh(1), 6);
      expect(newHidden[1]).toBeCloseTo(0.5 * Math.tanh(-0.5), 6);
    });

    it('the candidate is a tanh, so a zero pre-activation stores nothing', () => {
      const w = flat(1);
      w.input = [[0, 0, 30]];
      const { newCell } = lstmStep([0], [0], [0], w);
      expect(newCell[0]).toBeCloseTo(0, 6);
    });

    it('a closed forget gate wipes the cell; an open one keeps it', () => {
      const shut = flat(1);
      shut.forget = [[0, 0, -30]];
      expect(lstmStep([0], [4], [0], shut).newCell[0]).toBeCloseTo(0, 6);
      const open = flat(1);
      open.forget = [[0, 0, 30]];
      expect(lstmStep([0], [4], [0], open).newCell[0]).toBeCloseTo(4, 6);
    });

    it('across 100 steps the cell decays by the forget gate and nothing else', () => {
      const w = flat(1);
      w.forget = [[0, 0, 5]];
      w.input = [[0, 0, -30]];
      let cell = [2];
      let hidden = [0];
      for (let t = 0; t < 100; t++) {
        const out = lstmStep(hidden, cell, [0], w);
        cell = out.newCell;
        hidden = out.newHidden;
      }
      expect(cell[0]).toBeCloseTo(2 * Math.pow(sig(5), 100), 6);
    });

    it('the output gate decides what leaves the cell, and the cell keeps its value', () => {
      const w = flat(1);
      w.forget = [[0, 0, 30]];
      w.output = [[0, 0, -30]];
      const { newCell, newHidden } = lstmStep([0], [4], [0], w);
      expect(newCell[0]).toBeCloseTo(4, 6);
      expect(newHidden[0]).toBeCloseTo(0, 6);
    });

    it('each dimension reads its own row, and both inputs reach the candidate', () => {
      const w = {
        forget: [[0, 0, 30], [0, 0, -30]],
        input: [[0, 0, -30], [0, 0, 30]],
        output: [[0, 0, 30], [0, 0, 30]],
        candidate: [[0, 0, 0], [1, 2, 0]],
      };
      const { newCell } = lstmStep([0.5, 0.5], [1, 1], [0.25, 0.25], w);
      expect(newCell[0]).toBeCloseTo(1, 6);
      expect(newCell[1]).toBeCloseTo(Math.tanh(1 * 0.5 + 2 * 0.25), 6);
    });
  });
