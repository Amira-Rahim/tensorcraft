    // 2. forget, input and output rows go through sigmoid;
    //    the candidate row goes through Math.tanh
    // 3. newCell[j]   = forget[j] * prevCell[j] + input[j] * candidate[j]
    // 4. newHidden[j] = output[j] * Math.tanh(newCell[j])
