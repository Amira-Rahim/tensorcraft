lessonSlug: lstm-gates
title: "One LSTM Step by Hand"
instructions: "Write `lstmStep(prevHidden, prevCell, x, weights)`: one time step of an LSTM cell, computed per dimension. `weights` holds a `forget`, `input`, `output` and `candidate` array, each with one row `[wHidden, wInput, bias]` per dimension, so dimension j's pre-activation is `wHidden * prevHidden[j] + wInput * x[j] + bias`. The forget, input and output gates pass their pre-activation through `sigmoid`; the candidate passes through `Math.tanh`. Then `newCell[j] = forget[j] * prevCell[j] + input[j] * candidate[j]` and `newHidden[j] = output[j] * Math.tanh(newCell[j])`. Return `{ newCell, newHidden }`. A real cell mixes every dimension through a weight matrix; this one keeps the dimensions independent so you can read the arithmetic. One test runs your step 100 times to check what the cell state does with the forget gate held open."
