slug: build-lstm
lessonSlug: lstm-gates
title: "One LSTM Step by Hand"
instructions: |
  Implement one LSTM step, then compare it with a one-unit TensorFlow.js layer.

  First, write `lstmStep(prevHidden, prevCell, x, weights)`. Each of weights.forget, weights.input, weights.output and weights.candidate contains one row per stored value. A row is `[wHidden, wInput, bias]`.

  For each position j:
  1. Calculate each weighted sum as `wHidden * prevHidden[j] + wInput * x[j] + bias`.
  2. Apply sigmoid to the forget, input and output sums. Apply Math.tanh to the candidate sum.
  3. Calculate `newCell[j] = forget[j] * prevCell[j] + input[j] * candidate[j]`.
  4. Calculate `newHidden[j] = output[j] * Math.tanh(newCell[j])`.

  Return `{ newCell, newHidden }`. One test repeats the step 100 times with the forget gate near 1 and input gate closed. A nonzero candidate must not enter through that closed gate.

  Next, write `buildLstmCell(timeSteps)`. Return `{ model, weights }`. The Sequential model must contain one LSTM layer with units 1, inputShape [timeSteps, 1], recurrentActivation 'sigmoid' and returnSequences true. Set the activation explicitly; TensorFlow.js otherwise uses hardSigmoid. This comparison uses one unit and one feature because a wider layer mixes positions through full matrices.

  Read model.getWeights(): input kernel [1, 4], recurrent kernel [1, 4], then bias [4]. Their four columns are INPUT, FORGET, CANDIDATE, OUTPUT. For each column, combine the recurrent value, input value and bias into a `[wHidden, wInput, bias]` row. Put that row inside the corresponding one-row weights array.

  The tests check your extracted weights, then run your step from hidden and cell states [0]. Every resulting hidden state must match the library layer.

