slug: build-lstm
lessonSlug: lstm-gates
title: "One LSTM Step by Hand"
instructions: |
  First the arithmetic, then the layer it belongs to.

  1. Write `lstmStep(prevHidden, prevCell, x, weights)`: one time step of an LSTM cell, computed per dimension. `weights` holds a `forget`, `input`, `output` and `candidate` array, each with one row `[wHidden, wInput, bias]` per dimension, so dimension j's pre-activation is `wHidden * prevHidden[j] + wInput * x[j] + bias`.
  2. The forget, input and output gates pass their pre-activation through `sigmoid`; the candidate passes through `Math.tanh`.
  3. Then `newCell[j] = forget[j] * prevCell[j] + input[j] * candidate[j]` and `newHidden[j] = output[j] * Math.tanh(newCell[j])`. Return `{ newCell, newHidden }`. One test runs your step 100 times with the forget gate near 1 and the input gate shut, to check that a candidate which is not zero still cannot reach the cell.
  4. Then `buildLstmCell(timeSteps)`: a `tf.sequential()` holding one `tf.layers.lstm({ units: 1, inputShape: [timeSteps, 1], recurrentActivation: 'sigmoid', returnSequences: true })`, returned as `{ model, weights }` with `weights` in exactly the shape `lstmStep` reads. One unit and one feature, because a wider layer mixes every dimension through a matrix and a per-dimension step stops describing it.
  5. Pass `recurrentActivation: 'sigmoid'` yourself: TF.js defaults its gates to `hardSigmoid`, a clipped straight line rather than the curve the lesson uses.
  6. `model.getWeights()` returns three tensors, the input kernel [1, 4], the recurrent kernel [1, 4] and the bias [4]. All four gates share those tensors: each one is 1 column wide and they sit side by side in the order INPUT, FORGET, CANDIDATE, OUTPUT, which is not the order the lesson narrates them in. So column 0 of the recurrent kernel, column 0 of the input kernel and bias[0] are the input gate's `[wHidden, wInput, bias]` row, column 1 is the forget gate's, and so on. Build the four one-row arrays that way.

  The grader checks each row against the layer's own columns, then runs your `lstmStep` across a window from `prevHidden` and `prevCell` of [0] and checks its hidden state against what the layer reports at every step.
