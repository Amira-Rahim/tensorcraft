solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function buildLSTM(): tf.Sequential {
    const model = tf.sequential();
    model.add(tf.layers.lstm({ units: 32, inputShape: [80, 3] }));
    model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
    model.compile({ optimizer: 'adam', loss: 'binaryCrossentropy', metrics: ['accuracy'] });
    return model;
  }
testCode: |
  describe('buildLSTM', () => {
    it('returns a model', () => {
      const model = buildLSTM();
      expect(model).toBeDefined();
    });
    it('has 2 layers, and the first is a real LSTM (not Flatten+Dense)', () => {
      const model = buildLSTM();
      expect(model.layers.length).toBe(2);
      expect(model.layers[0].getClassName()).toBe('LSTM');
    });
    it('accepts the full 80-step window', () => {
      const model = buildLSTM();
      const input = tf.randomNormal([1, 80, 3]);
      const output = model.predict(input) as tf.Tensor;
      expect(output.shape).toEqual([1, 1]);
      input.dispose();
      output.dispose();
    });
    it('is compiled with binaryCrossentropy and an optimizer (predict works uncompiled; training would not)', () => {
      const model = buildLSTM();
      expect(model.loss).toBe('binaryCrossentropy');
      expect(model.optimizer).toBeDefined();
    });
  });
