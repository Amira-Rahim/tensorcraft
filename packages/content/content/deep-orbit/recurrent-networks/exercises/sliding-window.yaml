lessonSlug: sliding-windows
title: "Build a Sliding Window"
instructions: "Write a function that takes signal data and a window size, and returns input/label pairs for next-value prediction. Each input is a window of windowSize consecutive readings, and each label is the reading immediately after the window."
starterCode: |
