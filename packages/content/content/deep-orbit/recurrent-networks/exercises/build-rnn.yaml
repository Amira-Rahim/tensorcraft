solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function buildRNN(): tf.Sequential {
    const model = tf.sequential();
    model.add(tf.layers.simpleRNN({ units: 16, inputShape: [5, 3] }));
    model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
    model.compile({ optimizer: 'adam', loss: 'binaryCrossentropy', metrics: ['accuracy'] });
    return model;
  }
testCode: |
  describe('buildRNN', () => {
    it('returns a model', () => {
      const model = buildRNN();
      expect(model).toBeDefined();
    });
    it('has 2 layers', () => {
      const model = buildRNN();
      expect(model.layers.length).toBe(2);
    });
    it('accepts correct input shape', () => {
      const model = buildRNN();
      const input = tf.randomNormal([1, 5, 3]);
      const output = model.predict(input) as tf.Tensor;
      expect(output.shape).toEqual([1, 1]);
      input.dispose();
      output.dispose();
    });
  });
