slug: build-rnn
lessonSlug: simple-rnns
title: "Carry the Hidden State"
instructions: |
  Two halves, and the second one checks the first.

  1. `runCell(readings, recurrentWeight, inputWeight, bias)` walks the readings in order carrying one number of hidden state. Start every call at `h = 0`, and at each reading set `h = Math.tanh(recurrentWeight * h + inputWeight * reading + bias)`.
  2. Return the states as a list, one per reading, in the order they were computed. Nothing carries between calls: `h` starts at 0 again the next time the function runs.
  3. Run it on the lesson's drill (readings 0.5, 0.9, 0.5 with recurrentWeight 0.8, inputWeight 1 and bias 0) and the reading 0.5 comes back as 0.4621 at step 1 and 0.8284 at step 3. Same reading, two answers, because the state carries what happened in between.
  4. Then build the same cell out of the library. `buildCellLayer(timeSteps)` returns `{ model, inputWeight, recurrentWeight, bias }`, where `model` is a `tf.sequential()` holding one layer: `tf.layers.simpleRNN({ units: 1, inputShape: [timeSteps, 1], returnSequences: true })`. One unit and one feature, because that is the cell `runCell` describes; give the layer more of either and it mixes the dimensions through matrices no single number stands in for.
  5. `returnSequences: true` makes it report the state after every step instead of only the last, which is the same list `runCell` returns.
  6. A layer that has not been added to a model has no weights yet, so `getWeights()` on the bare layer comes back empty: add it first, then read `model.getWeights()`. That returns three tensors, in this order: the INPUT kernel (shape [1, 1]), the RECURRENT kernel (shape [1, 1]), and the bias (shape [1]). Note the order, because the lesson writes the formula the other way round. Hand the three back as plain numbers under the names above.

  The grader reads the model's own weights, drives your `runCell` with them, and checks every state against what the layer computes for the same readings.
