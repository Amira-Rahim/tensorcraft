slug: build-rnn
lessonSlug: simple-rnns
title: "Hidden state across time steps"
instructions: |
  Implement three functions:

  - runCell(readings, recurrentWeight, inputWeight, bias): start h at zero for
    each call, update h = Math.tanh(recurrentWeight * h + inputWeight * reading
    + bias) for each reading, and return all states in order. Use plain JS.
  - buildCellLayer(timeSteps): build a Sequential model with one SimpleRNN
    layer, units 1, inputShape [timeSteps, 1], returnSequences true. Read the
    three tensors from model.getWeights(): input kernel, recurrent kernel,
    bias. Return { model, inputWeight, recurrentWeight, bias }, with the last
    three as numbers. The grader compares your JS recurrence with this layer.
  - decayFactors(states, recurrentWeight): return the running product of
    recurrentWeight * (1 - h * h), one factor per state. Use plain JS. This
    is the scalar recurrence's derivative of each state with respect to its
    initial state. It does not calculate training gradients for every parameter.

  All inputs are finite and timeSteps is a positive integer. The caller owns
  the returned model. Adding the layer builds its weights. An explicit build
  can also do so, but this task uses the Sequential model.
