slug: optimization-edge
title: "Optimization & Edge"
worldId: deep-orbit
order: 10
description: |
  A model load crashes the bridge dashboard during a capture window.
  Measure the costs of profiling, quantization, pruning, caching and backend
  changes before the next deployment. The mission uses fictional budgets;
  the runtime lab measures the supplied model on your device.
summary: "Shrink a model to fit the hardware: profiling, quantization (fewer bytes per weight), pruning (zeroing small weights and measuring the effect), caching, and WebGPU (the math on the GPU), a trade of size against accuracy."
lessonCount: 5
