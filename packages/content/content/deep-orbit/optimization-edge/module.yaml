slug: optimization-edge
title: "Optimization & Edge"
worldId: deep-orbit
order: 10
description: |
  This one is penance. At 0247 the pulse window opened, and at 0249 the
  340 MB model took the 512 MB bridge dashboard down with it: the capture
  was lost and Earth's relay slot closed without it. You'll work through
  profiling, quantization, pruning, caching, and WebGPU acceleration to
  shrink the model to 42 MB with 2.4% accuracy loss, measured rather than
  rounded away. The lost capture stays lost; the next one does not have to.
summary: "Profiling, quantization, pruning, caching, and WebGPU acceleration, treated as a measured tradeoff between model size and accuracy."
lessonCount: 5
