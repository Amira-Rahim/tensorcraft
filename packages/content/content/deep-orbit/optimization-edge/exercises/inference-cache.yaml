slug: inference-cache
lessonSlug: caching-strategies
title: "Inference Result Cache (Quantized Input Hash)"
mlContent: deployment
instructions: |
  Build a cache that hashes input tensors so near-identical inputs hit the same entry. `makeInferenceCache(model, decimals = 2, maxEntries = 100)` returns `{ predict(input), stats }`, and stats counts hits and misses. On a miss, predict runs the model and stores the result; on a hit it returns the stored result and does not run the model.

  What a cache stored is its own: build a second cache over a second model and the same signal is a miss there, because the same values under different weights are a different answer.

  Two inputs belong to the same entry only when their shapes and dtypes match and their values agree to `decimals` decimal places position by position, and to nothing coarser than that: signals the cache treats as identical get served one verdict between them, so a key has to keep the values apart from each other as well as keep all of them.

  Keep at most maxEntries entries. Use least-recently-used eviction: a hit makes an entry newest; inserting beyond capacity removes the oldest. maxEntries must be a positive integer. decimals must be an integer from 0 to 10. Reject invalid settings.

  Store the prediction as plain numbers rather than the tensor it arrived in, because a stored handle stays resident until the tab closes and the first caller to dispose it breaks every later hit on that key. Dispose that tensor once you have read the numbers out of it: this module opened on a dashboard that ran out of memory.

  Return a fresh plain array on both hits and misses so callers cannot edit the cached result. The caller owns input tensors. The cache owns and disposes prediction tensors. Assume finite numeric inputs and unchanged model weights/preprocessing during a cache's lifetime; create a new cache after either changes. Rounding is approximate reuse and needs an application-specific error budget.
starterCode: |
  function makeInferenceCache(model, decimals = 2, maxEntries = 100) {
    // A hit and a miss have to hand the caller the same kind of value, and
    // nothing the cache keeps can be a handle someone else can dispose.
    return {
      predict(input) {
        return model.predict(input);
      },
      stats: { hits: 0, misses: 0 },
    };
  }
solutionCode: |
  function makeInferenceCache(model, decimals = 2, maxEntries = 100) {
    if (
      !Number.isInteger(decimals) ||
      decimals < 0 ||
      decimals > 10 ||
      !Number.isInteger(maxEntries) ||
      maxEntries < 1
    )
      throw new Error('Invalid cache settings');
    const cache = new Map();
    const stats = { hits: 0, misses: 0 };
    const factor = 10 ** decimals;
    return {
      stats,
      predict(input) {
        const values = Array.from(input.dataSync()).map((v) => Math.round(v * factor) / factor);
        const key = JSON.stringify([input.dtype, input.shape, values]);
        if (cache.has(key)) {
          stats.hits++;
          const scores = cache.get(key);
          cache.delete(key);
          cache.set(key, scores);
          return scores.slice();
        }
        stats.misses++;
        const out = model.predict(input);
        let scores;
        try {
          scores = Array.from(out.dataSync());
        } finally {
          out.dispose();
        }
        cache.set(key, scores);
        if (cache.size > maxEntries) cache.delete(cache.keys().next().value);
        return scores.slice();
      },
    };
  }
testCode: |
  describe('makeInferenceCache (real model.predict + hash)', () => {
    function makeModel() {
      const m = tf.sequential();
      m.add(tf.layers.dense({ units: 1, inputShape: [2] }));
      return m;
    }
    // Wraps predict so a test can count forward passes, and exposes the
    // model's own answer for an input. The weights are a fresh random
    // initialization per model, so the numbers a working cache returns
    // are numbers no submission can hardcode.
    function countingModel() {
      const m = makeModel();
      const real = m.predict.bind(m);
      const counter = { calls: 0 };
      m.predict = function (x) {
        counter.calls++;
        return real(x);
      };
      const truth = function (values) {
        const out = real(tf.tensor2d([values]));
        const scores = Array.from(out.dataSync());
        out.dispose();
        return scores;
      };
      return { model: m, counter: counter, truth: truth };
    }
    it('caches identical inputs', () => {
      const m = makeModel();
      const cache = makeInferenceCache(m);
      const input = tf.tensor2d([[0.5, 0.5]]);
      cache.predict(input);
      cache.predict(input);
      expect(
        cache.stats.hits,
        'The second call repeats the first input, so it has to find what the first call stored. The starter runs the model twice and counts neither call.',
      ).toBe(1);
      expect(cache.stats.misses).toBe(1);
    });
    it('caches near-identical inputs (post-rounding)', () => {
      const m = makeModel();
      const cache = makeInferenceCache(m, 1); // 1 decimal place
      cache.predict(tf.tensor2d([[0.51, 0.5]]));
      cache.predict(tf.tensor2d([[0.49, 0.5]])); // both round to 0.5
      expect(
        cache.stats.hits,
        'At one decimal place these two signals are the same signal. A key built from the raw values keeps them apart and these two different inputs would not share the approximate cache entry requested here.',
      ).toBe(1);
    });
    it('keys to decimals and no coarser than decimals', () => {
      // The other side of the tuning knob. The test above proves a key can
      // be too strict to earn a hit; this one proves it can be too loose to
      // deserve one. decimals is 2 here, so these two signals agree at the
      // first place and part at the second, and they are two signals.
      const probe = countingModel();
      const cache = makeInferenceCache(probe.model);
      const first = cache.predict(tf.tensor2d([[0.12, 0.5]]));
      const second = cache.predict(tf.tensor2d([[0.14, 0.5]]));
      expect(
        cache.stats.misses,
        "A bucket wider than decimals serves one signal the other one's verdict. Round to the width you were handed rather than to a width of your own, or the parameter the caller tunes changes nothing.",
      ).toBe(2);
      expect(probe.counter.calls).toBe(2);
      expect(Array.from(first)).toEqual(probe.truth([0.12, 0.5]));
      expect(Array.from(second)).toEqual(probe.truth([0.14, 0.5]));
    });
    it('separate cache for very different inputs', () => {
      const m = makeModel();
      const cache = makeInferenceCache(m);
      cache.predict(tf.tensor2d([[0.1, 0.1]]));
      cache.predict(tf.tensor2d([[0.9, 0.9]]));
      expect(
        cache.stats.misses,
        'Rounding to two places leaves these two far apart, so neither can answer for the other.',
      ).toBe(2);
    });
    it('two signals that differ only in the order of their values are two inputs', () => {
      // The lesson's hard part, written into a test: deciding when two
      // inputs are the same input. A key that boils the values down to one number
      // (their sum, their mean, their count) says these two are the same
      // signal. The dense layer does not: it weights the first feature
      // differently from the second, so it has two different answers.
      const probe = countingModel();
      const cache = makeInferenceCache(probe.model);
      const first = cache.predict(tf.tensor2d([[0.9, 0.1]]));
      const second = cache.predict(tf.tensor2d([[0.1, 0.9]]));
      expect(
        probe.counter.calls,
        'Both of these signals sum to 1, and a key that keeps only the sum merges them. The cache then serves one signal the verdict it computed for the other, which is the incident this lesson pages you about next.',
      ).toBe(2);
      expect(cache.stats.hits).toBe(0);
      expect(
        Array.isArray(first) || ArrayBuffer.isView(first),
        'predict has to hand back plain numbers on both paths. The starter is still returning the tensor model.predict produced, which nothing here can read values out of.',
      ).toBe(true);
      expect(Array.from(first)).toEqual(probe.truth([0.9, 0.1]));
      expect(Array.from(second)).toEqual(probe.truth([0.1, 0.9]));
    });
    it('two signals that differ only at a feature boundary are two inputs', () => {
      // The other way to lose a feature boundary, and it survives every
      // test above: keep every value, round every value, then run them
      // together into one string with nothing between them. [0.12, 3] and
      // [0.1, 23] agree on neither feature and spell the same characters.
      const probe = countingModel();
      const cache = makeInferenceCache(probe.model);
      const first = cache.predict(tf.tensor2d([[0.12, 3]]));
      const second = cache.predict(tf.tensor2d([[0.1, 23]]));
      expect(
        probe.counter.calls,
        "0.12 is not 0.1 and 3 is not 23, so at two decimal places these are two signals and each needs its own forward pass. A key that joins the rounded values with nothing between them reads both of them as 0.123, and then one signal is served the other one's verdict.",
      ).toBe(2);
      expect(cache.stats.hits).toBe(0);
      expect(
        Array.isArray(first) || ArrayBuffer.isView(first),
        'predict has to hand back plain numbers on both paths. The starter is still returning the tensor model.predict produced, which nothing here can read values out of.',
      ).toBe(true);
      expect(Array.from(first)).toEqual(probe.truth([0.12, 3]));
      expect(Array.from(second)).toEqual(probe.truth([0.1, 23]));
    });
    it('every value in the signal is in the key, not only the first one', () => {
      // Every pair above parts at the FIRST value, so a key read off
      // data[0] alone survives all of them. These two agree there and part
      // at the second value.
      const probe = countingModel();
      const cache = makeInferenceCache(probe.model);
      const first = cache.predict(tf.tensor2d([[0.5, 0.12]]));
      const second = cache.predict(tf.tensor2d([[0.5, 0.93]]));
      expect(
        probe.counter.calls,
        'These two signals agree on their first value and disagree on their second, so they are two signals and each needs its own forward pass. A key built from one value ignores every feature after it, and a cache keyed that way answers for signals it has never seen.',
      ).toBe(2);
      expect(cache.stats.hits).toBe(0);
      expect(Array.from(first)).toEqual(probe.truth([0.5, 0.12]));
      expect(Array.from(second)).toEqual(probe.truth([0.5, 0.93]));
    });
    it('stores values, not tensor handles', () => {
      const m = makeModel();
      const cache = makeInferenceCache(m);
      const before = tf.memory().numTensors;
      const miss = cache.predict(tf.tensor2d([[0.2, 0.3]]));
      const hit = cache.predict(tf.tensor2d([[0.2, 0.3]]));
      expect(
        miss instanceof tf.Tensor,
        'Hand the caller a tensor and the cache has handed out something anyone can dispose. Read the prediction into numbers first.',
      ).toBe(false);
      expect(Array.from(hit)).toEqual(Array.from(miss));
      // The two input tensors made above are still live. A cached
      // prediction handle would make this 3 instead of 2, and it would
      // never be released.
      expect(
        tf.memory().numTensors - before,
        'Only the two input tensors above should still be live. A prediction the cache is holding, or one nobody disposed, shows up here in this count, in the module that opened on a dashboard running out of memory.',
      ).toBe(2);
    });
    it("a miss returns the model's own output and a hit skips the forward pass", () => {
      const probe = countingModel();
      const cache = makeInferenceCache(probe.model);
      const miss = cache.predict(tf.tensor2d([[0.37, 0.81]]));
      expect(probe.counter.calls).toBe(1);
      const hit = cache.predict(tf.tensor2d([[0.37, 0.81]]));
      // Still 1: the hit is the saved answer, not a second forward pass.
      expect(
        probe.counter.calls,
        'A hit that runs the model again has saved nothing. The forward pass this hit is meant to skip is the classifier call the lesson timed at 0.035 ms, and skipping it is the only thing a cache ever buys.',
      ).toBe(1);
      const expected = probe.truth([0.37, 0.81]);
      expect(
        Array.from(miss),
        "This model's weights are randomly initialized per run, so the answer has to come from the model rather than from anything a submission could remember.",
      ).toEqual(expected);
      expect(Array.from(hit)).toEqual(expected);
    });
    it("a new key runs the model again, on that key's own values", () => {
      const probe = countingModel();
      const cache = makeInferenceCache(probe.model);
      const first = cache.predict(tf.tensor2d([[0.64, 0.12]]));
      const second = cache.predict(tf.tensor2d([[-0.53, 0.29]]));
      expect(probe.counter.calls).toBe(2);
      const expectedFirst = probe.truth([0.64, 0.12]);
      const expectedSecond = probe.truth([-0.53, 0.29]);
      expect(
        Array.isArray(first) || ArrayBuffer.isView(first),
        'predict has to hand back plain numbers on both paths. The starter is still returning the tensor model.predict produced, which nothing here can read values out of.',
      ).toBe(true);
      expect(Array.from(first)).toEqual(expectedFirst);
      expect(Array.from(second)).toEqual(expectedSecond);
      // Two different signals cannot share one stored verdict.
      expect(expectedFirst).not.toEqual(expectedSecond);
    });
    it('an entry is still there after another signal has gone through', () => {
      // Every sequence above repeats a signal immediately, so a cache that
      // remembers only the call before this one clears all of them. Real
      // telemetry interleaves, and the 40 percent of forward passes this
      // lesson removes are repeats that come back later in the night.
      const probe = countingModel();
      const cache = makeInferenceCache(probe.model);
      cache.predict(tf.tensor2d([[0.21, 0.44]]));
      cache.predict(tf.tensor2d([[0.77, 0.05]]));
      cache.predict(tf.tensor2d([[0.33, 0.68]]));
      cache.predict(tf.tensor2d([[0.06, 0.91]]));
      const again = cache.predict(tf.tensor2d([[0.21, 0.44]]));
      expect(
        probe.counter.calls,
        'The last call repeats the first signal with three other signals in between, so it has to find what the first call stored. Holding the last call, or the last few, drops an entry as soon as enough other signals arrive, which hits on a run of duplicates and earns almost nothing on a night of mixed traffic.',
      ).toBe(4);
      expect(cache.stats.hits).toBe(1);
      expect(cache.stats.misses).toBe(4);
      expect(Array.from(again)).toEqual(probe.truth([0.21, 0.44]));
    });
    it('each cache answers for its own model', () => {
      // Every case above builds one cache over one model, so a store shared
      // by every cache in the process clears all of them. Two models, two
      // caches, one signal: with a shared store the second call finds an
      // entry the first cache wrote, runs no forward pass, and hands back a
      // verdict the second model never computed.
      const first = countingModel();
      const second = countingModel();
      const cacheA = makeInferenceCache(first.model);
      const cacheB = makeInferenceCache(second.model);
      const values = [0.42, 0.58];
      const fromA = cacheA.predict(tf.tensor2d([values]));
      const fromB = cacheB.predict(tf.tensor2d([values]));
      expect(
        second.counter.calls,
        "The second cache has never seen this signal. It was built over its own model, and an entry stored under another model's weights is not an answer for this one, so this call is a miss and the model runs.",
      ).toBe(1);
      expect(cacheB.stats.hits).toBe(0);
      expect(cacheB.stats.misses).toBe(1);
      expect(
        Array.from(fromB),
        'A cache hands back the verdict its own model computed. These two models hold different weights, so one of them answering for the other is a stale verdict arriving before anyone has even deployed.',
      ).toEqual(second.truth(values));
      expect(first.counter.calls).toBe(1);
      expect(Array.from(fromA)).toEqual(first.truth(values));
    });
  });

  it('keys shape and dtype and protects stored values from callers', () => {
    let calls = 0;
    const cache = makeInferenceCache({ predict: () => tf.tensor1d([++calls]) });
    const x = tf.tensor1d([1, 2]);
    const first = cache.predict(x);
    first[0] = 999;
    const hit = cache.predict(x);
    expect(hit).toEqual([1]);
    hit[0] = 888;
    expect(cache.predict(x)).toEqual([1]);
    expect(cache.predict(tf.tensor2d([[1, 2]]))).toEqual([2]);
    expect(cache.predict(tf.tensor1d([1, 2], 'int32'))).toEqual([3]);
    expect(x.isDisposedInternal).toBe(false);
  });
  it('evicts the least recently used key at the requested capacity', () => {
    let calls = 0;
    const cache = makeInferenceCache({ predict: () => tf.tensor1d([++calls]) }, 2, 2);
    const a = tf.tensor1d([1]),
      b = tf.tensor1d([2]),
      c = tf.tensor1d([3]);
    cache.predict(a);
    cache.predict(b);
    expect(cache.predict(a)).toEqual([1]);
    cache.predict(c);
    expect(cache.predict(a)).toEqual([1]);
    expect(cache.predict(b)).toEqual([4]);
    expect(cache.stats).toEqual({ hits: 2, misses: 4 });
    expect(() => makeInferenceCache({}, 2, 0)).toThrow();
    expect(() => makeInferenceCache({}, -1)).toThrow();
  });
