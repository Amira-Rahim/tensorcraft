slug: inference-cache
lessonSlug: caching-strategies
title: "Inference Result Cache (Quantized Input Hash)"
mlContent: deployment
instructions: "Build a cache that hashes input tensors (after quantization) so near-identical inputs hit the same cache entry. `makeInferenceCache(model, decimals = 2)` returns `{ predict(input), stats }`; predict runs `model.predict` on a miss, reads the output back with `dataSync()`, disposes that tensor, and caches the numbers under a hash of the input values rounded to `decimals` places. Cache values, not tensor handles: a stored handle stays resident until the tab closes, and the first caller to dispose it breaks every later hit on that key."
starterCode: |
  function makeInferenceCache(model, decimals = 2) {
    return { predict(input) { return model.predict(input); }, stats: { hits: 0, misses: 0 } };
  }
solutionCode: |
  function makeInferenceCache(model, decimals = 2) {
    const cache = new Map();
    const stats = { hits: 0, misses: 0 };
    const factor = Math.pow(10, decimals);
    // predict returns numbers on both paths, so a hit and a miss are
    // interchangeable to the caller, and nothing the cache holds is a
    // tensor anyone else can dispose.
    return {
      stats,
      predict(input) {
        const data = Array.from(input.dataSync());
        const key = data.map(v => Math.round(v * factor) / factor).join(',');
        if (cache.has(key)) {
          stats.hits++;
          return cache.get(key);
        }
        stats.misses++;
        const out = model.predict(input);
        const scores = Array.from(out.dataSync());
        out.dispose();
        cache.set(key, scores);
        return scores;
      },
    };
  }
testCode: |
  describe('makeInferenceCache (real model.predict + hash)', () => {
    function makeModel() {
      const m = tf.sequential();
      m.add(tf.layers.dense({ units: 1, inputShape: [2] }));
      return m;
    }
    it('caches identical inputs', () => {
      const m = makeModel();
      const cache = makeInferenceCache(m);
      const input = tf.tensor2d([[0.5, 0.5]]);
      cache.predict(input);
      cache.predict(input);
      expect(cache.stats.hits).toBe(1);
      expect(cache.stats.misses).toBe(1);
    });
    it('caches near-identical inputs (post-rounding)', () => {
      const m = makeModel();
      const cache = makeInferenceCache(m, 1);  // 1 decimal place
      cache.predict(tf.tensor2d([[0.51, 0.5]]));
      cache.predict(tf.tensor2d([[0.49, 0.5]]));   // both round to 0.5
      expect(cache.stats.hits).toBe(1);
    });
    it('separate cache for very different inputs', () => {
      const m = makeModel();
      const cache = makeInferenceCache(m);
      cache.predict(tf.tensor2d([[0.1, 0.1]]));
      cache.predict(tf.tensor2d([[0.9, 0.9]]));
      expect(cache.stats.misses).toBe(2);
    });
    it('stores values, not tensor handles', () => {
      const m = makeModel();
      const cache = makeInferenceCache(m);
      const before = tf.memory().numTensors;
      const miss = cache.predict(tf.tensor2d([[0.2, 0.3]]));
      const hit = cache.predict(tf.tensor2d([[0.2, 0.3]]));
      expect(miss instanceof tf.Tensor).toBe(false);
      expect(Array.from(hit)).toEqual(Array.from(miss));
      // The two input tensors made above are still live. A cached
      // prediction handle would make this 3 instead of 2, and it would
      // never be released.
      expect(tf.memory().numTensors - before).toBe(2);
    });
  });
