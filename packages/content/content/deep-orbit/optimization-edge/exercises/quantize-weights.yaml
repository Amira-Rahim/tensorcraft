solutionCode: |
  interface QuantizedResult {
    quantized: number[];
    scale: number;
    zeroPoint: number;
  }

  function quantize(weights: number[]): QuantizedResult {
    const min = Math.min(...weights);
    const max = Math.max(...weights);
    const scale = (max - min) / 255;
    const zeroPoint = Math.round(-min / scale);

    const quantized = weights.map(w => Math.round((w - min) / scale));

    return { quantized, scale, zeroPoint };
  }

  function dequantize(result: QuantizedResult): number[] {
    return result.quantized.map(q => (q - result.zeroPoint) * result.scale);
  }
testCode: |
  describe('quantize', () => {
    it('maps weights to 0-255 range', () => {
      const result = quantize([0.5, -0.5, 1.0, -1.0]);
      result.quantized.forEach(q => {
        expect(q).toBeGreaterThanOrEqual(0);
        expect(q).toBeLessThanOrEqual(255);
      });
    });

    it('maps min to 0 and max to 255', () => {
      const result = quantize([0.5, -0.5, 1.0, -1.0]);
      expect(Math.min(...result.quantized)).toBe(0);
      expect(Math.max(...result.quantized)).toBe(255);
    });

    it('preserves relative ordering', () => {
      const result = quantize([0.1, 0.5, -0.3, 0.9]);
      expect(result.quantized[1]).toBeGreaterThan(result.quantized[0]);
      expect(result.quantized[3]).toBeGreaterThan(result.quantized[1]);
      expect(result.quantized[2]).toBeLessThan(result.quantized[0]);
    });

    it('stores whole numbers, because a uint8 holds no fraction', () => {
      const result = quantize([0.13, -0.42, 0.77, -0.91, 0.05, 0.6]);
      result.quantized.forEach(q => {
        expect(Number.isInteger(q)).toBe(true);
      });
    });

    it('puts the same weight in a different bucket when the range changes', () => {
      // 0.37 is the same float in both sets. The bucket it lands in depends on
      // the range around it, so one memorised answer cannot satisfy both.
      const narrow = quantize([0, 0.37, 1]);
      const wide = quantize([0, 0.37, 2]);
      expect(narrow.quantized).toEqual([0, 94, 255]);
      expect(wide.quantized).toEqual([0, 47, 255]);
      expect(wide.scale).toBeCloseTo(2 * narrow.scale, 8);
    });
  });

  describe('dequantize', () => {
    it('approximately recovers original weights', () => {
      const original = [0.5, -0.5, 1.0, -1.0, 0.0];
      const quantized = quantize(original);
      const recovered = dequantize(quantized);
      expect(Array.isArray(recovered)).toBe(true);
      expect(recovered).toHaveLength(original.length);
      original.forEach((w, i) => {
        expect(recovered[i]).toBeCloseTo(w, 1);
      });
    });

    it('round-trips a different weight set', () => {
      const original = [2, 4, 8];
      const recovered = dequantize(quantize(original));
      expect(recovered).toHaveLength(3);
      original.forEach((w, i) => {
        expect(recovered[i]).toBeCloseTo(w, 1);
      });
    });

    it('lands on a bucket, not back on the original weight', () => {
      const original = [0, 0.37, 0.61, 1];
      const result = quantize(original);
      const recovered = dequantize(result);
      const errors = original.map((w, i) => Math.abs(recovered[i] - w));
      // No value drifts by more than half a bucket.
      errors.forEach(e => {
        expect(e).toBeLessThanOrEqual(result.scale / 2 + 1e-12);
      });
      // At least one value does drift. 256 buckets cannot hold an arbitrary
      // float, and that error is the price uint8 storage charges.
      expect(Math.max(...errors)).toBeGreaterThan(result.scale / 100);
    });

    it('reads scale and zeroPoint off the result it is handed', () => {
      const a = dequantize({ quantized: [0, 128, 255], scale: 0.01, zeroPoint: 128 });
      expect(a[0]).toBeCloseTo(-1.28, 6);
      expect(a[1]).toBeCloseTo(0, 6);
      expect(a[2]).toBeCloseTo(1.27, 6);

      const b = dequantize({ quantized: [0, 128, 255], scale: 0.02, zeroPoint: 0 });
      expect(b[0]).toBeCloseTo(0, 6);
      expect(b[1]).toBeCloseTo(2.56, 6);
      expect(b[2]).toBeCloseTo(5.1, 6);
    });
  });
