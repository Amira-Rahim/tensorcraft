slug: quantize-weights
lessonSlug: quantization
title: "Quantization and prediction changes"
instructions: |
  Help Nazari check what smaller weight storage changes. Write `quantizeModel(model, captures)` for the supplied synthetic multiclass Dense classifier and non-empty capture array. Simulate uint8 storage, apply the decoded weights, and compare predictions.

  Quantize only the 2-D kernel tensors from `model.getWeights()`. Leave 1-D biases at float32. For each kernel:

  1. Find its min and max. Set `scale = (max - min) / 255`.
  2. Store each value as `Math.round((value - min) / scale)`, an integer from 0 to 255.
  3. Decode each code as `stored * scale + min` and apply those floats to the model before predicting again.

  For a constant kernel, use scale 0 and all-zero codes. Decoding then restores `min` exactly.

  Return `{ kernels, maxWeightError, predictionsChanged }`:

  - `kernels`: one `{ quantized, scale, min, shape }` per kernel, in model order. Keep each kernel's flat value order.
  - `maxWeightError`: the largest absolute difference between an original weight and its decoded value, before float32 rounding.
  - `predictionsChanged`: the number of captures whose largest-output class changes.

  `quantized` holds integer codes in an array. Packing them into a byte file would require a separate step. This function changes the supplied model. The caller owns it. A changed class means the models disagree. Trusted labels would tell you which prediction is correct. Quantization can also leave weights and predictions unchanged.
