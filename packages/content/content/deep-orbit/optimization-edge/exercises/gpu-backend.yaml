slug: gpu-backend
lessonSlug: webgpu-acceleration
title: "Backend selection and fallback"
instructions: |
  Help Demir find a working backend for the console. Write `initBestBackend(preference, runtime)`. Try names in the supplied order and return the first one that starts.

  `runtime` provides the three TensorFlow.js calls used in the lesson:

  - `setBackend(name)` resolves true when the backend starts. It resolves false when a registered backend fails to start, and throws when the registry lacks that backend, such as when your code never imported its package. Try the next name after either failure.
  - `ready()` waits for initialization. Call it exactly once, after the attempts and before returning.
  - `getBackend()` reports the active name. Do not use it to judge a failed attempt: in TFJS 4.22 it can still report the name that failed.

  Stop trying names after the first success. If every attempt fails, await `ready()` and return `runtime.getBackend()`. If `ready()` rejects because no backend can start, let that error reach the caller.
starterCode: |
  type BackendName = string;

  interface Runtime {
    setBackend: (name: BackendName) => Promise<boolean>;
    ready: () => Promise<void>;
    getBackend: () => BackendName;
  }

  async function initBestBackend(
    preference: BackendName[],
    runtime: Runtime
  ): Promise<BackendName> {
    // A failed start may return false without throwing.
    // A reported backend name alone does not prove it works.
    return null; // your code here
  }
solutionCode: |
  type BackendName = string;

  interface Runtime {
    setBackend: (name: BackendName) => Promise<boolean>;
    ready: () => Promise<void>;
    getBackend: () => BackendName;
  }

  async function initBestBackend(
    preference: BackendName[],
    runtime: Runtime
  ): Promise<BackendName> {
    for (const name of preference) {
      let started = false;
      try {
        started = await runtime.setBackend(name);
      } catch {
        started = false;
      }
      if (started) {
        await runtime.ready();
        return name;
      }
    }

    await runtime.ready();
    return runtime.getBackend();
  }
testCode: |
  describe('initBestBackend', () => {
    // A stand-in for tf.setBackend / tf.ready / tf.getBackend, built to match
    // what tfjs 4.22 actually does. A name in `outcomes` is registered: true
    // means it starts, false means it is registered and fails to start (the
    // real call logs 'Initialization of backend X failed' and resolves false,
    // it does not throw). A name that is absent was never registered, and
    // that is the case that throws. getBackend() reports the failed name
    // until ready() moves the engine onto something that does run.
    function makeRuntime(outcomes: Record<string, boolean>, settled = 'cpu') {
      const calls: string[] = [];
      let current = 'cpu';
      const runtime = {
        setBackend: async (name: string) => {
          calls.push(name);
          if (!(name in outcomes)) {
            throw new Error(`Backend name '${name}' not found in registry`);
          }
          current = name;
          return outcomes[name];
        },
        ready: async () => {
          calls.push('ready');
          if (outcomes[current] !== true) current = settled;
        },
        getBackend: () => current,
      };
      return { runtime, calls };
    }

    const LADDER = ['webgpu', 'webgl', 'wasm'];

    // One guard, so the first Run of the starter reports the contract it has
    // not met yet instead of comparing against null three times over.
    async function chosen(preference: string[], runtime: any) {
      const name = await initBestBackend(preference, runtime);
      expect(
        name,
        'initBestBackend returned nothing. Try the backends in the supplied order and return the name of the one that starts.'
      ).toBeDefined();
      return name;
    }

    it('takes the first backend that starts', async () => {
      const { runtime, calls } = makeRuntime({ webgpu: true, webgl: true, wasm: true });
      expect(await chosen(LADDER, runtime)).toBe('webgpu');
      expect(
        calls,
        'The first name started, so the selector skips the remaining names, and ready() runs once at the end.'
      ).toEqual(['webgpu', 'ready']);
    });

    it('treats a false resolve as a backend that did not start', async () => {
      const { runtime } = makeRuntime({ webgpu: false, webgl: true, wasm: true });
      expect(
        await chosen(LADDER, runtime),
        'The registry contains webgpu, but it fails to start. setBackend returns false without throwing, so check that result before reporting success.'
      ).toBe('webgl');
    });

    it('keeps going when a name was never registered', async () => {
      const { runtime, calls } = makeRuntime({ webgl: true, wasm: true });
      expect(
        await chosen(LADDER, runtime),
        'webgpu is missing from the registry, which is the forgotten-import case, and that one does throw. Try the next backend when a package is missing.'
      ).toBe('webgl');
      expect(calls).toEqual(['webgpu', 'webgl', 'ready']);
    });

    it('handles false returns and exceptions in the same fallback sequence', async () => {
      const { runtime, calls } = makeRuntime({ webgpu: false, wasm: true });
      const selected = await chosen(LADDER, runtime);
      expect(selected).toBe('wasm');
      expect(calls).toEqual(['webgpu', 'webgl', 'wasm', 'ready']);
      recordResult({
        kind: 'table',
        title: 'How your selector reached a working backend',
        summary: 'Selected ' + selected + ' in a controlled runtime. This verifies failure handling. Check device support and speed in the runtime lab.',
        columns: ['Observed call', 'Supplied runtime response'],
        rows: calls.map((name) => [name, name === 'webgpu' ? 'Initialization returned false' : name === 'webgl' ? 'Unregistered backend threw' : name === 'ready' ? 'Initialization settled' : 'Started']),
      });
    });

    it('stops after the first successful backend', async () => {
      const { runtime, calls } = makeRuntime({ webgpu: false, webgl: true, wasm: true });
      expect(await chosen(LADDER, runtime)).toBe('webgl');
      expect(
        calls,
        'wasm would have started too. Starting it anyway costs a context the page may not get back, and it would ignore the requested preference.'
      ).toEqual(['webgpu', 'webgl', 'ready']);
    });

    it('follows the order it was given, not the one in the lesson', async () => {
      // The first name in the caller's order fails, on purpose. When every
      // backend in the order starts, a ladder that honours only the first
      // entry and then falls through the lesson's own list looks identical
      // to one that honours the whole order (round 7, 2026-09-13).
      const { runtime, calls } = makeRuntime({ wasm: false, webgl: true, webgpu: true });
      expect(
        await chosen(['wasm', 'webgpu', 'webgl'], runtime),
        'Follow the supplied preference order, including after a failed attempt. The caller may need WASM first because the GPU path does not work on that device.'
      ).toBe('webgpu');
      expect(
        calls,
        'Follow the supplied order: try wasm, then webgpu, then await ready(). Do not fall back to a fixed list from the lesson.'
      ).toEqual(['wasm', 'webgpu', 'ready']);
    });

    it('reports the active backend after every attempted backend fails', async () => {
      const { runtime, calls } = makeRuntime({ webgpu: false, webgl: false });
      const name = await chosen(LADDER, runtime);
      expect(
        name,
        'All requested backends failed. Await ready(), then return the backend that actually started. The last attempted name, webgl, is not a working backend.'
      ).toBe('cpu');
      expect(calls).toEqual(['webgpu', 'webgl', 'wasm', 'ready']);
    });

    it('calls ready once, on every path', async () => {
      const started = makeRuntime({ webgpu: true, webgl: true, wasm: true });
      await chosen(LADDER, started.runtime);
      const exhausted = makeRuntime({ webgpu: false, webgl: false, wasm: false });
      await chosen(LADDER, exhausted.runtime);
      expect(started.calls.filter(c => c === 'ready').length).toBe(1);
      expect(
        exhausted.calls.filter(c => c === 'ready').length,
        'Await ready() once after trying the preferred backends, then read the active backend name.'
      ).toBe(1);
    });
  });
  it('propagates failure when no backend can become ready', async () => {
    await expect(initBestBackend(['wasm'], {
      setBackend: async () => false,
      ready: async () => { throw new Error('No usable backend'); },
      getBackend: () => 'wasm',
    })).rejects.toThrow();
  });
