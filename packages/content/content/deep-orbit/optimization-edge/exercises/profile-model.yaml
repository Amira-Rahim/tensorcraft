slug: profile-model
lessonSlug: model-profiling
title: "Profile a Model"
instructions: "Write a profiler that returns `{ parameterCount, memorySizeMB, avgInferenceMs, layerBreakdown }`, four things about a model: how many parameters it holds, how many megabytes those parameters occupy as float32, how long one inference takes on average, and where the parameters sit. Five rules decide whether the report can be read. (1) Report the megabytes the way the lesson's report does, in MB rather than MiB. (2) layerBreakdown is one row per entry in model.layers, in the model's own order, each { name, params } read off that layer. The rows that own nothing belong in it too: a reshape or a flatten holds no weights and still occupies a line, which is how a reader sees that its share is zero rather than wondering where it went. (3) The average has to be a measurement of the model you were handed. `runs` is how many timed calls you average, and one warmup call comes before those and is not timed, because a model's first call pays a one-off compilation cost. (4) On a GPU backend predict() returns while the work is still queued, so a timed call is only finished once you have awaited the values out of its output. (5) avgInferenceMs is the mean of those timed calls, not the fastest of them and not the middle one, because the lesson reads a mean beside a tail for a reason: one call is not a profile."
