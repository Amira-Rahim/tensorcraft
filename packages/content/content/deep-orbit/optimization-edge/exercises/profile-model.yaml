slug: profile-model
lessonSlug: model-profiling
title: "Model profiling"
instructions: |
  Implement profileModel(model, createInput, runs, now = () => performance.now()).
  runs must be a positive integer. Return parameterCount from countParams(),
  memorySizeMB as parameterCount * 4 / 1e6, and one { name, params } row per
  model.layers entry in layerBreakdown, including zero-parameter layers.

  Run one untimed warmup, awaiting its output.data(). Then measure exactly
  runs calls with the supplied now clock, starting just before predict and
  stopping after awaited data(). avgInferenceMs is their arithmetic mean.
  This measures warm inference plus readback, excluding input creation.
  Real workloads may need more warmup than this exercise specifies.

  Dispose every created input and output, including when predict or readback
  fails. The caller owns the model. leakedTensors is the net change in
  tf.memory().numTensors from before warmup to after the final call; it must
  be zero in this controlled loop. That field is not a process-memory measure
  or a general proof of leak freedom. Parameter bytes are not peak memory.
