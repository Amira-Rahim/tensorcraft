solutionCode: |
  interface ModelProfile {
    parameterCount: number;
    memorySizeMB: number;
    avgInferenceMs: number;
  }

  async function profileModel(
    model: { countParams: () => number; predict: (x: any) => any },
    createInput: () => any,
    runs: number
  ): Promise<ModelProfile> {
    const parameterCount = model.countParams();
    const memorySizeMB = (parameterCount * 4) / 1e6;

    const times: number[] = [];
    for (let i = 0; i < runs; i++) {
      const input = createInput();
      const start = performance.now();
      model.predict(input);
      times.push(Math.max(0, performance.now() - start));
    }

    const avgInferenceMs = times.reduce((a, b) => a + b, 0) / times.length;

    return { parameterCount, memorySizeMB, avgInferenceMs };
  }
testCode: |
  describe('profileModel', () => {
    const mockModel = {
      countParams: () => 85_000_000,
      predict: (x: any) => x,
    };
    const createInput = () => [1, 2, 3];

    it('returns correct parameter count', async () => {
      const profile = await profileModel(mockModel, createInput, 5);
      expect(profile.parameterCount).toBe(85_000_000);
    });

    it('calculates memory size in true MB (params * 4 / 1e6, not MiB)', async () => {
      const profile = await profileModel(mockModel, createInput, 5);
      expect(profile.memorySizeMB).toBeCloseTo(340.0, 1);
    });

    it('measures average inference time', async () => {
      const profile = await profileModel(mockModel, createInput, 10);
      expect(profile.avgInferenceMs).toBeGreaterThanOrEqual(0);
      expect(typeof profile.avgInferenceMs).toBe('number');
    });

    it('runs the correct number of iterations', async () => {
      let count = 0;
      const countingModel = {
        countParams: () => 100,
        predict: () => { count++; },
      };
      await profileModel(countingModel, createInput, 7);
      expect(count).toBe(7);
    });
  });
