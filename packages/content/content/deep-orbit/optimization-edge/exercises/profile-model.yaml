slug: profile-model
lessonSlug: model-profiling
title: "Profile a Model"
instructions: |
  **Contract revision 2026-09-17b:** profileModel accepts an optional fourth argument now, a clock function defaulting to performance.now. Use that clock for timing.

  Write a profiler that returns `{ parameterCount, memorySizeMB, avgInferenceMs, layerBreakdown, leakedTensors }`, five things about a model: how many parameters it holds, how many megabytes those parameters occupy as float32, how long one inference takes on average, where the parameters sit, and how many tensors the profiling loop left behind. Six rules decide whether the report can be read.

  (1) Report the megabytes the way the lesson's report does, in MB rather than MiB.

  (2) layerBreakdown is one row per entry in model.layers, in the model's own order, each { name, params } read off that layer. The rows that own nothing belong in it too: a reshape or a flatten holds no weights and still occupies a line, which is how a reader sees that its share is zero rather than wondering where it went.

  (3) The average has to be a measurement of the model you were handed. `runs` is how many timed calls you average, and one warmup call comes before those and is not timed, because initial calls can include compilation and initialization costs. Await the warmup result before timing, as rule (4) does for each measured call. A single warmup is this exercise's contract; real workloads may need more before timings stabilize.

  (4) On a GPU backend predict() returns while the work is still queued, so a timed call is only finished once you have awaited the values out of its output.

  (5) avgInferenceMs is the mean of those timed calls, not the fastest of them and not the middle one, because the lesson reads a mean beside a tail for a reason: one call is not a profile.

  (6) leakedTensors is tf.memory().numTensors read after the last timed call minus the same count read before the warmup, and the loop has to leave it at 0: every input createInput() hands you and every output predict() hands back is disposed once its values are out, the warmup pair included. The field measures net tensor-count change in this controlled loop. In a general application, count growth alone does not establish a leak. The mock models hand back handles with a no-op dispose, so one loop serves them and the real models alike, and the real ones have real tensors to leak.

  Use the injected now() clock around each measured predict plus awaited data() call. The default is () => performance.now(). runs must be a positive integer. Controlled clocks test timing arithmetic without machine-speed limits; real calls still measure the device running them.
