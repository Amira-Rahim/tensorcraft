solutionCode: |
  interface LayerProfile {
    name: string;
    params: number;
  }

  interface ModelProfile {
    parameterCount: number;
    memorySizeMB: number;
    avgInferenceMs: number;
    layerBreakdown: LayerProfile[];
    leakedTensors: number;
  }

  async function profileModel(
    model: {
      countParams: () => number;
      layers: { name: string; countParams: () => number }[];
      predict: (x: any) => { data: () => Promise<unknown>; dispose: () => void };
    },
    createInput: () => { dispose: () => void },
    runs: number,
    now: () => number = () => performance.now(),
  ): Promise<ModelProfile> {
    if (!Number.isInteger(runs) || runs < 1) throw new Error('Invalid run count');
    const parameterCount = model.countParams();
    const memorySizeMB = (parameterCount * 4) / 1e6;

    // Include layers with no parameters, such as reshape layers.
    const layerBreakdown = model.layers.map((layer) => ({
      name: layer.name,
      params: layer.countParams(),
    }));

    const before = tf.memory().numTensors;

    // Run one untimed warmup to allow initial compilation.
    // Release its input and output too.
    const warmInput = createInput();
    let warmOutput;
    try { warmOutput = model.predict(warmInput); await warmOutput.data(); }
    finally { warmOutput?.dispose(); warmInput.dispose(); }

    const times: number[] = [];
    for (let i = 0; i < runs; i++) {
      const input = createInput();
      let output;
      try {
        const start = now();
        output = model.predict(input);
        await output.data();
        times.push(Math.max(0, now() - start));
      } finally { output?.dispose(); input.dispose(); }
    }

    const avgInferenceMs = times.reduce((a, b) => a + b, 0) / times.length;
    const leakedTensors = tf.memory().numTensors - before;

    return { parameterCount, memorySizeMB, avgInferenceMs, layerBreakdown, leakedTensors };
  }
testCode: |
  describe('profileModel', () => {
    // A no-op dispose on the input as well, so the lesson's loop, which
    // frees what it allocates, runs against this mock unchanged.
    const createInput = () => Object.assign([1, 2, 3], { dispose: () => {} });

    // predict() hands back a handle immediately; the cost sits in the
    // parameter so the suite can hand out two models of different speed:
    // a returned constant can match one of them, never both. firstCostMs
    // makes the mock a compiling backend, and the compilation is charged on
    // the first READBACK rather than on the first predict, because that is
    // where a real backend spends it: a warmup that enqueues a call and
    // never reads it back has warmed nothing, and the cost is still waiting
    // for the first timed call. Pass an ARRAY for costMs and the mock serves
    // one cost per call in order (holding the last entry once the list runs
    // out), which is how a test hands out a run whose calls disagree with
    // each other. calls.served records what it charged for each readback, so
    // a test can work out the truth about its own run rather than writing an
    // expected number down.
    function makeModel(parameterCount: number, costMs: any, firstCostMs?: number) {
      const calls = { predict: 0, readbacks: 0, served: [] };
      const schedule = Array.isArray(costMs) ? costMs : null;
      let warmed = false;
      let elapsed = 0;
      const model = {
        clock: () => elapsed,
        countParams: () => parameterCount,
        layers: [{ name: 'dense_Mock1', countParams: () => parameterCount }],
        predict: (_x: any) => {
          calls.predict++;
          const scheduled = schedule
            ? schedule[Math.min(calls.predict - 1, schedule.length - 1)]
            : costMs;
          return {
            dispose: () => {}, // the lesson's loop disposes what it reads
            data: () => {
              calls.readbacks++;
              const cost = !warmed && firstCostMs !== undefined ? firstCostMs : scheduled;
              warmed = true;
              calls.served.push(cost);
              return Promise.resolve().then(() => {
                elapsed += cost;
                return new Float32Array([0]);
              });
            },
          };
        },
      };
      return { model, calls };
    }

    // A real LayersModel, so the breakdown has to survive the thing the
    // profiler will meet in production. Two of these four layers own no
    // weights at all.
    function realModel() {
      const model = tf.sequential();
      model.add(tf.layers.dense({ units: 12, activation: 'relu', inputShape: [11] }));
      model.add(tf.layers.reshape({ targetShape: [3, 4] }));
      model.add(tf.layers.flatten());
      model.add(tf.layers.dense({ units: 5, activation: 'softmax' }));
      return model;
    }

    // A second real model of a different shape. Layer names are assigned from
    // a process-wide counter, so the suite reads the expected names off the
    // model rather than writing them down.
    function otherRealModel() {
      const model = tf.sequential();
      model.add(tf.layers.dense({ units: 6, activation: 'relu', inputShape: [4] }));
      model.add(tf.layers.dense({ units: 3, activation: 'softmax' }));
      return model;
    }

    // The harness starts every it() at once. The two tests below count live
    // tensors either side of a call, so they take turns through one queue;
    // the mock tests allocate no tensors and can overlap freely.
    let turn = Promise.resolve();
    const serial = (fn) => {
      const run = turn.then(fn);
      turn = run.catch(() => {});
      return run;
    };

    // One guard, so the first Run of the starter reports the contract it
    // has not met yet instead of a property read on null.
    async function profileOf(model: any, runs: number, inputFactory = createInput) {
      const profile = await profileModel(
        model,
        inputFactory,
        runs,
        model.clock || (() => performance.now()),
      );
      expect(
        profile,
        'Return the measured profile, including parameterCount, memorySizeMB, avgInferenceMs, layerBreakdown, and leakedTensors.',
      ).toBeDefined();
      return profile;
    }

    it('returns correct parameter count', async () => {
      const profile = await profileOf(makeModel(85_000_000, 6).model, 5);
      expect(profile.parameterCount).toBe(85_000_000);
    });

    it('reports memory in true MB for whatever count it was handed (params * 4 / 1e6, not MiB)', async () => {
      const big = await profileOf(makeModel(85_000_000, 4).model, 3);
      const small = await profileOf(makeModel(1_500_000, 4).model, 3);
      expect(
        big.memorySizeMB,
        'This figure has to come out of the parameter count you read off the model and the 4 bytes a float32 occupies. Dividing by 1024 * 1024 gives MiB, which misses by about 5 percent.',
      ).toBeCloseTo(340.0, 1);
      // 340 is the figure printed in the lesson, and a remembered 340
      // satisfies one model and no other. Two counts, one arithmetic.
      expect(
        small.memorySizeMB,
        'Calculate size from this model’s parameter count at 4 bytes per float32. Divide by 1e6 for MB. Dividing by 1024 * 1024 gives MiB, a different unit.',
      ).toBeCloseTo(6.0, 1);
    });

    it('times the awaited readback, not the enqueue', async () => {
      const profile = await profileOf(makeModel(100, 6).model, 5);
      expect(typeof profile.avgInferenceMs).toBe('number');
      expect(
        profile.avgInferenceMs,
        'Wait for output data before stopping the timer. predict() can return before the backend finishes the calculation.',
      ).toBeCloseTo(6, 8);
    });

    it('reports the slow model slower than the fast one', async () => {
      const fast = await profileOf(makeModel(100, 4).model, 5);
      const slow = await profileOf(makeModel(100, 24).model, 5);
      // A measured average tracks the model it was handed; the two mocks
      // are 6x apart, so anything reporting a remembered constant fails
      // here even when the constant is plausible.
      expect(fast.avgInferenceMs).toBeCloseTo(4, 8);
      expect(slow.avgInferenceMs).toBeCloseTo(24, 8);
    });

    it('keeps the compilation cost out of the average', async () => {
      // A compiling backend: the first readback costs 120 ms, the rest cost
      // 4. The average of the timed calls describes the warm model, so it
      // lands near 4. Time the first call too and it lands near 23, and so
      // does a warmup that was enqueued and never read back, because then
      // the 120 ms is still in front of timed call one.
      const profile = await profileOf(makeModel(100, 4, 120).model, 5);
      expect(
        profile.avgInferenceMs,
        'This runtime adds compilation cost to its first call. Complete an untimed warmup before measuring the requested runs.',
      ).toBeCloseTo(4, 8);
    });

    it('reports the arithmetic mean using the injected clock', async () => {
      const { model, calls } = makeModel(100, [120, 4, 4, 4, 4, 104]);
      const p = await profileOf(model, 5);
      expect(p.avgInferenceMs).toBeCloseTo(24, 8);
      expect(calls.served).toEqual([120, 4, 4, 4, 4, 104]);
      recordResult({
        kind: 'table',
        title: 'Warmup and measured calls',
        summary: 'The test supplies controlled clock values. These measure no device performance. Your reported average is ' + p.avgInferenceMs + ' ms after excluding warmup.',
        columns: ['Call', 'Supplied duration (ms)', 'Included in average'],
        rows: calls.served.map((ms, i) => [i === 0 ? 'Warmup' : 'Measured call ' + i, ms, i !== 0]),
      });
    });

    it('warms up once, then runs the timed loop exactly `runs` times', async () => {
      const { model, calls } = makeModel(100, 6);
      await profileModel(model, createInput, 7, model.clock);
      expect(
        calls.predict,
        'Run one untimed warmup, then the requested number of timed predictions. The total call count is runs + 1.',
      ).toBe(8);
      expect(
        calls.readbacks,
        'Read every output, including the warmup. In this check, the first readback includes compilation cost. Skipping warmup readback leaves that cost in the timed average.',
      ).toBe(8);
    });

    it('reports every layer, including layers with no parameters', () =>
      serial(async () => {
        const model = realModel();
        const before = tf.memory().numTensors;
        const profile = await profileOf(model, 2, () => tf.randomNormal([1, 11]));
        expect(
          tf.memory().numTensors - before,
          'The live tensor count grew. Dispose every input from createInput() and every prediction output after readback, including the warmup pair.',
        ).toBe(0);
        expect(
          profile.leakedTensors,
          'leakedTensors is that same subtraction, taken inside profileModel: numTensors after the last timed call minus numTensors before the warmup.',
        ).toBe(0);
        expect(
          profile.layerBreakdown.map((row: any) => row.name),
          'Include every model.layers entry in order, including the two layers with no parameters.',
        ).toEqual(model.layers.map((layer: any) => layer.name));
        expect(profile.layerBreakdown.map((row: any) => row.params)).toEqual([144, 0, 0, 65]);
        const summed = profile.layerBreakdown.reduce(
          (total: number, row: any) => total + row.params,
          0,
        );
        expect(
          summed,
          'The layer parameter counts should sum to this model\'s total parameter count.',
        ).toBe(profile.parameterCount);
        expect(
          profile.memorySizeMB,
          'This model holds 209 parameters, so its weights are 209 * 4 / 1e6 MB. Dividing by 1024 * 1024 gives MiB and misses by about 5 percent.',
        ).toBeCloseTo(0.000836, 6);
        recordResult({
          kind: 'table',
          title: 'Storage in the model you profiled',
          summary: profile.parameterCount + ' parameters, ' + profile.memorySizeMB + ' MB of float32 weights, and a net tensor-count change of ' + profile.leakedTensors + '. This does not measure peak application memory.',
          columns: ['Layer', 'Parameters'],
          rows: profile.layerBreakdown.slice(0, 40).map((row) => [row.name, row.params]),
        });
      }));

    it('reads the breakdown off whichever model it is handed', () =>
      serial(async () => {
        const model = otherRealModel();
        const before = tf.memory().numTensors;
        const profile = await profileOf(model, 2, () => tf.randomNormal([1, 4]));
        expect(
          tf.memory().numTensors - before,
          'Two tensors per run stay allocated until the loop releases them.',
        ).toBe(0);
        expect(
          profile.leakedTensors,
          'The report has to carry the count the loop measured, and it has to be zero.',
        ).toBe(0);
        expect(
          profile.layerBreakdown.map((row: any) => row.params),
          'This model is a different shape from the one above, so a breakdown carried over from that call, or from the lesson, is wrong here.',
        ).toEqual([30, 21]);
        expect(profile.parameterCount).toBe(51);
      }));
  });
  it('disposes handles when warmup readback rejects', async () => {
    let inputFreed = false, outputFreed = false;
    const m = { countParams: () => 0, layers: [], predict: () => ({
      data: async () => { throw new Error('fixture readback failed'); },
      dispose: () => { outputFreed = true; },
    }) };
    await expect(profileModel(m, () => ({ dispose: () => { inputFreed = true; } }), 1)).rejects.toThrow();
    expect(inputFreed).toBe(true); expect(outputFreed).toBe(true);
  });
