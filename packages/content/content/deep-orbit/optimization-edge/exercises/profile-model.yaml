title: "Profile a Model"
instructions: "Write a function that profiles a model: parameter count, memory size in MB, and average inference time over N runs. For memory, assume float32 (4 bytes per param) and divide by 1e6, per the lesson's units rule; 1024*1024 would give MiB. For timing, do one untimed warmup call first, then time exactly `runs` calls, awaiting `output.data()` inside the timed region so you measure the work rather than the enqueue."
