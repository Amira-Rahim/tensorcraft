    // 2. Calculate memory: params * 4 bytes, / 1e6 for MB (1024*1024 is MiB)
    // 3. Warm up once, untimed, and throw the result away
    // 4. Run inference `runs` times, awaiting output.data() inside the clock
    return null; // your code here
  }
solutionCode: |
  interface ModelProfile {
    parameterCount: number;
    memorySizeMB: number;
    avgInferenceMs: number;
  }

  async function profileModel(
    model: {
      countParams: () => number;
      predict: (x: any) => { data: () => Promise<unknown> };
    },
    createInput: () => any,
    runs: number
  ): Promise<ModelProfile> {
    const parameterCount = model.countParams();
    const memorySizeMB = (parameterCount * 4) / 1e6;

    // The warmup call pays the one-off compilation cost. It is not timed,
    // so that cost does not land in the average below.
    await model.predict(createInput()).data();

    const times: number[] = [];
    for (let i = 0; i < runs; i++) {
      const input = createInput();
      const start = performance.now();
      const output = model.predict(input);
      await output.data();
      times.push(Math.max(0, performance.now() - start));
    }

    const avgInferenceMs = times.reduce((a, b) => a + b, 0) / times.length;

    return { parameterCount, memorySizeMB, avgInferenceMs };
  }
testCode: |
  describe('profileModel', () => {
    const createInput = () => [1, 2, 3];

    // predict() hands back a handle immediately; the cost sits in the
    // readback, exactly where it sits on a GPU backend. costMs is a
    // parameter so the suite can hand out two models of different speed:
    // a returned constant can match one of them, never both.
    function makeModel(parameterCount: number, costMs: number) {
      const calls = { predict: 0 };
      const model = {
        countParams: () => parameterCount,
        predict: (_x: any) => {
          calls.predict++;
          return {
            data: () =>
              new Promise((resolve) =>
                setTimeout(() => resolve(new Float32Array([0])), costMs)
              ),
          };
        },
      };
      return { model, calls };
    }

    it('returns correct parameter count', async () => {
      const profile = await profileModel(makeModel(85_000_000, 6).model, createInput, 5);
      expect(profile.parameterCount).toBe(85_000_000);
    });

    it('calculates memory size in true MB (params * 4 / 1e6, not MiB)', async () => {
      const profile = await profileModel(makeModel(85_000_000, 6).model, createInput, 5);
      expect(profile.memorySizeMB).toBeCloseTo(340.0, 1);
    });

    it('times the awaited readback, not the enqueue', async () => {
      const profile = await profileModel(makeModel(100, 6).model, createInput, 5);
      expect(typeof profile.avgInferenceMs).toBe('number');
      expect(profile.avgInferenceMs).toBeGreaterThanOrEqual(3);
    });

    it('reports a slow model as slower than a fast one', async () => {
      const fast = await profileModel(makeModel(100, 4).model, createInput, 5);
      const slow = await profileModel(makeModel(100, 24).model, createInput, 5);
      // A measured average tracks the model it was handed; the two mocks
      // are 6x apart, so anything reporting a remembered constant fails
      // here even when the constant is plausible.
      expect(slow.avgInferenceMs).toBeGreaterThan(fast.avgInferenceMs * 2);
    });

    it('warms up once, then runs the timed loop exactly `runs` times', async () => {
      const { model, calls } = makeModel(100, 6);
      await profileModel(model, createInput, 7);
      expect(calls.predict).toBe(8);
    });
  });
