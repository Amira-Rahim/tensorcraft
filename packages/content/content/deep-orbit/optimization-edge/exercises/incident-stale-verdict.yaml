slug: incident-stale-verdict
lessonSlug: caching-strategies
title: "Incident: Cache Served a Verdict From the Old Model"
mlContent: systems
instructions: |
  PAGER: after this morning's model deploy, the dashboard showed a classification the new model disagrees with. It came from the cache. Build `auditCache(entries, currentVersion, now, ttlSeconds)`: an entry must be REFRESHED if its modelVersion differs from currentVersion (a deploy invalidates every cached verdict, no matter how fresh) OR its age (now - cachedAt, seconds) exceeds ttlSeconds. An age of exactly ttlSeconds has not exceeded it, so that entry is still served. Everything else passes this age/version policy, not a general correctness test. Assume valid timestamps no later than now and nonnegative finite TTL. The version identifies both weights and preprocessing; approximate-key collisions need separate checks. Return { serve, refresh } as arrays of keys, preserving input order.
hints:
  - level: nudge
    content: "The starter's two questions are not a sequence, they are an either: an entry is served only when it passes both, and failing one is enough on its own. Settle what counts as failing the version question before you write it, because the fix that morning could as easily have been a rollback as a new build."
  - level: guidance
    content: "Two decisions carry this one, and neither is about where the code goes. The first is what trust means here. The deploy swapped the weights under the cache, so a verdict written under any other build is a verdict the live model may not agree with, and how recently it was written changes nothing about that. Version tags are not an ordering: the fix that morning could as easily have been a rollback to an older build, and a rule that keeps whatever is not older than the version running now would then hold on to exactly the entries it should be sending back. The second is the boundary. Read the brief on it, because the suite checks that case on its own: an age that lands exactly on the allowance has not gone past the allowance, so it is still served, and the wrong side of that line sends back an entry you were told to keep."
  - level: solution
    content: |
      function auditCache(
        entries: { key: string; modelVersion: string; cachedAt: number }[],
        currentVersion: string,
        now: number,
        ttlSeconds: number,
      ): { serve: string[]; refresh: string[] } {
        const serve: string[] = [];
        const refresh: string[] = [];
        for (const e of entries) {
          const expired = now - e.cachedAt > ttlSeconds;
          const staleModel = e.modelVersion !== currentVersion;
          (staleModel || expired ? refresh : serve).push(e.key);
        }
        return { serve, refresh };
      }
