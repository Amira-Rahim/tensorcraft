slug: incident-stale-verdict
lessonSlug: caching-strategies
title: "Incident: Cache Served a Verdict From the Old Model"
mlContent: systems
instructions: |
  The bridge has shown a cached classification that disagrees with the new model. Help Demir check which entries the cache can still serve.

  Write `auditCache(entries, currentVersion, now, ttlSeconds)`. Refresh an entry if either:

  - Its `modelVersion` differs from `currentVersion`.
  - Its age, `now - cachedAt` in seconds, is greater than `ttlSeconds`.

  The cache can still serve an entry exactly at the age limit. A version change makes an entry stale even if the cache just saved it. The version covers both weights and preprocessing.

  Return `{ serve, refresh }` as arrays of keys, keeping input order. Assume valid timestamps no later than `now` and a finite, nonnegative TTL. Passing this check only establishes version and age. Rounded-key collisions need separate checks.
hints:
  - level: nudge
    content: "Refresh when either the version differs or the entry is too old. Preserve input order."
  - level: guidance
    content: "Check that version tags match: a rollback can make an older tag current. Use a strict greater-than test for TTL expiry. This contract permits equality."
  - level: solution
    content: |
      function auditCache(
        entries: { key: string; modelVersion: string; cachedAt: number }[],
        currentVersion: string,
        now: number,
        ttlSeconds: number,
      ): { serve: string[]; refresh: string[] } {
        const serve: string[] = [];
        const refresh: string[] = [];
        for (const e of entries) {
          const expired = now - e.cachedAt > ttlSeconds;
          const staleModel = e.modelVersion !== currentVersion;
          (staleModel || expired ? refresh : serve).push(e.key);
        }
        return { serve, refresh };
      }
