slug: browser-runtimes
title: "Browser ML Runtimes"
worldId: deep-orbit
order: 4
description: |
  Take your trained model out of the lab and into the browser. Nazari
  challenges Demir to deploy the DEEP SCAN classifier on the ship's
  browser-based dashboard, where a new reading arrives every second and
  the verdict has to be on screen before the next one lands. You'll set
  up TensorFlow.js, export a trained model, load and cache it, run
  real-time inference, and compare TF.js, ONNX Runtime Web, and
  Transformers.js the way a JavaScript engineer compares frameworks.
summary: "Run a trained model in the browser: TensorFlow.js setup, exporting, loading and caching a model, real-time inference (a prediction per reading), and how TensorFlow.js, ONNX Runtime Web, and Transformers.js compare."
lessonCount: 6
prerequisites:
  - foundations
  - neural-networks
  - training-loop
track: foundations
