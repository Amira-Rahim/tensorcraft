title: "Initialize TensorFlow.js"
instructions: "Initialize TensorFlow.js, wait for it to be ready, and return an object containing the active backend name and TF.js version."
starterCode: |
  import * as tf from '@tensorflow/tfjs';

  async function initTF(): Promise<{ backend: string; version: string }> {
    // 1. Wait for TF.js to be ready
    // 2. Get the backend name
