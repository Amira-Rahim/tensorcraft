    return null; // your code here
  }
solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  async function initTF(): Promise<{ backend: string; version: string }> {
    await tf.ready();
    return {
      backend: tf.getBackend(),
      version: tf.version.tfjs,
    };
  }
testCode: |
  describe('initTF', () => {
    it('returns an object', async () => {
      const result = await initTF();
      expect(result).toBeDefined();
    });
    it('reports the real runtime, not hardcoded strings', async () => {
      const result = await initTF();
      expect(result.backend).toBe(tf.getBackend());
      expect(result.version).toBe(tf.version.tfjs);
      expect(result.backend.length).toBeGreaterThan(0);
    });
  });
estimatedMinutes: 8
