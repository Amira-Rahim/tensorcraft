slug: tfjs-setup
lessonSlug: tensorflow-js-setup
title: "Initialize TensorFlow.js"
instructions: "Initialize TensorFlow.js, wait for it to be ready, and return an object containing the active backend name and TF.js version, shaped `{ backend, version }`. Read both values off the runtime rather than writing them in as literals: the backend depends on the device the page is open on, and the version on the package installed there."
starterCode: |
  import * as tf from '@tensorflow/tfjs';

  async function initTF(): Promise<{ backend: string; version: string }> {
    // The backend name and the version both live on the runtime. The backend
    // has nothing to say until the runtime has finished starting up, which a
    // warm page hides and a fresh tab does not.
    return null; // your code here
  }
solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  async function initTF(): Promise<{ backend: string; version: string }> {
    await tf.ready();
    return {
      backend: tf.getBackend(),
      version: tf.version.tfjs,
    };
  }
testCode: |
  describe('initTF', () => {
    it('returns an object', async () => {
      const result = await initTF();
      expect(result, 'initTF has to resolve to an object carrying a backend and a version. The starter returns null until you build it.').toBeDefined();
    });
    it('reads the backend name off the runtime, and only after ready() resolves', async () => {
      // The grader's runtime is already warm, so tf.getBackend() answers even
      // for code that never awaited tf.ready(). This test swaps in a cold
      // runtime instead: it behaves like a fresh tab and has no backend name
      // to give until ready() has resolved. Its ready() takes 25ms, which is
      // longer than any stray yield, so calling ready() and then awaiting
      // something else still reads the backend before there is one. Both
      // strings are randomized per run, so a memorized pair cannot pass either.
      const tag = 'probe-' + Math.floor(Math.random() * 1e9);
      const ver = '4.' + Math.floor(Math.random() * 1000) + '.0-probe';
      const warm = tf;
      let initialized = false;
      const cold = {
        ready: () => new Promise((resolve) => setTimeout(() => { initialized = true; resolve(); }, 25)),
        getBackend: () => (initialized ? tag : null),
        version: { tfjs: ver },
      };
      let result = null;
      try {
        tf = cold;
        result = await initTF();
      } finally {
        tf = warm;
      }
      expect(initialized, 'Nothing awaited the runtime, so it never picked a backend. On a warm page that still answers; on a fresh tab it does not.').toBe(true);
      expect(result, 'initTF resolved to nothing, so there is no backend name to check.').toBeDefined();
      expect(result.backend, 'This runtime reports a name generated for this run. A name that came from anywhere but the runtime cannot match it.').toBe(tag);
      expect(result.version, 'Same for the version string: read it, do not type it.').toBe(ver);
    });
  });
