slug: onnx-comparison
lessonSlug: onnx-runtime-web
title: "Benchmark TF.js Against ONNX Runtime"
instructions: "Build `compareRuntimes(model, modelPath, signal)`. `model` is the DEEP SCAN classifier already loaded in TF.js, `modelPath` is the same network exported to ONNX, and `signal` is three normalized numbers. Send that one signal through both runtimes as a [1, 3] float32 input, in the order you were handed it, and return `{ tfjsMs, onnxMs, outputsAgree, pick }`. Time the inference call on each side, not the loading. Pin the ONNX session to the WASM execution provider, the way the lesson's benchmark pins both sides: change the runtime and the backend at once and you have measured the backend. `outputsAgree` is true when the two values the runtimes handed back differ by at most 0.0001, and both numbers have to be the ones they returned rather than ones you worked out. `pick` is where to start looking, read off `model.countParams()`: 'wasm' under a million parameters, 'gpu' at a million or more, before any benchmark has been run. The harness clock is too coarse to grade a duration, so the tests read your two timings as numbers and grade the comparison and the pick."
starterCode: |
  import * as ort from 'onnxruntime-web';

  async function compareRuntimes(model, modelPath, signal) {
    // Two runtimes, one reading. Every difference you leave between the two
    // setups ends up inside the measurement. Report the numbers the runtimes
    // handed back rather than ones you worked out. The pick is a property of
    // the model, not of the two timings.
    return { tfjsMs: 0, onnxMs: 0, outputsAgree: false, pick: '' };
  }
solutionCode: |
  import * as ort from 'onnxruntime-web';

  async function compareRuntimes(model, modelPath, signal) {
    const input = tf.tensor2d([signal]);
    const tfStart = performance.now();
    const prediction = model.predict(input);
    const tfjsValue = (await prediction.data())[0];
    const tfjsMs = performance.now() - tfStart;
    prediction.dispose();
    input.dispose();

    const session = await ort.InferenceSession.create(modelPath, {
      executionProviders: ['wasm'],
    });
    const feed = new ort.Tensor('float32', new Float32Array(signal), [1, 3]);
    const onnxStart = performance.now();
    const results = await session.run({ input: feed });
    const onnxValue = results.output.data[0];
    const onnxMs = performance.now() - onnxStart;

    return {
      tfjsMs,
      onnxMs,
      outputsAgree: Math.abs(tfjsValue - onnxValue) <= 0.0001,
      pick: model.countParams() < 1000000 ? 'wasm' : 'gpu',
    };
  }
testCode: |
  describe('compareRuntimes', () => {
    // Not the triple the lesson's code block feeds, so a memorised input fails.
    const SIGNAL = [0.42, 0.66, 0.31];

    // DEEP SCAN as it ships: 3 -> 32 relu -> 16 relu -> 1 sigmoid, 673 weights.
    // The weights are planted rather than random for one reason: this network
    // then computes exactly what the harness's ONNX session computes, which is
    // what "the same model exported twice" means. Agreement is a fact about
    // the pair, not a coincidence.
    function deepScanModel() {
      const model = tf.sequential();
      model.add(tf.layers.dense({ units: 32, activation: 'relu', inputShape: [3] }));
      model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
      model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
      const first = new Float32Array(3 * 32);
      first[0] = 1; first[32] = 2; first[64] = 3;
      const second = new Float32Array(32 * 16);
      second[0] = 1;
      const third = new Float32Array(16);
      third[0] = 1;
      model.setWeights([
        tf.tensor2d(first, [3, 32]), tf.zeros([32]),
        tf.tensor2d(second, [32, 16]), tf.zeros([16]),
        tf.tensor2d(third, [16, 1]), tf.zeros([1]),
      ]);
      return model;
    }

    // Same input width, same single output, four orders of magnitude more
    // arithmetic per call. Zero weights: nothing here reads its output.
    function millionsModel() {
      const model = tf.sequential();
      model.add(tf.layers.dense({
        units: 2000000, activation: 'relu', inputShape: [3], kernelInitializer: 'zeros',
      }));
      model.add(tf.layers.dense({ units: 1, activation: 'sigmoid', kernelInitializer: 'zeros' }));
      return model;
    }

    // Every test comes through here, so the first Run of the untouched starter
    // names what is missing instead of reporting a property of undefined.
    async function report(model, path, signal) {
      const out = await compareRuntimes(model, path, signal);
      const why = 'compareRuntimes has to resolve to an object carrying tfjsMs, onnxMs, outputsAgree and pick.';
      expect(out, why).toBeDefined();
      expect(out, why).toHaveProperty('tfjsMs');
      expect(out, why).toHaveProperty('onnxMs');
      expect(out, why).toHaveProperty('outputsAgree');
      expect(out, why).toHaveProperty('pick');
      return out;
    }

    it('runs one signal through both runtimes and finds that they agree', async () => {
      const model = deepScanModel();
      try {
        const out = await report(model, '/models/deep-scan.onnx', SIGNAL);
        expect(Number.isFinite(out.tfjsMs), 'tfjsMs has to be a number of milliseconds you measured around the TF.js call.').toBe(true);
        expect(Number.isFinite(out.onnxMs), 'onnxMs has to be a number of milliseconds you measured around the ONNX call.').toBe(true);
        expect(out.outputsAgree, 'Both runtimes are executing the same network on the same three numbers, so the two outputs differ only by float32 rounding. A false here means one side never ran, or the two sides were fed different inputs.').toBe(true);
      } finally {
        model.dispose();
      }
    });

    it('reads the backend off the model in front of it, not off the lesson', async () => {
      const small = deepScanModel();
      const large = millionsModel();
      try {
        const tiny = await report(small, '/models/deep-scan.onnx', SIGNAL);
        const huge = await report(large, '/models/deep-scan.onnx', SIGNAL);
        expect(tiny.pick, 'One prediction from this classifier is a few hundred multiply-adds. Getting the input onto the GPU and the answer back off it costs more than that.').toBe('wasm');
        expect(huge.pick, 'This model does four orders of magnitude more arithmetic per call for the same fixed transfer cost, so the rule in the instructions lands on the other side. A pick that does not move between these two models was written down rather than worked out.').toBe('gpu');
      } finally {
        small.dispose();
        large.dispose();
      }
    });

    it('compares the two numbers the runtimes returned, and feeds both the same input', async () => {
      // Three things are graded here, and all three are about provenance.
      //
      // The feed: this wrapper records what run() received, which rejects a
      // solution that opens a session and then scores the input itself.
      //
      // The backend: a benchmark that lets the two sides run on different
      // backends measures the backends. The session options are recorded too.
      //
      // The answer: the wrapper REPLACES the session's output with a number
      // drawn this run and kept well away from what the TF.js side returns.
      // The two runtimes therefore disagree on this call, and a solution that
      // recomputes the score instead of reading it off the result reports an
      // agreement that did not happen.
      const sentinel = '/models/spy-check.onnx';
      const model = deepScanModel();
      const probe = model.predict(tf.tensor2d([SIGNAL]));
      const tfjsValue = (await probe.data())[0];
      probe.dispose();
      // Math.fround so the value survives the Float32Array round-trip exactly.
      const planted = Math.fround(tfjsValue > 0.5 ? tfjsValue - 0.3 : tfjsValue + 0.3);
      const orig = ort.InferenceSession.create;
      let sentinelCalls = 0;
      let options = null;
      let feeds = null;
      // Sentinel path: only calls made with THIS path are wrapped, so the
      // other tests' sessions (they run concurrently) are untouched.
      ort.InferenceSession.create = async function (...args) {
        const session = await orig.apply(this, args);
        if (args[0] !== sentinel) return session;
        sentinelCalls++;
        options = args[1];
        const realRun = session.run.bind(session);
        session.run = async function (f) {
          feeds = f;
          await realRun(f);
          return { output: { type: 'float32', dims: [1, 1], data: new Float32Array([planted]) } };
        };
        return session;
      };
      let out;
      try {
        out = await report(model, sentinel, SIGNAL);
      } finally {
        ort.InferenceSession.create = orig;
        model.dispose();
      }
      expect(sentinelCalls, 'compareRuntimes never opened a session for the path it was handed.').toBeGreaterThanOrEqual(1);
      expect(options && options.executionProviders, 'The comparison only says something about the two runtimes if both are on the same backend. Create the session with the execution provider the instructions name.').toEqual(['wasm']);
      expect(feeds, 'The session was created but never run, so the ONNX side produced nothing to compare.').not.toBe(null);
      const fed = feeds[Object.keys(feeds)[0]];
      const sameInput = 'Both runtimes have to see the same input, as one [1, 3] float32 batch carrying the three numbers you were given, in order.';
      expect(fed.type, sameInput).toBe('float32');
      expect(fed.dims[0], sameInput).toBe(1);
      expect(fed.dims[1], sameInput).toBe(3);
      expect(fed.data.length, sameInput).toBe(3);
      expect(fed.data[0], sameInput).toBeCloseTo(SIGNAL[0], 5);
      expect(fed.data[1], sameInput).toBeCloseTo(SIGNAL[1], 5);
      expect(fed.data[2], sameInput).toBeCloseTo(SIGNAL[2], 5);
      expect(out.outputsAgree, 'This session was rigged to answer with a number drawn during this run, far from what TF.js returns, so the two runtimes did NOT agree on this call. Reporting that they did means the comparison used a number your own code produced rather than the one run() resolved to.').toBe(false);
    });
  });
