slug: onnx-comparison
lessonSlug: onnx-runtime-web
title: "Runtime outputs and timing"
instructions: |
  Build `compareRuntimes(model, modelPath, signal)`. Send the same three numbers through both runtimes as a [1, 3] float32 input. Return `{ tfjsMs, onnxMs, outputsAgree }`.

  The exercise supplies a loaded TensorFlow.js model. Create the ONNX session with `executionProviders: ['wasm']`. Keep loading outside the timers. For each prediction, read `performance.now()` before it starts and after awaiting its output.

  Set `outputsAgree` to true when the two returned scores differ by at most 0.0001. Compare the scores that the two runtimes return.

  Dispose your TensorFlow.js input and prediction. Release the ONNX session after use, even if a prediction fails. Keep the supplied model alive. It belongs to the caller.

  These tests simulate the ONNX side and clock. Use the real lab for repeated speed measurements on a supported device.

starterCode: |
  import * as ort from 'onnxruntime-web';

  async function compareRuntimes(model, modelPath, signal) {
    // Give both runtimes the same reading.
    // Time completed predictions, then compare the outputs they returned.
    return { tfjsMs: 0, onnxMs: 0, outputsAgree: false };
  }
solutionCode: |
  import * as ort from 'onnxruntime-web';

  async function compareRuntimes(model, modelPath, signal) {
    const input = tf.tensor2d([signal]);
    let prediction;
    let tfjsValue;
    let tfjsMs;
    try {
      const start = performance.now();
      prediction = model.predict(input);
      tfjsValue = (await prediction.data())[0];
      tfjsMs = performance.now() - start;
    } finally {
      prediction?.dispose();
      input.dispose();
    }
    const session = await ort.InferenceSession.create(modelPath, { executionProviders: ['wasm'] });
    try {
      const feed = new ort.Tensor('float32', new Float32Array(signal), [1, 3]);
      const start = performance.now();
      const results = await session.run({ input: feed });
      const onnxValue = results.output.data[0];
      const onnxMs = performance.now() - start;
      return { tfjsMs, onnxMs, outputsAgree: Math.abs(tfjsValue - onnxValue) <= 0.0001 };
    } finally {
      await session.release();
    }
  }
testCode: |
  describe('compareRuntimes', () => {
    // Not the triple the lesson's code block feeds, so a memorised input fails.
    const SIGNAL = [0.42, 0.66, 0.31];

    // DEEP SCAN as it ships: 3 -> 32 relu -> 16 relu -> 1 sigmoid, 673 weights.
    // The weights are planted rather than random for one reason: this network
    // then computes exactly what the harness's ONNX session computes, which is
    // what "the same model exported twice" means. Agreement is a fact about
    // the pair, not a coincidence.
    function deepScanModel() {
      const model = tf.sequential();
      model.add(tf.layers.dense({ units: 32, activation: 'relu', inputShape: [3] }));
      model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
      model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
      const first = new Float32Array(3 * 32);
      first[0] = 1; first[32] = 2; first[64] = 3;
      const second = new Float32Array(32 * 16);
      second[0] = 1;
      const third = new Float32Array(16);
      third[0] = 1;
      const weights = [
        tf.tensor2d(first, [3, 32]), tf.zeros([32]),
        tf.tensor2d(second, [32, 16]), tf.zeros([16]),
        tf.tensor2d(third, [16, 1]), tf.zeros([1]),
      ];
      model.setWeights(weights);
      weights.forEach(w => w.dispose());
      return model;
    }

    // Every test comes through here, so the first Run of the untouched starter
    // names what is missing instead of reporting a property of undefined.
    async function report(model, path, signal) {
      const out = await compareRuntimes(model, path, signal);
      const why = 'compareRuntimes has to resolve to an object carrying tfjsMs, onnxMs and outputsAgree.';
      expect(out, why).toBeDefined();
      expect(out, why).toHaveProperty('tfjsMs');
      expect(out, why).toHaveProperty('onnxMs');
      expect(out, why).toHaveProperty('outputsAgree');
      return out;
    }

    it('runs one signal through both runtimes and finds that they agree', async () => {
      const model = deepScanModel();
      // The harness clock is too coarse to say how long either call took, so
      // for this one test it is replaced by something that is not a clock at
      // all: every reading is the one before it plus a fixed amount drawn
      // this run. A gap measured across a call is then a whole number of
      // those steps, and a number that came from anywhere else is not.
      const realNow = performance.now;
      const step = 7 + Math.floor(Math.random() * 90);
      let reading = step * 1000 + 1;
      performance.now = function () { reading += step; return reading; };
      let out;
      try {
        out = await report(model, '/models/deep-scan.onnx', SIGNAL);
      } finally {
        performance.now = realNow;
        model.dispose();
      }
      const rule = ' has to be the gap between two readings of performance.now() taken around that call. The starter reports a placeholder instead, and a placeholder is not a measurement.';
      expect(Number.isFinite(out.tfjsMs) && out.tfjsMs > 0 && out.tfjsMs % step === 0, 'tfjsMs' + rule).toBe(true);
      expect(Number.isFinite(out.onnxMs) && out.onnxMs > 0 && out.onnxMs % step === 0, 'onnxMs' + rule).toBe(true);
      expect(out.outputsAgree, 'Both runtimes are executing the same network on the same three numbers, so the two outputs differ only by float32 rounding. A false here means one side never ran, or your code sent different inputs to the two sides.').toBe(true);
      recordResult({
        kind: 'table', title: 'Your runtime comparison',
        summary: 'The test simulates the ONNX session and clock. These times describe that simulation. They measure no real runtime. Use the real lab for performance comparisons.',
        columns: ['Outputs agree', 'TFJS simulated interval', 'ONNX simulated interval'],
        rows: [[out.outputsAgree, out.tfjsMs, out.onnxMs]],
      });
    });

    it('compares the two numbers the runtimes returned, and feeds both the same input', async () => {
      // Three things are graded here, and all three are about provenance.
      //
      // The feed: this wrapper records what run() received, which rejects a
      // solution that opens a session and then scores the input itself.
      //
      // The backend: a benchmark that lets the two sides run on different
      // backends measures the backends. The session options are recorded too.
      //
      // The answer: the wrapper REPLACES the session's output with a number
      // drawn this run and kept well away from what the TF.js side returns.
      // The two runtimes therefore disagree on this call, and a solution that
      // recomputes the score instead of reading it off the result reports an
      // agreement that did not happen.
      const sentinel = '/models/spy-check.onnx';
      const model = deepScanModel();
      const probeInput = tf.tensor2d([SIGNAL]);
      const probe = model.predict(probeInput);
      const tfjsValue = (await probe.data())[0];
      probe.dispose();
      probeInput.dispose();
      // Math.fround so the value survives the Float32Array round-trip exactly.
      const planted = Math.fround(tfjsValue > 0.5 ? tfjsValue - 0.3 : tfjsValue + 0.3);
      const orig = ort.InferenceSession.create;
      let sentinelCalls = 0;
      let options = null;
      let feeds = null;
      let released = false;
      let failRun = false;
      // Sentinel path: only calls made with THIS path are wrapped, so the
      // other tests' sessions (they run concurrently) are untouched.
      ort.InferenceSession.create = async function (...args) {
        const session = await orig.apply(this, args);
        if (args[0] !== sentinel) return session;
        sentinelCalls++;
        options = args[1];
        const realRelease = session.release.bind(session);
        session.release = async () => { released = true; await realRelease(); };
        const realRun = session.run.bind(session);
        session.run = async function (f) {
          feeds = f;
          if (failRun) throw new Error('inference failure fixture');
          await realRun(f);
          return { output: { type: 'float32', dims: [1, 1], data: new Float32Array([planted]) } };
        };
        return session;
      };
      let out;
      try {
        out = await report(model, sentinel, SIGNAL);
        expect(released, 'Release the session after reading its result.').toBe(true);
        // Keep both branches under one wrapper: the exercise worker can run
        // tests concurrently, so separate global overrides would race.
        released = false;
        failRun = true;
        let failed = false;
        try { await report(model, sentinel, SIGNAL); }
        catch (error) { failed = error.message === 'inference failure fixture'; }
        expect(failed, 'Propagate the inference failure so the caller can handle it.').toBe(true);
        expect(released, 'Release the session when run() rejects too.').toBe(true);
      } finally {
        ort.InferenceSession.create = orig;
        model.dispose();
      }
      expect(released, 'Release the session after reading its result.').toBe(true);
      expect(sentinelCalls, 'compareRuntimes never opened a session for the supplied path.').toBeGreaterThanOrEqual(1);
      expect(options && options.executionProviders, 'This exercise fixes ONNX to WASM. Create the session with that provider. Real comparisons must also report the TFJS backend and distinguish runtime effects from backend effects.').toEqual(['wasm']);
      expect(feeds, 'Your code created the session but never ran it, so the ONNX side produced nothing to compare.').not.toBe(null);
      const fed = feeds[Object.keys(feeds)[0]];
      const sameInput = 'Both runtimes have to see the same input, as one [1, 3] float32 batch carrying the three supplied numbers in order.';
      expect(fed.type, sameInput).toBe('float32');
      expect(fed.dims[0], sameInput).toBe(1);
      expect(fed.dims[1], sameInput).toBe(3);
      expect(fed.data.length, sameInput).toBe(3);
      expect(fed.data[0], sameInput).toBeCloseTo(SIGNAL[0], 5);
      expect(fed.data[1], sameInput).toBeCloseTo(SIGNAL[1], 5);
      expect(fed.data[2], sameInput).toBeCloseTo(SIGNAL[2], 5);
      expect(out.outputsAgree, 'This test changed the ONNX output so it differs from TensorFlow.js. Compare the value returned by run(). This test deliberately changes that value.').toBe(false);
    });
  });
