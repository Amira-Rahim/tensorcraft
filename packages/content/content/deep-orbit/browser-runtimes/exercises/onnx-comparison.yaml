title: "Run an ONNX Model"
instructions: "Load an ONNX model using onnxruntime-web, run inference on a signal input [0.5, 0.3, 0.7], and return the prediction value from the output tensor."
starterCode: |
  import * as ort from 'onnxruntime-web';

  async function runONNX(modelPath: string): Promise<number> {
    // 1. Create an InferenceSession from the model path
    // 2. Create an input tensor with values [0.5, 0.3, 0.7], shape [1, 3]
    // 3. Run inference
    // 4. Return the first value from the output
    return null; // your code here
  }
solutionCode: |
  import * as ort from 'onnxruntime-web';

  async function runONNX(modelPath: string): Promise<number> {
    const session = await ort.InferenceSession.create(modelPath);
    const inputData = new Float32Array([0.5, 0.3, 0.7]);
    const inputTensor = new ort.Tensor('float32', inputData, [1, 3]);
    const results = await session.run({ input: inputTensor });
    const output = results.output;
    return output.data[0] as number;
  }
testCode: |
  describe('runONNX', () => {
    it('returns the session output for input [0.5, 0.3, 0.7], not an invented number', async () => {
      const result = await runONNX('/models/deep-scan.onnx');
      const session = await ort.InferenceSession.create('/models/deep-scan.onnx');
      const out = await session.run({
        input: new ort.Tensor('float32', new Float32Array([0.5, 0.3, 0.7]), [1, 3]),
      });
      expect(result).toBeCloseTo(out.output.data[0], 5);
      expect(result).toBeGreaterThanOrEqual(0);
      expect(result).toBeLessThanOrEqual(1);
    });
    it('runs the [1, 3] float32 input through the session it created', async () => {
      // The session output is a function of the feed, so the value test above
      // already rejects a memorised `return 0.5`. What it cannot see is a
      // solution that computes a number without ever running the session, so
      // this test wraps the session's own run() and inspects the feeds.
      // Sentinel path: only calls made with THIS path count, so the sibling
      // test's own create call (tests run concurrently) cannot satisfy the
      // spy.
      const sentinel = '/models/spy-check.onnx';
      const orig = ort.InferenceSession.create;
      let sentinelCalls = 0;
      let feeds = null;
      ort.InferenceSession.create = async function (...args) {
        const session = await orig.apply(this, args);
        if (args[0] !== sentinel) return session;
        sentinelCalls++;
        const realRun = session.run.bind(session);
        session.run = function (f) {
          feeds = f;
          return realRun(f);
        };
        return session;
      };
      try {
        await runONNX(sentinel);
      } finally {
        ort.InferenceSession.create = orig;
      }
      expect(sentinelCalls).toBeGreaterThanOrEqual(1);
      expect(feeds).not.toBe(null);
      const fed = feeds[Object.keys(feeds)[0]];
      expect(fed.type).toBe('float32');
      expect(fed.dims[0]).toBe(1);
      expect(fed.dims[1]).toBe(3);
      expect(fed.data.length).toBe(3);
      expect(fed.data[0]).toBeCloseTo(0.5, 5);
      expect(fed.data[1]).toBeCloseTo(0.3, 5);
      expect(fed.data[2]).toBeCloseTo(0.7, 5);
    });
  });
