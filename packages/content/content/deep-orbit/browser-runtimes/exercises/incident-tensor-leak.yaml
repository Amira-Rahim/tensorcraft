slug: incident-tensor-leak
lessonSlug: inference-pipeline
title: "Incident: numTensors Climbing at 03:10"
mlContent: systems
instructions: |
  PAGER: the dashboard's tensor count has risen since the 01:00 deploy. Estimate capacity while the crew investigates the cause. Growth may come from initialization, caching or a leak; these snapshots do not identify which.

  Build `estimateTensorHeadroom(snapshots, budgetTensors)`. Snapshots contain `{ t, numTensors }`, with time in hours. Use the first and last readings to return `{ growing, ratePerHour, hoursToBudget }`. The rate is their count difference divided by elapsed hours. `growing` is true for a positive rate. Project the hours from the last reading to the budget if that rate continues; use Infinity for a flat or falling count.

  Inputs contain at least two readings at distinct, ascending times, nonnegative counts and a budget above the latest count. This drill uses endpoint growth as a simple estimate. It does not prove a steady trend or diagnose a leak.
hints:
  - level: nudge
    content: "A rising tensor count is not yet a deadline. The pager already named the two readings that carry the trend, so what is left to decide is what the hours between them turn that growth into, and what to report when the count is not climbing at all."
  - level: guidance
    content: "Divide the change in count by elapsed hours. For positive growth, divide the capacity remaining after the latest snapshot by that rate. For a flat or falling count, this projection gives no time limit. The sign describes growth; the cause still needs investigation."
  - level: solution
    content: |
      function estimateTensorHeadroom(
        snapshots: { t: number; numTensors: number }[],
        budgetTensors: number,
      ): { growing: boolean; ratePerHour: number; hoursToBudget: number } {
        const first = snapshots[0];
        const last = snapshots[snapshots.length - 1];
        const ratePerHour = (last.numTensors - first.numTensors) / (last.t - first.t);
        const growing = ratePerHour > 0;
        const hoursToBudget = growing
          ? (budgetTensors - last.numTensors) / ratePerHour
          : Infinity;
        return { growing, ratePerHour, hoursToBudget };
      }
