solutionCode: |
  function estimateTensorHeadroom(
    snapshots: { t: number; numTensors: number }[],
    budgetTensors: number,
  ): { growing: boolean; ratePerHour: number; hoursToBudget: number } {
    const first = snapshots[0];
    const last = snapshots[snapshots.length - 1];
    const ratePerHour = (last.numTensors - first.numTensors) / (last.t - first.t);
    const growing = ratePerHour > 0;
    const hoursToBudget = growing
      ? (budgetTensors - last.numTensors) / ratePerHour
      : Infinity;
    return { growing, ratePerHour, hoursToBudget };
  }
testCode: |
  describe('estimateTensorHeadroom', () => {
    // The starter returns null, and reading .growing off null reports a
    // property name instead of the task. Every test comes through here, so
    // the first Run says what is missing.
    function diagnose(snapshots, budgetTensors) {
      const r = estimateTensorHeadroom(snapshots, budgetTensors);
      expect(r, 'Return an object with growing, ratePerHour and hoursToBudget, using the first and last snapshots.').toBeDefined();
      return r;
    }

    it('reports positive endpoint growth without diagnosing its cause', () => {
      const r = diagnose(
        [{ t: 0, numTensors: 47 }, { t: 2, numTensors: 287 }, { t: 4, numTensors: 527 }],
        10000,
      );
      expect(r.growing).toBe(true);
      expect(r.ratePerHour, 'Divide the increase in tensor count by the hours between the first and last readings.').toBeCloseTo(120, 5);
    });
    it('computes hours until the budget is hit', () => {
      const r = diagnose(
        [{ t: 0, numTensors: 400 }, { t: 1, numTensors: 520 }],
        10000,
      );
      expect(r.hoursToBudget, 'Subtract the latest tensor count from the budget to find the remaining capacity.').toBeCloseTo(79, 1);
      recordResult({
        kind: 'table', title: 'Your capacity estimate for the watch',
        summary: 'Projection from the supplied 400-to-520 tensor snapshot case. It assumes the endpoint growth rate continues and does not identify a leak.',
        columns: ['Growing', 'Tensors per hour', 'Hours to budget'],
        rows: [[r.growing, r.ratePerHour, r.hoursToBudget]],
      });
    });
    it('a flat count has no projected growth deadline', () => {
      const r = diagnose(
        [{ t: 0, numTensors: 47 }, { t: 6, numTensors: 47 }],
        10000,
      );
      expect(r.growing).toBe(false);
      expect(r.hoursToBudget, 'At this nonpositive rate there is no projected growth deadline. Future behavior can change.').toBe(Infinity);
    });
    it('ignores noisy middle readings (endpoints define the trend)', () => {
      const r = diagnose(
        [{ t: 0, numTensors: 100 }, { t: 1, numTensors: 900 }, { t: 5, numTensors: 200 }],
        1000,
      );
      expect(r.ratePerHour, 'This task defines the estimate from the endpoints. The middle spike needs its own investigation. It does not replace the stated interval.').toBeCloseTo(20, 5);
    });
    it('a falling count has negative endpoint growth', () => {
      const r = diagnose(
        [{ t: 0, numTensors: 500 }, { t: 2, numTensors: 300 }],
        1000,
      );
      expect(r.growing, 'The final count is lower than the first. These snapshots report net change. They cannot show each allocation and disposal between them.').toBe(false);
    });
  });
