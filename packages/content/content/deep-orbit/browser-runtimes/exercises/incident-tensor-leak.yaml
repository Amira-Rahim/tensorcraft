slug: incident-tensor-leak
lessonSlug: inference-pipeline
title: "Incident: numTensors Climbing at 03:10"
mlContent: systems
instructions: |
  The dashboard's tensor count has risen since the 01:00 deploy. Help the crew estimate how much capacity remains while they investigate. Startup, caching and leaks can all raise the count. These readings do not tell you which caused it.

  Build `estimateTensorHeadroom(snapshots, budgetTensors)`. Each snapshot contains `{ t, numTensors }`, where `t` is time in hours. Use the first and last snapshots to return:

  - `ratePerHour`: the change in tensor count divided by elapsed hours.
  - `growing`: true when that rate is positive.
  - `hoursToBudget`: the remaining capacity after the last snapshot divided by the rate, if it is positive. Return Infinity for a flat or falling count.

  Assume the measured rate continues. Inputs always have at least two snapshots with increasing, distinct times and nonnegative counts. The budget is above the latest count. This estimate does not prove a steady trend or identify a leak.

hints:
  - level: nudge
    content: "Start with the first and last counts. How much did the count change, and how many hours passed? Decide what to return if the count stays flat or falls."
  - level: guidance
    content: "Divide the change in count by elapsed hours. For positive growth, divide the capacity remaining after the latest snapshot by that rate. For a flat or falling count, this projection gives no time limit. The sign describes growth. The cause still needs investigation."
  - level: solution
    content: |
      function estimateTensorHeadroom(
        snapshots: { t: number; numTensors: number }[],
        budgetTensors: number,
      ): { growing: boolean; ratePerHour: number; hoursToBudget: number } {
        const first = snapshots[0];
        const last = snapshots[snapshots.length - 1];
        const ratePerHour = (last.numTensors - first.numTensors) / (last.t - first.t);
        const growing = ratePerHour > 0;
        const hoursToBudget = growing
          ? (budgetTensors - last.numTensors) / ratePerHour
          : Infinity;
        return { growing, ratePerHour, hoursToBudget };
      }
