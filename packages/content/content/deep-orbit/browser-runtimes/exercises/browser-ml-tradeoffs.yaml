slug: browser-ml-tradeoffs
lessonSlug: why-the-browser
title: "Evaluate Browser ML Tradeoffs"
instructions: |
  Implement `recommendDeployment(useCase)`. Return 'client', 'server' or 'reconsider'. The input contains `latencyBudgetMs`, `dataSensitive`, `modelSizeMB` and `needsOffline`.

  Check these rules in order:

  1. `dataSensitive` means all input must stay on the device. `needsOffline` means predictions must work without a connection. Either one requires local predictions.
  2. The model must fit a 50 MB download budget. If it exceeds 50 MB and local predictions are required, return 'reconsider'. A server would break the requirement. Consider a smaller model or a different download plan instead.
  3. If the model exceeds 50 MB without a local requirement, return 'server'.
  4. For models at or below 50 MB, return 'client' if either local requirement applies or `latencyBudgetMs` is below 50. Otherwise, return 'server'.

  These are the exercise's decision rules. For a real app, measure network and device speeds. Neither location guarantees the requested response time.

starterCode: |
  interface UseCase {
    latencyBudgetMs: number;
    dataSensitive: boolean;
    modelSizeMB: number;
    needsOffline: boolean;
  }

  type Recommendation = 'client' | 'server' | 'reconsider';

  function recommendDeployment(useCase: UseCase): Recommendation {
    // Check for conflicting hard requirements before applying preferences.
    return null; // your code here
  }
solutionCode: |
  function recommendDeployment(useCase) {
    const mustStayLocal = useCase.dataSensitive || useCase.needsOffline;
    if (useCase.modelSizeMB > 50) return mustStayLocal ? 'reconsider' : 'server';
    return mustStayLocal || useCase.latencyBudgetMs < 50 ? 'client' : 'server';
  }
testCode: |
  describe('deployment requirements',()=>{
    const useCase=(patch)=>({latencyBudgetMs:500,dataSensitive:false,modelSizeMB:10,needsOffline:false,...patch});
    it('keeps privacy and offline requirements when the model exceeds the budget', () => {
      for (const patch of [
        { dataSensitive: true },
        { needsOffline: true },
        { dataSensitive: true, needsOffline: true },
      ])
        expect(
          recommendDeployment(useCase({ modelSizeMB: 51, ...patch })),
          'A server violates this requirement. Reconsider the model or download plan.',
        ).toBe('reconsider');
    });
    it('sends a large model without hard local requirements to the server', () => {
      for (const latencyBudgetMs of [20, 500])
        expect(recommendDeployment(useCase({ modelSizeMB: 100, latencyBudgetMs }))).toBe('server');
    });
    it('prefers the client within budget for each local advantage', () => {
      for (const patch of [{ latencyBudgetMs: 49 }, { dataSensitive: true }, { needsOffline: true }])
        expect(recommendDeployment(useCase({ modelSizeMB: 50, ...patch }))).toBe('client');
    });
    it('uses the stated inclusive size budget and strict latency preference', () => {
      const below = useCase({ modelSizeMB: 50, latencyBudgetMs: 49 });
      const at = useCase({ modelSizeMB: 50, latencyBudgetMs: 50 });
      const belowDecision = recommendDeployment(below);
      const atDecision = recommendDeployment(at);
      expect(belowDecision).toBe('client');
      expect(atDecision).toBe('server');
      recordResult({
        kind: 'table', title: 'Your deployment recommendations',
        summary: 'Two boundary cases from the supplied decision policy. These are requirements checks, not measured device performance.',
        columns: ['Model MB', 'Latency preference ms', 'Recommendation'],
        rows: [[below.modelSizeMB, below.latencyBudgetMs, belowDecision], [at.modelSizeMB, at.latencyBudgetMs, atDecision]],
      });
    });
    it('has no client preference without any of those reasons',()=>{for(const modelSizeMB of [5,10,30,40])expect(recommendDeployment(useCase({modelSizeMB}))).toBe('server');});
  });
estimatedMinutes: 10
difficulty: beginner
mlContent: arithmetic
skillAxis: deployment

hints:
  - level: nudge
    content: |
      Which inputs are requirements, and which are performance preferences? Check whether the size budget conflicts with a requirement first.
  - level: guidance
    content: |
      A server cannot provide disconnected inference or keep all input on the device. Report the conflicting requirements explicitly. Once those cases are handled, apply the exercise's size and latency preferences.
