title: "The inference pipeline"
instructions: |
  Write `classify(model, signal)` for one raw reading with amplitude, frequency and phase.

  1. Use RANGES to scale each feature to [0, 1]. Send one row to the model in amplitude, frequency, phase order, with shape [1, 3].
  2. Run the prediction and read its result inside `tf.tidy()`. The tensor count must return to its starting value before `classify` returns.
  3. Call the model's output p. Return class 'anomaly' when p is above 0.5, or 'noise' otherwise.
  4. Return a confidence field containing p for anomaly or 1-p for noise. For example, p = 0.12 means noise with confidence 0.88.

  Confidence is the chosen class's score. It is not a measured probability that the classification is correct.

