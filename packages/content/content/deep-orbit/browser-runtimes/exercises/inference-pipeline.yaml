    amplitude: { min: 0, max: 2048 },
    frequency: { min: 0, max: 63 },
    phase: { min: -Math.PI, max: Math.PI },
  };

  interface Signal { amplitude: number; frequency: number; phase: number; }
  interface Result { class: 'anomaly' | 'noise'; confidence: number; }

  function classify(model: tf.LayersModel, signal: Signal): Result {
    // The network learned these three features on a common scale and in the
    // order RANGES declares them. A wrong scale or a swapped order throws
    // nothing, it just makes the answers wrong. Nothing you allocate here may
    // still be alive when this returns.
    return null; // your code here
  }
solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  const RANGES = {
    amplitude: { min: 0, max: 2048 },
    frequency: { min: 0, max: 63 },
    phase: { min: -Math.PI, max: Math.PI },
  };

  interface Signal { amplitude: number; frequency: number; phase: number; }
  interface Result { class: 'anomaly' | 'noise'; confidence: number; }

  function classify(model: tf.LayersModel, signal: Signal): Result {
    return tf.tidy(() => {
      const normalized = [
        (signal.amplitude - RANGES.amplitude.min) / (RANGES.amplitude.max - RANGES.amplitude.min),
        (signal.frequency - RANGES.frequency.min) / (RANGES.frequency.max - RANGES.frequency.min),
        (signal.phase - RANGES.phase.min) / (RANGES.phase.max - RANGES.phase.min),
      ];
      const input = tf.tensor2d([normalized]);
      const output = model.predict(input) as tf.Tensor;
      const p = output.dataSync()[0];
      return {
        class: p > 0.5 ? 'anomaly' as const : 'noise' as const,
        confidence: p > 0.5 ? p : 1 - p,
      };
    });
  }
testCode: |
  describe('classify', () => {
    let probe;
    beforeAll(() => {
      // Identity probe: output = normalized amplitude, so the tests can
      // verify normalization and predict actually happened.
      probe = tf.sequential();
      probe.add(tf.layers.dense({ inputShape: [3], units: 1, useBias: false }));
      probe.layers[0].setWeights([tf.tensor2d([[1], [0], [0]])]);
    });

    // The starter returns null, and reading .class off null reports a
    // property name instead of the task. Every test comes through here, so
    // the first Run says what is missing.
    function verdict(model, signal) {
      const r = classify(model, signal);
      expect(r, 'classify has to return an object with a class and a confidence. The starter returns null until you build that object inside the tidy callback.').toBeDefined();
      return r;
    }

    it('a p above 0.5 is an anomaly, and the confidence reported is p', () => {
      const r = verdict(probe, { amplitude: 1536, frequency: 0, phase: -Math.PI });
      expect(r.class, 'The model reports the probability of an anomaly, and this probe was handed 1536 of 2048 counts, so p is 0.75. Above 0.5 the verdict is anomaly.').toBe('anomaly');
      expect(r.confidence, 'Above the bar, the model\'s own number IS the confidence in the verdict.').toBeCloseTo(0.75, 4);
    });
    it('a p below 0.5 is noise, and the confidence reported is 1 - p', () => {
      const r = verdict(probe, { amplitude: 512, frequency: 0, phase: -Math.PI });
      expect(r.class, 'This probe was handed 512 of 2048 counts, so p is 0.25. That is not above 0.5, so the verdict is noise.').toBe('noise');
      expect(r.confidence, 'The model reports the probability of an anomaly. Below the bar the verdict is noise, so the confidence in THAT verdict is the remainder.').toBeCloseTo(0.75, 4);
    });
    it('a p of exactly 0.5 is not above 0.5, so the verdict is noise and the confidence is 0.5 either way', () => {
      const phaseProbe = tf.sequential();
      phaseProbe.add(tf.layers.dense({ inputShape: [3], units: 1, useBias: false }));
      phaseProbe.layers[0].setWeights([tf.tensor2d([[0], [0], [1]])]);
      const r = verdict(phaseProbe, { amplitude: 0, frequency: 0, phase: 0 });
      expect(r.class, 'The rule is p ABOVE 0.5. A tie does not clear it.').toBe('noise');
      expect(r.confidence).toBeCloseTo(0.5, 4);
    });
    it('hands model.predict one [1, 3] tensor of normalized features, in amplitude, frequency, phase order', () => {
      // A score computed from the inputs instead of from the network can
      // match the probes above, because every one of them zeroes the two
      // features it does not read. This one records what predict received.
      let seen = null;
      const spy = {
        predict: (input) => {
          seen = { shape: input.shape.slice(), values: Array.from(input.dataSync()) };
          return probe.predict(input);
        },
      };
      const r = verdict(spy, { amplitude: 512, frequency: 21, phase: Math.PI / 2 });
      expect(seen, 'model.predict was never called, so nothing the model learned reached this answer.').not.toBe(null);
      expect(seen.shape, 'One reading is one row of three features.').toEqual([1, 3]);
      const order = 'The network learned these three features in the order RANGES declares them. A swap cannot be detected at runtime; it just makes the answers wrong.';
      expect(seen.values[0], order).toBeCloseTo(0.25, 4);      // 512 / 2048
      expect(seen.values[1], order).toBeCloseTo(0.333333, 4);  // 21 / 63
      expect(seen.values[2], order).toBeCloseTo(0.75, 4);      // (Math.PI / 2 + Math.PI) / (2 * Math.PI)
      // probe reads amplitude alone, so p is 0.25: noise, reported at 1 - p
      expect(r.class, 'This probe reads amplitude alone, and 512 of 2048 counts normalizes to 0.25, so the verdict is noise. An anomaly here means the three features reached the model in another order.').toBe('noise');
      expect(r.confidence, 'This probe reads amplitude alone, so p is 0.25. The verdict is noise and the confidence in that verdict is 0.75; reporting 0.25 hands back the raw sigmoid instead.').toBeCloseTo(0.75, 4);
    });
    it('leaves no tensors behind (tf.tidy is doing its job)', () => {
      const before = tf.memory().numTensors;
      const r = verdict(probe, { amplitude: 100, frequency: 32, phase: 0 });
      expect(tf.memory().numTensors, 'The input tensor and the prediction are both still alive after classify returned. Inside a tidy callback they would already be gone.').toBe(before);
      expect(r.confidence, 'A pipeline that allocates nothing leaks nothing, so this check only means something once a verdict comes back.').toBeGreaterThan(0);
    });
  });
