solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  const RANGES = {
    amplitude: { min: 0, max: 2048 },
    frequency: { min: 0, max: 63 },
    phase: { min: -Math.PI, max: Math.PI },
  };

  interface Signal { amplitude: number; frequency: number; phase: number; }
  interface Result { class: 'anomaly' | 'noise'; confidence: number; }

  function classify(model: tf.LayersModel, signal: Signal): Result {
    return tf.tidy(() => {
      const normalized = [
        (signal.amplitude - RANGES.amplitude.min) / (RANGES.amplitude.max - RANGES.amplitude.min),
        (signal.frequency - RANGES.frequency.min) / (RANGES.frequency.max - RANGES.frequency.min),
        (signal.phase - RANGES.phase.min) / (RANGES.phase.max - RANGES.phase.min),
      ];
      const input = tf.tensor2d([normalized]);
      const output = model.predict(input) as tf.Tensor;
      const p = output.dataSync()[0];
      return {
        class: p > 0.5 ? 'anomaly' as const : 'noise' as const,
        confidence: p > 0.5 ? p : 1 - p,
      };
    });
  }
testCode: |
  describe('classify', () => {
    let probe;
    beforeAll(() => {
      // Identity probe: output = normalized amplitude, so the tests can
      // verify normalization and predict actually happened.
      probe = tf.sequential();
      probe.add(tf.layers.dense({ inputShape: [3], units: 1, useBias: false }));
      probe.layers[0].setWeights([tf.tensor2d([[1], [0], [0]])]);
    });

    // The starter returns null, and reading .class off null reports a
    // property name instead of the task. Every test comes through here, so
    // the first Run says what is missing.
    function verdict(model, signal) {
      const r = classify(model, signal);
      expect(r, 'Return an object with class and confidence from inside the tidy callback.').toBeDefined();
      return r;
    }

    it('a p above 0.5 is an anomaly, and the confidence reported is p', () => {
      const r = verdict(probe, { amplitude: 1536, frequency: 0, phase: -Math.PI });
      expect(r.class, 'The model reports an anomaly score, and this probe received 1536 of 2048 counts, so p is 0.75. Above 0.5 the verdict is anomaly.').toBe('anomaly');
      expect(r.confidence, 'Above the threshold, set confidence to the anomaly score.').toBeCloseTo(0.75, 4);
    });
    it('a p below 0.5 is noise, and the confidence reported is 1 - p', () => {
      const r = verdict(probe, { amplitude: 512, frequency: 0, phase: -Math.PI });
      expect(r.class, 'This probe received 512 of 2048 counts, so p is 0.25. That is not above 0.5, so the verdict is noise.').toBe('noise');
      expect(r.confidence, 'At or below the threshold, the class is noise. Its confidence is 1 minus the anomaly score.').toBeCloseTo(0.75, 4);
    });
    it('a p of exactly 0.5 is not above 0.5, so the verdict is noise and the confidence is 0.5 either way', () => {
      const phaseProbe = tf.sequential();
      phaseProbe.add(tf.layers.dense({ inputShape: [3], units: 1, useBias: false }));
      phaseProbe.layers[0].setWeights([tf.tensor2d([[0], [0], [1]])]);
      const r = verdict(phaseProbe, { amplitude: 0, frequency: 0, phase: 0 });
      expect(r.class, 'Classify as anomaly only when p > 0.5. At exactly 0.5, return noise.').toBe('noise');
      expect(r.confidence).toBeCloseTo(0.5, 4);
    });
    it('hands model.predict one [1, 3] tensor of normalized features, in amplitude, frequency, phase order', () => {
      // A score computed from the inputs instead of from the network can
      // match the probes above, because every one of them zeroes the two
      // features it does not read. This one records what predict received.
      let seen = null;
      let observedOutput = null;
      const spy = {
        predict: (input) => {
          seen = { shape: input.shape.slice(), values: Array.from(input.dataSync()) };
          const output = probe.predict(input);
          observedOutput = output.dataSync()[0];
          return output;
        },
      };
      const signal = { amplitude: 512, frequency: 21, phase: Math.PI / 2 };
      const raw = [signal.amplitude, signal.frequency, signal.phase];
      const limits = [[0, 2048], [0, 63], [-Math.PI, Math.PI]];
      const r = verdict(spy, signal);
      expect(seen, 'Call model.predict so the answer comes from the supplied model.').not.toBe(null);
      if (seen.values.length === 3 && seen.values.every(Number.isFinite) && Number.isFinite(observedOutput) && typeof r.class === 'string' && typeof r.confidence === 'number' && Number.isFinite(r.confidence)) {
        recordResult({
          kind: 'table', title: 'Raw fields and input values from your handler',
          summary: 'The supplied diagnostic reading copied before your call, the ranges requested by the exercise, and the actual tensor values observed at model.predict. The ranges are a supplied reference. Legacy frequency means zero-crossing count. Legacy phase is the supplied sample-pair angle, not FFT phase.',
          columns: ['Feature key', 'Raw input', 'Reference min', 'Reference max', 'Observed scaled input'],
          rows: ['amplitude', 'frequency', 'phase'].map((key, i) => [key, raw[i], limits[i][0], limits[i][1], seen.values[i]]),
        });
        recordResult({
          kind: 'table', title: 'The probe output and your returned decision',
          summary: 'The actual output from the supplied amplitude-echo test model, paired with the class and selected-class score your handler returned. This probe checks preprocessing and decision logic, not accuracy.',
          columns: ['Observed model output', 'Returned class', 'Selected class score'],
          rows: [[observedOutput, r.class, r.confidence]],
        });
        recordResult({
          kind: 'table', title: 'What your handler sent to the model',
          summary: 'The observed input tensor and returned decision from this diagnostic call. Evaluating DEEP SCAN accuracy requires separate labeled data.',
          columns: ['Amplitude scaled', 'Zero-crossing count scaled', 'Phase scaled', 'Returned class', 'Selected class score'],
          rows: [[...seen.values, r.class, r.confidence]],
        });
      }
      expect(seen.shape, 'One reading is one row of three features.').toEqual([1, 3]);
      const order = 'The network learned these three features in the order RANGES declares them. This runtime accepts swapped features with the same shape, but the changed meanings can produce wrong answers.';
      expect(seen.values[0], order).toBeCloseTo(0.25, 4);      // 512 / 2048
      expect(seen.values[1], order).toBeCloseTo(0.333333, 4);  // 21 / 63
      expect(seen.values[2], order).toBeCloseTo(0.75, 4);      // (Math.PI / 2 + Math.PI) / (2 * Math.PI)
      // probe reads amplitude alone, so p is 0.25: noise, reported at 1 - p
      expect(r.class, 'This probe reads amplitude alone, and 512 of 2048 counts normalizes to 0.25, so the verdict is noise. An anomaly here means the three features reached the model in another order.').toBe('noise');
      expect(r.confidence, 'This probe reads amplitude alone, so p is 0.25. The verdict is noise and the confidence in that verdict is 0.75. Reporting 0.25 hands back the raw sigmoid instead.').toBeCloseTo(0.75, 4);
    });
    it('leaves no tensors behind (tf.tidy is doing its job)', () => {
      const before = tf.memory().numTensors;
      const r = verdict(probe, { amplitude: 100, frequency: 32, phase: 0 });
      expect(tf.memory().numTensors, 'Temporary tensors are still alive after classify returned. Create and read them inside a synchronous tidy callback.').toBe(before);
      expect(r.confidence, 'Return a classification before checking tensor cleanup. Skipping inference would avoid allocations without completing the task.').toBeGreaterThan(0);
      recordResult({
        kind: 'table', title: 'Tensor count around your prediction',
        summary: 'Tensor counts before and after this prediction. Matching counts show that this call released its temporary tensors. They do not measure all browser memory.',
        columns: ['Before call', 'After call'],
        rows: [[before, tf.memory().numTensors]],
      });
    });
  });
