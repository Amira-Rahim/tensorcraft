solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  const RANGES = {
    amplitude: { min: 0, max: 2048 },
    frequency: { min: 20, max: 20000 },
    phase: { min: -Math.PI, max: Math.PI },
  };

  interface Signal { amplitude: number; frequency: number; phase: number; }
  interface Result { class: 'anomaly' | 'noise'; confidence: number; }

  function classify(model: tf.LayersModel, signal: Signal): Result {
    return tf.tidy(() => {
      const normalized = [
        (signal.amplitude - RANGES.amplitude.min) / (RANGES.amplitude.max - RANGES.amplitude.min),
        (signal.frequency - RANGES.frequency.min) / (RANGES.frequency.max - RANGES.frequency.min),
        (signal.phase - RANGES.phase.min) / (RANGES.phase.max - RANGES.phase.min),
      ];
      const input = tf.tensor2d([normalized]);
      const output = model.predict(input) as tf.Tensor;
      const confidence = output.dataSync()[0];
      return {
        class: confidence > 0.5 ? 'anomaly' as const : 'noise' as const,
        confidence,
      };
    });
  }
testCode: |
  describe('classify', () => {
    let model;
    beforeAll(() => {
      model = tf.sequential();
      model.add(tf.layers.dense({ inputShape: [3], units: 8, activation: 'relu' }));
      model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
    });
    it('returns a result object', () => {
      const result = classify(model, { amplitude: 1024, frequency: 10000, phase: 0 });
      expect(result).toBeDefined();
      expect(result.class).toBeDefined();
      expect(result.confidence).toBeDefined();
    });
    it('class is anomaly or noise', () => {
      const result = classify(model, { amplitude: 512, frequency: 5000, phase: 1.0 });
      expect(['anomaly', 'noise']).toContain(result.class);
    });
    it('confidence is between 0 and 1', () => {
      const result = classify(model, { amplitude: 100, frequency: 1000, phase: -1.0 });
      expect(result.confidence).toBeGreaterThanOrEqual(0);
      expect(result.confidence).toBeLessThanOrEqual(1);
    });
  });
