solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  interface ModelInfo {
    inputShape: number[];
    outputShape: number[];
    layerCount: number;
  }

  async function loadAndInspect(url: string): Promise<ModelInfo> {
    const model = await tf.loadLayersModel(url);
    return {
      inputShape: model.inputs[0].shape as number[],
      outputShape: model.outputs[0].shape as number[],
      layerCount: model.layers.length,
    };
  }
testCode: |
  describe('loadAndInspect', () => {
    it('returns model info', async () => {
      const info = await loadAndInspect('/models/deep-scan/model.json');
      expect(info).toBeDefined();
    });
    it('has inputShape array', async () => {
      const info = await loadAndInspect('/models/deep-scan/model.json');
      expect(Array.isArray(info.inputShape)).toBe(true);
      expect(info.inputShape.length).toBeGreaterThan(0);
    });
    it('has outputShape array', async () => {
      const info = await loadAndInspect('/models/deep-scan/model.json');
      expect(Array.isArray(info.outputShape)).toBe(true);
    });
    it('has positive layer count', async () => {
      const info = await loadAndInspect('/models/deep-scan/model.json');
      expect(info.layerCount).toBeGreaterThan(0);
    });
  });
