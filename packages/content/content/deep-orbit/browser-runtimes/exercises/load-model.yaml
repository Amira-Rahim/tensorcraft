title: "Load and Inspect a Model"
instructions: |
  Write `loadAndInspect(url)`. Load the TensorFlow.js model once and return `{ inputShape, outputShape, layerCount }`.

  Read all three fields from that model. Copy the input and output shapes, including any null batch-size entry, and count its layers. Then dispose the model, including if inspection fails.

  Do not load again for each field. Repeated loads can repeat work even when the browser caches the downloaded files.

