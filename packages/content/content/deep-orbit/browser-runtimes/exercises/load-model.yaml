solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  interface ModelInfo {
    inputShape: (number | null)[];
    outputShape: (number | null)[];
    layerCount: number;
  }

  async function loadAndInspect(url: string): Promise<ModelInfo> {
    const model = await tf.loadLayersModel(url);
    try {
      return {
        inputShape: [...model.inputs[0].shape],
        outputShape: [...model.outputs[0].shape],
        layerCount: model.layers.length,
      };
    } finally {
      model.dispose();
    }
  }
testCode: |
  describe('loadAndInspect', () => {
    // The starter returns null, and reading .layerCount off null reports a
    // property name instead of the task. Every test goes through here so the
    // first Run says what is missing.
    async function inspect(url) {
      const info = await loadAndInspect(url);
      expect(info, 'loadAndInspect has to resolve to an object carrying inputShape, outputShape and layerCount. The starter returns null until you build that object from the model you loaded.').toBeDefined();
      return info;
    }

    it('reports the loaded model\'s real architecture, not invented values', async () => {
      const info = await inspect('/models/deep-scan/model.json');
      const ref = await tf.loadLayersModel('/models/deep-scan/model.json');
      const shapeNote = 'Report the shape the way the model reports it. The first entry is the batch dimension and comes back null, so a shape written out by hand will not match.';
      expect(info.layerCount, 'This is the layer count of the model at that url, so read it off the model you loaded.').toBe(ref.layers.length);
      expect(info.inputShape, shapeNote).toEqual(ref.inputs[0].shape);
      expect(info.outputShape, shapeNote).toEqual(ref.outputs[0].shape);
    });
    it('inputShape and outputShape are genuine shape arrays from the model', async () => {
      const info = await inspect('/models/deep-scan/model.json');
      const isShape = 'A shape is the array the model reports, so hand it back the way model.inputs[0].shape and model.outputs[0].shape give it to you.';
      expect(Array.isArray(info.inputShape), isShape).toBe(true);
      expect(Array.isArray(info.outputShape), isShape).toBe(true);
      const lastEntry = 'The last entry of a shape is the feature count, which is a positive number. Only the FIRST entry, the batch dimension, comes back null.';
      expect(info.inputShape[info.inputShape.length - 1], lastEntry).toBeGreaterThan(0);
      expect(info.outputShape[info.outputShape.length - 1], lastEntry).toBeGreaterThan(0);
    });
    it('reads the architecture off the model it loaded, and loads that url once', async () => {
      // Rebind tf for the duration of this call so the sentinel url resolves
      // to a 7 -> 5 -> 3 -> 2 model this test builds. No shape triple can be
      // hardcoded past it. Only the sentinel url is diverted, so the sibling
      // tests' own loads (tests run concurrently) still get the normal model.
      // The same wrapper counts the calls: reading the three fields off three
      // separate loads answers correctly and downloads the model three times.
      const sentinel = '/models/spy-check/model.json';
      const realTf = tf;
      let seen = null;
      let loads = 0;
      tf = new Proxy(realTf, {
        get(target, prop) {
          if (prop === 'loadLayersModel') {
            return async function (url) {
              if (url !== sentinel) return realTf.loadLayersModel(url);
              seen = url;
              loads++;
              const m = realTf.sequential();
              m.add(realTf.layers.dense({ units: 5, activation: 'relu', inputShape: [7] }));
              m.add(realTf.layers.dense({ units: 3, activation: 'relu' }));
              m.add(realTf.layers.dense({ units: 2, activation: 'softmax' }));
              return m;
            };
          }
          return target[prop];
        },
      });
      let info;
      try {
        info = await inspect(sentinel);
      } finally {
        tf = realTf;
      }
      expect(seen).toBe(sentinel);
      expect(info.layerCount).toBe(3);
      expect(info.inputShape[info.inputShape.length - 1]).toBe(7);
      expect(info.outputShape[info.outputShape.length - 1]).toBe(2);
      expect(loads, 'One inspection is one load. Every field you report hangs off the model the first call resolved to, so awaiting the loader again per field refetches the manifest and the weight shards each time.').toBe(1);
    });
  });
