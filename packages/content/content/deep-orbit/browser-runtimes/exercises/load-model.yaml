title: "Load and Inspect a Model"
instructions: "Write a function that loads a TensorFlow.js model from a URL and returns an object with the model's input shape, output shape, and total number of layers, shaped `{ inputShape, outputShape, layerCount }`. Load the URL once and read all three fields off the model that one call resolved to. Repeated loads can repeat work even when HTTP caching saves network traffic. Dispose the inspected model after copying its metadata."
