solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  interface ModelInfo {
    inputShape: number[];
    outputShape: number[];
    layerCount: number;
  }

  async function loadAndInspect(url: string): Promise<ModelInfo> {
    const model = await tf.loadLayersModel(url);
    return {
      inputShape: model.inputs[0].shape as number[],
      outputShape: model.outputs[0].shape as number[],
      layerCount: model.layers.length,
    };
  }
testCode: |
  describe('loadAndInspect', () => {
    it('reports the loaded model\'s real architecture, not invented values', async () => {
      const info = await loadAndInspect('/models/deep-scan/model.json');
      const ref = await tf.loadLayersModel('/models/deep-scan/model.json');
      expect(info.layerCount).toBe(ref.layers.length);
      expect(info.inputShape).toEqual(ref.inputs[0].shape);
      expect(info.outputShape).toEqual(ref.outputs[0].shape);
    });
    it('inputShape and outputShape are genuine shape arrays from the model', async () => {
      const info = await loadAndInspect('/models/deep-scan/model.json');
      expect(Array.isArray(info.inputShape)).toBe(true);
      expect(Array.isArray(info.outputShape)).toBe(true);
      expect(info.inputShape[info.inputShape.length - 1]).toBeGreaterThan(0);
      expect(info.outputShape[info.outputShape.length - 1]).toBeGreaterThan(0);
    });
    it('reads the architecture off the model it loaded, whatever that model is', async () => {
      // Rebind tf for the duration of this call so the sentinel url resolves
      // to a 7 -> 5 -> 3 -> 2 model this test builds. No shape triple can be
      // hardcoded past it. Only the sentinel url is diverted, so the sibling
      // tests' own loads (tests run concurrently) still get the normal model.
      const sentinel = '/models/spy-check/model.json';
      const realTf = tf;
      let seen = null;
      tf = new Proxy(realTf, {
        get(target, prop) {
          if (prop === 'loadLayersModel') {
            return async function (url) {
              if (url !== sentinel) return realTf.loadLayersModel(url);
              seen = url;
              const m = realTf.sequential();
              m.add(realTf.layers.dense({ units: 5, activation: 'relu', inputShape: [7] }));
              m.add(realTf.layers.dense({ units: 3, activation: 'relu' }));
              m.add(realTf.layers.dense({ units: 2, activation: 'softmax' }));
              return m;
            };
          }
          return target[prop];
        },
      });
      let info;
      try {
        info = await loadAndInspect(sentinel);
      } finally {
        tf = realTf;
      }
      expect(seen).toBe(sentinel);
      expect(info.layerCount).toBe(3);
      expect(info.inputShape[info.inputShape.length - 1]).toBe(7);
      expect(info.outputShape[info.outputShape.length - 1]).toBe(2);
    });
  });
