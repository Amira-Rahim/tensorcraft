description: "ARIA's rules name the two calibration tones perfectly and have since launch. Not one of them names the stream out of Sector 7-G. You'll build the replacement a piece at a time: one neuron, the activation that bends it, layers stacked into an architecture, and a compiled classifier that answers before it has learned anything."
