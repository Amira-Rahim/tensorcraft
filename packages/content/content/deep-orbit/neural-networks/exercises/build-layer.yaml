slug: build-layer
lessonSlug: layers-and-architecture
title: "Build a 3-Layer Sequential Model"
instructions: |
  Build a Sequential model with three dense layers:

  1. 16 ReLU units, with `inputShape: [4]`.
  2. 8 ReLU units.
  3. 1 sigmoid unit.

  These practice sizes differ from the bridge model's 32/16/1 layers.

  Write `predictParams(width)` to count the parameters in this 16/8/1 model
  for any positive input width. Each unit needs one weight per input and one
  bias. Use arithmetic in the function, without creating a model or tensor.
  Check your result against `model.countParams()`.
starterCode: |
  // Build a 3-layer sequential model
  const model = tf.sequential();

  // Add layers here

  // Quote the count: how many parameters does the stack above hold when a
  // reading of `width` values arrives?
  function predictParams(width) {
    return null; // your code here
  }
solutionCode: |
  const model = tf.sequential();
  model.add(tf.layers.dense({ units: 16, activation: 'relu', inputShape: [4] }));
  model.add(tf.layers.dense({ units: 8, activation: 'relu' }));
  model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));

  function predictParams(width) {
    return (width * 16 + 16) + (16 * 8 + 8) + (8 * 1 + 1);
  }
testCode: |
  describe('Model', () => {
    // tf.__calls is the harness's call counter (fresh per run). Read at
    // registration, this is the count the submission's own top-level code
    // produced: the one stack the exercise asks for, and nothing else.
    const builtAtTopLevel = {
      sequential: tf.__calls.sequential || 0,
      model: tf.__calls.model || 0,
      'layers.dense': tf.__calls['layers.dense'] || 0,
    };
    // Read again around every call: a stack built lazily inside the
    // function, on its first call and cached, is the same measurement taken
    // later, and the registration snapshot above never sees it.
    const modelsBuilt = () =>
      (tf.__calls.sequential || 0) + (tf.__calls.model || 0) + (tf.__calls['layers.dense'] || 0);
    const builtWhileQuoting = (width) =>
      'predictParams(' + width + ') built a model while it answered. A stack assembled inside the function, on the first call or on every call, is the measurement this exercise replaces with arithmetic: count what one unit owns and total the three stages.';
    const quoteFor = (width) => {
      expect(
        typeof predictParams,
        'predictParams is not defined. The grader calls it to read your quote back, so keep the function the starter handed you.',
      ).toBe('function');
      const builtBefore = modelsBuilt();
      const quoted = predictParams(width);
      expect(modelsBuilt() - builtBefore, builtWhileQuoting(width)).toBe(0);
      expect(
        quoted,
        'predictParams() is still empty. Count one weight per input and one bias per unit, then add the three layer counts.',
      ).toBeDefined();
      return quoted;
    };
    it('has 3 layers and output shape [null, 1]', () => {
      expect(
        model.layers.length,
        'The model is still empty. Each stage arrives through its own model.add() call.',
      ).toBe(3);
      expect(model.outputShape).toEqual([null, 1]);
    });
    it('has the specified units per layer', () => {
      const units = model.layers.map((l) => l.getConfig().units);
      expect(
        units,
        'These are read back off the layers themselves, one unit count per stage, in the order they were added.',
      ).toEqual([16, 8, 1]);
    });
    it('uses relu, relu, sigmoid activations', () => {
      const acts = model.layers.map((l) => l.getConfig().activation);
      expect(
        acts,
        'Keep the layer order from the instructions. The first two layers use ReLU; the final layer uses sigmoid.',
      ).toEqual(['relu', 'relu', 'sigmoid']);
      recordResult({
        kind: 'table', title: 'The stack you built for Nazari',
        summary: 'Your 16/8/1 exercise stack, distinct from the bridge model\'s 32/16/1 layers. These parameters have not been trained.',
        columns: ['Layer', 'Units', 'Activation', 'Parameters'],
        rows: model.layers.map((layer, i) => [i + 1, layer.getConfig().units, layer.getConfig().activation, layer.countParams()]),
      });
    });
    it('your quote for the width the first layer declares matches the stack you built', () => {
      const quoted = quoteFor(4);
      expect(
        quoted,
        'The parameter count does not match the model. Check the first layer\'s input width and count one bias per unit.',
      ).toBe(model.countParams());
      recordResult({
        kind: 'table', title: 'Your parameter quote',
        summary: 'The submitted arithmetic quote checked against your constructed model.',
        columns: ['Input features', 'Quoted parameters', 'Built model parameters'],
        rows: [[4, quoted, model.countParams()]],
      });
    });
    it('builds the stack once: a second stack built to measure the price is the measurement this exercise replaces', () => {
      // Snapshotted when this describe registered, after the submission's
      // top-level code ran and before any test built a reference stack.
      expect(
        (builtAtTopLevel.sequential || 0) + (builtAtTopLevel.model || 0),
        'Build one 16/8/1 model at top level. predictParams() must count using arithmetic, without building another model.',
      ).toBe(1);
      const dense = builtAtTopLevel['layers.dense'] || 0;
      expect(
        dense,
        dense < 3
          ? 'Only ' + dense + ' dense layer' + (dense === 1 ? '' : 's') + ' went onto the stack at top level. Three model.add() calls make the 16/8/1 stack.'
          : dense + ' dense layers were built at top level. Three make the stack; more means a second stack was built to read a count off, which is the shortcut this exercise asks you not to take.',
      ).toBe(3);
    });
    it('quotes a width nobody has priced for you, and quotes it without building anything', () => {
      const stackAt = (width) => {
        const reference = tf.sequential();
        reference.add(tf.layers.dense({ units: 16, activation: 'relu', inputShape: [width] }));
        reference.add(tf.layers.dense({ units: 8, activation: 'relu' }));
        reference.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
        return reference.countParams();
      };
      const narrow = 6;
      const pricedNarrow = stackAt(narrow);
      const perArrivingValue = stackAt(narrow + 1) - pricedNarrow;
      const wide = 20000 + Math.floor(Math.random() * 80000);
      expect(
        typeof predictParams,
        'predictParams is not defined. The grader calls it to read your quote back, so keep the function the starter handed you.',
      ).toBe('function');
      const tensorIdNow = () => {
        const marker = tf.scalar(0);
        const id = marker.id;
        marker.dispose();
        return id;
      };
      const idleFirst = tensorIdNow();
      const idleCost = tensorIdNow() - idleFirst;
      const beforeId = tensorIdNow();
      const builtBefore = modelsBuilt();
      const quoted = predictParams(wide);
      expect(modelsBuilt() - builtBefore, builtWhileQuoting(wide)).toBe(0);
      expect(
        tensorIdNow() - beforeId,
        'predictParams() created tensors. Calculate the count using arithmetic on the input width and layer sizes.',
      ).toBe(idleCost);
      expect(
        quoted,
        'The count is wrong for this input width. Write a formula that works for any positive width, not a saved count from one model.',
      ).toBe(pricedNarrow + perArrivingValue * (wide - narrow));
    });
    it('prices the first stage from the width that arrives, so the same stack costs more when the reading is wider', () => {
      for (let trial = 0; trial < 3; trial++) {
        const width = 2 + Math.floor(Math.random() * 30);
        const reference = tf.sequential();
        reference.add(tf.layers.dense({ units: 16, activation: 'relu', inputShape: [width] }));
        reference.add(tf.layers.dense({ units: 8, activation: 'relu' }));
        reference.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
        expect(
          quoteFor(width),
          'The count must change with the input width. Only the first layer\'s weight count changes; the other layers keep their input sizes.',
        ).toBe(reference.countParams());
      }
    });
  });
