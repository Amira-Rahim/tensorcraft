slug: forward-pass
lessonSlug: forward-pass
title: "Run a Forward Pass"
instructions: "Create a simple sequential model with one dense layer (3 units, inputShape [2]), then run model.predict() on the provided input tensor. The input is a batch of 2 samples, each with 2 features. Leave the layer's weight initialization at the default: the grader recomputes the forward pass from the random weights your layer starts with, so the output cannot be written by hand."
starterCode: "const input = tf.tensor2d([[1.0, 2.0], [3.0, 4.0]]);\n\n// Create a model and run a forward pass\nconst model = tf.sequential();\n// Add a dense layer here\n\nconst prediction = null; // run predict on input"
solutionCode: "const input = tf.tensor2d([[1.0, 2.0], [3.0, 4.0]]);\n\nconst model = tf.sequential();\nmodel.add(tf.layers.dense({ units: 3, inputShape: [2] }));\n\nconst prediction = model.predict(input);"
testCode: |
  describe('Forward Pass', () => {
    it('model maps 2 features to 3 units', () => {
      expect(model.layers.length).toBeGreaterThanOrEqual(1);
      const kernel = model.layers[0].getWeights()[0];
      expect(kernel.shape).toEqual([2, 3]);
    });
    it('prediction has shape [2, 3]: one row of 3 units per sample in the batch', () => {
      expect(prediction.shape).toEqual([2, 3]);
    });
    it('the layer keeps its default random weights, so no two of them are the same number', () => {
      const kernel = Array.from(model.layers[0].getWeights()[0].dataSync());
      const spread = Math.max.apply(null, kernel) - Math.min.apply(null, kernel);
      expect(spread).toBeGreaterThan(1e-6);
    });
    it('prediction is the forward pass: input times kernel plus bias, recomputed from the weights the model holds', () => {
      const weights = model.layers[0].getWeights();
      const expected = tf.matMul(input, weights[0]).add(weights[1]).dataSync();
      const actual = prediction.dataSync();
      expect(actual).toHaveLength(expected.length);
      for (let i = 0; i < expected.length; i++) {
        expect(actual[i]).toBeCloseTo(expected[i], 3);
      }
    });
    it('the batch axis is free: 5 samples in, shape [5, 3] out', () => {
      const batchOfFive = tf.randomUniform([5, 2], -1, 1);
      const out = model.predict(batchOfFive);
      expect(out.shape).toEqual([5, 3]);
      const weights = model.layers[0].getWeights();
      const expected = tf.matMul(batchOfFive, weights[0]).add(weights[1]).dataSync();
      const actual = out.dataSync();
      for (let i = 0; i < expected.length; i++) {
        expect(actual[i]).toBeCloseTo(expected[i], 3);
      }
    });
  });
