slug: forward-pass
lessonSlug: forward-pass
title: "Run a Forward Pass"
instructions: |
  Add one dense layer with 3 units and `inputShape: [2]`. Keep its default
  linear activation and random starting weights.

  1. Write `forward(batch)`. Call `model.predict()` once for the whole batch
     and return its output tensor. Set `prediction = forward(input)`.
     The tests use batches with different row counts and check the result
     against the inputs multiplied by the weights, plus the bias.
  2. Write `asBatch(reading)` to turn a flat reading into one row.
     Set `batched = asBatch(singleReading)`. Keep all values unchanged.
     Any shape `[n]` must become `[1, n]`.
starterCode: |
  const input = tf.tensor2d([[1.0, 2.0], [3.0, 4.0]]);

  const model = tf.sequential();
  // Add a dense layer here

  // One call has to carry the whole stack, whatever its height.
  function forward(batch) {
    return null; // your code here
  }

  const prediction = forward(input);

  // The feed also hands over one reading at a time, flat.
  const singleReading = tf.tensor1d([5.0, 6.0]);

  function asBatch(reading) {
    return null; // your code here
  }

  const batched = asBatch(singleReading);
solutionCode: |
  const input = tf.tensor2d([[1.0, 2.0], [3.0, 4.0]]);

  const model = tf.sequential();
  model.add(tf.layers.dense({ units: 3, inputShape: [2] }));

  function forward(batch) {
    return model.predict(batch);
  }

  const prediction = forward(input);

  const singleReading = tf.tensor1d([5.0, 6.0]);

  function asBatch(reading) {
    return reading.expandDims(0);
  }

  const batched = asBatch(singleReading);
testCode: |
  describe('Forward Pass', () => {
    const firstLayer = () => {
      expect(
        model.layers.length,
        'The model has no layers yet. It needs one dense layer, told how many features a single reading carries.',
      ).toBeGreaterThanOrEqual(1);
      return model.layers[0];
    };
    const forwardFn = () => {
      expect(
        typeof forward,
        'forward is not defined. The grader calls it with batches of its own, so keep the function the starter handed you.',
      ).toBe('function');
      return forward;
    };
    const readPrediction = () => {
      expect(
        prediction,
        'prediction is still empty. forward() has to hand back what the model answers for the batch it was given.',
      ).toBeDefined();
      return prediction;
    };
    it('model maps 2 features to 3 units', () => {
      const kernel = firstLayer().getWeights()[0];
      expect(
        kernel.shape,
        'The weight matrix is the wrong shape. It carries one row per incoming feature and one column per unit.',
      ).toEqual([2, 3]);
    });
    it('prediction has one row per reading in the stack and one column per unit', () => {
      expect(readPrediction().shape).toEqual([2, 3]);
    });
    it('the layer has a nonconstant kernel, consistent with the requested default initialization', () => {
      const kernel = Array.from(firstLayer().getWeights()[0].dataSync());
      const spread = Math.max.apply(null, kernel) - Math.min.apply(null, kernel);
      expect(
        spread,
        'Keep the default random weight initializer. Do not replace it with identical starting weights.',
      ).toBeGreaterThan(1e-6);
    });
    it('prediction is the forward pass: input times kernel plus bias, recomputed from the weights the model holds', () => {
      const weights = firstLayer().getWeights();
      const expected = tf.matMul(input, weights[0]).add(weights[1]).dataSync();
      const actual = readPrediction().dataSync();
      expect(actual).toHaveLength(expected.length);
      for (let i = 0; i < expected.length; i++) {
        expect(
          actual[i],
          'The output must equal input times weights plus bias. Keep the default linear activation and return the actual prediction.',
        ).toBeCloseTo(expected[i], 3);
      }
      recordResult({
        kind: 'table', title: 'Your first forward pass',
        summary: 'Actual outputs from your two-feature, three-unit exercise model. Its random starting weights do not establish prediction accuracy.',
        columns: ['Reading', 'Input 1', 'Input 2', 'Unit 1', 'Unit 2', 'Unit 3'],
        rows: input.arraySync().map((row, i) => [i + 1, ...row, ...Array.from(actual).slice(i * 3, i * 3 + 3)]),
      });
    });
    it('one predict call carries the whole stack, at any height', () => {
      const layer = firstLayer();
      const submitted = forwardFn();
      const height = 3 + Math.floor(Math.random() * 6);
      const stack = tf.randomUniform([height, 2], -1, 1);
      const realPredict = model.predict.bind(model);
      const realOnBatch = model.predictOnBatch ? model.predictOnBatch.bind(model) : null;
      let calls = 0;
      // The tensor the model last handed back. Counting calls alone only
      // proves predict ran somewhere; holding on to what it returned is what
      // ties the answer to the model.
      let answered = null;
      model.predict = function (x) { calls++; answered = realPredict(x); return answered; };
      if (realOnBatch) model.predictOnBatch = function (x) { calls++; answered = realOnBatch(x); return answered; };
      let out;
      try {
        out = submitted(stack);
      } finally {
        delete model.predict;
        if (realOnBatch) delete model.predictOnBatch;
      }
      expect(
        out,
        'forward() returned nothing for a new batch. Use the batch passed into the function, not just the starter input.',
      ).toBeDefined();
      expect(
        out.shape,
        'Return one prediction row per input row, whatever the batch size.',
      ).toEqual([height, 3]);
      const weights = layer.getWeights();
      const expected = tf.matMul(stack, weights[0]).add(weights[1]).dataSync();
      const actual = out.dataSync();
      for (let i = 0; i < expected.length; i++) {
        expect(actual[i]).toBeCloseTo(expected[i], 3);
      }
      expect(
        calls,
        'Call model.predict() once for the whole batch. Do not loop over rows and join separate predictions.',
      ).toBe(1);
      expect(
        out === answered,
        'Return the tensor from model.predict() itself. Do not return a clone or a separate tensor with matching values.',
      ).toBe(true);
    });
    it('gives one flat reading the batch axis the layer expects', () => {
      expect(
        typeof asBatch,
        'asBatch is not defined. The grader hands it readings of its own, so keep the function the starter handed you.',
      ).toBe('function');
      expect(
        batched,
        'batched is still empty. asBatch() has to hand the starter reading back with its batch axis in place.',
      ).toBeDefined();
      expect(
        batched.shape,
        'Add one leading axis: a reading shaped [2] must become one row shaped [1, 2].',
      ).toEqual([1, 2]);
      const drawn = tf.randomUniform([4], -1, 1);
      let wider;
      try {
        wider = asBatch(drawn);
      } catch (err) {
        throw new Error(
          'asBatch() threw on a reading of 4 values: ' +
            err.message +
            '. The axis goes on whatever arrives, so the body cannot be built around the starter width.',
        );
      }
      expect(
        wider.shape,
        'Add the axis to the reading passed into asBatch(). It must also work for readings with other widths.',
      ).toEqual([1, 4]);
      const before = Array.from(drawn.dataSync());
      const after = Array.from(wider.dataSync());
      for (let i = 0; i < before.length; i++) {
        expect(
          after[i],
          'The values changed on the way through. Adding the batch axis rewraps the reading; it leaves every number where it was.',
        ).toBeCloseTo(before[i], 5);
      }
      const reading = tf.randomUniform([2], -1, 1);
      const answer = forwardFn()(asBatch(reading));
      expect(
        answer.shape,
        'The model would not answer one batched reading. One reading in means one row of predictions out, shape [1, 3].',
      ).toEqual([1, 3]);
    });
  });
