solutionCode: |
  const { readings, labels } = tf.tidy(() => {
    const calmReal = tf.clipByValue(tf.randomNormal([60, 3], 0.30, 0.09, 'float32', 11), 0, 1);
    const flaggedReal = tf.clipByValue(tf.randomNormal([60, 3], 0.68, 0.09, 'float32', 23), 0, 1);
    const spare = tf.clipByValue(tf.randomNormal([120, 5], 0.50, 0.15, 'float32', 37), 0, 1);
    return {
      readings: tf.concat([tf.concat([calmReal, flaggedReal]), spare], 1),
      labels: tf.concat([tf.zeros([60, 1]), tf.ones([60, 1])]),
    };
  });

  function buildClassifier() {
    const model = tf.sequential();
    model.add(tf.layers.dense({ units: 24, activation: 'relu', inputShape: [8] }));
    model.add(tf.layers.dense({ units: 12, activation: 'relu' }));
    model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
    model.compile({ optimizer: 'adam', loss: 'binaryCrossentropy', metrics: ['accuracy'] });
    return model;
  }

  const model = buildClassifier();
  const second = buildClassifier();

  const initialWeights = model.getWeights().map((w) => Array.from(w.dataSync()));

  const sweepOne = tf.tidy(() => Array.from(model.predict(readings).dataSync()));
  const sweepTwo = tf.tidy(() => Array.from(second.predict(readings).dataSync()));

  await model.fit(readings, labels, { epochs: 50, batchSize: 16 });

  const trainedSweep = tf.tidy(() => Array.from(model.predict(readings).dataSync()));
testCode: |
  describe('Compiled, then trained', () => {
    const selectedRows = [...Array.from({ length: 8 }, (_, i) => i), ...Array.from({ length: 8 }, (_, i) => i + 60)];
    // Sequential.fit delegates to its internal LayersModel in TFJS 4.22.
    const firstModelFits = tf.__fits.filter((fit) => fit && (fit.model === model || fit.model === model.model));
    const fitted = firstModelFits[firstModelFits.length - 1];
    const sameValues = (snapshot, tensor) => {
      if (!snapshot || !snapshot.complete || !(tensor instanceof tf.Tensor) ||
          snapshot.shape.join(',') !== tensor.shape.join(',')) return false;
      const actual = tensor.dataSync();
      return snapshot.values.length === actual.length && snapshot.values.every((value, i) => value === actual[i]);
    };
    let matchingTrainingRows = false;
    try {
      matchingTrainingRows = !!fitted && !!fitted.settings && fitted.settings.validationSplit === 0 &&
        sameValues(fitted.x, readings) && sameValues(fitted.y, labels);
      if (matchingTrainingRows && readings.shape.join(',') === '120,8' && labels.shape.join(',') === '120,1') {
        const inputRows = readings.arraySync();
        const targetValues = Array.from(labels.dataSync());
        if (selectedRows.every((i) => inputRows[i].every(Number.isFinite) && Number.isFinite(targetValues[i]))) {
          recordResult({
            kind: 'table', title: 'Selected training readings',
            summary: 'Actual rows 0-7 and 60-67 from this run, in the supplied feature order. These dimensionless generated practice values belong to the first model’s training batch. They are separate from the normalization exercise and the ship’s measurements.',
            columns: ['Row ID', 'Label', 'Amplitude proxy', 'Zero-crossing proxy', 'Phase proxy', 'Practice feature 4', 'Practice feature 5', 'Practice feature 6', 'Practice feature 7', 'Practice feature 8'],
            rows: selectedRows.map((i) => [i, targetValues[i], ...inputRows[i]]),
          });
        }
      }
    } catch {
      // The graded checks still report an unavailable or changed input.
    }
    if (fitted && fitted.settings) {
      const settings = fitted.settings;
      recordResult({
        kind: 'table', title: 'Training settings from this run',
        summary: 'Observed settings for the most recent fit on the first model. Completed epochs and loss come from that fit. The checks below report whether the run followed the requested task.',
        columns: ['Setting', 'Value'],
        rows: [
          ['Parameters', settings.parameters],
          ['Layer units', settings.units.join(', ')],
          ['Activations', settings.activations.join(', ')],
          ['Optimizer', settings.optimizer],
          ['Learning rate', settings.learningRate],
          ['Loss', settings.loss],
          ['Metrics', settings.metrics.join(', ')],
          ['Requested epochs', settings.epochs],
          ['Batch size', settings.batchSize],
          ['Shuffle', settings.shuffle],
          ['Initial epoch', settings.initialEpoch],
          ['Validation split', settings.validationSplit],
          ['Completed epochs', fitted.completed ? fitted.completed.completedEpochs : 0],
          ['Rows passed to fit', fitted.x ? fitted.x.shape[0] : null],
          ['Fits on first model', firstModelFits.length],
        ],
      });
    }
    if (fitted && fitted.completed && fitted.completed.points.length > 0) {
      const completed = fitted.completed;
      recordResult({
        kind: 'series', title: 'Training loss from this run',
        summary: 'Measured loss on the training batch for the most recent fit. ' +
          (completed.sampled ? 'Showing 64 sampled epochs from ' + completed.completedEpochs + ' completed epochs. ' : 'Showing the recorded finite loss for each completed epoch. ') +
          (completed.finiteEpochs < completed.completedEpochs ? 'Some epochs had no finite loss to display. ' : '') +
          'Lower training loss alone does not establish performance on new readings.',
        xLabel: 'Epoch', yLabel: fitted.settings && fitted.settings.loss === 'binaryCrossentropy' ? 'Binary crossentropy' : 'Training loss',
        labels: completed.points.map((point) => String(point.epoch)),
        series: [{ name: 'Loss', values: completed.points.map((point) => point.loss) }],
      });
    }
    try {
      const validSweep = (sweep) => Array.isArray(sweep) && sweep.length === 120 &&
        sweep.every((value) => Number.isFinite(value) && value >= 0 && value <= 1);
      if (matchingTrainingRows && validSweep(sweepOne) && validSweep(sweepTwo) && validSweep(trainedSweep)) {
        recordResult({
          kind: 'table', title: 'Scores from your before-and-after run',
          summary: 'Sixteen selected rows from the supplied 120-row synthetic rehearsal, eight from each label group. These rows belong to training. The checks below verify the saved scores. Evaluate on separate data to check how the model handles new examples.',
          columns: ['Row ID', 'Label', 'First model before training', 'Second model untrained', 'First model after training'],
          rows: selectedRows.map((i) => [i, labels.dataSync()[i], sweepOne[i], sweepTwo[i], trainedSweep[i]]),
        });
      }
    } catch {
      // Missing predictions remain visible in the graded checks.
    }
    const CALM = 60;
    const avg = (a) => a.reduce((s, x) => s + x, 0) / a.length;
    // Positive when the flagged rows score higher than the calm ones, which
    // is the only thing "the network has an opinion about this archive" can
    // mean here.
    const groupGap = (sweep) => avg(sweep.slice(CALM)) - avg(sweep.slice(0, CALM));
    const sweepOf = (m) => Array.from(m.predict(readings).dataSync());
    const maxDiff = (a, b) => a.reduce((mx, v, i) => Math.max(mx, Math.abs(v - b[i])), 0);
    const readSweep = (name, value) => {
      expect(
        Array.isArray(value),
        name +
          ' is not an array of numbers. Read the prediction tensor out with dataSync() and copy it into a plain array, so the checks can compare the answers reading by reading.',
      ).toBe(true);
      expect(
        value.length,
        name +
          ' holds ' +
          value.length +
          ' answers. A sweep runs every row of the rehearsal batch through the network, so it comes back one answer per reading.',
      ).toBe(readings.shape[0]);
      return value;
    };

    it('builds the eight-feature stack, three stages deep', () => {
      expect(
        model.layers.map((l) => l.getConfig().units),
        'The stack does not match the spec. Three dense layers, each with the unit count the instructions give it.',
      ).toEqual([24, 12, 1]);
      expect(model.layers.map((l) => l.getConfig().activation)).toEqual(['relu', 'relu', 'sigmoid']);
      expect(
        model.outputShape,
        'There is no output shape to read until the output layer is on the model.',
      ).toEqual([null, 1]);
      expect(
        model.countParams(),
        'The parameter count is wrong. Check all layer widths and use eight input features for the first layer.',
      ).toBe(529);
    });

    it('compiles with Adam, binary crossentropy and the accuracy metric', () => {
      expect(
        model.optimizer,
        'Your code has not compiled the model. compile() is the call that attaches the optimizer and the loss.',
      ).toBeDefined();
      expect(model.optimizer.getClassName()).toBe('Adam');
      expect(model.loss).toBe('binaryCrossentropy');
      expect(
        model.metrics || [],
        'Add accuracy to the compile metrics. Metrics add measurements to the training log. The loss and optimizer still determine weight updates.',
      ).toContain('accuracy');
    });

    it('creates a separate second model for comparison', () => {
      expect(
        second === model,
        'Call buildClassifier() twice to create independent models. A second name for the trained model cannot act as the untrained comparison.',
      ).toBe(false);
      expect(
        second.layers.length,
        'The second network lacks layers, so there are three layers on one of these and not the other.',
      ).toBe(3);
      expect(
        second.optimizer,
        'Compile both models inside buildClassifier(), including the one kept untrained for comparison.',
      ).toBeDefined();
    });

    it('starts the untrained network with random kernels and zero biases', () => {
      expect(
        second.layers.length,
        'There are no layers on the second network yet, so there are no starting weights to look at.',
      ).toBe(3);
      second.layers.forEach((layer, index) => {
        const weights = layer.getWeights();
        const kernel = Array.from(weights[0].dataSync());
        const spread = Math.max.apply(null, kernel) - Math.min.apply(null, kernel);
        expect(
          spread,
          'Layer ' +
            (index + 1) +
            ' holds a constant kernel. This exercise asks for the default random initialization. Identically initialized units can remain symmetric when the surrounding weights and updates are symmetric too. A constant kernel in one layer alone does not prove that they can never diverge.',
        ).toBeGreaterThan(1e-6);
        const biases = Array.from(weights[1].dataSync());
        const largestBias = Math.max.apply(
          null,
          biases.map(function (b) {
            return Math.abs(b);
          }),
        );
        expect(
          largestBias,
          'The biases in layer ' +
            (index + 1) +
            ' did not start at zero. The dense layer defaults to zero bias and random kernel weights. Random kernels supply different initial computations. Random biases are not required here. If you trained this network, training explains the changed values: the starting weights are on the network that stays out of fit().',
        ).toBe(0);
      });
    });

    it('saves the starting weights and the first model’s untrained scores', () => {
      expect(
        Array.isArray(initialWeights),
        "initialWeights is not an array. Read the first network's weights with getWeights() before fit() runs, and copy each tensor into a plain array with Array.from(w.dataSync()).",
      ).toBe(true);
      const shapes = model.getWeights().map((w) => w.shape);
      expect(
        initialWeights.length,
        'initialWeights holds ' +
          initialWeights.length +
          ' entries. getWeights() hands back one tensor per kernel and one per bias, six for this stack, and the grader needs all of them to rebuild the network.',
      ).toBe(shapes.length);
      initialWeights.forEach((values, i) => {
        const size = shapes[i].reduce((a, b) => a * b, 1);
        expect(
          Array.isArray(values) && values.length === size,
          'initialWeights[' +
            i +
            '] does not hold the ' +
            size +
            ' values of weight tensor ' +
            i +
            '. Copy each tensor out whole, in getWeights() order.',
        ).toBe(true);
      });
      [1, 3, 5].forEach((i) => {
        const largest = Math.max.apply(
          null,
          initialWeights[i].map(function (b) {
            return Math.abs(b);
          }),
        );
        expect(
          largest,
          'Save initialWeights before fit() changes the weights and biases. The starting biases should be zero.',
        ).toBe(0);
      });
      const replica = tf.sequential();
      replica.add(tf.layers.dense({ units: 24, activation: 'relu', inputShape: [8] }));
      replica.add(tf.layers.dense({ units: 12, activation: 'relu' }));
      replica.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
      replica.setWeights(initialWeights.map((values, i) => tf.tensor(values, shapes[i])));
      expect(
        maxDiff(sweepOf(replica), readSweep('sweepOne', sweepOne)),
        'sweepOne must come from the first model before training, using the same weights saved in initialWeights.',
      ).toBeLessThan(1e-6);
    });

    it('records finite scores from both untrained networks', () => {
      for (const [name, sweep] of [
        ['sweepOne', sweepOne],
        ['sweepTwo', sweepTwo],
      ]) {
        for (const score of readSweep(name, sweep)) {
          expect(Number.isFinite(score), 'Read the model output as a number.').toBe(true);
          expect(score).toBeGreaterThanOrEqual(0);
          expect(score).toBeLessThanOrEqual(1);
        }
      }
    });

    it('runs the training on the first network and leaves the second one alone', () => {
      expect(
        model.optimizer,
        'Neither network has an optimizer. Call compile() on both before training one of them.',
      ).toBeDefined();
      expect(
        second.optimizer,
        'Compile the second network too, then leave it out of training so the comparison starts with the same setup.',
      ).toBeDefined();
      expect(
        model.optimizer.iterations,
        'The optimizer on the first network applied no updates, so fit() never ran on it. compile() attaches the optimizer. It does not use it.',
      ).toBeGreaterThan(0);
      expect(
        second.optimizer.iterations,
        'Keep the second model untrained so you can compare its initial predictions with the trained model.',
      ).toBe(0);
      expect(
        maxDiff(sweepOf(second), readSweep('sweepTwo', sweepTwo)),
        'Save sweepTwo from predict() on the second, untrained model. Its fixed starting weights produce the same scores on each call.',
      ).toBeLessThan(1e-6);
      expect(
        maxDiff(sweepOf(model), readSweep('trainedSweep', trainedSweep)),
        'Save trainedSweep from predict() on the first model after training. The saved scores must match that model.',
      ).toBeLessThan(1e-6);
    });

    it('runs the requested training schedule and reports finite trained scores', () => {
      expect(firstModelFits.length, 'Train the first model once with the requested epochs and batch size.').toBe(1);
      expect(fitted.settings.epochs, 'Use the requested number of epochs.').toBe(50);
      expect(fitted.settings.batchSize, 'Use the requested batch size.').toBe(16);
      expect(fitted.settings.initialEpoch, 'Start this fit at epoch zero.').toBe(0);
      expect(fitted.settings.validationSplit, 'Train on the supplied rehearsal rows. This task has no validation split.').toBe(0);
      expect(fitted.completed.completedEpochs, 'Let the requested training schedule finish.').toBe(50);
      expect(matchingTrainingRows, 'Train on the supplied readings and matching labels. Equivalent tensor copies are accepted.').toBe(true);
      expect(model.optimizer.iterations).toBe(50 * Math.ceil(120 / 16));
      for (const value of readSweep('trainedSweep', trainedSweep)) {
        expect(Number.isFinite(value)).toBe(true);
        expect(value).toBeGreaterThanOrEqual(0);
        expect(value).toBeLessThanOrEqual(1);
      }
    });
  });
