slug: simple-network
lessonSlug: building-a-network
title: "Network setup and starting predictions"
instructions: |
  Build two models so you can compare their scores before and after training.

  1. Write `buildClassifier()`. Add dense layers with 24 ReLU units and
     `inputShape: [8]`, then 12 ReLU units, then 1 sigmoid unit. Keep the default
     starting weights. Compile with Adam, `binaryCrossentropy`, and `accuracy`.
  2. Build two independent copies. Before training, save the first model's
     weights in `initialWeights`, as one JavaScript number array per weight tensor.
  3. Run both untrained models on `readings`. Save their scores as number
     arrays named `sweepOne` and `sweepTwo`.
  4. Train only the first model with `await model.fit(readings, labels,
     { epochs: 50, batchSize: 16 })`. Run it on the same readings again and
     save its scores as the number array `trainedSweep`.

  Leave the second model untrained for comparison. The generator puts calm examples in rows 0-59 and flagged examples in rows 60-119. Report the scores you get.
  The tests check the models, saved values, and training settings. They do not
  require a particular accuracy or score gap.

  This practice model has 529 parameters. The bridge model reads 3 features
  and has 673. These scores reuse the training rows, so they cannot tell you
  how well the model handles new data.
starterCode: |
  // Given: Farah's rehearsal batch, 120 readings of eight values each. Rows
  // 0-59 are calm windows and rows 60-119 are flagged ones. The first three
  // values stand in for amplitude, zero-crossing count, and phase.
  // They differ between the two groups. The last five are extra practice
  // features drawn from the same noise distribution for both groups.
  // These generated numbers are not measurements from the ship.
  const { readings, labels } = tf.tidy(() => {
    const calmReal = tf.clipByValue(tf.randomNormal([60, 3], 0.30, 0.09, 'float32', 11), 0, 1);
    const flaggedReal = tf.clipByValue(tf.randomNormal([60, 3], 0.68, 0.09, 'float32', 23), 0, 1);
    const spare = tf.clipByValue(tf.randomNormal([120, 5], 0.50, 0.15, 'float32', 37), 0, 1);
    return {
      readings: tf.concat([tf.concat([calmReal, flaggedReal]), spare], 1),
      labels: tf.concat([tf.zeros([60, 1]), tf.ones([60, 1])]),
    };
  });

  // Called twice below to create two models with the same layers
  // but independently initialized weights.
  function buildClassifier() {
