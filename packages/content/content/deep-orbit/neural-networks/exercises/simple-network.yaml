title: "What a Compiled Network Knows"
instructions: |
  Implement buildClassifier(): dense layers of 24 ReLU units with inputShape
  [8], 12 ReLU units, and 1 sigmoid unit. Keep default initialization.
  Compile with Adam, binaryCrossentropy and the accuracy metric.
  This practice model has 529 parameters; the bridge model takes 3 features
  and has 673.

  Build two independent models. Before training, save the first model's
  weights in initialWeights as one plain number array per weight tensor.
  Record both models' predictions as number arrays, sweepOne and sweepTwo.
  Train only the first with await model.fit(readings, labels,
  { epochs: 50, batchSize: 16 }), then record its trainedSweep.
  Leave the second model untrained as a control.

  Rows 0-59 are synthetic calm examples and 60-119 are flagged examples.
  Compare the scores before and after training. The grader verifies their
  origin and the training schedule, not a required accuracy or score gap.
  This uses the training rows again, so it cannot measure generalization.
