slug: simple-network
lessonSlug: building-a-network
title: "What a Compiled Network Knows"
instructions: "Build and compile the classifier twice, sweep both networks before either one trains, then train one of them and sweep it again. buildClassifier() returns the stack: 32 units with ReLU on an inputShape of [8], then 16 units with ReLU, then a 1-unit sigmoid output, compiled with the Adam optimizer, binaryCrossentropy loss and the accuracy metric. That eight-feature front door is Farah's spec, 833 parameters against the 673 of the three-feature build wired to the bridge feed tonight. Leave the weight initialization at its defaults. Store each sweep as a plain array of numbers: sweepOne from the first network, sweepTwo from the second, and trainedSweep from the first one again after `await model.fit(readings, labels, { epochs: 50, batchSize: 16 })`. Leave the second network untrained. It is the control. Rows 0 to 59 of the batch are calm windows and rows 60 to 119 are flagged, and the grader reads every sweep against that split: the two untrained sweeps have to answer near 0.5 and tell the two groups apart by almost nothing, and the trained sweep has to tell them apart. The grader also re-runs predict() on both models, so each sweep has to be the output of the model it came from."
starterCode: |
  // Given: Farah's rehearsal batch, 120 readings of eight values each. Rows
  // 0-59 are calm windows and rows 60-119 are flagged ones. The first three
  // values are the real features (amplitude, frequency, phase, normalized)
  // and they differ between the two groups. The last five are the features
  // Farah specced that have no source in the stream yet, so both groups get
  // the same noise there.
