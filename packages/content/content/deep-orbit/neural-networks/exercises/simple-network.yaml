solutionCode: |
  const { readings, labels } = tf.tidy(() => {
    const calmReal = tf.clipByValue(tf.randomNormal([60, 3], 0.30, 0.09, 'float32', 11), 0, 1);
    const flaggedReal = tf.clipByValue(tf.randomNormal([60, 3], 0.68, 0.09, 'float32', 23), 0, 1);
    const spare = tf.clipByValue(tf.randomNormal([120, 5], 0.50, 0.15, 'float32', 37), 0, 1);
    return {
      readings: tf.concat([tf.concat([calmReal, flaggedReal]), spare], 1),
      labels: tf.concat([tf.zeros([60, 1]), tf.ones([60, 1])]),
    };
  });

  function buildClassifier() {
    const model = tf.sequential();
    model.add(tf.layers.dense({ units: 24, activation: 'relu', inputShape: [8] }));
    model.add(tf.layers.dense({ units: 12, activation: 'relu' }));
    model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
    model.compile({ optimizer: 'adam', loss: 'binaryCrossentropy', metrics: ['accuracy'] });
    return model;
  }

  const model = buildClassifier();
  const second = buildClassifier();

  const initialWeights = model.getWeights().map((w) => Array.from(w.dataSync()));

  const sweepOne = tf.tidy(() => Array.from(model.predict(readings).dataSync()));
  const sweepTwo = tf.tidy(() => Array.from(second.predict(readings).dataSync()));

  await model.fit(readings, labels, { epochs: 50, batchSize: 16 });

  const trainedSweep = tf.tidy(() => Array.from(model.predict(readings).dataSync()));
testCode: |
  describe('Compiled, then trained', () => {
    const CALM = 60;
    const avg = (a) => a.reduce((s, x) => s + x, 0) / a.length;
    // Positive when the flagged rows score higher than the calm ones, which
    // is the only thing "the network has an opinion about this archive" can
    // mean here.
    const groupGap = (sweep) => avg(sweep.slice(CALM)) - avg(sweep.slice(0, CALM));
    const sweepOf = (m) => Array.from(m.predict(readings).dataSync());
    const maxDiff = (a, b) => a.reduce((mx, v, i) => Math.max(mx, Math.abs(v - b[i])), 0);
    const readSweep = (name, value) => {
      expect(
        Array.isArray(value),
        name +
          ' is not an array of numbers. Read the prediction tensor out with dataSync() and copy it into a plain array, so the answers can be compared reading by reading.',
      ).toBe(true);
      expect(
        value.length,
        name +
          ' holds ' +
          value.length +
          ' answers. A sweep runs every row of the rehearsal batch through the network, so it comes back one answer per reading.',
      ).toBe(readings.shape[0]);
      return value;
    };

    it('builds the eight-feature stack, three stages deep', () => {
      expect(
        model.layers.map((l) => l.getConfig().units),
        'The stack does not match the spec. Three dense layers, each with the unit count the instructions give it.',
      ).toEqual([24, 12, 1]);
      expect(model.layers.map((l) => l.getConfig().activation)).toEqual(['relu', 'relu', 'sigmoid']);
      expect(
        model.outputShape,
        'There is no output shape to read until the output layer is on the model.',
      ).toEqual([null, 1]);
      expect(
        model.countParams(),
        'The parameter total is off, so one of the widths is. The first layer is priced by the eight features Farah specced.',
      ).toBe(529);
    });

    it('compiles with Adam, binary crossentropy and the accuracy metric', () => {
      expect(
        model.optimizer,
        'Nothing has been compiled yet. compile() is the call that attaches the optimizer and the loss.',
      ).toBeDefined();
      expect(model.optimizer.getClassName()).toBe('Adam');
      expect(model.loss).toBe('binaryCrossentropy');
      expect(
        model.metrics || [],
        'Nothing is being tracked. The metrics list is the third compile setting, and it is the only one that changes what the training log reports rather than how the model learns.',
      ).toContain('accuracy');
    });

    it('draws the second network separately, so there is something to compare against', () => {
      expect(
        second === model,
        'The second network is the same object as the first. buildClassifier() has to be called twice: once the first one trains, a second name for it cannot show you what an untrained network does.',
      ).toBe(false);
      expect(
        second.layers.length,
        'The second network was never built out, so there are three layers on one of these and not the other.',
      ).toBe(3);
      expect(
        second.optimizer,
        'The second network was never compiled. buildClassifier() compiles what it returns, so both draws come back ready.',
      ).toBeDefined();
    });

    it('starts the untrained network with random kernels and zero biases', () => {
      expect(
        second.layers.length,
        'There are no layers on the second network yet, so there are no starting weights to look at.',
      ).toBe(3);
      second.layers.forEach((layer, index) => {
        const weights = layer.getWeights();
        const kernel = Array.from(weights[0].dataSync());
        const spread = Math.max.apply(null, kernel) - Math.min.apply(null, kernel);
        expect(
          spread,
          'Layer ' +
            (index + 1) +
            ' holds one constant across its whole kernel. Every unit in it then computes the same output, takes the same gradient and updates in lockstep, so the layer can never come to represent different features. The random draw is what stops that, and it is already the default.',
        ).toBeGreaterThan(1e-6);
        const biases = Array.from(weights[1].dataSync());
        const largestBias = Math.max.apply(
          null,
          biases.map(function (b) {
            return Math.abs(b);
          }),
        );
        expect(
          largestBias,
          'The biases in layer ' +
            (index + 1) +
            ' did not start at zero. TensorFlow.js starts them there on purpose: the random kernel already makes the units differ, so there is no symmetry left for the bias to break. If this network was trained, that is why they moved: the starting weights are on the network that stays out of fit().',
        ).toBe(0);
      });
    });

    it('keeps the starting weights, and sweepOne is the first network answering from them', () => {
      expect(
        Array.isArray(initialWeights),
        "initialWeights is not an array. Read the first network's weights with getWeights() before fit() runs, and copy each tensor into a plain array with Array.from(w.dataSync()).",
      ).toBe(true);
      const shapes = model.getWeights().map((w) => w.shape);
      expect(
        initialWeights.length,
        'initialWeights holds ' +
          initialWeights.length +
          ' entries. getWeights() hands back one tensor per kernel and one per bias, six for this stack, and the grader needs all of them to rebuild the network.',
      ).toBe(shapes.length);
      initialWeights.forEach((values, i) => {
        const size = shapes[i].reduce((a, b) => a * b, 1);
        expect(
          Array.isArray(values) && values.length === size,
          'initialWeights[' +
            i +
            '] does not hold the ' +
            size +
            ' values of weight tensor ' +
            i +
            '. Copy each tensor out whole, in getWeights() order.',
        ).toBe(true);
      });
      [1, 3, 5].forEach((i) => {
        const largest = Math.max.apply(
          null,
          initialWeights[i].map(function (b) {
            return Math.abs(b);
          }),
        );
        expect(
          largest,
          'The biases in initialWeights are not zero, so the weights were read after fit() had moved them. The starting weights are the ones the initializer drew: read them before the training call.',
        ).toBe(0);
      });
      const replica = tf.sequential();
      replica.add(tf.layers.dense({ units: 24, activation: 'relu', inputShape: [8] }));
      replica.add(tf.layers.dense({ units: 12, activation: 'relu' }));
      replica.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
      replica.setWeights(initialWeights.map((values, i) => tf.tensor(values, shapes[i])));
      expect(
        maxDiff(sweepOf(replica), readSweep('sweepOne', sweepOne)),
        'Rebuilding the first network from initialWeights and re-running predict() does not reproduce sweepOne, so sweepOne is not that network answering while untrained. The before-picture has to come from the network itself, before fit() runs, with the weights kept from the same moment.',
      ).toBeLessThan(1e-6);
    });

    it('records finite scores from both untrained networks', () => {
      for (const [name, sweep] of [
        ['sweepOne', sweepOne],
        ['sweepTwo', sweepTwo],
      ]) {
        for (const score of readSweep(name, sweep)) {
          expect(Number.isFinite(score), 'Read the model output as a number.').toBe(true);
          expect(score).toBeGreaterThanOrEqual(0);
          expect(score).toBeLessThanOrEqual(1);
        }
      }
    });

    it('runs the training on the first network and leaves the second one alone', () => {
      expect(
        model.optimizer,
        'Neither network is compiled, so neither one owns an optimizer and fit() has nothing to run with.',
      ).toBeDefined();
      expect(
        second.optimizer,
        'The second network was never compiled, so there is no way to tell whether it was left out of the training run.',
      ).toBeDefined();
      expect(
        model.optimizer.iterations,
        'The optimizer on the first network applied no updates, so fit() never ran on it. compile() attaches the optimizer; it does not use it.',
      ).toBeGreaterThan(0);
      expect(
        second.optimizer.iterations,
        'The second network was trained too, so there is no control left. It has to stay exactly as it was drawn.',
      ).toBe(0);
      expect(
        maxDiff(sweepOf(second), readSweep('sweepTwo', sweepTwo)),
        'Re-running predict() on the second network does not reproduce sweepTwo, so sweepTwo is not that network answering. An untrained model is not random per call: the weights were drawn once, and every prediction after that is the same arithmetic.',
      ).toBeLessThan(1e-6);
      expect(
        maxDiff(sweepOf(model), readSweep('trainedSweep', trainedSweep)),
        'Re-running predict() on the trained network does not reproduce trainedSweep. Whatever is in trainedSweep, the model in front of the grader did not produce it.',
      ).toBeLessThan(1e-6);
    });

    it('runs the requested training schedule and reports finite trained scores', () => {
      expect(model.optimizer.iterations).toBe(50 * Math.ceil(120 / 16));
      for (const value of readSweep('trainedSweep', trainedSweep)) {
        expect(Number.isFinite(value)).toBe(true);
        expect(value).toBeGreaterThanOrEqual(0);
        expect(value).toBeLessThanOrEqual(1);
      }
    });
  });
