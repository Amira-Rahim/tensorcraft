slug: implement-neuron
lessonSlug: first-neuron
title: "Implement a Neuron"
instructions: |
  Help Farah write `neuron(inputs, weights, bias)`.
  Multiply each input by its matching weight, add the products, then add the bias.

  Return a scalar tensor, with shape `[]` and rank 0. Use tensor operations
  throughout so TensorFlow.js can calculate gradients during training.
  Do not copy the values into JavaScript inside the function.

  Use `tf.tidy()` to clean up temporary tensors and keep the tensor you return.
  The tests call your function with different values and input lengths.
starterCode: |
  function neuron(inputs: tf.Tensor, weights: tf.Tensor, bias: tf.Scalar): tf.Tensor {
    // weighted sum of inputs, plus bias
    return null; // your code here
  }

  const output = neuron(
    tf.tensor([1.0, 2.0, 3.0]),
    tf.tensor([0.2, 0.8, -0.5]),
    tf.scalar(0.1),
  );
solutionCode: |
  function neuron(inputs: tf.Tensor, weights: tf.Tensor, bias: tf.Scalar): tf.Tensor {
    return tf.tidy(() => tf.dot(inputs, weights).add(bias));
  }

  const output = neuron(
    tf.tensor([1.0, 2.0, 3.0]),
    tf.tensor([0.2, 0.8, -0.5]),
    tf.scalar(0.1),
  );
testCode: |
  describe('Neuron', () => {
    const readScalar = (result) => {
      expect(
        result,
        'neuron() must return a tensor. Multiply matching inputs and weights, add the products, then add the bias.',
      ).toBeDefined();
      expect(
        typeof (result && result.dataSync),
        'Return a scalar tensor, not a JavaScript number. Add the bias while the sum is still a tensor.',
      ).toBe('function');
      expect(
        result.rank,
        'Return a scalar tensor with rank 0. Sum the input-weight products, then add the bias.',
      ).toBe(0);
      return result.dataSync()[0];
    };
    // tf.__calls is the harness's call counter (fresh per run). dataSync,
    // data and arraySync are every route a value takes out of a tensor and
    // into plain JavaScript, bufferSync() included (measured: it reads
    // through dataSync), so a body that reduces the products by hand shows
    // up here while tf.dot, mul-and-sum and matMul all read zero.
    const readbacks = () =>
      (tf.__calls['tensor.dataSync'] || 0) +
      (tf.__calls['tensor.data'] || 0) +
      (tf.__calls['tensor.arraySync'] || 0);
    const callNeuron = (inputs, weights, bias) => {
      expect(
        typeof neuron,
        'neuron is not defined. Keep the function the starter handed you: the grader calls it again with arguments of its own.',
      ).toBe('function');
      const before = readbacks();
      const result = neuron(inputs, weights, bias);
      expect(
        readbacks() - before,
        'Keep the whole calculation in tensor operations so training can compute gradients. Do not use dataSync() or print() inside neuron(). Print the returned tensor outside the function.',
      ).toBe(0);
      return readScalar(result);
    };
    it('computes the starter example from the inputs and weights the starter declares', () => {
      expect(
        readScalar(output),
        'Multiply each input by the weight at the same index, sum the products, then add the bias. The starter bias is 0.1.',
      ).toBeCloseTo(0.4, 4);
      recordResult({
        kind: 'table', title: 'Farah\'s neuron score',
        summary: 'Your tensor calculation on the supplied three-input arithmetic case. The weights are fixed here; no training has run.',
        columns: ['Result', 'Value'], rows: [['Weighted score plus bias', readScalar(output)]],
      });
    });
    it('tracks different weights, not a memorized answer', () => {
      const out = callNeuron(tf.tensor([2, 1, 0]), tf.tensor([0.5, -0.5, 1.0]), tf.scalar(0.25));
      expect(
        out,
        'The tests also use different inputs, weights, and bias. Calculate from the arguments passed to neuron().',
      ).toBeCloseTo(0.75, 4);
    });
    it('handles a different input width entirely', () => {
      const out = callNeuron(tf.tensor([1, 1, 1, 1]), tf.tensor([0.1, 0.2, 0.3, 0.4]), tf.scalar(-1.0));
      expect(
        out,
        'This case has four inputs. The tensor operation must work for different input lengths.',
      ).toBeCloseTo(0.0, 4);
    });
    it('matches the reduce() equivalent on inputs, weights and a bias drawn at grade time', () => {
      for (let trial = 0; trial < 3; trial++) {
        const width = 2 + Math.floor(Math.random() * 5);
        const inputs = tf.randomUniform([width], -3, 3);
        const weights = tf.randomUniform([width], -1, 1);
        const bias = Math.random() * 2 - 1;
        const xs = Array.from(inputs.dataSync());
        const ws = Array.from(weights.dataSync());
        const expected = xs.reduce((sum, x, i) => sum + x * ws[i], bias);
        const out = callNeuron(inputs, weights, tf.scalar(bias));
        expect(
          out,
          'Calculate from the supplied inputs and weights. A fixed answer for the starter values will not work here.',
        ).toBeCloseTo(expected, 3);
      }
    });
    it('pairs each weight with its own input: raising one weight by 0.5 moves the output by half that input', () => {
      const inputs = tf.randomUniform([3], -2, 2);
      const xs = Array.from(inputs.dataSync());
      const base = [0.1, 0.1, 0.1];
      const index = Math.floor(Math.random() * 3);
      const raised = base.slice();
      raised[index] = raised[index] + 0.5;
      const before = callNeuron(inputs, tf.tensor(base), tf.scalar(0));
      const after = callNeuron(inputs, tf.tensor(raised), tf.scalar(0));
      expect(
        after - before,
        'Each weight multiplies only the input at its own index. Check how changing that weight affects the sum.',
      ).toBeCloseTo(0.5 * xs[index], 3);
    });
  });
