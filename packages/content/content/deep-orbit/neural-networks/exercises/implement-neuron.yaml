slug: implement-neuron
lessonSlug: first-neuron
title: "Implement a Neuron"
instructions: "Implement neuron(inputs, weights, bias): the weighted sum of inputs plus bias, as a scalar tensor. Use tf.dot() for the weighted sum. The grader draws its own inputs, weights and bias at grade time and checks your result against the reduce() equivalent, so compute from the arguments. It also watches for values leaving the tensors: a body that pulls the numbers out with dataSync() and totals them in JavaScript is rejected, however right the total is."
starterCode: |
  function neuron(inputs: tf.Tensor, weights: tf.Tensor, bias: tf.Scalar): tf.Tensor {
    // weighted sum of inputs, plus bias
    return null; // your code here
  }

  const output = neuron(
    tf.tensor([1.0, 2.0, 3.0]),
    tf.tensor([0.2, 0.8, -0.5]),
    tf.scalar(0.1),
  );
solutionCode: |
  function neuron(inputs: tf.Tensor, weights: tf.Tensor, bias: tf.Scalar): tf.Tensor {
    return tf.dot(inputs, weights).add(bias);
  }

  const output = neuron(
    tf.tensor([1.0, 2.0, 3.0]),
    tf.tensor([0.2, 0.8, -0.5]),
    tf.scalar(0.1),
  );
testCode: |
  describe('Neuron', () => {
    const readScalar = (result) => {
      expect(
        result,
        'neuron() handed back nothing. It has to return a tensor: pair every input with the weight at its own index, total those products, and offset the total by the bias.',
      ).toBeDefined();
      expect(
        typeof (result && result.dataSync),
        'neuron() handed back a plain number. The arithmetic can be right and the type still wrong: keep the bias on the tensor, so the result is a scalar tensor the rest of a network could go on computing with rather than a value that has already left the graph.',
      ).toBe('function');
      expect(
        result.rank,
        'neuron() handed back a tensor of rank 1 or higher, which is the number quoted below. A scalar tensor is rank 0, a single value: the products are still sitting side by side, so total them and offset that total by the bias.',
      ).toBe(0);
      return result.dataSync()[0];
    };
    // tf.__calls is the harness's call counter (fresh per run). dataSync,
    // data and arraySync are every route a value takes out of a tensor and
    // into plain JavaScript, bufferSync() included (measured: it reads
    // through dataSync), so a body that reduces the products by hand shows
    // up here while tf.dot, mul-and-sum and matMul all read zero.
    const readbacks = () =>
      (tf.__calls['tensor.dataSync'] || 0) +
      (tf.__calls['tensor.data'] || 0) +
      (tf.__calls['tensor.arraySync'] || 0);
    const callNeuron = (inputs, weights, bias) => {
      expect(
        typeof neuron,
        'neuron is not defined. Keep the function the starter handed you: the grader calls it again with arguments of its own.',
      ).toBe('function');
      const before = readbacks();
      const result = neuron(inputs, weights, bias);
      expect(
        readbacks() - before,
        'neuron() pulled values out of the tensors while it ran, and the grader counts every readback, a debug print included. The total can be right and the work still be in the wrong place: a number that has left the tensors carries no gradient, so a neuron built this way can be printed and never trained. Pair the inputs with the weights in one tensor operation, add the bias while the total is still a tensor, and keep any print outside the function.',
      ).toBe(0);
      return readScalar(result);
    };
    it('computes the starter example from the inputs and weights the starter declares', () => {
      expect(
        readScalar(output),
        'The starter calls neuron() with inputs [1, 2, 3], weights [0.2, 0.8, -0.5] and a bias of 0.1. Each input meets the weight at its own index, the three products are totalled, and the bias offsets that total. Leaving the bias off lands 0.1 short.',
      ).toBeCloseTo(0.4, 4);
    });
    it('tracks different weights, not a memorized answer', () => {
      const out = callNeuron(tf.tensor([2, 1, 0]), tf.tensor([0.5, -0.5, 1.0]), tf.scalar(0.25));
      expect(
        out,
        'Same function, different numbers: the grader called neuron() again with inputs [2, 1, 0], weights [0.5, -0.5, 1.0] and a bias of 0.25. The body has to work from the arguments it was handed, not from the starter example.',
      ).toBeCloseTo(0.75, 4);
    });
    it('handles a different input width entirely', () => {
      const out = callNeuron(tf.tensor([1, 1, 1, 1]), tf.tensor([0.1, 0.2, 0.3, 0.4]), tf.scalar(-1.0));
      expect(
        out,
        'This call carries four inputs rather than three. One tensor operation pairs up however many values arrive, so nothing in the body should be counting on a width.',
      ).toBeCloseTo(0.0, 4);
    });
    it('matches the reduce() equivalent on inputs, weights and a bias drawn at grade time', () => {
      for (let trial = 0; trial < 3; trial++) {
        const width = 2 + Math.floor(Math.random() * 5);
        const inputs = tf.randomUniform([width], -3, 3);
        const weights = tf.randomUniform([width], -1, 1);
        const bias = Math.random() * 2 - 1;
        const xs = Array.from(inputs.dataSync());
        const ws = Array.from(weights.dataSync());
        const expected = xs.reduce((sum, x, i) => sum + x * ws[i], bias);
        const out = callNeuron(inputs, weights, tf.scalar(bias));
        expect(
          out,
          'These inputs and weights were drawn at grade time, so the answer cannot have been worked out in advance. Compute from the arguments the function was handed.',
        ).toBeCloseTo(expected, 3);
      }
    });
    it('pairs each weight with its own input: raising one weight by 0.5 moves the output by half that input', () => {
      const inputs = tf.randomUniform([3], -2, 2);
      const xs = Array.from(inputs.dataSync());
      const base = [0.1, 0.1, 0.1];
      const index = Math.floor(Math.random() * 3);
      const raised = base.slice();
      raised[index] = raised[index] + 0.5;
      const before = callNeuron(inputs, tf.tensor(base), tf.scalar(0));
      const after = callNeuron(inputs, tf.tensor(raised), tf.scalar(0));
      expect(
        after - before,
        'Moving one weight moved the output by the wrong amount. Each weight scales the one input sitting at its own index, so what an input contributes is weight times input.',
      ).toBeCloseTo(0.5 * xs[index], 3);
    });
  });
