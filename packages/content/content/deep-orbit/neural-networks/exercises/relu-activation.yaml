slug: relu-activation
lessonSlug: activation-functions
title: "Apply ReLU Activation"
instructions: "Write a function `applyRelu(preActivation)` that applies the ReLU activation to any tensor of pre-activation values: negatives become zero, positives pass through unchanged, however large they are. Do it to the tensor rather than to a copy of its numbers: the grader rejects a body that drains the values out with dataSync() and maps them in JavaScript."
starterCode: |
  function applyRelu(preActivation: tf.Tensor): tf.Tensor {
    // Replace negative values with zero, keep positives unchanged
    return null; // your code here
  }
solutionCode: |
  function applyRelu(preActivation: tf.Tensor): tf.Tensor {
    return preActivation.relu();
  }
testCode: |
  describe('applyRelu', () => {
    const activate = (input) => {
      expect(
        typeof applyRelu,
        'applyRelu is not defined. Keep the function the starter handed you: the grader calls it with tensors of its own.',
      ).toBe('function');
      const out = applyRelu(input);
      expect(
        out,
        'applyRelu() handed back nothing. It has to return a tensor shaped like the one it was given, with every negative value replaced by zero.',
      ).toBeDefined();
      return out;
    };
    const NEGATIVE_WHY =
      'A negative value came back as something other than zero. ReLU replaces the whole negative half with zero, value by value, wherever the value sits in the tensor.';
    const POSITIVE_WHY =
      'A positive value came back changed. ReLU leaves every positive exactly where it was, which is the half of the definition that is easy to drop.';
    const CLAMPED_WHY =
      'This value came back clamped. ReLU has no upper limit: it replaces the negative half and leaves every other value exactly where it was, which is what separates it from the bounded variants tfjs also ships.';
    it('zeros out negatives, keeps positives', () => {
      const vals = activate(tf.tensor([-2.0, -0.5, 0.0, 1.5, 3.0])).dataSync();
      expect(vals[0], NEGATIVE_WHY).toBe(0);
      expect(vals[1], NEGATIVE_WHY).toBe(0);
      expect(vals[2], 'ReLU at zero is zero.').toBe(0);
      expect(vals[3], POSITIVE_WHY).toBeCloseTo(1.5, 5);
      expect(vals[4], POSITIVE_WHY).toBeCloseTo(3.0, 5);
    });
    it('works on a second tensor of a different length', () => {
      const vals = activate(tf.tensor([4.2, -7.0, 0.1])).dataSync();
      expect(vals[0], POSITIVE_WHY).toBeCloseTo(4.2, 5);
      expect(vals[1], NEGATIVE_WHY).toBe(0);
      expect(vals[2], POSITIVE_WHY).toBeCloseTo(0.1, 5);
    });
    it('works on a rank-2 tensor, not only a 1-D one', () => {
      const out = activate(tf.tensor2d([[-1.0, 2.0], [0.5, -0.25]]));
      expect(
        out.shape,
        'The shape changed on the way through. This activation runs on each value where it sits, so what comes back has the shape that went in.',
      ).toEqual([2, 2]);
      const vals = out.dataSync();
      expect(vals[0], NEGATIVE_WHY).toBe(0);
      expect(vals[1], POSITIVE_WHY).toBeCloseTo(2.0, 5);
      expect(vals[2], POSITIVE_WHY).toBeCloseTo(0.5, 5);
      expect(vals[3], NEGATIVE_WHY).toBe(0);
    });
    it('passes a very large positive through untouched, so a clamp with an upper limit is the wrong pick', () => {
      // The probe is a power of two, which float32 holds exactly at any
      // size, so it can be compared with toBe. 2^126 sits within a factor of
      // four of the largest finite float32, and that size is what makes this
      // check bite: every finite upper clamp below it is caught, relu6 among
      // them, and 6.5 catches that one on its own.
      const nearFloat32Max = Math.pow(2, 126);
      const vals = activate(tf.tensor([-nearFloat32Max, -6.5, 6.5, nearFloat32Max])).dataSync();
      expect(vals[0], NEGATIVE_WHY).toBe(0);
      expect(vals[1], NEGATIVE_WHY).toBe(0);
      expect(vals[2], CLAMPED_WHY).toBeCloseTo(6.5, 3);
      expect(
        vals[3],
        'A large positive came back changed. ReLU has no upper limit: it replaces the negative half and leaves every other value exactly where it was, which is what separates it from the bounded variants tfjs also ships.',
      ).toBe(nearFloat32Max);
    });
    it('runs on the tensor: the values never come out into JavaScript', () => {
      // tf.__calls is the harness's call counter (fresh per run). dataSync,
      // data and arraySync are every route a value takes out of a tensor and
      // into plain JavaScript, bufferSync() included (measured: it reads
      // through dataSync). Measured on tfjs 4.22.0: relu(), tf.relu(),
      // tf.maximum() and clipByValue() all leave these at zero.
      const readbacks = () =>
        (tf.__calls['tensor.dataSync'] || 0) +
        (tf.__calls['tensor.data'] || 0) +
        (tf.__calls['tensor.arraySync'] || 0);
      const before = readbacks();
      const out = activate(tf.tensor([-1.5, 0.25, 4.0]));
      expect(
        readbacks() - before,
        'applyRelu() pulled values out of the tensor while it ran, and the grader counts every readback, a print() or dataSync() left in for debugging included. Every answer can be right and the work still be in the wrong place: numbers that have left the tensor carry no gradient, so a layer built this way cannot be trained, and the walk costs a readback per call at inference. One elementwise operation covers the whole tensor at once, whatever its shape; keep any print outside the function.',
      ).toBe(0);
      const vals = out.dataSync();
      expect(vals[0], NEGATIVE_WHY).toBe(0);
      expect(vals[1], POSITIVE_WHY).toBeCloseTo(0.25, 5);
      expect(vals[2], POSITIVE_WHY).toBeCloseTo(4.0, 5);
    });
    it('is a function, not a lookup: matches Math.max(0, x) on a tensor drawn at grade time', () => {
      const len = 5 + Math.floor(Math.random() * 8);
      const probe = tf.randomNormal([len]);
      const input = probe.dataSync();
      const output = activate(probe).dataSync();
      expect(output).toHaveLength(len);
      for (let i = 0; i < len; i++) {
        expect(
          output[i],
          'This tensor was drawn at grade time, so no table of remembered answers covers it. The activation has to be computed from the value at each position.',
        ).toBeCloseTo(Math.max(0, input[i]), 5);
      }
    });
  });
