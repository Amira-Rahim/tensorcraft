solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  interface ScoredSpan {
    sentence: string;
    index: number;
    score: number;
  }

  function cosineSimilarity(a: number[], b: number[]): number {
    let dot = 0;
    let magA = 0;
    let magB = 0;

    for (let i = 0; i < a.length; i++) {
      dot += a[i] * b[i];
      magA += a[i] * a[i];
      magB += b[i] * b[i];
    }

    magA = Math.sqrt(magA);
    magB = Math.sqrt(magB);

    if (magA === 0 || magB === 0) return 0;
    return dot / (magA * magB);
  }

  function scorePassage(
    sentences: string[],
    queryEmbedding: number[],
    embedFn: (text: string) => number[],
    topK: number = 3
  ): ScoredSpan[] {
    const scored: ScoredSpan[] = sentences.map((sentence, index) => {
      const embedding = embedFn(sentence);
      const score = cosineSimilarity(embedding, queryEmbedding);
      return { sentence, index, score };
    });

    scored.sort((a, b) => b.score - a.score);

    return scored.slice(0, topK);
  }
testCode: |
  describe('scorePassage', () => {
    const mockEmbedFn = (text: string): number[] => {
      if (text.includes('blood pressure')) return [0.9, 0.1, 0.0];
      if (text.includes('medication')) return [0.7, 0.3, 0.1];
      if (text.includes('temperature')) return [0.1, 0.8, 0.2];
      return [0.1, 0.1, 0.1];
    };

    const sentences = [
      'Patient blood pressure is elevated.',
      'Room temperature is normal.',
      'Current medication includes lisinopril.',
      'No known allergies reported.',
    ];

    const queryEmbedding = [0.85, 0.15, 0.05];

    it('returns top-k scored spans', () => {
      const results = scorePassage(sentences, queryEmbedding, mockEmbedFn, 2);
      expect(results).toHaveLength(2);
    });

    it('ranks most relevant sentence first', () => {
      const results = scorePassage(sentences, queryEmbedding, mockEmbedFn, 2);
      expect(results[0].sentence).toContain('blood pressure');
    });

    it('includes score between 0 and 1', () => {
      const results = scorePassage(sentences, queryEmbedding, mockEmbedFn);
      results.forEach((r) => {
        expect(r.score).toBeGreaterThanOrEqual(0);
        expect(r.score).toBeLessThanOrEqual(1);
      });
    });

    it('preserves original sentence index', () => {
      const results = scorePassage(sentences, queryEmbedding, mockEmbedFn, 1);
      expect(results[0].index).toBe(0);
    });
  });

  describe('cosineSimilarity', () => {
    it('returns 1 for identical vectors', () => {
      expect(cosineSimilarity([1, 0, 0], [1, 0, 0])).toBeCloseTo(1);
    });

    it('returns 0 for orthogonal vectors', () => {
      expect(cosineSimilarity([1, 0], [0, 1])).toBeCloseTo(0);
    });

    it('handles zero vectors', () => {
      expect(cosineSimilarity([0, 0], [1, 1])).toBe(0);
    });
  });
