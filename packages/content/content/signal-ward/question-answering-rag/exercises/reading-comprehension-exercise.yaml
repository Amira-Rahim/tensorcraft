title: "Score Answer Spans with Reading Comprehension"
instructions: "Implement a scorePassage function that takes a passage (array of sentences), a query embedding, and a function to embed text. The function should embed each sentence, compute cosine similarity against the query embedding, rank sentences by score, and return the top-k sentences with their similarity scores. This mirrors how a reading comprehension model identifies the most relevant spans in a clinical document."
