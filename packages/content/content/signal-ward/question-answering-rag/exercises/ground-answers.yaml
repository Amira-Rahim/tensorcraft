title: "Build an Answer Grounding Checker"
instructions: "Implement a groundAnswer function that checks whether an answer is supported by evidence documents. For each document, compute an entailment score using the provided scoreFn. If the max entailment score exceeds the threshold, the answer is grounded. Return the grounded status, the best score, and citations for all documents above the threshold."
