solutionCode: |
  interface AttentionResult {
    output: number[][];
    weights: number[][];
  }

  function softmaxRow(row: number[]): number[] {
    const max = Math.max(...row);
    const exps = row.map(x => Math.exp(x - max));
    const sum = exps.reduce((a, b) => a + b, 0);
    return exps.map(x => x / sum);
  }

  function crossAttention(
    query: number[][],
    keys: number[][],
    values: number[][]
  ): AttentionResult {
    const dim = query[0].length;
    const scale = Math.sqrt(dim);

    // Compute scores: Q * K^T / sqrt(dim)
    const scores = query.map(q =>
      keys.map(k =>
        q.reduce((sum, qi, i) => sum + qi * k[i], 0) / scale
      )
    );

    // Softmax each row
    const weights = scores.map(row => softmaxRow(row));

    // Output = weights * V
    const output = weights.map(w =>
      values[0].map((_, d) =>
        w.reduce((sum, wi, i) => sum + wi * values[i][d], 0)
      )
    );

    return { output, weights };
  }
testCode: |
  describe('crossAttention', () => {
    it('returns correct output shape', () => {
      const query = [[1, 0], [0, 1]];
      const keys = [[1, 0], [0, 1], [1, 1]];
      const values = [[1, 0], [0, 1], [0.5, 0.5]];
      const result = crossAttention(query, keys, values);
      expect(result.output.length).toBe(2);
      expect(result.output[0].length).toBe(2);
      expect(result.weights.length).toBe(2);
      expect(result.weights[0].length).toBe(3);
    });

    it('weights sum to 1 per row', () => {
      const query = [[1, 0]];
      const keys = [[1, 0], [0, 1]];
      const values = [[1, 0], [0, 1]];
      const result = crossAttention(query, keys, values);
      const sum = result.weights[0].reduce((a, b) => a + b, 0);
      expect(Math.abs(sum - 1)).toBeLessThan(0.001);
    });

    it('attends more to matching keys', () => {
      const query = [[1, 0, 0]];
      const keys = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
      const values = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
      const result = crossAttention(query, keys, values);
      expect(result.weights[0][0]).toBeGreaterThan(result.weights[0][1]);
      expect(result.weights[0][0]).toBeGreaterThan(result.weights[0][2]);
    });

    it('output is weighted sum of values', () => {
      const query = [[1, 0]];
      const keys = [[1, 0], [0, 1]];
      const values = [[10, 0], [0, 10]];
      const result = crossAttention(query, keys, values);
      // Should attend more to first key, so output[0][0] > output[0][1]
      expect(result.output[0][0]).toBeGreaterThan(result.output[0][1]);
    });
  });
