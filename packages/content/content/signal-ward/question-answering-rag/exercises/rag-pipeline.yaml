solutionCode: |
  interface Document {
    id: string;
    text: string;
    embedding: number[];
  }

  interface RetrievalResult {
    document: Document;
    score: number;
  }

  function cosineSimilarity(a: number[], b: number[]): number {
    const dot = a.reduce((sum, ai, i) => sum + ai * b[i], 0);
    const normA = Math.sqrt(a.reduce((sum, ai) => sum + ai * ai, 0));
    const normB = Math.sqrt(b.reduce((sum, bi) => sum + bi * bi, 0));
    return normA === 0 || normB === 0 ? 0 : dot / (normA * normB);
  }

  class VectorRetriever {
    private documents: Document[] = [];

    addDocument(doc: Document): void {
      this.documents.push(doc);
    }

    retrieve(queryEmbedding: number[], k: number): RetrievalResult[] {
      const scored = this.documents.map(doc => ({
        document: doc,
        score: cosineSimilarity(queryEmbedding, doc.embedding),
      }));

      return scored
        .sort((a, b) => b.score - a.score)
        .slice(0, k);
    }
  }
testCode: |
  describe('VectorRetriever', () => {
    it('retrieves most similar documents', () => {
      const retriever = new VectorRetriever();
      retriever.addDocument({ id: 'a', text: 'allergies', embedding: [1, 0, 0] });
      retriever.addDocument({ id: 'b', text: 'medications', embedding: [0, 1, 0] });
      retriever.addDocument({ id: 'c', text: 'allergy note', embedding: [0.9, 0.1, 0] });

      const results = retriever.retrieve([1, 0, 0], 2);
      expect(results.length).toBe(2);
      expect(results[0].document.id).toBe('a');
      expect(results[1].document.id).toBe('c');
    });

    it('returns results sorted by score descending', () => {
      const retriever = new VectorRetriever();
      retriever.addDocument({ id: 'a', text: 'a', embedding: [0.5, 0.5] });
      retriever.addDocument({ id: 'b', text: 'b', embedding: [1, 0] });
      retriever.addDocument({ id: 'c', text: 'c', embedding: [0, 1] });

      const results = retriever.retrieve([1, 0], 3);
      expect(results[0].score).toBeGreaterThanOrEqual(results[1].score);
      expect(results[1].score).toBeGreaterThanOrEqual(results[2].score);
    });

    it('limits to k results', () => {
      const retriever = new VectorRetriever();
      for (let i = 0; i < 10; i++) {
        retriever.addDocument({ id: `doc${i}`, text: `text ${i}`, embedding: [Math.random(), Math.random()] });
      }
      const results = retriever.retrieve([1, 0], 3);
      expect(results.length).toBe(3);
    });

    it('returns scores between -1 and 1', () => {
      const retriever = new VectorRetriever();
      retriever.addDocument({ id: 'a', text: 'a', embedding: [1, 0] });
      const results = retriever.retrieve([0, 1], 1);
      expect(results[0].score).toBeGreaterThanOrEqual(-1);
      expect(results[0].score).toBeLessThanOrEqual(1);
    });
  });
