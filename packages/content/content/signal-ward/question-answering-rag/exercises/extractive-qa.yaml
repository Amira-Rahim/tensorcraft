solutionCode: |
  interface QAResult {
    answer: string;
    startIndex: number;
    endIndex: number;
    confidence: number;
  }

  function extractAnswer(
    startLogits: number[],
    endLogits: number[],
    tokens: string[],
    maxSpanLength: number = 10
  ): QAResult {
    let bestScore = -Infinity;
    let bestStart = 0;
    let bestEnd = 0;

    for (let s = 0; s < tokens.length; s++) {
      for (let e = s; e < Math.min(s + maxSpanLength, tokens.length); e++) {
        const score = startLogits[s] + endLogits[e];
        if (score > bestScore) {
          bestScore = score;
          bestStart = s;
          bestEnd = e;
        }
      }
    }

    const maxPossible = Math.max(...startLogits) + Math.max(...endLogits);
    const confidence = maxPossible > 0 ? bestScore / maxPossible : 0;

    return {
      answer: tokens.slice(bestStart, bestEnd + 1).join(' '),
      startIndex: bestStart,
      endIndex: bestEnd,
      confidence,
    };
  }
testCode: |
  describe('extractAnswer', () => {
    it('finds the best span', () => {
      const startLogits = [0.1, 0.8, 0.1, 0.0];
      const endLogits = [0.0, 0.1, 0.9, 0.0];
      const tokens = ['patient', 'allergic', 'to', 'penicillin'];
      const result = extractAnswer(startLogits, endLogits, tokens);
      expect(result.startIndex).toBe(1);
      expect(result.endIndex).toBe(2);
      expect(result.answer).toBe('allergic to');
    });

    it('respects maxSpanLength', () => {
      const startLogits = [0.9, 0.0, 0.0, 0.0, 0.0];
      const endLogits = [0.0, 0.0, 0.0, 0.0, 0.9];
      const tokens = ['a', 'b', 'c', 'd', 'e'];
      const result = extractAnswer(startLogits, endLogits, tokens, 2);
      expect(result.endIndex - result.startIndex).toBeLessThan(2);
    });

    it('returns confidence between 0 and 1', () => {
      const startLogits = [0.5, 0.5];
      const endLogits = [0.5, 0.5];
      const tokens = ['hello', 'world'];
      const result = extractAnswer(startLogits, endLogits, tokens);
      expect(result.confidence).toBeGreaterThanOrEqual(0);
      expect(result.confidence).toBeLessThanOrEqual(1);
    });

    it('handles single-token answers', () => {
      const startLogits = [0.1, 0.9];
      const endLogits = [0.1, 0.9];
      const tokens = ['no', 'yes'];
      const result = extractAnswer(startLogits, endLogits, tokens);
      expect(result.startIndex).toBe(1);
      expect(result.endIndex).toBe(1);
      expect(result.answer).toBe('yes');
    });
  });
