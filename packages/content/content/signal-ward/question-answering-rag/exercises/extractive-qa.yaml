title: "Build an Extractive QA Span Extractor"
instructions: "Implement an extractAnswer function that takes start logits, end logits, and an array of tokens, then returns the best answer span. The function should find the (start, end) pair with the highest combined score where start <= end and the span length is at most maxSpanLength tokens. Return the joined tokens and the confidence score."
