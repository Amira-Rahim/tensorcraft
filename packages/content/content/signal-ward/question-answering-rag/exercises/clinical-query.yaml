solutionCode: |
  type QueryIntent = 'patient_lookup' | 'lab_check' | 'medication_review' | 'allergy_check';

  interface ParsedQuery {
    intent: QueryIntent;
    medications: string[];
    conditions: string[];
    labTests: string[];
    expandedText: string;
  }

  const synonyms: Record<string, string> = {
    'blood thinner': 'anticoagulant',
    'blood sugar': 'glucose',
    'heart medicine': 'cardiovascular medication',
  };

  function classifyIntent(text: string): QueryIntent {
    if (text.includes('allerg')) return 'allergy_check';
    if (text.includes('lab') || text.includes('test') || text.includes('level') || text.includes('check')) return 'lab_check';
    if (text.includes('medication') || text.includes('drug') || text.includes('prescription')) return 'medication_review';
    return 'patient_lookup';
  }

  function extractEntities(text: string): { value: string; type: 'MEDICATION' | 'CONDITION' | 'LAB_TEST' }[] {
    const entities: { value: string; type: 'MEDICATION' | 'CONDITION' | 'LAB_TEST' }[] = [];
    const meds = ['warfarin', 'metformin', 'anticoagulant', 'cardiovascular medication'];
    const labs = ['INR', 'glucose', 'HbA1c', 'CBC'];
    const conditions = ['diabetes', 'hypertension', 'anemia'];
    for (const m of meds) { if (text.toLowerCase().includes(m.toLowerCase())) entities.push({ value: m, type: 'MEDICATION' }); }
    for (const l of labs) { if (text.toLowerCase().includes(l.toLowerCase())) entities.push({ value: l, type: 'LAB_TEST' }); }
    for (const c of conditions) { if (text.toLowerCase().includes(c.toLowerCase())) entities.push({ value: c, type: 'CONDITION' }); }
    return entities;
  }

  function parseClinicalQuery(query: string): ParsedQuery {
    let expandedText = query.toLowerCase();
    for (const [informal, formal] of Object.entries(synonyms)) {
      expandedText = expandedText.replace(informal, formal);
    }

    const intent = classifyIntent(expandedText);
    const entities = extractEntities(expandedText);

    return {
      intent,
      medications: entities.filter(e => e.type === 'MEDICATION').map(e => e.value),
      conditions: entities.filter(e => e.type === 'CONDITION').map(e => e.value),
      labTests: entities.filter(e => e.type === 'LAB_TEST').map(e => e.value),
      expandedText,
    };
  }
testCode: |
  describe('parseClinicalQuery', () => {
    it('expands synonyms', () => {
      const result = parseClinicalQuery('Check blood thinner levels');
      expect(result.expandedText).toContain('anticoagulant');
      expect(result.medications).toContain('anticoagulant');
    });

    it('classifies allergy intent', () => {
      const result = parseClinicalQuery('Does patient have any allergies?');
      expect(result.intent).toBe('allergy_check');
    });

    it('classifies lab check intent', () => {
      const result = parseClinicalQuery('Check blood sugar levels');
      expect(result.intent).toBe('lab_check');
    });

    it('extracts medications and lab tests', () => {
      const result = parseClinicalQuery('Patient on warfarin, check INR');
      expect(result.medications).toContain('warfarin');
      expect(result.labTests).toContain('INR');
    });

    it('extracts conditions', () => {
      const result = parseClinicalQuery('Patient with diabetes and hypertension');
      expect(result.conditions).toContain('diabetes');
      expect(result.conditions).toContain('hypertension');
    });
  });
