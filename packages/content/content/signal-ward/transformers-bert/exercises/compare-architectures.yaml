solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function rnnProcess(
    tokens: tf.Tensor2D,
    hiddenDim: number
  ): tf.Tensor1D {
    const seqLen = tokens.shape[0];
    const embedDim = tokens.shape[1];
    const Wih = tf.randomNormal([embedDim, hiddenDim]);
    const Whh = tf.randomNormal([hiddenDim, hiddenDim]);
    let hidden = tf.zeros([1, hiddenDim]);

    for (let t = 0; t < seqLen; t++) {
      const token = tokens.slice([t, 0], [1, embedDim]);
      const inputContrib = tf.matMul(token, Wih);
      const hiddenContrib = tf.matMul(hidden, Whh);
      hidden = tf.tanh(inputContrib.add(hiddenContrib));
    }

    return hidden.reshape([hiddenDim]) as tf.Tensor1D;
  }

  function transformerProcess(
    tokens: tf.Tensor2D,
    dk: number
  ): tf.Tensor2D {
    const embedDim = tokens.shape[1];
    const Wq = tf.randomNormal([embedDim, dk]);
    const Wk = tf.randomNormal([embedDim, dk]);
    const Wv = tf.randomNormal([embedDim, dk]);

    const Q = tf.matMul(tokens, Wq);
    const K = tf.matMul(tokens, Wk);
    const V = tf.matMul(tokens, Wv);

    const scores = tf.matMul(Q, K.transpose()).div(Math.sqrt(dk));
    const weights = tf.softmax(scores, -1);
    return tf.matMul(weights, V) as tf.Tensor2D;
  }
testCode: |
  describe('rnnProcess', () => {
    it('returns shape [hiddenDim]', () => {
      const tokens = tf.randomNormal([8, 32]) as tf.Tensor2D;
      const output = rnnProcess(tokens, 16);
      expect(output.shape).toEqual([16]);
    });
    it('returns a 1D tensor (single hidden state, not per-token)', () => {
      const tokens = tf.randomNormal([5, 16]) as tf.Tensor2D;
      const output = rnnProcess(tokens, 24);
      expect(output.rank).toBe(1);
    });
  });
  describe('transformerProcess', () => {
    it('returns shape [seqLen, dk] — output for ALL tokens', () => {
      const tokens = tf.randomNormal([8, 32]) as tf.Tensor2D;
      const output = transformerProcess(tokens, 16);
      expect(output.shape).toEqual([8, 16]);
    });
    it('preserves sequence length in output', () => {
      const tokens = tf.randomNormal([12, 64]) as tf.Tensor2D;
      const output = transformerProcess(tokens, 32);
      expect(output.shape[0]).toBe(12);
    });
  });
