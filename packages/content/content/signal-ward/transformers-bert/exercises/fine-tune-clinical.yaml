solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function createPretrainedEncoder(
    dModel: number,
    numLayers: number
  ): tf.LayersModel {
    const input = tf.input({ shape: [dModel] });
    let x: tf.SymbolicTensor = input;

    for (let i = 0; i < numLayers; i++) {
      x = tf.layers.dense({
        units: dModel,
        activation: 'relu',
        name: `encoder_layer_${i}`
      }).apply(x) as tf.SymbolicTensor;
    }

    return tf.model({ inputs: input, outputs: x });
  }

  function fineTuneForClassification(
    encoder: tf.LayersModel,
    dModel: number,
    numLabels: number,
    learningRate: number
  ): tf.LayersModel {
    const input = tf.input({ shape: [dModel] });
    const encoded = encoder.apply(input) as tf.SymbolicTensor;

    const dropped = tf.layers.dropout({ rate: 0.1 }).apply(encoded) as tf.SymbolicTensor;
    const output = tf.layers.dense({
      units: numLabels,
      activation: 'softmax'
    }).apply(dropped) as tf.SymbolicTensor;

    const model = tf.model({ inputs: input, outputs: output });
    model.compile({
      optimizer: tf.train.adam(learningRate),
      loss: 'categoricalCrossentropy',
      metrics: ['accuracy']
    });

    return model;
  }
testCode: |
  describe('createPretrainedEncoder', () => {
    it('accepts input of shape [dModel]', () => {
      const encoder = createPretrainedEncoder(32, 3);
      const input = tf.randomNormal([1, 32]);
      const output = encoder.predict(input) as tf.Tensor;
      expect(output.shape).toEqual([1, 32]);
    });
    it('produces an encoder model', () => {
      const encoder = createPretrainedEncoder(16, 4);
      expect(encoder).toBeDefined();
      expect(encoder.inputs).toBeDefined();
      expect(encoder.outputs).toBeDefined();
    });
  });
  describe('fineTuneForClassification', () => {
    it('outputs correct number of labels', () => {
      const encoder = createPretrainedEncoder(32, 2);
      const model = fineTuneForClassification(encoder, 32, 5, 2e-5);
      expect(model.outputShape).toEqual([null, 5]);
    });
    it('accepts input and produces a defined output', () => {
      const encoder = createPretrainedEncoder(16, 1);
      const model = fineTuneForClassification(encoder, 16, 3, 2e-5);
      const input = tf.randomNormal([1, 16]);
      const output = model.predict(input) as tf.Tensor;
      expect(output).toBeDefined();
      expect(output.shape).toBeDefined();
    });
    it('output shape matches numLabels for different configurations', () => {
      const encoder = createPretrainedEncoder(64, 3);
      const model = fineTuneForClassification(encoder, 64, 7, 2e-5);
      expect(model.outputShape).toEqual([null, 7]);
    });
  });
