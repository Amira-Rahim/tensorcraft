title: "Mask and Predict"
instructions: "Implement BERT's masked language modeling pipeline: (1) createMLMBatch — takes token IDs and applies the 80/10/10 masking strategy (80% [MASK] token, 10% random token, 10% unchanged) to 15% of eligible tokens (skip first and last positions for [CLS]/[SEP]). (2) mlmPredictionHead — takes encoder output and masked positions, gathers hidden states at those positions, projects to vocabulary size, and returns softmax probabilities."
