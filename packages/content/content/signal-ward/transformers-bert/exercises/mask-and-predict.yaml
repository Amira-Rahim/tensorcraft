slug: mask-and-predict
lessonSlug: bert-pretraining
title: "Apply MLM Masking + Run Prediction"
mlContent: model
instructions: "Build `maskAndPredict(tokenIds, maskTokenId, position, model)` that creates a copy of the token sequence with position replaced by maskTokenId, runs the model (which expects shape [batch, seqLen]), and returns the predicted token ID at the masked position."
starterCode: |
  function maskAndPredict(tokenIds, maskTokenId, position, model) {
    return 0;
  }
solutionCode: |
  function maskAndPredict(tokenIds, maskTokenId, position, model) {
    const arr = Array.from(tokenIds.dataSync());
    arr[position] = maskTokenId;
    const masked = tf.tensor2d([arr], [1, arr.length], 'int32');
    const logits = model.predict(masked);
    const positionLogits = logits.slice([0, position, 0], [1, 1, -1]).squeeze();
    return positionLogits.argMax().dataSync()[0];
  }
testCode: |
  describe('maskAndPredict (real tf.tensor2d + model.predict)', () => {
    it('returns argmax token id from model output', () => {
      const tokens = tf.tensor1d([1, 2, 3, 4], 'int32');
      const model = tf.sequential();
      model.add(tf.layers.embedding({ inputDim: 100, outputDim: 8, inputLength: 4 }));
      model.add(tf.layers.dense({ units: 100 }));
      const out = maskAndPredict(tokens, 99, 1, model);
      expect(typeof out).toBe('number');
      expect(out).toBeGreaterThanOrEqual(0);
      expect(out).toBeLessThan(100);
    });
  });
estimatedMinutes: 18
difficulty: intermediate
skillAxis: model_arch
