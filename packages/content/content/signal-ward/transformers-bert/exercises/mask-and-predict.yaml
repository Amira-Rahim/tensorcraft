solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  interface MLMBatch {
    inputIds: number[];
    maskedPositions: number[];
    trueLabels: number[];
  }

  function createMLMBatch(
    tokenIds: number[],
    vocabSize: number,
    maskTokenId: number,
    maskRate: number
  ): MLMBatch {
    const inputIds = [...tokenIds];
    const maskedPositions: number[] = [];
    const trueLabels: number[] = [];

    for (let i = 1; i < tokenIds.length - 1; i++) {
      if (Math.random() < maskRate) {
        maskedPositions.push(i);
        trueLabels.push(tokenIds[i]);

        const r = Math.random();
        if (r < 0.8) {
          inputIds[i] = maskTokenId;
        } else if (r < 0.9) {
          inputIds[i] = Math.floor(Math.random() * vocabSize);
        }
        // else: keep original (10%)
      }
    }

    return { inputIds, maskedPositions, trueLabels };
  }

  function mlmPredictionHead(
    encoderOutput: tf.Tensor2D,
    maskedPositions: number[],
    vocabSize: number
  ): tf.Tensor2D {
    const dModel = encoderOutput.shape[1];
    const maskedStates = tf.gather(encoderOutput, maskedPositions);
    const projection = tf.randomNormal([dModel, vocabSize]);
    const logits = tf.matMul(maskedStates, projection);
    return tf.softmax(logits, -1) as tf.Tensor2D;
  }
testCode: |
  describe('createMLMBatch', () => {
    it('does not mask first position (CLS)', () => {
      const tokenIds = [101, 50, 60, 70, 80, 102];
      const batch = createMLMBatch(tokenIds, 1000, 103, 1.0);
      expect(batch.inputIds[0]).toBe(101);
    });
    it('does not mask last position (SEP)', () => {
      const tokenIds = [101, 50, 60, 70, 80, 102];
      const batch = createMLMBatch(tokenIds, 1000, 103, 1.0);
      expect(batch.inputIds[tokenIds.length - 1]).toBe(102);
    });
    it('tracks masked positions and true labels', () => {
      const tokenIds = [101, 50, 60, 70, 80, 102];
      const batch = createMLMBatch(tokenIds, 1000, 103, 1.0);
      expect(batch.maskedPositions.length).toBeGreaterThan(0);
      expect(batch.maskedPositions.length).toBe(batch.trueLabels.length);
    });
    it('true labels match original token IDs', () => {
      const tokenIds = [101, 50, 60, 70, 80, 102];
      const batch = createMLMBatch(tokenIds, 1000, 103, 1.0);
      batch.maskedPositions.forEach((pos, idx) => {
        expect(batch.trueLabels[idx]).toBe(tokenIds[pos]);
      });
    });
  });
  describe('mlmPredictionHead', () => {
    it('returns shape [numMasked, vocabSize]', () => {
      const encoderOut = tf.randomNormal([10, 32]) as tf.Tensor2D;
      const predictions = mlmPredictionHead(encoderOut, [1, 3, 5], 1000);
      expect(predictions.shape).toEqual([3, 1000]);
    });
    it('outputs valid probabilities (sum to 1 per row)', async () => {
      const encoderOut = tf.randomNormal([8, 16]) as tf.Tensor2D;
      const predictions = mlmPredictionHead(encoderOut, [2, 4], 500);
      const sumsData = Array.from(predictions.sum(-1).dataSync());
      sumsData.forEach(s => expect(s).toBeCloseTo(1.0, 2));
    });
  });
