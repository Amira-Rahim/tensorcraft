solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function layerNorm(x: tf.Tensor2D): tf.Tensor2D {
    const mean = x.mean(-1, true);
    const variance = x.sub(mean).square().mean(-1, true);
    return x.sub(mean).div(variance.add(1e-6).sqrt()) as tf.Tensor2D;
  }

  function multiHeadAttention(
    x: tf.Tensor2D,
    dModel: number,
    numHeads: number
  ): tf.Tensor2D {
    const dk = dModel / numHeads;
    const heads: tf.Tensor2D[] = [];

    for (let h = 0; h < numHeads; h++) {
      const Wq = tf.randomNormal([dModel, dk]);
      const Wk = tf.randomNormal([dModel, dk]);
      const Wv = tf.randomNormal([dModel, dk]);

      const Q = tf.matMul(x, Wq);
      const K = tf.matMul(x, Wk);
      const V = tf.matMul(x, Wv);

      const scores = tf.softmax(
        tf.matMul(Q, K.transpose()).div(Math.sqrt(dk)), -1
      );
      heads.push(tf.matMul(scores, V) as tf.Tensor2D);
    }

    const concat = tf.concat(heads, 1) as tf.Tensor2D;
    const Wo = tf.randomNormal([dModel, dModel]);
    return tf.matMul(concat, Wo) as tf.Tensor2D;
  }

  function encoderBlock(
    x: tf.Tensor2D,
    dModel: number,
    numHeads: number,
    dFF: number
  ): tf.Tensor2D {
    // Sub-layer 1: attention + residual + norm
    const attnOut = multiHeadAttention(x, dModel, numHeads);
    const norm1 = layerNorm(x.add(attnOut) as tf.Tensor2D);

    // Sub-layer 2: feed-forward + residual + norm
    const W1 = tf.randomNormal([dModel, dFF]);
    const W2 = tf.randomNormal([dFF, dModel]);
    const ffHidden = tf.relu(tf.matMul(norm1, W1));
    const ffOut = tf.matMul(ffHidden, W2) as tf.Tensor2D;
    const norm2 = layerNorm(norm1.add(ffOut) as tf.Tensor2D);

    return norm2;
  }
testCode: |
  describe('multiHeadAttention', () => {
    it('returns shape [seqLen, dModel]', () => {
      const x = tf.randomNormal([6, 32]) as tf.Tensor2D;
      const output = multiHeadAttention(x, 32, 4);
      expect(output.shape).toEqual([6, 32]);
    });
  });
  describe('encoderBlock', () => {
    it('preserves input shape [seqLen, dModel]', () => {
      const x = tf.randomNormal([8, 32]) as tf.Tensor2D;
      const output = encoderBlock(x, 32, 4, 128);
      expect(output.shape).toEqual([8, 32]);
    });
    it('output is normalized (mean close to 0)', async () => {
      const x = tf.randomNormal([4, 16]) as tf.Tensor2D;
      const output = encoderBlock(x, 16, 2, 64);
      const mean = await output.mean().array();
      expect(Math.abs(mean)).toBeLessThan(1.0);
    });
    it('stacking multiple blocks preserves shape', () => {
      let x = tf.randomNormal([6, 32]) as tf.Tensor2D;
      for (let i = 0; i < 3; i++) {
        x = encoderBlock(x, 32, 4, 128);
      }
      expect(x.shape).toEqual([6, 32]);
    });
  });
