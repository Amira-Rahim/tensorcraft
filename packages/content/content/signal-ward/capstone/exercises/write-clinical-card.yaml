lessonSlug: clinical-documentation
title: "Write a Clinical Model Card"
instructions: "Create a function that generates a formatted clinical model card string from structured metadata. The card should include sections for the model name and version header, Performance metrics (precision, recall, F1 as percentages), Known Limitations (bulleted list), and Usage details (input and output format)."
starterCode: |
  interface ClinicalModelMeta {
    name: string;
    version: string;
    precision: number;
    recall: number;
    f1: number;
    limitations: string[];
    inputFormat: string;
    outputFormat: string;
  }

  function generateClinicalCard(meta: ClinicalModelMeta): string {
    // Return a formatted string with these sections:
    // # {name} v{version}
    //
    // ## Performance
    // - Precision: {precision as percentage with 1 decimal}%
    // - Recall: {recall as percentage with 1 decimal}%
    // - F1 Score: {f1 as percentage with 1 decimal}%
    //
    // ## Known Limitations
    // - {each limitation on its own line}
    //
    // ## Usage
    // - Input: {inputFormat}
    // - Output: {outputFormat}
    return ''; // your code here
  }
solutionCode: |
  interface ClinicalModelMeta {
    name: string;
    version: string;
    precision: number;
    recall: number;
    f1: number;
    limitations: string[];
    inputFormat: string;
    outputFormat: string;
  }

  function generateClinicalCard(meta: ClinicalModelMeta): string {
    const lines = [
      `# ${meta.name} v${meta.version}`,
      '',
      '## Performance',
      `- Precision: ${(meta.precision * 100).toFixed(1)}%`,
      `- Recall: ${(meta.recall * 100).toFixed(1)}%`,
      `- F1 Score: ${(meta.f1 * 100).toFixed(1)}%`,
      '',
      '## Known Limitations',
      ...meta.limitations.map(l => `- ${l}`),
      '',
      '## Usage',
      `- Input: ${meta.inputFormat}`,
      `- Output: ${meta.outputFormat}`,
    ];
    return lines.join('\n');
  }
testCode: |
  describe('generateClinicalCard', () => {
    const meta: ClinicalModelMeta = {
      name: 'Diagnostic One',
      version: '1.0.0',
      precision: 0.89,
      recall: 0.84,
      f1: 0.86,
      limitations: [
        'English only',
        'No drug-food interactions',
        'Not validated for pediatric use',
      ],
      inputFormat: 'Clinical text (UTF-8, max 2048 tokens)',
      outputFormat: '{ entities[], interactions[], confidence }',
    };

    it('includes model name and version', () => {
      const card = generateClinicalCard(meta);
      expect(card).toContain('# Diagnostic One v1.0.0');
    });

    it('includes precision as percentage', () => {
      const card = generateClinicalCard(meta);
      expect(card).toContain('- Precision: 89.0%');
    });

    it('includes recall as percentage', () => {
      const card = generateClinicalCard(meta);
      expect(card).toContain('- Recall: 84.0%');
    });

    it('includes F1 as percentage', () => {
      const card = generateClinicalCard(meta);
      expect(card).toContain('- F1 Score: 86.0%');
    });

    it('lists all limitations', () => {
      const card = generateClinicalCard(meta);
      expect(card).toContain('- English only');
      expect(card).toContain('- No drug-food interactions');
      expect(card).toContain('- Not validated for pediatric use');
    });

    it('includes input and output format', () => {
      const card = generateClinicalCard(meta);
      expect(card).toContain('- Input: Clinical text (UTF-8, max 2048 tokens)');
      expect(card).toContain('- Output: { entities[], interactions[], confidence }');
    });

    it('has all section headers', () => {
      const card = generateClinicalCard(meta);
      expect(card).toContain('## Performance');
      expect(card).toContain('## Known Limitations');
      expect(card).toContain('## Usage');
    });
  });
estimatedMinutes: 15
difficulty: intermediate
