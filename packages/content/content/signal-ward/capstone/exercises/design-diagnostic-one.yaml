title: "Design the Diagnostic One Pipeline"
instructions: "Build a DiagnosticPipeline class that registers named stages with typed process functions and dependencies, then executes them in order. Each stage receives the merged results of its dependencies. If a stage fails, use its fallback function. The run method returns the final merged results of all stages."
