title: "Validate Against Expert Annotations"
instructions: "Implement a computeMetrics function that compares model predictions against expert annotations and returns precision, recall, and F1 score. A prediction matches an annotation if they share the same label and their spans overlap (a.start < b.end AND b.start < a.end). Each annotation can only be matched once."
starterCode: |
  interface Annotation {
    label: string;
    span: [number, number];
  }

  interface Prediction {
    label: string;
    span: [number, number];
    confidence: number;
  }

  interface Metrics {
    precision: number;
    recall: number;
    f1: number;
  }

  function computeMetrics(
    predictions: Prediction[],
    annotations: Annotation[]
  ): Metrics {
    // 1. For each prediction, find a matching annotation (same label, overlapping spans)
    // 2. Each annotation can only be matched once
    // 3. truePositives = matched predictions
    // 4. falsePositives = unmatched predictions
    // 5. falseNegatives = unmatched annotations
    // 6. precision = tp / (tp + fp), recall = tp / (tp + fn)
    // 7. f1 = 2 * precision * recall / (precision + recall)
    // 8. Handle division by zero — return 0
    return { precision: 0, recall: 0, f1: 0 }; // your code here
  }
solutionCode: |
  interface Annotation {
    label: string;
    span: [number, number];
  }

  interface Prediction {
    label: string;
    span: [number, number];
    confidence: number;
  }

  interface Metrics {
    precision: number;
    recall: number;
    f1: number;
  }

  function computeMetrics(
    predictions: Prediction[],
    annotations: Annotation[]
  ): Metrics {
    const matched = new Set<number>();
    let truePositives = 0;

    for (const pred of predictions) {
      const matchIdx = annotations.findIndex((ann, idx) =>
        !matched.has(idx) &&
        ann.label === pred.label &&
        ann.span[0] < pred.span[1] &&
        pred.span[0] < ann.span[1]
      );

      if (matchIdx >= 0) {
        truePositives++;
        matched.add(matchIdx);
      }
    }

    const falsePositives = predictions.length - truePositives;
    const falseNegatives = annotations.length - matched.size;

    const precision = truePositives + falsePositives > 0
      ? truePositives / (truePositives + falsePositives)
      : 0;
    const recall = truePositives + falseNegatives > 0
      ? truePositives / (truePositives + falseNegatives)
      : 0;
    const f1 = precision + recall > 0
      ? 2 * precision * recall / (precision + recall)
      : 0;

    return { precision, recall, f1 };
  }
testCode: |
  describe('computeMetrics', () => {
    it('computes perfect scores for exact matches', () => {
      const predictions = [
        { label: 'DRUG', span: [0, 10] as [number, number], confidence: 0.9 },
        { label: 'CONDITION', span: [15, 30] as [number, number], confidence: 0.8 },
      ];
      const annotations = [
        { label: 'DRUG', span: [0, 10] as [number, number] },
        { label: 'CONDITION', span: [15, 30] as [number, number] },
      ];
      const m = computeMetrics(predictions, annotations);
      expect(m.precision).toBe(1);
      expect(m.recall).toBe(1);
      expect(m.f1).toBe(1);
    });

    it('counts false positives (predictions with no matching annotation)', () => {
      const predictions = [
        { label: 'DRUG', span: [0, 10] as [number, number], confidence: 0.9 },
        { label: 'DRUG', span: [50, 60] as [number, number], confidence: 0.6 },
      ];
      const annotations = [
        { label: 'DRUG', span: [0, 10] as [number, number] },
      ];
      const m = computeMetrics(predictions, annotations);
      expect(m.precision).toBe(0.5);
      expect(m.recall).toBe(1);
    });

    it('counts false negatives (annotations with no matching prediction)', () => {
      const predictions = [
        { label: 'DRUG', span: [0, 10] as [number, number], confidence: 0.9 },
      ];
      const annotations = [
        { label: 'DRUG', span: [0, 10] as [number, number] },
        { label: 'CONDITION', span: [20, 40] as [number, number] },
      ];
      const m = computeMetrics(predictions, annotations);
      expect(m.precision).toBe(1);
      expect(m.recall).toBe(0.5);
    });

    it('requires matching labels for a match', () => {
      const predictions = [
        { label: 'DOSAGE', span: [0, 10] as [number, number], confidence: 0.9 },
      ];
      const annotations = [
        { label: 'DRUG', span: [0, 10] as [number, number] },
      ];
      const m = computeMetrics(predictions, annotations);
      expect(m.precision).toBe(0);
      expect(m.recall).toBe(0);
      expect(m.f1).toBe(0);
    });

    it('handles overlapping spans', () => {
      const predictions = [
        { label: 'DRUG', span: [5, 15] as [number, number], confidence: 0.9 },
      ];
      const annotations = [
        { label: 'DRUG', span: [0, 10] as [number, number] },
      ];
      const m = computeMetrics(predictions, annotations);
      expect(m.precision).toBe(1);
      expect(m.recall).toBe(1);
    });

    it('returns zeros for empty inputs', () => {
      const m = computeMetrics([], []);
      expect(m.precision).toBe(0);
      expect(m.recall).toBe(0);
      expect(m.f1).toBe(0);
    });
  });
