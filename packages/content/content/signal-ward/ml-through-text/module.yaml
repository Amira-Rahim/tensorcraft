description: "A pharmacist's good memory is the only reason the vendor NLP system's mistake didn't reach a patient. Dr. Karimi cancels the contract and assembles her own team to build Diagnostic One. The first problem is foundational: a model only understands numbers, and a clinical note is anything but. By the end you have a pipeline that takes a raw note in one end and returns a probability at the other, with one misfiled allergy note still sitting at the top of Khalil's list."
