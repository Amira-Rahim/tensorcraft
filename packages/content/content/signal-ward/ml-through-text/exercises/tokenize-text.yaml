slug: tokenize-text
lessonSlug: tokens-and-vocabulary
title: "Tokenize + Pad to Fixed Length"
mlContent: data
instructions: "Build `tokenizeAndPad(text, vocab, maxLen)` that tokenizes by whitespace, looks up vocab (0 for unknown), truncates to maxLen if longer, pads with 0 if shorter, and returns a 1D int32 tensor of length maxLen."
starterCode: |
  function tokenizeAndPad(text, vocab, maxLen) {
    return null;
  }
solutionCode: |
  function tokenizeAndPad(text, vocab, maxLen) {
    const words = text.toLowerCase().split(/\s+/).filter(w => w.length > 0);
    const ids = words.map(w => vocab.get(w) ?? 0);
    while (ids.length < maxLen) ids.push(0);
    if (ids.length > maxLen) ids.length = maxLen;
    return tf.tensor1d(ids, 'int32');
  }
testCode: |
  describe('tokenizeAndPad (real tf.tensor1d)', () => {
    it('pads shorter inputs to maxLen', () => {
      const vocab = new Map([['hi', 1]]);
      const t = tokenizeAndPad('hi', vocab, 5);
      expect(Array.from(t.dataSync())).toEqual([1, 0, 0, 0, 0]);
    });
    it('truncates longer inputs', () => {
      const vocab = new Map([['a', 1], ['b', 2], ['c', 3], ['d', 4]]);
      const t = tokenizeAndPad('a b c d', vocab, 2);
      expect(Array.from(t.dataSync())).toEqual([1, 2]);
    });
    it('exactly fits maxLen', () => {
      const vocab = new Map([['x', 7]]);
      const t = tokenizeAndPad('x x x', vocab, 3);
      expect(Array.from(t.dataSync())).toEqual([7, 7, 7]);
    });
  });
