solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  const vocab = ['patient', 'chest', 'pain', 'allergy', 'medication'];

  function textToVector(text: string, vocabulary: string[]): number[] {
    const words = text.toLowerCase().split(/\s+/);
    return vocabulary.map(v => words.filter(w => w === v).length);
  }

  const vector = textToVector('Patient reports chest pain and chest tightness', vocab);
  const tensor = tf.tensor(vector);
testCode: |
  describe('Bag of Words', () => {
    it('returns an array', () => { expect(Array.isArray(textToVector('test', vocab))).toBe(true); });
    it('has correct length', () => { expect(textToVector('test', vocab).length).toBe(5); });
    it('counts correctly', () => { expect(textToVector('Patient reports chest pain and chest tightness', vocab)).toEqual([1, 2, 1, 0, 0]); });
    it('handles empty text', () => { expect(textToVector('', vocab)).toEqual([0, 0, 0, 0, 0]); });
  });
