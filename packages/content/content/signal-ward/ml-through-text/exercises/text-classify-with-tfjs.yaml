slug: text-classify-with-tfjs
lessonSlug: sw-forward-pass
title: "Text Classification Forward Pass"
instructions: "Build `classifyText(tokenIds, embedding, classifier)` that embeds a sequence of token IDs (tensor [seqLen]), averages the embeddings into a single sentence vector, and runs it through a classifier dense layer that returns logits."
mlContent: arithmetic
starterCode: |
  function classifyText(tokenIds, embedding, classifier) {
    return null;
  }
solutionCode: |
  function classifyText(tokenIds, embedding, classifier) {
    const embedded = embedding.apply(tokenIds.reshape([1, tokenIds.shape[0]]));
    const sentenceVec = embedded.mean(1);
    const logits = classifier.apply(sentenceVec);
    return logits;
  }
testCode: |
  describe('classifyText (real layers + tensor ops)', () => {
    it('returns logits with shape [1, numClasses]', () => {
      const tokens = tf.tensor1d([1, 2, 3], 'int32');
      const embedding = tf.layers.embedding({ inputDim: 100, outputDim: 16 });
      const classifier = tf.layers.dense({ units: 5, inputShape: [16] });
      const out = classifyText(tokens, embedding, classifier);
      expect(out.shape).toEqual([1, 5]);
    });

    it('handles single-token input', () => {
      const tokens = tf.tensor1d([1], 'int32');
      const embedding = tf.layers.embedding({ inputDim: 10, outputDim: 4 });
      const classifier = tf.layers.dense({ units: 2, inputShape: [4] });
      const out = classifyText(tokens, embedding, classifier);
      expect(out.shape).toEqual([1, 2]);
    });
  });
estimatedMinutes: 15
difficulty: intermediate
skillAxis: model_arch
