title: "Build a Production NLP API"
instructions: "Implement an NLPApi class that validates requests, runs a prediction function, enforces a latency budget, and returns structured responses. The predict method should: (1) validate that text is a non-empty string (return an error response if not), (2) check if the model is ready (return error if not), (3) run the prediction within the latency budget using a timeout, (4) return a structured response with requestId, label, confidence, and processingTimeMs. Use sequential request IDs like 'req-1', 'req-2', etc."
