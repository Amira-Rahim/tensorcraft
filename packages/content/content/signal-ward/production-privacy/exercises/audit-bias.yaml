solutionCode: |
  interface DataSlice {
    name: string;
    samples: { input: any; trueLabel: number }[];
  }

  interface SliceResult {
    name: string;
    accuracy: number;
    sampleCount: number;
  }

  interface FairnessReport {
    slices: SliceResult[];
    bestSlice: string;
    worstSlice: string;
    disparity: number;
    meetsThreshold: boolean;
  }

  function auditBias(
    predictFn: (input: any) => number,
    slices: DataSlice[],
    equityThreshold: number = 0.05
  ): FairnessReport {
    const sliceResults: SliceResult[] = slices.map(slice => {
      let correct = 0;
      for (const sample of slice.samples) {
        const prediction = predictFn(sample.input);
        if (prediction === sample.trueLabel) correct++;
      }
      return {
        name: slice.name,
        accuracy: correct / slice.samples.length,
        sampleCount: slice.samples.length,
      };
    });

    const best = sliceResults.reduce((a, b) => a.accuracy > b.accuracy ? a : b);
    const worst = sliceResults.reduce((a, b) => a.accuracy < b.accuracy ? a : b);
    const disparity = best.accuracy - worst.accuracy;

    return {
      slices: sliceResults,
      bestSlice: best.name,
      worstSlice: worst.name,
      disparity,
      meetsThreshold: disparity <= equityThreshold,
    };
  }
testCode: |
  describe('auditBias', () => {
    it('computes per-slice accuracy', () => {
      const predict = (x: number) => x > 5 ? 1 : 0;
      const slices: DataSlice[] = [
        { name: 'groupA', samples: [{ input: 10, trueLabel: 1 }, { input: 3, trueLabel: 0 }] },
        { name: 'groupB', samples: [{ input: 10, trueLabel: 1 }, { input: 3, trueLabel: 1 }] },
      ];
      const report = auditBias(predict, slices);
      expect(report.slices.find(s => s.name === 'groupA')?.accuracy).toBe(1);
      expect(report.slices.find(s => s.name === 'groupB')?.accuracy).toBe(0.5);
    });

    it('identifies best and worst slices', () => {
      const predict = (x: string) => x === 'a' ? 1 : 0;
      const slices: DataSlice[] = [
        { name: 'high', samples: [{ input: 'a', trueLabel: 1 }, { input: 'a', trueLabel: 1 }] },
        { name: 'low', samples: [{ input: 'a', trueLabel: 0 }, { input: 'b', trueLabel: 1 }] },
      ];
      const report = auditBias(predict, slices);
      expect(report.bestSlice).toBe('high');
      expect(report.worstSlice).toBe('low');
    });

    it('calculates disparity correctly', () => {
      const predict = () => 1;
      const slices: DataSlice[] = [
        { name: 'all1', samples: [{ input: 0, trueLabel: 1 }] },
        { name: 'all0', samples: [{ input: 0, trueLabel: 0 }] },
      ];
      const report = auditBias(predict, slices);
      expect(report.disparity).toBe(1);
      expect(report.meetsThreshold).toBe(false);
    });

    it('meets threshold when disparity is small', () => {
      const predict = () => 1;
      const slices: DataSlice[] = [
        { name: 'a', samples: [{ input: 0, trueLabel: 1 }] },
        { name: 'b', samples: [{ input: 0, trueLabel: 1 }] },
      ];
      const report = auditBias(predict, slices);
      expect(report.disparity).toBe(0);
      expect(report.meetsThreshold).toBe(true);
    });

    it('tracks sample counts per slice', () => {
      const predict = () => 1;
      const slices: DataSlice[] = [
        { name: 'small', samples: [{ input: 0, trueLabel: 1 }] },
        { name: 'large', samples: [{ input: 0, trueLabel: 1 }, { input: 1, trueLabel: 0 }, { input: 2, trueLabel: 1 }] },
      ];
      const report = auditBias(predict, slices);
      expect(report.slices.find(s => s.name === 'small')?.sampleCount).toBe(1);
      expect(report.slices.find(s => s.name === 'large')?.sampleCount).toBe(3);
    });
  });
