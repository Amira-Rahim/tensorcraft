title: "Audit a Model for Demographic Bias"
instructions: "Implement an auditBias function that evaluates a prediction function across demographic slices. For each slice, run the prediction function on all samples and compute accuracy (correct predictions / total). Then identify the best and worst performing slices, calculate the disparity (best accuracy minus worst accuracy), and determine whether the model meets the equity threshold (disparity <= threshold). Return a FairnessReport with all slice results and disparity information."
