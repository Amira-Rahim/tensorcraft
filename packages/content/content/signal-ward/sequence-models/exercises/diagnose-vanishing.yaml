solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function simulateGradientDecay(
    seqLength: number,
    weightFactor: number,
    initialGradient: number
  ): number[] {
    const gradients: number[] = [initialGradient];
    let grad = initialGradient;
    for (let t = 1; t < seqLength; t++) {
      grad *= weightFactor;
      gradients.push(grad);
    }
    return gradients;
  }

  function diagnoseVanishing(gradients: number[], threshold: number): boolean {
    return gradients[gradients.length - 1] < threshold;
  }

  const rnnGradients = simulateGradientDecay(50, 0.9, 1.0);
  const highwayGradients = simulateGradientDecay(50, 1.0, 1.0);
  const isVanishing = diagnoseVanishing(rnnGradients, 1e-4);
  const isHighwayVanishing = diagnoseVanishing(highwayGradients, 1e-4);

  const gradTensor = tf.tensor1d(rnnGradients);
testCode: |
  describe('Diagnose Vanishing Gradients', () => {
    it('returns correct number of gradient values', () => {
      expect(rnnGradients.length).toBe(50);
    });
    it('first gradient equals initial value', () => {
      expect(rnnGradients[0]).toBeCloseTo(1.0, 5);
    });
    it('gradients decay with weight < 1', () => {
      expect(rnnGradients[49]).toBeLessThan(rnnGradients[0]);
      expect(rnnGradients[49]).toBeLessThan(0.01);
    });
    it('diagnoses vanishing correctly', () => {
      // 0.9^49 ≈ 5e-3, which is below 1e-2 (well below threshold for demonstrating decay)
      const deepGradients = simulateGradientDecay(150, 0.9, 1.0);
      expect(diagnoseVanishing(deepGradients, 1e-4)).toBe(true);
    });
    it('gradient highway does not vanish', () => {
      expect(highwayGradients[49]).toBeCloseTo(1.0, 5);
      expect(isHighwayVanishing).toBe(false);
    });
    it('creates valid tensor from gradients', () => {
      expect(gradTensor.shape).toEqual([50]);
    });
  });
