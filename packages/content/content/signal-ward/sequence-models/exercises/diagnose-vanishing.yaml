slug: diagnose-vanishing
lessonSlug: vanishing-gradients
title: "Detect Vanishing Gradients via tf.grad"
instructions: "Build `measureGradientMagnitude(depth)` that constructs a depth-layer chain of sigmoid activations applied to a single scalar variable, computes the gradient via tf.grad, and returns the gradient magnitude. Demonstrate empirically that gradient shrinks toward zero as depth grows."
mlContent: training
starterCode: |
  function measureGradientMagnitude(depth) {
    return 0;
  }
solutionCode: |
  function measureGradientMagnitude(depth) {
    const f = (x) => {
      let h = x;
      for (let i = 0; i < depth; i++) {
        h = tf.sigmoid(h);
      }
      return h;
    };
    const grad = tf.grad(f);
    const x = tf.scalar(0.5);
    const g = grad(x);
    return Math.abs(g.dataSync()[0]);
  }
testCode: |
  describe('measureGradientMagnitude (real tf.grad)', () => {
    it('returns positive magnitude for shallow chain', () => {
      const g = measureGradientMagnitude(1);
      expect(g).toBeGreaterThan(0);
    });

    it('gradient shrinks with depth (vanishing)', () => {
      const shallow = measureGradientMagnitude(2);
      const deep = measureGradientMagnitude(10);
      expect(deep).toBeLessThan(shallow);
    });

    it('very deep chain produces tiny gradient', () => {
      const g = measureGradientMagnitude(20);
      expect(g).toBeLessThan(0.01);
    });
  });
estimatedMinutes: 15
difficulty: advanced
skillAxis: training
