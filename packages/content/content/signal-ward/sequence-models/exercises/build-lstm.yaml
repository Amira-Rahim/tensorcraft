solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function buildLstmModel(): tf.Sequential {
    const model = tf.sequential();
    model.add(tf.layers.embedding({
      inputDim: 300,
      outputDim: 32,
      inputLength: 50,
    }));
    model.add(tf.layers.lstm({
      units: 32,
      returnSequences: false,
    }));
    model.add(tf.layers.dense({
      units: 1,
      activation: 'sigmoid',
    }));
    model.compile({
      optimizer: 'adam',
      loss: 'binaryCrossentropy',
    });
    return model;
  }

  function buildGruModel(): tf.Sequential {
    const model = tf.sequential();
    model.add(tf.layers.embedding({
      inputDim: 300,
      outputDim: 32,
      inputLength: 50,
    }));
    model.add(tf.layers.gru({
      units: 32,
      returnSequences: false,
    }));
    model.add(tf.layers.dense({
      units: 1,
      activation: 'sigmoid',
    }));
    model.compile({
      optimizer: 'adam',
      loss: 'binaryCrossentropy',
    });
    return model;
  }

  function getParamCount(model: tf.Sequential): number {
    return model.countParams();
  }

  const lstmModel = buildLstmModel();
  const gruModel = buildGruModel();
  const lstmParams = getParamCount(lstmModel);
  const gruParams = getParamCount(gruModel);
testCode: |
  describe('Build an LSTM Model', () => {
    it('LSTM model has 3 layers', () => {
      expect(lstmModel.layers.length).toBe(3);
    });
    it('second layer is LSTM', () => {
      expect(lstmModel.layers[1].getClassName()).toBe('LSTM');
    });
    it('GRU model has 3 layers', () => {
      expect(gruModel.layers.length).toBe(3);
    });
    it('GRU second layer is GRU', () => {
      expect(gruModel.layers[1].getClassName()).toBe('GRU');
    });
    it('LSTM has at least as many parameters as GRU', () => {
      // In real TFJS LSTM has 4 gates vs GRU's 3, so LSTM > GRU.
      // The test harness mock may not reflect this exactly — accept equality too.
      expect(lstmParams).toBeGreaterThanOrEqual(gruParams);
    });
    it('LSTM produces valid prediction', async () => {
      const input = tf.zeros([1, 50], 'int32');
      const pred = lstmModel.predict(input) as tf.Tensor;
      const val = (await pred.array()) as number[][];
      expect(val[0][0]).toBeGreaterThanOrEqual(0);
      expect(val[0][0]).toBeLessThanOrEqual(1);
      tf.dispose([input, pred]);
    });
    it('parameter counts are positive', () => {
      expect(lstmParams).toBeGreaterThan(0);
      expect(gruParams).toBeGreaterThan(0);
    });
  });
