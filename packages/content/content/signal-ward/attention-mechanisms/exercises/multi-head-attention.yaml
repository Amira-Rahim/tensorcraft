slug: multi-head-attention
lessonSlug: multi-head-attention
title: "Implement Multi-Head Attention"
instructions: "Run h parallel scaled-dot-product attentions with separate per-head projections, then concatenate. Build `multiHeadAttention(X, headProjections)` where headProjections is an array of {Wq, Wk, Wv} per head. Concatenate per-head outputs along the feature axis."
mlContent: data
starterCode: |
  function multiHeadAttention(X, headProjections) {
    return null;
  }
solutionCode: |
  function multiHeadAttention(X, headProjections) {
    const heads = headProjections.map(({ Wq, Wk, Wv }) => {
      const Q = tf.matMul(X, Wq);
      const K = tf.matMul(X, Wk);
      const V = tf.matMul(X, Wv);
      const dK = K.shape[K.shape.length - 1];
      const scores = tf.matMul(Q, K, false, true).div(tf.scalar(Math.sqrt(dK)));
      const weights = tf.softmax(scores);
      return tf.matMul(weights, V);
    });
    return tf.concat(heads, 1);
  }
testCode: |
  describe('multiHeadAttention (real tf.matMul + concat)', () => {
    it('concatenates head outputs along feature axis', () => {
      const X = tf.randomNormal([4, 8]);
      const heads = [
        { Wq: tf.randomNormal([8, 4]), Wk: tf.randomNormal([8, 4]), Wv: tf.randomNormal([8, 4]) },
        { Wq: tf.randomNormal([8, 4]), Wk: tf.randomNormal([8, 4]), Wv: tf.randomNormal([8, 4]) },
      ];
      const out = multiHeadAttention(X, heads);
      expect(out.shape).toEqual([4, 8]);
    });

    it('handles single head (degenerate case)', () => {
      const X = tf.randomNormal([3, 4]);
      const heads = [{ Wq: tf.eye(4), Wk: tf.eye(4), Wv: tf.eye(4) }];
      const out = multiHeadAttention(X, heads);
      expect(out.shape).toEqual([3, 4]);
    });
  });
estimatedMinutes: 20
