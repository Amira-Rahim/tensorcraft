slug: compute-attention
lessonSlug: the-attention-problem
title: "Compute Scaled Dot-Product Attention"
instructions: "Implement scaled dot-product attention using TensorFlow.js. Given query Q [N, d], key K [N, d], value V [N, d_v], compute Attention(Q,K,V) = softmax(Q·K^T / sqrt(d)) · V."
mlContent: data
starterCode: |
  function scaledDotProductAttention(Q, K, V) {
    return null;
  }
solutionCode: |
  function scaledDotProductAttention(Q, K, V) {
    const dK = K.shape[K.shape.length - 1];
    const scores = tf.matMul(Q, K, false, true);
    const scaled = scores.div(tf.scalar(Math.sqrt(dK)));
    const weights = tf.softmax(scaled);
    return tf.matMul(weights, V);
  }
testCode: |
  describe('scaledDotProductAttention (real tf.matMul + softmax)', () => {
    it('output shape matches V shape', () => {
      const Q = tf.randomNormal([4, 8]);
      const K = tf.randomNormal([4, 8]);
      const V = tf.randomNormal([4, 16]);
      const out = scaledDotProductAttention(Q, K, V);
      expect(out.shape).toEqual([4, 16]);
    });

    it('attention weights sum to 1 per row (softmax property)', () => {
      const Q = tf.eye(3);
      const K = tf.eye(3);
      const V = tf.eye(3);
      const out = scaledDotProductAttention(Q, K, V);
      const rowSums = out.sum(1).arraySync();
      for (const sum of rowSums) {
        expect(sum).toBeCloseTo(1, 3);
      }
    });

    it('identical Q and K produce diagonal-heavy attention', () => {
      const Q = tf.tensor2d([[1, 0], [0, 1]]);
      const K = tf.tensor2d([[1, 0], [0, 1]]);
      const V = tf.tensor2d([[10, 0], [0, 20]]);
      const out = scaledDotProductAttention(Q, K, V);
      const arr = out.arraySync();
      expect(arr[0][0]).toBeGreaterThan(arr[0][1]);
      expect(arr[1][1]).toBeGreaterThan(arr[1][0]);
    });
  });
