slug: self-attention-scores
lessonSlug: self-attention
title: "Compute Self-Attention Scores from Input"
instructions: "Implement self-attention from a single input X. Build `selfAttention(X, Wq, Wk, Wv)` that projects X through three weight matrices to get Q, K, V, then runs scaled dot-product attention."
mlContent: data
starterCode: |
  function selfAttention(X, Wq, Wk, Wv) {
    return null;
  }
solutionCode: |
  function selfAttention(X, Wq, Wk, Wv) {
    const Q = tf.matMul(X, Wq);
    const K = tf.matMul(X, Wk);
    const V = tf.matMul(X, Wv);
    const dK = K.shape[K.shape.length - 1];
    const scores = tf.matMul(Q, K, false, true).div(tf.scalar(Math.sqrt(dK)));
    const weights = tf.softmax(scores);
    return tf.matMul(weights, V);
  }
testCode: |
  describe('selfAttention (real tf.matMul + softmax)', () => {
    it('output preserves sequence length', () => {
      const X = tf.randomNormal([5, 8]);
      const Wq = tf.randomNormal([8, 4]);
      const Wk = tf.randomNormal([8, 4]);
      const Wv = tf.randomNormal([8, 6]);
      const out = selfAttention(X, Wq, Wk, Wv);
      expect(out.shape).toEqual([5, 6]);
    });

    it('zero input produces uniform attention', () => {
      const X = tf.zeros([3, 4]);
      const Wq = tf.eye(4);
      const Wk = tf.eye(4);
      const Wv = tf.tensor2d([[1, 2], [3, 4], [5, 6], [7, 8]]);
      const out = selfAttention(X, Wq, Wk, Wv);
      // With zero X, Q = K = 0 → softmax over zeros is uniform → weighted V sum
      const arr = out.arraySync();
      // All output rows identical
      expect(arr[0][0]).toBeCloseTo(arr[1][0], 4);
      expect(arr[0][1]).toBeCloseTo(arr[1][1], 4);
    });
  });
