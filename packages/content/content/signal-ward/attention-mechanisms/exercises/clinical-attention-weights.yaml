slug: clinical-attention-weights
lessonSlug: clinical-attention
title: "Compute Clinical Attention Weights with Masking"
mlContent: model
instructions: "Build `maskedAttention(scores, validMask)` taking [N] attention scores and [N] boolean mask (1 for valid tokens, 0 for padding), and returning normalized weights where masked positions get zero weight after softmax. Implement by setting masked-out positions to -1e9 before softmax."
starterCode: |
  function maskedAttention(scores, validMask) {
    return null;
  }
solutionCode: |
  function maskedAttention(scores, validMask) {
    const negInf = tf.scalar(-1e9);
    const oneMinusMask = tf.scalar(1).sub(validMask);
    const masked = scores.add(oneMinusMask.mul(negInf));
    return tf.softmax(masked);
  }
testCode: |
  describe('maskedAttention (real tf.softmax + mask)', () => {
    it('masked positions get ~0 weight', () => {
      const scores = tf.tensor1d([1, 1, 1, 1]);
      const mask = tf.tensor1d([1, 1, 0, 0]);
      const w = maskedAttention(scores, mask);
      const arr = Array.from(w.dataSync());
      expect(arr[0]).toBeGreaterThan(0.4);
      expect(arr[1]).toBeGreaterThan(0.4);
      expect(arr[2]).toBeLessThan(1e-6);
      expect(arr[3]).toBeLessThan(1e-6);
    });
    it('all-valid mask preserves uniform softmax', () => {
      const scores = tf.tensor1d([2, 2, 2, 2]);
      const mask = tf.tensor1d([1, 1, 1, 1]);
      const w = maskedAttention(scores, mask);
      const arr = Array.from(w.dataSync());
      expect(arr[0]).toBeCloseTo(0.25, 4);
    });
  });
estimatedMinutes: 15
difficulty: intermediate
