solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  const MEDICAL_TERMS = new Set([
    'methotrexate', 'lisinopril', 'warfarin', 'arthritis',
    'hypertension', 'diabetes', 'nausea', 'fatigue'
  ]);

  function createMedicalBias(
    tokens: string[],
    biasStrength: number
  ): tf.Tensor1D {
    const mask = tokens.map(t =>
      MEDICAL_TERMS.has(t.toLowerCase()) ? biasStrength : 0.0
    );
    return tf.tensor1d(mask);
  }

  function clinicalAttention(
    scores: tf.Tensor2D,
    tokens: string[],
    biasStrength: number
  ): tf.Tensor2D {
    const bias = createMedicalBias(tokens, biasStrength);
    const biasedScores = scores.add(bias.reshape([1, -1]));
    return tf.softmax(biasedScores, -1) as tf.Tensor2D;
  }
testCode: |
  describe('createMedicalBias', () => {
    it('assigns bias to medical terms', async () => {
      const tokens = ['the', 'patient', 'takes', 'methotrexate'];
      const bias = createMedicalBias(tokens, 2.0);
      const values = await bias.array();
      expect(values).toEqual([0, 0, 0, 2.0]);
    });
    it('is case insensitive', async () => {
      const tokens = ['Arthritis', 'WARFARIN'];
      const bias = createMedicalBias(tokens, 1.5);
      const values = await bias.array();
      expect(values).toEqual([1.5, 1.5]);
    });
  });
  describe('clinicalAttention', () => {
    it('returns weights that sum to 1 per row', async () => {
      const scores = tf.tensor2d([[1, 1, 1], [1, 1, 1]]);
      const tokens = ['patient', 'takes', 'methotrexate'];
      const weights = clinicalAttention(scores as tf.Tensor2D, tokens, 2.0);
      const sumsData = Array.from(weights.sum(-1).dataSync());
      sumsData.forEach(s => expect(s).toBeCloseTo(1.0, 2));
    });
    it('medical terms get higher attention', async () => {
      const scores = tf.tensor2d([[0, 0, 0]]);
      const tokens = ['the', 'patient', 'warfarin'];
      const weights = clinicalAttention(scores as tf.Tensor2D, tokens, 3.0);
      const w = await weights.array();
      expect(w[0][2]).toBeGreaterThan(w[0][0]);
      expect(w[0][2]).toBeGreaterThan(w[0][1]);
    });
  });
