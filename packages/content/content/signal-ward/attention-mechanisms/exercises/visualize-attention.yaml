slug: visualize-attention
lessonSlug: attention-visualization
title: "Build Attention Matrix for Visualization"
mlContent: model
instructions: "Build `buildAttentionMatrix(Q, K)` taking query Q [N, d] and key K [N, d] tensors, returning the [N, N] softmax-normalized attention matrix that downstream visualization code can render as a heatmap."
starterCode: |
  function buildAttentionMatrix(Q, K) {
    return null;
  }
solutionCode: |
  function buildAttentionMatrix(Q, K) {
    const dK = K.shape[K.shape.length - 1];
    const scores = tf.matMul(Q, K, false, true).div(tf.scalar(Math.sqrt(dK)));
    return tf.softmax(scores);
  }
testCode: |
  describe('buildAttentionMatrix (real tf.matMul + softmax)', () => {
    it('returns [N, N] square matrix', () => {
      const Q = tf.randomNormal([5, 8]);
      const K = tf.randomNormal([5, 8]);
      const A = buildAttentionMatrix(Q, K);
      expect(A.shape).toEqual([5, 5]);
    });
    it('rows sum to 1 (softmax)', () => {
      const Q = tf.randomNormal([3, 4]);
      const K = tf.randomNormal([3, 4]);
      const A = buildAttentionMatrix(Q, K);
      const rowSums = A.sum(-1).arraySync();
      for (const sum of rowSums) {
        expect(sum).toBeCloseTo(1, 3);
      }
    });
  });
estimatedMinutes: 12
difficulty: intermediate
skillAxis: model_arch
