solutionCode: |
  const vocab = new Set(['card', '##io', '##logy', '##itis', 'gastro', '##enter', 'hyper', '##tension']);

  function wordPieceTokenize(word: string, subwordVocab: Set<string>): string[] {
    const tokens: string[] = [];
    let start = 0;

    while (start < word.length) {
      let end = word.length;
      let found = false;

      while (end > start) {
        const substr = (start === 0 ? '' : '##') + word.slice(start, end);
        if (subwordVocab.has(substr)) {
          tokens.push(substr);
          start = end;
          found = true;
          break;
        }
        end--;
      }

      if (!found) return ['[UNK]'];
    }
    return tokens;
  }

  const result = wordPieceTokenize('cardiology', vocab);
testCode: |
  describe('Subword Tokenize', () => {
    it('tokenizes cardiology', () => { expect(result).toEqual(['card', '##io', '##logy']); });
    it('tokenizes gastroenteritis', () => { expect(wordPieceTokenize('gastroenteritis', vocab)).toEqual(['gastro', '##enter', '##itis']); });
    it('tokenizes hypertension', () => { expect(wordPieceTokenize('hypertension', vocab)).toEqual(['hyper', '##tension']); });
    it('returns UNK for unknown', () => { expect(wordPieceTokenize('xyz', vocab)).toEqual(['[UNK]']); });
  });
