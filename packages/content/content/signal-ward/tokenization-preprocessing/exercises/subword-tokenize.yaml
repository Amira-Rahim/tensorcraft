slug: subword-tokenize
lessonSlug: subword-tokenization
title: "BPE-Style Merge to Token IDs"
mlContent: data
instructions: "Build `subwordTokenize(word, mergeMap)` that applies BPE merges greedily. Start with the word as character list. Repeatedly find the highest-priority adjacent pair in mergeMap (Map<'a b', mergedToken>) and merge until no more apply. Return final tokens as an int32 tensor of length equal to final token count, where each token's ID is its hash-mod-1000."
starterCode: |
  function subwordTokenize(word, mergeMap) {
    return null;
  }
solutionCode: |
  function subwordTokenize(word, mergeMap) {
    let tokens = word.split('');
    while (true) {
      let bestIdx = -1;
      let bestMerge = '';
      let bestPriority = Infinity;
      for (let i = 0; i < tokens.length - 1; i++) {
        const pair = tokens[i] + ' ' + tokens[i + 1];
        const merged = mergeMap.get(pair);
        if (merged !== undefined) {
          const priority = Array.from(mergeMap.keys()).indexOf(pair);
          if (priority < bestPriority) {
            bestPriority = priority;
            bestIdx = i;
            bestMerge = merged;
          }
        }
      }
      if (bestIdx === -1) break;
      tokens = [...tokens.slice(0, bestIdx), bestMerge, ...tokens.slice(bestIdx + 2)];
    }
    const ids = tokens.map(t => {
      let h = 0;
      for (const c of t) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return h % 1000;
    });
    return tf.tensor1d(ids, 'int32');
  }
testCode: |
  describe('subwordTokenize (real tf.tensor1d)', () => {
    it('returns one token per character when no merges apply', () => {
      const t = subwordTokenize('cat', new Map());
      expect(t.shape).toEqual([3]);
    });
    it('merges adjacent pairs', () => {
      const merges = new Map([['c a', 'ca']]);
      const t = subwordTokenize('cat', merges);
      expect(t.shape).toEqual([2]);
    });
    it('applies multi-step merges in priority order', () => {
      const merges = new Map([['c a', 'ca'], ['ca t', 'cat']]);
      const t = subwordTokenize('cat', merges);
      expect(t.shape).toEqual([1]);
    });
  });
estimatedMinutes: 18
