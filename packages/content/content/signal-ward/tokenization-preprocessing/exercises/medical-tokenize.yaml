slug: medical-tokenize
lessonSlug: medical-tokenization
title: "Medical Text Normalization to ID Tensor"
mlContent: data
instructions: "Build `medicalTokenize(text, synonymMap, vocab)` that splits text on whitespace, applies synonymMap (e.g. 'mi' → 'myocardial infarction'), then looks up each resulting word in vocab (0 for unknown), and returns a 1D int32 tensor of IDs."
starterCode: |
  function medicalTokenize(text, synonymMap, vocab) {
    return null;
  }
solutionCode: |
  function medicalTokenize(text, synonymMap, vocab) {
    const words = text.toLowerCase().split(/\s+/).filter(w => w.length > 0);
    const expanded = [];
    for (const w of words) {
      const exp = synonymMap.get(w);
      if (exp) {
        for (const part of exp.split(/\s+/)) expanded.push(part);
      } else {
        expanded.push(w);
      }
    }
    const ids = expanded.map(w => vocab.get(w) ?? 0);
    return tf.tensor1d(ids, 'int32');
  }
testCode: |
  describe('medicalTokenize (real tf.tensor1d)', () => {
    it('expands abbreviations', () => {
      const syn = new Map([['mi', 'myocardial infarction']]);
      const vocab = new Map([['myocardial', 1], ['infarction', 2]]);
      const t = medicalTokenize('mi', syn, vocab);
      expect(Array.from(t.dataSync())).toEqual([1, 2]);
    });
    it('passes unknown synonyms through', () => {
      const t = medicalTokenize('aspirin', new Map(), new Map([['aspirin', 5]]));
      expect(Array.from(t.dataSync())).toEqual([5]);
    });
    it('case-insensitive', () => {
      const vocab = new Map([['fever', 8]]);
      const t = medicalTokenize('FEVER', new Map(), vocab);
      expect(Array.from(t.dataSync())).toEqual([8]);
    });
  });
