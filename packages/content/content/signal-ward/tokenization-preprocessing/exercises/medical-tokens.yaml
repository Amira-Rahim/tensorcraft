solutionCode: |
  const ABBREVS = new Map([
    ['pt', 'patient'], ['hx', 'history'], ['dx', 'diagnosis'],
    ['rx', 'prescription'], ['pcn', 'penicillin'], ['bp', 'blood-pressure'],
  ]);

  function medicalTokenize(text: string): string[] {
    const tokens = text.toLowerCase().match(/[a-z0-9]+/g) || [];
    return tokens.map(t => ABBREVS.get(t) ?? t);
  }

  const result = medicalTokenize('Pt hx of PCN allergy. BP elevated.');
testCode: |
  describe('Medical Tokens', () => {
    it('returns an array', () => { expect(Array.isArray(result)).toBe(true); });
    it('expands pt to patient', () => { expect(result[0]).toBe('patient'); });
    it('expands hx to history', () => { expect(result[1]).toBe('history'); });
    it('expands pcn to penicillin', () => { expect(result).toContain('penicillin'); });
    it('leaves non-abbreviations unchanged', () => { expect(result).toContain('allergy'); });
  });
