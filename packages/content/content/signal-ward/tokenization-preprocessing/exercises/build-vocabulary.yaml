solutionCode: |
  class Vocabulary {
    private tokenToId: Map<string, number>;
    private idToToken: string[];

    constructor() {
      this.tokenToId = new Map();
      this.idToToken = [];
      this.addToken('<PAD>');
      this.addToken('<UNK>');
    }

    addToken(token: string): number {
      if (this.tokenToId.has(token)) return this.tokenToId.get(token)!;
      const id = this.idToToken.length;
      this.tokenToId.set(token, id);
      this.idToToken.push(token);
      return id;
    }

    encode(token: string): number {
      return this.tokenToId.get(token) ?? 1;
    }

    decode(id: number): string {
      return this.idToToken[id] ?? '<UNK>';
    }

    get size(): number { return this.idToToken.length; }
  }

  const vocab = new Vocabulary();
  vocab.addToken('patient');
  vocab.addToken('pain');
testCode: |
  describe('Vocabulary', () => {
    it('has special tokens', () => { expect(vocab.size).toBeGreaterThanOrEqual(4); });
    it('encodes known tokens', () => { expect(vocab.encode('patient')).toBe(2); });
    it('encodes unknown as 1', () => { expect(vocab.encode('xyz')).toBe(1); });
    it('decodes correctly', () => { expect(vocab.decode(2)).toBe('patient'); });
    it('decodes unknown ID', () => { expect(vocab.decode(999)).toBe('<UNK>'); });
    it('skips duplicates', () => { const id1 = vocab.addToken('patient'); const id2 = vocab.addToken('patient'); expect(id1).toBe(id2); });
  });
