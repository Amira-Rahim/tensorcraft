    return null; // your code here
  }

  const tokens = wordTokenize('Pt started on non-insulin therapy. Temp 98.6F.');
solutionCode: |
  function wordTokenize(text: string): string[] {
    return text.toLowerCase().match(/[a-z]+(?:-[a-z]+)*|[0-9]+(?:\.[0-9]+)?/g) || [];
  }

  const tokens = wordTokenize('Pt started on non-insulin therapy. Temp 98.6F.');
testCode: |
  describe('Word Tokenize', () => {
    it('returns an array', () => { expect(Array.isArray(tokens)).toBe(true); });
    it('lowercases tokens', () => { tokens.forEach(t => { if (/[a-z]/.test(t)) expect(t).toBe(t.toLowerCase()); }); });
    it('preserves hyphenated words', () => { expect(tokens).toContain('non-insulin'); });
    it('preserves decimal numbers', () => { expect(tokens).toContain('98.6'); });
    it('removes punctuation', () => { expect(tokens.some(t => t.includes('.')  && !/^[0-9]/.test(t))).toBe(false); });
  });
