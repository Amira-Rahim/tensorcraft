slug: word-tokenize
lessonSlug: word-tokenization
title: "Tokenize Text + Convert to ID Tensor"
mlContent: data
instructions: "Build `tokenizeToTensor(text, vocab)` that splits text on whitespace, looks up each word in vocab (a Map<string, number>), uses 0 for unknown words, and returns a 1D int32 tensor of IDs."
starterCode: |
  function tokenizeToTensor(text, vocab) {
    return null;
  }
solutionCode: |
  function tokenizeToTensor(text, vocab) {
    const words = text.toLowerCase().split(/\s+/).filter(w => w.length > 0);
    const ids = words.map(w => vocab.get(w) ?? 0);
    return tf.tensor1d(ids, 'int32');
  }
testCode: |
  describe('tokenizeToTensor (real tf.tensor1d)', () => {
    it('looks up known tokens', () => {
      const vocab = new Map([['hello', 1], ['world', 2]]);
      const t = tokenizeToTensor('hello world', vocab);
      expect(Array.from(t.dataSync())).toEqual([1, 2]);
    });
    it('uses 0 for unknown tokens', () => {
      const vocab = new Map([['hello', 1]]);
      const t = tokenizeToTensor('hello unknown', vocab);
      expect(Array.from(t.dataSync())).toEqual([1, 0]);
    });
    it('returns int32 tensor', () => {
      const vocab = new Map([['x', 5]]);
      const t = tokenizeToTensor('x x x', vocab);
      expect(t.dtype).toBe('int32');
      expect(t.shape).toEqual([3]);
    });
  });
estimatedMinutes: 10
difficulty: beginner
skillAxis: data_prep
