title: "Word Tokenize"
instructions: "Implement a wordTokenize function that splits clinical text into tokens. It should: lowercase the input, preserve hyphenated words (e.g., 'non-insulin'), preserve decimal numbers (e.g., '98.6'), and strip other punctuation. Return an array of token strings."
