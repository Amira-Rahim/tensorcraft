title: "Build Preprocessor"
instructions: "Build a TextPipeline class that chains preprocessing steps. Implement: (1) an add(name, fn) method that registers a step function and returns 'this' for chaining, (2) a run(input) method that passes the input through each step in order and returns the final output string. Then create a pipeline with three steps: 'lowercase' (lowercases text), 'stripHtml' (removes HTML tags by replacing them with spaces), and 'collapse' (collapses multiple spaces into one and trims). Run the pipeline on the provided test input."
