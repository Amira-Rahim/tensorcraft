solutionCode: |
  class TextPipeline {
    private steps: { name: string; fn: (s: string) => string }[] = [];

    add(name: string, fn: (s: string) => string): this {
      this.steps.push({ name, fn });
      return this;
    }

    run(input: string): string {
      return this.steps.reduce((acc, step) => step.fn(acc), input);
    }
  }

  const pipeline = new TextPipeline()
    .add('lowercase', (t) => t.toLowerCase())
    .add('stripHtml', (t) => t.replace(/<[^>]*>/g, ' '))
    .add('collapse', (t) => t.replace(/\s+/g, ' ').trim());

  const output = pipeline.run('<p>Patient BP</p>  <b>Elevated</b>');
testCode: |
  describe('TextPipeline', () => {
    it('produces a string', () => { expect(typeof output).toBe('string'); });
    it('lowercases the output', () => { expect(output).toBe(output.toLowerCase()); });
    it('strips HTML tags', () => { expect(output).not.toMatch(/<[^>]*>/); });
    it('has no multiple spaces', () => { expect(output).not.toMatch(/  /); });
    it('is trimmed', () => { expect(output).toBe(output.trim()); });
    it('contains expected words', () => { expect(output).toContain('patient'); expect(output).toContain('elevated'); });
    it('supports chaining', () => { const p = new TextPipeline(); expect(p.add('x', (t) => t)).toBe(p); });
    it('runs steps in order', () => {
      const p = new TextPipeline().add('a', (t) => t + '1').add('b', (t) => t + '2');
      expect(p.run('0')).toBe('012');
    });
  });
