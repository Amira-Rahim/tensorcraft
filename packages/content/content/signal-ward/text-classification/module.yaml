description: "Hundreds of clinical documents arrive every hour. Which ones need a physician in the next ten minutes? You'll build classifiers that route documents by urgency, tag them with every condition they touch, and hand back the ones the model is not sure about. A confident wrong answer costs more here than an honest 'I'm not sure.'"
