slug: incident-alert-fatigue
lessonSlug: triage-system
title: "Incident — Triage Alert Fatigue"
mlContent: systems
instructions: |
  PAGER: triage nurses report ignoring alerts due to volume. Build `recalibrateThreshold(predictions, labels, targetPrecision)` returning the smallest threshold (0.0 - 1.0, in 0.05 steps) that achieves at least `targetPrecision` on held-out predictions.

  Each prediction is `{ score: number, ... }`. Each label is 0 or 1. Precision = TP / (TP + FP) where a positive prediction is one with score >= threshold.

  Return `{ threshold, precision, recall, alertsPerDay }` where alertsPerDay = positives / 7 (assume 1 week of predictions).
starterCode: |
  function recalibrateThreshold(predictions, labels, targetPrecision) {
    return { threshold: 0.5, precision: 0, recall: 0, alertsPerDay: 0 };
  }
solutionCode: |
  function recalibrateThreshold(predictions, labels, targetPrecision) {
    let bestThreshold = 1.0;
    let bestPrecision = 0;
    let bestRecall = 0;
    let bestAlerts = 0;
    for (let t = 0; t <= 1.0; t += 0.05) {
      const threshold = Math.round(t * 100) / 100;
      let tp = 0, fp = 0, fn = 0;
      for (let i = 0; i < predictions.length; i++) {
        const positive = predictions[i].score >= threshold;
        if (positive && labels[i] === 1) tp++;
        else if (positive && labels[i] === 0) fp++;
        else if (!positive && labels[i] === 1) fn++;
      }
      const precision = (tp + fp) > 0 ? tp / (tp + fp) : 0;
      const recall = (tp + fn) > 0 ? tp / (tp + fn) : 0;
      if (precision >= targetPrecision && threshold < bestThreshold) {
        bestThreshold = threshold;
        bestPrecision = precision;
        bestRecall = recall;
        bestAlerts = (tp + fp) / 7;
      }
    }
    return {
      threshold: bestThreshold,
      precision: Math.round(bestPrecision * 100) / 100,
      recall: Math.round(bestRecall * 100) / 100,
      alertsPerDay: Math.round(bestAlerts * 10) / 10,
    };
  }
testCode: |
  describe('recalibrateThreshold', () => {
    it('finds threshold meeting target precision', () => {
      const predictions = [
        { score: 0.95 }, { score: 0.85 }, { score: 0.75 }, { score: 0.65 },
        { score: 0.55 }, { score: 0.45 }, { score: 0.35 }, { score: 0.25 },
      ];
      const labels = [1, 1, 1, 0, 0, 0, 0, 0];
      const r = recalibrateThreshold(predictions, labels, 0.9);
      expect(r.precision).toBeGreaterThanOrEqual(0.9);
      expect(r.threshold).toBeGreaterThan(0.5);
    });

    it('reports alerts per day from positive count', () => {
      const predictions = Array.from({ length: 14 }, (_, i) => ({ score: i < 7 ? 0.9 : 0.1 }));
      const labels = Array.from({ length: 14 }, (_, i) => (i < 7 ? 1 : 0));
      const r = recalibrateThreshold(predictions, labels, 0.5);
      expect(r.alertsPerDay).toBeGreaterThan(0);
    });
  });
estimatedMinutes: 15
difficulty: advanced
skillAxis: evaluation
