solutionCode: |
  interface EntityAnnotation {
    start: number;
    end: number;
    type: string;
  }

  interface EntitySpan {
    text: string;
    type: string;
    startIdx: number;
    endIdx: number;
  }

  function applyBioTags(
    tokens: string[],
    entities: EntityAnnotation[]
  ): string[] {
    const tags = new Array(tokens.length).fill('O');
    for (const entity of entities) {
      tags[entity.start] = `B-${entity.type}`;
      for (let i = entity.start + 1; i < entity.end; i++) {
        tags[i] = `I-${entity.type}`;
      }
    }
    return tags;
  }

  function decodeBioTags(
    tokens: string[],
    tags: string[]
  ): EntitySpan[] {
    const entities: EntitySpan[] = [];
    let current: EntitySpan | null = null;

    for (let i = 0; i < tokens.length; i++) {
      if (tags[i].startsWith('B-')) {
        if (current) entities.push(current);
        const type = tags[i].substring(2);
        current = { text: tokens[i], type, startIdx: i, endIdx: i + 1 };
      } else if (tags[i].startsWith('I-') && current) {
        current.text += ' ' + tokens[i];
        current.endIdx = i + 1;
      } else {
        if (current) entities.push(current);
        current = null;
      }
    }
    if (current) entities.push(current);
    return entities;
  }
testCode: |
  describe('applyBioTags', () => {
    it('tags single-word entities with B', () => {
      const tokens = ['Patient', 'takes', 'methotrexate'];
      const entities = [{ start: 2, end: 3, type: 'DRUG' }];
      const tags = applyBioTags(tokens, entities);
      expect(tags).toEqual(['O', 'O', 'B-DRUG']);
    });
    it('tags multi-word entities with B and I', () => {
      const tokens = ['has', 'rheumatoid', 'arthritis'];
      const entities = [{ start: 1, end: 3, type: 'CONDITION' }];
      const tags = applyBioTags(tokens, entities);
      expect(tags).toEqual(['O', 'B-CONDITION', 'I-CONDITION']);
    });
    it('handles multiple entities', () => {
      const tokens = ['takes', 'aspirin', 'for', 'hypertension'];
      const entities = [
        { start: 1, end: 2, type: 'DRUG' },
        { start: 3, end: 4, type: 'CONDITION' }
      ];
      const tags = applyBioTags(tokens, entities);
      expect(tags).toEqual(['O', 'B-DRUG', 'O', 'B-CONDITION']);
    });
    it('handles adjacent same-type entities', () => {
      const tokens = ['has', 'diabetes', 'hypertension'];
      const entities = [
        { start: 1, end: 2, type: 'CONDITION' },
        { start: 2, end: 3, type: 'CONDITION' }
      ];
      const tags = applyBioTags(tokens, entities);
      expect(tags).toEqual(['O', 'B-CONDITION', 'B-CONDITION']);
    });
  });
  describe('decodeBioTags', () => {
    it('reconstructs single-word entities', () => {
      const tokens = ['takes', 'warfarin'];
      const tags = ['O', 'B-DRUG'];
      const entities = decodeBioTags(tokens, tags);
      expect(entities).toEqual([{ text: 'warfarin', type: 'DRUG', startIdx: 1, endIdx: 2 }]);
    });
    it('reconstructs multi-word entities', () => {
      const tokens = ['has', 'rheumatoid', 'arthritis'];
      const tags = ['O', 'B-CONDITION', 'I-CONDITION'];
      const entities = decodeBioTags(tokens, tags);
      expect(entities.length).toBe(1);
      expect(entities[0].text).toBe('rheumatoid arthritis');
      expect(entities[0].startIdx).toBe(1);
      expect(entities[0].endIdx).toBe(3);
    });
    it('separates adjacent same-type entities', () => {
      const tokens = ['has', 'diabetes', 'hypertension'];
      const tags = ['O', 'B-CONDITION', 'B-CONDITION'];
      const entities = decodeBioTags(tokens, tags);
      expect(entities.length).toBe(2);
      expect(entities[0].text).toBe('diabetes');
      expect(entities[1].text).toBe('hypertension');
    });
  });
