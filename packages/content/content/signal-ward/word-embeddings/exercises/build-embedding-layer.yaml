slug: build-embedding-layer
lessonSlug: embedding-layers
title: "Build a Trainable Embedding Layer"
instructions: "Build `embedTokens(tokenIds, vocabSize, embedDim)` that creates a tf.layers.embedding layer of size [vocabSize, embedDim], applies it to a [batch, seqLen] tensor of token IDs, and returns the output of shape [batch, seqLen, embedDim]."
mlContent: model
starterCode: |
  function embedTokens(tokenIds, vocabSize, embedDim) {
    return null;
  }
solutionCode: |
  function embedTokens(tokenIds, vocabSize, embedDim) {
    const layer = tf.layers.embedding({ inputDim: vocabSize, outputDim: embedDim });
    return layer.apply(tokenIds);
  }
testCode: |
  describe('embedTokens (real tf.layers.embedding)', () => {
    it('output shape is [batch, seqLen, embedDim]', () => {
      const tokens = tf.tensor2d([[1, 2, 3, 4]], [1, 4], 'int32');
      const out = embedTokens(tokens, 100, 16);
      expect(out.shape).toEqual([1, 4, 16]);
    });

    it('handles batch dimension', () => {
      const tokens = tf.tensor2d([[1, 2], [3, 4], [5, 6]], [3, 2], 'int32');
      const out = embedTokens(tokens, 100, 8);
      expect(out.shape).toEqual([3, 2, 8]);
    });
  });
estimatedMinutes: 12
difficulty: intermediate
skillAxis: model_arch
