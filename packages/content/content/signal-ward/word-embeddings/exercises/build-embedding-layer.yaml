solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  const vocabSize = 200;
  const embeddingDim = 32;
  const maxSeqLength = 10;

  const model = tf.sequential();
  model.add(tf.layers.embedding({
    inputDim: vocabSize,
    outputDim: embeddingDim,
    inputLength: maxSeqLength,
  }));
  model.add(tf.layers.globalAveragePooling1d());
  model.add(tf.layers.dense({
    units: 1,
    activation: 'sigmoid',
  }));

  const vocab = new Map([
    ['<PAD>', 0], ['<UNK>', 1], ['aspirin', 2],
    ['pain', 3], ['fever', 4], ['allergy', 5],
  ]);

  const pretrained: Record<string, number[]> = {
    'aspirin': [0.82, 0.21, -0.11],
    'pain':    [0.55, -0.33, 0.22],
    'allergy': [0.45, 0.67, -0.23],
  };

  function buildEmbeddingMatrix(
    v: Map<string, number>,
    pre: Record<string, number[]>,
    dim: number
  ): number[][] {
    const matrix = Array.from({ length: v.size }, () => new Array(dim).fill(0));
    for (const [word, idx] of v) {
      if (pre[word]) matrix[idx] = [...pre[word]];
    }
    return matrix;
  }

  const matrix = buildEmbeddingMatrix(vocab, pretrained, 3);
testCode: |
  describe('Build Embedding Layer', () => {
    it('model has 3 layers', () => {
      expect(model.layers.length).toBe(3);
    });
    it('first layer is embedding', () => {
      expect(model.layers[0].getClassName()).toBe('Embedding');
    });
    it('embedding has correct config', () => {
      const config = model.layers[0].getConfig();
      expect(config.inputDim).toBe(200);
      expect(config.outputDim).toBe(32);
    });
    it('last layer is dense with sigmoid', () => {
      const config = model.layers[2].getConfig();
      expect(config.units).toBe(1);
      expect(config.activation).toBe('sigmoid');
    });
    it('matrix has correct dimensions', () => {
      expect(matrix.length).toBe(6);
      expect(matrix[0].length).toBe(3);
    });
    it('PAD row is zeros', () => {
      expect(matrix[0]).toEqual([0, 0, 0]);
    });
    it('aspirin has pretrained values', () => {
      expect(matrix[2]).toEqual([0.82, 0.21, -0.11]);
    });
    it('fever (no pretrained) is zeros', () => {
      expect(matrix[4]).toEqual([0, 0, 0]);
    });
  });
