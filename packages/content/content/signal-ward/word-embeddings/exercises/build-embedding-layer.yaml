title: "Build an Embedding Layer"
instructions: "Build a TensorFlow.js sequential model with three layers: (1) an embedding layer mapping a vocabulary of 200 words to 32-dimensional vectors with an input length of 10, (2) a global average pooling layer, and (3) a dense output layer with 1 unit and sigmoid activation. Then implement buildEmbeddingMatrix that takes a vocabulary Map, a pretrained vectors Record, and an embedding dimension, returning a 2D array where each row uses the pretrained vector if available or zeros otherwise."
