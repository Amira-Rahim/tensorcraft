solutionCode: |
  const genericEmb: Record<string, number[]> = {
    'discharge': [0.31, -0.52, 0.18],
    'hospital':  [-0.08, 0.24, 0.81],
    'fire':      [0.38, -0.59, 0.12],
    'home':      [0.11, 0.07, 0.29],
  };

  const medicalEmb: Record<string, number[]> = {
    'discharge': [0.09, 0.33, 0.71],
    'hospital':  [0.02, 0.41, 0.78],
    'fire':      [0.82, -0.51, -0.08],
    'home':      [0.15, 0.22, 0.63],
  };

  function cosineSim(a: number[], b: number[]): number {
    const dot = a.reduce((s, v, i) => s + v * b[i], 0);
    const nA = Math.sqrt(a.reduce((s, v) => s + v * v, 0));
    const nB = Math.sqrt(b.reduce((s, v) => s + v * v, 0));
    return dot / (nA * nB);
  }

  function findClosest(word: string, embeddings: Record<string, number[]>): string {
    let bestWord = '';
    let bestSim = -Infinity;
    for (const [w, vec] of Object.entries(embeddings)) {
      if (w === word) continue;
      const sim = cosineSim(embeddings[word], vec);
      if (sim > bestSim) {
        bestSim = sim;
        bestWord = w;
      }
    }
    return bestWord;
  }

  const genericClosest = findClosest('discharge', genericEmb);
  const medicalClosest = findClosest('discharge', medicalEmb);
testCode: |
  describe('Load Medical Embeddings', () => {
    it('generic finds fire closest to discharge', () => {
      expect(genericClosest).toBe('fire');
    });
    it('medical finds hospital closest to discharge', () => {
      expect(medicalClosest).toBe('hospital');
    });
    it('findClosest returns a string', () => {
      expect(typeof genericClosest).toBe('string');
    });
    it('findClosest excludes the query word', () => {
      expect(genericClosest).not.toBe('discharge');
      expect(medicalClosest).not.toBe('discharge');
    });
    it('findClosest works for other query words', () => {
      const closest = findClosest('hospital', medicalEmb);
      expect(closest).toBeDefined();
      expect(closest).not.toBe('hospital');
    });
  });
