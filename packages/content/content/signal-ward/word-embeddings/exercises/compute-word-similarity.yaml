solutionCode: |
  const embeddings: Record<string, number[]> = {
    'aspirin':      [0.82, 0.21, -0.11, 0.53],
    'ibuprofen':    [0.74, 0.29, -0.18, 0.45],
    'penicillin':   [-0.12, 0.81, 0.62, -0.22],
    'amoxicillin':  [-0.19, 0.73, 0.68, -0.15],
    'headache':     [0.55, -0.31, 0.22, 0.78],
    'infection':    [-0.08, 0.69, 0.55, -0.18],
  };

  function cosineSim(a: number[], b: number[]): number {
    const dot = a.reduce((s, v, i) => s + v * b[i], 0);
    const nA = Math.sqrt(a.reduce((s, v) => s + v * v, 0));
    const nB = Math.sqrt(b.reduce((s, v) => s + v * v, 0));
    return dot / (nA * nB);
  }

  function findMostSimilar(word: string, emb: Record<string, number[]>): string {
    let bestWord = '';
    let bestSim = -Infinity;
    for (const [w, vec] of Object.entries(emb)) {
      if (w === word) continue;
      const sim = cosineSim(emb[word], vec);
      if (sim > bestSim) {
        bestSim = sim;
        bestWord = w;
      }
    }
    return bestWord;
  }

  function solveAnalogy(
    a: string, b: string, c: string,
    emb: Record<string, number[]>
  ): string {
    const resultVec = emb[a].map((v, i) => v - emb[b][i] + emb[c][i]);
    const exclude = new Set([a, b, c]);
    let bestWord = '';
    let bestSim = -Infinity;
    for (const [w, vec] of Object.entries(emb)) {
      if (exclude.has(w)) continue;
      const sim = cosineSim(resultVec, vec);
      if (sim > bestSim) {
        bestSim = sim;
        bestWord = w;
      }
    }
    return bestWord;
  }

  const mostSimilarToAspirin = findMostSimilar('aspirin', embeddings);
  const analogyResult = solveAnalogy('aspirin', 'headache', 'penicillin', embeddings);
testCode: |
  describe('Compute Word Similarity', () => {
    it('most similar to aspirin is ibuprofen', () => {
      expect(mostSimilarToAspirin).toBe('ibuprofen');
    });
    it('analogy aspirin:headache :: penicillin:? = infection', () => {
      expect(analogyResult).toBe('infection');
    });
    it('findMostSimilar excludes query word', () => {
      expect(mostSimilarToAspirin).not.toBe('aspirin');
    });
    it('findMostSimilar returns a string', () => {
      expect(typeof mostSimilarToAspirin).toBe('string');
    });
    it('solveAnalogy excludes input words', () => {
      expect(analogyResult).not.toBe('aspirin');
      expect(analogyResult).not.toBe('headache');
      expect(analogyResult).not.toBe('penicillin');
    });
    it('findMostSimilar works for penicillin', () => {
      expect(findMostSimilar('penicillin', embeddings)).toBe('amoxicillin');
    });
  });
