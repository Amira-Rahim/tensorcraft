solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  const vocab = ['aspirin', 'ibuprofen', 'penicillin', 'amoxicillin', 'appendectomy'];

  function oneHotEncode(word: string, vocabulary: string[]): tf.Tensor1D {
    const index = vocabulary.indexOf(word);
    const vector = new Array(vocabulary.length).fill(0);
    if (index !== -1) vector[index] = 1;
    return tf.tensor1d(vector);
  }

  const aspirin = oneHotEncode('aspirin', vocab);
  const ibuprofen = oneHotEncode('ibuprofen', vocab);
  const unknown = oneHotEncode('tylenol', vocab);
testCode: |
  describe('Encode One-Hot', () => {
    it('aspirin tensor is defined', () => {
      expect(aspirin).toBeDefined();
    });
    it('has correct shape', () => {
      expect(aspirin.shape).toEqual([5]);
    });
    it('aspirin has 1 at position 0', () => {
      expect(Array.from(aspirin.dataSync())).toEqual([1, 0, 0, 0, 0]);
    });
    it('ibuprofen has 1 at position 1', () => {
      expect(Array.from(ibuprofen.dataSync())).toEqual([0, 1, 0, 0, 0]);
    });
    it('each vector has exactly one 1', () => {
      expect(aspirin.sum().dataSync()[0]).toBe(1);
      expect(ibuprofen.sum().dataSync()[0]).toBe(1);
    });
    it('unknown word returns all zeros', () => {
      expect(unknown.sum().dataSync()[0]).toBe(0);
    });
  });
