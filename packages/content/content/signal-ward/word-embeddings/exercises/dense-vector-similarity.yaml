slug: dense-vector-similarity
lessonSlug: dense-vectors
title: "Cosine Similarity on Word Vectors"
instructions: "Build `cosineSimilarity(vec1, vec2)` that computes the cosine of the angle between two 1D tensors using tf.dot for numerator and tf.norm for magnitudes. Return as a scalar number."
mlContent: data
starterCode: |
  function cosineSimilarity(vec1, vec2) {
    return 0;
  }
solutionCode: |
  function cosineSimilarity(vec1, vec2) {
    const dot = tf.dot(vec1, vec2);
    const norm1 = tf.norm(vec1);
    const norm2 = tf.norm(vec2);
    const cos = dot.div(norm1.mul(norm2));
    return cos.dataSync()[0];
  }
testCode: |
  describe('cosineSimilarity (real tf.dot + tf.norm)', () => {
    it('returns 1 for identical vectors', () => {
      const v = tf.tensor1d([1, 2, 3]);
      expect(cosineSimilarity(v, v)).toBeCloseTo(1, 4);
    });

    it('returns 0 for orthogonal vectors', () => {
      const a = tf.tensor1d([1, 0, 0]);
      const b = tf.tensor1d([0, 1, 0]);
      expect(cosineSimilarity(a, b)).toBeCloseTo(0, 4);
    });

    it('returns -1 for opposite vectors', () => {
      const a = tf.tensor1d([1, 1, 1]);
      const b = tf.tensor1d([-1, -1, -1]);
      expect(cosineSimilarity(a, b)).toBeCloseTo(-1, 4);
    });

    it('scale-invariant (only direction matters)', () => {
      const a = tf.tensor1d([1, 0]);
      const b = tf.tensor1d([100, 0]);
      expect(cosineSimilarity(a, b)).toBeCloseTo(1, 4);
    });
  });
estimatedMinutes: 10
difficulty: beginner
skillAxis: data_prep
