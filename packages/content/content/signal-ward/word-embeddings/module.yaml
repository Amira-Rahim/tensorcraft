slug: word-embeddings
title: "Word Embeddings: Meaning in Numbers"
worldId: signal-ward
order: 3
description: "Vikram demonstrates that 'aspirin' lives closer to 'ibuprofen' than to 'appendectomy' in vector space. Getting there takes the whole module: one-hot vectors that treat every word as a stranger, Word2Vec learning meaning from context, medical embeddings that know 'discharge' means going home, cosine similarity and analogy arithmetic for reading the space, and a trainable layer that keeps adapting on hospital data."
lessonCount: 5
