slug: python-bridge
title: "Python Bridge: You Know ML. Now Read the Other Language"
themeId: shared
order: 3
description: |
  Every ML job posting requires Python literacy. This module bridges your
  JavaScript ML knowledge to Python/PyTorch, not to make you a Python
  developer, but to make you fluent enough to read research code, collaborate
  with data science teams, and navigate the ecosystem. Bridge: "Python's ML
  ecosystem is like jQuery: it was there first, everything builds on it, and
  you need to be literate even if you prefer modern alternatives."
lessonCount: 5
prerequisites:
  - foundations
  - neural-networks
  - training-loop
track: bonus
unlockCondition: "Complete any theme"
lessons:
  - slug: python-for-js-devs
    title: "Python in 15 Minutes for JavaScript Developers"
    order: 1
    estimatedMinutes: 20
    difficulty: beginner
    bridge: "Python syntax → JavaScript syntax (side-by-side)"
    summary: |
      Crash course: indentation vs. braces, list comprehensions vs. map/filter,
      classes, type hints, imports. Not learning Python from scratch, translating
      what you already know. Focus on reading comprehension, not writing.

  - slug: numpy-is-typed-arrays
    title: "NumPy = TypedArrays + Array Methods"
    order: 2
    estimatedMinutes: 25
    difficulty: beginner
    bridge: "NumPy arrays → Float32Array + Array.map/filter/reduce"
    summary: |
      ndarray vs. tf.tensor (they're the same thing). Broadcasting, slicing,
      reshaping. Side-by-side: every NumPy operation mapped to its TF.js
      equivalent. You already know this; it's just different syntax.

  - slug: pytorch-is-tfjs
    title: "PyTorch = TensorFlow.js (Different Syntax, Same Ideas)"
    order: 3
    estimatedMinutes: 30
    difficulty: intermediate
    bridge: "PyTorch nn.Module → tf.sequential / tf.model"
    summary: |
      Side-by-side model definitions in PyTorch and TF.js. nn.Module vs.
      tf.LayersModel. torch.optim vs. tf.train. DataLoader vs. tf.data.
      Training loops compared line-by-line. Read a PyTorch model definition
      and translate it mentally to TF.js.

  - slug: pandas-data-wrangling
    title: "pandas = Array.map/filter/reduce on Tabular Data"
    order: 4
    estimatedMinutes: 25
    difficulty: intermediate
    bridge: "DataFrame → Array of objects with .map/.filter/.reduce"
    summary: |
      DataFrames, Series, groupby, merge. Every pandas operation mapped to
      its JavaScript equivalent. Read a Jupyter notebook's data exploration
      section and understand what it's doing.

  - slug: reading-ml-papers
    title: "Reading ML Papers and PyTorch Repos"
    order: 5
    estimatedMinutes: 30
    difficulty: intermediate
    bridge: "ML paper → technical blog post with code samples"
    summary: |
      Capstone: given a real ML paper and its PyTorch reference implementation,
      read and understand both. Identify the model architecture, loss function,
      training procedure, and key results. Comprehension exercise, not
      implementation. You don't need to write Python; you need to read it.
