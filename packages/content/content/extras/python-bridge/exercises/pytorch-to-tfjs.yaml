title: "PyTorch Model to TensorFlow.js"
instructions: "Read the PyTorch model definition below and build the equivalent model in TensorFlow.js. The model is a simple feedforward classifier. Match the layer types, sizes, activations, and dropout rates exactly. Then compile it with the equivalent optimizer and loss function."
