slug: pytorch-to-tfjs
lessonSlug: pytorch-is-tfjs
title: "PyTorch Model to TensorFlow.js"
instructions: "Read the PyTorch model definition below and build the equivalent model in TensorFlow.js. The model is a simple feedforward classifier. Match the layer types, sizes, activations, and dropout rates. One deliberate trap, THE classic porting bug: PyTorch's nn.CrossEntropyLoss applies log-softmax internally, so the PyTorch model correctly ends in raw logits. TFJS's 'categoricalCrossentropy' loss expects PROBABILITIES, so your final Dense layer must add activation: 'softmax'. Porting the layers 'exactly' ports the bug."
starterCode: |
  // Translate this PyTorch model to TF.js:
  //
  // class Classifier(nn.Module):
  //     def __init__(self):
  //         super().__init__()
  //         self.model = nn.Sequential(
  //             nn.Linear(256, 128),
  //             nn.ReLU(),
  //             nn.Dropout(0.2),
  //             nn.Linear(128, 64),
  //             nn.ReLU(),
  //             nn.Dropout(0.2),
  //             nn.Linear(64, 10)
  //         )
  //
  //     def forward(self, x):
  //         return self.model(x)
  //
  // model = Classifier()
  // optimizer = optim.Adam(model.parameters(), lr=0.001)
  // criterion = nn.CrossEntropyLoss()

  function buildModel() {
    const model = tf.sequential();

    // TODO: Add layers to match the PyTorch model above
    // - Dense(128), ReLU, Dropout(0.2)
    // - Dense(64), ReLU, Dropout(0.2)
    // - Dense(10) ... but see the loss note in the instructions:
    //   nn.CrossEntropyLoss eats logits; 'categoricalCrossentropy' eats
    //   probabilities. One of the two models needs a softmax.

    // TODO: Compile with Adam optimizer (lr=0.001) and cross-entropy loss

    return model;
  }
solutionCode: |
  function buildModel() {
    const model = tf.sequential();

    model.add(tf.layers.dense({
      units: 128,
      activation: 'relu',
      inputShape: [256]
    }));
    model.add(tf.layers.dropout({ rate: 0.2 }));

    model.add(tf.layers.dense({
      units: 64,
      activation: 'relu'
    }));
    model.add(tf.layers.dropout({ rate: 0.2 }));

    // PyTorch ends in raw logits because nn.CrossEntropyLoss applies
    // log-softmax itself. TFJS's string loss expects probabilities, so
    // the softmax that lived inside PyTorch's loss moves into the layer.
    model.add(tf.layers.dense({ units: 10, activation: 'softmax' }));

    model.compile({
      optimizer: tf.train.adam(0.001),
      loss: 'categoricalCrossentropy',
      metrics: ['accuracy']
    });

    return model;
  }
testCode: |
  describe('PyTorch to TF.js Model', () => {
    const model = buildModel();
    const layers = model.layers;

    it('has the correct number of layers', () => {
      expect(layers.length).toBe(5);
    });

    it('first layer is dense with 128 units and inputShape [256]', () => {
      expect(layers[0].getClassName()).toBe('Dense');
      expect(layers[0].units).toBe(128);
      // TFJS exposes input width via the layer's batchInputShape (set when
      // inputShape is provided to the first layer of a Sequential model).
      expect(layers[0].batchInputShape[1]).toBe(256);
    });

    it('has dropout layers with rate 0.2', () => {
      const dropouts = layers.filter(l => l.getClassName() === 'Dropout');
      expect(dropouts.length).toBe(2);
      dropouts.forEach(d => expect(d.rate).toBeCloseTo(0.2));
    });

    it('second dense layer has 64 units', () => {
      const denses = layers.filter(l => l.getClassName() === 'Dense');
      expect(denses[1].units).toBe(64);
    });

    it('output layer has 10 units', () => {
      const denses = layers.filter(l => l.getClassName() === 'Dense');
      expect(denses[denses.length - 1].units).toBe(10);
    });

    it('model is compiled with Adam optimizer', () => {
      expect(model.optimizer).toBeDefined();
    });

    it('final layer applies softmax (categoricalCrossentropy eats probabilities, not logits)', () => {
      const denses = layers.filter(l => l.getClassName() === 'Dense');
      const out = denses[denses.length - 1];
      expect(out.getConfig().activation).toBe('softmax');
    });

    it('trains against a sane objective: loss near ln(10) on random labels, not 7+', async () => {
      const x = tf.randomNormal([32, 256]);
      const y = tf.oneHot(tf.randomUniform([32], 0, 10, 'int32'), 10);
      const h = await model.fit(x, y, { epochs: 1, verbose: 0 });
      // Raw-logits + probability loss trains at ~7-8 here; the correct
      // softmax model starts near -ln(1/10) = 2.30.
      expect(h.history.loss[0]).toBeLessThan(4);
      x.dispose(); y.dispose();
    });
  });
