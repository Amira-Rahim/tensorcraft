solutionCode: |
  function buildModel() {
    const model = tf.sequential();

    model.add(tf.layers.dense({
      units: 128,
      activation: 'relu',
      inputShape: [256]
    }));
    model.add(tf.layers.dropout({ rate: 0.2 }));

    model.add(tf.layers.dense({
      units: 64,
      activation: 'relu'
    }));
    model.add(tf.layers.dropout({ rate: 0.2 }));

    model.add(tf.layers.dense({ units: 10 }));

    model.compile({
      optimizer: tf.train.adam(0.001),
      loss: 'categoricalCrossentropy',
      metrics: ['accuracy']
    });

    return model;
  }
testCode: |
  describe('PyTorch to TF.js Model', () => {
    const model = buildModel();
    const layers = model.layers;

    it('has the correct number of layers', () => {
      expect(layers.length).toBe(5);
    });

    it('first layer is dense with 128 units and inputShape [256]', () => {
      expect(layers[0].getClassName()).toBe('Dense');
      expect(layers[0].units).toBe(128);
      // TFJS exposes input width via the layer's batchInputShape (set when
      // inputShape is provided to the first layer of a Sequential model).
      expect(layers[0].batchInputShape[1]).toBe(256);
    });

    it('has dropout layers with rate 0.2', () => {
      const dropouts = layers.filter(l => l.getClassName() === 'Dropout');
      expect(dropouts.length).toBe(2);
      dropouts.forEach(d => expect(d.rate).toBeCloseTo(0.2));
    });

    it('second dense layer has 64 units', () => {
      const denses = layers.filter(l => l.getClassName() === 'Dense');
      expect(denses[1].units).toBe(64);
    });

    it('output layer has 10 units', () => {
      const denses = layers.filter(l => l.getClassName() === 'Dense');
      expect(denses[denses.length - 1].units).toBe(10);
    });

    it('model is compiled with Adam optimizer', () => {
      expect(model.optimizer).toBeDefined();
    });
  });
