slug: numpy-to-tfjs
lessonSlug: numpy-is-typed-arrays
title: "NumPy Operations in TensorFlow.js"
instructions: "Translate these NumPy operations to TensorFlow.js. You're given a set of commented NumPy operations; implement each one using the tf.* API. The operations cover creation, reshaping, math, and broadcasting. All functions should return tensors."
starterCode: |
  // Translate each NumPy operation to TF.js

  // np.zeros((3, 4))
  function createZeros() {
    // TODO: return a 3x4 tensor of zeros
  }

  // np.arange(0, 10, 2) → [0, 2, 4, 6, 8]
  function createRange() {
    // TODO: return a tensor with values 0, 2, 4, 6, 8
  }

  // a.reshape(2, 6) where a is shape (3, 4)
  function reshapeTensor(a) {
    // TODO: reshape a from (3,4) to (2,6)
  }

  // np.mean(a, axis=1): one mean per row (reduces across the columns)
  function meanAlongAxis(a) {
    // TODO: compute mean along axis 1
  }

  // np.concatenate([a, b], axis=0): stack vertically
  function concatTensors(a, b) {
    // TODO: concatenate a and b along axis 0
  }
solutionCode: |
  function createZeros() {
    return tf.zeros([3, 4]);
  }

  function createRange() {
    return tf.range(0, 10, 2);
  }

  function reshapeTensor(a) {
    return a.reshape([2, 6]);
  }

  function meanAlongAxis(a) {
    return tf.mean(a, 1);
  }

  function concatTensors(a, b) {
    return tf.concat([a, b], 0);
  }
testCode: |
  describe('NumPy to TF.js', () => {
    it('createZeros returns shape [3,4] of zeros', () => {
      const result = createZeros();
      expect(result.shape).toEqual([3, 4]);
      const data = result.arraySync();
      expect(data.flat().every(v => v === 0)).toBe(true);
    });

    it('createRange returns [0, 2, 4, 6, 8]', () => {
      const result = createRange();
      expect(result.arraySync()).toEqual([0, 2, 4, 6, 8]);
    });

    it('reshapeTensor reshapes from [3,4] to [2,6]', () => {
      const a = tf.ones([3, 4]);
      const result = reshapeTensor(a);
      expect(result.shape).toEqual([2, 6]);
    });

    it('meanAlongAxis computes mean along axis 1', () => {
      const a = tf.tensor2d([[1, 2, 3], [4, 5, 6]]);
      const result = meanAlongAxis(a);
      expect(result.shape).toEqual([2]);
      const values = result.arraySync();
      expect(values[0]).toBeCloseTo(2, 5);
      expect(values[1]).toBeCloseTo(5, 5);
    });

    it('concatTensors concatenates along axis 0', () => {
      const a = tf.tensor2d([[1, 2], [3, 4]]);
      const b = tf.tensor2d([[5, 6]]);
      const result = concatTensors(a, b);
      expect(result.shape).toEqual([3, 2]);
    });
  });
