solutionCode: |
  function buildAutoencoder() {
    const model = tf.sequential();

    // Encoder
    model.add(tf.layers.dense({ units: 32, activation: 'relu', inputShape: [64] }));
    model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
    model.add(tf.layers.dense({ units: 8 }));

    // Decoder
    model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
    model.add(tf.layers.dense({ units: 32, activation: 'relu' }));
    model.add(tf.layers.dense({ units: 64, activation: 'sigmoid' }));

    model.compile({
      optimizer: tf.train.adam(0.001),
      loss: 'meanSquaredError',
    });

    return model;
  }
testCode: |
  describe('Autoencoder', () => {
    const model = buildAutoencoder();
    const layers = model.layers;

    it('has 6 dense layers (3 encoder + 3 decoder)', () => {
      expect(layers.length).toBe(6);
      layers.forEach(l => expect(l.getClassName()).toBe('Dense'));
    });

    it('encoder compresses: 64 → 32 → 16 → 8', () => {
      expect(layers[0].units).toBe(32);
      expect(layers[0].batchInputShape[1]).toBe(64);
      expect(layers[1].units).toBe(16);
      expect(layers[2].units).toBe(8);
    });

    it('decoder expands: 8 → 16 → 32 → 64', () => {
      expect(layers[3].units).toBe(16);
      expect(layers[4].units).toBe(32);
      expect(layers[5].units).toBe(64);
    });

    it('output layer uses sigmoid activation', () => {
      const outputConfig = layers[5].getConfig();
      expect(outputConfig.activation).toBe('sigmoid');
    });

    it('model is compiled and can predict', () => {
      expect(model.optimizer).toBeDefined();
      const input = tf.randomNormal([1, 64]);
      const output = model.predict(input);
      expect(output.shape).toEqual([1, 64]);
    });

    it('bottleneck layer has 8 units (compression)', () => {
      expect(layers[2].units).toBe(8);
    });
  });
