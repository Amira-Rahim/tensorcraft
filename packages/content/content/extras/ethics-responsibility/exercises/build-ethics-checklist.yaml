slug: build-ethics-checklist
lessonSlug: ethics-capstone
title: "Build an Ethics Checklist"
instructions: "Write a function `runEthicsReview` that takes an array of check items (each with `phase`: string, `status`: 'pass' | 'fail' | 'pending' | 'not-applicable') and returns an object with: `phaseResults` (a Record mapping each phase to its pass/fail/pending counts), `overallStatus` ('approved' if all checks pass or are not-applicable, 'blocked' if any check fails, 'needs-review' if any check is pending but none fail), and `passRate` (number of passed checks divided by total applicable checks, as a number between 0 and 1)."
starterCode: "interface CheckItem {\n  id: string;\n  phase: string;\n  description: string;\n  status: 'pass' | 'fail' | 'pending' | 'not-applicable';\n}\n\ninterface PhaseResult {\n  passed: number;\n  failed: number;\n  pending: number;\n}\n\ninterface ReviewResult {\n  phaseResults: Record<string, PhaseResult>;\n  overallStatus: 'approved' | 'blocked' | 'needs-review';\n  passRate: number;\n}\n\nfunction runEthicsReview(checks: CheckItem[]): ReviewResult {\n  // Your code here\n}"
solutionCode: "interface CheckItem {\n  id: string;\n  phase: string;\n  description: string;\n  status: 'pass' | 'fail' | 'pending' | 'not-applicable';\n}\n\ninterface PhaseResult {\n  passed: number;\n  failed: number;\n  pending: number;\n}\n\ninterface ReviewResult {\n  phaseResults: Record<string, PhaseResult>;\n  overallStatus: 'approved' | 'blocked' | 'needs-review';\n  passRate: number;\n}\n\nfunction runEthicsReview(checks: CheckItem[]): ReviewResult {\n  const phaseResults: Record<string, PhaseResult> = {};\n\n  for (const check of checks) {\n    if (!phaseResults[check.phase]) {\n      phaseResults[check.phase] = { passed: 0, failed: 0, pending: 0 };\n    }\n    if (check.status === 'pass') phaseResults[check.phase].passed++;\n    else if (check.status === 'fail') phaseResults[check.phase].failed++;\n    else if (check.status === 'pending') phaseResults[check.phase].pending++;\n  }\n\n  const hasFailures = checks.some(c => c.status === 'fail');\n  const hasPending = checks.some(c => c.status === 'pending');\n\n  const applicableChecks = checks.filter(c => c.status !== 'not-applicable');\n  const passedChecks = checks.filter(c => c.status === 'pass');\n  const passRate = applicableChecks.length > 0 ? passedChecks.length / applicableChecks.length : 1;\n\n  let overallStatus: 'approved' | 'blocked' | 'needs-review';\n  if (hasFailures) overallStatus = 'blocked';\n  else if (hasPending) overallStatus = 'needs-review';\n  else overallStatus = 'approved';\n\n  return { phaseResults, overallStatus, passRate };\n}"
testCode: "describe('runEthicsReview', () => {\n  it('returns approved when all checks pass', () => {\n    const checks: CheckItem[] = [\n      { id: '1', phase: 'data', description: 'test', status: 'pass' },\n      { id: '2', phase: 'data', description: 'test', status: 'pass' },\n      { id: '3', phase: 'eval', description: 'test', status: 'not-applicable' },\n    ];\n    const result = runEthicsReview(checks);\n    expect(result.overallStatus).toBe('approved');\n    expect(result.passRate).toBe(1);\n  });\n\n  it('returns blocked when any check fails', () => {\n    const checks: CheckItem[] = [\n      { id: '1', phase: 'data', description: 'test', status: 'pass' },\n      { id: '2', phase: 'eval', description: 'test', status: 'fail' },\n    ];\n    const result = runEthicsReview(checks);\n    expect(result.overallStatus).toBe('blocked');\n  });\n\n  it('returns needs-review when checks are pending', () => {\n    const checks: CheckItem[] = [\n      { id: '1', phase: 'data', description: 'test', status: 'pass' },\n      { id: '2', phase: 'eval', description: 'test', status: 'pending' },\n    ];\n    const result = runEthicsReview(checks);\n    expect(result.overallStatus).toBe('needs-review');\n  });\n\n  it('computes phase results correctly', () => {\n    const checks: CheckItem[] = [\n      { id: '1', phase: 'data', description: 'a', status: 'pass' },\n      { id: '2', phase: 'data', description: 'b', status: 'fail' },\n      { id: '3', phase: 'eval', description: 'c', status: 'pass' },\n    ];\n    const result = runEthicsReview(checks);\n    expect(result.phaseResults['data']).toEqual({ passed: 1, failed: 1, pending: 0 });\n    expect(result.phaseResults['eval']).toEqual({ passed: 1, failed: 0, pending: 0 });\n  });\n\n  it('computes pass rate excluding not-applicable', () => {\n    const checks: CheckItem[] = [\n      { id: '1', phase: 'data', description: 'a', status: 'pass' },\n      { id: '2', phase: 'data', description: 'b', status: 'fail' },\n      { id: '3', phase: 'eval', description: 'c', status: 'not-applicable' },\n    ];\n    const result = runEthicsReview(checks);\n    expect(result.passRate).toBe(0.5);\n  });\n});"
