slug: explain-predictions
lessonSlug: model-interpretability
title: "Explain Model Predictions"
instructions: "Write a function `featureImportance` that takes a predict function (accepts number[], returns number), an input array of numbers, and an array of feature names. For each feature, zero it out, get the new prediction, and compute the absolute difference from the original prediction. Return an array of { feature, importance } objects sorted by importance descending."
starterCode: "interface FeatureExplanation {\n  feature: string;\n  importance: number;\n}\n\nfunction featureImportance(\n  predict: (input: number[]) => number,\n  input: number[],\n  featureNames: string[]\n): FeatureExplanation[] {\n  // Your code here\n}"
solutionCode: "interface FeatureExplanation {\n  feature: string;\n  importance: number;\n}\n\nfunction featureImportance(\n  predict: (input: number[]) => number,\n  input: number[],\n  featureNames: string[]\n): FeatureExplanation[] {\n  const basePrediction = predict(input);\n  const explanations: FeatureExplanation[] = [];\n\n  for (let i = 0; i < input.length; i++) {\n    const perturbed = [...input];\n    perturbed[i] = 0;\n    const newPrediction = predict(perturbed);\n    explanations.push({\n      feature: featureNames[i],\n      importance: Math.abs(basePrediction - newPrediction),\n    });\n  }\n\n  explanations.sort((a, b) => b.importance - a.importance);\n  return explanations;\n}"
testCode: "describe('featureImportance', () => {\n  // Simple linear model: prediction = 0.5*x0 + 0.3*x1 + 0.1*x2\n  const predict = (input: number[]) => 0.5 * input[0] + 0.3 * input[1] + 0.1 * input[2];\n  const input = [10, 20, 30];\n  const names = ['income', 'age', 'score'];\n  const result = featureImportance(predict, input, names);\n\n  it('returns explanations for all features', () => {\n    expect(result.length).toBe(3);\n  });\n\n  it('identifies the most important feature', () => {\n    expect(result[0].feature).toBe('age');\n  });\n\n  it('computes correct importance values', () => {\n    expect(result.find(r => r.feature === 'income')!.importance).toBeCloseTo(5, 1);\n    expect(result.find(r => r.feature === 'age')!.importance).toBeCloseTo(6, 1);\n    expect(result.find(r => r.feature === 'score')!.importance).toBeCloseTo(3, 1);\n  });\n\n  it('sorts by importance descending', () => {\n    for (let i = 1; i < result.length; i++) {\n      expect(result[i - 1].importance).toBeGreaterThanOrEqual(result[i].importance);\n    }\n  });\n});"
