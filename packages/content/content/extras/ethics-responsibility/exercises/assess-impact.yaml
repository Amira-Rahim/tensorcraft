slug: assess-impact
lessonSlug: responsible-deployment
title: "Assess Model Impact"
instructions: "Write a function `assessDeploymentRisk` that takes an array of failure modes (each with `severity`: 'low' | 'medium' | 'high' | 'critical' and `hasHumanFallback`: boolean) and returns a deployment decision: 'do-not-deploy' if any critical failure mode lacks a human fallback, 'deploy-with-oversight' if there are critical or high severity modes but all have fallbacks, or 'deploy' if there are no critical or high severity modes."
starterCode: "interface FailureMode {\n  description: string;\n  severity: 'low' | 'medium' | 'high' | 'critical';\n  hasHumanFallback: boolean;\n}\n\ntype DeploymentDecision = 'deploy' | 'deploy-with-oversight' | 'do-not-deploy';\n\nfunction assessDeploymentRisk(failureModes: FailureMode[]): DeploymentDecision {\n  // Your code here\n}"
solutionCode: "interface FailureMode {\n  description: string;\n  severity: 'low' | 'medium' | 'high' | 'critical';\n  hasHumanFallback: boolean;\n}\n\ntype DeploymentDecision = 'deploy' | 'deploy-with-oversight' | 'do-not-deploy';\n\nfunction assessDeploymentRisk(failureModes: FailureMode[]): DeploymentDecision {\n  const hasCriticalWithoutFallback = failureModes.some(\n    f => f.severity === 'critical' && !f.hasHumanFallback\n  );\n\n  if (hasCriticalWithoutFallback) {\n    return 'do-not-deploy';\n  }\n\n  const hasHighOrCritical = failureModes.some(\n    f => f.severity === 'critical' || f.severity === 'high'\n  );\n\n  if (hasHighOrCritical) {\n    return 'deploy-with-oversight';\n  }\n\n  return 'deploy';\n}"
testCode: "describe('assessDeploymentRisk', () => {\n  it('returns do-not-deploy for critical without fallback', () => {\n    const modes: FailureMode[] = [\n      { description: 'bias', severity: 'critical', hasHumanFallback: false },\n    ];\n    expect(assessDeploymentRisk(modes)).toBe('do-not-deploy');\n  });\n\n  it('returns deploy-with-oversight for critical with fallback', () => {\n    const modes: FailureMode[] = [\n      { description: 'bias', severity: 'critical', hasHumanFallback: true },\n    ];\n    expect(assessDeploymentRisk(modes)).toBe('deploy-with-oversight');\n  });\n\n  it('returns deploy-with-oversight for high severity', () => {\n    const modes: FailureMode[] = [\n      { description: 'false negatives', severity: 'high', hasHumanFallback: true },\n    ];\n    expect(assessDeploymentRisk(modes)).toBe('deploy-with-oversight');\n  });\n\n  it('returns deploy for only low/medium severity', () => {\n    const modes: FailureMode[] = [\n      { description: 'minor errors', severity: 'low', hasHumanFallback: false },\n      { description: 'edge cases', severity: 'medium', hasHumanFallback: true },\n    ];\n    expect(assessDeploymentRisk(modes)).toBe('deploy');\n  });\n\n  it('returns do-not-deploy if any critical lacks fallback', () => {\n    const modes: FailureMode[] = [\n      { description: 'safe', severity: 'low', hasHumanFallback: true },\n      { description: 'dangerous', severity: 'critical', hasHumanFallback: false },\n    ];\n    expect(assessDeploymentRisk(modes)).toBe('do-not-deploy');\n  });\n});"
estimatedMinutes: 15
difficulty: intermediate
mlContent: deployment