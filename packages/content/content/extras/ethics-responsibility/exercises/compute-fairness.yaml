lessonSlug: fairness-metrics
title: "Compute Fairness Metrics"
instructions: "Write two functions: `demographicParity` takes an array of predictions (each with `group`, `predicted`, and `actual`, all numbers 0 or 1 except group which is a string) and returns a Record mapping each group to its positive prediction rate. `disparateImpactRatio` takes that rates object and returns the ratio of the minimum rate to the maximum rate. A ratio below 0.8 indicates disparate impact."
starterCode: "interface Prediction {\n  group: string;\n  predicted: number;\n  actual: number;\n}\n\nfunction demographicParity(predictions: Prediction[]): Record<string, number> {\n  // Your code here\n}\n\nfunction disparateImpactRatio(rates: Record<string, number>): number {\n  // Your code here\n}"
solutionCode: "interface Prediction {\n  group: string;\n  predicted: number;\n  actual: number;\n}\n\nfunction demographicParity(predictions: Prediction[]): Record<string, number> {\n  const groups: Record<string, { positive: number; total: number }> = {};\n\n  for (const p of predictions) {\n    if (!groups[p.group]) groups[p.group] = { positive: 0, total: 0 };\n    groups[p.group].total++;\n    if (p.predicted === 1) groups[p.group].positive++;\n  }\n\n  const rates: Record<string, number> = {};\n  for (const [group, stats] of Object.entries(groups)) {\n    rates[group] = stats.positive / stats.total;\n  }\n  return rates;\n}\n\nfunction disparateImpactRatio(rates: Record<string, number>): number {\n  const values = Object.values(rates);\n  return Math.min(...values) / Math.max(...values);\n}"
testCode: "describe('Fairness Metrics', () => {\n  const predictions: Prediction[] = [\n    { group: 'A', predicted: 1, actual: 1 },\n    { group: 'A', predicted: 1, actual: 0 },\n    { group: 'A', predicted: 1, actual: 1 },\n    { group: 'A', predicted: 0, actual: 0 },\n    { group: 'B', predicted: 1, actual: 1 },\n    { group: 'B', predicted: 0, actual: 1 },\n    { group: 'B', predicted: 0, actual: 0 },\n    { group: 'B', predicted: 0, actual: 0 },\n  ];\n\n  it('computes demographic parity rates', () => {\n    const rates = demographicParity(predictions);\n    expect(rates['A']).toBe(0.75);\n    expect(rates['B']).toBe(0.25);\n  });\n\n  it('computes disparate impact ratio', () => {\n    const rates = demographicParity(predictions);\n    const ratio = disparateImpactRatio(rates);\n    expect(ratio).toBeCloseTo(0.333, 2);\n  });\n\n  it('detects disparate impact below 0.8 threshold', () => {\n    const rates = demographicParity(predictions);\n    const ratio = disparateImpactRatio(rates);\n    expect(ratio).toBeLessThan(0.8);\n  });\n\n  it('parity rates track the data, not a memorized answer', () => {\n    const flipped = demographicParity([\n      { group: 'A', predicted: 0, actual: 0 },\n      { group: 'A', predicted: 0, actual: 1 },\n      { group: 'B', predicted: 1, actual: 1 },\n      { group: 'B', predicted: 1, actual: 0 },\n    ]);\n    expect(flipped['A']).toBe(0);\n    expect(flipped['B']).toBe(1);\n  });\n\n  it('ratio tracks the rates it is given', () => {\n    expect(disparateImpactRatio({ A: 0.5, B: 1.0 })).toBeCloseTo(0.5, 5);\n    expect(disparateImpactRatio({ A: 0.9, B: 0.9 })).toBeCloseTo(1.0, 5);\n  });\n});"
