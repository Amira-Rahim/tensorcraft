slug: audit-dataset
lessonSlug: dataset-bias
title: "Audit a Dataset for Bias"
instructions: "Write a function `auditDataset` that takes an array of data points (each with a `group` string and a `label` number of 0 or 1) and returns an object mapping each group to its count, proportion, and positive label rate. Flag any group whose proportion is below 0.1 (10%) by including `underrepresented: true` in its entry."
starterCode: "interface DataPoint {\n  group: string;\n  label: number;\n}\n\ninterface GroupAudit {\n  count: number;\n  proportion: number;\n  positiveRate: number;\n  underrepresented: boolean;\n}\n\nfunction auditDataset(data: DataPoint[]): Record<string, GroupAudit> {\n  // Your code here\n}"
solutionCode: "interface DataPoint {\n  group: string;\n  label: number;\n}\n\ninterface GroupAudit {\n  count: number;\n  proportion: number;\n  positiveRate: number;\n  underrepresented: boolean;\n}\n\nfunction auditDataset(data: DataPoint[]): Record<string, GroupAudit> {\n  const total = data.length;\n  const groups: Record<string, { count: number; positives: number }> = {};\n\n  for (const point of data) {\n    if (!groups[point.group]) groups[point.group] = { count: 0, positives: 0 };\n    groups[point.group].count++;\n    if (point.label === 1) groups[point.group].positives++;\n  }\n\n  const result: Record<string, GroupAudit> = {};\n  for (const [group, stats] of Object.entries(groups)) {\n    const proportion = stats.count / total;\n    result[group] = {\n      count: stats.count,\n      proportion,\n      positiveRate: stats.positives / stats.count,\n      underrepresented: proportion < 0.1,\n    };\n  }\n\n  return result;\n}"
testCode: "describe('auditDataset', () => {\n  const data = [\n    ...Array(80).fill(null).map(() => ({ group: 'A', label: 1 })),\n    ...Array(15).fill(null).map(() => ({ group: 'B', label: 1 })),\n    ...Array(5).fill(null).map(() => ({ group: 'C', label: 0 })),\n  ];\n  const result = auditDataset(data);\n\n  it('returns an entry for each group', () => {\n    expect(Object.keys(result).sort()).toEqual(['A', 'B', 'C']);\n  });\n\n  it('computes correct counts', () => {\n    expect(result['A'].count).toBe(80);\n    expect(result['B'].count).toBe(15);\n    expect(result['C'].count).toBe(5);\n  });\n\n  it('computes correct proportions', () => {\n    expect(result['A'].proportion).toBe(0.8);\n    expect(result['B'].proportion).toBe(0.15);\n    expect(result['C'].proportion).toBe(0.05);\n  });\n\n  it('flags underrepresented groups', () => {\n    expect(result['A'].underrepresented).toBe(false);\n    expect(result['B'].underrepresented).toBe(false);\n    expect(result['C'].underrepresented).toBe(true);\n  });\n\n  it('computes positive label rates', () => {\n    expect(result['A'].positiveRate).toBe(1);\n    expect(result['C'].positiveRate).toBe(0);\n  });\n\n  it('tracks a different dataset (no hard-coded answers)', () => {\n    const second = auditDataset([\n      { group: 'X', label: 0 },\n      { group: 'X', label: 1 },\n      ...Array(18).fill(null).map(() => ({ group: 'Y', label: 0 })),\n    ]);\n    expect(second['X'].count).toBe(2);\n    expect(second['X'].proportion).toBe(0.1);\n    expect(second['X'].underrepresented).toBe(false);\n    expect(second['X'].positiveRate).toBe(0.5);\n    expect(second['Y'].count).toBe(18);\n    expect(second['Y'].positiveRate).toBe(0);\n  });\n});"
