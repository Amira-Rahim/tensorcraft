slug: classical-ml
title: "Classical ML: When Neural Networks Aren't the Answer"
themeId: shared
order: 1
description: |
  Not every problem needs a neural network. You'll master logistic regression,
  decision trees, and k-nearest neighbors — learning when simpler models
  outperform deep learning and why interpretability matters. Bridge: "Classical
  ML models are like vanilla JS — no framework, full control, sometimes the
  right choice."
lessonCount: 5
prerequisites:
  - foundations
  - neural-networks
  - training-loop
track: foundations
lessons:
  - slug: logistic-regression
    title: "Logistic Regression: The 80/20 Model"
    order: 1
    estimatedMinutes: 25
    difficulty: beginner
    bridge: "Binary classification → if/else with confidence scores"
    summary: |
      When a simple model outperforms a neural network. Logistic regression
      as the baseline every ML engineer tries first. Sigmoid function,
      decision boundary, and why linear separability matters.

  - slug: decision-trees
    title: "Decision Trees: Interpretable by Default"
    order: 2
    estimatedMinutes: 25
    difficulty: beginner
    bridge: "Decision trees → nested if/else statements (identity bridge)"
    summary: |
      The most interpretable ML model. Splits, information gain, Gini impurity.
      When stakeholders need to understand why the model decided what it did.
      Overfitting via depth — same concept as component over-nesting.

  - slug: k-nearest-neighbors
    title: "k-Nearest Neighbors: The Simplest Algorithm"
    order: 3
    estimatedMinutes: 25
    difficulty: beginner
    bridge: "KNN → Array.sort() by distance, then .slice(0, k)"
    summary: |
      No training step at all — just store data and compare at inference.
      Distance metrics (Euclidean, Manhattan), choosing k, curse of
      dimensionality. When your dataset is small and interpretability matters.

  - slug: ensemble-methods
    title: "Ensemble Methods: Wisdom of Crowds"
    order: 4
    estimatedMinutes: 25
    difficulty: intermediate
    bridge: "Random forests → Promise.allSettled() with majority voting"
    summary: |
      Random forests, bagging, and boosting. Why combining weak models
      creates strong ones. Practical: when to use XGBoost vs. a neural
      network (spoiler: often).

  - slug: choosing-your-model
    title: "When NOT to Use Deep Learning"
    order: 5
    estimatedMinutes: 30
    difficulty: intermediate
    bridge: "Model selection → choosing the right npm package for the job"
    summary: |
      The decision framework: dataset size, interpretability requirements,
      compute constraints, time-to-deploy. Capstone exercise: given 5
      different datasets and constraints, recommend the right model family
      for each and justify your reasoning.
