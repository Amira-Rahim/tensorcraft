solutionCode: "function bootstrapSample<T>(data: T[]): T[] {\n  const sample: T[] = [];\n  for (let i = 0; i < data.length; i++) {\n    const idx = Math.floor(Math.random() * data.length);\n    sample.push(data[idx]);\n  }\n  return sample;\n}\n\nfunction majorityVote(predictions: number[]): number {\n  const votes = new Map<number, number>();\n  for (const pred of predictions) {\n    votes.set(pred, (votes.get(pred) ?? 0) + 1);\n  }\n  return [...votes.entries()].sort((a, b) => b[1] - a[1])[0][0];\n}\n\ninterface SimpleTree {\n  predict: (features: number[]) => number;\n}\n\nfunction randomForestPredict(trees: SimpleTree[], features: number[]): number {\n  const predictions = trees.map(tree => tree.predict(features));\n  return majorityVote(predictions);\n}\n\nconst mockTrees: SimpleTree[] = [\n  { predict: () => 1 },\n  { predict: () => 0 },\n  { predict: () => 1 },\n  { predict: () => 1 },\n  { predict: () => 0 },\n];\n\nconst forestPrediction = randomForestPredict(mockTrees, [1, 2, 3]);\nconst sampleResult = bootstrapSample([1, 2, 3, 4, 5]);\nconst voteResult = majorityVote([0, 1, 1, 0, 1]);"
testCode: "describe('Random Forest', () => { it('bootstrapSample returns same length', () => { expect(sampleResult.length).toBe(5); }); it('bootstrapSample only contains original values', () => { for (const val of sampleResult) { expect([1, 2, 3, 4, 5]).toContain(val); } }); it('majorityVote returns 1 for [0,1,1,0,1]', () => { expect(voteResult).toBe(1); }); it('majorityVote handles unanimous', () => { expect(majorityVote([0, 0, 0])).toBe(0); }); it('forest prediction is 1 (3 vs 2 vote)', () => { expect(forestPrediction).toBe(1); }); });"
