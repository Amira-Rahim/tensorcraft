title: "Build a Random Forest"
instructions: "Implement a simplified random forest. First, write bootstrapSample that creates a random sample with replacement from the input array. Then implement majorityVote that takes an array of predictions and returns the most common one. Finally, implement randomForestPredict that runs each tree's predict function on the features and returns the majority vote. Use 5 mock tree predictors provided in the starter code."
