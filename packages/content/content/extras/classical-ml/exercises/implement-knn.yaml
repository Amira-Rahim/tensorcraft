title: "Implement k-Nearest Neighbors"
instructions: "Implement KNN classification. First, write a euclideanDistance function that computes the straight-line distance between two points. Then implement knnClassify that finds the k nearest neighbors and returns the majority-vote label. Use the provided dataset and classify the test point with k=3."
