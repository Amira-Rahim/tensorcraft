solutionCode: "interface DataPoint {\n  features: number[];\n  label: string;\n}\n\nfunction euclideanDistance(a: number[], b: number[]): number {\n  return Math.sqrt(a.reduce((sum, val, i) => sum + (val - b[i]) ** 2, 0));\n}\n\nfunction knnClassify(query: number[], data: DataPoint[], k: number): string {\n  const sorted = data\n    .map(point => ({ label: point.label, distance: euclideanDistance(query, point.features) }))\n    .sort((a, b) => a.distance - b.distance);\n\n  const neighbors = sorted.slice(0, k);\n\n  const votes: Record<string, number> = {};\n  for (const n of neighbors) {\n    votes[n.label] = (votes[n.label] ?? 0) + 1;\n  }\n\n  return Object.entries(votes).sort((a, b) => b[1] - a[1])[0][0];\n}\n\nconst trainingData: DataPoint[] = [\n  { features: [1, 1], label: 'A' },\n  { features: [2, 2], label: 'A' },\n  { features: [1, 2], label: 'A' },\n  { features: [8, 8], label: 'B' },\n  { features: [9, 9], label: 'B' },\n  { features: [8, 9], label: 'B' },\n  { features: [5, 5], label: 'A' },\n];\n\nconst testPoint = [3, 3];\nconst prediction = knnClassify(testPoint, trainingData, 3);"
testCode: "describe('KNN', () => { it('euclidean distance between same point is 0', () => { expect(euclideanDistance([1, 1], [1, 1])).toBe(0); }); it('euclidean distance is correct', () => { expect(euclideanDistance([0, 0], [3, 4])).toBeCloseTo(5); }); it('classifies test point as A', () => { expect(prediction).toBe('A'); }); it('classifies a point near B cluster as B', () => { expect(knnClassify([9, 8], trainingData, 3)).toBe('B'); }); it('handles k=1', () => { expect(knnClassify([1, 1], trainingData, 1)).toBe('A'); }); });"
