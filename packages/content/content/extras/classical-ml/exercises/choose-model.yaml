slug: choose-model
lessonSlug: choosing-your-model
title: "Choose the Right Model"
instructions: "Implement a recommendModel function that takes a problem specification and returns the best model family. Follow these rules: (1) image/audio data → 'deep-learning', (2) text data with < 1000 samples → 'logistic-regression', text with >= 1000 → 'deep-learning', (3) tabular data: if interpretability required → 'decision-tree', if dataset < 100 → 'knn', if dataset < 10000 → 'random-forest', otherwise → 'xgboost', (4) time-series with < 1000 samples → 'classical-stats', otherwise → 'deep-learning'."
starterCode: "type DataType = 'tabular' | 'image' | 'text' | 'time-series' | 'audio';\n\ninterface ProblemSpec {\n  dataType: DataType;\n  datasetSize: number;\n  needsInterpretability: boolean;\n}\n\n// Return one of: 'deep-learning', 'logistic-regression', 'decision-tree',\n// 'knn', 'random-forest', 'xgboost', 'classical-stats'\nfunction recommendModel(spec: ProblemSpec): string {\n  // Your code here\n  return '';\n}\n\n// Test scenarios\nconst scenario1 = recommendModel({ dataType: 'image', datasetSize: 50000, needsInterpretability: false });\nconst scenario2 = recommendModel({ dataType: 'tabular', datasetSize: 50, needsInterpretability: false });\nconst scenario3 = recommendModel({ dataType: 'tabular', datasetSize: 5000, needsInterpretability: true });\nconst scenario4 = recommendModel({ dataType: 'text', datasetSize: 500, needsInterpretability: false });\nconst scenario5 = recommendModel({ dataType: 'tabular', datasetSize: 50000, needsInterpretability: false });"
solutionCode: "type DataType = 'tabular' | 'image' | 'text' | 'time-series' | 'audio';\n\ninterface ProblemSpec {\n  dataType: DataType;\n  datasetSize: number;\n  needsInterpretability: boolean;\n}\n\nfunction recommendModel(spec: ProblemSpec): string {\n  if (spec.dataType === 'image' || spec.dataType === 'audio') {\n    return 'deep-learning';\n  }\n\n  if (spec.dataType === 'text') {\n    return spec.datasetSize < 1000 ? 'logistic-regression' : 'deep-learning';\n  }\n\n  if (spec.dataType === 'tabular') {\n    if (spec.needsInterpretability) return 'decision-tree';\n    if (spec.datasetSize < 100) return 'knn';\n    if (spec.datasetSize < 10000) return 'random-forest';\n    return 'xgboost';\n  }\n\n  if (spec.dataType === 'time-series') {\n    return spec.datasetSize < 1000 ? 'classical-stats' : 'deep-learning';\n  }\n\n  return 'logistic-regression';\n}\n\nconst scenario1 = recommendModel({ dataType: 'image', datasetSize: 50000, needsInterpretability: false });\nconst scenario2 = recommendModel({ dataType: 'tabular', datasetSize: 50, needsInterpretability: false });\nconst scenario3 = recommendModel({ dataType: 'tabular', datasetSize: 5000, needsInterpretability: true });\nconst scenario4 = recommendModel({ dataType: 'text', datasetSize: 500, needsInterpretability: false });\nconst scenario5 = recommendModel({ dataType: 'tabular', datasetSize: 50000, needsInterpretability: false });"
testCode: "describe('Model Selection', () => { it('recommends deep-learning for images', () => { expect(scenario1).toBe('deep-learning'); }); it('recommends knn for small tabular data', () => { expect(scenario2).toBe('knn'); }); it('recommends decision-tree when interpretability needed', () => { expect(scenario3).toBe('decision-tree'); }); it('recommends logistic-regression for small text datasets', () => { expect(scenario4).toBe('logistic-regression'); }); it('recommends xgboost for large tabular data', () => { expect(scenario5).toBe('xgboost'); }); it('recommends deep-learning for audio', () => { expect(recommendModel({ dataType: 'audio', datasetSize: 10000, needsInterpretability: false })).toBe('deep-learning'); }); it('recommends random-forest for medium tabular', () => { expect(recommendModel({ dataType: 'tabular', datasetSize: 5000, needsInterpretability: false })).toBe('random-forest'); }); });"
estimatedMinutes: 15
difficulty: intermediate
