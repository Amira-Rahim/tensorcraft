lessonSlug: decision-trees
title: "Build a Decision Tree"
instructions: "Implement the giniImpurity function that measures how mixed the class labels are in a group. Then implement findBestSplit, which tries every feature and threshold to find the split that minimizes weighted Gini impurity. The giniImpurity of a pure group should be 0 and a perfectly mixed binary group should be 0.5."
starterCode: "interface DataPoint {\n  features: number[];\n  label: number;\n}\n\n// Calculate Gini impurity: 1 - sum(p_i^2) for each class\nfunction giniImpurity(labels: number[]): number {\n  // Your code here\n  return 0;\n}\n\n// Find the best feature index and threshold to split on\nfunction findBestSplit(data: DataPoint[]): { featureIndex: number; threshold: number } {\n  // Your code here\n  return { featureIndex: 0, threshold: 0 };\n}\n\nconst dataset: DataPoint[] = [\n  { features: [2, 3], label: 0 },\n  { features: [1, 1], label: 0 },\n  { features: [7, 8], label: 1 },\n  { features: [8, 7], label: 1 },\n  { features: [6, 9], label: 1 },\n];\n\nconst pureGini = giniImpurity([1, 1, 1]);\nconst mixedGini = giniImpurity([0, 1, 0, 1]);\nconst split = findBestSplit(dataset);"
solutionCode: "interface DataPoint {\n  features: number[];\n  label: number;\n}\n\nfunction giniImpurity(labels: number[]): number {\n  const total = labels.length;\n  if (total === 0) return 0;\n  const counts = new Map<number, number>();\n  for (const label of labels) {\n    counts.set(label, (counts.get(label) ?? 0) + 1);\n  }\n  let impurity = 1;\n  for (const count of counts.values()) {\n    const p = count / total;\n    impurity -= p * p;\n  }\n  return impurity;\n}\n\nfunction findBestSplit(data: DataPoint[]): { featureIndex: number; threshold: number } {\n  let bestGini = Infinity;\n  let bestFeature = 0;\n  let bestThreshold = 0;\n  const numFeatures = data[0].features.length;\n\n  for (let f = 0; f < numFeatures; f++) {\n    const values = [...new Set(data.map(d => d.features[f]))].sort((a, b) => a - b);\n    for (let i = 0; i < values.length - 1; i++) {\n      const threshold = (values[i] + values[i + 1]) / 2;\n      const left = data.filter(d => d.features[f] <= threshold).map(d => d.label);\n      const right = data.filter(d => d.features[f] > threshold).map(d => d.label);\n      const weightedGini = (left.length / data.length) * giniImpurity(left) + (right.length / data.length) * giniImpurity(right);\n      if (weightedGini < bestGini) {\n        bestGini = weightedGini;\n        bestFeature = f;\n        bestThreshold = threshold;\n      }\n    }\n  }\n  return { featureIndex: bestFeature, threshold: bestThreshold };\n}\n\nconst dataset: DataPoint[] = [\n  { features: [2, 3], label: 0 },\n  { features: [1, 1], label: 0 },\n  { features: [7, 8], label: 1 },\n  { features: [8, 7], label: 1 },\n  { features: [6, 9], label: 1 },\n];\n\nconst pureGini = giniImpurity([1, 1, 1]);\nconst mixedGini = giniImpurity([0, 1, 0, 1]);\nconst split = findBestSplit(dataset);"
testCode: "describe('Decision Tree', () => { it('pure group has gini 0', () => { expect(pureGini).toBe(0); }); it('evenly mixed group has gini 0.5', () => { expect(mixedGini).toBe(0.5); }); it('empty group has gini 0', () => { expect(giniImpurity([])).toBe(0); }); it('findBestSplit returns a valid feature index', () => { expect(split.featureIndex).toBeGreaterThanOrEqual(0); expect(split.featureIndex).toBeLessThan(2); }); it('split separates classes', () => { const left = dataset.filter(d => d.features[split.featureIndex] <= split.threshold); const right = dataset.filter(d => d.features[split.featureIndex] > split.threshold); expect(giniImpurity(left.map(d => d.label))).toBeLessThan(mixedGini); expect(giniImpurity(right.map(d => d.label))).toBeLessThan(mixedGini); }); });"
