title: "Implement Logistic Regression"
instructions: "Implement a sigmoid function and a predict function for logistic regression. The sigmoid function should map any number to the range (0, 1). The predict function should compute the weighted sum of features, add the bias, and apply sigmoid. Use the provided weights and bias to classify the test data point."
starterCode: "// Implement the sigmoid function\nfunction sigmoid(x: number): number {\n  // Your code here\n  return 0;\n}\n\n// Implement the predict function\n// It should compute: sigmoid(features[0]*weights[0] + features[1]*weights[1] + ... + bias)\nfunction predict(features: number[], weights: number[], bias: number): number {\n  // Your code here\n  return 0;\n}\n\nconst weights = [0.5, -0.3, 0.8];\nconst bias = -0.2;\nconst testPoint = [3, 1, 2];\n\nconst probability = predict(testPoint, weights, bias);\nconst label = probability >= 0.5;"
solutionCode: "function sigmoid(x: number): number {\n  return 1 / (1 + Math.exp(-x));\n}\n\nfunction predict(features: number[], weights: number[], bias: number): number {\n  const z = features.reduce((sum, f, i) => sum + f * weights[i], 0) + bias;\n  return sigmoid(z);\n}\n\nconst weights = [0.5, -0.3, 0.8];\nconst bias = -0.2;\nconst testPoint = [3, 1, 2];\n\nconst probability = predict(testPoint, weights, bias);\nconst label = probability >= 0.5;"
testCode: "describe('Logistic Regression', () => { it('sigmoid of 0 is 0.5', () => { expect(sigmoid(0)).toBeCloseTo(0.5); }); it('sigmoid of large positive is near 1', () => { expect(sigmoid(10)).toBeGreaterThan(0.99); }); it('sigmoid of large negative is near 0', () => { expect(sigmoid(-10)).toBeLessThan(0.01); }); it('predict returns a value between 0 and 1', () => { expect(probability).toBeGreaterThan(0); expect(probability).toBeLessThan(1); }); it('predict computes correct value', () => { expect(probability).toBeCloseTo(sigmoid(0.5*3 + (-0.3)*1 + 0.8*2 + (-0.2))); }); it('classifies the test point', () => { expect(label).toBe(true); }); });"
estimatedMinutes: 15
