slug: visualize-loss-surface
lessonSlug: optimization-landscape
title: "Visualize Loss Surface"
instructions: "Implement SGD with momentum to minimize a non-convex loss function. (1) `sgdStep` takes the current weight, gradient, learning rate, current velocity, and momentum coefficient, and returns an object { weight, velocity } after one momentum update. The update rules are: newVelocity = momentum * velocity - lr * gradient, newWeight = weight + newVelocity. (2) `optimizeWithMomentum` runs SGD with momentum for a given number of steps on the loss function L(w) = sin(3w) + 0.5*w^2 - w (gradient: 3*cos(3w) + w - 1). Return an array of { weight, loss } objects for each step including the initial state."
starterCode: "// Single SGD momentum step\nexport function sgdStep(\n  weight: number,\n  gradient: number,\n  lr: number,\n  velocity: number,\n  momentum: number\n): { weight: number; velocity: number } {\n  // your code here\n  return { weight: 0, velocity: 0 };\n}\n\n// Run optimization for N steps on L(w) = sin(3w) + 0.5*w^2 - w\nexport function optimizeWithMomentum(\n  initialWeight: number,\n  lr: number,\n  momentum: number,\n  steps: number\n): Array<{ weight: number; loss: number }> {\n  // your code here\n  return [];\n}"
solutionCode: "export function sgdStep(\n  weight: number,\n  gradient: number,\n  lr: number,\n  velocity: number,\n  momentum: number\n): { weight: number; velocity: number } {\n  const newVelocity = momentum * velocity - lr * gradient;\n  const newWeight = weight + newVelocity;\n  return { weight: newWeight, velocity: newVelocity };\n}\n\nexport function optimizeWithMomentum(\n  initialWeight: number,\n  lr: number,\n  momentum: number,\n  steps: number\n): Array<{ weight: number; loss: number }> {\n  const loss = (w: number) => Math.sin(3 * w) + 0.5 * w * w - w;\n  const grad = (w: number) => 3 * Math.cos(3 * w) + w - 1;\n  const history: Array<{ weight: number; loss: number }> = [];\n  let w = initialWeight;\n  let v = 0;\n  history.push({ weight: w, loss: loss(w) });\n  for (let i = 0; i < steps; i++) {\n    const g = grad(w);\n    const result = sgdStep(w, g, lr, v, momentum);\n    w = result.weight;\n    v = result.velocity;\n    history.push({ weight: w, loss: loss(w) });\n  }\n  return history;\n}"
testCode: "describe('SGD with Momentum', () => { it('sgdStep applies momentum update correctly', () => { const result = sgdStep(5.0, 2.0, 0.1, 0, 0); expect(result.velocity).toBeCloseTo(-0.2, 6); expect(result.weight).toBeCloseTo(4.8, 6); }); it('sgdStep accumulates velocity with momentum', () => { const step1 = sgdStep(5.0, 2.0, 0.1, 0, 0.9); const step2 = sgdStep(step1.weight, 2.0, 0.1, step1.velocity, 0.9); expect(Math.abs(step2.velocity)).toBeGreaterThan(Math.abs(step1.velocity)); }); it('optimizeWithMomentum returns correct history length', () => { const history = optimizeWithMomentum(3.0, 0.01, 0.9, 50); expect(history.length).toBe(51); }); it('optimizeWithMomentum reduces loss', () => { const history = optimizeWithMomentum(3.0, 0.01, 0.9, 100); expect(history[history.length - 1].loss).toBeLessThan(history[0].loss); }); it('momentum converges faster than plain SGD', () => { const withMom = optimizeWithMomentum(3.0, 0.01, 0.9, 50); const noMom = optimizeWithMomentum(3.0, 0.01, 0, 50); expect(withMom[withMom.length - 1].loss).toBeLessThanOrEqual(noMom[noMom.length - 1].loss); }); });"
