slug: bayes-update
lessonSlug: probability-and-bayes
title: "Bayesian Update"
instructions: "Implement two functions: (1) `bayesUpdate` takes a prior probability distribution array and a likelihood array (same length), and returns the posterior distribution by multiplying element-wise and normalizing so the values sum to 1. (2) `sequentialBayesUpdate` takes an initial prior and an array of likelihood arrays (one per observation), applies bayesUpdate sequentially for each observation (the posterior from one step becomes the prior for the next), and returns an array of posterior distributions, one after each observation."
starterCode: "// Single Bayesian update: posterior = normalize(prior * likelihood)\nexport function bayesUpdate(\n  prior: number[],\n  likelihood: number[]\n): number[] {\n  // your code here\n  return [];\n}\n\n// Sequential updates: apply multiple observations one at a time\nexport function sequentialBayesUpdate(\n  initialPrior: number[],\n  likelihoods: number[][]\n): number[][] {\n  // your code here\n  return [];\n}"
solutionCode: "export function bayesUpdate(\n  prior: number[],\n  likelihood: number[]\n): number[] {\n  const unnormalized = prior.map((p, i) => p * likelihood[i]);\n  const total = unnormalized.reduce((s, v) => s + v, 0);\n  return unnormalized.map(v => v / total);\n}\n\nexport function sequentialBayesUpdate(\n  initialPrior: number[],\n  likelihoods: number[][]\n): number[][] {\n  const posteriors: number[][] = [];\n  let current = initialPrior;\n  for (const likelihood of likelihoods) {\n    current = bayesUpdate(current, likelihood);\n    posteriors.push(current);\n  }\n  return posteriors;\n}"
testCode: "describe('Bayesian Update', () => { it('bayesUpdate produces normalized posterior', () => { const posterior = bayesUpdate([0.5, 0.5], [0.9, 0.1]); const sum = posterior.reduce((s, v) => s + v, 0); expect(sum).toBeCloseTo(1, 6); }); it('bayesUpdate with equal likelihood preserves prior', () => { const posterior = bayesUpdate([0.7, 0.3], [1, 1]); expect(posterior[0]).toBeCloseTo(0.7, 6); expect(posterior[1]).toBeCloseTo(0.3, 6); }); it('bayesUpdate shifts belief toward higher likelihood', () => { const posterior = bayesUpdate([0.5, 0.5], [0.9, 0.1]); expect(posterior[0]).toBeGreaterThan(0.5); expect(posterior[1]).toBeLessThan(0.5); }); it('bayesUpdate computes correct values', () => { const posterior = bayesUpdate([0.5, 0.5], [0.8, 0.2]); expect(posterior[0]).toBeCloseTo(0.8, 6); expect(posterior[1]).toBeCloseTo(0.2, 6); }); it('sequentialBayesUpdate returns correct number of posteriors', () => { const result = sequentialBayesUpdate([0.5, 0.5], [[0.9, 0.1], [0.9, 0.1]]); expect(result.length).toBe(2); }); it('sequentialBayesUpdate accumulates evidence', () => { const result = sequentialBayesUpdate([0.5, 0.5], [[0.9, 0.1], [0.9, 0.1], [0.9, 0.1]]); expect(result[2][0]).toBeGreaterThan(result[1][0]); expect(result[1][0]).toBeGreaterThan(result[0][0]); }); it('sequentialBayesUpdate each posterior sums to 1', () => { const result = sequentialBayesUpdate([0.5, 0.5], [[0.8, 0.2], [0.3, 0.7]]); result.forEach(post => { const sum = post.reduce((s, v) => s + v, 0); expect(sum).toBeCloseTo(1, 6); }); }); });"
