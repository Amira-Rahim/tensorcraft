title: "Power Iteration"
instructions: "Implement the dominant-eigenvector finder from the lesson: (1) `matVec` multiplies a matrix (array of rows) by a vector: each output component is the dot product of one row with the vector. (2) `normalizeVec` scales a vector to unit Euclidean length. (3) `powerIteration` starts from a normalized all-ones vector, applies the matrix and re-normalizes `steps` times, and returns the final unit vector together with its eigenvalue estimated by the Rayleigh quotient (the dot product of the final vector with the matrix applied to it)."
starterCode: "// Matrix (array of rows) times vector\nexport function matVec(A: number[][], v: number[]): number[] {\n  // your code here\n  return [];\n}\n\n// Scale v to unit Euclidean length\nexport function normalizeVec(v: number[]): number[] {\n  // your code here\n  return [];\n}\n\n// Dominant eigenvector and eigenvalue via power iteration\nexport function powerIteration(\n  A: number[][],\n  steps: number\n): { vector: number[]; value: number } {\n  // your code here\n  return { vector: [], value: 0 };\n}"
solutionCode: "export function matVec(A: number[][], v: number[]): number[] {\n  return A.map((row) => row.reduce((s, a, j) => s + a * v[j], 0));\n}\n\nexport function normalizeVec(v: number[]): number[] {\n  const norm = Math.sqrt(v.reduce((s, x) => s + x * x, 0));\n  return v.map((x) => x / norm);\n}\n\nexport function powerIteration(\n  A: number[][],\n  steps: number\n): { vector: number[]; value: number } {\n  let v = normalizeVec(Array(A.length).fill(1));\n  for (let i = 0; i < steps; i++) v = normalizeVec(matVec(A, v));\n  const Av = matVec(A, v);\n  const value = v.reduce((s, x, i) => s + x * Av[i], 0);\n  return { vector: v, value };\n}"
testCode: "describe('Power Iteration', () => { it('matVec multiplies rows by the vector', () => { expect(matVec([[1, 2], [3, 4]], [1, 1])).toEqual([3, 7]); }); it('matVec handles the identity', () => { expect(matVec([[1, 0], [0, 1]], [5, -2])).toEqual([5, -2]); }); it('normalizeVec produces unit length', () => { const u = normalizeVec([3, 4]); expect(u[0]).toBeCloseTo(0.6, 6); expect(u[1]).toBeCloseTo(0.8, 6); const len = Math.sqrt(u.reduce((s, x) => s + x * x, 0)); expect(len).toBeCloseTo(1, 10); }); it('finds the doubling axis of diag(2, 1)', () => { const { vector, value } = powerIteration([[2, 0], [0, 1]], 40); expect(value).toBeCloseTo(2, 5); expect(Math.abs(vector[0])).toBeCloseTo(1, 5); expect(Math.abs(vector[1])).toBeCloseTo(0, 5); }); it('finds the dominant eigenpair of a symmetric matrix', () => { const { vector, value } = powerIteration([[2, 1], [1, 2]], 40); expect(value).toBeCloseTo(3, 5); expect(vector[0]).toBeCloseTo(Math.SQRT1_2, 5); expect(vector[1]).toBeCloseTo(Math.SQRT1_2, 5); }); it('finds the stationary direction of a column-stochastic matrix', () => { const { vector, value } = powerIteration([[0.9, 0.2], [0.1, 0.8]], 60); expect(value).toBeCloseTo(1, 5); expect(vector[0] / vector[1]).toBeCloseTo(2, 4); }); it('returned vector is unit length', () => { const { vector } = powerIteration([[2, 1], [1, 2]], 40); const len = Math.sqrt(vector.reduce((s, x) => s + x * x, 0)); expect(len).toBeCloseTo(1, 10); }); });"
