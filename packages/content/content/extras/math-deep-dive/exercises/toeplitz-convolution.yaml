lessonSlug: convolution-as-matrix
title: "Toeplitz Convolution"
instructions: "Implement two functions: (1) `buildToeplitz` that takes a kernel array and input length, and returns a 2D array representing the Toeplitz matrix for 'valid' convolution (output length = inputLength - kernelLength + 1). Each row should be the kernel placed at the corresponding position, padded with zeros. (2) `convolveViaMatrix` that uses your Toeplitz matrix with TensorFlow.js matrix multiplication to compute the convolution result, returning a 1D tensor."
starterCode: "import * as tf from '@tensorflow/tfjs';\n\n// Build a Toeplitz matrix for 'valid' convolution\nexport function buildToeplitz(\n  kernel: number[],\n  inputLength: number\n): number[][] {\n  // your code here\n  return [];\n}\n\n// Convolve using matrix multiplication via the Toeplitz matrix\nexport function convolveViaMatrix(\n  kernel: number[],\n  input: tf.Tensor1D\n): tf.Tensor1D {\n  // your code here\n  return null as any;\n}"
solutionCode: "import * as tf from '@tensorflow/tfjs';\n\nexport function buildToeplitz(\n  kernel: number[],\n  inputLength: number\n): number[][] {\n  const outputLength = inputLength - kernel.length + 1;\n  const matrix: number[][] = [];\n  for (let i = 0; i < outputLength; i++) {\n    const row = new Array(inputLength).fill(0);\n    for (let j = 0; j < kernel.length; j++) {\n      row[i + j] = kernel[j];\n    }\n    matrix.push(row);\n  }\n  return matrix;\n}\n\nexport function convolveViaMatrix(\n  kernel: number[],\n  input: tf.Tensor1D\n): tf.Tensor1D {\n  const inputLength = input.shape[0];\n  const T = buildToeplitz(kernel, inputLength);\n  const toeplitzTensor = tf.tensor2d(T);\n  const result = tf.matMul(toeplitzTensor, input.reshape([inputLength, 1]));\n  return result.flatten() as tf.Tensor1D;\n}"
testCode: "describe('Toeplitz Convolution', () => { it('buildToeplitz creates correct matrix dimensions', () => { const T = buildToeplitz([1, 0, -1], 5); expect(T.length).toBe(3); expect(T[0].length).toBe(5); }); it('buildToeplitz places kernel correctly', () => { const T = buildToeplitz([1, 2, 3], 5); expect(T[0]).toEqual([1, 2, 3, 0, 0]); expect(T[1]).toEqual([0, 1, 2, 3, 0]); expect(T[2]).toEqual([0, 0, 1, 2, 3]); }); it('convolveViaMatrix returns expected output length', async () => { const kernel = [1, 0, -1]; const input = tf.tensor1d([3, 7, 2, 8, 4]); const matResult = await convolveViaMatrix(kernel, input).array(); expect(matResult.length).toBe(3); }); it('convolveViaMatrix works with different kernel sizes', async () => { const kernel = [0.25, 0.5, 0.25]; const input = tf.tensor1d([1, 2, 3, 4, 5, 6]); const result = await convolveViaMatrix(kernel, input).array(); expect(result.length).toBe(4); }); });"
