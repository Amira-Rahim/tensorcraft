title: "Linear Algebra Operations"
instructions: "Implement three functions: (1) `linearCombination` that takes two vectors and two scalar coefficients and returns their linear combination (a*v1 + b*v2), (2) `matMulCompose` that takes two 2x2 transformation matrices and returns their composition via matrix multiplication, and (3) `isLinearlyIndependent` that takes two 2D vectors and returns true if they are linearly independent (their determinant is non-zero, using an epsilon of 1e-6)."
starterCode: "import * as tf from '@tensorflow/tfjs';\n\n// Return a*v1 + b*v2\nexport function linearCombination(\n  v1: tf.Tensor1D, v2: tf.Tensor1D, a: number, b: number\n): tf.Tensor1D {\n  // your code here\n  return null as any;\n}\n\n// Return the composition of two 2x2 matrices (A * B)\nexport function matMulCompose(\n  A: tf.Tensor2D, B: tf.Tensor2D\n): tf.Tensor2D {\n  // your code here\n  return null as any;\n}\n\n// Return true if two 2D vectors are linearly independent\nexport function isLinearlyIndependent(\n  v1: tf.Tensor1D, v2: tf.Tensor1D\n): boolean {\n  // your code here\n  return false;\n}"
solutionCode: "import * as tf from '@tensorflow/tfjs';\n\nexport function linearCombination(\n  v1: tf.Tensor1D, v2: tf.Tensor1D, a: number, b: number\n): tf.Tensor1D {\n  return v1.mul(a).add(v2.mul(b)) as tf.Tensor1D;\n}\n\nexport function matMulCompose(\n  A: tf.Tensor2D, B: tf.Tensor2D\n): tf.Tensor2D {\n  return tf.matMul(A, B) as tf.Tensor2D;\n}\n\nexport function isLinearlyIndependent(\n  v1: tf.Tensor1D, v2: tf.Tensor1D\n): boolean {\n  const v1Data = v1.arraySync() as number[];\n  const v2Data = v2.arraySync() as number[];\n  const det = v1Data[0] * v2Data[1] - v1Data[1] * v2Data[0];\n  return Math.abs(det) > 1e-6;\n}"
testCode: "describe('Linear Algebra Ops', () => { it('linearCombination computes a*v1 + b*v2', async () => { const v1 = tf.tensor1d([1, 0]); const v2 = tf.tensor1d([0, 1]); const result = linearCombination(v1, v2, 3, 7); expect(await result.array()).toEqual([3, 7]); }); it('linearCombination works with non-standard basis', async () => { const v1 = tf.tensor1d([2, 1]); const v2 = tf.tensor1d([1, 3]); const result = linearCombination(v1, v2, 1, -1); expect(await result.array()).toEqual([1, -2]); }); it('matMulCompose multiplies matrices correctly', async () => { const A = tf.tensor2d([[0, -1], [1, 0]]); const B = tf.tensor2d([[2, 0], [0, 3]]); const result = matMulCompose(A, B); expect(await result.array()).toEqual([[0, -3], [2, 0]]); }); it('isLinearlyIndependent returns true for independent vectors', () => { const v1 = tf.tensor1d([1, 0]); const v2 = tf.tensor1d([0, 1]); expect(isLinearlyIndependent(v1, v2)).toBe(true); }); it('isLinearlyIndependent returns false for dependent vectors', () => { const v1 = tf.tensor1d([1, 2]); const v2 = tf.tensor1d([2, 4]); expect(isLinearlyIndependent(v1, v2)).toBe(false); }); });"
