title: "Compute Gradients"
instructions: "Implement two functions: (1) `manualGradient` that computes the gradient of a simple 2-layer network by hand using the chain rule. The network computes: z1 = w1 * x, a1 = relu(z1), z2 = w2 * a1, loss = (z2 - y)^2. Return dLoss/dw1. (2) `autoGradient` that uses tf.grad() to compute the same gradient automatically, verifying your manual computation."
starterCode: "import * as tf from '@tensorflow/tfjs';\n\n// Compute dLoss/dw1 manually using the chain rule\n// Network: z1 = w1*x, a1 = relu(z1), z2 = w2*a1, loss = (z2 - y)^2\nexport function manualGradient(\n  x: number, y: number, w1: number, w2: number\n): number {\n  // Forward pass, then chain rule backward\n  // your code here\n  return 0;\n}\n\n// Compute dLoss/dw1 using TensorFlow.js automatic differentiation\nexport function autoGradient(\n  x: number, y: number, w1: number, w2: number\n): tf.Tensor {\n  // Use tf.grad to compute the gradient\n  // your code here\n  return null as any;\n}"
solutionCode: "import * as tf from '@tensorflow/tfjs';\n\nexport function manualGradient(\n  x: number, y: number, w1: number, w2: number\n): number {\n  // Forward pass\n  const z1 = w1 * x;\n  const a1 = Math.max(0, z1); // ReLU\n  const z2 = w2 * a1;\n  // Backward pass (chain rule)\n  const dLoss_dz2 = 2 * (z2 - y);\n  const dz2_da1 = w2;\n  const da1_dz1 = z1 > 0 ? 1 : 0;\n  const dz1_dw1 = x;\n  return dLoss_dz2 * dz2_da1 * da1_dz1 * dz1_dw1;\n}\n\nexport function autoGradient(\n  x: number, y: number, w1: number, w2: number\n): tf.Tensor {\n  const gradFn = tf.grad((w1t: tf.Tensor) => {\n    const z1 = w1t.mul(x);\n    const a1 = z1.relu();\n    const z2 = tf.scalar(w2).mul(a1);\n    return z2.sub(y).square();\n  });\n  return gradFn(tf.scalar(w1));\n}"
testCode: "describe('Compute Gradients', () => { it('manualGradient computes correct gradient for positive z1', () => { const grad = manualGradient(2, 1, 0.5, -0.3); expect(grad).toBeCloseTo(1.56, 4); }); it('manualGradient returns 0 when ReLU is inactive (z1 <= 0)', () => { const grad = manualGradient(2, 1, -0.5, 0.3); expect(grad).toBe(0); }); it('autoGradient agrees with the hand-derived chain rule (1.56)', async () => { const auto = await autoGradient(2, 1, 0.5, -0.3).array(); expect(auto).toBeCloseTo(1.56, 3); }); it('autoGradient is zero when ReLU gates the path (z1 <= 0)', async () => { const auto = await autoGradient(2, 1, -0.5, 0.3).array(); expect(auto).toBeCloseTo(0, 5); }); });"
