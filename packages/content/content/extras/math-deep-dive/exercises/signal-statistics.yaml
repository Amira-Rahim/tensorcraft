title: "Signal Statistics"
instructions: "Implement the three statistical tools from the lesson: (1) `binomialProbability` computes P(exactly k successes in n independent tries) = C(n, k) * p^k * (1-p)^(n-k). Build the binomial coefficient C(n, k) iteratively (multiply running product by (n - i) / (i + 1)) rather than with factorials, so large n does not overflow. (2) `normalPdf` evaluates the Normal density (1 / (sigma * sqrt(2 * PI))) * exp(-((x - mu)^2) / (2 * sigma^2)). (3) `standardize` maps an array to z-scores: subtract the mean, divide by the population standard deviation (squared deviations averaged over n, not n - 1)."
starterCode: "// P(exactly k successes in n tries), success probability p\nexport function binomialProbability(n: number, k: number, p: number): number {\n  // your code here\n  return 0;\n}\n\n// Normal probability density at x for Normal(mu, sigma)\nexport function normalPdf(x: number, mu: number, sigma: number): number {\n  // your code here\n  return 0;\n}\n\n// Map values to z-scores using the population standard deviation\nexport function standardize(values: number[]): number[] {\n  // your code here\n  return [];\n}"
solutionCode: "export function binomialProbability(n: number, k: number, p: number): number {\n  let c = 1;\n  for (let i = 0; i < k; i++) c = (c * (n - i)) / (i + 1);\n  return c * p ** k * (1 - p) ** (n - k);\n}\n\nexport function normalPdf(x: number, mu: number, sigma: number): number {\n  const coeff = 1 / (sigma * Math.sqrt(2 * Math.PI));\n  return coeff * Math.exp(-((x - mu) ** 2) / (2 * sigma ** 2));\n}\n\nexport function standardize(values: number[]): number[] {\n  const mean = values.reduce((s, v) => s + v, 0) / values.length;\n  const variance = values.reduce((s, v) => s + (v - mean) ** 2, 0) / values.length;\n  const std = Math.sqrt(variance);\n  return values.map((v) => (v - mean) / std);\n}"
testCode: "describe('Signal Statistics', () => { it('binomial with one try and k=0 is the failure probability', () => { expect(binomialProbability(1, 0, 0.3)).toBeCloseTo(0.7, 6); }); it('one head in two fair flips is 0.5', () => { expect(binomialProbability(2, 1, 0.5)).toBeCloseTo(0.5, 6); }); it('three heads in four fair flips is 0.25', () => { expect(binomialProbability(4, 3, 0.5)).toBeCloseTo(0.25, 6); }); it('binomial PMF sums to 1 over all k', () => { let total = 0; for (let k = 0; k <= 4; k++) total += binomialProbability(4, k, 0.3); expect(total).toBeCloseTo(1, 6); }); it('all-quiet probability from the lesson: 64 channels at 5%', () => { expect(binomialProbability(64, 0, 0.05)).toBeCloseTo(0.0375, 4); }); it('standard normal peaks at 0.3989', () => { expect(normalPdf(0, 0, 1)).toBeCloseTo(0.39894, 4); }); it('normal PDF is symmetric around mu', () => { expect(normalPdf(1, 0, 1)).toBeCloseTo(normalPdf(-1, 0, 1), 10); expect(normalPdf(1, 0, 1)).toBeCloseTo(0.24197, 4); }); it('doubling sigma halves the peak density', () => { expect(normalPdf(0, 0, 2)).toBeCloseTo(0.19947, 4); }); it('narrow distributions have density above 1', () => { expect(normalPdf(0, 0, 0.1)).toBeCloseTo(3.98942, 4); }); it('standardize produces the expected z-scores', () => { const z = standardize([2, 4, 6]); expect(z[0]).toBeCloseTo(-1.22474, 4); expect(z[1]).toBeCloseTo(0, 10); expect(z[2]).toBeCloseTo(1.22474, 4); }); it('standardized output has mean 0 and population std 1', () => { const z = standardize([3, 7, 7, 19, 24]); const mean = z.reduce((s, v) => s + v, 0) / z.length; const variance = z.reduce((s, v) => s + (v - mean) ** 2, 0) / z.length; expect(mean).toBeCloseTo(0, 10); expect(Math.sqrt(variance)).toBeCloseTo(1, 10); }); });"
