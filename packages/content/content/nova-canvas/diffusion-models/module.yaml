description: |
  MUSE finally renders something worth hanging, and it takes 43 seconds a frame
  on kiosks that have to serve two hundred visitors. Getting to 3.4 seconds means
  understanding the whole diffusion process first: what the noise schedule
  actually buys, what the U-Net predicts, how a prompt gets amplified, and why
  the last stage of the pipeline upscales instead of generating big.
