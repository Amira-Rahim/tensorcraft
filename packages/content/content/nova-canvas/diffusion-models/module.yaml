description: |
  First high-quality images from MUSE — but at 43 seconds per render, the gallery
  kiosks grind to a halt. Erdem panics. You'll master the diffusion process from
  noise schedules to classifier-free guidance, then use progressive distillation
  to bring generation down to 3.4 seconds. Diffusion is just progressive image
  loading — the blur-up technique you already know.
