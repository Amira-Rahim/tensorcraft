title: "Build a Super-Resolution Upscaler"
instructions: "Build a simple super-resolution model using TensorFlow.js that upscales a 32x32x3 image to 128x128x3. Use two upSampling2d layers (each doubling spatial dimensions) with conv2d layers after each upsample. The final output should use sigmoid activation."
