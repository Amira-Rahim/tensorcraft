slug: noise-schedule
lessonSlug: noise-schedules
title: "Vectorized Cosine Noise Schedule"
mlContent: data
instructions: "Build `cosineAlphaBar(timesteps, s)` returning a JS number array. Construct timesteps with tf.range, compute the cosine schedule alpha_bar(t) = cos(((t/T + s)/(1+s)) * pi/2)^2 with vectorized tf ops, then return arraySync()."
starterCode: |
  function cosineAlphaBar(timesteps, s = 0.008) {
    return [];
  }
solutionCode: |
  function cosineAlphaBar(timesteps, s = 0.008) {
    const t = tf.range(0, timesteps);
    const angle = t.div(timesteps).add(s).div(1 + s).mul(Math.PI / 2);
    const alphaBar = angle.cos().square();
    return alphaBar.arraySync();
  }
testCode: |
  describe('cosineAlphaBar (vectorized tf ops)', () => {
    it('returns correct length', () => {
      expect(cosineAlphaBar(100).length).toBe(100);
    });
    it('starts near 1', () => {
      const r = cosineAlphaBar(100);
      expect(r[0]).toBeGreaterThan(0.99);
    });
    it('ends near 0', () => {
      const r = cosineAlphaBar(100);
      expect(r[99]).toBeLessThan(0.01);
    });
    it('is monotonically decreasing', () => {
      const r = cosineAlphaBar(50);
      for (let i = 1; i < r.length; i++) expect(r[i]).toBeLessThan(r[i - 1]);
    });
    it('midpoint preserves roughly half signal', () => {
      const r = cosineAlphaBar(100);
      expect(r[50]).toBeGreaterThan(0.3);
      expect(r[50]).toBeLessThan(0.7);
    });
  });
estimatedMinutes: 10
difficulty: intermediate
