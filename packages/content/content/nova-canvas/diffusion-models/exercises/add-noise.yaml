title: "Add Noise to an Image Tensor"
instructions: "Write a function that adds Gaussian noise to an image tensor at a given timestep. The function takes an image tensor, a noise tensor, and a noise level (0 to 1). Return the blended result: image * (1 - noiseLevel) + noise * noiseLevel."
