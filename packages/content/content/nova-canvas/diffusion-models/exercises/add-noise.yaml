solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function applyForwardNoise(
    image: tf.Tensor4D,
    noise: tf.Tensor4D,
    alphaBar: number
  ): tf.Tensor4D {
    const signalScale = Math.sqrt(alphaBar);
    const noiseScale = Math.sqrt(1 - alphaBar);
    const signalPart = tf.mul(image, tf.scalar(signalScale));
    const noisePart = tf.mul(noise, tf.scalar(noiseScale));
    return tf.add(signalPart, noisePart) as tf.Tensor4D;
  }
testCode: |
  describe('applyForwardNoise (DDPM x_t = √ᾱ·x_0 + √(1-ᾱ)·ε)', () => {
    it('alphaBar=1 returns the clean image (no noise yet)', () => {
      const image = tf.ones([1, 4, 4, 3]) as tf.Tensor4D;
      const noise = tf.fill([1, 4, 4, 3], 0.5) as tf.Tensor4D;
      const result = applyForwardNoise(image, noise, 1);
      const data = result.dataSync();
      expect(data[0]).toBeCloseTo(1.0, 4);
    });
    it('alphaBar=0 returns pure noise', () => {
      const image = tf.ones([1, 4, 4, 3]) as tf.Tensor4D;
      const noise = tf.fill([1, 4, 4, 3], 0.5) as tf.Tensor4D;
      const result = applyForwardNoise(image, noise, 0);
      const data = result.dataSync();
      expect(data[0]).toBeCloseTo(0.5, 4);
    });
    it('alphaBar=0.5 uses sqrt(0.5) scaling on both signal and noise', () => {
      const image = tf.fill([1, 4, 4, 3], 1.0) as tf.Tensor4D;
      const noise = tf.fill([1, 4, 4, 3], 0.0) as tf.Tensor4D;
      const result = applyForwardNoise(image, noise, 0.5);
      const data = result.dataSync();
      expect(data[0]).toBeCloseTo(Math.sqrt(0.5), 4);
    });
    it('preserves variance for unit-variance signal + standard normal noise', async () => {
      const image = tf.randomNormal([1, 32, 32, 3]) as tf.Tensor4D;
      const noise = tf.randomNormal([1, 32, 32, 3]) as tf.Tensor4D;
      const result = applyForwardNoise(image, noise, 0.3);
      const variance = (await result.sub(result.mean()).square().mean().array()) as number;
      // E[x_t²] = alphaBar * E[x_0²] + (1 - alphaBar) * E[ε²] ≈ 1
      expect(variance).toBeGreaterThan(0.7);
      expect(variance).toBeLessThan(1.3);
    });
    it('returns correct shape', () => {
      const image = tf.ones([1, 8, 8, 3]) as tf.Tensor4D;
      const noise = tf.zeros([1, 8, 8, 3]) as tf.Tensor4D;
      const result = applyForwardNoise(image, noise, 0.3);
      expect(result.shape).toEqual([1, 8, 8, 3]);
    });
  });
