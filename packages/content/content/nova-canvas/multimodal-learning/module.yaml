slug: multimodal-learning
title: "Multimodal Learning"
worldId: nova-canvas
order: 7
description: |
  The midpoint breakthrough. MUSE generates its first image from the text prompt
  "a sunset over a digital city." Rough, but recognizable. Getting there takes
  models that understand more than one kind of data: vision-language models,
  cross-modal embeddings, image captioning, and finally text-to-image, where
  the captioning pipeline runs in reverse.
