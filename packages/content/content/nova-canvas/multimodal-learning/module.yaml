description: |
  The midpoint breakthrough. MUSE generates its first image from the text prompt
  "a sunset over a digital city." Rough, but recognizable. You'll build models
  that understand multiple data types — vision-language models, cross-modal
  embeddings, image captioning, and text-to-image generation. Multimodal is
  full-stack: frontend, backend, and database working as one system.
