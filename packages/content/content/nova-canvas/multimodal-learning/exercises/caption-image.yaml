solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  async function generateCaption(
    decoder: tf.LayersModel,
    context: tf.Tensor2D,
    vocab: string[],
    maxLen: number = 15
  ): Promise<string> {
    const words: string[] = [];
    let currentWordIdx = vocab.indexOf('<start>');

    for (let i = 0; i < maxLen; i++) {
      const wordTensor = tf.tensor2d([[currentWordIdx]]);
      const prediction = decoder.predict([wordTensor, context]) as tf.Tensor2D;
      const nextIdx = prediction.argMax(1).dataSync()[0];
      const nextWord = vocab[nextIdx];

      wordTensor.dispose();
      prediction.dispose();

      if (nextWord === '<end>') break;
      words.push(nextWord);
      currentWordIdx = nextIdx;
    }

    return words.join(' ');
  }
testCode: |
  describe('generateCaption', () => {
    it('returns a string', async () => {
      const vocab = ['<pad>', '<start>', '<end>', 'a', 'sunset', 'city'];
      // Mock decoder that always predicts index 3 ('a') then 5 ('city') then 2 ('<end>')
      const wordInput = tf.input({ shape: [1], name: 'word' });
      const ctxInput = tf.input({ shape: [8], name: 'ctx' });
      // wordInput and ctxInput are both rank-2 (batch, features). Real TFJS
      // flatten layer requires min_ndim=3, so concatenate them directly.
      const concat = tf.layers.concatenate().apply([
        wordInput,
        ctxInput
      ]) as tf.SymbolicTensor;
      const output = tf.layers.dense({ units: vocab.length, activation: 'softmax' }).apply(concat) as tf.SymbolicTensor;
      const decoder = tf.model({ inputs: [wordInput, ctxInput], outputs: output });
      const context = tf.zeros([1, 8]) as tf.Tensor2D;
      const caption = await generateCaption(decoder, context, vocab, 5);
      expect(typeof caption).toBe('string');
    });
    it('respects maxLen', async () => {
      const vocab = ['<pad>', '<start>', 'word1', 'word2', 'word3'];
      const wordInput = tf.input({ shape: [1], name: 'word' });
      const ctxInput = tf.input({ shape: [4], name: 'ctx' });
      // wordInput and ctxInput are both rank-2 (batch, features). Real TFJS
      // flatten layer requires min_ndim=3, so concatenate them directly.
      const concat = tf.layers.concatenate().apply([
        wordInput,
        ctxInput
      ]) as tf.SymbolicTensor;
      const output = tf.layers.dense({ units: vocab.length, activation: 'softmax' }).apply(concat) as tf.SymbolicTensor;
      const decoder = tf.model({ inputs: [wordInput, ctxInput], outputs: output });
      const context = tf.zeros([1, 4]) as tf.Tensor2D;
      const caption = await generateCaption(decoder, context, vocab, 3);
      const wordCount = caption.split(' ').filter(w => w.length > 0).length;
      expect(wordCount).toBeLessThanOrEqual(3);
    });
  });
