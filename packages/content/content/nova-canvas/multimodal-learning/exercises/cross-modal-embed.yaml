solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function buildProjectionHead(inputDim: number, outputDim: number): tf.LayersModel {
    const input = tf.input({ shape: [inputDim] });
    let x = tf.layers.dense({
      units: outputDim, activation: 'relu'
    }).apply(input) as tf.SymbolicTensor;
    x = tf.layers.dense({
      units: outputDim, activation: 'linear'
    }).apply(x) as tf.SymbolicTensor;
    const normalized = tf.layers.layerNormalization().apply(x) as tf.SymbolicTensor;
    return tf.model({ inputs: input, outputs: normalized });
  }
testCode: |
  describe('buildProjectionHead', () => {
    it('maps inputDim to outputDim', () => {
      const model = buildProjectionHead(512, 256);
      expect(model.inputShape).toEqual([null, 512]);
      expect(model.outputShape).toEqual([null, 256]);
    });
    it('produces normalized outputs', () => {
      const model = buildProjectionHead(64, 32);
      const input = tf.randomUniform([4, 64]);
      const output = model.predict(input) as tf.Tensor;
      expect(output.shape).toEqual([4, 32]);
    });
    it('works with different dimensions', () => {
      const model = buildProjectionHead(128, 64);
      const input = tf.randomNormal([2, 128]);
      const output = model.predict(input) as tf.Tensor;
      expect(output.shape).toEqual([2, 64]);
    });
  });
