slug: cross-modal-embed
lessonSlug: cross-modal-embeddings
title: "Build a Cross-Modal Projection Head"
instructions: "Build `projectToShared(vector, projectionMatrix)` that takes a per-modality vector (shape [d_in]) and projects it to a shared embedding space (shape [d_out]) via matrix multiplication. Then build `crossModalSimilarity(textVec, imageVec, textProj, imageProj)` that projects both and returns cosine similarity."
mlContent: data
starterCode: |
  function projectToShared(vector, projectionMatrix) {
    return null;
  }
  function crossModalSimilarity(textVec, imageVec, textProj, imageProj) {
    return 0;
  }
solutionCode: |
  function projectToShared(vector, projectionMatrix) {
    const reshaped = vector.reshape([1, vector.shape[0]]);
    const projected = tf.matMul(reshaped, projectionMatrix);
    return projected.squeeze();
  }
  function crossModalSimilarity(textVec, imageVec, textProj, imageProj) {
    const t = projectToShared(textVec, textProj);
    const i = projectToShared(imageVec, imageProj);
    const dot = tf.dot(t, i);
    const cos = dot.div(tf.norm(t).mul(tf.norm(i)));
    return cos.dataSync()[0];
  }
testCode: |
  describe('projectToShared (real tf.matMul)', () => {
    it('projects to specified output dimension', () => {
      const v = tf.tensor1d([1, 2, 3]);
      const W = tf.randomNormal([3, 5]);
      const out = projectToShared(v, W);
      expect(out.shape).toEqual([5]);
    });
  });

  describe('crossModalSimilarity', () => {
    it('aligned projections produce high similarity', () => {
      const text = tf.tensor1d([1, 0]);
      const image = tf.tensor1d([1, 0]);
      const sameProj = tf.eye(2);
      const sim = crossModalSimilarity(text, image, sameProj, sameProj);
      expect(sim).toBeCloseTo(1, 4);
    });

    it('orthogonal projections yield low similarity', () => {
      const text = tf.tensor1d([1, 0]);
      const image = tf.tensor1d([0, 1]);
      const sameProj = tf.eye(2);
      const sim = crossModalSimilarity(text, image, sameProj, sameProj);
      expect(sim).toBeCloseTo(0, 4);
    });
  });
