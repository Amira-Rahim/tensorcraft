title: "Build Parallel Encoders for Text and Images"
instructions: "Build two encoders that produce embeddings of the same dimensionality. The image encoder takes [64, 64, 3] input, uses conv2d + globalAveragePooling2d + dense. The text encoder takes [32] input (token indices), uses embedding + globalAveragePooling1d + dense. Both output vectors of size embeddingDim."
