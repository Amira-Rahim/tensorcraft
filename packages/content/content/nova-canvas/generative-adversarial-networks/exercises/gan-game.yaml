solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function generator(noiseDim: number): tf.Tensor1D {
    return tf.randomNormal([noiseDim]) as tf.Tensor1D;
  }

  async function discriminator(
    data: tf.Tensor1D,
    realMean: number,
    realStd: number
  ): Promise<number> {
    const dataMean = (await data.mean().array()) as number;
    const diff = dataMean - realMean;
    const score = Math.exp(-(diff * diff) / (2 * realStd * realStd));
    return score;
  }
testCode: |
  describe('generator', () => {
    it('returns a 1D tensor of correct size', () => {
      const result = generator(10);
      expect(result.shape).toEqual([10]);
    });
  });
  describe('discriminator', () => {
    it('scores data near the mean highly', async () => {
      const nearMean = tf.tensor1d([5.0, 5.1, 4.9, 5.0, 5.1]);
      const score = await discriminator(nearMean, 5.0, 1.0);
      expect(score).toBeGreaterThan(0.9);
    });
    it('scores data far from the mean low', async () => {
      const farAway = tf.tensor1d([100, 101, 99, 100, 102]);
      const score = await discriminator(farAway, 5.0, 1.0);
      expect(score).toBeLessThan(0.01);
    });
  });
