slug: contrastive-pairs
lessonSlug: contrastive-learning
title: "Contrastive Loss Over a Batch of Pairs"
mlContent: training
instructions: "Build `contrastiveLoss(anchor, positive, negatives, temperature = 0.07)` that computes the InfoNCE-style contrastive loss: similarity(anchor, positive) should be high; similarity to negatives should be low. Inputs are 1D tensors of equal dim. Use cosine similarity scaled by temperature, then -log(softmax) over [pos, ...negs]."
starterCode: |
  function contrastiveLoss(anchor, positive, negatives, temperature = 0.07) {
    return 0;
  }
solutionCode: |
  function contrastiveLoss(anchor, positive, negatives, temperature = 0.07) {
    const allCandidates = tf.stack([positive, ...negatives]);
    const anchorRow = anchor.reshape([1, anchor.shape[0]]);
    const dots = tf.matMul(anchorRow, allCandidates, false, true).squeeze();
    const anchorNorm = tf.norm(anchor);
    const candidateNorms = allCandidates.norm('euclidean', 1);
    const sims = dots.div(anchorNorm.mul(candidateNorms));
    const logits = sims.div(tf.scalar(temperature));
    const probs = tf.softmax(logits);
    const positiveProb = probs.dataSync()[0];
    return -Math.log(Math.max(positiveProb, 1e-9));
  }
testCode: |
  describe('contrastiveLoss (real tf.matMul + softmax)', () => {
    it('low loss when positive aligns and negatives differ', () => {
      const anchor = tf.tensor1d([1, 0]);
      const positive = tf.tensor1d([1, 0]);
      const negatives = [tf.tensor1d([0, 1]), tf.tensor1d([-1, 0])];
      const loss = contrastiveLoss(anchor, positive, negatives);
      expect(loss).toBeLessThan(1);
    });
    it('high loss when positive misaligns', () => {
      const anchor = tf.tensor1d([1, 0]);
      const positive = tf.tensor1d([-1, 0]);   // far from anchor
      const negatives = [tf.tensor1d([1, 0])];
      const loss = contrastiveLoss(anchor, positive, negatives);
      expect(loss).toBeGreaterThan(1);
    });
  });
estimatedMinutes: 18
