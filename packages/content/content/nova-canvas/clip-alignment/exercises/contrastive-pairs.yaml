solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function contrastiveLogits(
    imageEmbeddings: tf.Tensor2D,
    textEmbeddings: tf.Tensor2D,
    temperature: number
  ): tf.Tensor2D {
    const similarities = tf.matMul(imageEmbeddings, textEmbeddings, false, true);
    return tf.div(similarities, tf.scalar(temperature)) as tf.Tensor2D;
  }
testCode: |
  describe('contrastiveLogits', () => {
    it('returns correct shape', () => {
      const imgs = tf.randomNormal([4, 8]) as tf.Tensor2D;
      const txts = tf.randomNormal([4, 8]) as tf.Tensor2D;
      const logits = contrastiveLogits(imgs, txts, 0.07);
      expect(logits.shape).toEqual([4, 4]);
    });
    it('scales by temperature', () => {
      const a = tf.tensor2d([[1, 0]]);
      const b = tf.tensor2d([[1, 0]]);
      const logits1 = contrastiveLogits(a, b, 1.0);
      const logits2 = contrastiveLogits(a, b, 0.1);
      expect(logits2.dataSync()[0]).toBeCloseTo(logits1.dataSync()[0] * 10, 3);
    });
    it('diagonal has highest values for matched pairs', () => {
      const imgs = tf.eye(4) as tf.Tensor2D;
      const txts = tf.eye(4) as tf.Tensor2D;
      const logits = contrastiveLogits(imgs, txts, 0.07);
      const data = logits.arraySync() as number[][];
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          if (i === j) {
            expect(data[i][j]).toBeGreaterThan(data[i][(j + 1) % 4]);
          }
        }
      }
    });
  });
