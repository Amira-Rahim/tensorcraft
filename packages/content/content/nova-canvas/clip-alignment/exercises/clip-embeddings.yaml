solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function buildNormalizedImageEncoder(embeddingDim: number): tf.LayersModel {
    const input = tf.input({ shape: [32, 32, 3] });
    let x = tf.layers.conv2d({
      filters: 32, kernelSize: 3, strides: 2, padding: 'same', activation: 'relu'
    }).apply(input) as tf.SymbolicTensor;
    x = tf.layers.globalAveragePooling2d({}).apply(x) as tf.SymbolicTensor;
    const output = tf.layers.dense({ units: embeddingDim }).apply(x) as tf.SymbolicTensor;
    return tf.model({ inputs: input, outputs: output });
  }

  function buildNormalizedTextEncoder(embeddingDim: number): tf.LayersModel {
    const input = tf.input({ shape: [16] });
    let x = tf.layers.embedding({
      inputDim: 5000, outputDim: 32
    }).apply(input) as tf.SymbolicTensor;
    x = tf.layers.globalAveragePooling1d({}).apply(x) as tf.SymbolicTensor;
    const output = tf.layers.dense({ units: embeddingDim }).apply(x) as tf.SymbolicTensor;
    return tf.model({ inputs: input, outputs: output });
  }

  function encodeAndNormalize(model: tf.LayersModel, input: tf.Tensor): tf.Tensor2D {
    const raw = model.predict(input) as tf.Tensor2D;
    return tf.div(raw, tf.norm(raw, 2, 1, true)) as tf.Tensor2D;
  }
testCode: |
  describe('buildNormalizedImageEncoder', () => {
    it('outputs correct embedding dim', () => {
      const model = buildNormalizedImageEncoder(128);
      expect(model.outputShape).toEqual([null, 128]);
    });
  });
  describe('buildNormalizedTextEncoder', () => {
    it('outputs correct embedding dim', () => {
      const model = buildNormalizedTextEncoder(128);
      expect(model.outputShape).toEqual([null, 128]);
    });
  });
  describe('encodeAndNormalize', () => {
    it('produces unit-length vectors', () => {
      const model = buildNormalizedImageEncoder(64);
      const input = tf.randomUniform([2, 32, 32, 3]);
      const emb = encodeAndNormalize(model, input);
      const norms = tf.norm(emb, 2, 1).dataSync();
      expect(norms[0]).toBeCloseTo(1.0, 3);
      expect(norms[1]).toBeCloseTo(1.0, 3);
    });
  });
