solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function clipGuidanceStep(
    image: tf.Tensor4D,
    targetEmbedding: tf.Tensor1D,
    clipScoreFn: (img: tf.Tensor) => tf.Scalar,
    guidanceStrength: number
  ): tf.Tensor4D {
    const gradFn = tf.grad(clipScoreFn);
    const gradient = gradFn(image) as tf.Tensor4D;
    const nudge = tf.mul(gradient, tf.scalar(guidanceStrength));
    const guided = tf.add(image, nudge) as tf.Tensor4D;
    gradient.dispose();
    nudge.dispose();
    return guided;
  }
testCode: |
  describe('clipGuidanceStep', () => {
    it('returns same shape as input', () => {
      const image = tf.randomNormal([1, 8, 8, 3]) as tf.Tensor4D;
      const target = tf.randomNormal([64]) as tf.Tensor1D;
      const scoreFn = (img: tf.Tensor) => tf.sum(img) as tf.Scalar;
      const result = clipGuidanceStep(image, target, scoreFn, 0.01);
      expect(result.shape).toEqual([1, 8, 8, 3]);
    });
    it('produces a tensor with finite values', () => {
      const image = tf.ones([1, 4, 4, 3]) as tf.Tensor4D;
      const target = tf.ones([32]) as tf.Tensor1D;
      const scoreFn = (img: tf.Tensor) => tf.mean(img) as tf.Scalar;
      const result = clipGuidanceStep(image, target, scoreFn, 1.0);
      const data = Array.from(result.dataSync());
      expect(data.every(v => Number.isFinite(v))).toBe(true);
    });
  });
