slug: clip-alignment
title: "CLIP & Alignment"
worldId: nova-canvas
order: 8
description: |
  CLIP gives MUSE nuance: "a melancholy cityscape at twilight" and "a city
  at night" stop producing the same picture. Rohan says mood is a direction
  in a 512-dimensional vector space, and Erdem looks at the first result
  and calls it technically competent, artistically dead. Contrastive
  learning, CLIP architecture, zero-shot classification, and prompt
  engineering, until a typed sentence is the control surface for the
  picture.
lessonCount: 5
prerequisites:
