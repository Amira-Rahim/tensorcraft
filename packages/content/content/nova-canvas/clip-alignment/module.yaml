description: |
  CLIP integration gives MUSE nuance — "a melancholy cityscape at twilight" versus
  "a city at night" produce meaningfully different images. Rohan says mood is a
  direction in a 512-dimensional vector space. But technically perfect output can be
  artistically dead. You'll master contrastive learning, CLIP architecture, zero-shot
  classification, and prompt engineering — the Algolia multi-index search of AI.
