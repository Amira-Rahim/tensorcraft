description: "Samir has shipped ten years of interfaces that only ever displayed data someone else already had. Then MUSE emits 784 pixels of an image that has never existed, out of the same kinds of layers trained against a different loss. This module builds the raw materials of generation (probability distributions, sampling, noise) and ends with your first generator pulling stripes out of static."
