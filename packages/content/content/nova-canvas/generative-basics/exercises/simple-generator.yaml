solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function buildGenerator(): tf.Sequential {
    const model = tf.sequential();
    model.add(tf.layers.dense({ inputShape: [64], units: 256 }));
    model.add(tf.layers.leakyReLU());
    model.add(tf.layers.dense({ units: 512 }));
    model.add(tf.layers.leakyReLU());
    model.add(tf.layers.dense({ units: 784, activation: 'sigmoid' }));
    return model;
  }
testCode: |
  describe('buildGenerator', () => {
    it('returns a sequential model', () => {
      const gen = buildGenerator();
      expect(gen).toBeDefined();
      // Three trainable transforms (interleaved with LeakyReLU activation
      // layers since real TFJS exposes LeakyReLU only as a layer, not as
      // an activation string).
      expect(gen.layers.length).toBe(5);
    });
    it('accepts input shape [null, 64]', () => {
      const gen = buildGenerator();
      expect(gen.inputShape).toEqual([null, 64]);
    });
    it('outputs shape [null, 784]', () => {
      const gen = buildGenerator();
      expect(gen.outputShape).toEqual([null, 784]);
    });
    it('generates output from noise', () => {
      const gen = buildGenerator();
      const noise = tf.randomNormal([1, 64]);
      const output = gen.predict(noise) as tf.Tensor;
      expect(output.shape).toEqual([1, 784]);
    });
  });
