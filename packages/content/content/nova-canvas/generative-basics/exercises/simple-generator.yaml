title: "Build a Simple Generator"
instructions: "Build a generator network using tf.sequential that takes a 64-dimensional noise vector and outputs a 784-dimensional vector (28x28 image). Use two hidden dense layers with leakyReLU activation and a final layer with sigmoid activation."
