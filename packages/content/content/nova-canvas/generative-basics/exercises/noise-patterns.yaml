solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  async function noiseToPattern(noiseDim: number): Promise<number[][]> {
    const noise = tf.randomNormal([1, noiseDim]);
    const layer = tf.layers.dense({ units: 784, activation: 'sigmoid' });
    const output = layer.apply(noise) as tf.Tensor;
    const reshaped = output.reshape([28, 28]);
    return await reshaped.array() as number[][];
  }
testCode: |
  describe('noiseToPattern', () => {
    it('returns a 28x28 array', async () => {
      const pattern = await noiseToPattern(64);
      expect(pattern.length).toBe(28);
      expect(pattern[0].length).toBe(28);
    });
    it('values are between 0 and 1 (sigmoid)', async () => {
      const pattern = await noiseToPattern(64);
      pattern.forEach(row => row.forEach(v => {
        expect(v).toBeGreaterThanOrEqual(0);
        expect(v).toBeLessThanOrEqual(1);
      }));
    });
    it('returns finite numeric output', async () => {
      const pattern = await noiseToPattern(64);
      const flat = pattern.flat();
      expect(flat.length).toBe(784);
      expect(flat.every(v => Number.isFinite(v))).toBe(true);
    });
  });
