description: |
  Yara asks the question that changes everything: "Can the AI paint a photograph
  in the style of Monet? Of Basquiat? Of Yara?" You'll separate content from style,
  build neural style transfer pipelines, and run them in real time in the browser.
  Style transfer is CSS theme switching — swapping visual identity while preserving
  underlying structure.
