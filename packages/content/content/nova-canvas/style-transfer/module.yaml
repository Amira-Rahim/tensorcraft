slug: style-transfer
title: "Style Transfer"
worldId: nova-canvas
order: 6
description: |
  Yara asks whether the AI can paint a photograph in the style of Monet,
  of Basquiat, of her. Answering it means computing a split no one
  labeled, separating what a painting shows from how it shows it, then
  running fast enough that a gallery kiosk restyles a visitor's
  photograph while they are still standing in front of it.
