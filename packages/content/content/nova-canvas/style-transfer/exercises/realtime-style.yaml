solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function residualBlock(
    input: tf.SymbolicTensor,
    filters: number
  ): tf.SymbolicTensor {
    let x = tf.layers.conv2d({
      filters, kernelSize: 3, padding: 'same', activation: 'relu'
    }).apply(input) as tf.SymbolicTensor;
    x = tf.layers.conv2d({
      filters, kernelSize: 3, padding: 'same'
    }).apply(x) as tf.SymbolicTensor;
    return tf.layers.add().apply([input, x]) as tf.SymbolicTensor;
  }
testCode: |
  describe('residualBlock', () => {
    it('preserves spatial dimensions', () => {
      const input = tf.input({ shape: [32, 32, 64] });
      const output = residualBlock(input, 64);
      const model = tf.model({ inputs: input, outputs: output });
      expect(model.outputShape).toEqual([null, 32, 32, 64]);
    });
    it('preserves filter count', () => {
      const input = tf.input({ shape: [16, 16, 128] });
      const output = residualBlock(input, 128);
      const model = tf.model({ inputs: input, outputs: output });
      expect(model.outputShape).toEqual([null, 16, 16, 128]);
    });
    it('produces output with the same rank as input', () => {
      const input = tf.input({ shape: [8, 8, 32] });
      const output = residualBlock(input, 32);
      const model = tf.model({ inputs: input, outputs: output });
      expect(model.outputShape.length).toBe(4);
    });
  });
