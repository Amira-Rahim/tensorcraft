solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function buildVAEEncoder(latentDim: number): tf.LayersModel {
    const input = tf.input({ shape: [784] });
    const hidden = tf.layers.dense({ units: 256, activation: 'relu' }).apply(input);
    const mu = tf.layers.dense({ units: latentDim, name: 'mu' }).apply(hidden) as tf.SymbolicTensor;
    const logVar = tf.layers.dense({ units: latentDim, name: 'logVar' }).apply(hidden) as tf.SymbolicTensor;
    return tf.model({ inputs: input, outputs: [mu, logVar] });
  }
testCode: |
  describe('buildVAEEncoder', () => {
    it('has input shape [null, 784]', () => {
      const enc = buildVAEEncoder(16);
      expect(enc.inputShape).toEqual([null, 784]);
    });
    it('has two output heads declared', () => {
      const enc = buildVAEEncoder(16);
      // The encoder should reference two outputs (mu and logVar).
      expect(enc).toBeDefined();
      expect(enc.outputs.length).toBeGreaterThanOrEqual(1);
    });
  });
