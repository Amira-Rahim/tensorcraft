title: "Build an Autoencoder"
instructions: "Build a complete autoencoder with encoder (784 → 256 → 128 → 16) and decoder (16 → 128 → 256 → 784). Use relu for hidden layers and sigmoid for the final output. Compile with adam optimizer and meanSquaredError loss."
