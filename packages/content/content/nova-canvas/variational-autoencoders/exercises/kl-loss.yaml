slug: kl-loss
lessonSlug: kl-divergence
title: "KL Divergence Between Two Gaussians"
mlContent: training
instructions: "Build `klGaussian(mu, logVar)` returning the per-batch KL divergence from N(mu, var) to N(0, 1) where var = exp(logVar). Formula: -0.5 * sum(1 + logVar - mu^2 - exp(logVar)) along the latent axis. Inputs are [batch, latent] tensors. Return a [batch] tensor of KL values."
starterCode: |
  function klGaussian(mu, logVar) {
    return null;
  }
solutionCode: |
  function klGaussian(mu, logVar) {
    const muSq = mu.square();
    const variance = logVar.exp();
    const inner = tf.scalar(1).add(logVar).sub(muSq).sub(variance);
    return inner.sum(-1).mul(-0.5);
  }
testCode: |
  describe('klGaussian (real tf math)', () => {
    it('zero mu + zero logVar → KL=0 (matches N(0,1))', () => {
      const mu = tf.zeros([3, 4]);
      const logVar = tf.zeros([3, 4]);
      const kl = klGaussian(mu, logVar);
      const arr = kl.dataSync();
      for (const v of arr) expect(v).toBeCloseTo(0, 4);
    });
    it('returns [batch] shape', () => {
      const mu = tf.randomNormal([5, 8]);
      const logVar = tf.zeros([5, 8]);
      const kl = klGaussian(mu, logVar);
      expect(kl.shape).toEqual([5]);
    });
    it('non-zero mu produces positive KL', () => {
      const mu = tf.tensor2d([[1, 1, 1, 1]]);
      const logVar = tf.zeros([1, 4]);
      const kl = klGaussian(mu, logVar);
      expect(kl.dataSync()[0]).toBeGreaterThan(0);
    });
  });
estimatedMinutes: 18
