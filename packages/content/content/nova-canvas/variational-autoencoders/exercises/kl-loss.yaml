solutionCode: |
  import * as tf from '@tensorflow/tfjs';

  function klDivergence(mu: tf.Tensor, logVar: tf.Tensor): tf.Scalar {
    return logVar.add(1).sub(mu.square()).sub(logVar.exp())
      .mul(-0.5)
      .sum(1)
      .mean() as tf.Scalar;
  }

  function vaeLoss(
    original: tf.Tensor,
    reconstructed: tf.Tensor,
    mu: tf.Tensor,
    logVar: tf.Tensor,
    beta: number
  ): tf.Scalar {
    const reconLoss = original.sub(reconstructed).square().sum(1).mean();
    const kl = klDivergence(mu, logVar);
    return reconLoss.add(kl.mul(beta)) as tf.Scalar;
  }
testCode: |
  describe('klDivergence', () => {
    it('returns 0 for standard normal (mu=0, logVar=0)', async () => {
      const mu = tf.zeros([10, 4]);
      const logVar = tf.zeros([10, 4]);
      const kl = await klDivergence(mu, logVar).array();
      expect(Math.abs(kl)).toBeLessThan(0.01);
    });
    it('returns positive value for non-standard distributions', async () => {
      const mu = tf.fill([10, 4], 2.0);
      const logVar = tf.fill([10, 4], 1.0);
      const kl = await klDivergence(mu, logVar).array();
      expect(kl).toBeGreaterThan(0);
    });
  });
  describe('vaeLoss', () => {
    it('returns a scalar', async () => {
      const orig = tf.randomUniform([4, 784]);
      const recon = tf.randomUniform([4, 784]);
      const mu = tf.zeros([4, 16]);
      const logVar = tf.zeros([4, 16]);
      const loss = vaeLoss(orig, recon, mu, logVar, 1.0);
      expect(loss.shape).toEqual([]);
    });
    it('higher beta increases loss for non-standard latent', async () => {
      const orig = tf.randomUniform([4, 784]);
      const mu = tf.fill([4, 16], 3.0);
      const logVar = tf.fill([4, 16], 2.0);
      const loss1 = await vaeLoss(orig, orig, mu, logVar, 0.1).array();
      const loss2 = await vaeLoss(orig, orig, mu, logVar, 10.0).array();
      expect(loss2).toBeGreaterThan(loss1);
    });
  });
