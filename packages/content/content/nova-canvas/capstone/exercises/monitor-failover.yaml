title: "Circuit Breaker"
instructions: "Implement a CircuitBreaker class with three states: closed (normal), open (failing, use fallback), and half-open (testing recovery). The breaker opens after a threshold number of failures and resets after a timeout period. Execute takes an async function and a fallback function."
