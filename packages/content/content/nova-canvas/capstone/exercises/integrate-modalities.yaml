title: "Integrate Modalities"
instructions: "Build a MultiModalOrchestrator that registers named generator modules and runs them all in parallel from a shared input. Each module has a name and an async generate(input) method. The orchestrator's generateAll(input) method should run all registered modules in parallel and return an object mapping module names to their outputs. If any module fails, its entry should be null (use Promise.allSettled)."
