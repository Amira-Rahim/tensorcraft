solutionCode: |
  async function profilePipeline(
    preprocess: () => Promise<void>,
    infer: () => Promise<void>,
    postprocess: () => Promise<void>
  ): Promise<Record<string, number>> {
    const metrics: Record<string, number> = {};
    const stages = [
      { name: 'preprocessing', fn: preprocess },
      { name: 'inference', fn: infer },
      { name: 'postprocessing', fn: postprocess },
    ];
    for (const stage of stages) {
      const startMark = `${stage.name}-start`;
      const endMark = `${stage.name}-end`;
      performance.mark(startMark);
      await stage.fn();
      performance.mark(endMark);
      performance.measure(stage.name, startMark, endMark);
      // performance.getEntriesByName behavior varies across runtimes
      // (some workers return empty); fall back to direct mark math.
      const entries = performance.getEntriesByName(stage.name, 'measure');
      if (entries.length > 0) {
        metrics[stage.name] = entries[entries.length - 1].duration;
      } else {
        const startEntry = performance.getEntriesByName(startMark, 'mark')[0];
        const endEntry = performance.getEntriesByName(endMark, 'mark')[0];
        metrics[stage.name] = (endEntry?.startTime ?? 0) - (startEntry?.startTime ?? 0);
      }
    }
    performance.clearMarks();
    performance.clearMeasures();
    return metrics;
  }
testCode: |
  describe('profilePipeline', () => {
    const delay = (ms) => new Promise(r => setTimeout(r, ms));
    it('measures all stages', async () => {
      const metrics = await profilePipeline(
        () => delay(10), () => delay(20), () => delay(10)
      );
      expect(metrics).toHaveProperty('preprocessing');
      expect(metrics).toHaveProperty('inference');
      expect(metrics).toHaveProperty('postprocessing');
    });
    it('returns numeric durations', async () => {
      const metrics = await profilePipeline(
        () => delay(5), () => delay(5), () => delay(5)
      );
      Object.values(metrics).forEach(v => expect(typeof v).toBe('number'));
    });
  });
