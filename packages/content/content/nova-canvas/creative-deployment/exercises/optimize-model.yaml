title: "Optimize Model Weights"
instructions: "Implement a weight quantization function that takes a Float32Array of model weights, quantizes them to uint8 (0-255) using min-max scaling, then dequantizes back to Float32Array. Return an object with the dequantized weights, the compression info (min, max, scale), and the mean squared error between original and dequantized weights."
