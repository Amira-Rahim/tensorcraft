slug: creative-deployment
title: "Creative Deployment: Scaling Art"
worldId: nova-canvas
order: 10
description: |
  The Biennale is three weeks away. Erdem runs the numbers: 200 people generating
  simultaneously, zero lag tolerance, gallery Wi-Fi that drops packets like confetti.
  You'll profile generation bottlenecks, optimize models with quantization and distillation,
  implement caching strategies with Service Workers, handle concurrent WebSocket connections,
  and architect a physical-digital installation as a PWA.
lessonCount: 5
prerequisites:
  - audio-generation
track: specialization
