slug: creative-deployment
title: "Creative Deployment: Scaling Art"
worldId: nova-canvas
order: 10
description: |
  The Biennale is three weeks away. Erdem runs the numbers: 200 people
  generating at once, on gallery Wi-Fi nobody gets to fix before opening
  night. You'll profile what makes a generation slow, shrink models with
  quantization and distillation, and cache with Service Workers so a
  repeat prompt never hits the model twice. Then you'll hold hundreds of
  concurrent WebSocket connections and ship the installation as an
  offline-first PWA, so the tablets keep painting when the Wi-Fi drops.
lessonCount: 5
prerequisites:
  - audio-generation
track: specialization
