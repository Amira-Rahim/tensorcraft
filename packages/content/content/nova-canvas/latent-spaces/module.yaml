description: "MUSE files a 784-pixel sketch under 16 numbers and redraws it almost perfectly, which raises Yara's question: where did the rest go? This module maps the hidden coordinate system generative models actually work in: how data compresses into it, how many dimensions it needs, what happens when you walk a straight line through it, and how to build an explorer for it."
