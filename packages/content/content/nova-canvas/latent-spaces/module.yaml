slug: latent-spaces
title: "Latent Spaces: The Hidden Dimensions"
worldId: nova-canvas
order: 2
description: "MUSE files a 784-pixel sketch under 16 numbers and redraws it with the linework intact and the paper grain gone, then asks what would go missing at 8. This module maps the hidden coordinate system generative models actually work in: how data compresses into it, how many dimensions it needs, what happens when you walk a straight line through it, whether one axis can move without dragging the others, and how to build an explorer for it."
lessonCount: 5
prerequisites:
  - generative-basics
track: foundations
