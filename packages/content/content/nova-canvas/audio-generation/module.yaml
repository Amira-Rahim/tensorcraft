slug: audio-generation
title: "Audio Generation: Sound from Silence"
worldId: nova-canvas
order: 9
description: |
  The gallery walls pulse with generative visuals, but the room is silent.
  Yara wants the installation to carry as much in its sound as in its picture.
  Rohan finds the way in: a spectrogram is an image, so the generators you have
  already built know how to make one. You'll transform waveforms into tensors,
  synthesize sounds with neural networks, and build interactive soundscapes with
  the Web Audio API.
lessonCount: 5
prerequisites:
  - clip-alignment
track: specialization
