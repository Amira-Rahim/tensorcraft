slug: audio-generation
title: "Audio Generation: Sound from Silence"
worldId: nova-canvas
order: 9
description: |
  The gallery walls pulse with generative visuals, but the room is silent.
  Yara declares sound is not decoration; it is a dimension. Rohan reveals the secret:
  a spectrogram is an image. You already know how to generate images from latent spaces.
  Audio is the same math, different domain. You'll transform waveforms into tensors,
  synthesize sounds with neural networks, and build interactive soundscapes using
  the Web Audio API you already know.
lessonCount: 5
prerequisites:
